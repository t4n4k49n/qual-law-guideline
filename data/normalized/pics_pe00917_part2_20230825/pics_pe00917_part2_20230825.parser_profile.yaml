schema: qai.parser_profile.v1
id: pics_part2_default_v1
title: PIC/S PE 009-17 Part II markers (API GMP)
applies_to:
  family: PICS
  jurisdiction: INTL
  defaults: false
language: en
source_label: PIC/S
preprocess:
  drop_line_regexes:
  - (?i)^\s*PE\s*009-17\s*\(Annexes\)\s*-\s*(?:\d{1,3}|[ivxlcdm]+)\s*-\s*25\s+August\s+2023\s*$
  - ^\s*-\s*(?:\d{1,3}|[ivxlcdm]+)\s*-\s*$
  - (?i)^\s*web\s+site:\s*https?://\S+\s*$
  - (?i)^\s*PE\s*009-17\s*\(Part\s+II\)\s*-\s*(?:\d{1,3}|[ivxlcdm]+)\s*-\s*25\s+August\s+2023\s*$
  - ^\s*_{5,}\s*Introduction\s*$
  strip_inline_regexes:
  - (?i)(?<=\S)\s+PE\s*009-17\s*\(Annexes\)\s*-\s*(?:\d{1,3}|[ivxlcdm]+)\s*-\s*25\s+August\s+2023\s*$
  - (?i)(?<=\S)Annex\s+\d+[A-Z]?\s+[A-Za-z].{0,200}$
  - '[\x00-\x1F]'
  - '[\x00-\x08\x0B\x0C\x0E-\x1F]'
  drop_repeated_structural_headers:
    enabled: true
    kinds:
    - chapter
  merge_structural_heading_continuations:
    enabled: true
    kinds:
    - chapter
    max_next_line_len: 120
    max_merge_lines: 2
    max_blank_lookahead: 2
  skip_blocks:
  - start_regex: (?i)^TABLE OF CONTENTS\s*$
    end_regex: ^1\.\s+INTRODUCTION\s*$
    include_start: false
    include_end: true
    max_lines: 2000
  detect_plaintext_tables:
    enabled: true
    min_rows: 2
    max_rows: 80
    mode: conservative
  pics_part2_table1:
    enabled: true
  extract_notes:
    enabled: true
    max_lines: 40
context_root_kind: chapter
structural_kinds:
- chapter
- section
marker_types:
- id: chapter_num_dot_caps
  kind: chapter
  kind_raw: '1.'
  match: ^(?P<n>\d{1,2})\.\s+(?=[A-Za-z][A-Za-z0-9\s/&,\-\(\)]+\s*$)
  num_group: n
- id: section_one_digit
  kind: section
  kind_raw: '1.1'
  match: ^(?P<n>\d{1,2}\.\d)(?!\d)\s+
  num_group: n
- id: paragraph_two_digits
  kind: paragraph
  kind_raw: '2.19'
  match: ^(?P<n>\d{1,2}\.\d{2})\s+
  num_group: n
- id: item_list_num
  kind: item
  kind_raw: '1.'
  match: ^(?P<n>\d{1,2})\.\s+(?=[A-Za-z])
  num_group: n
- id: bullet
  kind: subitem
  kind_raw: 
  match: ^\s*[•]\s+
structure:
  root:
    children:
    - chapter
  chapter:
    children:
    - section
    - paragraph
    - item
    - subitem
    - table
    - preformatted
    - note
    - history
  section:
    children:
    - paragraph
    - item
    - subitem
    - table
    - preformatted
    - note
    - history
  paragraph:
    children:
    - item
    - subitem
    - table
    - note
    - history
  item:
    children:
    - subitem
    - table
    - note
    - history
  subitem:
    children:
    - note
    - history
  table:
    children:
    - table_header
    - note
  table_header:
    children:
    - table_row
  table_row:
    children: []
  preformatted:
    children:
    - note
  note:
    children: []
  history:
    children: []
compound_prefix:
  enabled: false
  max_depth: 1
