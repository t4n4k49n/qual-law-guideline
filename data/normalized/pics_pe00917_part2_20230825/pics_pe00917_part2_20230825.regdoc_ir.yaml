        children: []
      - nid: cha11.sec11_1.p11_17
        kind: paragraph
        kind_raw: '11.17'
        num: '11.17'
        ord: 356
        heading: null
        text: Primary reference standards should be obtained as appropriate for the manufacture of APIs. The source of each primary reference standard should be documented. Records should be maintained of each primary reference standard’s storage and use in accordance with the supplier’s recommendations. Primary reference standards obtained from an officially recognised source are normally used without testing if stored under conditions consistent with the supplier’s recommendations.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1690
        - source_label: PIC/S
          locator: line:1691
        - source_label: PIC/S
          locator: line:1692
        - source_label: PIC/S
          locator: line:1693
        - source_label: PIC/S
          locator: line:1694
        - source_label: PIC/S
          locator: line:1695
        - source_label: PIC/S
          locator: line:1696
        children: []
      - nid: cha11.sec11_1.p11_18
        kind: paragraph
        kind_raw: '11.18'
        num: '11.18'
        ord: 357
        heading: null
        text: "Where a primary reference standard is not available from an officially recognized source, an “in-house primary standard” should be established. Appropriate\n                                                                      Laboratory Controls\ntesting should be performed to establish fully the identity and purity of the primary reference standard. Appropriate documentation of this testing should be maintained."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1698
        - source_label: PIC/S
          locator: line:1699
        - source_label: PIC/S
          locator: line:1704
        - source_label: PIC/S
          locator: line:1708
        - source_label: PIC/S
          locator: line:1709
        - source_label: PIC/S
          locator: line:1710
        children: []
      - nid: cha11.sec11_1.p11_19
        kind: paragraph
        kind_raw: '11.19'
        num: '11.19'
        ord: 358
        heading: null
        text: Secondary reference standards should be appropriately prepared, identified, tested, approved, and stored. The suitability of each batch of secondary reference standard should be determined prior to first use by comparing against a primary reference standard. Each batch of secondary reference standard should be periodically requalified in accordance with a written protocol.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
