      source_spans:
      - source_label: PIC/S
        locator: line:2016
      children:
      - nid: cha12.sec12_7.p12_70
        kind: paragraph
        kind_raw: '12.70'
        num: '12.70'
        ord: 421
        heading: null
        text: Cleaning procedures should normally be validated. In general, cleaning validation should be directed to situations or process steps where contamination or carryover of materials poses the greatest risk to API quality. For example, in early production it may be unnecessary to validate equipment cleaning procedures where residues are removed by subsequent purification steps.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2018
        - source_label: PIC/S
          locator: line:2019
        - source_label: PIC/S
          locator: line:2020
        - source_label: PIC/S
          locator: line:2021
        - source_label: PIC/S
          locator: line:2022
        children: []
      - nid: cha12.sec12_7.p12_71
        kind: paragraph
        kind_raw: '12.71'
        num: '12.71'
        ord: 422
        heading: null
        text: Validation of cleaning procedures should reflect actual equipment usage patterns. If various APIs or intermediates are manufactured in the same equipment and the equipment is cleaned by the same process, a representative intermediate or API can be selected for cleaning validation. This selection should be based on the solubility and difficulty of cleaning and the calculation of residue limits based on potency, toxicity, and stability.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2024
        - source_label: PIC/S
          locator: line:2025
        - source_label: PIC/S
          locator: line:2026
        - source_label: PIC/S
          locator: line:2027
        - source_label: PIC/S
          locator: line:2028
        - source_label: PIC/S
          locator: line:2029
        children: []
      - nid: cha12.sec12_7.p12_72
        kind: paragraph
        kind_raw: '12.72'
        num: '12.72'
        ord: 423
        heading: null
        text: The cleaning validation protocol should describe the equipment to be cleaned, procedures, materials, acceptable cleaning levels, parameters to be monitored and controlled, and analytical methods. The protocol should also indicate the type of samples to be obtained and how they are collected and labelled.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2031
        - source_label: PIC/S
          locator: line:2032
        - source_label: PIC/S
          locator: line:2033
        - source_label: PIC/S
          locator: line:2034
        children: []
      - nid: cha12.sec12_7.p12_73
        kind: paragraph
        kind_raw: '12.73'
        num: '12.73'
        ord: 424
        heading: null
        text: Sampling should include swabbing, rinsing, or alternative methods (e.g., direct extraction), as appropriate, to detect both insoluble and soluble residues. The sampling methods used should be capable of quantitatively measuring levels of residues remaining on the equipment surfaces after cleaning. Swab sampling may be impractical when product contact surfaces are not easily accessible due to equipment design and/or process limitations (e.g., inner surfaces of hoses, transfer pipes, reactor tanks with small ports or handling toxic materials, and small intricate equipment such as micronizers and microfluidizers).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
