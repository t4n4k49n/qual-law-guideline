        ord: 106
        heading: null
        text: Adequate ventilation, air filtration and exhaust systems should be provided, where appropriate. These systems should be designed and constructed to minimise risks of contamination and cross-contamination and should include equipment for control of air pressure, microorganisms (if appropriate), dust, humidity, and temperature, as appropriate to the stage of manufacture. Particular attention should be given to areas where APIs are exposed to the environment.
