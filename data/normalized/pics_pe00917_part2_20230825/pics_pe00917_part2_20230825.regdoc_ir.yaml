      children:
      - nid: cha12.sec12_5.p12_50
        kind: paragraph
        kind_raw: '12.50'
        num: '12.50'
        ord: 415
        heading: null
        text: The number of process runs for validation should depend on the complexity of the process or the magnitude of the process change being considered. For prospective and concurrent validation, three consecutive successful production batches should be used as a guide, but there may be situations where additional process runs are warranted to prove consistency of the process (e.g., complex API processes or API processes with prolonged completion times). For retrospective validation, generally data from ten to thirty consecutive batches should be examined to assess process consistency, but fewer batches can be examined if justified.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1981
        - source_label: PIC/S
          locator: line:1982
        - source_label: PIC/S
          locator: line:1983
        - source_label: PIC/S
          locator: line:1984
        - source_label: PIC/S
          locator: line:1985
        - source_label: PIC/S
          locator: line:1986
        - source_label: PIC/S
          locator: line:1987
        - source_label: PIC/S
          locator: line:1988
        - source_label: PIC/S
          locator: line:1989
        children: []
      - nid: cha12.sec12_5.p12_51
        kind: paragraph
        kind_raw: '12.51'
        num: '12.51'
        ord: 416
        heading: null
        text: Critical process parameters should be controlled and monitored during process validation studies. Process parameters unrelated to quality, such as variables controlled to minimize energy consumption or equipment use, need not be included in the process validation.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
