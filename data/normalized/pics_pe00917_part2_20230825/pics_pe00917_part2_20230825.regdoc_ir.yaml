        kind: paragraph
        kind_raw: '7.33'
        num: '7.33'
        ord: 261
        heading: null
        text: Samples should be representative of the batch of material from which they are taken. Sampling methods should specify the number of containers to be sampled, which part of the container to sample, and the amount of material to be taken from each container. The number of containers to sample and the sample size should be based upon a sampling plan that takes into consideration the criticality of the material, material variability, past quality history of the supplier, and the quantity needed for analysis.
