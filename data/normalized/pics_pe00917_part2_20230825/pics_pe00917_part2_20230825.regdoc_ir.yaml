      children:
      - nid: cha18.sec18_3.p18_30
        kind: paragraph
        kind_raw: '18.30'
        num: '18.30'
        ord: 547
        heading: null
        text: Where aseptic addition of cell substrates, media, buffers, and gases is needed, closed or contained systems should be used where possible. If the inoculation of the initial vessel or subsequent transfers or additions (media, buffers) are performed in open vessels, there should be controls and procedures in place to minimize the risk of contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2535
        - source_label: PIC/S
          locator: line:2536
        - source_label: PIC/S
          locator: line:2537
        - source_label: PIC/S
          locator: line:2538
        - source_label: PIC/S
          locator: line:2539
        children: []
      - nid: cha18.sec18_3.p18_31
        kind: paragraph
        kind_raw: '18.31'
        num: '18.31'
        ord: 548
        heading: null
        text: Where the quality of the API can be affected by microbial contamination, manipulations using open vessels should be performed in a biosafety cabinet or similarly controlled environment.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2541
        - source_label: PIC/S
          locator: line:2542
        - source_label: PIC/S
          locator: line:2543
        children: []
      - nid: cha18.sec18_3.p18_32
        kind: paragraph
        kind_raw: '18.32'
        num: '18.32'
        ord: 549
        heading: null
        text: Personnel should be appropriately gowned and take special precautions handling the cultures.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2545
        - source_label: PIC/S
          locator: line:2546
        children: []
      - nid: cha18.sec18_3.p18_33
        kind: paragraph
        kind_raw: '18.33'
        num: '18.33'
        ord: 550
        heading: null
        text: Critical operating parameters (for example temperature, pH, agitation rates, addition of gases, pressure) should be monitored to ensure consistency with the established process. Cell growth, viability (for most cell culture processes), and, where appropriate, productivity should also be monitored. Critical parameters will vary from one process to another, and for classical fermentation, certain parameters (cell viability, for example) may not need to be monitored.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2548
        - source_label: PIC/S
          locator: line:2549
        - source_label: PIC/S
          locator: line:2550
        - source_label: PIC/S
          locator: line:2551
        - source_label: PIC/S
          locator: line:2552
        - source_label: PIC/S
          locator: line:2553
        children: []
      - nid: cha18.sec18_3.p18_34
        kind: paragraph
        kind_raw: '18.34'
        num: '18.34'
        ord: 551
        heading: null
        text: Cell culture equipment should be cleaned and sterilized after use. As appropriate, fermentation equipment should be cleaned, and sanitized or sterilized.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2555
        - source_label: PIC/S
          locator: line:2556
        - source_label: PIC/S
          locator: line:2557
        children: []
      - nid: cha18.sec18_3.p18_35
        kind: paragraph
        kind_raw: '18.35'
        num: '18.35'
        ord: 552
        heading: null
        text: Culture media should be sterilized before use when appropriate to protect the quality of the API.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2559
        - source_label: PIC/S
          locator: line:2560
        children: []
      - nid: cha18.sec18_3.p18_36
        kind: paragraph
        kind_raw: '18.36'
        num: '18.36'
        ord: 553
        heading: null
        text: "There should be appropriate procedures in place to detect contamination and determine the course of action to be taken. This should include procedures to determine the impact of the contamination on the product and those to decontaminate the equipment and return it to a condition to be used in\n      subsequent batches.      Foreign organisms observed during fermentation\nprocesses should be identified as appropriate and the effect of their presence on product quality should be assessed, if necessary. The results of such assessments should be taken into consideration in the disposition of the material produced."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2562
        - source_label: PIC/S
          locator: line:2563
        - source_label: PIC/S
          locator: line:2564
        - source_label: PIC/S
          locator: line:2565
        - source_label: PIC/S
          locator: line:2566
        - source_label: PIC/S
          locator: line:2567
        - source_label: PIC/S
          locator: line:2568
        - source_label: PIC/S
          locator: line:2569
        - source_label: PIC/S
          locator: line:2570
        children: []
      - nid: cha18.sec18_3.p18_37
        kind: paragraph
        kind_raw: '18.37'
        num: '18.37'
        ord: 554
        heading: null
        text: Records of contamination events should be maintained.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2572
        children: []
      - nid: cha18.sec18_3.p18_38
        kind: paragraph
        kind_raw: '18.38'
        num: '18.38'
        ord: 555
        heading: null
        text: "Shared (multi-product) equipment may warrant additional testing after cleaning between product campaigns, as appropriate, to minimize the risk of cross-contamination.\n                                                           APIs for Use in Clinical Trials"
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
