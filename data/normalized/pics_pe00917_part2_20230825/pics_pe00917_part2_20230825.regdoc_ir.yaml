      source_spans:
      - source_label: PIC/S
        locator: line:2147
      children:
      - nid: cha14.sec14_1.p14_10
        kind: paragraph
        kind_raw: '14.10'
        num: '14.10'
        ord: 444
        heading: null
        text: Intermediates and APIs failing to meet established specifications should be identified as such and quarantined. These intermediates or APIs can be reprocessed or reworked as described below. The final disposition of rejected materials should be recorded.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2149
        - source_label: PIC/S
          locator: line:2150
        - source_label: PIC/S
          locator: line:2151
        - source_label: PIC/S
          locator: line:2152
        children: []
    - nid: cha14.sec14_2
      kind: section
      kind_raw: '14.2'
      num: '14.2'
      ord: 445
      heading: Reprocessing
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2154
      children:
      - nid: cha14.sec14_2.p14_20
        kind: paragraph
        kind_raw: '14.20'
        num: '14.20'
        ord: 446
        heading: null
        text: Introducing an intermediate or API, including one that does not conform to standards or specifications, back into the process and reprocessing by repeating a crystallization step or other appropriate chemical or physical manipulation steps (e.g., distillation, filtration, chromatography, milling) that are part of the established manufacturing process is generally considered acceptable. However, if such reprocessing is used for a majority of batches, such reprocessing should be included as part of the standard manufacturing process.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2156
        - source_label: PIC/S
          locator: line:2157
        - source_label: PIC/S
          locator: line:2158
        - source_label: PIC/S
          locator: line:2159
        - source_label: PIC/S
          locator: line:2160
        - source_label: PIC/S
          locator: line:2161
        - source_label: PIC/S
          locator: line:2162
        children: []
      - nid: cha14.sec14_2.p14_21
        kind: paragraph
        kind_raw: '14.21'
        num: '14.21'
        ord: 447
        heading: null
        text: Continuation of a process step after an in-process control test has shown that the step is incomplete is considered to be part of the normal process. This is not considered to be reprocessing.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2164
        - source_label: PIC/S
          locator: line:2165
        - source_label: PIC/S
          locator: line:2166
        children: []
      - nid: cha14.sec14_2.p14_22
        kind: paragraph
        kind_raw: '14.22'
        num: '14.22'
        ord: 448
        heading: null
        text: "Introducing unreacted material back into a process and repeating a chemical reaction is considered to be reprocessing unless it is part of the established process. Such reprocessing should be preceded by careful evaluation to ensure that the quality of the intermediate or API is not adversely impacted due to the potential formation of by-products and over-reacted materials.\n                                                     Rejection and Re-Use of Materials"
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2168
        - source_label: PIC/S
          locator: line:2169
        - source_label: PIC/S
          locator: line:2170
        - source_label: PIC/S
          locator: line:2171
        - source_label: PIC/S
          locator: line:2172
        - source_label: PIC/S
          locator: line:2178
        children: []
    - nid: cha14.sec14_3
      kind: section
      kind_raw: '14.3'
      num: '14.3'
      ord: 449
      heading: Reworking
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2182
      children:
      - nid: cha14.sec14_3.p14_30
        kind: paragraph
        kind_raw: '14.30'
        num: '14.30'
        ord: 450
        heading: null
        text: Before a decision is taken to rework batches that do not conform to established standards or specifications, an investigation into the reason for non-conformance should be performed.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2184
        - source_label: PIC/S
          locator: line:2185
        - source_label: PIC/S
          locator: line:2186
        children: []
      - nid: cha14.sec14_3.p14_31
        kind: paragraph
        kind_raw: '14.31'
        num: '14.31'
        ord: 451
        heading: null
        text: Batches that have been reworked should be subjected to appropriate evaluation, testing, stability testing if warranted, and documentation to show that the reworked product is of equivalent quality to that produced by the original process. Concurrent validation is often the appropriate validation approach for rework procedures. This allows a protocol to define the rework procedure, how it will be carried out, and the expected results. If there is only one batch to be reworked, then a report can be written and the batch released once it is found to be acceptable.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2188
        - source_label: PIC/S
          locator: line:2189
        - source_label: PIC/S
          locator: line:2190
        - source_label: PIC/S
          locator: line:2191
        - source_label: PIC/S
          locator: line:2192
        - source_label: PIC/S
          locator: line:2193
        - source_label: PIC/S
          locator: line:2194
        - source_label: PIC/S
          locator: line:2195
        children: []
      - nid: cha14.sec14_3.p14_32
        kind: paragraph
        kind_raw: '14.32'
        num: '14.32'
        ord: 452
        heading: null
        text: Procedures should provide for comparing the impurity profile of each reworked batch against batches manufactured by the established process. Where routine analytical methods are inadequate to characterize the reworked batch, additional methods should be used.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2197
        - source_label: PIC/S
          locator: line:2198
        - source_label: PIC/S
          locator: line:2199
        - source_label: PIC/S
          locator: line:2200
        children: []
    - nid: cha14.sec14_4
      kind: section
      kind_raw: '14.4'
      num: '14.4'
      ord: 453
      heading: Recovery of Materials and Solvents
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2202
      children:
      - nid: cha14.sec14_4.p14_40
        kind: paragraph
        kind_raw: '14.40'
        num: '14.40'
        ord: 454
        heading: null
        text: Recovery (e.g. from mother liquor or filtrates) of reactants, intermediates, or the API is considered acceptable, provided that approved procedures exist for the recovery and the recovered materials meet specifications suitable for their intended use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2204
        - source_label: PIC/S
          locator: line:2205
        - source_label: PIC/S
          locator: line:2206
        - source_label: PIC/S
          locator: line:2207
        children: []
      - nid: cha14.sec14_4.p14_41
        kind: paragraph
        kind_raw: '14.41'
        num: '14.41'
        ord: 455
        heading: null
        text: Solvents can be recovered and reused in the same processes or in different processes, provided that the recovery procedures are controlled and monitored to ensure that solvents meet appropriate standards before reuse or co-mingling with other approved materials.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2209
        - source_label: PIC/S
          locator: line:2210
        - source_label: PIC/S
          locator: line:2211
        - source_label: PIC/S
          locator: line:2212
        children: []
      - nid: cha14.sec14_4.p14_42
        kind: paragraph
        kind_raw: '14.42'
        num: '14.42'
        ord: 456
        heading: null
        text: Fresh and recovered solvents and reagents can be combined if adequate testing has shown their suitability for all manufacturing processes in which they may be used.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2214
        - source_label: PIC/S
          locator: line:2215
        - source_label: PIC/S
          locator: line:2216
        children: []
      - nid: cha14.sec14_4.p14_43
        kind: paragraph
        kind_raw: '14.43'
        num: '14.43'
        ord: 457
        heading: null
        text: The use of recovered solvents, mother liquors, and other recovered materials should be adequately documented.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2218
        - source_label: PIC/S
          locator: line:2219
        children: []
    - nid: cha14.sec14_5
      kind: section
      kind_raw: '14.5'
      num: '14.5'
      ord: 458
      heading: Returns
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2221
