      source_spans:
      - source_label: PIC/S
        locator: line:2430
      children:
      - nid: cha18.sec18_1.p18_10
        kind: paragraph
        kind_raw: '18.10'
        num: '18.10'
        ord: 525
        heading: null
        text: Section 18 is intended to address specific controls for APIs or intermediates manufactured by cell culture or fermentation using natural or recombinant organisms and that have not been covered adequately in the previous sections. It is not intended to be a stand-alone Section. In general, the GMP principles in the other sections of this document apply. Note that the principles of fermentation for “classical” processes for production of small molecules and for processes using recombinant and non-recombinant organisms for production of proteins and/or polypeptides are the same, although the degree of control will differ. Where practical, this section will address these differences. In general, the degree of control for biotechnological processes used to produce proteins and polypeptides is greater than that for classical fermentation processes.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2432
        - source_label: PIC/S
          locator: line:2433
        - source_label: PIC/S
          locator: line:2434
        - source_label: PIC/S
          locator: line:2435
        - source_label: PIC/S
          locator: line:2436
        - source_label: PIC/S
          locator: line:2437
        - source_label: PIC/S
          locator: line:2438
        - source_label: PIC/S
          locator: line:2439
        - source_label: PIC/S
          locator: line:2440
        - source_label: PIC/S
          locator: line:2441
        - source_label: PIC/S
          locator: line:2442
        children: []
      - nid: cha18.sec18_1.p18_11
        kind: paragraph
        kind_raw: '18.11'
        num: '18.11'
        ord: 526
        heading: null
        text: The term “biotechnological process” (biotech) refers to the use of cells or organisms that have been generated or modified by recombinant DNA, hybridoma or other technology to produce APIs. The APIs produced by biotechnological processes normally consist of high molecular weight substances, such as proteins and polypeptides, for which specific guidance is given in this Section. Certain APIs of low molecular weight, such as antibiotics, amino acids, vitamins, and carbohydrates, can also be produced by recombinant DNA technology. The level of control for these types of APIs is similar to that employed for classical fermentation.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2444
        - source_label: PIC/S
          locator: line:2445
        - source_label: PIC/S
          locator: line:2446
        - source_label: PIC/S
          locator: line:2447
        - source_label: PIC/S
          locator: line:2448
        - source_label: PIC/S
          locator: line:2449
        - source_label: PIC/S
          locator: line:2450
        - source_label: PIC/S
          locator: line:2451
        - source_label: PIC/S
          locator: line:2452
        children: []
      - nid: cha18.sec18_1.p18_12
        kind: paragraph
        kind_raw: '18.12'
        num: '18.12'
        ord: 527
        heading: null
        text: "The term “classical fermentation” refers to processes that use microorganisms existing in nature and/or modified by conventional methods (e.g. irradiation or\n      chemical mutagenesis) to produce APIs.          APIs produced by “classical\nfermentation” are normally low molecular weight products such as antibiotics, amino acids, vitamins, and carbohydrates."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2454
        - source_label: PIC/S
          locator: line:2455
        - source_label: PIC/S
          locator: line:2456
        - source_label: PIC/S
          locator: line:2457
        - source_label: PIC/S
          locator: line:2458
        children: []
      - nid: cha18.sec18_1.p18_13
        kind: paragraph
        kind_raw: '18.13'
        num: '18.13'
        ord: 528
        heading: null
        text: "Production of APIs or intermediates from cell culture or fermentation involves biological processes such as cultivation of cells or extraction and purification of material from living organisms. Note that there may be additional process steps, such as physicochemical modification, that are part of the manufacturing process. The raw materials used (media, buffer components) may provide the potential for\n                  Specific Guidance for APIs Manufactured by Cell Culture/Fermentation\ngrowth of microbiological contaminants. Depending on the source, method of preparation, and the intended use of the API or intermediate, control of bioburden, viral contamination, and/or endotoxins during manufacturing and monitoring of the process at appropriate stages may be necessary."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2460
        - source_label: PIC/S
          locator: line:2461
        - source_label: PIC/S
          locator: line:2462
        - source_label: PIC/S
          locator: line:2463
        - source_label: PIC/S
          locator: line:2464
        - source_label: PIC/S
          locator: line:2468
        - source_label: PIC/S
          locator: line:2472
        - source_label: PIC/S
          locator: line:2473
        - source_label: PIC/S
          locator: line:2474
        - source_label: PIC/S
          locator: line:2475
        children: []
      - nid: cha18.sec18_1.p18_14
        kind: paragraph
        kind_raw: '18.14'
        num: '18.14'
        ord: 529
        heading: null
        text: Appropriate controls should be established at all stages of manufacturing to assure intermediate and/or API quality. While this Guide starts at the cell culture/fermentation step, prior steps (e.g. cell banking) should be performed under appropriate process controls. This Guide covers cell culture/fermentation from the point at which a vial of the cell bank is retrieved for use in manufacturing.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2477
        - source_label: PIC/S
          locator: line:2478
        - source_label: PIC/S
          locator: line:2479
        - source_label: PIC/S
          locator: line:2480
        - source_label: PIC/S
          locator: line:2481
        children: []
      - nid: cha18.sec18_1.p18_15
        kind: paragraph
        kind_raw: '18.15'
        num: '18.15'
        ord: 530
        heading: null
        text: Appropriate equipment and environmental controls should be used to minimize the risk of contamination. The acceptance criteria for quality of the environment and the frequency of monitoring should depend on the step in production and the production conditions (open, closed, or contained systems).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2483
        - source_label: PIC/S
