        kind: paragraph
        kind_raw: '12.83'
        num: '12.83'
        ord: 432
        heading: null
        text: Complete records should be maintained of any modification of a validated analytical method. Such records should include the reason for the modification and appropriate data to verify that the modification produces results that are as accurate and reliable as the established method.
        role: normative
        normativity: must
        tags: []
        refs:
