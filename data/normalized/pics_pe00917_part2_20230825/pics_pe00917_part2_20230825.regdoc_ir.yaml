        ord: 333
        heading: null
        text: "If the intermediate or API is intended to be transferred outside the control of the manufacturer’s material management system, the name and address of the manufacturer, quantity of contents, and special transport conditions and any\n       special legal requirements should also be included on the label.                For\nintermediates or APIs with an expiry date, the expiry date should be indicated on the label and Certificate of Analysis. For intermediates or APIs with a retest date, the retest date should be indicated on the label and/or Certificate of Analysis."
