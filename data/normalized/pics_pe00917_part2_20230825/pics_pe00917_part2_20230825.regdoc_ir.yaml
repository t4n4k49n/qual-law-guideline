        ord: 113
        heading: null
        text: If drinking (potable) water is insufficient to assure API quality, and tighter chemical and/or microbiological water quality specifications are called for, appropriate specifications for physical/chemical attributes, total microbial counts, objectionable organisms and/or endotoxins should be established.
