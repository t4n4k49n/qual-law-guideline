        children: []
      - nid: cha12.sec12_8.p12_81
        kind: paragraph
        kind_raw: '12.81'
        num: '12.81'
        ord: 430
        heading: null
        text: Methods should be validated to include consideration of characteristics included within the ICH guidelines on validation of analytical methods. The degree of analytical validation performed should reflect the purpose of the analysis and the stage of the API production process.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
