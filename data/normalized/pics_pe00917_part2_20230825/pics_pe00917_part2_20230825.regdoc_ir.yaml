        num: '8.31'
        ord: 291
        heading: null
        text: The acceptance criteria and type and extent of testing can depend on the nature of the intermediate or API being manufactured, the reaction or process step being conducted, and the degree to which the process introduces variability in the product’s quality. Less stringent in-process controls may be appropriate in early processing steps, whereas tighter controls may be appropriate for later processing steps (e.g., isolation and purification steps).
