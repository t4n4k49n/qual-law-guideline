        num: '8.40'
        ord: 298
        heading: null
        text: For the purpose of this document, blending is defined as the process of combining materials within the same specification to produce a homogeneous intermediate or API. In-process mixing of fractions from single batches (e.g., collecting several centrifuge loads from a single crystallization batch) or combining fractions from several batches for further processing is considered to be part of the production process and is not considered to be blending.
