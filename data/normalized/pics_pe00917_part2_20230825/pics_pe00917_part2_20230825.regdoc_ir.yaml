      source_spans:
      - source_label: PIC/S
        locator: line:2008
      children:
      - nid: cha12.sec12_6.p12_60
        kind: paragraph
        kind_raw: '12.60'
        num: '12.60'
        ord: 419
        heading: null
        text: Systems and processes should be periodically evaluated to verify that they are still operating in a valid manner. Where no significant changes have been made to the system or process, and a quality review confirms that the system or process is consistently producing material meeting its specifications, there is normally no need for revalidation.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
