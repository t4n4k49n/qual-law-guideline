      - nid: cha19.sec19_1.p19_11
        kind: paragraph
        kind_raw: '19.11'
        num: '19.11'
        ord: 570
        heading: null
        text: "The controls used in the manufacture of APIs for use in clinical trials should be consistent with the stage of development of the drug product incorporating the API. Process and test procedures should be flexible to provide for changes as\n                                                            APIs for Use in Clinical Trials\nknowledge of the process increases and clinical testing of a drug product progresses from pre-clinical stages through clinical stages. Once drug development reaches the stage where the API is produced for use in drug products intended for clinical trials, manufacturers should ensure that APIs are manufactured in suitable facilities using appropriate production and control procedures to ensure the quality of the API."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
