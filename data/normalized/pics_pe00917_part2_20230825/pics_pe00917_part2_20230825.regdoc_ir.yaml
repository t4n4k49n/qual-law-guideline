        kind_raw: '5.43'
        num: '5.43'
        ord: 165
        heading: null
        text: Computerized systems should have sufficient controls to prevent unauthorized access or changes to data. There should be controls to prevent omissions in data (e.g. system turned off and data not captured). There should be a record of any data change made, the previous entry, who made the change, and when the change was made.
