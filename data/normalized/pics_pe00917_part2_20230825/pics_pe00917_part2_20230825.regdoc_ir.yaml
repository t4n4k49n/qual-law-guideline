    - nid: cha11.sec11_5
      kind: section
      kind_raw: '11.5'
      num: '11.5'
      ord: 371
      heading: Stability Monitoring of APIs
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:1779
      children:
      - nid: cha11.sec11_5.p11_50
        kind: paragraph
        kind_raw: '11.50'
        num: '11.50'
        ord: 372
        heading: null
        text: A documented, on-going testing program should be designed to monitor the stability characteristics of APIs, and the results should be used to confirm appropriate storage conditions and retest or expiry dates.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1781
        - source_label: PIC/S
          locator: line:1782
        - source_label: PIC/S
          locator: line:1783
        children: []
      - nid: cha11.sec11_5.p11_51
        kind: paragraph
        kind_raw: '11.51'
        num: '11.51'
        ord: 373
        heading: null
        text: The test procedures used in stability testing should be validated and be stability indicating.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1785
        - source_label: PIC/S
          locator: line:1786
        children: []
      - nid: cha11.sec11_5.p11_52
        kind: paragraph
        kind_raw: '11.52'
        num: '11.52'
        ord: 374
        heading: null
        text: Stability samples should be stored in containers that simulate the market container. For example, if the API is marketed in bags within fiber drums, stability samples can be packaged in bags of the same material and in smaller-scale drums of similar or identical material composition to the market drums.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1788
        - source_label: PIC/S
          locator: line:1789
        - source_label: PIC/S
          locator: line:1790
        - source_label: PIC/S
          locator: line:1791
        children: []
      - nid: cha11.sec11_5.p11_53
        kind: paragraph
        kind_raw: '11.53'
        num: '11.53'
        ord: 375
        heading: null
        text: Normally the first three commercial production batches should be placed on the stability monitoring program to confirm the retest or expiry date. However, where data from previous studies show that the API is expected to remain stable for at least two years, fewer than three batches can be used.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1793
        - source_label: PIC/S
          locator: line:1794
        - source_label: PIC/S
          locator: line:1795
        - source_label: PIC/S
          locator: line:1796
        children: []
      - nid: cha11.sec11_5.p11_54
        kind: paragraph
        kind_raw: '11.54'
        num: '11.54'
        ord: 376
        heading: null
        text: Thereafter, at least one batch per year of API manufactured (unless none is produced that year) should be added to the stability monitoring program and tested at least annually to confirm the stability.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1798
        - source_label: PIC/S
          locator: line:1799
        - source_label: PIC/S
          locator: line:1800
        children: []
      - nid: cha11.sec11_5.p11_55
        kind: paragraph
        kind_raw: '11.55'
        num: '11.55'
        ord: 377
        heading: null
        text: For APIs with short shelf-lives, testing should be done more frequently. For example, for those biotechnological/biologic and other APIs with shelf-lives of one year or less, stability samples should be obtained and should be tested monthly for the first three months, and at three month intervals after that. When data exist that confirm that the stability of the API is not compromised, elimination of specific test intervals (e.g. 9 month testing) can be considered.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1802
        - source_label: PIC/S
          locator: line:1803
        - source_label: PIC/S
          locator: line:1804
        - source_label: PIC/S
          locator: line:1805
        - source_label: PIC/S
          locator: line:1806
        - source_label: PIC/S
          locator: line:1807
        children: []
      - nid: cha11.sec11_5.p11_56
        kind: paragraph
        kind_raw: '11.56'
        num: '11.56'
        ord: 378
        heading: null
        text: Where appropriate, the stability storage conditions should be consistent with the ICH guidelines on stability.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1809
        - source_label: PIC/S
          locator: line:1810
        children: []
    - nid: cha11.sec11_6
      kind: section
      kind_raw: '11.6'
      num: '11.6'
      ord: 379
      heading: Expiry and Retest Dating
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:1812
      children:
      - nid: cha11.sec11_6.p11_60
        kind: paragraph
        kind_raw: '11.60'
        num: '11.60'
        ord: 380
        heading: null
        text: When an intermediate is intended to be transferred outside the control of the manufacturer’s material management system and an expiry or retest date is assigned, supporting stability information should be available (e.g. published data, test results).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1814
        - source_label: PIC/S
          locator: line:1815
        - source_label: PIC/S
          locator: line:1816
        - source_label: PIC/S
          locator: line:1817
        children: []
      - nid: cha11.sec11_6.p11_61
        kind: paragraph
        kind_raw: '11.61'
        num: '11.61'
        ord: 381
        heading: null
        text: "An API expiry or retest date should be based on an evaluation of data derived from stability studies. Common practice is to use a retest date, not an expiration date.\n                                                                                   Validation"
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1819
        - source_label: PIC/S
          locator: line:1820
        - source_label: PIC/S
          locator: line:1821
        - source_label: PIC/S
          locator: line:1826
        children: []
      - nid: cha11.sec11_6.p11_62
        kind: paragraph
        kind_raw: '11.62'
        num: '11.62'
        ord: 382
        heading: null
        text: Preliminary API expiry or retest dates can be based on pilot scale batches if (1) the pilot batches employ a method of manufacture and procedure that simulates the final process to be used on a commercial manufacturing scale; and (2) the quality of the API represents the material to be made on a commercial scale.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1831
        - source_label: PIC/S
          locator: line:1832
        - source_label: PIC/S
          locator: line:1833
        - source_label: PIC/S
          locator: line:1834
        children: []
      - nid: cha11.sec11_6.p11_63
        kind: paragraph
        kind_raw: '11.63'
        num: '11.63'
        ord: 383
        heading: null
        text: A representative sample should be taken for the purpose of performing a retest.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1836
        children: []
    - nid: cha11.sec11_7
      kind: section
      kind_raw: '11.7'
      num: '11.7'
      ord: 384
      heading: Reserve/Retention Samples
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:1838
      children:
      - nid: cha11.sec11_7.p11_70
        kind: paragraph
        kind_raw: '11.70'
        num: '11.70'
        ord: 385
        heading: null
        text: The packaging and holding of reserve samples is for the purpose of potential future evaluation of the quality of batches of API and not for future stability testing purposes.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1840
        - source_label: PIC/S
          locator: line:1841
        - source_label: PIC/S
          locator: line:1842
        children: []
      - nid: cha11.sec11_7.p11_71
        kind: paragraph
        kind_raw: '11.71'
        num: '11.71'
        ord: 386
        heading: null
        text: Appropriately identified reserve samples of each API batch should be retained for one year after the expiry date of the batch assigned by the manufacturer, or for three years after distribution of the batch, whichever is the longer. For APIs with retest dates, similar reserve samples should be retained for three years after the batch is completely distributed by the manufacturer.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1844
        - source_label: PIC/S
          locator: line:1845
        - source_label: PIC/S
          locator: line:1846
        - source_label: PIC/S
          locator: line:1847
        - source_label: PIC/S
          locator: line:1848
        children: []
      - nid: cha11.sec11_7.p11_72
        kind: paragraph
        kind_raw: '11.72'
        num: '11.72'
        ord: 387
        heading: null
        text: The reserve sample should be stored in the same packaging system in which the API is stored or in one that is equivalent to or more protective than the marketed packaging system. Sufficient quantities should be retained to conduct at least two full compendial analyses or, when there is no pharmacopoeial monograph, two full specification analyses.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1850
        - source_label: PIC/S
          locator: line:1851
        - source_label: PIC/S
          locator: line:1852
