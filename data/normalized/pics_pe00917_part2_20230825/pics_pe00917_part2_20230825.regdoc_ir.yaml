    - nid: cha11.sec11_4
      kind: section
      kind_raw: '11.4'
      num: '11.4'
      ord: 365
      heading: Certificates of Analysis
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:1743
      children:
      - nid: cha11.sec11_4.p11_40
        kind: paragraph
        kind_raw: '11.40'
        num: '11.40'
        ord: 366
        heading: null
        text: Authentic Certificates of Analysis should be issued for each batch of intermediate or API on request.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1745
        - source_label: PIC/S
          locator: line:1746
        children: []
      - nid: cha11.sec11_4.p11_41
        kind: paragraph
        kind_raw: '11.41'
        num: '11.41'
        ord: 367
        heading: null
        text: Information on the name of the intermediate or API including where appropriate its grade, the batch number, and the date of release should be provided on the Certificate of Analysis. For intermediates or APIs with an expiry date, the expiry date should be provided on the label and Certificate of Analysis. For intermediates or APIs with a retest date, the retest date should be indicated on the label and/or Certificate of Analysis.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1748
        - source_label: PIC/S
          locator: line:1749
        - source_label: PIC/S
          locator: line:1750
        - source_label: PIC/S
          locator: line:1751
        - source_label: PIC/S
          locator: line:1752
        - source_label: PIC/S
          locator: line:1753
        children: []
      - nid: cha11.sec11_4.p11_42
        kind: paragraph
        kind_raw: '11.42'
        num: '11.42'
        ord: 368
        heading: null
        text: The Certificate should list each test performed in accordance with compendial or customer requirements, including the acceptance limits, and the numerical results obtained (if test results are numerical).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1755
        - source_label: PIC/S
          locator: line:1756
        - source_label: PIC/S
          locator: line:1757
        children: []
      - nid: cha11.sec11_4.p11_43
        kind: paragraph
        kind_raw: '11.43'
        num: '11.43'
        ord: 369
        heading: null
        text: "Certificates should be dated and signed by authorised personnel of the quality unit(s) and should show the name, address and telephone number of the original manufacturer. Where the analysis has been carried out by a repacker or\n                                                                       Laboratory Controls\nreprocessor, the Certificate of Analysis should show the name, address and telephone number of the repacker/reprocessor and a reference to the name of the original manufacturer."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1759
        - source_label: PIC/S
          locator: line:1760
        - source_label: PIC/S
          locator: line:1761
        - source_label: PIC/S
          locator: line:1765
        - source_label: PIC/S
          locator: line:1769
        - source_label: PIC/S
          locator: line:1770
        - source_label: PIC/S
          locator: line:1771
        children: []
      - nid: cha11.sec11_4.p11_44
        kind: paragraph
        kind_raw: '11.44'
        num: '11.44'
        ord: 370
        heading: null
        text: If new Certificates are issued by or on behalf of repackers/reprocessors, agents or brokers, these Certificates should show the name, address and telephone number of the laboratory that performed the analysis. They should also contain a reference to the name and address of the original manufacturer and to the original batch Certificate, a copy of which should be attached.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
