      children:
      - nid: cha12.sec12_4.p12_40
        kind: paragraph
        kind_raw: '12.40'
        num: '12.40'
        ord: 408
        heading: null
        text: Process Validation (PV) is the documented evidence that the process, operated within established parameters, can perform effectively and reproducibly to produce an intermediate or API meeting its predetermined specifications and quality attributes.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1926
        - source_label: PIC/S
          locator: line:1927
        - source_label: PIC/S
          locator: line:1928
        - source_label: PIC/S
          locator: line:1929
        children: []
      - nid: cha12.sec12_4.p12_41
        kind: paragraph
        kind_raw: '12.41'
        num: '12.41'
        ord: 409
        heading: null
        text: There are three approaches to validation. Prospective validation is the preferred approach, but there are exceptions where the other approaches can be used. These approaches and their applicability are listed below.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1931
        - source_label: PIC/S
          locator: line:1932
        - source_label: PIC/S
          locator: line:1933
        children: []
      - nid: cha12.sec12_4.p12_42
        kind: paragraph
        kind_raw: '12.42'
        num: '12.42'
        ord: 410
        heading: null
        text: "Prospective validation should normally be performed for all API processes as defined in 12.12. Prospective validation performed on an API process should be\n                                                                               Validation\ncompleted before the commercial distribution of the final drug product manufactured from that API."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1935
        - source_label: PIC/S
          locator: line:1936
        - source_label: PIC/S
          locator: line:1941
        - source_label: PIC/S
          locator: line:1945
        - source_label: PIC/S
          locator: line:1946
        children: []
      - nid: cha12.sec12_4.p12_43
        kind: paragraph
        kind_raw: '12.43'
        num: '12.43'
        ord: 411
        heading: null
        text: Concurrent validation can be conducted when data from replicate production runs are unavailable because only a limited number of API batches have been produced, API batches are produced infrequently, or API batches are produced by a validated process that has been modified. Prior to the completion of concurrent validation, batches can be released and used in final drug product for commercial distribution based on thorough monitoring and testing of the API batches.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1948
        - source_label: PIC/S
          locator: line:1949
        - source_label: PIC/S
          locator: line:1950
        - source_label: PIC/S
          locator: line:1951
        - source_label: PIC/S
          locator: line:1952
        - source_label: PIC/S
          locator: line:1953
        - source_label: PIC/S
          locator: line:1954
        children: []
      - nid: cha12.sec12_4.p12_44
        kind: paragraph
        kind_raw: '12.44'
        num: '12.44'
        ord: 412
        heading: null
        text: "An exception can be made for retrospective validation for well established processes that have been used without significant changes to API quality due to changes in raw materials, equipment, systems, facilities, or the production process. This validation approach may be used where:\n       (1)    Critical quality attributes and critical process parameters have been\n              identified;\n       (2)    Appropriate in-process acceptance criteria and controls have been\n              established;\n       (3)    There have not been significant process/product failures attributable to\n              causes other than operator error or equipment failures unrelated to\n              equipment suitability; and\n       (4)    Impurity profiles have been established for the existing API."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1956
        - source_label: PIC/S
          locator: line:1957
        - source_label: PIC/S
          locator: line:1958
        - source_label: PIC/S
          locator: line:1959
        - source_label: PIC/S
          locator: line:1961
        - source_label: PIC/S
          locator: line:1962
        - source_label: PIC/S
          locator: line:1964
        - source_label: PIC/S
          locator: line:1965
        - source_label: PIC/S
          locator: line:1967
        - source_label: PIC/S
          locator: line:1968
        - source_label: PIC/S
          locator: line:1969
        - source_label: PIC/S
          locator: line:1971
        children: []
      - nid: cha12.sec12_4.p12_45
        kind: paragraph
        kind_raw: '12.45'
        num: '12.45'
        ord: 413
        heading: null
        text: Batches selected for retrospective validation should be representative of all batches made during the review period, including any batches that failed to meet specifications, and should be sufficient in number to demonstrate process consistency. Retained samples can be tested to obtain data to retrospectively validate the process.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
