    - nid: cha18.sec18_4
      kind: section
      kind_raw: '18.4'
      num: '18.4'
      ord: 556
      heading: Harvesting, Isolation and Purification
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
