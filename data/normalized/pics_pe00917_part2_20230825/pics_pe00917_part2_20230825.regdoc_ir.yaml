        ord: 425
        heading: null
        text: Validated analytical methods having sensitivity to detect residues or contaminants should be used. The detection limit for each analytical method should be sufficiently sensitive to detect the established acceptable level of the residue or contaminant. The method’s attainable recovery level should be established. Residue limits should be practical, achievable, verifiable and based on the most deleterious residue. Limits can be established based on the minimum known pharmacological, toxicological, or physiological activity of the API or its most deleterious component.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2045
        - source_label: PIC/S
          locator: line:2046
        - source_label: PIC/S
          locator: line:2047
        - source_label: PIC/S
          locator: line:2048
        - source_label: PIC/S
          locator: line:2049
        - source_label: PIC/S
          locator: line:2050
        - source_label: PIC/S
          locator: line:2051
        - source_label: PIC/S
          locator: line:2052
        children: []
      - nid: cha12.sec12_7.p12_75
        kind: paragraph
        kind_raw: '12.75'
        num: '12.75'
        ord: 426
        heading: null
        text: "Equipment cleaning/sanitization studies should address microbiological and endotoxin contamination for those processes where there is a need to reduce total microbiological count or endotoxins in the API, or other processes where\n                                                                        Change Control\nsuch contamination could be of concern (e.g., non-sterile APIs used to manufacture sterile products)."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2054
        - source_label: PIC/S
          locator: line:2055
        - source_label: PIC/S
          locator: line:2056
        - source_label: PIC/S
          locator: line:2062
        - source_label: PIC/S
          locator: line:2066
        - source_label: PIC/S
          locator: line:2067
        children: []
      - nid: cha12.sec12_7.p12_76
        kind: paragraph
        kind_raw: '12.76'
        num: '12.76'
        ord: 427
        heading: null
        text: Cleaning procedures should be monitored at appropriate intervals after validation to ensure that these procedures are effective when used during routine production. Equipment cleanliness can be monitored by analytical testing and visual examination, where feasible. Visual inspection can allow detection of gross contamination concentrated in small areas that could otherwise go undetected by sampling and/or analysis.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
