        kind: paragraph
        kind_raw: '18.52'
        num: '18.52'
        ord: 565
        heading: null
        text: "Appropriate precautions should be taken to prevent potential viral contamination\n      from pre-viral to post-viral removal/inactivation steps.       Therefore, open\nprocessing should be performed in areas that are separate from other processing activities and have separate air handling units."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
