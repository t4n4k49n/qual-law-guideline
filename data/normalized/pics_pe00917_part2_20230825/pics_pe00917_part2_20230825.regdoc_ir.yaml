          locator: line:1654
        - source_label: PIC/S
          locator: line:1655
        - source_label: PIC/S
          locator: line:1656
        children: []
      - nid: cha11.sec11_1.p11_12
        kind: paragraph
        kind_raw: '11.12'
        num: '11.12'
        ord: 351
        heading: null
        text: All specifications, sampling plans, and test procedures should be scientifically sound and appropriate to ensure that raw materials, intermediates, APIs, and labels and packaging materials conform to established standards of quality and/or purity. Specifications and test procedures should be consistent with those included in the registration/filing. There can be specifications in addition to those in the registration/filing. Specifications, sampling plans, and test procedures, including changes to them, should be drafted by the appropriate organizational unit and reviewed and approved by the quality unit(s).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1658
        - source_label: PIC/S
          locator: line:1659
        - source_label: PIC/S
          locator: line:1660
        - source_label: PIC/S
