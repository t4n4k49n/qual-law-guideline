          locator: line:1993
        - source_label: PIC/S
          locator: line:1994
        children: []
      - nid: cha12.sec12_5.p12_52
        kind: paragraph
        kind_raw: '12.52'
        num: '12.52'
        ord: 417
        heading: null
        text: "Process validation should confirm that the impurity profile for each API is within the limits specified. The impurity profile should be comparable to or better than\n                                                                               Validation\nhistorical data and, where applicable, the profile determined during process development or for batches used for pivotal clinical and toxicological studies."
        role: normative
        normativity: must
        tags: []
        refs:
