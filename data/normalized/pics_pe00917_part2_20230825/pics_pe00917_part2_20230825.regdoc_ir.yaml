        ord: 249
        heading: null
        text: Upon receipt and before acceptance, each container or grouping of containers of materials should be examined visually for correct labelling (including correlation between the name used by the supplier and the in-house name, if these are different), container damage, broken seals and evidence of tampering or contamination. Materials should be held under quarantine until they have been sampled, examined or tested as appropriate, and released for use.
