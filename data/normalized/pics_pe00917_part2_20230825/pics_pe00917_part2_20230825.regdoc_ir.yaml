    children:
    - nid: cha13.p13_10
      kind: paragraph
      kind_raw: '13.10'
      num: '13.10'
      ord: 434
      heading: null
      text: A formal change control system should be established to evaluate all changes that may affect the production and control of the intermediate or API.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2099
      - source_label: PIC/S
        locator: line:2100
      children: []
    - nid: cha13.p13_11
      kind: paragraph
      kind_raw: '13.11'
      num: '13.11'
      ord: 435
      heading: null
      text: Written procedures should provide for the identification, documentation, appropriate review, and approval of changes in raw materials, specifications, analytical methods, facilities, support systems, equipment (including computer hardware), processing steps, labelling and packaging materials, and computer software.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2102
      - source_label: PIC/S
        locator: line:2103
      - source_label: PIC/S
        locator: line:2104
      - source_label: PIC/S
        locator: line:2105
      - source_label: PIC/S
        locator: line:2106
      children: []
    - nid: cha13.p13_12
      kind: paragraph
      kind_raw: '13.12'
      num: '13.12'
      ord: 436
      heading: null
      text: Any proposals for GMP relevant changes should be drafted, reviewed, and approved by the appropriate organisational units, and reviewed and approved by the quality unit(s).
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2108
      - source_label: PIC/S
        locator: line:2109
      - source_label: PIC/S
        locator: line:2110
      children: []
    - nid: cha13.p13_13
      kind: paragraph
      kind_raw: '13.13'
      num: '13.13'
      ord: 437
      heading: null
      text: "The potential impact of the proposed change on the quality of the intermediate or API should be evaluated. A classification procedure may help in determining the level of testing, validation, and documentation needed to justify changes to a validated process. Changes can be classified (e.g. as minor or major) depending on the nature and extent of the changes, and the effects these changes may impart on the process. Scientific judgement should determine what additional\n                                                     Rejection and Re-Use of Materials\ntesting and validation studies are appropriate to justify a change in a validated process."
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2112
      - source_label: PIC/S
        locator: line:2113
      - source_label: PIC/S
        locator: line:2114
      - source_label: PIC/S
        locator: line:2115
      - source_label: PIC/S
        locator: line:2116
      - source_label: PIC/S
        locator: line:2117
      - source_label: PIC/S
        locator: line:2122
      - source_label: PIC/S
        locator: line:2126
      - source_label: PIC/S
        locator: line:2127
      children: []
    - nid: cha13.p13_14
      kind: paragraph
      kind_raw: '13.14'
      num: '13.14'
      ord: 438
      heading: null
      text: When implementing approved changes, measures should be taken to ensure that all documents affected by the changes are revised.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2129
      - source_label: PIC/S
        locator: line:2130
      children: []
    - nid: cha13.p13_15
      kind: paragraph
      kind_raw: '13.15'
      num: '13.15'
      ord: 439
      heading: null
      text: After the change has been implemented, there should be an evaluation of the first batches produced or tested under the change.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2132
      - source_label: PIC/S
        locator: line:2133
      children: []
    - nid: cha13.p13_16
      kind: paragraph
      kind_raw: '13.16'
      num: '13.16'
      ord: 440
      heading: null
      text: The potential for critical changes to affect established retest or expiry dates should be evaluated. If necessary, samples of the intermediate or API produced by the modified process can be placed on an accelerated stability program and/or can be added to the stability monitoring program.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2135
      - source_label: PIC/S
        locator: line:2136
      - source_label: PIC/S
        locator: line:2137
      - source_label: PIC/S
        locator: line:2138
      children: []
    - nid: cha13.p13_17
      kind: paragraph
      kind_raw: '13.17'
      num: '13.17'
      ord: 441
      heading: null
      text: Current dosage form manufacturers should be notified of changes from established production and process control procedures that can impact the quality of the API.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2140
      - source_label: PIC/S
        locator: line:2141
      - source_label: PIC/S
        locator: line:2142
      children: []
  - nid: cha14
    kind: chapter
