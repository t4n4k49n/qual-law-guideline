        - source_label: PIC/S
          locator: line:2620
        children: []
      - nid: cha18.sec18_5.p18_53
        kind: paragraph
        kind_raw: '18.53'
        num: '18.53'
        ord: 566
        heading: null
        text: The same equipment is not normally used for different purification steps. However, if the same equipment is to be used, the equipment should be appropriately cleaned and sanitized before reuse. Appropriate precautions should be taken to prevent potential virus carry-over (e.g. through equipment or environment) from previous steps.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
