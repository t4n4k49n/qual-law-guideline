      - nid: cha11.sec11_1.p11_11
        kind: paragraph
        kind_raw: '11.11'
        num: '11.11'
        ord: 350
        heading: null
        text: There should be documented procedures describing sampling, testing, approval or rejection of materials, and recording and storage of laboratory data. Laboratory records should be maintained in accordance with Section 6.6.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
