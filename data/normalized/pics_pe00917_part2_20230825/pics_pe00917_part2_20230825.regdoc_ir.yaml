      children:
      - nid: cha18.sec18_4.p18_40
        kind: paragraph
        kind_raw: '18.40'
        num: '18.40'
        ord: 557
        heading: null
        text: Harvesting steps, either to remove cells or cellular components or to collect cellular components after disruption, should be performed in equipment and areas designed to minimize the risk of contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2588
        - source_label: PIC/S
          locator: line:2589
        - source_label: PIC/S
          locator: line:2590
        children: []
      - nid: cha18.sec18_4.p18_41
        kind: paragraph
        kind_raw: '18.41'
        num: '18.41'
        ord: 558
        heading: null
        text: Harvest and purification procedures that remove or inactivate the producing organism, cellular debris and media components (while minimizing degradation, contamination, and loss of quality) should be adequate to ensure that the intermediate or API is recovered with consistent quality.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2592
        - source_label: PIC/S
          locator: line:2593
        - source_label: PIC/S
          locator: line:2594
        - source_label: PIC/S
          locator: line:2595
        children: []
      - nid: cha18.sec18_4.p18_42
        kind: paragraph
        kind_raw: '18.42'
        num: '18.42'
        ord: 559
        heading: null
        text: All equipment should be properly cleaned and, as appropriate, sanitized after use. Multiple successive batching without cleaning can be used if intermediate or API quality is not compromised.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2597
        - source_label: PIC/S
          locator: line:2598
        - source_label: PIC/S
          locator: line:2599
        children: []
      - nid: cha18.sec18_4.p18_43
        kind: paragraph
        kind_raw: '18.43'
        num: '18.43'
        ord: 560
        heading: null
        text: If open systems are used, purification should be performed under environmental conditions appropriate for the preservation of product quality.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2601
        - source_label: PIC/S
          locator: line:2602
        children: []
      - nid: cha18.sec18_4.p18_44
        kind: paragraph
        kind_raw: '18.44'
        num: '18.44'
        ord: 561
        heading: null
        text: Additional controls, such as the use of dedicated chromatography resins or additional testing, may be appropriate if equipment is to be used for multiple products.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2604
        - source_label: PIC/S
          locator: line:2605
        - source_label: PIC/S
          locator: line:2606
        children: []
