        num: '8.30'
        ord: 290
        heading: null
        text: Written procedures should be established to monitor the progress and control the performance of processing steps that cause variability in the quality characteristics of intermediates and APIs. In-process controls and their acceptance criteria should be defined based on the information gained during the development stage or historical data.
