        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:1718
      children:
      - nid: cha11.sec11_2.p11_20
        kind: paragraph
        kind_raw: '11.20'
        num: '11.20'
        ord: 360
        heading: null
        text: For each batch of intermediate and API, appropriate laboratory tests should be conducted to determine conformance to specifications.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1720
        - source_label: PIC/S
          locator: line:1721
        children: []
      - nid: cha11.sec11_2.p11_21
        kind: paragraph
        kind_raw: '11.21'
        num: '11.21'
        ord: 361
        heading: null
        text: An impurity profile describing the identified and unidentified impurities present in a typical batch produced by a specific controlled production process should normally be established for each API. The impurity profile should include the identity or some qualitative analytical designation (e.g. retention time), the range of each impurity observed, and classification of each identified impurity (e.g. inorganic, organic, solvent). The impurity profile is normally dependent upon the production process and origin of the API. Impurity profiles are normally not necessary for APIs from herbal or animal tissue origin. Biotechnology considerations are covered in ICH Guideline Q6B.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1723
        - source_label: PIC/S
          locator: line:1724
        - source_label: PIC/S
          locator: line:1725
        - source_label: PIC/S
          locator: line:1726
        - source_label: PIC/S
          locator: line:1727
        - source_label: PIC/S
          locator: line:1728
        - source_label: PIC/S
          locator: line:1729
        - source_label: PIC/S
          locator: line:1730
        - source_label: PIC/S
          locator: line:1731
        children: []
      - nid: cha11.sec11_2.p11_22
        kind: paragraph
        kind_raw: '11.22'
        num: '11.22'
        ord: 362
        heading: null
        text: The impurity profile should be compared at appropriate intervals against the impurity profile in the regulatory submission or compared against historical data in order to detect changes to the API resulting from modifications in raw materials, equipment operating parameters, or the production process.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1733
        - source_label: PIC/S
          locator: line:1734
        - source_label: PIC/S
          locator: line:1735
        - source_label: PIC/S
          locator: line:1736
        children: []
      - nid: cha11.sec11_2.p11_23
        kind: paragraph
        kind_raw: '11.23'
        num: '11.23'
        ord: 363
        heading: null
        text: Appropriate microbiological tests should be conducted on each batch of intermediate and API where microbial quality is specified.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1738
