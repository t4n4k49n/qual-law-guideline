      - nid: cha12.sec12_3.p12_30
        kind: paragraph
        kind_raw: '12.30'
        num: '12.30'
        ord: 402
        heading: null
        text: 'Before starting process validation activities, appropriate qualification of critical equipment and ancillary systems should be completed. Qualification is usually carried out by conducting the following activities, individually or combined:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1907
        - source_label: PIC/S
