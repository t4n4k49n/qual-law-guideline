        num: '4.41'
        ord: 118
        heading: null
        text: Dedicated production areas should also be considered when material of an infectious nature or high pharmacological activity or toxicity is involved (e.g., certain steroids or cytotoxic anti-cancer agents) unless validated inactivation and/or cleaning procedures are established and maintained.
