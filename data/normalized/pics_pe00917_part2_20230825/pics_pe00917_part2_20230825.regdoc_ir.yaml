      - nid: cha18.sec18_5.p18_51
        kind: paragraph
        kind_raw: '18.51'
        num: '18.51'
        ord: 564
        heading: null
        text: Viral removal and viral inactivation steps are critical processing steps for some processes and should be performed within their validated parameters.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
