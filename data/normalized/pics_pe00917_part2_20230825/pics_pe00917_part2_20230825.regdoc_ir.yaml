          kind_raw: 
          num: null
          ord: 536
          heading: null
          text: "Harvest and purification procedures that remove cells, cellular debris and\n              media components while protecting the intermediate or API from\n              contamination (particularly of a microbiological nature) and from loss of\n              quality;"
