        num: '5.47'
        ord: 169
        heading: null
        text: Changes to the computerized system should be made according to a change procedure and should be formally authorized, documented and tested. Records should be kept of all changes, including modifications and enhancements made to the hardware, software and any other critical component of the system. These records should demonstrate that the system is maintained in a validated state.
