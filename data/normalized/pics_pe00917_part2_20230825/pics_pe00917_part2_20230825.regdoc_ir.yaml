        - source_label: PIC/S
          locator: line:1909
        children:
        - nid: cha12.sec12_3.p12_30.si1
          kind: subitem
          kind_raw: 
          num: null
          ord: 403
          heading: null
          text: "Design Qualification (DQ): documented verification that the proposed\n              design of the facilities, equipment, or systems is suitable for the intended\n              purpose."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1910
          - source_label: PIC/S
            locator: line:1911
          - source_label: PIC/S
            locator: line:1912
          children: []
        - nid: cha12.sec12_3.p12_30.si2
          kind: subitem
          kind_raw: 
          num: null
          ord: 404
          heading: null
          text: "Installation Qualification (IQ): documented verification that the equipment\n              or systems, as installed or modified, comply with the approved design, the\n              manufacturer’s recommendations and/or user requirements."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1913
          - source_label: PIC/S
            locator: line:1914
          - source_label: PIC/S
            locator: line:1915
          children: []
        - nid: cha12.sec12_3.p12_30.si3
          kind: subitem
          kind_raw: 
          num: null
          ord: 405
          heading: null
          text: "Operational Qualification (OQ): documented verification that the equipment\n              or systems, as installed or modified, perform as intended throughout the\n              anticipated operating ranges."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
