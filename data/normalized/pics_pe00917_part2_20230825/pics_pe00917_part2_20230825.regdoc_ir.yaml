        num: '7.32'
        ord: 260
        heading: null
        text: Processing aids, hazardous or highly toxic raw materials, other special materials, or materials transferred to another unit within the company’s control do not need to be tested if the manufacturer’s Certificate of Analysis is obtained, showing that these raw materials conform to established specifications. Visual examination of containers, labels, and recording of batch numbers should help in establishing the identity of these materials. The lack of on-site testing for these materials should be justified and documented.
