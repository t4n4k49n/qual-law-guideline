        kind_raw: '18.50'
        num: '18.50'
        ord: 563
        heading: null
        text: 'See the ICH Guideline Q5A Quality of Biotechnological Products: Viral Safety Evaluation of Biotechnology Products Derived from Cell Lines of Human or Animal Origin for more specific information.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
