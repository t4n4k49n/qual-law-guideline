          locator: line:2069
        - source_label: PIC/S
          locator: line:2070
        - source_label: PIC/S
          locator: line:2071
        - source_label: PIC/S
          locator: line:2072
        - source_label: PIC/S
          locator: line:2073
        - source_label: PIC/S
          locator: line:2074
        children: []
    - nid: cha12.sec12_8
      kind: section
      kind_raw: '12.8'
      num: '12.8'
      ord: 428
      heading: Validation of Analytical Methods
