        kind_raw: '7.31'
        num: '7.31'
        ord: 259
        heading: null
        text: Supplier approval should include an evaluation that provides adequate evidence (e.g., past quality history) that the manufacturer can consistently provide material meeting specifications. Full analyses should be conducted on at least three batches before reducing in-house testing. However, as a minimum, a full analysis should be performed at appropriate intervals and compared with the Certificates of Analysis. Reliability of Certificates of Analysis should be checked at regular intervals.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
