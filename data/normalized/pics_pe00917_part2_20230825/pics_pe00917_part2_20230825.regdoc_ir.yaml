      - nid: cha14.sec14_5.p14_50
        kind: paragraph
        kind_raw: '14.50'
        num: '14.50'
        ord: 459
        heading: null
        text: Returned intermediates or APIs should be identified as such and quarantined.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2223
        children: []
      - nid: cha14.sec14_5.p14_51
        kind: paragraph
        kind_raw: '14.51'
        num: '14.51'
        ord: 460
        heading: null
        text: If the conditions under which returned intermediates or APIs have been stored or shipped before or during their return or the condition of their containers casts doubt on their quality, the returned intermediates or APIs should be reprocessed, reworked, or destroyed, as appropriate.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2225
        - source_label: PIC/S
          locator: line:2226
        - source_label: PIC/S
          locator: line:2227
        - source_label: PIC/S
          locator: line:2228
        children: []
      - nid: cha14.sec14_5.p14_52
        kind: paragraph
        kind_raw: '14.52'
        num: '14.52'
        ord: 461
