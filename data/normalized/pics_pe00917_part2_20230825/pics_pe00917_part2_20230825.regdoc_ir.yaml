          locator: line:1663
        - source_label: PIC/S
          locator: line:1664
        - source_label: PIC/S
          locator: line:1665
        children: []
      - nid: cha11.sec11_1.p11_13
        kind: paragraph
        kind_raw: '11.13'
        num: '11.13'
        ord: 352
        heading: null
        text: Appropriate specifications should be established for APIs in accordance with accepted standards and consistent with the manufacturing process. The specifications should include a control of the impurities (e.g. organic impurities, inorganic impurities, and residual solvents). If the API has a specification for microbiological purity, appropriate action limits for total microbial counts and objectionable organisms should be established and met. If the API has a specification for endotoxins, appropriate action limits should be established and met.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
