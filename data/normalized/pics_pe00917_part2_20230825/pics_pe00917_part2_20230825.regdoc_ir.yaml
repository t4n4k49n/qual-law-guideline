        kind: paragraph
        kind_raw: '11.10'
        num: '11.10'
        ord: 349
        heading: null
        text: The independent quality unit(s) should have at its disposal adequate laboratory facilities.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
