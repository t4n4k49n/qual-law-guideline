        kind: paragraph
        kind_raw: '2.4'
        num: '2.4'
        ord: 8
        heading: null
        text: Senior management has the ultimate responsibility to ensure an effective quality management system is in place to achieve the quality objectives, and, that roles, responsibilities, and authorities are defined, communicated and implemented throughout the organisation. Senior management should establish a quality policy that describes the overall intentions and direction of the company related to quality and should ensure continuing suitability and effectiveness of the quality management system and GMP compliance through participation in management review.
        role: normative
        normativity: must
        tags: []
