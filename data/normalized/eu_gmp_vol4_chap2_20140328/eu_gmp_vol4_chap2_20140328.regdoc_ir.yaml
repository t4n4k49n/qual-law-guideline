  - nid: cha2
    kind: chapter
    kind_raw: Chapter
    num: '2'
    ord: 2
    heading: Personnel
    text: 'Legal basis for publishing the detailed guidelines: Article 47 of Directive 2001/83/EC on the Community code relating to medicinal products for human use and Article 51 of Directive 2001/82/EC on the Community code relating to veterinary medicinal products. This document provides guidance for the interpretation of the principles and guidelines of good manufacturing practice (GMP) for medicinal products as laid down in Directive 2003/94/EC for medicinal products for human use and Directive 91/412/EEC for veterinary use. Status of the document: Revision Reasons for changes: Changes have been made in order to integrate the principles of “Pharmaceutical Quality System” as described in the ICH Q10 tripartite guideline. A section has been added on consultants Deadline for coming into operation: 16 February 2014'
    role: structural
    normativity: null
