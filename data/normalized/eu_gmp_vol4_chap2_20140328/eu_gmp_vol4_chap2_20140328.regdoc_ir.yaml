        - nid: cha2.sec3.p2_9.ix
          kind: item
          kind_raw: x.
          num: x
          ord: 39
          heading: null
          text: The monitoring of compliance with the requirements of Good Manufacturing Practice;
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: EU GMP
            locator: line:196
          - source_label: EU GMP
            locator: line:197
          children: []
        - nid: cha2.sec3.p2_9.ixi
          kind: item
          kind_raw: xi.
          num: xi
          ord: 40
          heading: null
          text: The inspection, investigation, and taking of samples, in order to monitor factors which may affect product quality;
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: EU GMP
            locator: line:198
          - source_label: EU GMP
