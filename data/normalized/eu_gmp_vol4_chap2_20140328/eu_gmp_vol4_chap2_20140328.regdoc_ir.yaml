    - nid: cha2.sec4
      kind: section
      kind_raw: null
      num: null
      ord: 43
      heading: Training
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: EU GMP
        locator: line:206
      children:
      - nid: cha2.sec4.p2_10
        kind: paragraph
        kind_raw: '2.10'
        num: '2.10'
        ord: 44
        heading: null
        text: The manufacturer should provide training for all the personnel whose duties take them into production and storage areas or into control laboratories (including the technical, maintenance and cleaning personnel), and for other personnel whose activities could affect the quality of the product.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:208
        - source_label: EU GMP
          locator: line:209
        - source_label: EU GMP
          locator: line:210
        - source_label: EU GMP
          locator: line:211
        children: []
      - nid: cha2.sec4.p2_11
        kind: paragraph
        kind_raw: '2.11'
        num: '2.11'
        ord: 45
        heading: null
        text: Besides the basic training on the theory and practice of the quality management system and Good Manufacturing Practice, newly recruited personnel should receive training appropriate to the duties assigned to them. Continuing training should also be given, and its practical effectiveness should be periodically assessed. Training programmes should be available, approved by either the head of Production or the head of Quality Control, as appropriate. Training records should be kept.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:213
        - source_label: EU GMP
          locator: line:214
        - source_label: EU GMP
          locator: line:215
        - source_label: EU GMP
          locator: line:216
        - source_label: EU GMP
          locator: line:217
        - source_label: EU GMP
          locator: line:218
        children: []
      - nid: cha2.sec4.p2_12
        kind: paragraph
        kind_raw: '2.12'
        num: '2.12'
        ord: 46
        heading: null
        text: Personnel working in areas where contamination is a hazard, e.g. clean areas or areas where highly active, toxic, infectious or sensitising materials are handled, should be given specific training.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:222
        - source_label: EU GMP
          locator: line:223
        - source_label: EU GMP
          locator: line:224
        children: []
      - nid: cha2.sec4.p2_13
        kind: paragraph
        kind_raw: '2.13'
        num: '2.13'
        ord: 47
        heading: null
        text: Visitors or untrained personnel should, preferably, not be taken into the production and quality control areas. If this is unavoidable, they should be given information in advance, particularly about personal hygiene and the prescribed protective clothing. They should be closely supervised.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:226
        - source_label: EU GMP
          locator: line:227
        - source_label: EU GMP
          locator: line:228
        - source_label: EU GMP
          locator: line:229
        children: []
      - nid: cha2.sec4.p2_14
        kind: paragraph
        kind_raw: '2.14'
        num: '2.14'
        ord: 48
        heading: null
        text: The pharmaceutical quality system and all the measures capable of improving its understanding and implementation should be fully discussed during the training sessions.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:231
        - source_label: EU GMP
          locator: line:232
        children: []
    - nid: cha2.sec5
      kind: section
      kind_raw: null
      num: null
      ord: 49
      heading: Personnel Hygiene
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: EU GMP
        locator: line:234
      children:
      - nid: cha2.sec5.p2_15
        kind: paragraph
        kind_raw: '2.15'
        num: '2.15'
        ord: 50
        heading: null
        text: Detailed hygiene programmes should be established and adapted to the different needs within the factory. They should include procedures relating to the health, hygiene practices and clothing of personnel. These procedures should be understood and followed in a very strict way by every person whose duties take him into the production and control areas. Hygiene programmes should be promoted by management and widely discussed during training sessions.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:236
        - source_label: EU GMP
          locator: line:237
        - source_label: EU GMP
          locator: line:238
        - source_label: EU GMP
          locator: line:239
        - source_label: EU GMP
          locator: line:240
        - source_label: EU GMP
          locator: line:241
        children: []
      - nid: cha2.sec5.p2_16
        kind: paragraph
        kind_raw: '2.16'
        num: '2.16'
        ord: 51
        heading: null
        text: All personnel should receive medical examination upon recruitment. It must be the manufacturer’s responsibility that there are instructions ensuring that health conditions that can be of relevance to the quality of products come to the manufacturer’s knowledge. After the first medical examination, examinations should be carried out when necessary for the work and personal health.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:243
        - source_label: EU GMP
          locator: line:244
        - source_label: EU GMP
          locator: line:245
        - source_label: EU GMP
          locator: line:246
        - source_label: EU GMP
          locator: line:247
        children: []
      - nid: cha2.sec5.p2_17
        kind: paragraph
        kind_raw: '2.17'
        num: '2.17'
        ord: 52
        heading: null
        text: Steps should be taken to ensure as far as is practicable that no person affected by an infectious disease or having open lesions on the exposed surface of the body is engaged in the manufacture of medicinal products.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:249
        - source_label: EU GMP
          locator: line:250
        - source_label: EU GMP
          locator: line:251
        children: []
      - nid: cha2.sec5.p2_18
        kind: paragraph
        kind_raw: '2.18'
        num: '2.18'
        ord: 53
        heading: null
        text: Every person entering the manufacturing areas should wear protective garments appropriate to the operations to be carried out.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:253
        - source_label: EU GMP
          locator: line:254
        children: []
      - nid: cha2.sec5.p2_19
        kind: paragraph
        kind_raw: '2.19'
        num: '2.19'
        ord: 54
        heading: null
        text: Eating, drinking, chewing or smoking, or the storage of food, drink, smoking materials or personal medication in the production and storage areas should be prohibited. In general, any unhygienic practice within the manufacturing areas or in any other area where the product might be adversely affected should be forbidden.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:256
        - source_label: EU GMP
          locator: line:257
        - source_label: EU GMP
          locator: line:258
        - source_label: EU GMP
          locator: line:259
        children: []
      - nid: cha2.sec5.p2_20
        kind: paragraph
        kind_raw: '2.20'
        num: '2.20'
        ord: 55
        heading: null
        text: Direct contact should be avoided between the operator’s hands and the exposed product as well as with any part of the equipment that comes into contact with the products.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:261
        - source_label: EU GMP
          locator: line:262
        children: []
      - nid: cha2.sec5.p2_21
        kind: paragraph
        kind_raw: '2.21'
        num: '2.21'
        ord: 56
        heading: null
        text: Personnel should be instructed to use the hand-washing facilities.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:264
        children: []
      - nid: cha2.sec5.p2_22
        kind: paragraph
        kind_raw: '2.22'
        num: '2.22'
        ord: 57
        heading: null
        text: Any specific requirements for the manufacture of special groups of products, for example sterile preparations, are covered in the annexes.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:266
        - source_label: EU GMP
          locator: line:267
        children: []
    - nid: cha2.sec6
      kind: section
      kind_raw: null
      num: null
      ord: 58
      heading: Consultants
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: EU GMP
        locator: line:269
      children:
      - nid: cha2.sec6.p2_23
        kind: paragraph
        kind_raw: '2.23'
        num: '2.23'
        ord: 59
        heading: null
        text: Consultants should have adequate education, training, and experience, or any combination thereof, to advise on the subject for which they are retained. Records should be maintained stating the name, address, qualifications, and type of service provided by these consultants.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:271
        - source_label: EU GMP
          locator: line:272
        - source_label: EU GMP
          locator: line:276
        - source_label: EU GMP
          locator: line:277
