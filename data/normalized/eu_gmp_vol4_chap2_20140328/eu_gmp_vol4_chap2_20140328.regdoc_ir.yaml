        - nid: cha2.sec3.p2_6.ia
          kind: item
          kind_raw: a)
          num: a
          ord: 12
          heading: null
          text: for medicinal products manufactured within the European Union, a Qualified Person must ensure that each batch has been manufactured and checked in compliance with the laws in force in that Member State and in accordance with the requirements of the marketing authorisation;
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
