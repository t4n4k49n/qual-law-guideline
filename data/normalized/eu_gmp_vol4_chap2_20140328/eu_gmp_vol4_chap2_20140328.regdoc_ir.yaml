          children: []
        - nid: cha2.sec3.p2_6.ib
          kind: item
          kind_raw: (b)
          num: b
          ord: 13
          heading: null
          text: in the case of medicinal products coming from third countries, irrespective of whether the product has been manufactured in the European Union a Qualified Person must ensure that each production batch has undergone in a Member State a full qualitative analysis, a quantitative analysis of at least all the active substances and all the other tests or checks necessary to ensure the quality of medicinal products in accordance with the requirements of the marketing authorisation. The Qualified Person must certify in a register or equivalent document, as operations are carried out and before any release, that each production batch satisfies the provisions of Article 51. The persons responsible for these duties must meet the qualification requirements laid down in Article 49 of the same Directive, they shall be permanently and continuously at the disposal of the holder of the Manufacturing Authorisation to carry out their responsibilities. The responsibilities of a Qualified Person may be delegated, but only to other Qualified Person(s). Guidance on the role of the Qualified Person is elaborated in Annex 16.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
