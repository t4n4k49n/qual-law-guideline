    - nid: cha2.sec1
      kind: section
      kind_raw: null
      num: null
      ord: 3
      heading: Principle
      text: The correct manufacture of medicinal products relies upon people. For this reason there must be sufficient qualified personnel to carry out all the tasks which are the responsibility of the manufacturer. Individual responsibilities should be clearly understood by the individuals and recorded. All personnel should be aware of the principles of Good Manufacturing Practice that affect them and receive initial and continuing training, including hygiene instructions, relevant to their needs.
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
