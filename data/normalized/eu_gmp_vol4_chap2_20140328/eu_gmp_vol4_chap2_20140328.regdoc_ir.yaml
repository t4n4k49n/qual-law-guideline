        - nid: cha2.sec3.p2_9.ixii
          kind: item
          kind_raw: xii.
          num: xii
          ord: 41
          heading: null
          text: Participation in management reviews of process performance, product quality and of the quality management system and advocating continual improvement
          role: normative
          normativity: must
