        children: []
      - nid: cha5.sec4.p5_28
        kind: paragraph
        kind_raw: '5.28'
        num: '5.28'
        ord: 60
        heading: null
        text: The quality requirements established by the manufacturer for the starting materials should be discussed and agreed with the suppliers. Appropriate aspects of the production, testing and control, including handling, labelling, packaging and distribution requirements, complaints, recalls and rejection procedures should be documented in a formal quality agreement or specification.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
