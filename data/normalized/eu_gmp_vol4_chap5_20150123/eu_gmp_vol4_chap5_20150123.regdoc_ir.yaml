        ord: 62
        heading: null
        text: For each delivery of starting material the containers should be checked for integrity of package, including tamper evident seal where relevant, and for correspondence between the delivery note, the purchase order, the supplier’s labels and approved manufacturer and supplier information maintained by the medicinal product manufacturer. The receiving checks on each delivery should be documented. Specific requirements apply to the importation of active substances to be used in the manufacture of medicinal products for human use in article 46b of Directive 2001/83/EC.
        role: normative
        normativity: must
