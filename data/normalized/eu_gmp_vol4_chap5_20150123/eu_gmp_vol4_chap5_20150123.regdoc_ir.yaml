        kind_raw: '5.71'
        num: '5.71'
        ord: 123
        heading: null
        text: The manufacturer should report to the marketing authorisation holder (MAH) any constraints in manufacturing operations which may result in abnormal restriction in the supply. This should be done in a timely manner to facilitate reporting of the restriction in supply by the MAH, to the relevant competent authorities, in accordance with its legal obligations.
        role: normative
        normativity: must
