        children: []
      - nid: cha5.sec4.p5_36
        kind: paragraph
        kind_raw: '5.36'
        num: '5.36'
        ord: 72
        heading: null
        text: 'The rationale for the outsourcing of this testing should be justified and documented and the following requirements should be fulfilled: A similar approach should apply to packaging materials as stated in section 5.45. Identity testing of starting materials should be performed according to the methods and the specifications of the relevant marketing authorisation dossier. including assessment of batches previously received and the history of compliance before reducing in-house testing. Any significant change in the manufacturing or testing processes should be considered;'
