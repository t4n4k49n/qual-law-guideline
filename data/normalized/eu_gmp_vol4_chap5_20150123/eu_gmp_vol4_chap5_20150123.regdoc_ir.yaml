        kind: paragraph
        kind_raw: '5.35'
        num: '5.35'
        ord: 71
        heading: null
        text: Manufacturers of finished products are responsible for any testing of starting materials2 as described in the marketing authorisation dossier. They can utilise partial or full test results from the approved starting material manufacturer but must, as a minimum, perform identification testing3 of each batch according to Annex 8.
        role: normative
