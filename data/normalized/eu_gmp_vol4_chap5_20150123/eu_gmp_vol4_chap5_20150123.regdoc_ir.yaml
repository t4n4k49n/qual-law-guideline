        children: []
      - nid: cha5.sec3.p5_18
        kind: paragraph
        kind_raw: '5.18'
        num: '5.18'
        ord: 26
        heading: null
        text: Contamination of a starting material or of a product by another material or product should be prevented. This risk of accidental cross-contamination resulting from the uncontrolled release of dust, gases, vapours, aerosols, genetic material or organisms from active substances, other starting materials, and products in process, from residues on equipment, and from operators’ clothing should be assessed. The significance of this risk varies with the nature of the contaminant and that of the product being contaminated. Products in which cross-contamination is likely to be most significant are those administered by injection and those given over a long time. However, contamination of all products poses a risk to patient safety dependent on the nature and extent of contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
