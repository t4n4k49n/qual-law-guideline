        children: []
      - nid: cha5.sec3.p5_20
        kind: paragraph
        kind_raw: '5.20'
        num: '5.20'
        ord: 28
        heading: null
        text: A Quality Risk Management process, which includes a potency and toxicological evaluation, should be used to assess and control the cross-contamination risks presented by the products manufactured. Factors including; facility/equipment design and use, personnel and material flow, microbiological controls, physico-chemical characteristics of the active substance, process characteristics, cleaning processes and analytical capabilities relative to the relevant limits established from the evaluation of the products should also be taken into account. The outcome of the Quality Risk Management process should be the basis for determining the necessity for and extent to which premises and equipment should be dedicated to a particular product or product family. This may include dedicating specific product contact parts or dedication of the entire manufacturing facility. It may be acceptable to confine manufacturing activities to a segregated, self contained production area within a multiproduct facility, where justified.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
