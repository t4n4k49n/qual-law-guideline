        children: []
      - nid: cha5.sec4.p5_29
        kind: paragraph
        kind_raw: '5.29'
        num: '5.29'
        ord: 61
        heading: null
        text: 'For the approval and maintenance of suppliers of active substances and excipients, the following is required: Active substances1 Supply chain traceability should be established and the associated risks, from active substance starting materials to the finished medicinal product, should be formally assessed and periodically verified. Appropriate measures should be put in place to reduce risks to the quality of the active substance. The supply chain and traceability records for each active substance (including active substance starting materials) should be available and be retained by the EEA based manufacturer or importer of the medicinal product. Audits should be carried out at the manufacturers and distributors of active substances to confirm that they comply with the relevant good manufacturing practice and good distribution practice requirements. The holder of the manufacturing authorisation shall verify such compliance either by himself or through an entity acting on his behalf under a contract. For veterinary medicinal products, audits should be conducted based on risk. Audits should be of an appropriate duration and scope to ensure that a full and clear assessment of GMP is made; consideration should be given to potential cross-contamination from other materials on site. The report should fully reflect what was done and seen on the audit with any deficiencies clearly identified. Any required corrective and preventive actions should be implemented. Further audits should be undertaken at intervals defined by the quality risk management process to ensure the maintenance of standards and continued use of the approved supply chain. Excipients Excipients and excipient suppliers should be controlled appropriately based on the results of a formalised quality risk assessment in accordance with the European Commission ‘Guidelines on the formalised risk assessment for ascertaining the appropriate Good Manufacturing Practice for excipients of medicinal products for human use’.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
