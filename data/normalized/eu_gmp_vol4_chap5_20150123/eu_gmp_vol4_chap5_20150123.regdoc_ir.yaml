        internal: []
        external: []
      source_spans:
      - source_label: EU GMP
        locator: line:523
      children:
      - nid: cha5.sec9.p5_66
        kind: paragraph
        kind_raw: '5.66'
        num: '5.66'
        ord: 117
        heading: null
        text: Rejected materials and products should be clearly marked as such and stored separately in restricted areas. They should either be returned to the suppliers or, where appropriate, reprocessed or destroyed. Whatever action is taken should be approved and recorded by authorised personnel.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:525
        - source_label: EU GMP
          locator: line:526
        - source_label: EU GMP
          locator: line:527
        - source_label: EU GMP
          locator: line:528
        children: []
      - nid: cha5.sec9.p5_67
        kind: paragraph
        kind_raw: '5.67'
        num: '5.67'
        ord: 118
        heading: null
        text: The reprocessing of rejected products should be exceptional. It is only permitted if the quality of the final product is not affected, if the specifications are met and if it is done in accordance with a defined and authorised procedure after evaluation of the risks involved. Record should be kept of the reprocessing.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:530
        - source_label: EU GMP
          locator: line:531
        - source_label: EU GMP
          locator: line:532
        - source_label: EU GMP
          locator: line:533
        children: []
      - nid: cha5.sec9.p5_68
        kind: paragraph
        kind_raw: '5.68'
        num: '5.68'
        ord: 119
        heading: null
        text: The recovery of all or part of earlier batches which conform to the required quality by incorporation into a batch of the same product at a defined stage of manufacture should be authorised beforehand. This recovery should be carried out in accordance with a defined procedure after evaluation of the risks involved, including any possible effect on shelf life. The recovery should be recorded.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:535
        - source_label: EU GMP
          locator: line:536
        - source_label: EU GMP
          locator: line:537
        - source_label: EU GMP
          locator: line:538
        - source_label: EU GMP
          locator: line:539
        children: []
      - nid: cha5.sec9.p5_69
        kind: paragraph
        kind_raw: '5.69'
        num: '5.69'
        ord: 120
        heading: null
        text: The need for additional testing of any finished product which has been reprocessed, or into which a recovered product has been incorporated, should be considered by the Quality Control Department.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:541
        - source_label: EU GMP
          locator: line:542
        - source_label: EU GMP
          locator: line:543
        children: []
      - nid: cha5.sec9.p5_70
        kind: paragraph
        kind_raw: '5.70'
        num: '5.70'
        ord: 121
        heading: null
        text: Products returned from the market and which have left the control of the manufacturer should be destroyed unless without doubt their quality is satisfactory; they may be considered for re-sale, re-labelling or recovery in a subsequent batch only after they have been critically assessed by the Quality Control Department in accordance with a written procedure. The nature of the product, any special storage conditions it requires, its condition and history, and the time elapsed since it was issued should all be taken into account in this assessment. Where any doubt arises over the quality of the product, it should not be considered suitable for re-issue or re-use, although basic chemical reprocessing to recover active ingredient may be possible. Any action taken should be appropriately recorded.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
