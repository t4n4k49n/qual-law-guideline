        ord: 27
        heading: null
        text: Cross-contamination should be prevented by attention to design of the premises and equipment as described in Chapter 3. This should be supported by attention to process design and implementation of any relevant technical or organizational measures, including effective and reproducible cleaning processes to control risk of cross-contamination.
        role: normative
        normativity: must
        tags: []
