        kind: paragraph
        kind_raw: '5.17'
        num: '5.17'
        ord: 25
        heading: null
        text: Normally, the production of non-medicinal products should be avoided in areas and with equipment destined for the production of medicinal products but, where justified, could be allowed where the measures to prevent cross-contamination with medicinal products described below and in Chapter 3 can be applied. The production and/or storage of technical poisons, such as pesticides (except where these are used for manufacture of medicinal products) and herbicides, should not be allowed in areas used for the manufacture and / or storage of medicinal products.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
