          ord: 77
          heading: null
          text: The medicinal product manufacturer should also perform (or via a separately approved contract laboratory) a full analysis at appropriate intervals based on risk and compare the results with the material manufacturer or supplier’s certificate of analysis in order to check the reliability of the latter. Should this testing identify any discrepancy then an investigation should be performed and appropriate measures taken. The acceptance of certificates of analysis from the material manufacturer or supplier should be discontinued until these measures are completed.
