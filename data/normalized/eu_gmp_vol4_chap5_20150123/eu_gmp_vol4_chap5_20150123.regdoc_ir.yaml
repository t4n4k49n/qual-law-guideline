    heading: Production
    text: 'Legal basis for publishing the detailed guidelines: Article 47 of Directive 2001/83/EC on the Community code relating to medicinal products for human use and Article 51 of Directive 2001/82/EC on the Community code relating to veterinary medicinal products. This document provides guidance for the interpretation of the principles and guidelines of good manufacturing practice (GMP) for medicinal products as laid down in Directive 2003/94/EC for medicinal products for human use and Directive 91/412/EEC for veterinary use. Status of the document: Revision. Reasons for changes: Changes have been made to sections 17 to 21, including adding a new section, to improve the guidance on prevention of cross-contamination and to refer to toxicological assessment. Changes were also introduced in sections 27 to 30, including adding a new section, on the qualification of suppliers in order to reflect the legal obligation of manufacturing authorisation holders to ensure that active substances are produced in accordance with GMP. The changes include supply chain traceability. Sections 35 and 36 are inserted to clarify and harmonise expectations of manufacturers regarding the testing of starting materials while section 71 introduces guidance on notification of restrictions in supply. Deadline for coming into operation: 1 March 2015. However, the toxicological evaluation mentioned in section 20 has to be carried out:'
    role: structural
    normativity: null
