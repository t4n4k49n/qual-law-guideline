          heading: null
          text: The medicinal product manufacturer should perform audits, either itself or via third parties, at appropriate intervals based on risk at the site(s) carrying out the testing (including sampling) of the starting materials in order to assure compliance with Good Manufacturing Practice and with the specifications and testing methods described in the marketing authorisation dossier;
