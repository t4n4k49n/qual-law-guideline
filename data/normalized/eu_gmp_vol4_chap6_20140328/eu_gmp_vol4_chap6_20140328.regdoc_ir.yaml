        - source_label: EU GMP
          locator: line:277
        children: []
      - nid: cha6.sec8.p6_38
        kind: paragraph
        kind_raw: '6.38'
        num: '6.38'
        ord: 81
        heading: null
        text: The transfer of testing methods from one laboratory (transferring laboratory) to another laboratory (receiving laboratory) should be described in a detailed protocol.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
