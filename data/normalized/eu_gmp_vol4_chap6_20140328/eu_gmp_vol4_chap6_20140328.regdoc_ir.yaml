      - nid: cha6.sec7.p6_26
        kind: paragraph
        kind_raw: '6.26'
        num: '6.26'
        ord: 60
        heading: null
        text: After marketing, the stability of the medicinal product should be monitored according to a continuous appropriate programme that will permit the detection of any stability issue (e.g. changes in levels of impurities or dissolution profile) associated with the formulation in the marketed package.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:208
        - source_label: EU GMP
          locator: line:209
        - source_label: EU GMP
          locator: line:210
        - source_label: EU GMP
          locator: line:211
        children: []
      - nid: cha6.sec7.p6_27
        kind: paragraph
        kind_raw: '6.27'
        num: '6.27'
        ord: 61
        heading: null
        text: The purpose of the on-going stability programme is to monitor the product over its shelf life and to determine that the product remains, and can be expected to remain, within specifications under the labelled storage conditions.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:212
        - source_label: EU GMP
          locator: line:213
        - source_label: EU GMP
          locator: line:214
        children: []
      - nid: cha6.sec7.p6_28
        kind: paragraph
        kind_raw: '6.28'
        num: '6.28'
        ord: 62
        heading: null
        text: This mainly applies to the medicinal product in the package in which it is sold, but consideration should also be given to the inclusion in the programme of bulk product. For example, when the bulk product is stored for a long period before being packaged and/or shipped from a manufacturing site to a packaging site, the impact on the stability of the packaged product should be evaluated and studied under ambient conditions. In addition, consideration should be given to intermediates that are stored and used over prolonged periods. Stability studies on reconstituted product are performed during product development and need not be monitored on an on-going basis. However, when relevant, the stability of reconstituted product can also be monitored.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:215
        - source_label: EU GMP
          locator: line:216
        - source_label: EU GMP
          locator: line:217
        - source_label: EU GMP
          locator: line:218
        - source_label: EU GMP
          locator: line:219
        - source_label: EU GMP
          locator: line:220
        - source_label: EU GMP
          locator: line:221
        - source_label: EU GMP
          locator: line:222
        - source_label: EU GMP
          locator: line:223
        children: []
      - nid: cha6.sec7.p6_29
        kind: paragraph
        kind_raw: '6.29'
        num: '6.29'
        ord: 63
        heading: null
        text: The on-going stability programme should be described in a written protocol following the general rules of Chapter 4 and results formalised as a report. The equipment used for the on-going stability programme (stability chambers among others) should be qualified and maintained following the general rules of Chapter 3 and Annex 15.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:224
        - source_label: EU GMP
          locator: line:225
        - source_label: EU GMP
          locator: line:226
        - source_label: EU GMP
          locator: line:227
        children: []
      - nid: cha6.sec7.p6_30
        kind: paragraph
        kind_raw: '6.30'
        num: '6.30'
        ord: 64
        heading: null
        text: 'The protocol for an on-going stability programme should extend to the end of the shelf life period and should include, but not be limited to, the following parameters:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
