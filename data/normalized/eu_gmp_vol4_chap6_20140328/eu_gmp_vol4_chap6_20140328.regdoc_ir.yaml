  - nid: cha6
    kind: chapter
    kind_raw: Chapter
    num: '6'
    ord: 2
    heading: Quality Control
    text: 'Legal basis for publishing the detailed guidelines: Article 47 of Directive 2001/83/EC on the Community code relating to medicinal products for human use and Article 51 of Directive 2001/82/EC on the Community code relating to veterinary medicinal products. This document provides guidance for the interpretation of the principles and guidelines of good manufacturing practice (GMP) for medicinal products as laid down in Directive 2003/94/EC for medicinal products for human use and Directive 91/412/EEC for veterinary use. Status of the document: Revision Reasons for changes: Inclusion of a new section on technical transfer of testing methods and other items such as Out Of Specification results. Deadline for coming into operation: 1 October 2014'
    role: structural
    normativity: null
