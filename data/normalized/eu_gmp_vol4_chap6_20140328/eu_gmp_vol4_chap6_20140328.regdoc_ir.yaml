        kind: paragraph
        kind_raw: '6.37'
        num: '6.37'
        ord: 80
        heading: null
        text: Prior to transferring a test method, the transferring site should verify that the test method(s) comply with those as described in the Marketing Authorisation or the relevant technical dossier. The original validation of the test method(s) should be reviewed to ensure compliance with current ICH/VICH requirements. A gap analysis should be performed and documented to identify any supplementary validation that should be performed, prior to commencing the technical transfer process.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
