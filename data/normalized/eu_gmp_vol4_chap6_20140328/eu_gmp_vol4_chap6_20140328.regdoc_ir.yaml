      - nid: cha6.sec7.p6_31
        kind: paragraph
        kind_raw: '6.31'
        num: '6.31'
        ord: 73
        heading: null
        text: The protocol for the on-going stability programme can be different from that of the initial longterm stability study as submitted in the marketing authorisation dossier provided that this is justified and documented in the protocol (for example the frequency of testing, or when updating to ICH/VICH recommendations).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:241
        - source_label: EU GMP
          locator: line:242
        - source_label: EU GMP
          locator: line:243
        - source_label: EU GMP
          locator: line:244
        children: []
      - nid: cha6.sec7.p6_32
        kind: paragraph
        kind_raw: '6.32'
        num: '6.32'
        ord: 74
        heading: null
        text: The number of batches and frequency of testing should provide a sufficient amount of data to allow for trend analysis. Unless otherwise justified, at least one batch per year of product manufactured in every strength and every primary packaging type, if relevant, should be included in the stability programme (unless none are produced during that year). For products where on-going stability monitoring would normally require testing using animals and no appropriate alternative, validated techniques are available, the frequency of testing may take account of a risk-benefit approach. The principle of bracketing and matrixing designs may be applied if scientifically justified in the protocol.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:245
        - source_label: EU GMP
          locator: line:246
        - source_label: EU GMP
          locator: line:247
        - source_label: EU GMP
          locator: line:248
        - source_label: EU GMP
          locator: line:249
        - source_label: EU GMP
          locator: line:250
        - source_label: EU GMP
          locator: line:251
        - source_label: EU GMP
          locator: line:252
        children: []
      - nid: cha6.sec7.p6_33
        kind: paragraph
        kind_raw: '6.33'
        num: '6.33'
        ord: 75
        heading: null
        text: In certain situations, additional batches should be included in the on-going stability programme. For example, an on-going stability study should be conducted after any significant change or significant deviation to the process or package. Any reworking, reprocessing or recovery operation should also be considered for inclusion.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:253
        - source_label: EU GMP
          locator: line:254
        - source_label: EU GMP
          locator: line:255
        - source_label: EU GMP
          locator: line:256
        children: []
      - nid: cha6.sec7.p6_34
        kind: paragraph
        kind_raw: '6.34'
        num: '6.34'
        ord: 76
        heading: null
        text: Results of on-going stability studies should be made available to key personnel and, in particular, to the Qualified Person(s). Where on-going stability studies are carried out at a site other than the site of manufacture of the bulk or finished product, there should be a written agreement between the parties concerned. Results of on-going stability studies should be available at the site of manufacture for review by the competent authority.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:257
        - source_label: EU GMP
          locator: line:258
        - source_label: EU GMP
          locator: line:259
        - source_label: EU GMP
          locator: line:260
        - source_label: EU GMP
          locator: line:261
        children: []
      - nid: cha6.sec7.p6_35
        kind: paragraph
        kind_raw: '6.35'
        num: '6.35'
        ord: 77
        heading: null
        text: Out of specification or significant atypical trends should be investigated. Any confirmed out of specification result, or significant negative trend, affecting product batches released on the market should be reported to the relevant competent authorities. The possible impact on batches on the market should be considered in accordance with Chapter 8 of the GMP Guide and in consultation with the relevant competent authorities.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:262
        - source_label: EU GMP
          locator: line:263
        - source_label: EU GMP
          locator: line:264
        - source_label: EU GMP
          locator: line:265
        - source_label: EU GMP
          locator: line:266
        children: []
      - nid: cha6.sec7.p6_36
        kind: paragraph
        kind_raw: '6.36'
        num: '6.36'
        ord: 78
        heading: null
        text: A summary of all the data generated, including any interim conclusions on the programme, should be written and maintained. This summary should be subjected to periodic review.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
