    - nid: cha6.sec1
      kind: section
      kind_raw: null
      num: null
      ord: 3
      heading: Principle
      text: This chapter should be read in conjunction with all relevant sections of the GMP guide Quality Control is concerned with sampling, specifications and testing as well as the organisation, documentation and release procedures which ensure that the necessary and relevant tests are carried out, and that materials are not released for use, nor products released for sale or supply, until their quality has been judged satisfactory. Quality Control is not confined to laboratory operations, but must be involved in all decisions which may concern the quality of the product. The independence of Quality Control from Production is considered fundamental to the satisfactory operation of Quality Control.
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
