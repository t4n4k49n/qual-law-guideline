      - nid: cha6.sec6.p6_18
        kind: paragraph
        kind_raw: '6.18'
        num: '6.18'
        ord: 51
        heading: null
        text: All the in-process controls, including those made in the production area by production personnel, should be performed according to methods approved by Quality Control and the results recorded.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:171
        - source_label: EU GMP
          locator: line:172
        - source_label: EU GMP
          locator: line:173
        children: []
      - nid: cha6.sec6.p6_19
        kind: paragraph
        kind_raw: '6.19'
        num: '6.19'
        ord: 52
        heading: null
        text: Special attention should be given to the quality of laboratory reagents, solutions, glassware, reference standards and culture media. They should be prepared and controlled in accordance with written procedures. The level of controls should be commensurate to their use and to the available stability data.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:174
        - source_label: EU GMP
          locator: line:175
        - source_label: EU GMP
          locator: line:176
        - source_label: EU GMP
          locator: line:177
        children: []
      - nid: cha6.sec6.p6_20
        kind: paragraph
        kind_raw: '6.20'
        num: '6.20'
        ord: 53
        heading: null
        text: Reference standards should be established as suitable for their intended use. Their qualification and certification as such should be clearly stated and documented. Whenever compendial reference standards from an officially recognised source exist, these should preferably be used as primary reference standards unless fully justified (the use of secondary standards is permitted once their traceability to primary standards has been demonstrated and is documented). These compendial materials should be used for the purpose described in the appropiate monograph unless otherwise authorised by the National Competent Authority.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:178
        - source_label: EU GMP
          locator: line:179
        - source_label: EU GMP
          locator: line:180
        - source_label: EU GMP
          locator: line:181
        - source_label: EU GMP
          locator: line:182
        - source_label: EU GMP
          locator: line:183
        - source_label: EU GMP
          locator: line:184
        children: []
      - nid: cha6.sec6.p6_21
        kind: paragraph
        kind_raw: '6.21'
        num: '6.21'
        ord: 54
        heading: null
        text: Laboratory reagents, solutions, reference standards and culture media should be marked with the preparation and opening date and the signature of the person who prepared them. The expiry date of reagents and culture media should be indicated on the label, together with specific storage conditions. In addition, for volumetric solutions, the last date of standardisation and the last current factor should be indicated.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:185
        - source_label: EU GMP
          locator: line:187
        - source_label: EU GMP
          locator: line:188
        - source_label: EU GMP
          locator: line:189
        - source_label: EU GMP
          locator: line:190
        children: []
      - nid: cha6.sec6.p6_22
        kind: paragraph
        kind_raw: '6.22'
        num: '6.22'
        ord: 55
        heading: null
        text: Where necessary, the date of receipt of any substance used for testing operations (e.g. reagents, solutions and reference standards) should be indicated on the container. Instructions for use and storage should be followed. In certain cases it may be necessary to carry out an identification test and/or other testing of reagent materials upon receipt or before use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:191
        - source_label: EU GMP
          locator: line:192
        - source_label: EU GMP
          locator: line:193
        - source_label: EU GMP
          locator: line:194
        children: []
      - nid: cha6.sec6.p6_23
        kind: paragraph
        kind_raw: '6.23'
        num: '6.23'
        ord: 56
        heading: null
        text: Culture media should be prepared in accordance with the media manufacturer’s requirements unless scientifically justified. The performance of all culture media should be verified prior to use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:195
        - source_label: EU GMP
          locator: line:196
        - source_label: EU GMP
          locator: line:197
        children: []
      - nid: cha6.sec6.p6_24
        kind: paragraph
        kind_raw: '6.24'
        num: '6.24'
        ord: 57
        heading: null
        text: Used microbiological media and strains should be decontaminated according to a standard procedure and disposed of in a manner to prevent the cross-contamination and retention of residues. The in-use shelf life of microbiological media should be established, documented and scientifically justified.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:198
        - source_label: EU GMP
          locator: line:199
        - source_label: EU GMP
          locator: line:200
        - source_label: EU GMP
          locator: line:201
        children: []
      - nid: cha6.sec6.p6_25
        kind: paragraph
        kind_raw: '6.25'
        num: '6.25'
        ord: 58
        heading: null
        text: Animals used for testing components, materials or products, should, where appropriate, be quarantined before use. They should be maintained and controlled in a manner that assures their suitability for the intended use. They should be identified, and adequate records should be maintained, showing the history of their use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
