candidate_visibility:
  allow_rules: []
  deny_rules: []

selectable_kinds:
  - subitem
  - item
  - paragraph
  - statement
  - table_row

grouping_policy:
  - when_kind: subitem
    group_under_kind: item
  - when_kind: item
    group_under_kind: paragraph
  - when_kind: paragraph
    group_under_kind: article
  - when_kind: statement
    group_under_kind: article
  - when_kind: table_row
    group_under_kind: table

context_display_policy:
  - when_kind: subitem
    include_ancestors_until_kind: article
    include_headings: true
    include_chapeau_text: true
    include_descendants: true
    include_descendants_of: selected
    include_descendants_kinds:
      - note
    include_descendants_max_depth: 2
  - when_kind: item
    include_ancestors_until_kind: article
    include_headings: true
    include_chapeau_text: true
    include_descendants: true
    include_descendants_of: selected
    include_descendants_kinds:
      - note
    include_descendants_max_depth: 2
  - when_kind: paragraph
    include_ancestors_until_kind: article
    include_headings: true
    include_chapeau_text: true
    include_descendants: true
    include_descendants_of: selected
    include_descendants_kinds:
      - note
    include_descendants_max_depth: 2
  - when_kind: statement
    include_ancestors_until_kind: article
    include_headings: true
    include_chapeau_text: true
    include_descendants: true
    include_descendants_of: selected
    include_descendants_kinds:
      - note
    include_descendants_max_depth: 2
  - when_kind: table_row
    include_ancestors_until_kinds:
      - article
      - section
      - annex
      - appendix
    include_headings: true
    include_chapeau_text: false
    include_descendants: true
    include_descendants_of: ancestors
    include_descendants_kinds:
      - note
    include_descendants_max_depth: 3
    suppress_duplicate_headings: true

render_templates:
  table_row:
    render_as: markdown_table
    show_table_heading: once
    show_header: true
