      - nid: part11.subptb.sec11_10
        kind: section
        kind_raw: §
        num: '11.10'
        ord: 41
        heading: Controls for closed systems.
        text: 'Persons who use closed systems to create, modify, maintain, or transmit electronic records shall employ procedures and controls designed to ensure the authenticity, integrity, and, when appropriate, the confidentiality of electronic records, and to ensure that the signer cannot readily repudiate the signed record as not genuine. Such procedures and controls shall include the following:'
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='11.10']
        children:
        - nid: part11.subptb.sec11_10.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 42
          heading: null
          text: Validation of systems to ensure accuracy, reliability, consistent intended performance, and the ability to discern invalid or altered records.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part11.subptb.sec11_10.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 43
          heading: null
          text: The ability to generate accurate and complete copies of records in both human readable and electronic form suitable for inspection, review, and copying by the agency. Persons should contact the agency if there are any questions regarding the ability of the agency to perform such review and copying of the electronic records.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part11.subptb.sec11_10.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 44
          heading: null
          text: Protection of records to enable their accurate and ready retrieval throughout the records retention period.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        - nid: part11.subptb.sec11_10.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 45
          heading: null
          text: Limiting system access to authorized individuals.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[5]
          children: []
        - nid: part11.subptb.sec11_10.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 46
          heading: null
          text: Use of secure, computer-generated, time-stamped audit trails to independently record the date and time of operator entries and actions that create, modify, or delete electronic records. Record changes shall not obscure previously recorded information. Such audit trail documentation shall be retained for a period at least as long as that required for the subject electronic records and shall be available for agency review and copying.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[6]
          children: []
        - nid: part11.subptb.sec11_10.pf
          kind: paragraph
          kind_raw: (f)
          num: f
          ord: 47
          heading: null
          text: Use of operational system checks to enforce permitted sequencing of steps and events, as appropriate.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[7]
          children: []
        - nid: part11.subptb.sec11_10.pg
          kind: paragraph
          kind_raw: (g)
          num: g
          ord: 48
          heading: null
          text: Use of authority checks to ensure that only authorized individuals can use the system, electronically sign a record, access the operation or computer system input or output device, alter a record, or perform the operation at hand.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[8]
          children: []
        - nid: part11.subptb.sec11_10.ph
          kind: paragraph
          kind_raw: (h)
          num: h
          ord: 49
          heading: null
          text: Use of device (e.g., terminal) checks to determine, as appropriate, the validity of the source of data input or operational instruction.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[9]
          children: []
        - nid: part11.subptb.sec11_10.pi
          kind: paragraph
          kind_raw: (i)
          num: i
          ord: 50
          heading: null
          text: Determination that persons who develop, maintain, or use electronic record/electronic signature systems have the education, training, and experience to perform their assigned tasks.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[10]
          children: []
        - nid: part11.subptb.sec11_10.pj
          kind: paragraph
          kind_raw: (j)
          num: j
          ord: 51
          heading: null
          text: The establishment of, and adherence to, written policies that hold individuals accountable and responsible for actions initiated under their electronic signatures, in order to deter record and signature falsification.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[11]
          children: []
        - nid: part11.subptb.sec11_10.pk
          kind: paragraph
          kind_raw: (k)
          num: k
          ord: 52
          heading: null
          text: 'Use of appropriate controls over systems documentation including:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[12]
          children:
          - nid: part11.subptb.sec11_10.pk.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 53
            heading: null
            text: Adequate controls over the distribution of, access to, and use of documentation for system operation and maintenance.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[13]
            children: []
          - nid: part11.subptb.sec11_10.pk.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 54
            heading: null
            text: Revision and change control procedures to maintain an audit trail that documents time-sequenced development and modification of systems documentation.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[14]
            children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-11.10
            citation: 21 CFR 11.10
      - nid: part11.subptb.sec11_30
        kind: section
        kind_raw: §
        num: '11.30'
        ord: 55
        heading: Controls for open systems.
        text: Persons who use open systems to create, modify, maintain, or transmit electronic records shall employ procedures and controls designed to ensure the authenticity, integrity, and, as appropriate, the confidentiality of electronic records from the point of their creation to the point of their receipt. Such procedures and controls shall include those identified in § 11.10, as appropriate, and additional measures such as document encryption and use of appropriate digital signature standards to ensure, as necessary under the circumstances, record authenticity, integrity, and confidentiality.
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='11.30']
        children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-11.30
            citation: 21 CFR 11.30
      - nid: part11.subptb.sec11_50
        kind: section
        kind_raw: §
        num: '11.50'
        ord: 56
        heading: Signature manifestations.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='11.50']
        children:
        - nid: part11.subptb.sec11_50.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 57
          heading: null
          text: 'Signed electronic records shall contain information associated with the signing that clearly indicates all of the following:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children:
          - nid: part11.subptb.sec11_50.pa.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 58
            heading: null
            text: The printed name of the signer;
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[2]
            children: []
          - nid: part11.subptb.sec11_50.pa.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 59
            heading: null
            text: The date and time when the signature was executed; and
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[3]
            children: []
          - nid: part11.subptb.sec11_50.pa.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 60
            heading: null
            text: The meaning (such as review, approval, responsibility, or authorship) associated with the signature.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[4]
            children: []
        - nid: part11.subptb.sec11_50.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 61
          heading: null
          text: The items identified in paragraphs (a)(1), (a)(2), and (a)(3) of this section shall be subject to the same controls as for electronic records and shall be included as part of any human readable form of the electronic record (such as electronic display or printout).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[5]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-11.50
            citation: 21 CFR 11.50
      - nid: part11.subptb.sec11_70
        kind: section
        kind_raw: §
        num: '11.70'
        ord: 62
        heading: Signature/record linking.
        text: Electronic signatures and handwritten signatures executed to electronic records shall be linked to their respective electronic records to ensure that the signatures cannot be excised, copied, or otherwise transferred to falsify an electronic record by ordinary means.
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='11.70']
        children: []
