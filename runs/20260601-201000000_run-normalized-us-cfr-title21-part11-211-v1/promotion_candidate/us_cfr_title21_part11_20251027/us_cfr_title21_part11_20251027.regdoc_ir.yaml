      - nid: part11.subpta.sec11_2
        kind: section
        kind_raw: §
        num: '11.2'
        ord: 23
        heading: Implementation.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='11.2']
        children:
        - nid: part11.subpta.sec11_2.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 24
          heading: null
          text: For records required to be maintained but not submitted to the agency, persons may use electronic records in lieu of paper records or electronic signatures in lieu of traditional signatures, in whole or in part, provided that the requirements of this part are met.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part11.subpta.sec11_2.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 25
          heading: null
          text: 'For records submitted to the agency, persons may use electronic records in lieu of paper records or electronic signatures in lieu of traditional signatures, in whole or in part, provided that:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children:
          - nid: part11.subpta.sec11_2.pb.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 26
            heading: null
            text: The requirements of this part are met; and
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[3]
            children: []
          - nid: part11.subpta.sec11_2.pb.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 27
            heading: null
            text: The document or parts of a document to be submitted have been identified in public docket No. 92S-0251 as being the type of submission the agency accepts in electronic form. This docket will identify specifically what types of documents or parts of documents are acceptable for submission in electronic form without paper records and the agency receiving unit(s) (e.g., specific center, office, division, branch) to which such submissions may be made. Documents to agency receiving unit(s) not specified in the public docket will not be considered as official if they are submitted in electronic form; paper forms of such documents will be considered as official and must accompany any electronic records. Persons are expected to consult with the intended agency receiving unit for details on how (e.g., method of transmission, media, file formats, and technical protocols) and whether to proceed with the electronic submission.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[4]
            children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-11.2
            citation: 21 CFR 11.2
      - nid: part11.subpta.sec11_3
