        children:
        - nid: part11.subpta.sec11_3.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 29
          heading: null
          text: The definitions and interpretations of terms contained in section 201 of the act apply to those terms when used in this part.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part11.subpta.sec11_3.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 30
          heading: null
          text: 'The following definitions of terms also apply to this part:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children:
          - nid: part11.subpta.sec11_3.pb.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 31
            heading: null
            text: Act means the Federal Food, Drug, and Cosmetic Act (secs. 201-903 (21 U.S.C. 321-393)).
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[3]
            children: []
          - nid: part11.subpta.sec11_3.pb.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 32
            heading: null
            text: Agency means the Food and Drug Administration.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[4]
            children: []
          - nid: part11.subpta.sec11_3.pb.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 33
            heading: null
            text: Biometrics means a method of verifying an individual's identity based on measurement of the individual's physical feature(s) or repeatable action(s) where those features and/or actions are both unique to that individual and measurable.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[5]
            children: []
          - nid: part11.subpta.sec11_3.pb.i4
            kind: item
            kind_raw: (4)
            num: '4'
            ord: 34
            heading: null
            text: Closed system means an environment in which system access is controlled by persons who are responsible for the content of electronic records that are on the system.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[6]
            children: []
          - nid: part11.subpta.sec11_3.pb.i5
            kind: item
            kind_raw: (5)
            num: '5'
            ord: 35
            heading: null
            text: Digital signature means an electronic signature based upon cryptographic methods of originator authentication, computed by using a set of rules and a set of parameters such that the identity of the signer and the integrity of the data can be verified.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[7]
            children: []
          - nid: part11.subpta.sec11_3.pb.i6
            kind: item
            kind_raw: (6)
            num: '6'
            ord: 36
            heading: null
            text: Electronic record means any combination of text, graphics, data, audio, pictorial, or other information representation in digital form that is created, modified, maintained, archived, retrieved, or distributed by a computer system.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[8]
            children: []
          - nid: part11.subpta.sec11_3.pb.i7
            kind: item
            kind_raw: (7)
            num: '7'
            ord: 37
            heading: null
            text: Electronic signature means a computer data compilation of any symbol or series of symbols executed, adopted, or authorized by an individual to be the legally binding equivalent of the individual's handwritten signature.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[9]
            children: []
          - nid: part11.subpta.sec11_3.pb.i8
            kind: item
            kind_raw: (8)
            num: '8'
            ord: 38
            heading: null
            text: Handwritten signature means the scripted name or legal mark of an individual handwritten by that individual and executed or adopted with the present intention to authenticate a writing in a permanent form. The act of signing with a writing or marking instrument such as a pen or stylus is preserved. The scripted name or legal mark, while conventionally applied to paper, may also be applied to other devices that capture the name or mark.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[10]
            children: []
          - nid: part11.subpta.sec11_3.pb.i9
            kind: item
            kind_raw: (9)
            num: '9'
            ord: 39
            heading: null
            text: Open system means an environment in which system access is not controlled by persons who are responsible for the content of electronic records that are on the system.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[11]
            children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-11.3
            citation: 21 CFR 11.3
