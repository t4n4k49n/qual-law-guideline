          citation: 21 CFR Part 11 Subpart B
    - nid: part11.subptc
      kind: subpart
      kind_raw: Subpart
      num: C
      ord: 63
      heading: Electronic Signatures
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: CFR
        locator: DIV6[@N='C']
      children:
      - nid: part11.subptc.sec11_100
        kind: section
        kind_raw: §
        num: '11.100'
        ord: 64
        heading: General requirements.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='11.100']
        children:
        - nid: part11.subptc.sec11_100.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 65
          heading: null
          text: Each electronic signature shall be unique to one individual and shall not be reused by, or reassigned to, anyone else.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part11.subptc.sec11_100.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 66
          heading: null
          text: Before an organization establishes, assigns, certifies, or otherwise sanctions an individual's electronic signature, or any element of such electronic signature, the organization shall verify the identity of the individual.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part11.subptc.sec11_100.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 67
          heading: null
          text: Persons using electronic signatures shall, prior to or at the time of such use, certify to the agency that the electronic signatures in their system, used on or after August 20, 1997, are intended to be the legally binding equivalent of traditional handwritten signatures.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children:
          - nid: part11.subptc.sec11_100.pc.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 68
            heading: null
            text: The certification shall be signed with a traditional handwritten signature and submitted in electronic or paper form. Information on where to submit the certification can be found on FDA's web page on Letters of Non-Repudiation Agreement.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[4]
            children: []
          - nid: part11.subptc.sec11_100.pc.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 69
            heading: null
            text: Persons using electronic signatures shall, upon agency request, provide additional certification or testimony that a specific electronic signature is the legally binding equivalent of the signer's handwritten signature.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[5]
            children: []
        - nid: part11.subptc.sec11_100.note
          kind: note
          kind_raw: CITA
          num: null
          ord: 70
          heading: null
          text: '[62 FR 13464, Mar. 20, 1997, as amended at 88 FR 13018, Mar. 2, 2023]'
          role: informative
          normativity: null
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: DIV8[@N='11.100']/CITA[1]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-11.100
            citation: 21 CFR 11.100
      - nid: part11.subptc.sec11_200
        kind: section
        kind_raw: §
        num: '11.200'
        ord: 71
        heading: Electronic signature components and controls.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='11.200']
        children:
        - nid: part11.subptc.sec11_200.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 72
          heading: null
          text: 'Electronic signatures that are not based upon biometrics shall:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children:
          - nid: part11.subptc.sec11_200.pa.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 73
            heading: null
            text: Employ at least two distinct identification components such as an identification code and password.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[2]
            children:
            - nid: part11.subptc.sec11_200.pa.i1.sii
              kind: subitem
              kind_raw: (i)
              num: i
              ord: 74
              heading: null
              text: When an individual executes a series of signings during a single, continuous period of controlled system access, the first signing shall be executed using all electronic signature components; subsequent signings shall be executed using at least one electronic signature component that is only executable by, and designed to be used only by, the individual.
              role: normative
              normativity: must
              tags: []
              refs:
                internal: []
                external: []
              source_spans:
              - source_label: CFR
                locator: P[3]
              children: []
            - nid: part11.subptc.sec11_200.pa.i1.siii
              kind: subitem
              kind_raw: (ii)
              num: ii
              ord: 75
              heading: null
              text: When an individual executes one or more signings not performed during a single, continuous period of controlled system access, each signing shall be executed using all of the electronic signature components.
              role: normative
              normativity: must
              tags: []
              refs:
                internal: []
                external: []
              source_spans:
              - source_label: CFR
                locator: P[4]
              children: []
          - nid: part11.subptc.sec11_200.pa.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 76
            heading: null
            text: Be used only by their genuine owners; and
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[5]
            children: []
          - nid: part11.subptc.sec11_200.pa.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 77
            heading: null
            text: Be administered and executed to ensure that attempted use of an individual's electronic signature by anyone other than its genuine owner requires collaboration of two or more individuals.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[6]
            children: []
        - nid: part11.subptc.sec11_200.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 78
          heading: null
          text: Electronic signatures based upon biometrics shall be designed to ensure that they cannot be used by anyone other than their genuine owners.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[7]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-11.200
            citation: 21 CFR 11.200
      - nid: part11.subptc.sec11_300
        kind: section
        kind_raw: §
        num: '11.300'
        ord: 79
        heading: Controls for identification codes/passwords.
        text: 'Persons who use electronic signatures based upon use of identification codes in combination with passwords shall employ controls to ensure their security and integrity. Such controls shall include:'
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='11.300']
        children:
        - nid: part11.subptc.sec11_300.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 80
          heading: null
          text: Maintaining the uniqueness of each combined identification code and password, such that no two individuals have the same combination of identification code and password.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part11.subptc.sec11_300.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 81
          heading: null
          text: Ensuring that identification code and password issuances are periodically checked, recalled, or revised (e.g., to cover such events as password aging).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part11.subptc.sec11_300.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 82
          heading: null
          text: Following loss management procedures to electronically deauthorize lost, stolen, missing, or otherwise potentially compromised tokens, cards, and other devices that bear or generate identification code or password information, and to issue temporary or permanent replacements using suitable, rigorous controls.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        - nid: part11.subptc.sec11_300.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 83
          heading: null
          text: Use of transaction safeguards to prevent unauthorized use of passwords and/or identification codes, and to detect and report in an immediate and urgent manner any attempts at their unauthorized use to the system security unit, and, as appropriate, to organizational management.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[5]
          children: []
        - nid: part11.subptc.sec11_300.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 84
          heading: null
          text: Initial and periodic testing of devices, such as tokens or cards, that bear or generate identification code or password information to ensure that they function properly and have not been altered in an unauthorized manner.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[6]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-11.300
            citation: 21 CFR 11.300
      data:
        hierarchy_metadata:
          path: /on/_SUBSTITUTE_DATE_/title-21/part-11/subpart-C
          citation: 21 CFR Part 11 Subpart C
