        children:
        - nid: part11.subpta.sec11_1.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 6
          heading: null
          text: The regulations in this part set forth the criteria under which the agency considers electronic records, electronic signatures, and handwritten signatures executed to electronic records to be trustworthy, reliable, and generally equivalent to paper records and handwritten signatures executed on paper.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part11.subpta.sec11_1.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 7
          heading: null
          text: This part applies to records in electronic form that are created, modified, maintained, archived, retrieved, or transmitted, under any records requirements set forth in agency regulations. This part also applies to electronic records submitted to the agency under requirements of the Federal Food, Drug, and Cosmetic Act and the Public Health Service Act, even if such records are not specifically identified in agency regulations. However, this part does not apply to paper records that are, or have been, transmitted by electronic means.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part11.subpta.sec11_1.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 8
          heading: null
          text: Where electronic signatures and their associated electronic records meet the requirements of this part, the agency will consider the electronic signatures to be equivalent to full handwritten signatures, initials, and other general signings as required by agency regulations, unless specifically excepted by regulation(s) effective on or after August 20, 1997.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part11.subpta.sec11_1.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 9
          heading: null
          text: Electronic records that meet the requirements of this part may be used in lieu of paper records, in accordance with § 11.2, unless paper records are specifically required.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        - nid: part11.subpta.sec11_1.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 10
          heading: null
          text: Computer systems (including hardware and software), controls, and attendant documentation maintained under this part shall be readily available for, and subject to, FDA inspection.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[5]
          children: []
        - nid: part11.subpta.sec11_1.pf
          kind: paragraph
          kind_raw: (f)
          num: f
          ord: 11
          heading: null
          text: This part does not apply to records required to be established or maintained by §§ 1.326 through 1.368 of this chapter. Records that satisfy the requirements of part 1, subpart J of this chapter, but that also are required under other applicable statutory provisions or regulations, remain subject to this part.
          role: normative
          normativity: must
          tags: []
          refs:
