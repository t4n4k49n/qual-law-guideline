            locator: P[1]
          children: []
        - nid: part211.subptj.sec211_198.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 365
          heading: null
          text: A written record of each complaint shall be maintained in a file designated for drug product complaints. The file regarding such drug product complaints shall be maintained at the establishment where the drug product involved was manufactured, processed, or packed, or such file may be maintained at another facility if the written records in such files are readily available for inspection at that other facility. Written records involving a drug product shall be maintained until at least 1 year after the expiration date of the drug product, or 1 year after the date that the complaint was received, whichever is longer. In the case of certain OTC drug products lacking expiration dating because they meet the criteria for exemption under § 211.137, such written records shall be maintained for 3 years after distribution of the drug product.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children:
          - nid: part211.subptj.sec211_198.pb.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 366
            heading: null
            text: 'The written record shall include the following information, where known: the name and strength of the drug product, lot number, name of complainant, nature of complaint, and reply to complainant.'
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[3]
            children: []
          - nid: part211.subptj.sec211_198.pb.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 367
            heading: null
            text: Where an investigation under § 211.192 is conducted, the written record shall include the findings of the investigation and followup. The record or copy of the record of the investigation shall be maintained at the establishment where the investigation occurred in accordance with § 211.180(c).
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[4]
            children: []
          - nid: part211.subptj.sec211_198.pb.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 368
            heading: null
            text: Where an investigation under § 211.192 is not conducted, the written record shall include the reason that an investigation was found not to be necessary and the name of the responsible person making such a determination.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[5]
            children: []
