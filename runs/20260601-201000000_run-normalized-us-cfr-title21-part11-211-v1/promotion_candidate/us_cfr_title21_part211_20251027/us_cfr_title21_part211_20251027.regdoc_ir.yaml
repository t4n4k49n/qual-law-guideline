      - nid: part211.subptd.sec211_72
        kind: section
        kind_raw: §
        num: '211.72'
        ord: 90
        heading: Filters.
        text: Filters for liquid filtration used in the manufacture, processing, or packing of injectable drug products intended for human use shall not release fibers into such products. Fiber-releasing filters may be used when it is not possible to manufacture such products without the use of these filters. If use of a fiber-releasing filter is necessary, an additional nonfiber-releasing filter having a maximum nominal pore size rating of 0.2 micron (0.45 micron if the manufacturing conditions so dictate) shall subsequently be used to reduce the content of particles in the injectable drug product. The use of an asbestos-containing filter is prohibited.
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.72']
        children:
