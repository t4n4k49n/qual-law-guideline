      - nid: part211.subptb.sec211_22
        kind: section
        kind_raw: §
        num: '211.22'
        ord: 13
        heading: Responsibilities of quality control unit.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.22']
        children:
        - nid: part211.subptb.sec211_22.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 14
          heading: null
          text: There shall be a quality control unit that shall have the responsibility and authority to approve or reject all components, drug product containers, closures, in-process materials, packaging material, labeling, and drug products, and the authority to review production records to assure that no errors have occurred or, if errors have occurred, that they have been fully investigated. The quality control unit shall be responsible for approving or rejecting drug products manufactured, processed, packed, or held under contract by another company.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subptb.sec211_22.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 15
          heading: null
          text: Adequate laboratory facilities for the testing and approval (or rejection) of components, drug product containers, closures, packaging materials, in-process materials, and drug products shall be available to the quality control unit.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subptb.sec211_22.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 16
          heading: null
          text: The quality control unit shall have the responsibility for approving or rejecting all procedures or specifications impacting on the identity, strength, quality, and purity of the drug product.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part211.subptb.sec211_22.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 17
          heading: null
          text: The responsibilities and procedures applicable to the quality control unit shall be in writing; such written procedures shall be followed.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        data:
          hierarchy_metadata:
