      - nid: part211.subptf.sec211_111
        kind: section
        kind_raw: §
        num: '211.111'
        ord: 167
        heading: Time limitations on production.
        text: When appropriate, time limits for the completion of each phase of production shall be established to assure the quality of the drug product. Deviation from established time limits may be acceptable if such deviation does not compromise the quality of the drug product. Such deviation shall be justified and documented.
        role: structural
