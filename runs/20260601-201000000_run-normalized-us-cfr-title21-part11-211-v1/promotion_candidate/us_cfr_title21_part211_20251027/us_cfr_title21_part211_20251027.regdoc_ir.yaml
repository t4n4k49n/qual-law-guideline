            children: []
        - nid: part211.subpti.sec211_170.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 286
          heading: null
          text: 'An appropriately identified reserve sample that is representative of each lot or batch of drug product shall be retained and stored under conditions consistent with product labeling. The reserve sample shall be stored in the same immediate container-closure system in which the drug product is marketed or in one that has essentially the same characteristics. The reserve sample consists of at least twice the quantity necessary to perform all the required tests, except those for sterility and pyrogens. Except for those for drug products described in paragraph (b)(2) of this section, reserve samples from representative sample lots or batches selected by acceptable statistical procedures shall be examined visually at least once a year for evidence of deterioration unless visual examination would affect the integrity of the reserve sample. Any evidence of reserve sample deterioration shall be investigated in accordance with § 211.192. The results of the examination shall be recorded and maintained with other stability data on the drug product. Reserve samples of compressed medical gases need not be retained. The retention time is as follows:'
