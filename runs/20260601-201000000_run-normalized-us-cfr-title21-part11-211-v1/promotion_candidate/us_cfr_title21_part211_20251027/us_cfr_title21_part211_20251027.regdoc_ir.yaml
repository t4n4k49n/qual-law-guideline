      - nid: part211.subptg.sec211_132
        kind: section
        kind_raw: §
        num: '211.132'
        ord: 206
        heading: Tamper-evident packaging requirements for over-the-counter (OTC) human drug products.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.132']
        children:
        - nid: part211.subptg.sec211_132.note
          kind: note
          kind_raw: XREF
          num: null
          ord: 207
          heading: null
          text: Link to an amendment published at 89 FR 51769, June 18, 2024.
          role: informative
          normativity: null
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: DIV8[@N='211.132']/XREF[1]
          children: []
        - nid: part211.subptg.sec211_132.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 208
          heading: null
          text: General. The Food and Drug Administration has the authority under the Federal Food, Drug, and Cosmetic Act (the act) to establish a uniform national requirement for tamper-evident packaging of OTC drug products that will improve the security of OTC drug packaging and help assure the safety and effectiveness of OTC drug products. An OTC drug product (except a dermatological, dentifrice, insulin, or lozenge product) for retail sale that is not packaged in a tamper-resistant package or that is not properly labeled under this section is adulterated under section 501 of the act or misbranded under section 502 of the act, or both.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subptg.sec211_132.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 209
          heading: null
          text: Requirements for tamper-evident package. (1) Each manufacturer and packer who packages an OTC drug product (except a dermatological, dentifrice, insulin, or lozenge product) for retail sale shall package the product in a tamper-evident package, if this product is accessible to the public while held for sale. A tamper-evident package is one having one or more indicators or barriers to entry which, if breached or missing, can reasonably be expected to provide visible evidence to consumers that tampering has occurred. To reduce the likelihood of successful tampering and to increase the likelihood that consumers will discover if a product has been tampered with, the package is required to be distinctive by design or by the use of one or more indicators or barriers to entry that employ an identifying characteristic (e.g., a pattern, name, registered trademark, logo, or picture). For purposes of this section, the term “distinctive by design” means the packaging cannot be duplicated with commonly available materials or through commonly available processes. A tamper-evident package may involve an immediate-container and closure system or secondary-container or carton system or any combination of systems intended to provide a visual indication of package integrity. The tamper-evident feature shall be designed to and shall remain intact when handled in a reasonable manner during manufacture, distribution, and retail display.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children:
          - nid: part211.subptg.sec211_132.pb.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 210
            heading: null
            text: In addition to the tamper-evident packaging feature described in paragraph (b)(1) of this section, any two-piece, hard gelatin capsule covered by this section must be sealed using an acceptable tamper-evident technology.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[3]
            children: []
        - nid: part211.subptg.sec211_132.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 211
          heading: null
          text: 'Labeling. (1) In order to alert consumers to the specific tamper-evident feature(s) used, each retail package of an OTC drug product covered by this section (except ammonia inhalant in crushable glass ampules, containers of compressed medical oxygen, or aerosol products that depend upon the power of a liquefied or compressed gas to expel the contents from the container) is required to bear a statement that:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        - nid: part211.subptg.sec211_132.pi
          kind: paragraph
          kind_raw: (i)
          num: i
          ord: 212
          heading: null
          text: Identifies all tamper-evident feature(s) and any capsule sealing technologies used to comply with paragraph (b) of this section;
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[5]
          children: []
        - nid: part211.subptg.sec211_132.pii
          kind: paragraph
          kind_raw: (ii)
          num: ii
          ord: 213
          heading: null
          text: Is prominently placed on the package; and
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[6]
          children: []
        - nid: part211.subptg.sec211_132.piii
          kind: paragraph
          kind_raw: (iii)
          num: iii
          ord: 214
          heading: null
          text: Is so placed that it will be unaffected if the tamper-evident feature of the package is breached or missing.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[7]
          children:
          - nid: part211.subptg.sec211_132.piii.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 215
            heading: null
            text: If the tamper-evident feature chosen to meet the requirements in paragraph (b) of this section uses an identifying characteristic, that characteristic is required to be referred to in the labeling statement. For example, the labeling statement on a bottle with a shrink band could say “For your protection, this bottle has an imprinted seal around the neck.”
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[8]
            children:
            - nid: part211.subptg.sec211_132.piii.i2.sid
              kind: subitem
              kind_raw: (d)
              num: d
              ord: 216
              heading: null
              text: 'Request for exemptions from packaging and labeling requirements. A manufacturer or packer may request an exemption from the packaging and labeling requirements of this section. A request for an exemption is required to be submitted in the form of a citizen petition under § 10.30 of this chapter and should be clearly identified on the envelope as a “Request for Exemption from the Tamper-Evident Packaging Rule.” The petition is required to contain the following:'
              role: normative
              normativity: must
              tags: []
              refs:
                internal: []
                external: []
              source_spans:
              - source_label: CFR
                locator: P[9]
              children: []
          - nid: part211.subptg.sec211_132.piii.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 217
            heading: null
            text: The name of the drug product or, if the petition seeks an exemption for a drug class, the name of the drug class, and a list of products within that class.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[10]
            children: []
          - nid: part211.subptg.sec211_132.piii.i2_2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 218
            heading: null
            text: The reasons that the drug product's compliance with the tamper-evident packaging or labeling requirements of this section is unnecessary or cannot be achieved.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[11]
            children: []
          - nid: part211.subptg.sec211_132.piii.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 219
            heading: null
            text: A description of alternative steps that are available, or that the petitioner has already taken, to reduce the likelihood that the product or drug class will be the subject of malicious adulteration.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[12]
            children: []
          - nid: part211.subptg.sec211_132.piii.i4
            kind: item
            kind_raw: (4)
            num: '4'
            ord: 220
            heading: null
            text: Other information justifying an exemption.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[13]
            children: []
        - nid: part211.subptg.sec211_132.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 221
          heading: null
          text: OTC drug products subject to approved new drug applications. Holders of approved new drug applications for OTC drug products are required under § 314.70 of this chapter to provide the agency with notification of changes in packaging and labeling to comply with the requirements of this section. Changes in packaging and labeling required by this regulation may be made before FDA approval, as provided under § 314.70(c) of this chapter. Manufacturing changes by which capsules are to be sealed require prior FDA approval under § 314.70(b) of this chapter.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[14]
          children: []
        - nid: part211.subptg.sec211_132.pf
          kind: paragraph
          kind_raw: (f)
          num: f
          ord: 222
          heading: null
          text: Poison Prevention Packaging Act of 1970. This section does not affect any requirements for “special packaging” as defined under § 310.3(l) of this chapter and required under the Poison Prevention Packaging Act of 1970.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[15]
          children: []
