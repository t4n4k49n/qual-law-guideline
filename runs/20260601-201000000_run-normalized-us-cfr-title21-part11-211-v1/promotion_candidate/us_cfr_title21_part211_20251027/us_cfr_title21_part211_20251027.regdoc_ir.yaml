    - nid: part211.subpti
      kind: subpart
      kind_raw: Subpart
      num: I
      ord: 245
      heading: Laboratory Controls
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: CFR
        locator: DIV6[@N='I']
      children:
      - nid: part211.subpti.sec211_160
        kind: section
        kind_raw: §
        num: '211.160'
        ord: 246
        heading: General requirements.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.160']
        children:
        - nid: part211.subpti.sec211_160.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 247
          heading: null
          text: The establishment of any specifications, standards, sampling plans, test procedures, or other laboratory control mechanisms required by this subpart, including any change in such specifications, standards, sampling plans, test procedures, or other laboratory control mechanisms, shall be drafted by the appropriate organizational unit and reviewed and approved by the quality control unit. The requirements in this subpart shall be followed and shall be documented at the time of performance. Any deviation from the written specifications, standards, sampling plans, test procedures, or other laboratory control mechanisms shall be recorded and justified.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subpti.sec211_160.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 248
          heading: null
          text: 'Laboratory controls shall include the establishment of scientifically sound and appropriate specifications, standards, sampling plans, and test procedures designed to assure that components, drug product containers, closures, in-process materials, labeling, and drug products conform to appropriate standards of identity, strength, quality, and purity. Laboratory controls shall include:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children:
          - nid: part211.subpti.sec211_160.pb.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 249
            heading: null
            text: Determination of conformity to applicable written specifications for the acceptance of each lot within each shipment of components, drug product containers, closures, and labeling used in the manufacture, processing, packing, or holding of drug products. The specifications shall include a description of the sampling and testing procedures used. Samples shall be representative and adequately identified. Such procedures shall also require appropriate retesting of any component, drug product container, or closure that is subject to deterioration.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[3]
            children: []
          - nid: part211.subpti.sec211_160.pb.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 250
            heading: null
            text: Determination of conformance to written specifications and a description of sampling and testing procedures for in-process materials. Such samples shall be representative and properly identified.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[4]
            children: []
          - nid: part211.subpti.sec211_160.pb.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 251
            heading: null
            text: Determination of conformance to written descriptions of sampling procedures and appropriate specifications for drug products. Such samples shall be representative and properly identified.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[5]
            children: []
          - nid: part211.subpti.sec211_160.pb.i4
            kind: item
            kind_raw: (4)
            num: '4'
            ord: 252
            heading: null
            text: The calibration of instruments, apparatus, gauges, and recording devices at suitable intervals in accordance with an established written program containing specific directions, schedules, limits for accuracy and precision, and provisions for remedial action in the event accuracy and/or precision limits are not met. Instruments, apparatus, gauges, and recording devices not meeting established specifications shall not be used.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[6]
            children: []
        - nid: part211.subpti.sec211_160.note
          kind: note
          kind_raw: CITA
          num: null
          ord: 253
          heading: null
          text: '[43 FR 45077, Sept. 29, 1978, as amended at 73 FR 51932, Sept. 8, 2008]'
          role: informative
          normativity: null
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: DIV8[@N='211.160']/CITA[1]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.160
            citation: 21 CFR 211.160
      - nid: part211.subpti.sec211_165
        kind: section
        kind_raw: §
        num: '211.165'
        ord: 254
        heading: Testing and release for distribution.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.165']
        children:
        - nid: part211.subpti.sec211_165.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 255
          heading: null
          text: For each batch of drug product, there shall be appropriate laboratory determination of satisfactory conformance to final specifications for the drug product, including the identity and strength of each active ingredient, prior to release. Where sterility and/or pyrogen testing are conducted on specific batches of shortlived radiopharmaceuticals, such batches may be released prior to completion of sterility and/or pyrogen testing, provided such testing is completed as soon as possible.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subpti.sec211_165.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 256
          heading: null
          text: There shall be appropriate laboratory testing, as necessary, of each batch of drug product required to be free of objectionable microorganisms.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subpti.sec211_165.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 257
          heading: null
          text: Any sampling and testing plans shall be described in written procedures that shall include the method of sampling and the number of units per batch to be tested; such written procedure shall be followed.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part211.subpti.sec211_165.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 258
          heading: null
          text: Acceptance criteria for the sampling and testing conducted by the quality control unit shall be adequate to assure that batches of drug products meet each appropriate specification and appropriate statistical quality control criteria as a condition for their approval and release. The statistical quality control criteria shall include appropriate acceptance levels and/or appropriate rejection levels.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        - nid: part211.subpti.sec211_165.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 259
          heading: null
          text: The accuracy, sensitivity, specificity, and reproducibility of test methods employed by the firm shall be established and documented. Such validation and documentation may be accomplished in accordance with § 211.194(a)(2).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[5]
          children: []
        - nid: part211.subpti.sec211_165.pf
          kind: paragraph
          kind_raw: (f)
          num: f
          ord: 260
          heading: null
          text: Drug products failing to meet established standards or specifications and any other relevant quality control criteria shall be rejected. Reprocessing may be performed. Prior to acceptance and use, reprocessed material must meet appropriate standards, specifications, and any other relevant criteria.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[6]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.165
            citation: 21 CFR 211.165
      - nid: part211.subpti.sec211_166
        kind: section
        kind_raw: §
        num: '211.166'
        ord: 261
        heading: Stability testing.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.166']
        children:
        - nid: part211.subpti.sec211_166.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 262
          heading: null
          text: 'There shall be a written testing program designed to assess the stability characteristics of drug products. The results of such stability testing shall be used in determining appropriate storage conditions and expiration dates. The written program shall be followed and shall include:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children:
          - nid: part211.subpti.sec211_166.pa.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 263
            heading: null
            text: Sample size and test intervals based on statistical criteria for each attribute examined to assure valid estimates of stability;
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[2]
            children: []
          - nid: part211.subpti.sec211_166.pa.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 264
            heading: null
            text: Storage conditions for samples retained for testing;
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[3]
            children: []
          - nid: part211.subpti.sec211_166.pa.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 265
            heading: null
            text: Reliable, meaningful, and specific test methods;
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[4]
            children: []
          - nid: part211.subpti.sec211_166.pa.i4
            kind: item
            kind_raw: (4)
            num: '4'
            ord: 266
            heading: null
            text: Testing of the drug product in the same container-closure system as that in which the drug product is marketed;
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[5]
            children: []
          - nid: part211.subpti.sec211_166.pa.i5
            kind: item
            kind_raw: (5)
            num: '5'
            ord: 267
            heading: null
            text: Testing of drug products for reconstitution at the time of dispensing (as directed in the labeling) as well as after they are reconstituted.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[6]
            children: []
        - nid: part211.subpti.sec211_166.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 268
          heading: null
          text: An adequate number of batches of each drug product shall be tested to determine an appropriate expiration date and a record of such data shall be maintained. Accelerated studies, combined with basic stability information on the components, drug products, and container-closure system, may be used to support tentative expiration dates provided full shelf life studies are not available and are being conducted. Where data from accelerated studies are used to project a tentative expiration date that is beyond a date supported by actual shelf life studies, there must be stability studies conducted, including drug product testing at appropriate intervals, until the tentative expiration date is verified or the appropriate expiration date determined.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[7]
          children: []
        - nid: part211.subpti.sec211_166.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 269
          heading: null
          text: 'For homeopathic drug products, the requirements of this section are as follows:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[8]
          children:
          - nid: part211.subpti.sec211_166.pc.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 270
            heading: null
            text: There shall be a written assessment of stability based at least on testing or examination of the drug product for compatibility of the ingredients, and based on marketing experience with the drug product to indicate that there is no degradation of the product for the normal or expected period of use.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[9]
            children: []
          - nid: part211.subpti.sec211_166.pc.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 271
            heading: null
            text: Evaluation of stability shall be based on the same container-closure system in which the drug product is being marketed.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[10]
            children: []
        - nid: part211.subpti.sec211_166.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 272
          heading: null
          text: Allergenic extracts that are labeled “No U.S. Standard of Potency” are exempt from the requirements of this section.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[11]
          children: []
        - nid: part211.subpti.sec211_166.note
          kind: note
          kind_raw: CITA
          num: null
          ord: 273
          heading: null
          text: '[43 FR 45077, Sept. 29, 1978, as amended at 46 FR 56412, Nov. 17, 1981]'
          role: informative
