          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        - nid: part211.subptg.sec211_130.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 203
          heading: null
          text: Examination of packaging and labeling materials for suitability and correctness before packaging operations, and documentation of such examination in the batch production record.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
