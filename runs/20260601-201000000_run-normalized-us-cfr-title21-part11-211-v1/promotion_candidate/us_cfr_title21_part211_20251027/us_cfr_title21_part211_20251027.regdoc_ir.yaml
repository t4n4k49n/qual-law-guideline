          kind_raw: (a)
          num: a
          ord: 23
          heading: null
          text: Personnel engaged in the manufacture, processing, packing, or holding of a drug product shall wear clean clothing appropriate for the duties they perform. Protective apparel, such as head, face, hand, and arm coverings, shall be worn as necessary to protect drug products from contamination.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subptb.sec211_28.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 24
          heading: null
          text: Personnel shall practice good sanitation and health habits.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subptb.sec211_28.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 25
          heading: null
          text: Only personnel authorized by supervisory personnel shall enter those areas of the buildings and facilities designated as limited-access areas.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part211.subptb.sec211_28.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 26
          heading: null
          text: Any person shown at any time (either by medical examination or supervisory observation) to have an apparent illness or open lesions that may adversely affect the safety or quality of drug products shall be excluded from direct contact with components, drug product containers, closures, in-process materials, and drug products until the condition is corrected or determined by competent medical personnel not to jeopardize the safety or quality of drug products. All personnel shall be instructed to report to supervisory personnel any health conditions that may have an adverse effect on drug products.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.28
            citation: 21 CFR 211.28
      - nid: part211.subptb.sec211_34
        kind: section
        kind_raw: §
        num: '211.34'
        ord: 27
        heading: Consultants.
        text: Consultants advising on the manufacture, processing, packing, or holding of drug products shall have sufficient education, training, and experience, or any combination thereof, to advise on the subject for which they are retained. Records shall be maintained stating the name, address, and qualifications of any consultants and the type of service they provide.
