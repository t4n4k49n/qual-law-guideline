      - nid: part211.subpth.sec211_150
        kind: section
        kind_raw: §
        num: '211.150'
        ord: 242
        heading: Distribution procedures.
        text: 'Written procedures shall be established, and followed, describing the distribution of drug products. They shall include:'
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.150']
        children:
        - nid: part211.subpth.sec211_150.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 243
          heading: null
          text: A procedure whereby the oldest approved stock of a drug product is distributed first. Deviation from this requirement is permitted if such deviation is temporary and appropriate.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subpth.sec211_150.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 244
          heading: null
          text: A system by which the distribution of each lot of drug product can be readily determined to facilitate its recall if necessary.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
