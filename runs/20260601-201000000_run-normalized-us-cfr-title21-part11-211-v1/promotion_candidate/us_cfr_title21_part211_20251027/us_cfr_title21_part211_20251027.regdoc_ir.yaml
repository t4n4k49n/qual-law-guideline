          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 178
          heading: null
          text: Any labeling or packaging materials meeting appropriate written specifications may be approved and released for use. Any labeling or packaging materials that do not meet such specifications shall be rejected to prevent their use in operations for which they are unsuitable.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
