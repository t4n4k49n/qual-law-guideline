          kind_raw: (d)
          num: d
          ord: 180
          heading: null
          text: Labels and other labeling materials for each different drug product, strength, dosage form, or quantity of contents shall be stored separately with suitable identification. Access to the storage area shall be limited to authorized personnel.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
