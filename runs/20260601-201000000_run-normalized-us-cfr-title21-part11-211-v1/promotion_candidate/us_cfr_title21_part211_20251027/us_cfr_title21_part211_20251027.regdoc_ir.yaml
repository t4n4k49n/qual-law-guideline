        - nid: part211.subpta.sec211_1.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 7
          heading: null
          text: The regulations in this part contain the minimum current good manufacturing practice for preparation of drug products (excluding positron emission tomography drugs) for administration to humans or animals.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subpta.sec211_1.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 8
          heading: null
          text: The current good manufacturing practice regulations in this chapter as they pertain to drug products; in parts 600 through 680 of this chapter, as they pertain to drugs that are also biological products for human use; and in part 1271 of this chapter, as they are applicable to drugs that are also human cells, tissues, and cellular and tissue-based products (HCT/Ps) and that are drugs (subject to review under an application submitted under section 505 of the act or under a biological product license application under section 351 of the Public Health Service Act); supplement and do not supersede the regulations in this part unless the regulations explicitly provide otherwise. In the event of a conflict between applicable regulations in this part and in other parts of this chapter, or in parts 600 through 680 of this chapter, or in part 1271 of this chapter, the regulation specifically applicable to the drug product in question shall supersede the more general.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subpta.sec211_1.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 9
          heading: null
          text: Pending consideration of a proposed exemption, published in the Federal Register of September 29, 1978, the requirements in this part shall not be enforced for OTC drug products if the products and all their ingredients are ordinarily marketed and consumed as human foods, and which products may also fall within the legal definition of drugs by virtue of their intended use. Therefore, until further notice, regulations under parts 110 and 117 of this chapter, and where applicable, parts 113 through 129 of this chapter, shall be applied in determining whether these OTC drug products that are also foods are manufactured, processed, packed, or held under current good manufacturing practice.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
