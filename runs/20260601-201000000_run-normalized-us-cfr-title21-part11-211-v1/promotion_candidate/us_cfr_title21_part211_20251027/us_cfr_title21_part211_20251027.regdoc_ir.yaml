            citation: 21 CFR 211.82
      - nid: part211.subpte.sec211_84
        kind: section
        kind_raw: §
        num: '211.84'
        ord: 102
        heading: Testing and approval or rejection of components, drug product containers, and closures.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.84']
        children:
        - nid: part211.subpte.sec211_84.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 103
          heading: null
          text: Each lot of components, drug product containers, and closures shall be withheld from use until the lot has been sampled, tested, or examined, as appropriate, and released for use by the quality control unit.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subpte.sec211_84.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 104
          heading: null
          text: Representative samples of each shipment of each lot shall be collected for testing or examination. The number of containers to be sampled, and the amount of material to be taken from each container, shall be based upon appropriate criteria such as statistical criteria for component variability, confidence levels, and degree of precision desired, the past quality history of the supplier, and the quantity needed for analysis and reserve where required by § 211.170.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subpte.sec211_84.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 105
          heading: null
          text: 'Samples shall be collected in accordance with the following procedures:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children:
          - nid: part211.subpte.sec211_84.pc.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 106
            heading: null
            text: The containers of components selected shall be cleaned when necessary in a manner to prevent introduction of contaminants into the component.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[4]
            children: []
          - nid: part211.subpte.sec211_84.pc.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 107
            heading: null
            text: The containers shall be opened, sampled, and resealed in a manner designed to prevent contamination of their contents and contamination of other components, drug product containers, or closures.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[5]
            children: []
          - nid: part211.subpte.sec211_84.pc.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 108
            heading: null
            text: Sterile equipment and aseptic sampling techniques shall be used when necessary.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[6]
            children: []
          - nid: part211.subpte.sec211_84.pc.i4
            kind: item
            kind_raw: (4)
            num: '4'
            ord: 109
            heading: null
            text: If it is necessary to sample a component from the top, middle, and bottom of its container, such sample subdivisions shall not be composited for testing.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[7]
            children: []
          - nid: part211.subpte.sec211_84.pc.i5
            kind: item
            kind_raw: (5)
            num: '5'
            ord: 110
            heading: null
            text: 'Sample containers shall be identified so that the following information can be determined: name of the material sampled, the lot number, the container from which the sample was taken, the date on which the sample was taken, and the name of the person who collected the sample.'
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[8]
            children: []
          - nid: part211.subpte.sec211_84.pc.i6
            kind: item
            kind_raw: (6)
            num: '6'
            ord: 111
            heading: null
            text: Containers from which samples have been taken shall be marked to show that samples have been removed from them.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[9]
            children: []
        - nid: part211.subpte.sec211_84.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 112
          heading: null
          text: 'Samples shall be examined and tested as follows:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[10]
          children:
          - nid: part211.subpte.sec211_84.pd.i1
            kind: item
            kind_raw: (1)
            num: '1'
            ord: 113
            heading: null
            text: At least one test shall be conducted to verify the identity of each component of a drug product. Specific identity tests, if they exist, shall be used.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[11]
            children: []
          - nid: part211.subpte.sec211_84.pd.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 114
            heading: null
            text: Each component shall be tested for conformity with all appropriate written specifications for purity, strength, and quality. In lieu of such testing by the manufacturer, a report of analysis may be accepted from the supplier of a component, provided that at least one specific identity test is conducted on such component by the manufacturer, and provided that the manufacturer establishes the reliability of the supplier's analyses through appropriate validation of the supplier's test results at appropriate intervals.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[12]
            children: []
          - nid: part211.subpte.sec211_84.pd.i3
            kind: item
            kind_raw: (3)
            num: '3'
            ord: 115
            heading: null
            text: Containers and closures shall be tested for conformity with all appropriate written specifications. In lieu of such testing by the manufacturer, a certificate of testing may be accepted from the supplier, provided that at least a visual identification is conducted on such containers/closures by the manufacturer and provided that the manufacturer establishes the reliability of the supplier's test results through appropriate validation of the supplier's test results at appropriate intervals.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[13]
            children: []
          - nid: part211.subpte.sec211_84.pd.i4
            kind: item
            kind_raw: (4)
            num: '4'
            ord: 116
            heading: null
            text: When appropriate, components shall be microscopically examined.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[14]
            children: []
          - nid: part211.subpte.sec211_84.pd.i5
            kind: item
            kind_raw: (5)
            num: '5'
            ord: 117
            heading: null
            text: Each lot of a component, drug product container, or closure that is liable to contamination with filth, insect infestation, or other extraneous adulterant shall be examined against established specifications for such contamination.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[15]
            children: []
          - nid: part211.subpte.sec211_84.pd.i6
            kind: item
            kind_raw: (6)
            num: '6'
            ord: 118
            heading: null
            text: Each lot of a component, drug product container, or closure with potential for microbiological contamination that is objectionable in view of its intended use shall be subjected to microbiological tests before use.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[16]
            children: []
        - nid: part211.subpte.sec211_84.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 119
          heading: null
          text: Any lot of components, drug product containers, or closures that meets the appropriate written specifications of identity, strength, quality, and purity and related tests under paragraph (d) of this section may be approved and released for use. Any lot of such material that does not meet such specifications shall be rejected.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[17]
          children: []
        - nid: part211.subpte.sec211_84.note
          kind: note
          kind_raw: CITA
          num: null
          ord: 120
          heading: null
          text: '[43 FR 45077, Sept. 29, 1978, as amended at 63 FR 14356, Mar. 25, 1998; 73 FR 51932, Sept. 8, 2008]'
          role: informative
          normativity: null
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: DIV8[@N='211.84']/CITA[1]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.84
            citation: 21 CFR 211.84
      - nid: part211.subpte.sec211_86
        kind: section
        kind_raw: §
        num: '211.86'
        ord: 121
        heading: Use of approved components, drug product containers, and closures.
        text: Components, drug product containers, and closures approved for use shall be rotated so that the oldest approved stock is used first. Deviation from this requirement is permitted if such deviation is temporary and appropriate.
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.86']
        children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.86
            citation: 21 CFR 211.86
      - nid: part211.subpte.sec211_87
        kind: section
        kind_raw: §
        num: '211.87'
        ord: 122
        heading: Retesting of approved components, drug product containers, and closures.
        text: Components, drug product containers, and closures shall be retested or reexamined, as appropriate, for identity, strength, quality, and purity and approved or rejected by the quality control unit in accordance with § 211.84 as necessary, e.g., after storage for long periods or after exposure to air, heat or other conditions that might adversely affect the component, drug product container, or closure.
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.87']
        children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.87
            citation: 21 CFR 211.87
      - nid: part211.subpte.sec211_89
        kind: section
        kind_raw: §
        num: '211.89'
        ord: 123
        heading: Rejected components, drug product containers, and closures.
        text: Rejected components, drug product containers, and closures shall be identified and controlled under a quarantine system designed to prevent their use in manufacturing or processing operations for which they are unsuitable.
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.89']
        children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.89
            citation: 21 CFR 211.89
      - nid: part211.subpte.sec211_94
        kind: section
        kind_raw: §
        num: '211.94'
        ord: 124
        heading: Drug product containers and closures.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.94']
        children:
        - nid: part211.subpte.sec211_94.note
          kind: note
          kind_raw: XREF
          num: null
          ord: 125
          heading: null
          text: Link to an amendment published at 89 FR 51769, June 18, 2024.
          role: informative
          normativity: null
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: DIV8[@N='211.94']/XREF[1]
          children: []
        - nid: part211.subpte.sec211_94.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 126
          heading: null
          text: Drug product containers and closures shall not be reactive, additive, or absorptive so as to alter the safety, identity, strength, quality, or purity of the drug beyond the official or established requirements.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subpte.sec211_94.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 127
          heading: null
          text: Container closure systems shall provide adequate protection against foreseeable external factors in storage and use that can cause deterioration or contamination of the drug product.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subpte.sec211_94.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 128
          heading: null
          text: Drug product containers and closures shall be clean and, where indicated by the nature of the drug, sterilized and processed to remove pyrogenic properties to assure that they are suitable for their intended use. Such depyrogenation processes shall be validated.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part211.subpte.sec211_94.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 129
          heading: null
          text: Standards or specifications, methods of testing, and, where indicated, methods of cleaning, sterilizing, and processing to remove pyrogenic properties shall be written and followed for drug product containers and closures.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        - nid: part211.subpte.sec211_94.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 130
          heading: null
          text: Medical gas containers and closures must meet the following requirements—(1) Gas-specific use outlet connections. Portable cryogenic medical gas containers that are not manufactured with permanent gas use outlet connections (e.g., those that have been silver-brazed) must have gas-specific use outlet connections that are attached to the valve body so that they cannot be readily removed or replaced (without making the valve inoperable and preventing the containers' use) except by the manufacturer. For the purposes of this paragraph, the term “manufacturer” includes any individual or firm that fills high-pressure medical gas cylinders or cryogenic medical gas containers. For the purposes of this section, a “portable cryogenic medical gas container” is one that is capable of being transported and is intended to be attached to a medical gas supply system within a hospital, health care entity, nursing home, other facility, or home health care setting, or is a base unit used to fill small cryogenic gas containers for use by individual patients. The term does not include cryogenic containers that are not designed to be connected to a medical gas supply system, e.g., tank trucks, trailers, rail cars, or small cryogenic gas containers for use by individual patients (including portable liquid oxygen units as defined at § 868.5655 of this chapter).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[5]
          children:
          - nid: part211.subpte.sec211_94.pe.i2
            kind: item
            kind_raw: (2)
            num: '2'
            ord: 131
            heading: null
            text: Label and coloring requirements. The labeling specified at § 201.328(a) of this chapter must be affixed to the container in a manner that does not interfere with other labeling and such that it is not susceptible to becoming worn or inadvertently detached during normal use. Each such label as well as materials used for coloring medical gas containers must be reasonably resistant to fading, durable when exposed to atmospheric conditions, and not readily soluble in water.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: CFR
              locator: P[6]
            children: []
        - nid: part211.subpte.sec211_94.note_2
          kind: note
          kind_raw: CITA
          num: null
          ord: 132
          heading: null
          text: '[43 FR 45077, Sept. 29, 1978, as amended at 73 FR 51932, Sept. 8, 2008; 81 FR 81697, Nov. 18, 2016]'
          role: informative
          normativity: null
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: DIV8[@N='211.94']/CITA[2]
          children: []
