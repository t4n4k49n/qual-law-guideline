      - nid: part211.subptf.sec211_103
        kind: section
        kind_raw: §
        num: '211.103'
        ord: 150
        heading: Calculation of yield.
        text: Actual yields and percentages of theoretical yield shall be determined at the conclusion of each appropriate phase of manufacturing, processing, packaging, or holding of the drug product. Such calculations shall either be performed by one person and independently verified by a second person, or, if the yield is calculated by automated equipment under § 211.68, be independently verified by one person.
