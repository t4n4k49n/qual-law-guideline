          ord: 302
          heading: null
          text: 'Written records required by this part shall be maintained so that data therein can be used for evaluating, at least annually, the quality standards of each drug product to determine the need for changes in drug product specifications or manufacturing or control procedures. Written procedures shall be established and followed for such evaluations and shall include provisions for:'
