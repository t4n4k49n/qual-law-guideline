    - nid: part211.subpte
      kind: subpart
      kind_raw: Subpart
      num: E
      ord: 92
      heading: Control of Components and Drug Product Containers and Closures
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: CFR
        locator: DIV6[@N='E']
      children:
      - nid: part211.subpte.sec211_80
        kind: section
        kind_raw: §
        num: '211.80'
        ord: 93
        heading: General requirements.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.80']
        children:
        - nid: part211.subpte.sec211_80.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 94
          heading: null
          text: There shall be written procedures describing in sufficient detail the receipt, identification, storage, handling, sampling, testing, and approval or rejection of components and drug product containers and closures; such written procedures shall be followed.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subpte.sec211_80.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 95
          heading: null
          text: Components and drug product containers and closures shall at all times be handled and stored in a manner to prevent contamination.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subpte.sec211_80.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 96
          heading: null
          text: Bagged or boxed components of drug product containers, or closures shall be stored off the floor and suitably spaced to permit cleaning and inspection.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part211.subpte.sec211_80.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 97
          heading: null
          text: Each container or grouping of containers for components or drug product containers, or closures shall be identified with a distinctive code for each lot in each shipment received. This code shall be used in recording the disposition of each lot. Each lot shall be appropriately identified as to its status (i.e., quarantined, approved, or rejected).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.80
            citation: 21 CFR 211.80
      - nid: part211.subpte.sec211_82
        kind: section
        kind_raw: §
        num: '211.82'
        ord: 98
        heading: Receipt and storage of untested components, drug product containers, and closures.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.82']
        children:
        - nid: part211.subpte.sec211_82.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 99
          heading: null
          text: Upon receipt and before acceptance, each container or grouping of containers of components, drug product containers, and closures shall be examined visually for appropriate labeling as to contents, container damage or broken seals, and contamination.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subpte.sec211_82.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 100
          heading: null
          text: Components, drug product containers, and closures shall be stored under quarantine until they have been tested or examined, whichever is appropriate, and released. Storage within the area shall conform to the requirements of § 211.80.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
