        - nid: part211.subptj.sec211_198.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 364
          heading: null
          text: Written procedures describing the handling of all written and oral complaints regarding a drug product shall be established and followed. Such procedures shall include provisions for review by the quality control unit, of any complaint involving the possible failure of a drug product to meet any of its specifications and, for such drug products, a determination as to the need for an investigation in accordance with § 211.192. Such procedures shall include provisions for review to determine whether the complaint represents a serious and unexpected adverse drug experience which is required to be reported to the Food and Drug Administration in accordance with §§ 310.305 and 514.80 of this chapter.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
