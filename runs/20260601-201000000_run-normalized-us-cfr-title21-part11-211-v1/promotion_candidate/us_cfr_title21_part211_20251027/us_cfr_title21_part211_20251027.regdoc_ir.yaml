          kind_raw: (c)
          num: c
          ord: 179
          heading: null
          text: Records shall be maintained for each shipment received of each different labeling and packaging material indicating receipt, examination or testing, and whether accepted or rejected.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
