          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.56']
        children:
        - nid: part211.subptc.sec211_56.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 64
          heading: null
          text: Any building used in the manufacture, processing, packing, or holding of a drug product shall be maintained in a clean and sanitary condition, Any such building shall be free of infestation by rodents, birds, insects, and other vermin (other than laboratory animals). Trash and organic waste matter shall be held and disposed of in a timely and sanitary manner.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subptc.sec211_56.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 65
          heading: null
          text: There shall be written procedures assigning responsibility for sanitation and describing in sufficient detail the cleaning schedules, methods, equipment, and materials to be used in cleaning the buildings and facilities; such written procedures shall be followed.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subptc.sec211_56.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 66
          heading: null
          text: There shall be written procedures for use of suitable rodenticides, insecticides, fungicides, fumigating agents, and cleaning and sanitizing agents. Such written procedures shall be designed to prevent the contamination of equipment, components, drug product containers, closures, packaging, labeling materials, or drug products and shall be followed. Rodenticides, insecticides, and fungicides shall not be used unless registered and used in accordance with the Federal Insecticide, Fungicide, and Rodenticide Act (7 U.S.C. 135).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part211.subptc.sec211_56.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 67
          heading: null
          text: Sanitation procedures shall apply to work performed by contractors or temporary employees as well as work performed by full-time employees during the ordinary course of operations.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
