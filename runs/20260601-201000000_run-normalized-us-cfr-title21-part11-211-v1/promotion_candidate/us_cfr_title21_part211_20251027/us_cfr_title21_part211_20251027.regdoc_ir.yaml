    - nid: part211.subptk
      kind: subpart
      kind_raw: Subpart
      num: K
      ord: 370
      heading: Returned and Salvaged Drug Products
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: CFR
        locator: DIV6[@N='K']
      children:
      - nid: part211.subptk.sec211_204
        kind: section
        kind_raw: §
        num: '211.204'
        ord: 371
        heading: Returned drug products.
        text: Returned drug products shall be identified as such and held. If the conditions under which returned drug products have been held, stored, or shipped before or during their return, or if the condition of the drug product, its container, carton, or labeling, as a result of storage or shipping, casts doubt on the safety, identity, strength, quality or purity of the drug product, the returned drug product shall be destroyed unless examination, testing, or other investigations prove the drug product meets appropriate standards of safety, identity, strength, quality, or purity. A drug product may be reprocessed provided the subsequent drug product meets appropriate standards, specifications, and characteristics. Records of returned drug products shall be maintained and shall include the name and label potency of the drug product dosage form, lot number (or control number or batch number), reason for the return, quantity returned, date of disposition, and ultimate disposition of the returned drug product. If the reason for a drug product being returned implicates associated batches, an appropriate investigation shall be conducted in accordance with the requirements of § 211.192. Procedures for the holding, testing, and reprocessing of returned drug products shall be in writing and shall be followed.
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.204']
        children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.204
            citation: 21 CFR 211.204
      - nid: part211.subptk.sec211_208
        kind: section
        kind_raw: §
        num: '211.208'
        ord: 372
        heading: Drug product salvaging.
        text: Drug products that have been subjected to improper storage conditions including extremes in temperature, humidity, smoke, fumes, pressure, age, or radiation due to natural disasters, fires, accidents, or equipment failures shall not be salvaged and returned to the marketplace. Whenever there is a question whether drug products have been subjected to such conditions, salvaging operations may be conducted only if there is (a) evidence from laboratory tests and assays (including animal feeding studies where applicable) that the drug products meet all applicable standards of identity, strength, quality, and purity and (b) evidence from inspection of the premises that the drug products and their associated packaging were not subjected to improper storage conditions as a result of the disaster or accident. Organoleptic examinations shall be acceptable only as supplemental evidence that the drug products meet appropriate standards of identity, strength, quality, and purity. Records including name, lot number, and disposition shall be maintained for drug products subject to this section.
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.208']
        children: []
