          kind_raw: (a)
          num: a
          ord: 153
          heading: null
          text: All compounding and storage containers, processing lines, and major equipment used during the production of a batch of a drug product shall be properly identified at all times to indicate their contents and, when necessary, the phase of processing of the batch.
