      - nid: part211.subpti.sec211_176
        kind: section
        kind_raw: §
        num: '211.176'
        ord: 294
        heading: Penicillin contamination.
        text: 'If a reasonable possibility exists that a non-penicillin drug product has been exposed to cross-contamination with penicillin, the non-penicillin drug product shall be tested for the presence of penicillin. Such drug product shall not be marketed if detectable levels are found when tested according to procedures specified in ‘Procedures for Detecting and Measuring Penicillin Contamination in Drugs,’ which is incorporated by reference. Copies are available from the Division of Research and Testing (HFD-470), Center for Drug Evaluation and Research, Food and Drug Administration, 5001 Campus Dr., College Park, MD 20740, or available for inspection at the National Archives and Records Administration (NARA). For information on the availability of this material at NARA, call 202-741-6030, or go to: http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.'
        role: structural
        normativity: null
        tags: []
