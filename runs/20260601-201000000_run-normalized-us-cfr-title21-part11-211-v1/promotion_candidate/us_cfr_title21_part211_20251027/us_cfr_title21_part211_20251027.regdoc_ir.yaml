        - nid: part211.subptj.sec211_180.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 300
          heading: null
          text: All records required under this part, or copies of such records, shall be readily available for authorized inspection during the retention period at the establishment where the activities described in such records occurred. These records or copies thereof shall be subject to photocopying or other means of reproduction as part of such inspection. Records that can be immediately retrieved from another location by computer or other electronic means shall be considered as meeting the requirements of this paragraph.
