            locator: P[5]
          children: []
        - nid: part211.subptg.sec211_130.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 204
          heading: null
          text: Inspection of the packaging and labeling facilities immediately before use to assure that all drug products have been removed from previous operations. Inspection shall also be made to assure that packaging and labeling materials not suitable for subsequent operations have been removed. Results of inspection shall be documented in the batch production records.
          role: normative
          normativity: must
