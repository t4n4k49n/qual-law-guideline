          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subpth.sec211_142.pb
          kind: paragraph
          kind_raw: (b)
