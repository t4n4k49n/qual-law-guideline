      - nid: part211.subptg.sec211_137
        kind: section
        kind_raw: §
        num: '211.137'
        ord: 228
        heading: Expiration dating.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.137']
        children:
        - nid: part211.subptg.sec211_137.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 229
          heading: null
          text: To assure that a drug product meets applicable standards of identity, strength, quality, and purity at the time of use, it shall bear an expiration date determined by appropriate stability testing described in § 211.166.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subptg.sec211_137.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 230
          heading: null
          text: Expiration dates shall be related to any storage conditions stated on the labeling, as determined by stability studies described in § 211.166.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subptg.sec211_137.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 231
          heading: null
          text: If the drug product is to be reconstituted at the time of dispensing, its labeling shall bear expiration information for both the reconstituted and unreconstituted drug products.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part211.subptg.sec211_137.pd
          kind: paragraph
          kind_raw: (d)
          num: d
          ord: 232
          heading: null
          text: Expiration dates shall appear on labeling in accordance with the requirements of § 201.17 of this chapter.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[4]
          children: []
        - nid: part211.subptg.sec211_137.pe
          kind: paragraph
          kind_raw: (e)
          num: e
          ord: 233
          heading: null
          text: Homeopathic drug products shall be exempt from the requirements of this section.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[5]
          children: []
        - nid: part211.subptg.sec211_137.pf
          kind: paragraph
          kind_raw: (f)
          num: f
          ord: 234
          heading: null
          text: Allergenic extracts that are labeled “No U.S. Standard of Potency” are exempt from the requirements of this section.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[6]
          children: []
        - nid: part211.subptg.sec211_137.pg
          kind: paragraph
          kind_raw: (g)
          num: g
          ord: 235
          heading: null
          text: New drug products for investigational use are exempt from the requirements of this section, provided that they meet appropriate standards or specifications as demonstrated by stability studies during their use in clinical investigations. Where new drug products for investigational use are to be reconstituted at the time of dispensing, their labeling shall bear expiration information for the reconstituted drug product.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[7]
          children: []
        - nid: part211.subptg.sec211_137.ph
          kind: paragraph
          kind_raw: (h)
          num: h
          ord: 236
          heading: null
          text: Pending consideration of a proposed exemption, published in the Federal Register of September 29, 1978, the requirements in this section shall not be enforced for human OTC drug products if their labeling does not bear dosage limitations and they are stable for at least 3 years as supported by appropriate stability data.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[8]
          children: []
        - nid: part211.subptg.sec211_137.note
          kind: note
          kind_raw: CITA
          num: null
          ord: 237
          heading: null
          text: '[43 FR 45077, Sept. 29, 1978, as amended at 46 FR 56412, Nov. 17, 1981; 60 FR 4091, Jan. 20, 1995]'
          role: informative
          normativity: null
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: DIV8[@N='211.137']/CITA[1]
          children: []
