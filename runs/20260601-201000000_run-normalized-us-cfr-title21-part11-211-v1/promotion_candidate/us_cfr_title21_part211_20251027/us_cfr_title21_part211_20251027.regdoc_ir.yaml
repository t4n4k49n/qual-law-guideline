            citation: 21 CFR 211.22
      - nid: part211.subptb.sec211_25
        kind: section
        kind_raw: §
        num: '211.25'
        ord: 18
        heading: Personnel qualifications.
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.25']
        children:
        - nid: part211.subptb.sec211_25.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 19
          heading: null
          text: Each person engaged in the manufacture, processing, packing, or holding of a drug product shall have education, training, and experience, or any combination thereof, to enable that person to perform the assigned functions. Training shall be in the particular operations that the employee performs and in current good manufacturing practice (including the current good manufacturing practice regulations in this chapter and written procedures required by these regulations) as they relate to the employee's functions. Training in current good manufacturing practice shall be conducted by qualified individuals on a continuing basis and with sufficient frequency to assure that employees remain familiar with CGMP requirements applicable to them.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[1]
          children: []
        - nid: part211.subptb.sec211_25.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 20
          heading: null
          text: Each person responsible for supervising the manufacture, processing, packing, or holding of a drug product shall have the education, training, and experience, or any combination thereof, to perform assigned functions in such a manner as to provide assurance that the drug product has the safety, identity, strength, quality, and purity that it purports or is represented to possess.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subptb.sec211_25.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 21
          heading: null
          text: There shall be an adequate number of qualified personnel to perform and supervise the manufacture, processing, packing, or holding of each drug product.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        data:
          hierarchy_metadata:
            path: /on/_SUBSTITUTE_DATE_/title-21/section-211.25
            citation: 21 CFR 211.25
      - nid: part211.subptb.sec211_28
        kind: section
