      - nid: part211.subptg.sec211_130
        kind: section
        kind_raw: §
        num: '211.130'
        ord: 199
        heading: Packaging and labeling operations.
        text: 'There shall be written procedures designed to assure that correct labels, labeling, and packaging materials are used for drug products; such written procedures shall be followed. These procedures shall incorporate the following features:'
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: CFR
          locator: DIV8[@N='211.130']
        children:
        - nid: part211.subptg.sec211_130.pa
          kind: paragraph
          kind_raw: (a)
          num: a
          ord: 200
          heading: null
          text: Prevention of mixups and cross-contamination by physical or spatial separation from operations on other drug products.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[2]
          children: []
        - nid: part211.subptg.sec211_130.pb
          kind: paragraph
          kind_raw: (b)
          num: b
          ord: 201
          heading: null
          text: Identification and handling of filled drug product containers that are set aside and held in unlabeled condition for future labeling operations to preclude mislabeling of individual containers, lots, or portions of lots. Identification need not be applied to each individual container but shall be sufficient to determine name, strength, quantity of contents, and lot or control number of each container.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: CFR
            locator: P[3]
          children: []
        - nid: part211.subptg.sec211_130.pc
          kind: paragraph
          kind_raw: (c)
          num: c
          ord: 202
          heading: null
