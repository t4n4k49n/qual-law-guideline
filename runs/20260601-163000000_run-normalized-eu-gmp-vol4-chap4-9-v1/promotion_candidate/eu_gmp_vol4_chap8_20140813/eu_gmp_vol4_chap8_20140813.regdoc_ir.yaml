    num: '8'
    ord: 2
    heading: Complaints, Quality Defects and Product Recalls
    text: 'Legal basis for publishing the detailed guidelines: Article 47 of Directive 2001/83/EC on the Community code relating to medicinal products for human use and Article 51 of Directive 2001/82/EC on the Community code relating to veterinary medicinal products. This document provides guidance for the interpretation of the principles and guidelines of good manufacturing practice (GMP) for medicinal products as laid down in Directive 2003/94/EC for medicinal products for human use and Directive 91/412/EEC for veterinary use. Status of the document: Revision Reasons for changes: Extensive changes have been made to this Chapter which now reflect that Quality Risk Management principles should be applied when investigating quality defects or complaints and when making decisions in relation to product recalls or other risk-mitigating actions. It emphasises the need for the cause(s) of quality defects or complaints to be investigated and determined, and that appropriate preventative actions are put in place to guard against a recurrence of the issue and clarifies expectations and responsibilities in relation to the reporting of quality defects to the Competent Authorities. Deadline for coming into operation: 1 March 2015.'
