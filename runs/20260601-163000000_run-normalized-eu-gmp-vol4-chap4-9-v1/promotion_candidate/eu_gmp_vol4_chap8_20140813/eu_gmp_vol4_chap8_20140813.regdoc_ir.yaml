        kind: paragraph
        kind_raw: '8.1'
        num: '8.1'
        ord: 5
        heading: null
        text: Appropriately trained and experienced personnel should be responsible for managing complaint and quality defect investigations and for deciding the measures to be taken to manage any potential risk(s) presented by those issues, including recalls. These persons should be independent of the sales and marketing organisation, unless otherwise justified. If these persons do not include the Qualified Person involved in the certification for release of the concerned batch or batches, the latter should be made formally aware of any investigations, any risk-reducing actions and any recall operations, in a timely manner.
        role: normative
        normativity: must
