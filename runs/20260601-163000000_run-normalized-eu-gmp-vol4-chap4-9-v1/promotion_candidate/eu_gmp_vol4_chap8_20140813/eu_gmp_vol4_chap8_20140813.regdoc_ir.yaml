          locator: line:180
        - source_label: EU GMP
          locator: line:181
        children: []
      - nid: cha8.sec5.p8_17
        kind: paragraph
        kind_raw: '8.17'
        num: '8.17'
        ord: 33
        heading: null
        text: Where human error is suspected or identified as the cause of a quality defect, this should be formally justified and care should be exercised so as to ensure that process, procedural or system-based errors or problems are not overlooked, if present.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:182
        - source_label: EU GMP
          locator: line:183
        - source_label: EU GMP
          locator: line:184
        children: []
      - nid: cha8.sec5.p8_18
        kind: paragraph
        kind_raw: '8.18'
        num: '8.18'
        ord: 34
        heading: null
        text: Appropriate CAPAs should be identified and taken in response to a quality defect. The effectiveness of such actions should be monitored and assessed.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:185
        - source_label: EU GMP
          locator: line:186
        children: []
      - nid: cha8.sec5.p8_19
        kind: paragraph
        kind_raw: '8.19'
        num: '8.19'
        ord: 35
        heading: null
        text: Quality defect records should be reviewed and trend analyses should be performed regularly for any indication of specific or recurring problems requiring attention.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:187
        - source_label: EU GMP
          locator: line:188
        children: []
    - nid: cha8.sec6
      kind: section
      kind_raw: null
      num: null
      ord: 36
      heading: Product Recalls and other potential risk-reducing actions
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: EU GMP
        locator: line:193
      children:
      - nid: cha8.sec6.p8_20
        kind: paragraph
        kind_raw: '8.20'
        num: '8.20'
        ord: 37
        heading: null
        text: There should be established written procedures, regularly reviewed and updated when necessary, in order to undertake any recall activity or implement any other risk-reducing actions.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:195
        - source_label: EU GMP
          locator: line:196
        - source_label: EU GMP
          locator: line:197
        children: []
      - nid: cha8.sec6.p8_21
        kind: paragraph
        kind_raw: '8.21'
        num: '8.21'
        ord: 38
        heading: null
        text: After a product has been placed on the market, any retrieval of it from the distribution network as a result of a quality defect should be regarded and managed as a recall. (This provision does not apply to the retrieval (or return) of samples of the product from the distribution network to facilitate an investigation into a quality defect issue/report.)
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:198
        - source_label: EU GMP
          locator: line:199
        - source_label: EU GMP
          locator: line:200
        - source_label: EU GMP
          locator: line:201
        children: []
      - nid: cha8.sec6.p8_22
        kind: paragraph
        kind_raw: '8.22'
        num: '8.22'
        ord: 39
        heading: null
        text: Recall operations should be capable of being initiated promptly and at any time. In certain cases recall operations may need to be initiated to protect public or animal health prior to establishing the root cause(s) and full extent of the quality defect
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:202
        - source_label: EU GMP
          locator: line:203
        - source_label: EU GMP
          locator: line:204
        children: []
      - nid: cha8.sec6.p8_23
        kind: paragraph
        kind_raw: '8.23'
        num: '8.23'
        ord: 40
        heading: null
        text: The batch/product distribution records should be readily available to the persons responsible for recalls, and should contain sufficient information on wholesalers and directly supplied customers (with addresses, phone and/or fax numbers inside and outside working hours, batches and amounts delivered), including those for exported products and medical samples.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:205
        - source_label: EU GMP
          locator: line:206
        - source_label: EU GMP
          locator: line:207
        - source_label: EU GMP
          locator: line:208
        - source_label: EU GMP
          locator: line:209
        children: []
      - nid: cha8.sec6.p8_24
        kind: paragraph
        kind_raw: '8.24'
        num: '8.24'
        ord: 41
        heading: null
        text: In the case of investigational medicinal products, all trial sites should be identified and the countries of destination should be indicated. In the case of an investigational medicinal product for which a marketing authorisation has been issued, the manufacturer of the investigational medicinal product should, in cooperation with the sponsor, inform the marketing authorisation holder of any quality defect that could be related to the authorised medicinal product. The sponsor should implement a procedure for the rapid unblinding of blinded products, where this is necessary for a prompt recall. The sponsor should ensure that the procedure discloses the identity of the blinded product only in so far as is necessary.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:210
        - source_label: EU GMP
          locator: line:211
        - source_label: EU GMP
          locator: line:212
        - source_label: EU GMP
          locator: line:213
        - source_label: EU GMP
          locator: line:214
        - source_label: EU GMP
          locator: line:215
        - source_label: EU GMP
          locator: line:216
        - source_label: EU GMP
          locator: line:217
        - source_label: EU GMP
          locator: line:218
        children: []
      - nid: cha8.sec6.p8_25
        kind: paragraph
        kind_raw: '8.25'
        num: '8.25'
        ord: 42
        heading: null
        text: Consideration should be given following consultation with the concerned Competent Authorities, as to how far into the distribution network a recall action should extend, taking into account the potential risk to public or animal health and any impact that the proposed recall action may have. The Competent Authorities should also be informed in situations in which no recall action is being proposed for a defective batch because the batch has expired (such as with short shelf-life products.)
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:219
        - source_label: EU GMP
          locator: line:220
        - source_label: EU GMP
          locator: line:221
        - source_label: EU GMP
          locator: line:222
        - source_label: EU GMP
          locator: line:223
        - source_label: EU GMP
          locator: line:224
        children: []
      - nid: cha8.sec6.p8_26
        kind: paragraph
        kind_raw: '8.26'
        num: '8.26'
        ord: 43
        heading: null
        text: All concerned Competent Authorities should be informed in advance in cases where products are intended to be recalled. For very serious issues (i.e. those with the potential to seriously impact upon patient or animal health), rapid risk-reducing actions (such as a product recall) may have to be taken in advance of notifying the Competent Authorities. Wherever possible, attempts should be made to agree these in advance of their execution with the concerned Competent Authorities
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:225
        - source_label: EU GMP
          locator: line:226
        - source_label: EU GMP
          locator: line:227
        - source_label: EU GMP
          locator: line:228
        - source_label: EU GMP
          locator: line:229
        - source_label: EU GMP
          locator: line:230
        children: []
      - nid: cha8.sec6.p8_27
        kind: paragraph
        kind_raw: '8.27'
        num: '8.27'
        ord: 44
        heading: null
        text: It should also be considered whether the proposed recall action may affect different markets in different ways, and if this is the case, appropriate market-specific risk-reducing actions should be developed and discussed with the concerned competent authorities. Taking account of its therapeutic use the risk of shortage of a medicinal product which has no authorised alternative should be considered before deciding on a risk-reducing action such as a recall. Any decisions not to execute a risk-reducing action which would otherwise be required should be agreed with the competent authority in advance.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:231
        - source_label: EU GMP
          locator: line:232
        - source_label: EU GMP
          locator: line:233
        - source_label: EU GMP
          locator: line:234
        - source_label: EU GMP
          locator: line:235
        - source_label: EU GMP
          locator: line:236
        - source_label: EU GMP
          locator: line:237
        children: []
      - nid: cha8.sec6.p8_28
        kind: paragraph
        kind_raw: '8.28'
        num: '8.28'
        ord: 45
        heading: null
        text: Recalled products should be identified and stored separately in a secure area while awaiting a decision on their fate. A formal disposition of all recalled batches should be made and documented. The rationale for any decision to rework recalled products should be documented and discussed with the relevant competent authority. The extent of shelf-life remaining for any reworked batches that are being considered for placement onto the market should also be considered.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:241
        - source_label: EU GMP
          locator: line:242
        - source_label: EU GMP
          locator: line:243
        - source_label: EU GMP
          locator: line:244
        - source_label: EU GMP
          locator: line:245
        - source_label: EU GMP
          locator: line:246
        children: []
      - nid: cha8.sec6.p8_29
        kind: paragraph
        kind_raw: '8.29'
        num: '8.29'
        ord: 46
        heading: null
        text: The progress of the recall process should be recorded until closure and a final report issued, including a reconciliation between the delivered and recovered quantities of the concerned products/batches.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:247
        - source_label: EU GMP
          locator: line:248
        - source_label: EU GMP
          locator: line:249
        children: []
      - nid: cha8.sec6.p8_30
        kind: paragraph
        kind_raw: '8.30'
        num: '8.30'
        ord: 47
        heading: null
        text: The effectiveness of the arrangements in place for recalls should be periodically evaluated to confirm that they remain robust and fit for use. Such evaluations should extend to both within office-hour situations as well as out-of-office hour situations and, when performing such evaluations, consideration should be given as to whether mock-recall actions should be performed. This evaluation should be documented and justified.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:250
        - source_label: EU GMP
          locator: line:251
        - source_label: EU GMP
          locator: line:252
        - source_label: EU GMP
          locator: line:253
        - source_label: EU GMP
          locator: line:254
        children: []
      - nid: cha8.sec6.p8_31
        kind: paragraph
        kind_raw: '8.31'
        num: '8.31'
        ord: 48
        heading: null
        text: In addition to recalls, there are other potential risk-reducing actions that may be considered in order to manage the risks presented by quality defects. Such actions may include the issuance of cautionary communications to healthcare professionals in relation to their use of a batch that is potentially defective. These should be considered on a caseby-case basis and discussed with the concerned competent authorities.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:255
        - source_label: EU GMP
          locator: line:256
        - source_label: EU GMP
          locator: line:257
        - source_label: EU GMP
          locator: line:258
        - source_label: EU GMP
          locator: line:259
        children: []
