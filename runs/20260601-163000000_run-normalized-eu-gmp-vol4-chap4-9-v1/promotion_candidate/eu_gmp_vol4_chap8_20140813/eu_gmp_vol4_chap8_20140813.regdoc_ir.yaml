      ord: 3
      heading: Principle
      text: In order to protect public and animal health, a system and appropriate procedures should be in place to record, assess, investigate and review complaints including potential quality defects, and if necessary, to effectively and promptly recall medicinal products for human or veterinary use and investigational medicinal products from the distribution network. Quality Risk Management principles should be applied to the investigation and assessment of quality defects and to the decision-making process in relation to product recalls corrective and preventative actions and other risk-reducing actions. Guidance in relation to these principles is provided in Chapter 1. All concerned competent authorities should be informed in a timely manner in case of a confirmed quality defect (faulty manufacture, product deterioration, detection of falsification, non-compliance with the marketing authorisation or product specification file, or any other serious quality problems) with a medicinal or investigational medicinal product which may result in the recall of the product or an abnormal restriction in the supply. In situations where product on the market is found to be non-compliant with the marketing authorisation, there is no requirement to notify concerned competent authorities provided the degree of non-compliance satisfies the Annex 16 restrictions regarding the handling of unplanned deviations. In case of outsourced activities, a contract should describe the role and responsibilities of the manufacturer, the marketing authorisation holder and/or sponsor and any other relevant third parties in relation to assessment, decision-making, and dissemination of information and implementation of risk-reducing actions relating to a defective product. Guidance in relation to contracts is provided in Chapter 7. Such contracts should also address how to contact those responsible at each party for the management of quality defect and recall issues.
