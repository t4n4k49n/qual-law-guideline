schema: qai.parser_profile.v1
id: eu_gmp_chap2_default_v1
title: EU GMP Vol.4 Chapter 2 Personnel markers
applies_to:
  family: EU_GMP
  jurisdiction: EU
  defaults: false
language: en
source_label: EU GMP
context_root_kind: chapter
structural_kinds:
- chapter
- section
preprocess:
  drop_line_regexes:
  - ^\d{1,3}$
  - ^Commission.*B-1049.*Telephone:.*$
  - ^Pharmaceutical Quality System\d*$
  - ^\f$
  - ^\s*a\s*$
  - ^\s*On 26 March 2014 minor change to references to in paragraph 2\.5 to other paragraphs of Chapter 2\.\s*$
  - ^\s*Article 55 of Directive 2001/82/EC\s*$
  - ^\s*According to Article 51 paragraph 1 of Directive 2001/83/EC\), the batches of medicinal products which have\s*$
  - ^\s*undergone such controls in a Member State shall be exempt from the controls if they are marketed in another\s*$
  - ^\s*Member State, accompanied by the control reports signed by the qualified person\.\.\s*$
  - ^\s*Article 53 of Directive 2001/82/EC\s*$
  use_indent_dedent: true
  dedent_pop_kinds:
  - subitem
  - item
  strip_inline_regexes:
  - (?<=Revision)a\b
  - (?<=Directive 2001/83/EC)1\b
  - (?<=authorisation)2\b
  - (?<=Article 49)\s+3\b
  merge_structural_heading_continuations:
    enabled: true
    kinds:
    - chapter
    max_next_line_len: 120
    max_merge_lines: 1
    max_blank_lookahead: 1
  drop_repeated_structural_headers:
    enabled: true
    kinds:
    - chapter
  detect_plaintext_tables:
    enabled: true
    min_rows: 2
    max_rows: 80
    mode: conservative
  extract_notes:
    enabled: true
    max_lines: 40
  eu_gmp_chap2_cleanup:
    enabled: true
marker_types:
- id: chapter
  kind: chapter
  kind_raw: Chapter
  match: (?i)^Chapter\s+(?P<num>\d+)\s*:\s*
  num_group: num
  heading_from_remainder: true
- id: paragraph_decimal
  kind: paragraph
  kind_raw: '1.1'
  match: ^(?P<n>\d+(?:\.\d+)+)\s+
  num_group: n
- id: item_paren_roman
  kind: item
  kind_raw: (i)
  match: ^\((?P<n>[ivxlcdm]+)\)\s+
  num_group: n
- id: item_roman_rparen
  kind: item
  kind_raw: i)
  match: ^(?P<n>[ivxlcdm]+)\)\s+
  num_group: n
- id: bullet
  kind: subitem
  kind_raw: •
  match: ^[•]\s+
- id: eu_gmp_chap2_unnumbered_section
  kind: section
  kind_raw: null
  heading_from_remainder: true
  match: ^(?=(?:Principle|General|Key Personnel|Training|Personnel Hygiene|Consultants)$)
- id: item_roman_dot
  kind: item
  kind_raw: i.
  match: ^(?P<n>[ivxlcdm]+)\.\s+
  num_group: n
- id: item_alpha_rparen
  kind: item
  kind_raw: a)
  match: ^(?P<n>[a-z])\)\s+
  num_group: n
- id: item_paren_alpha
  kind: item
  kind_raw: (a)
  match: ^\((?P<n>[a-z])\)\s+
  num_group: n
structure:
  root:
    children:
    - chapter
  chapter:
    children:
    - section
    - paragraph
    - item
    - subitem
    - table
    - preformatted
    - note
    - history
  paragraph:
    children:
    - item
    - subitem
    - note
    - history
  item:
    children:
    - subitem
    - note
    - history
  subitem:
    children:
    - note
    - history
  note:
    children: []
  section:
    children:
    - paragraph
    - item
    - subitem
    - table
    - preformatted
    - note
    - history
  table:
    children:
    - table_header
    - note
  table_header:
    children:
    - table_row
  table_row:
    children: []
  preformatted:
    children:
    - note
  history:
    children: []
compound_prefix:
  enabled: false
  max_depth: 1
