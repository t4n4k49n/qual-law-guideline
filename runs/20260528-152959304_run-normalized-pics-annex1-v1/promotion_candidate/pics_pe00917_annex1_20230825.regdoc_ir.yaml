          - nid: ann1.sec9.p9_30.tbl6.not1
            kind: note
            kind_raw: note
            num: '1'
            ord: 536
            heading: null
            text: (a) - Settle plates should be exposed in grade A and B areas for the duration of operations (including equipment set-up) and changed as required after a maximum of 4 hours (exposure time should be based on validation including recovery studies and it should not have any negative effect on the suitability of the media used). - For grade C and D areas, exposure time (with a maximum of 4 hours) and frequency should be based on QRM. - Individual settle plates may be exposed for less than 4 hours.
