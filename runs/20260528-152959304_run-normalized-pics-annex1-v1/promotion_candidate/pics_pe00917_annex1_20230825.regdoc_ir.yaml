            locator: line:3276
          - source_label: PIC/S
            locator: line:3277
          - source_label: PIC/S
            locator: line:3278
          children: []
        - nid: ann1.sec9.p9_36.ivii
          kind: item
          kind_raw: vii.
          num: vii
          ord: 566
          heading: null
          text: "The method of detection of microbial contamination should be scientifically\n               justified to ensure that contamination is reliably detected."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
