        children: []
      - nid: ann1.sec8.p8_92
        kind: paragraph
        kind_raw: '8.92'
        num: '8.92'
        ord: 373
        heading: null
        text: In a redundant filtration system (where a second redundant sterilising grade filter is present as a backup but the sterilising process is validated as only requiring one filter), post-use integrity test of the primary sterilising grade filter should be performed and if demonstrated to be integral, then a post-use integrity test of the redundant (backup) filter is not necessary. However, in the event of a failure of the post-use integrity test on the primary filter, post-use integrity test on the secondary (redundant) filter should be performed, in conjunction with an investigation and risk assessment to determine the reason for the primary filter test failure.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
