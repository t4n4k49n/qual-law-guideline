      - nid: ann1.sec5.p5_2
        kind: paragraph
        kind_raw: '5.2'
        num: '5.2'
        ord: 140
        heading: null
        text: Equipment monitoring requirements should be defined in “user requirements specifications” during early stages of development, and confirmed during qualification. Process and equipment alarm events should be acknowledged and evaluated for trends. The frequency at which alarms are assessed should be based on their criticality (with critical alarms reviewed immediately).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
