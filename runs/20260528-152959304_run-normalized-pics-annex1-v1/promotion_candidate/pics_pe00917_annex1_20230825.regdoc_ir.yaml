        children: []
      - nid: ann1.sec4.p4_19
        kind: paragraph
        kind_raw: '4.19'
        num: '4.19'
        ord: 65
        heading: null
        text: The design of the technology and processes used should ensure appropriate conditions are maintained in the critical zone to protect the exposed product during operations.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:517
        - source_label: PIC/S
          locator: line:518
        - source_label: PIC/S
          locator: line:519
        children:
        - nid: ann1.sec4.p4_19.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 66
          heading: null
          text: 'Isolators:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:521
          children: []
        - nid: ann1.sec4.p4_19.ia
          kind: item
          kind_raw: a.
          num: a
          ord: 67
          heading: null
          text: "The design of open isolators should ensure grade A conditions with first air\n                protection in the critical zone and unidirectional airflow that sweeps over and\n                away from exposed products during processing."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:523
          - source_label: PIC/S
            locator: line:531
          - source_label: PIC/S
            locator: line:532
          children: []
        - nid: ann1.sec4.p4_19.ib
          kind: item
          kind_raw: b.
          num: b
          ord: 68
          heading: null
          text: "The design of closed isolators should ensure grade A conditions with\n                adequate protection for exposed products during processing. Airflow may not\n                be fully unidirectional in closed isolators where simple operations are\n                conducted. However, any turbulent airflow should not increase risk of\n                contamination of the exposed product. Where processing lines are included\n                in closed isolators, grade A conditions should be ensured with first air\n                protection in the critical zone and unidirectional airflow that sweeps over and\n                away from exposed products during processing."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:533
          - source_label: PIC/S
            locator: line:534
          - source_label: PIC/S
            locator: line:535
          - source_label: PIC/S
            locator: line:536
          - source_label: PIC/S
            locator: line:537
          - source_label: PIC/S
            locator: line:538
          - source_label: PIC/S
            locator: line:539
          - source_label: PIC/S
            locator: line:540
          children: []
        - nid: ann1.sec4.p4_19.ic
          kind: item
          kind_raw: c.
          num: c
          ord: 69
          heading: null
          text: "Negative pressure isolators should only be used when containment of the\n                product is considered essential (e.g. radiopharmaceutical products) and\n                specialized risk control measures should be applied to ensure the critical\n                zone is not compromised."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:541
          - source_label: PIC/S
            locator: line:542
          - source_label: PIC/S
            locator: line:543
          - source_label: PIC/S
            locator: line:544
          children: []
        - nid: ann1.sec4.p4_19.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 70
          heading: null
          text: "RABS:\n                The design of RABS should ensure grade A conditions with unidirectional\n                airflow and first air protection in the critical zone. A positive airflow from the\n                critical zone to the supporting background environment should be\n                maintained."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:546
          - source_label: PIC/S
            locator: line:548
          - source_label: PIC/S
            locator: line:549
          - source_label: PIC/S
            locator: line:550
          - source_label: PIC/S
            locator: line:551
          children: []
      - nid: ann1.sec4.p4_20
        kind: paragraph
        kind_raw: '4.20'
        num: '4.20'
        ord: 71
        heading: null
        text: The background environment for isolators or RABS should ensure the risk of transfer of contamination is minimized.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:553
        - source_label: PIC/S
          locator: line:554
        children:
        - nid: ann1.sec4.p4_20.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 72
          heading: null
          text: 'Isolators:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:556
          children: []
        - nid: ann1.sec4.p4_20.ia
          kind: item
          kind_raw: a.
          num: a
          ord: 73
          heading: null
          text: "The background environment for open isolators should generally correspond\n                to a minimum of grade C. The background for closed isolators should\n                correspond to a minimum of grade D. The decision on the background\n                classification should be based on risk assessment and justified in the CCS."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:558
          - source_label: PIC/S
            locator: line:559
          - source_label: PIC/S
            locator: line:560
          - source_label: PIC/S
            locator: line:561
          children: []
        - nid: ann1.sec4.p4_20.ib
          kind: item
          kind_raw: b.
          num: b
          ord: 74
          heading: null
          text: "Key considerations when performing the risk assessment for the CCS of an\n                isolator should include (but are not limited to); the bio-decontamination\n                programme, the extent of automation, the impact of glove manipulations that\n                may potentially compromise ‘first air’ protection of critical process points, the\n                impact of potential loss of barrier/glove integrity, transfer mechanisms used\n                and activities such as set-up or maintenance that may require the doors to\n                be opened prior to the final bio-decontamination of the isolator. Where\n                additional process risks are identified, a higher grade of background should\n                be considered unless appropriately justified in the CCS."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:562
          - source_label: PIC/S
            locator: line:563
          - source_label: PIC/S
            locator: line:564
          - source_label: PIC/S
            locator: line:565
          - source_label: PIC/S
            locator: line:566
          - source_label: PIC/S
            locator: line:567
          - source_label: PIC/S
            locator: line:568
          - source_label: PIC/S
            locator: line:569
          - source_label: PIC/S
            locator: line:570
          children: []
        - nid: ann1.sec4.p4_20.ic
          kind: item
          kind_raw: c.
          num: c
          ord: 75
          heading: null
          text: "Airflow pattern studies should be performed at the interfaces of open\n                isolators to demonstrate the absence of air ingress."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:571
          - source_label: PIC/S
            locator: line:572
          children: []
        - nid: ann1.sec4.p4_20.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 76
          heading: null
          text: "RABS:\n                The background environment for RABS used for aseptic processing, should\n                correspond to a minimum of grade B and airflow pattern studies should be\n                performed to demonstrate the absence of air ingress during interventions,\n                including door openings if applicable."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:574
          - source_label: PIC/S
            locator: line:576
          - source_label: PIC/S
            locator: line:577
          - source_label: PIC/S
            locator: line:578
          - source_label: PIC/S
            locator: line:579
          children: []
      - nid: ann1.sec4.p4_21
        kind: paragraph
        kind_raw: '4.21'
        num: '4.21'
        ord: 77
        heading: null
        text: The materials used for glove systems (for both isolators and RABS) should be demonstrated to have appropriate mechanical and chemical resistance. The frequency of glove replacement should be defined within the CCS.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:589
        - source_label: PIC/S
          locator: line:590
        - source_label: PIC/S
          locator: line:591
        children:
        - nid: ann1.sec4.p4_21.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 78
          heading: null
          text: 'Isolators:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:593
          children: []
        - nid: ann1.sec4.p4_21.ia
          kind: item
          kind_raw: a.
          num: a
          ord: 79
          heading: null
          text: "For isolators, leak testing of the glove system should be performed using a\n                methodology demonstrated to be suitable for the task and criticality. The\n                testing should be performed at defined intervals. Generally glove integrity\n                testing should be performed at a minimum frequency of the beginning and\n                end of each batch or campaign. Additional glove integrity testing may be\n                necessary depending on the validated campaign length.\n               Glove integrity monitoring should include a visual inspection associated with\n               each use and following any manipulation that may affect the integrity of the\n               system.\n               For manual aseptic processing activities where single unit or small batch\n               sizes are produced, the frequency of integrity verification may be based on\n               other criteria, such as the beginning and end of each manufacturing session."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:595
          - source_label: PIC/S
            locator: line:596
          - source_label: PIC/S
            locator: line:597
          - source_label: PIC/S
            locator: line:598
          - source_label: PIC/S
            locator: line:599
          - source_label: PIC/S
            locator: line:600
          - source_label: PIC/S
            locator: line:601
          - source_label: PIC/S
            locator: line:602
          - source_label: PIC/S
            locator: line:603
          - source_label: PIC/S
            locator: line:604
          - source_label: PIC/S
            locator: line:605
          - source_label: PIC/S
            locator: line:606
          children: []
        - nid: ann1.sec4.p4_21.ib
          kind: item
          kind_raw: b.
          num: b
          ord: 80
          heading: null
          text: "Integrity / leak testing of isolator systems should be performed at defined\n                intervals."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:607
          - source_label: PIC/S
            locator: line:608
          children: []
        - nid: ann1.sec4.p4_21.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 81
          heading: null
          text: "RABS:\n               For RABS, gloves used in the grade A area should be sterilised before\n               installation and sterilised or effectively bio-decontaminated by a validated\n               method prior to each manufacturing campaign. If exposed to the background\n               environment during operation, disinfection using an approved methodology\n               following each exposure should be completed. Gloves should be visually\n               examined with each use, and integrity testing should be performed at\n               periodic intervals."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:610
          - source_label: PIC/S
            locator: line:612
          - source_label: PIC/S
            locator: line:613
          - source_label: PIC/S
            locator: line:614
          - source_label: PIC/S
            locator: line:615
          - source_label: PIC/S
            locator: line:616
          - source_label: PIC/S
            locator: line:617
          - source_label: PIC/S
            locator: line:618
          children: []
      - nid: ann1.sec4.p4_22
        kind: paragraph
        kind_raw: '4.22'
        num: '4.22'
        ord: 82
        heading: null
        text: Decontamination methods (cleaning and bio-decontamination, and where applicable inactivation for biological materials) should be appropriately defined and controlled. The cleaning process prior to the bio-decontamination step is essential; any residues that remain may inhibit the effectiveness of the decontamination process. Evidence should also be available to demonstrate that the cleaning and bio-decontamination agents used do not have adverse impact on the product produced within the RABS or isolator.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:620
        - source_label: PIC/S
          locator: line:621
        - source_label: PIC/S
          locator: line:622
        - source_label: PIC/S
          locator: line:623
        - source_label: PIC/S
          locator: line:624
        - source_label: PIC/S
          locator: line:625
        - source_label: PIC/S
          locator: line:626
        children:
        - nid: ann1.sec4.p4_22.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 83
          heading: null
          text: "For isolators\n               The bio-decontamination process of the interior should be automated,\n               validated and controlled within defined cycle parameters and should include\n               a sporicidal agent in a suitable form (e.g. gaseous or vaporized form). Gloves\n               should be appropriately extended with fingers separated to ensure contact\n               with the agent. Methods used (cleaning and sporicidal bio-decontamination)\n               should render the interior surfaces and critical zone of the isolator free from\n               viable microorganisms."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:628
          - source_label: PIC/S
            locator: line:630
          - source_label: PIC/S
