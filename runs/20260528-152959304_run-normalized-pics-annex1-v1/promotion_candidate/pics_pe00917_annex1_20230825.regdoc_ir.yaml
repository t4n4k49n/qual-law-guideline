      - nid: ann1.sec5.p5_5
        kind: paragraph
        kind_raw: '5.5'
        num: '5.5'
        ord: 145
        heading: null
        text: 'For aseptic processes, direct and indirect product contact parts should be sterilised. Direct product contact parts are those that the product passes through, such as filling needles or pumps. Indirect product contact parts are equipment


          parts that do not contact the product, but may come into contact with other sterilised surfaces, the sterility of which is critical to the overall product sterility (e.g. sterilised items such as stopper bowls and guides, and sterilised components).'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
