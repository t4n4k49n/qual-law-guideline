      - nid: ann1.sec8.p8_57
        kind: paragraph
        kind_raw: '8.57'
        num: '8.57'
        ord: 293
        heading: null
        text: For porous cycles (hard goods), time, temperature and pressure should be used to monitor the process and be recorded. Each sterilised item should be inspected for damage, packaging material integrity and moisture on removal from the autoclave. Any item found not to be fit for purpose should be removed from the manufacturing area and an investigation performed.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1883
        - source_label: PIC/S
          locator: line:1884
        - source_label: PIC/S
          locator: line:1885
        - source_label: PIC/S
          locator: line:1886
        - source_label: PIC/S
          locator: line:1887
        children: []
      - nid: ann1.sec8.p8_58
        kind: paragraph
        kind_raw: '8.58'
        num: '8.58'
        ord: 294
        heading: null
        text: For autoclaves capable of performing prevacuum sterilisation cycles, the temperature should be recorded at the chamber drain throughout the sterilisation period. Load probes may also be used where appropriate but the controlling system should remain related to the load validation. For steam in place systems, the temperature should be recorded at appropriate condensate drain locations throughout the sterilisation period.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1896
        - source_label: PIC/S
          locator: line:1897
