        ord: 246
        heading: null
        text: "Interventions and stoppages should be recorded in the batch record. Each line\n            stoppage or intervention should be sufficiently documented in batch records with\n            the associated time, duration of the event, and operators involved (ref to\n            paragraph 9.34)."
