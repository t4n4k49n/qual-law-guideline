      - nid: ann1.sec9.p9_1
        kind: paragraph
        kind_raw: '9.1'
        num: '9.1'
        ord: 481
        heading: null
        text: The site’s environmental and process monitoring programme forms part of the overall CCS and is used to monitor the controls designed to minimize the risk of microbial and particle contamination. It should be noted that the reliability of each of the elements of the monitoring system (viable, non-viable and APS) when taken in isolation is limited and should not be considered individually to be an indicator of asepsis. When considered together, the results help confirm the reliability of the design, validation and operation of the system that they are monitoring.
        role: normative
        normativity: must
        tags: []
        refs:
