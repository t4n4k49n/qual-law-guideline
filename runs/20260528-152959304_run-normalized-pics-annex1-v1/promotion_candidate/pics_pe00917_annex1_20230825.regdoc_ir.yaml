        ord: 476
        heading: null
        text: The extractable and leachable profiles of the SUS and any impact on the quality of the product especially where the system is made from polymer-based materials should be evaluated. An assessment should be carried out for each component to evaluate the applicability of the extractable profile data. For components considered to be at high risk from leachables, including those that may absorb processed materials or those with extended material contact times, an assessment of leachable profile studies, including safety concerns, should be taken into consideration. If applying simulated processing conditions, these should accurately reflect the actual processing conditions and be based on a scientific rationale.
        role: normative
        normativity: must
