        children: []
      - nid: ann1.sec10.p10_5
        kind: paragraph
        kind_raw: '10.5'
        num: '10.5'
        ord: 602
        heading: null
        text: The sterility test applied to the finished product should only be regarded as the last in a series of critical control measures by which sterility is assured. It cannot be used to assure sterility of a product that does not meet its design, procedural or validation parameters. The test should be validated for the product concerned.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3509
        - source_label: PIC/S
          locator: line:3510
        - source_label: PIC/S
          locator: line:3511
        - source_label: PIC/S
          locator: line:3512
        children: []
      - nid: ann1.sec10.p10_6
        kind: paragraph
        kind_raw: '10.6'
        num: '10.6'
        ord: 603
        heading: null
        text: 'The sterility test should be performed under aseptic conditions. Samples taken for sterility testing should be representative of the whole of the batch but should in particular include samples taken from parts of the batch considered to be most at risk of contamination, for example:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3514
        - source_label: PIC/S
          locator: line:3515
        - source_label: PIC/S
          locator: line:3516
        - source_label: PIC/S
          locator: line:3517
        children:
        - nid: ann1.sec10.p10_6.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 604
          heading: null
          text: "For products which have been filled aseptically, samples should include\n              containers filled at the beginning and end of the batch. Additional samples,\n              e.g. taken after critical interventions should be considered based on risk."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
