        children: []
      - nid: ann1.sec5.p5_3
        kind: paragraph
        kind_raw: '5.3'
        num: '5.3'
        ord: 141
        heading: null
        text: As far as practicable, equipment, fittings and services should be designed and installed so that operations, maintenance, and repairs can be performed outside the cleanroom. If maintenance has to be performed in the cleanroom, and the required standards of cleanliness and/or asepsis cannot be maintained, then precautions such as restricting access to the work area to specified personnel, generation of clearly defined work protocols and maintenance procedures should be considered. Additional cleaning, disinfection and environmental monitoring should also be considered. If sterilisation of equipment is required, it should be carried out, wherever possible, after complete reassembly.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
