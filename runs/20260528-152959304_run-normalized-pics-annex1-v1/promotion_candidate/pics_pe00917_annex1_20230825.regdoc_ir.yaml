        text: The environmental control and monitoring programme should take into consideration the moving parts and complex airflow paths generated by the BFS process and the effect of the high heat outputs of the process, (e.g. through the use of airflow visualization studies and/or other equivalent studies). Environmental monitoring programmes should also consider factors such as air-filter configuration, air-filter integrity, cooling systems integrity (see paragraph 6.21), equipment design and qualification.
