          children: []
        - nid: ann1.sec8.p8_106.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 409
          heading: null
          text: "For rotary-type equipment used for aseptic filling, the parison is generally\n             closed to the environment once formed, the filling environment within the\n             parison should be designed and maintained to meet grade A conditions for\n             viable and total particle limits both at rest and when in operation."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
