        children: []
      - nid: ann1.sec8.p8_73
        kind: paragraph
        kind_raw: '8.73'
        num: '8.73'
        ord: 322
        heading: null
        text: "This method should only be used when no other method is practicable. During\n            process validation, it should be shown that there is no damaging effect on the\n            product and that the conditions and time allowed for degassing result in the\n            reduction of any residual ethylene oxide (EO) gas and reaction products to\n            defined acceptable limits for the given product or material."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2056
        - source_label: PIC/S
          locator: line:2057
        - source_label: PIC/S
          locator: line:2058
        - source_label: PIC/S
          locator: line:2059
        - source_label: PIC/S
          locator: line:2060
        children: []
      - nid: ann1.sec8.p8_74
        kind: paragraph
        kind_raw: '8.74'
        num: '8.74'
        ord: 323
        heading: null
        text: "Direct contact between gas and microbial cells is essential, precautions should\n            be taken to avoid the presence of organisms likely to be enclosed in material\n            such as crystals or dried protein. The nature, porosity and quantity of packaging\n            materials can significantly affect the process."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2062
        - source_label: PIC/S
          locator: line:2063
        - source_label: PIC/S
          locator: line:2064
        - source_label: PIC/S
          locator: line:2065
        children: []
      - nid: ann1.sec8.p8_75
        kind: paragraph
        kind_raw: '8.75'
        num: '8.75'
        ord: 324
        heading: null
        text: "Before exposure to the gas, materials should be brought into equilibrium\n            with the humidity and temperature required by the process. Where steam is\n            used to condition the load for sterilisation, it should be of an appropriate quality.\n            The time required for this should be balanced against the opposing need to\n            minimize the time before sterilisation."
        role: normative
        normativity: must
