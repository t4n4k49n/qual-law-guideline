      - nid: ann1.sec4.p4_28
        kind: paragraph
        kind_raw: '4.28'
        num: '4.28'
        ord: 107
        heading: null
        text: For classification of the cleanroom, the minimum number of sampling locations and their positioning can be found in ISO 14644 Part 1. For the aseptic processing area and the background environment (the grade A and grade B areas, respectively), additional sample locations should be considered and all critical processing areas such as the point of fill and container closure feeder bowls should be evaluated. Critical processing locations should be determined by documented risk assessment and knowledge of the process and operations to be performed in the area.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:736
