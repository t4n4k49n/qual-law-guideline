            locator: line:3235
          children: []
        - nid: ann1.sec9.p9_34.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 557
          heading: null
          text: "The inclusion and frequency of interventions in the APS should be based on\n              assessed risks posed to product sterility."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3237
          - source_label: PIC/S
