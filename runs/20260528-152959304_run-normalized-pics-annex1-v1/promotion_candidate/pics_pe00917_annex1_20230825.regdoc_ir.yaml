        children: []
      - nid: ann1.sec6.p6_7
        kind: paragraph
        kind_raw: '6.7'
        num: '6.7'
        ord: 164
        heading: null
        text: Water treatment plant and distribution systems should be designed, constructed, installed, commissioned, qualified, monitored and maintained to prevent microbiological contamination and to ensure a reliable source of water of an appropriate quality. Measures should be taken to minimize the risk of presence of particulates, microbial contamination/proliferation and endotoxin/pyrogen (e.g. sloping of piping to provide complete drainage and the avoidance of dead legs). Where filters are included in the system, special attention should be given to their monitoring and maintenance. Water produced should comply with the current monograph of the relevant Pharmacopeia.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
