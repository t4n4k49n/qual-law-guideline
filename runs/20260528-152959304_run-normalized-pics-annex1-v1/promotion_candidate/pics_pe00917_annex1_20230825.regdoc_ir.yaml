      - nid: ann1.sec10.p10_8
        kind: paragraph
        kind_raw: '10.8'
        num: '10.8'
        ord: 609
        heading: null
        text: Any process (e.g. Vaporized Hydrogen Peroxide, Ultra Violet) used to decontaminate the external surfaces of sterility samples prior to testing should not negatively impact the sensitivity of the test method or the reliability of the sample.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
