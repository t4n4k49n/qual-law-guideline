      - nid: ann1.sec7.p7_12
        kind: paragraph
        kind_raw: '7.12'
        num: '7.12'
        ord: 192
        heading: null
        text: Clothing should be chosen to limit shedding due to operators’ movement.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1271
        children: []
      - nid: ann1.sec7.p7_13
        kind: paragraph
        kind_raw: '7.13'
        num: '7.13'
        ord: 193
        heading: null
        text: "A description of typical clothing required for each cleanliness grade is given\n            below:"
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1273
        - source_label: PIC/S
          locator: line:1274
        children:
        - nid: ann1.sec7.p7_13.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 194
          heading: null
          text: "Grade B (including access / interventions into grade A): appropriate garments\n             that are dedicated for use under a sterilised suit should be worn before gowning\n             (see paragraph 7.14). Appropriately sterilised, non-powdered, rubber or plastic\n             gloves should be worn while donning the sterilised garments. Sterile headgear\n             should enclose all hair (including facial hair) and where separate from the rest\n             of the gown, it should be tucked into the neck of the sterile suit. A sterile\n             facemask and sterile eye coverings (e.g. goggles) should be worn to cover and\n             enclose all facial skin and prevent the shedding of droplets and particles.\n             Appropriate sterilised footwear (e.g. over-boots) should be worn. Trouser legs\n             should be tucked inside the footwear. Garment sleeves should be tucked into a\n             second pair of sterile gloves worn over the pair worn while donning the gown.\n             The protective clothing should minimize shedding of fibres or particles and\n             retain particles shed by the body. The particle shedding and the particle\n             retention efficiencies of the garments should be assessed during the garment\n             qualification. Garments should be packed and folded in such a way as to allow\n             operators to don the gown without contacting the outer surface of the garment\n             and to prevent the garment from touching the floor."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
