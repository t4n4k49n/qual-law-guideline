      - nid: ann1.sec6.p6_14
        kind: paragraph
        kind_raw: '6.14'
        num: '6.14'
        ord: 171
        heading: null
        text: Alert level excursions should be documented and reviewed, and include an investigation to determine whether the excursion is a single (isolated) event or if results are indicative of an adverse trend or system deterioration. Each action limit excursion should be investigated to determine the probable root causes and any potential impact on the quality of products and manufacturing processes as a result of the use of the water.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
