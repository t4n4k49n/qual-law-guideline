      - nid: ann1.sec9.p9_33
        kind: paragraph
        kind_raw: '9.33'
        num: '9.33'
        ord: 543
        heading: null
        text: 'The APS should imitate as closely as possible the routine aseptic manufacturing process and include all the critical manufacturing steps, specifically:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3173
        - source_label: PIC/S
          locator: line:3174
        children:
        - nid: ann1.sec9.p9_33.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 544
          heading: null
          text: "The APS should assess all aseptic operations performed subsequent to the\n              sterilisation and decontamination cycles of materials utilised in the process\n              to the point where the container is sealed."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3176
          - source_label: PIC/S
            locator: line:3177
          - source_label: PIC/S
            locator: line:3178
          children: []
        - nid: ann1.sec9.p9_33.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 545
          heading: null
          text: "For non-filterable formulations, any additional aseptic steps should be\n              assessed."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3180
          - source_label: PIC/S
            locator: line:3181
          children: []
        - nid: ann1.sec9.p9_33.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 546
          heading: null
          text: "Where aseptic manufacturing is performed under an inert atmosphere, the\n              inert gas should be substituted with air in the process simulation unless\n              anaerobic simulation is intended."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3183
          - source_label: PIC/S
            locator: line:3184
          - source_label: PIC/S
            locator: line:3185
          children: []
        - nid: ann1.sec9.p9_33.iiv
          kind: item
          kind_raw: iv.
          num: iv
          ord: 547
          heading: null
          text: "Processes requiring the addition of sterile powders should use an acceptable\n              surrogate material in the same containers as those used in the process under\n              evaluation."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3187
          - source_label: PIC/S
            locator: line:3188
          - source_label: PIC/S
            locator: line:3189
          children: []
        - nid: ann1.sec9.p9_33.iv
          kind: item
          kind_raw: v.
          num: v
          ord: 548
          heading: null
          text: "Separate simulations of individual unit operations (e.g. processes involving\n              drying, blending, milling and subdivision of a sterile powder) should be\n              avoided. Any use of individual simulations should be supported by a\n              documented justification and ensure that the sum total of the individual\n              simulations continues to fully cover the whole process."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3191
          - source_label: PIC/S
            locator: line:3192
          - source_label: PIC/S
            locator: line:3193
          - source_label: PIC/S
            locator: line:3194
          - source_label: PIC/S
            locator: line:3202
          children: []
        - nid: ann1.sec9.p9_33.ivi
          kind: item
          kind_raw: vi.
          num: vi
          ord: 549
          heading: null
          text: "The process simulation procedure for lyophilized products should represent\n              the entire aseptic processing chain including filling, transport, loading, a\n              representative duration of the chamber dwell, unloading and sealing under\n              specified, documented and justified conditions representing worst case\n              operating parameters."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3204
          - source_label: PIC/S
            locator: line:3205
          - source_label: PIC/S
            locator: line:3206
          - source_label: PIC/S
            locator: line:3207
          - source_label: PIC/S
            locator: line:3208
          children: []
        - nid: ann1.sec9.p9_33.ivii
          kind: item
          kind_raw: vii.
          num: vii
          ord: 550
          heading: null
          text: "The lyophilization process simulation should mimic all aspects of the\n              process, except those that may affect the viability or recovery of\n              contaminants. For instance, boiling-over or actual freezing of the solution\n              should be avoided. Factors to consider in determining APS design include,\n              where applicable:"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3210
