      - nid: ann1.sec9.p9_7
        kind: paragraph
        kind_raw: '9.7'
        num: '9.7'
        ord: 493
        heading: null
        text: The monitoring of grade A should demonstrate the maintenance of aseptic processing conditions during critical operations. Monitoring should be performed at locations posing the highest risk of contamination to the sterile equipment surfaces, containers, closures and product. The selection of monitoring locations and the orientation and positioning of sampling devices should be justified and appropriate to obtain reliable data from the critical zones.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
