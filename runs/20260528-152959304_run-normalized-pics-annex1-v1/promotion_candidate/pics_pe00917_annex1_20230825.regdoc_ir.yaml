        - source_label: PIC/S
          locator: line:1673
        - source_label: PIC/S
          locator: line:1674
        - source_label: PIC/S
          locator: line:1675
        - source_label: PIC/S
          locator: line:1676
        - source_label: PIC/S
          locator: line:1677
        children: []
      - nid: ann1.sec8.p8_32
        kind: paragraph
        kind_raw: '8.32'
        num: '8.32'
        ord: 268
        heading: null
        text: Where automated methods of inspection are used, the process should be validated to detect known defects (which may impact product quality or safety) and be equal to, or better than, manual inspection methods. The performance of the equipment should be challenged using representative defects prior to start up and at regular intervals throughout the batch.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1679
        - source_label: PIC/S
          locator: line:1680
        - source_label: PIC/S
          locator: line:1681
        - source_label: PIC/S
          locator: line:1682
        - source_label: PIC/S
          locator: line:1683
        children: []
      - nid: ann1.sec8.p8_33
        kind: paragraph
        kind_raw: '8.33'
        num: '8.33'
        ord: 269
        heading: null
        text: 'Results of the inspection should be recorded and defect types and numbers trended. Reject levels for the various defect types should also be trended based on statistical principles. Impact to product on the market should be assessed as part of the investigation when adverse trends are observed.


          STERILISATION'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1685
        - source_label: PIC/S
          locator: line:1686
        - source_label: PIC/S
          locator: line:1687
        - source_label: PIC/S
          locator: line:1688
        - source_label: PIC/S
          locator: line:1691
        children: []
      - nid: ann1.sec8.p8_34
        kind: paragraph
        kind_raw: '8.34'
        num: '8.34'
        ord: 270
        heading: null
        text: Where possible, finished product should be terminally sterilised, using a validated and controlled sterilisation process, as this provides a greater assurance of sterility than a validated and controlled sterile filtration process and/or aseptic processing. Where it is not possible for a product to undergo terminal sterilisation, consideration should be given to using post-aseptic processing terminal heat treatment, combined with aseptic process to give improved sterility assurance.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1693
        - source_label: PIC/S
          locator: line:1694
        - source_label: PIC/S
          locator: line:1695
        - source_label: PIC/S
          locator: line:1696
        - source_label: PIC/S
          locator: line:1697
        - source_label: PIC/S
          locator: line:1698
        children: []
      - nid: ann1.sec8.p8_35
        kind: paragraph
        kind_raw: '8.35'
        num: '8.35'
        ord: 271
        heading: null
        text: The selection, design and location of the equipment and cycle/programme used for sterilisation should be based on scientific principles and data which demonstrate repeatability and reliability of the sterilisation process. All parameters should be defined, and where critical, these should be controlled, monitored and recorded.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1700
        - source_label: PIC/S
          locator: line:1701
        - source_label: PIC/S
          locator: line:1702
        - source_label: PIC/S
          locator: line:1703
        - source_label: PIC/S
          locator: line:1704
        children: []
      - nid: ann1.sec8.p8_36
        kind: paragraph
        kind_raw: '8.36'
        num: '8.36'
        ord: 272
        heading: null
        text: 'All sterilisation processes should be validated. Validation studies should take into account the product composition, storage conditions and maximum time between the start of the preparation of a product or material to be sterilised and its sterilisation. Before any sterilisation process is adopted, its suitability for the product and equipment, and its efficacy in consistently achieving the desired


          sterilising conditions in all parts of each type of load to be processed should be validated notably by physical measurements and where appropriate by Biological Indicators (BI). For effective sterilisation, the whole of the product, and surfaces of equipment and components should be subject to the required treatment and the process should be designed to ensure that this is achieved.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1706
        - source_label: PIC/S
          locator: line:1707
        - source_label: PIC/S
          locator: line:1708
        - source_label: PIC/S
          locator: line:1709
        - source_label: PIC/S
          locator: line:1710
        - source_label: PIC/S
          locator: line:1718
        - source_label: PIC/S
          locator: line:1719
        - source_label: PIC/S
          locator: line:1720
        - source_label: PIC/S
          locator: line:1721
        - source_label: PIC/S
          locator: line:1722
        children: []
      - nid: ann1.sec8.p8_37
        kind: paragraph
        kind_raw: '8.37'
        num: '8.37'
        ord: 273
        heading: null
        text: Particular attention should be given when the adopted product sterilisation method is not described in the current edition of the Pharmacopoeia, or when it is used for a product which is not a simple aqueous solution. Where possible, heat sterilisation is the method of choice.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1724
        - source_label: PIC/S
          locator: line:1725
        - source_label: PIC/S
          locator: line:1726
        - source_label: PIC/S
          locator: line:1727
        children: []
      - nid: ann1.sec8.p8_38
        kind: paragraph
        kind_raw: '8.38'
        num: '8.38'
        ord: 274
        heading: null
        text: Validated loading patterns should be established for all sterilisation processes and load patterns should be subject to periodic revalidation. Maximum and minimum loads should also be considered as part of the overall load validation strategy.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1729
        - source_label: PIC/S
          locator: line:1730
        - source_label: PIC/S
          locator: line:1731
        - source_label: PIC/S
          locator: line:1732
        children: []
      - nid: ann1.sec8.p8_39
        kind: paragraph
        kind_raw: '8.39'
        num: '8.39'
        ord: 275
        heading: null
        text: The validity of the sterilizing process should be reviewed and verified at scheduled intervals based on risk. Heat sterilization cycles should be revalidated with a minimum frequency of at least annually for load patterns that are considered worst case. Other load patterns should be validated at a frequency justified in the CCS.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1734
        - source_label: PIC/S
          locator: line:1735
        - source_label: PIC/S
          locator: line:1736
        - source_label: PIC/S
          locator: line:1737
        - source_label: PIC/S
          locator: line:1738
        children: []
      - nid: ann1.sec8.p8_40
        kind: paragraph
        kind_raw: '8.40'
        num: '8.40'
        ord: 276
        heading: null
        text: Routine operating parameters should be established and adhered to for all sterilisation processes, e.g. physical parameters and loading patterns.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1740
        - source_label: PIC/S
          locator: line:1741
        children: []
      - nid: ann1.sec8.p8_41
        kind: paragraph
        kind_raw: '8.41'
        num: '8.41'
        ord: 277
        heading: null
        text: There should be mechanisms in place to detect a sterilisation cycle that does not conform to the validated parameters. Any failed sterilisation or sterilisation that deviated from the validated process (e.g. have longer or shorter phases such as heating cycles) should be investigated.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1743
        - source_label: PIC/S
          locator: line:1744
        - source_label: PIC/S
          locator: line:1745
        - source_label: PIC/S
          locator: line:1746
        children: []
      - nid: ann1.sec8.p8_42
        kind: paragraph
        kind_raw: '8.42'
        num: '8.42'
        ord: 278
        heading: null
        text: Suitable BIs placed at appropriate locations should be considered as an additional method to support the validation of the sterilisation process. BIs should be stored and used according to the manufacturer’s instructions. Where BIs are used to support validation and/or to monitor a sterilisation process (e.g. with ethylene oxide), positive controls should be tested for each sterilisation cycle. If BIs are used, strict precautions should be taken to avoid transferring microbial contamination to the manufacturing or other testing processes. BI results in isolation should not be used to override other critical parameters and process design elements.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1748
        - source_label: PIC/S
          locator: line:1749
        - source_label: PIC/S
          locator: line:1750
        - source_label: PIC/S
          locator: line:1751
        - source_label: PIC/S
          locator: line:1752
        - source_label: PIC/S
          locator: line:1753
        - source_label: PIC/S
          locator: line:1754
        - source_label: PIC/S
          locator: line:1755
        - source_label: PIC/S
          locator: line:1756
        children: []
      - nid: ann1.sec8.p8_43
        kind: paragraph
        kind_raw: '8.43'
        num: '8.43'
        ord: 279
        heading: null
        text: The reliability of BIs is important. Suppliers should be qualified and transportation and storage conditions should be controlled in order that BI quality is not compromised. Prior to use of a new batch/lot of BIs, the population, purity and identity of the indicator organism of the batch/lot should be verified. For other critical parameters, e.g. D-value, Z-value, the batch certificate provided by the qualified supplier can normally be used.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1758
        - source_label: PIC/S
          locator: line:1759
        - source_label: PIC/S
          locator: line:1760
        - source_label: PIC/S
          locator: line:1761
        - source_label: PIC/S
          locator: line:1762
        - source_label: PIC/S
          locator: line:1763
        children: []
      - nid: ann1.sec8.p8_44
        kind: paragraph
        kind_raw: '8.44'
        num: '8.44'
        ord: 280
        heading: null
        text: 'There should be a clear means of differentiating products, equipment and components, which have not been subjected to the sterilisation process from those which have. Equipment such as baskets or trays used to carry products, other items of equipment and/or components should be clearly labelled (or electronically tracked) with the product name and batch number and an indication of whether or not it has been sterilised. Indicators such as autoclave tape, or


          irradiation indicators may be used, where appropriate, to indicate whether or not a batch (or sub-batch material, component, equipment) has passed through a sterilisation process. However, these indicators show only that the sterilisation process has occurred; they do not indicate product sterility or achievement of the required sterility assurance level.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1765
        - source_label: PIC/S
          locator: line:1766
        - source_label: PIC/S
          locator: line:1767
        - source_label: PIC/S
          locator: line:1768
        - source_label: PIC/S
          locator: line:1769
        - source_label: PIC/S
          locator: line:1770
        - source_label: PIC/S
          locator: line:1778
        - source_label: PIC/S
          locator: line:1779
        - source_label: PIC/S
          locator: line:1780
        - source_label: PIC/S
          locator: line:1781
        - source_label: PIC/S
          locator: line:1782
        children: []
      - nid: ann1.sec8.p8_45
        kind: paragraph
        kind_raw: '8.45'
        num: '8.45'
        ord: 281
        heading: null
        text: Sterilisation records should be available for each sterilisation run. Each cycle should have a unique identifier. Their conformity should be reviewed and approved as part of the batch certification/release procedure.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1784
        - source_label: PIC/S
          locator: line:1785
        - source_label: PIC/S
          locator: line:1786
        children: []
      - nid: ann1.sec8.p8_46
        kind: paragraph
        kind_raw: '8.46'
        num: '8.46'
        ord: 282
        heading: null
        text: Where required, materials, equipment and components should be sterilised by validated methods appropriate to the specific material. Suitable protection after sterilisation should be provided to prevent recontamination. If sterilised items are not used immediately after sterilisation, these should be stored using appropriately sealed packaging and a maximum hold time should be established. Where justified, components that have been packaged with multiple sterile packaging layers need not be stored in a cleanroom if the integrity and configuration of the sterile pack allows the items to be readily disinfected during transfer by operators into grade A (e.g. by the use of multiple sterile coverings that can be removed at each transfer from lower to higher grade). Where protection is achieved by containment in sealed packaging, this packaging process should be undertaken prior to sterilisation.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1788
        - source_label: PIC/S
          locator: line:1789
        - source_label: PIC/S
          locator: line:1790
        - source_label: PIC/S
          locator: line:1791
        - source_label: PIC/S
          locator: line:1792
        - source_label: PIC/S
          locator: line:1793
        - source_label: PIC/S
          locator: line:1794
        - source_label: PIC/S
          locator: line:1795
        - source_label: PIC/S
          locator: line:1796
        - source_label: PIC/S
          locator: line:1797
        - source_label: PIC/S
          locator: line:1798
        - source_label: PIC/S
          locator: line:1799
        children: []
      - nid: ann1.sec8.p8_47
        kind: paragraph
        kind_raw: '8.47'
        num: '8.47'
        ord: 283
        heading: null
        text: Where materials, equipment, components and ancillary items are sterilised in sealed packaging and then transferred into grade A, this should be done using appropriate validated methods (for example, airlocks or pass-through hatches) with accompanying disinfection of the exterior of the sealed packaging. The use of rapid transfer port technology should also be considered. These methods should be demonstrated to effectively control the potential risk of contamination of the grade A and grade B areas and, likewise, the disinfection procedure should be demonstrated to be effective in reducing any contamination on the packaging to acceptable levels for entry of the item into the grade B and grade A areas.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1801
        - source_label: PIC/S
          locator: line:1802
        - source_label: PIC/S
          locator: line:1803
        - source_label: PIC/S
          locator: line:1804
        - source_label: PIC/S
          locator: line:1805
        - source_label: PIC/S
          locator: line:1806
        - source_label: PIC/S
          locator: line:1807
        - source_label: PIC/S
          locator: line:1808
        - source_label: PIC/S
          locator: line:1809
        children: []
      - nid: ann1.sec8.p8_48
        kind: paragraph
        kind_raw: '8.48'
        num: '8.48'
        ord: 284
        heading: null
        text: Where materials, equipment, components and ancillary items are sterilised in sealed packaging or containers, the packaging should be qualified for minimizing the risk of particulate, microbial, endotoxin/pyrogen or chemical contamination, and for compatibility with the selected sterilisation method. The packaging sealing process should be validated. The validation should consider the integrity of the sterile protective barrier system, the maximum hold time before sterilisation and the maximum shelf life assigned to the sterilised items. The integrity of the sterile protective barrier system for each of the sterilised items should be checked prior to use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1811
        - source_label: PIC/S
          locator: line:1812
        - source_label: PIC/S
          locator: line:1813
        - source_label: PIC/S
          locator: line:1814
        - source_label: PIC/S
          locator: line:1815
        - source_label: PIC/S
          locator: line:1816
        - source_label: PIC/S
          locator: line:1817
        - source_label: PIC/S
          locator: line:1818
        - source_label: PIC/S
          locator: line:1819
        children: []
      - nid: ann1.sec8.p8_49
        kind: paragraph
        kind_raw: '8.49'
        num: '8.49'
        ord: 285
        heading: null
        text: 'For materials, equipment, components and ancillary items that are not a direct or indirect product contact part and are necessary for aseptic processing but cannot be sterilised, an effective and validated disinfection and transfer process should be in place. These items, once disinfected, should be protected to prevent recontamination. These items, and others representing potential routes of contamination, should be included in the environmental monitoring programme.


          STERILISATION BY HEAT'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1821
        - source_label: PIC/S
          locator: line:1822
        - source_label: PIC/S
          locator: line:1823
        - source_label: PIC/S
          locator: line:1824
        - source_label: PIC/S
          locator: line:1825
        - source_label: PIC/S
          locator: line:1826
        - source_label: PIC/S
          locator: line:1836
        children: []
      - nid: ann1.sec8.p8_50
        kind: paragraph
        kind_raw: '8.50'
        num: '8.50'
        ord: 286
        heading: null
        text: Each heat sterilisation cycle should be recorded either electronically or by hardcopy, using equipment with suitable accuracy and precision. The system should have safeguards and/or redundancy in its control and monitoring instrumentation to detect a cycle not conforming to the validated cycle parameter requirements and abort or fail this cycle (e.g. by the use of duplex/double probes connected to independent control and monitoring systems).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1838
        - source_label: PIC/S
          locator: line:1839
        - source_label: PIC/S
          locator: line:1840
        - source_label: PIC/S
          locator: line:1841
        - source_label: PIC/S
          locator: line:1842
        - source_label: PIC/S
          locator: line:1843
        children: []
      - nid: ann1.sec8.p8_51
        kind: paragraph
        kind_raw: '8.51'
        num: '8.51'
        ord: 287
        heading: null
        text: The position of the temperature probes used for controlling and/or recording should be determined during the validation and selected based on system design and in order to correctly record and represent routine cycle conditions. Validation studies should be designed to demonstrate the suitability of system control and recording probe locations, and should include the verification of the function and location of these probes by the use of an independent monitoring probe located at the same position during validation.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1845
        - source_label: PIC/S
          locator: line:1846
        - source_label: PIC/S
          locator: line:1847
        - source_label: PIC/S
          locator: line:1848
        - source_label: PIC/S
          locator: line:1849
        - source_label: PIC/S
          locator: line:1850
        - source_label: PIC/S
          locator: line:1851
        children: []
      - nid: ann1.sec8.p8_52
        kind: paragraph
        kind_raw: '8.52'
        num: '8.52'
        ord: 288
        heading: null
        text: The whole of the load should reach the required temperature before measurement of the sterilising time-period starts. For sterilisation cycles controlled by using a reference probe within the load, specific consideration should be given to ensuring the load probe temperature is controlled within defined temperature range prior to cycle commencement.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1853
        - source_label: PIC/S
          locator: line:1854
        - source_label: PIC/S
          locator: line:1855
        - source_label: PIC/S
          locator: line:1856
        - source_label: PIC/S
          locator: line:1857
        children: []
      - nid: ann1.sec8.p8_53
        kind: paragraph
        kind_raw: '8.53'
        num: '8.53'
        ord: 289
        heading: null
        text: After completion of the high temperature phase of a heat sterilisation cycle, precautions should be taken against contamination of a sterilised load during cooling. Any cooling liquid or gas that comes into contact with the product or sterilised material should be sterilised.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1859
        - source_label: PIC/S
          locator: line:1860
        - source_label: PIC/S
          locator: line:1861
        - source_label: PIC/S
          locator: line:1862
        children: []
      - nid: ann1.sec8.p8_54
        kind: paragraph
        kind_raw: '8.54'
        num: '8.54'
        ord: 290
        heading: null
        text: 'In those cases where parametric release has been authorized, a robust system should be applied to the product lifecycle validation and the routine monitoring of the manufacturing process. This system should be periodically reviewed. Further guidance regarding parametric release is provided in Annex 17.


          MOIST HEAT STERILISATION'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1864
        - source_label: PIC/S
          locator: line:1865
        - source_label: PIC/S
          locator: line:1866
        - source_label: PIC/S
          locator: line:1867
        - source_label: PIC/S
          locator: line:1870
        children: []
      - nid: ann1.sec8.p8_55
        kind: paragraph
        kind_raw: '8.55'
        num: '8.55'
        ord: 291
        heading: null
        text: Moist heat sterilisation can be achieved using steam, (direct or indirect contact), but also includes other systems such as superheated water systems (cascade or immersion cycles) that could be used for containers that may be damaged by other cycle designs (e.g. Blow-Fill-Seal containers, plastic bags).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1872
        - source_label: PIC/S
          locator: line:1873
        - source_label: PIC/S
          locator: line:1874
        - source_label: PIC/S
          locator: line:1875
        children: []
      - nid: ann1.sec8.p8_56
        kind: paragraph
        kind_raw: '8.56'
        num: '8.56'
        ord: 292
        heading: null
        text: The items to be sterilised, other than products in sealed containers, should be dry, packaged in a protective barrier system which allows removal of air and penetration of steam and prevents recontamination after sterilisation. All loaded items should be dry upon removal from the steriliser. Load dryness should be confirmed by visual inspection as a part of the sterilisation process acceptance.
        role: normative
        normativity: must
        tags: []
