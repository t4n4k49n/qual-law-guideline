        kind: paragraph
        kind_raw: '8.137'
        num: '8.137'
        ord: 477
        heading: null
        text: SUS should be designed to maintain integrity throughout processing under the intended operational conditions. Attention to the structural integrity of the single use components is necessary where these may be exposed to more extreme conditions (e.g. freezing and thawing processes) either during routine processing or transportation. This should include verification that intrinsic sterile connection devices (both heat sealed and mechanically sealed) remain integral under these conditions.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
