      - nid: ann1.sec9.p9_36
        kind: paragraph
        kind_raw: '9.36'
        num: '9.36'
        ord: 559
        heading: null
        text: 'In developing the APS plan, consideration should be given to the following:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3243
        children:
        - nid: ann1.sec9.p9_36.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 560
          heading: null
          text: "Identification of worst case conditions covering the relevant variables, such\n              as container size and line speed, and their impact on the process. The\n              outcome of the assessment should justify the variables selected."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3245
          - source_label: PIC/S
            locator: line:3246
          - source_label: PIC/S
            locator: line:3247
          children: []
        - nid: ann1.sec9.p9_36.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 561
          heading: null
          text: "Determining the representative sizes of container/closure combinations to be\n              used for validation. Bracketing or matrix approach may be considered for\n              validation of the same container/closure configuration for different products\n              where process equivalence is scientifically justified."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3249
          - source_label: PIC/S
            locator: line:3250
          - source_label: PIC/S
            locator: line:3251
          - source_label: PIC/S
            locator: line:3252
          children: []
        - nid: ann1.sec9.p9_36.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 562
          heading: null
          text: "Maximum permitted holding times for sterile product and equipment exposed\n               during the aseptic process."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3254
          - source_label: PIC/S
            locator: line:3262
          children: []
        - nid: ann1.sec9.p9_36.iiv
          kind: item
          kind_raw: iv.
          num: iv
          ord: 563
          heading: null
          text: "The volume filled per container, which should be sufficient to ensure that the\n               media contacts all equipment and component surfaces that may directly\n               contaminate the sterile product. The volume used should provide sufficient\n               headspace to support potential microbial growth and ensure that turbidity can\n               be detected during inspection."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3264
          - source_label: PIC/S
            locator: line:3265
          - source_label: PIC/S
            locator: line:3266
          - source_label: PIC/S
            locator: line:3267
          - source_label: PIC/S
            locator: line:3268
          children: []
        - nid: ann1.sec9.p9_36.iv
          kind: item
          kind_raw: v.
          num: v
          ord: 564
          heading: null
          text: "The requirement for substitution of any inert gas used in the routine aseptic\n               manufacturing process by air unless anaerobic simulation is intended. In\n               these situations, inclusion of occasional anaerobic simulations as part of the\n               overall validation strategy should be considered (see paragraph 9.33 point\n               iii)."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3270
          - source_label: PIC/S
            locator: line:3271
          - source_label: PIC/S
            locator: line:3272
          - source_label: PIC/S
            locator: line:3273
          - source_label: PIC/S
            locator: line:3274
          children: []
        - nid: ann1.sec9.p9_36.ivi
          kind: item
          kind_raw: vi.
          num: vi
          ord: 565
          heading: null
          text: "The selected nutrient media should be capable of growing a designated\n               group of reference microorganisms as described by the relevant\n               pharmacopeia and suitably representative local isolates."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
