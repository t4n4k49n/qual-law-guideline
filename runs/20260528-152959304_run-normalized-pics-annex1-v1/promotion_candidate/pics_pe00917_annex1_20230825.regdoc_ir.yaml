    - nid: ann1.sec8
      kind: section
      kind_raw: '8'
      num: '8'
      ord: 203
      heading: Production and Specific Technologies
      text: TERMINALLY STERILISED PRODUCTS
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:1362
      - source_label: PIC/S
        locator: line:1363
      children:
      - nid: ann1.sec8.p8_1
        kind: paragraph
        kind_raw: '8.1'
        num: '8.1'
        ord: 204
        heading: null
        text: Preparation of components and materials should be performed in at least a grade D cleanroom in order to limit the risk of microbial, endotoxin/pyrogen and particle contamination, so that the product is suitable for sterilisation. Where the product is at a high or unusual risk of microbial contamination (e.g. the product actively supports microbial growth, the product must be held for long periods before filling or the product is not processed mostly in closed vessels), then preparation should be carried out in at least a grade C environment. Preparation of ointments, creams, suspensions and emulsions should be carried out in at least a grade C environment before terminal sterilisation. Specific guidance regarding terminally sterilised veterinary medicinal products can be found within Annex 4 of the GMP Guide.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1365
        - source_label: PIC/S
          locator: line:1366
        - source_label: PIC/S
          locator: line:1367
        - source_label: PIC/S
          locator: line:1368
        - source_label: PIC/S
          locator: line:1369
        - source_label: PIC/S
          locator: line:1370
        - source_label: PIC/S
          locator: line:1371
        - source_label: PIC/S
          locator: line:1372
        - source_label: PIC/S
          locator: line:1373
        - source_label: PIC/S
          locator: line:1374
        - source_label: PIC/S
          locator: line:1375
        children: []
      - nid: ann1.sec8.p8_2
        kind: paragraph
        kind_raw: '8.2'
        num: '8.2'
        ord: 205
        heading: null
        text: Primary packaging containers and components should be cleaned using validated processes to ensure that particle, endotoxin/pyrogen and bioburden contamination is appropriately controlled.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1377
        - source_label: PIC/S
          locator: line:1378
        - source_label: PIC/S
          locator: line:1379
        children: []
      - nid: ann1.sec8.p8_3
        kind: paragraph
        kind_raw: '8.3'
        num: '8.3'
        ord: 206
        heading: null
        text: Filling of products for terminal sterilisation should be carried out in at least a grade C environment.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1381
        - source_label: PIC/S
          locator: line:1382
        children: []
      - nid: ann1.sec8.p8_4
        kind: paragraph
        kind_raw: '8.4'
        num: '8.4'
        ord: 207
        heading: null
        text: Where the CCS identifies that the product is at an unusual risk of contamination from the environment because, for example, the filling operation is slow, the containers are wide necked or are necessarily exposed for more than a few seconds before closing, then the product should be filled in grade A with at least a grade C background.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1384
        - source_label: PIC/S
          locator: line:1385
        - source_label: PIC/S
          locator: line:1386
        - source_label: PIC/S
          locator: line:1387
        - source_label: PIC/S
          locator: line:1388
