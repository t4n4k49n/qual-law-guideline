        - nid: ann1.sec7.p7_13.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 195
          heading: null
          text: 'Grade C: Hair, beards and moustaches should be covered. A single or two-piece trouser suit gathered at the wrists and with high neck and appropriately disinfected shoes or overshoes should be worn. They should minimize the shedding of fibres and particles.'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1293
          - source_label: PIC/S
            locator: line:1302
          - source_label: PIC/S
            locator: line:1303
          - source_label: PIC/S
            locator: line:1304
          children: []
        - nid: ann1.sec7.p7_13.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 196
          heading: null
          text: 'Grade D: Hair, beards and moustaches should be covered. A general protective suit and appropriately disinfected shoes or overshoes should be worn. Appropriate measures should be taken to avoid any ingress of contaminants from outside the clean area.'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1305
          - source_label: PIC/S
            locator: line:1306
          - source_label: PIC/S
            locator: line:1307
          - source_label: PIC/S
            locator: line:1308
          children: []
        - nid: ann1.sec7.p7_13.iiv
          kind: item
          kind_raw: iv.
          num: iv
          ord: 197
          heading: null
          text: Additional gowning including gloves and facemask may be required in grade C and D areas when performing activities considered to be a contamination risk as defined by the CCS.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
