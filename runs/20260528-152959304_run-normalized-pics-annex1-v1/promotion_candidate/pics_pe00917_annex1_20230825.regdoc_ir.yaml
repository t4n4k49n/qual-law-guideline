          children: []
        - nid: ann1.sec9.p9_36.ix
          kind: item
          kind_raw: x.
          num: x
          ord: 569
          heading: null
          text: "Simulating normal aseptic manufacturing interruptions where the process is\n               idle (e.g. shift changeovers, recharging dispensing vessels, introduction of\n               additional equipment)."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3293
          - source_label: PIC/S
            locator: line:3294
          - source_label: PIC/S
            locator: line:3295
          children: []
        - nid: ann1.sec9.p9_36.ixi
          kind: item
          kind_raw: xi.
          num: xi
          ord: 570
          heading: null
          text: "Ensuring that environmental monitoring is conducted as required for routine\n               production, and throughout the entire duration of the process simulation."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3297
          - source_label: PIC/S
            locator: line:3298
          children: []
        - nid: ann1.sec9.p9_36.ixii
          kind: item
          kind_raw: xii.
          num: xii
          ord: 571
          heading: null
          text: "Where campaign manufacturing occurs, such as in the use of Barrier\n               Technologies or manufacture of sterile active substances, consideration\n               should be given to designing and performing the process simulation so that\n               it simulates the risks associated with both the beginning and the end of the\n               campaign and demonstrating that the campaign duration does not pose any\n               risk."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3300
          - source_label: PIC/S
            locator: line:3301
          - source_label: PIC/S
            locator: line:3302
          - source_label: PIC/S
            locator: line:3303
          - source_label: PIC/S
            locator: line:3304
          - source_label: PIC/S
            locator: line:3305
          children: []
        - nid: ann1.sec9.p9_36.ixiii
          kind: item
          kind_raw: xiii.
          num: xiii
          ord: 572
          heading: null
          text: "The performance of \"end of production or campaign APS\" may be used as\n               additional assurance or investigative purposes; however, their use should be\n               justified in the CCS and should not replace routine APS. If used, it should be\n               demonstrated that any residual product does not negatively impact the\n               recovery of any potential microbial contamination."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3307
          - source_label: PIC/S
            locator: line:3308
          - source_label: PIC/S
            locator: line:3309
          - source_label: PIC/S
            locator: line:3310
          - source_label: PIC/S
            locator: line:3311
          children: []
      - nid: ann1.sec9.p9_37
        kind: paragraph
        kind_raw: '9.37'
        num: '9.37'
        ord: 573
        heading: null
        text: 'For sterile active substances, batch size should be large enough to represent routine operation, simulate intervention operation at the worst case, and cover all


          surfaces that may come into contact with the sterile product. In addition, all the simulated materials (surrogates or growth medium) should be subjected to microbial evaluation. The simulation materials should be sufficient to satisfy the evaluation of the process being simulated and should not compromise the recovery of micro-organisms.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3313
        - source_label: PIC/S
          locator: line:3314
        - source_label: PIC/S
          locator: line:3322
        - source_label: PIC/S
          locator: line:3323
        - source_label: PIC/S
          locator: line:3324
        - source_label: PIC/S
          locator: line:3325
        - source_label: PIC/S
          locator: line:3326
        children: []
      - nid: ann1.sec9.p9_38
        kind: paragraph
        kind_raw: '9.38'
        num: '9.38'
        ord: 574
        heading: null
        text: APS should be performed as part of the initial validation, with at least three consecutive satisfactory simulation tests that cover all working shifts that the aseptic process may occur in, and after any significant modification to operational practices, facilities, services or equipment which are assessed to have an impact on the sterility assurance of the product (e.g. modification to the HVAC system, equipment, changes to process, number of shifts and numbers of personnel, major facility shut down). Normally, APS (periodic revalidation) should be repeated twice a year (approximately every six months) for each aseptic process, each filling line and each shift. Each operator should participate in at least one successful APS annually. Consideration should be given to performing an APS after the last batch prior to shut down, before long periods of inactivity or before decommissioning or relocation of a line.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3328
        - source_label: PIC/S
          locator: line:3329
        - source_label: PIC/S
          locator: line:3330
        - source_label: PIC/S
          locator: line:3331
        - source_label: PIC/S
          locator: line:3332
        - source_label: PIC/S
          locator: line:3333
        - source_label: PIC/S
          locator: line:3334
        - source_label: PIC/S
          locator: line:3335
        - source_label: PIC/S
          locator: line:3336
        - source_label: PIC/S
          locator: line:3337
        - source_label: PIC/S
          locator: line:3338
        - source_label: PIC/S
          locator: line:3339
        children: []
      - nid: ann1.sec9.p9_39
        kind: paragraph
        kind_raw: '9.39'
        num: '9.39'
        ord: 575
        heading: null
        text: Where manual operation (e.g. aseptic compounding or filling) occurs, each type of container, container closure and equipment train should be initially validated with each operator participating in at least 3 consecutive successful APS and revalidated with one APS approximately every 6 months for each operator. The APS batch size should mimic that used in the routine aseptic manufacturing process.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3341
        - source_label: PIC/S
          locator: line:3342
        - source_label: PIC/S
          locator: line:3343
        - source_label: PIC/S
          locator: line:3344
        - source_label: PIC/S
          locator: line:3345
        - source_label: PIC/S
          locator: line:3346
        children: []
      - nid: ann1.sec9.p9_40
        kind: paragraph
        kind_raw: '9.40'
        num: '9.40'
        ord: 576
        heading: null
        text: The number of units processed (filled) for APS should be sufficient to effectively simulate all activities that are representative of the aseptic manufacturing process. Justification for the number of units to be filled should be clearly captured in the CCS. Typically, a minimum of 5000 to 10000 units are filled. For small batches (e.g. those under 5000 units), the number of containers for APS should at least equal the size of the production batch.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3348
        - source_label: PIC/S
          locator: line:3349
        - source_label: PIC/S
          locator: line:3350
        - source_label: PIC/S
          locator: line:3351
        - source_label: PIC/S
          locator: line:3352
        - source_label: PIC/S
          locator: line:3353
        children: []
      - nid: ann1.sec9.p9_41
        kind: paragraph
        kind_raw: '9.41'
        num: '9.41'
        ord: 577
        heading: null
        text: Filled APS units should be agitated, swirled or inverted before incubation to ensure contact of the media with all interior surfaces in the container. All integral units from the APS should be incubated and evaluated, including units with cosmetic defects or those which have gone through non-destructive in-process control checks. If units are discarded during the process simulation and not incubated, these should be comparable with units discarded during a routine fill, and only if production SOPs clearly specify that units must be removed under the same circumstances (i.e. type of intervention; line location; specific number of units removed). In no case should more units be removed during a media fill intervention than would be cleared during a production run. Examples may include those that must be discarded during routine production after the set-up process or following a specific type of intervention. To fully understand the process and assess contamination risks during aseptic setup or mandatory line clearances, these units would typically be incubated separately, and would not necessarily be included in the acceptance criteria for the APS.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3355
        - source_label: PIC/S
          locator: line:3356
        - source_label: PIC/S
          locator: line:3357
        - source_label: PIC/S
          locator: line:3358
        - source_label: PIC/S
          locator: line:3359
        - source_label: PIC/S
          locator: line:3360
        - source_label: PIC/S
          locator: line:3361
        - source_label: PIC/S
          locator: line:3362
        - source_label: PIC/S
          locator: line:3363
        - source_label: PIC/S
          locator: line:3364
        - source_label: PIC/S
          locator: line:3365
        - source_label: PIC/S
          locator: line:3366
        - source_label: PIC/S
          locator: line:3367
        - source_label: PIC/S
          locator: line:3368
        - source_label: PIC/S
          locator: line:3369
        children: []
      - nid: ann1.sec9.p9_42
        kind: paragraph
        kind_raw: '9.42'
        num: '9.42'
        ord: 578
        heading: null
        text: Where processes include materials that contact the product contact surfaces but are then discarded (e.g. product flushes), the discarded material should be simulated with nutrient media and be incubated as part of the APS, unless it can be clearly demonstrated that this waste process would not impact the sterility of the product.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3371
        - source_label: PIC/S
          locator: line:3372
        - source_label: PIC/S
          locator: line:3373
        - source_label: PIC/S
          locator: line:3374
        - source_label: PIC/S
          locator: line:3375
        children: []
      - nid: ann1.sec9.p9_43
        kind: paragraph
        kind_raw: '9.43'
        num: '9.43'
        ord: 579
        heading: null
        text: Filled APS units should be incubated in a clear container to ensure visual detection of microbial growth. Where the product container is not clear (e.g. amber glass, opaque plastic), clear containers of identical configuration may be substituted to aid in the detection of contamination. When a clear container of identical configuration cannot be substituted, a suitable method for the detection of microbial growth should be developed and validated. Microorganisms isolated from contaminated units should be identified to the species level when practical, to assist in the determination of the likely source of the contaminant.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3385
        - source_label: PIC/S
          locator: line:3386
        - source_label: PIC/S
          locator: line:3387
        - source_label: PIC/S
          locator: line:3388
        - source_label: PIC/S
          locator: line:3389
        - source_label: PIC/S
          locator: line:3390
        - source_label: PIC/S
          locator: line:3391
        - source_label: PIC/S
          locator: line:3392
        children: []
      - nid: ann1.sec9.p9_44
        kind: paragraph
        kind_raw: '9.44'
        num: '9.44'
        ord: 580
        heading: null
        text: Filled APS units should be incubated without unnecessary delay to achieve the best possible recovery of potential contamination. The selection of the incubation conditions and duration should be scientifically justified and validated to provide an appropriate level of sensitivity of detection of microbial contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3394
        - source_label: PIC/S
          locator: line:3395
        - source_label: PIC/S
          locator: line:3396
        - source_label: PIC/S
          locator: line:3397
        children: []
      - nid: ann1.sec9.p9_45
        kind: paragraph
        kind_raw: '9.45'
        num: '9.45'
        ord: 581
        heading: null
        text: 'On completion of incubation:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3399
        children:
        - nid: ann1.sec9.p9_45.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 582
          heading: null
          text: "Filled APS units should be inspected by personnel who have been\n              appropriately trained and qualified for the detection of microbiological\n              contamination. Inspection should be conducted under conditions that\n              facilitate the identification of any microbial contamination."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3401
          - source_label: PIC/S
            locator: line:3402
          - source_label: PIC/S
            locator: line:3403
          - source_label: PIC/S
            locator: line:3404
          children: []
        - nid: ann1.sec9.p9_45.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 583
          heading: null
          text: "Samples of the filled units should undergo positive control by inoculation\n              with a suitable range of reference organisms and suitably representative\n              local isolates."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3407
          - source_label: PIC/S
            locator: line:3408
          - source_label: PIC/S
            locator: line:3409
          children: []
      - nid: ann1.sec9.p9_46
        kind: paragraph
        kind_raw: '9.46'
        num: '9.46'
        ord: 584
        heading: null
        text: 'The target should be zero growth. Any contaminated unit should result in a failed APS and the following actions should be taken:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3412
        - source_label: PIC/S
          locator: line:3413
        children:
        - nid: ann1.sec9.p9_46.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 585
          heading: null
          text: an investigation to determine the most probable root cause(s);
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3415
          children: []
        - nid: ann1.sec9.p9_46.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 586
          heading: null
          text: determination and implementation of appropriate corrective measures;
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3417
          children: []
        - nid: ann1.sec9.p9_46.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 587
          heading: null
          text: "a sufficient number of successful, consecutive repeat APS (normally a\n              minimum of 3) should be conducted in order to demonstrate that the process\n              has been returned to a state of control;"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3419
          - source_label: PIC/S
            locator: line:3420
          - source_label: PIC/S
            locator: line:3421
          children: []
        - nid: ann1.sec9.p9_46.iiv
          kind: item
          kind_raw: iv.
          num: iv
          ord: 588
          heading: null
          text: "a prompt review of all appropriate records relating to aseptic production since\n              the last successful APS;\n              a) The outcome of the review should include a risk assessment of potential\n                 sterile breaches in batches manufactured since the last successful APS.\n              b) All other batches not released to the market should be included in the\n                 scope of the investigation. Any decision regarding their release status\n                 should consider the investigation outcome."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3423
          - source_label: PIC/S
            locator: line:3424
          - source_label: PIC/S
            locator: line:3426
          - source_label: PIC/S
            locator: line:3427
          - source_label: PIC/S
            locator: line:3428
          - source_label: PIC/S
            locator: line:3429
          - source_label: PIC/S
            locator: line:3430
          children: []
        - nid: ann1.sec9.p9_46.iv
          kind: item
          kind_raw: v.
          num: v
          ord: 589
          heading: null
          text: "all products that have been manufactured on a line subsequent to a process\n              simulation failure should be quarantined until a successful resolution of the\n              process simulation failure has occurred;"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3432
          - source_label: PIC/S
            locator: line:3433
          - source_label: PIC/S
            locator: line:3434
          children: []
        - nid: ann1.sec9.p9_46.ivi
          kind: item
          kind_raw: vi.
          num: vi
          ord: 590
          heading: null
          text: "where the root cause investigation indicates that the failure was related to\n              operator activity, actions to limit the operator’s activities, until retrained and\n              requalified, should be taken;"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3436
          - source_label: PIC/S
            locator: line:3437
          - source_label: PIC/S
            locator: line:3446
          children: []
        - nid: ann1.sec9.p9_46.ivii
          kind: item
          kind_raw: vii.
          num: vii
          ord: 591
          heading: null
          text: production should resume only after completion of successful revalidation.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3448
          children: []
      - nid: ann1.sec9.p9_47
        kind: paragraph
        kind_raw: '9.47'
        num: '9.47'
        ord: 592
        heading: null
        text: All APS runs should be fully documented and include a reconciliation of units processed (e.g. units filled, incubated and not incubated). Justification for filled and non-incubated units should be included in the documentation. All interventions performed during the APS should be recorded, including the start and end time of each intervention and the involved person. All microbial monitoring data as well as other testing data should be recorded in the APS batch record.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3450
        - source_label: PIC/S
          locator: line:3451
        - source_label: PIC/S
          locator: line:3452
        - source_label: PIC/S
          locator: line:3453
        - source_label: PIC/S
          locator: line:3454
        - source_label: PIC/S
          locator: line:3455
        - source_label: PIC/S
          locator: line:3456
        children: []
      - nid: ann1.sec9.p9_48
        kind: paragraph
        kind_raw: '9.48'
        num: '9.48'
        ord: 593
        heading: null
        text: An APS run should be aborted only under circumstances in which written procedures require commercial lots to be equally handled. An investigation should be documented in such cases.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3458
        - source_label: PIC/S
          locator: line:3459
        - source_label: PIC/S
          locator: line:3460
        children: []
      - nid: ann1.sec9.p9_49
        kind: paragraph
        kind_raw: '9.49'
        num: '9.49'
        ord: 594
        heading: null
        text: 'An aseptic process should be subject to a repeat of the initial validation when:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3462
        children:
        - nid: ann1.sec9.p9_49.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 595
          heading: null
          text: "the specific aseptic process has not been in operation for an extended period\n              of time; or"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3464
          - source_label: PIC/S
            locator: line:3465
          children: []
        - nid: ann1.sec9.p9_49.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 596
          heading: null
          text: "there is a change to the process, equipment, procedures or environment that\n              has the potential to affect the aseptic process or an addition of new product\n              containers or container-closure combinations."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3467
          - source_label: PIC/S
            locator: line:3468
          - source_label: PIC/S
            locator: line:3469
          children: []
