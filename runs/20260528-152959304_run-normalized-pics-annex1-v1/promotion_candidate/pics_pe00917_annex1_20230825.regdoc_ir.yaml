        - nid: ann1.sec3.p3_1.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 35
          heading: null
          text: "Root cause analysis of procedural, process or equipment failure is performed\n             in such a way that the risk to product is correctly identified and understood\n             so that suitable corrective and preventive actions (CAPA) are implemented."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:254
          - source_label: PIC/S
            locator: line:255
          - source_label: PIC/S
            locator: line:256
          children: []
        - nid: ann1.sec3.p3_1.iiv
          kind: item
          kind_raw: iv.
          num: iv
          ord: 36
          heading: null
          text: "Risk management is applied in the development and maintenance of the\n             CCS, to identify, assess, reduce/eliminate (where applicable) and control\n             contamination risks. Risk management should be documented and should\n             include the rationale for decisions taken in relation to risk reduction and\n             acceptance of residual risk."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:258
          - source_label: PIC/S
            locator: line:259
          - source_label: PIC/S
            locator: line:260
          - source_label: PIC/S
            locator: line:261
          - source_label: PIC/S
            locator: line:262
          children: []
        - nid: ann1.sec3.p3_1.iv
          kind: item
          kind_raw: v.
          num: v
          ord: 37
          heading: null
          text: "Senior management should effectively oversee the state of control\n             throughout the facility and product lifecycle. Risk management outcome\n             should be reviewed regularly as part of the on-going quality management,\n             during change, in the event of a significant emerging problem, and during the\n             periodic product quality review."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:264
          - source_label: PIC/S
            locator: line:265
          - source_label: PIC/S
            locator: line:266
          - source_label: PIC/S
            locator: line:267
          - source_label: PIC/S
            locator: line:268
          children: []
        - nid: ann1.sec3.p3_1.ivi
          kind: item
          kind_raw: vi.
          num: vi
          ord: 38
          heading: null
          text: "Processes associated with the finishing, storage and transport of sterile\n             products should not compromise the sterile product. Aspects that should be\n             considered include: container integrity, risks of contamination and avoidance\n             of degradation by ensuring that products are stored and maintained in\n             accordance with the registered storage conditions."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:270
          - source_label: PIC/S
            locator: line:271
          - source_label: PIC/S
            locator: line:272
          - source_label: PIC/S
            locator: line:273
          - source_label: PIC/S
            locator: line:274
          children: []
        - nid: ann1.sec3.p3_1.ivii
          kind: item
          kind_raw: vii.
          num: vii
          ord: 39
          heading: null
          text: "Persons responsible for the certification/release of sterile products have\n             appropriate access to manufacturing and quality information and possess\n             adequate knowledge and experience in the manufacture of sterile products\n             and the associated critical quality attributes. This is in order to allow such\n             persons to determine if the sterile products have been manufactured in\n             accordance with the registered specifications and approved process and are\n             of the required quality."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:276
          - source_label: PIC/S
            locator: line:277
          - source_label: PIC/S
            locator: line:278
          - source_label: PIC/S
            locator: line:279
          - source_label: PIC/S
            locator: line:280
          - source_label: PIC/S
            locator: line:281
          - source_label: PIC/S
            locator: line:282
          children: []
      - nid: ann1.sec3.p3_2
        kind: paragraph
        kind_raw: '3.2'
        num: '3.2'
        ord: 40
        heading: null
        text: 'All non-conformities, such as sterility test failures, environmental monitoring excursions or deviations from established procedures should be adequately


          investigated before certification/release of the batch. The investigation should determine the potential impact upon process and product quality and whether any other processes or batches are potentially impacted. The reason for including or excluding a product or batch from the scope of the investigation should be clearly justified and recorded.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
