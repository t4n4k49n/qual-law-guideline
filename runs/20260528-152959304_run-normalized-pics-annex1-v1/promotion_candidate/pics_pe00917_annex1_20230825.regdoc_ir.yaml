      - nid: ann1.sec8.p8_72
        kind: paragraph
        kind_raw: '8.72'
        num: '8.72'
        ord: 321
        heading: null
        text: "Validation procedures should ensure that the effects of variation in density of the\n            product and packages are considered.\nSTERILISATION WITH ETHYLENE OXIDE"
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
