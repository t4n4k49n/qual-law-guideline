      - nid: ann1.sec9.p9_13
        kind: paragraph
        kind_raw: '9.13'
        num: '9.13'
        ord: 503
        heading: null
        text: 'If action limits are exceeded, operating procedures should prescribe a root cause investigation, an assessment of the potential impact to product (including batches produced between the monitoring and reporting) and requirements for corrective and preventive actions. If alert levels are exceeded, operating procedures should prescribe assessment and follow-up, which should include consideration of an investigation and/or corrective actions to avoid any further deterioration of the environment.


