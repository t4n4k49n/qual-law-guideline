        children: []
      - nid: ann1.sec6.p6_12
        kind: paragraph
        kind_raw: '6.12'
        num: '6.12'
        ord: 169
        heading: null
        text: "To minimize the risk of biofilm formation, sterilisation, disinfection or regeneration\n\nof water systems should be carried out according to a predetermined schedule and as a remedial action following out-of-limit or specification results. Disinfection of a water system with chemicals should be followed by a validated\n       rinsing/flushing     procedure.     Water        should       be     tested      after\ndisinfection/regeneration. Chemical testing results should be approved before the water system is returned to use and microbiological/endotoxin results verified to be within specification and approved before batches manufactured using water from the system are considered for certification/release."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1055
        - source_label: PIC/S
          locator: line:1063
        - source_label: PIC/S
          locator: line:1064
        - source_label: PIC/S
          locator: line:1065
        - source_label: PIC/S
          locator: line:1066
        - source_label: PIC/S
          locator: line:1067
        - source_label: PIC/S
          locator: line:1068
        - source_label: PIC/S
          locator: line:1069
        - source_label: PIC/S
          locator: line:1070
        children: []
      - nid: ann1.sec6.p6_13
        kind: paragraph
        kind_raw: '6.13'
        num: '6.13'
        ord: 170
        heading: null
        text: Regular ongoing chemical and microbial monitoring of water systems should be performed to ensure that the water continues to meet compendial expectations. Alert levels should be based on the initial qualification data and thereafter periodically reassessed on data obtained during subsequent re-qualifications, routine monitoring, and investigations. Review of ongoing monitoring data should be carried out to identify any adverse trend in system performance. Sampling programmes should reflect the requirements of the CCS and should include all outlets and points of use, at a specified interval, to ensure that representative water samples are obtained for analysis on a regular basis. Sample plans should be based on the qualification data, should consider the potential worst case sampling locations and should ensure that at least one representative sample is included every day of the water that is used for manufacturing processes.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1072
        - source_label: PIC/S
          locator: line:1073
        - source_label: PIC/S
          locator: line:1074
        - source_label: PIC/S
          locator: line:1075
        - source_label: PIC/S
          locator: line:1076
        - source_label: PIC/S
          locator: line:1077
        - source_label: PIC/S
          locator: line:1078
        - source_label: PIC/S
          locator: line:1079
