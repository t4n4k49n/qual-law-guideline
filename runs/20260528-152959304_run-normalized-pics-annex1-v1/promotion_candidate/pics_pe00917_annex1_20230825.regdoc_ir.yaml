      - nid: ann1.sec10.p10_7
        kind: paragraph
        kind_raw: '10.7'
        num: '10.7'
        ord: 608
        heading: null
        text: For some products it may not be possible to obtain a sterility test result prior to release because the shelf life of the product is too short to allow completion of a sterility test. In these cases, the additional considerations of design of the process and additional monitoring and/or alternative test methods required to mitigate the identified risks should be assessed and documented.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
