        kind: paragraph
        kind_raw: '6.6'
        num: '6.6'
        ord: 163
        heading: null
        text: 'Pipes, ducts and other utilities should not be present in cleanrooms. If unavoidable, then they should be installed so that they do not create recesses, unsealed openings and surfaces which are difficult to clean. Installation should allow cleaning and disinfection of outer surface of the pipes.


          WATER SYSTEMS'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1015
