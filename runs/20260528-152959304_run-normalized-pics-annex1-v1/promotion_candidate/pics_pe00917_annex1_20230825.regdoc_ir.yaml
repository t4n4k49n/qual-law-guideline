        kind: paragraph
        kind_raw: '8.15'
        num: '8.15'
        ord: 244
        heading: null
        text: "Aseptic manipulations (including non-intrinsic sterile connection devices) should\n            be minimized through the use of engineering design solutions such as\n            preassembled and sterilised equipment. Whenever feasible, product contact\n            piping and equipment should be pre-assembled, and sterilised in place."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
