          locator: line:1218
        children: []
      - nid: ann1.sec7.p7_7
        kind: paragraph
        kind_raw: '7.7'
        num: '7.7'
        ord: 187
        heading: null
        text: High standards of personal hygiene and cleanliness are essential to prevent excessive shedding or increased risk of introduction of microbial contamination. Personnel involved in the manufacture of sterile products should be instructed to report any specific health conditions or ailments which may cause the shedding of abnormal numbers or types of contaminants and therefore preclude cleanroom access. Health conditions and actions to be taken with regard to personnel who could be introducing an undue microbial hazard should be provided by the designated competent person and described in procedures.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1220
        - source_label: PIC/S
          locator: line:1221
        - source_label: PIC/S
          locator: line:1222
        - source_label: PIC/S
          locator: line:1223
        - source_label: PIC/S
          locator: line:1224
        - source_label: PIC/S
          locator: line:1225
        - source_label: PIC/S
          locator: line:1226
        - source_label: PIC/S
          locator: line:1227
        children: []
      - nid: ann1.sec7.p7_8
        kind: paragraph
        kind_raw: '7.8'
        num: '7.8'
        ord: 188
        heading: null
        text: Personnel who have been engaged in the processing of human or animal tissue materials or of cultures of micro-organisms, other than those used in the current manufacturing process, or any activities that may have a negative impact to quality (e.g. microbial contamination), should not enter clean areas unless clearly defined and effective decontamination and entry procedures have been followed and documented.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
