        ord: 374
        heading: null
        text: Bioburden samples should be taken from the bulk product and immediately prior to the final sterile filtration. In case where a redundant filtration set-up is used, it should be taken prior to the first filter. Systems for taking samples should be designed so as not to introduce contamination.
