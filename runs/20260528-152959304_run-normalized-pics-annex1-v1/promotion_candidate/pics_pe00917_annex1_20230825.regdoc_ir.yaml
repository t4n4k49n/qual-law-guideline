          - source_label: PIC/S
            locator: line:632
          - source_label: PIC/S
            locator: line:633
          - source_label: PIC/S
            locator: line:634
          - source_label: PIC/S
            locator: line:635
          - source_label: PIC/S
            locator: line:636
          children: []
        - nid: ann1.sec4.p4_22.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 84
          heading: null
          text: "For RABS\n               The sporicidal disinfection should include the routine application of a sporicidal\n               agent using a method that has been validated and demonstrated to robustly\n               include all areas of the interior surfaces and ensure a suitable environment for\n               aseptic processing.\nCLEANROOM AND CLEAN AIR EQUIPMENT QUALIFICATION"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
