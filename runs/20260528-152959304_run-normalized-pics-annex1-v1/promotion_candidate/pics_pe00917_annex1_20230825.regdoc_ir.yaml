      - nid: ann1.sec8.p8_20
        kind: paragraph
        kind_raw: '8.20'
        num: '8.20'
        ord: 256
        heading: null
        text: "Open primary packaging containers should be maintained under grade A\n            conditions with the appropriate background for the technology as described in\n            paragraph 4.20. For partially stoppered vials or prefilled syringes (see paragraph\n            8.126)."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
