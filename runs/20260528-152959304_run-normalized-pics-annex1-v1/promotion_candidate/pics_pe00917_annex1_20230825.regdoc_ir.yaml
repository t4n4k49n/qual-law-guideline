      - nid: ann1.sec8.p8_71
        kind: paragraph
        kind_raw: '8.71'
        num: '8.71'
        ord: 320
        heading: null
        text: "Sterilisation by radiation is used mainly for the sterilisation of heat sensitive\n            materials and products. Ultraviolet irradiation is not an acceptable method of\n            sterilisation. Guidance regarding ionising radiation sterilisation can be found\n            within Annex 12."
        role: normative
        normativity: must
        tags: []
        refs:
