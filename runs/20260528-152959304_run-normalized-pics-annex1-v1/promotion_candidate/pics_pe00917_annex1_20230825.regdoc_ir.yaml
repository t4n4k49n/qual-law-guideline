        children: []
      - nid: ann1.sec8.p8_25
        kind: paragraph
        kind_raw: '8.25'
        num: '8.25'
        ord: 261
        heading: null
        text: The container closure integrity validation should take into consideration any transportation or shipping requirements that may negatively impact the integrity of the container (e.g. by decompression or extreme temperatures).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1616
        - source_label: PIC/S
          locator: line:1617
        - source_label: PIC/S
          locator: line:1618
        children: []
      - nid: ann1.sec8.p8_26
        kind: paragraph
        kind_raw: '8.26'
        num: '8.26'
        ord: 262
        heading: null
        text: Where the equipment used to crimp vial caps can generate large quantities of non-viable particle, measures to prevent particle contamination such as locating the equipment at a physically separate station equipped with adequate air extraction should be taken.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1620
        - source_label: PIC/S
          locator: line:1621
        - source_label: PIC/S
          locator: line:1622
        - source_label: PIC/S
          locator: line:1623
        children: []
      - nid: ann1.sec8.p8_27
        kind: paragraph
        kind_raw: '8.27'
        num: '8.27'
        ord: 263
        heading: null
        text: Vial capping of aseptically filled products can be undertaken as an aseptic process using sterilised caps or as a clean process outside the aseptic processing area. Where the latter approach is adopted, vials should be protected by grade A conditions up to the point of leaving the aseptic processing area, and thereafter stoppered vials should be protected with a grade A air supply until the cap has been crimped. The supporting background environment of grade A air supply should meet at least grade D requirements. Where capping is a manual process, it should be performed under grade A conditions either in an appropriately designed isolator or in grade A with a grade B background.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1625
        - source_label: PIC/S
          locator: line:1626
        - source_label: PIC/S
          locator: line:1627
        - source_label: PIC/S
          locator: line:1628
        - source_label: PIC/S
          locator: line:1629
        - source_label: PIC/S
          locator: line:1630
        - source_label: PIC/S
          locator: line:1631
        - source_label: PIC/S
          locator: line:1632
        - source_label: PIC/S
          locator: line:1633
        children: []
      - nid: ann1.sec8.p8_28
        kind: paragraph
        kind_raw: '8.28'
        num: '8.28'
        ord: 264
        heading: null
        text: Where capping of aseptically filled sterile product is conducted as a clean process with grade A air supply protection, vials with missing or displaced stoppers should be rejected prior to capping. Appropriately qualified, automated methods for stopper height detection should be in place.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
