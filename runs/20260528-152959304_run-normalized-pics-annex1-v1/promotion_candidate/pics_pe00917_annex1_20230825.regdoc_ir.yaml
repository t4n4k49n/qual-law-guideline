          children: []
        - nid: ann1.sec10.p10_6.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 606
          heading: null
          text: "For products which have been lyophilized, samples taken from different\n              lyophilization loads."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3527
          - source_label: PIC/S
            locator: line:3528
          children:
          - nid: ann1.sec10.p10_6.iiii.not1
            kind: note
            kind_raw: note
            num: null
            ord: 607
            heading: null
            text: 'Note: Where the manufacturing process results in sub-batches (e.g. for


              terminally sterilised products) then sterility samples from each sub-batch should


              be taken and a sterility test for each sub-batch performed. Consideration should


              also be given to performing separate testing for other finished product tests.'
            role: informative
