        - nid: ann1.sec8.p8_106.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 408
          heading: null
          text: "For shuttle type equipment used for aseptic filling, the parison is open to the\n             environment and therefore the areas where parison extrusion, blowmoulding and sealing take place should meet grade A conditions at the\n             critical zones. The filling environment should be designed and maintained to\n             meet grade A conditions for viable and total particle limits both at rest and\n             when in operation."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
