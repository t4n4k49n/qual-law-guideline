        kind: paragraph
        kind_raw: '6.20'
        num: '6.20'
        ord: 177
        heading: null
        text: 'Where backflow from vacuum or pressure systems poses a potential risk to the product, there should be mechanism(s) to prevent backflow when the vacuum or pressure system is shut off.


