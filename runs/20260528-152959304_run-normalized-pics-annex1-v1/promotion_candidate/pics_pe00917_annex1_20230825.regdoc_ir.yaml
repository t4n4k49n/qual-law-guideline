        num: '8.105'
        ord: 406
        heading: null
        text: Blow-Fill-Seal equipment used for the manufacture of products which are terminally sterilised should be installed in at least a grade D environment. The conditions at the point of fill should comply with the environmental requirements of paragraphs 8.3 and 8.4.
