        children: []
      - nid: ann1.sec8.p8_13
        kind: paragraph
        kind_raw: '8.13'
        num: '8.13'
        ord: 242
        heading: null
        text: "Preparation and filling of sterile products such as ointments, creams,\n            suspensions and emulsions should be performed in grade A with a grade B\n            background when the product and components are exposed to the environment\n            and the product is not subsequently filtered (via a sterilising grade filter) or\n            terminally sterilised. Where an isolator or RABS is used, the background should\n            be in accordance with paragraph 4.20."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
