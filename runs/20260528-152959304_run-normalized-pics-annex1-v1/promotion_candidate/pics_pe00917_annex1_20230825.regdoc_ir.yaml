        kind: paragraph
        kind_raw: '8.79'
        num: '8.79'
        ord: 334
        heading: null
        text: "If the product cannot be sterilised in its final container, solutions or liquids should\n            be sterilised by filtration through a sterile sterilising grade filter (with a nominal\n            pore size of a maximum of 0.22 µm that has been appropriately validated to\n            obtain a sterile filtrate) and subsequently aseptically filled into a previously\n            sterilised container. The selection of the filter used should ensure that it is\n            compatible with the product and as described in the marketing authorization (see\n            paragraph 8.135)."
        role: normative
        normativity: must
