      - nid: ann1.sec10.p10_10
        kind: paragraph
        kind_raw: '10.10'
        num: '10.10'
        ord: 611
        heading: null
        text: 'Environmental monitoring data and trend data generated for classified areas should be reviewed as part of product batch certification/release. A written procedure should be available that describes the actions to be taken when data


          from environmental monitoring are found out of trend or exceeding the established limits. For products with short shelf life, the environmental data for the time of manufacture may not be available; in these cases, the compliance should include a review of the most recent available data. Manufacturers of these products should consider the use of rapid/alternative methods.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
