      - nid: ann1.sec8.p8_138
        kind: paragraph
        kind_raw: '8.138'
        num: '8.138'
        ord: 478
        heading: null
        text: Acceptance criteria should be established and implemented for SUS corresponding to the risks or criticality of the products and its processes. On receipt, each piece of SUS should be checked to ensure that they have been manufactured, supplied and delivered in accordance with the approved specification. A visual inspection of the outer packaging (e.g. appearance of exterior carton, product pouches), label printing, and review of attached documents (e.g. certificate of conformance and proof of sterilisation) should be carried out and documented prior to use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
