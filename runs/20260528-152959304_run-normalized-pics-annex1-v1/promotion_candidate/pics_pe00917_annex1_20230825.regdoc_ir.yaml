      children:
      - nid: ann1.sec4.p4_1
        kind: paragraph
        kind_raw: '4.1'
        num: '4.1'
        ord: 42
        heading: null
        text: The manufacture of sterile products should be carried out in appropriate cleanrooms, entry to which should be through change rooms that act as airlocks for personnel and airlocks for equipment and materials. Cleanrooms and change rooms should be maintained to an appropriate cleanliness standard and supplied with air which has passed through filters of an appropriate efficiency. Controls and monitoring should be scientifically justified and should effectively evaluate the state of environmental conditions of cleanrooms, airlocks and pass-through hatches.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:301
        - source_label: PIC/S
          locator: line:302
        - source_label: PIC/S
          locator: line:303
        - source_label: PIC/S
          locator: line:304
        - source_label: PIC/S
          locator: line:305
        - source_label: PIC/S
          locator: line:306
        - source_label: PIC/S
          locator: line:307
        - source_label: PIC/S
          locator: line:308
        children: []
      - nid: ann1.sec4.p4_2
        kind: paragraph
        kind_raw: '4.2'
        num: '4.2'
        ord: 43
        heading: null
        text: The various operations of component preparation, product preparation and filling should be carried out with appropriate technical and operational separation measures within the cleanroom or facility to prevent mix up and contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:310
        - source_label: PIC/S
          locator: line:311
        - source_label: PIC/S
          locator: line:312
        children: []
      - nid: ann1.sec4.p4_3
        kind: paragraph
        kind_raw: '4.3'
        num: '4.3'
        ord: 44
        heading: null
        text: Restricted Access Barrier Systems (RABS) or isolators are beneficial in assuring required conditions and minimizing microbial contamination associated with direct human interventions in the critical zone. Their use should be considered in the CCS. Any alternative approaches to the use of RABS or isolators should be justified.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:314
        - source_label: PIC/S
          locator: line:315
        - source_label: PIC/S
          locator: line:316
        - source_label: PIC/S
          locator: line:317
        - source_label: PIC/S
          locator: line:318
        children: []
      - nid: ann1.sec4.p4_4
        kind: paragraph
        kind_raw: '4.4'
        num: '4.4'
        ord: 45
        heading: null
        text: 'For the manufacture of sterile products there are four grades of cleanroom/zone. Grade A: The critical zone for high-risk operations (e.g. aseptic processing line, filling zone, stopper bowl, open primary packaging or for making aseptic connections under the protection of first air). Normally, such conditions are provided by a localised airflow protection, such as unidirectional airflow workstations within RABS or isolators. The maintenance of unidirectional airflow should be demonstrated and qualified across the whole of the grade A area. Direct intervention (e.g. without the protection of barrier and glove port technology) into the grade A area by operators should be minimized by premises, equipment, process and procedural design. Grade B: For aseptic preparation and filling, this is the background cleanroom for grade A (where it is not an isolator). Air pressure differences should be continuously monitored. Cleanrooms of lower grade than grade B can be considered where isolator technology is used (see paragraph 4.20). Grade C and D: These are cleanrooms used for carrying out less critical stages in the manufacture of aseptically filled sterile products or as a background for isolators. They can also be used for the preparation/filling of terminally sterilised products. (See section 8 for the specific details on terminal sterilisation activities).'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:320
        - source_label: PIC/S
          locator: line:321
        - source_label: PIC/S
          locator: line:322
        - source_label: PIC/S
          locator: line:323
        - source_label: PIC/S
          locator: line:324
        - source_label: PIC/S
          locator: line:325
        - source_label: PIC/S
          locator: line:326
        - source_label: PIC/S
          locator: line:327
        - source_label: PIC/S
          locator: line:328
        - source_label: PIC/S
          locator: line:329
        - source_label: PIC/S
          locator: line:330
        - source_label: PIC/S
          locator: line:331
        - source_label: PIC/S
          locator: line:332
        - source_label: PIC/S
          locator: line:333
        - source_label: PIC/S
          locator: line:334
        - source_label: PIC/S
          locator: line:335
        - source_label: PIC/S
          locator: line:336
        - source_label: PIC/S
          locator: line:337
        - source_label: PIC/S
          locator: line:338
        children: []
      - nid: ann1.sec4.p4_5
        kind: paragraph
        kind_raw: '4.5'
        num: '4.5'
        ord: 46
        heading: null
        text: In cleanrooms and critical zones, all exposed surfaces should be smooth, impervious and unbroken in order to minimize the shedding or accumulation of particles or micro-organisms.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:340
        - source_label: PIC/S
          locator: line:341
        - source_label: PIC/S
          locator: line:342
        children: []
      - nid: ann1.sec4.p4_6
        kind: paragraph
        kind_raw: '4.6'
        num: '4.6'
        ord: 47
        heading: null
        text: To reduce accumulation of dust and to facilitate cleaning there should be no recesses that are difficult to clean effectively, therefore projecting ledges, shelves, cupboards and equipment should be kept to a minimum. Doors should be designed to avoid recesses that cannot be cleaned. Sliding doors may be undesirable for this reason.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:352
        - source_label: PIC/S
          locator: line:353
        - source_label: PIC/S
          locator: line:354
        - source_label: PIC/S
          locator: line:355
        - source_label: PIC/S
          locator: line:356
        children: []
      - nid: ann1.sec4.p4_7
        kind: paragraph
        kind_raw: '4.7'
        num: '4.7'
        ord: 48
        heading: null
        text: Materials used in cleanrooms, both in the construction of the room and for items used within the room, should be selected to minimize generation of particles and to permit the repeated application of cleaning, disinfectant and sporicidal agents where used.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:358
        - source_label: PIC/S
          locator: line:359
        - source_label: PIC/S
          locator: line:360
        - source_label: PIC/S
          locator: line:361
        children: []
      - nid: ann1.sec4.p4_8
        kind: paragraph
        kind_raw: '4.8'
        num: '4.8'
        ord: 49
        heading: null
        text: Ceilings should be designed and sealed to prevent contamination from the space above them.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:363
        - source_label: PIC/S
          locator: line:364
        children: []
      - nid: ann1.sec4.p4_9
        kind: paragraph
        kind_raw: '4.9'
        num: '4.9'
        ord: 50
        heading: null
        text: Sinks and drains should be prohibited in the grade A and grade B areas. In other cleanrooms, air breaks should be fitted between the machine or sink and the drains. Floor drains in lower grade cleanrooms should be fitted with traps or water seals designed to prevent back flow and should be regularly cleaned, disinfected and maintained.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:366
        - source_label: PIC/S
          locator: line:367
        - source_label: PIC/S
          locator: line:368
        - source_label: PIC/S
          locator: line:369
        - source_label: PIC/S
          locator: line:370
        children: []
      - nid: ann1.sec4.p4_10
        kind: paragraph
        kind_raw: '4.10'
        num: '4.10'
        ord: 51
        heading: null
        text: The transfer of equipment and materials into and out of the cleanrooms and critical zones is one of the greatest potential sources of contamination. Any activities with the potential to compromise the cleanliness of cleanrooms or the critical zone should be assessed and if they cannot be eliminated, appropriate controls should be implemented.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:372
        - source_label: PIC/S
          locator: line:373
        - source_label: PIC/S
          locator: line:374
        - source_label: PIC/S
          locator: line:375
        - source_label: PIC/S
          locator: line:376
        children: []
      - nid: ann1.sec4.p4_11
        kind: paragraph
        kind_raw: '4.11'
        num: '4.11'
        ord: 52
        heading: null
        text: The transfer of materials, equipment, and components into the grade A or B areas should be carried out via a unidirectional process. Where possible, items should be sterilised and passed into these areas through double-ended sterilisers (e.g. through a double-door autoclave or depyrogenation oven/tunnel) sealed into the wall. Where sterilisation upon transfer of the items is not possible, a procedure which achieves the same objective of not introducing contamination should be validated and implemented, (e.g. using an effective transfer disinfection process, rapid transfer systems for isolators or, for gaseous or liquid materials, a bacteriaretentive filter). The removal of items from the grade A and B areas (e.g. materials, waste, environmental samples) should be carried out via a separate unidirectional process. If this is not possible, time-based separation of movement (incoming/exiting material) by procedure should be considered and controls applied to avoid potential contamination of incoming items.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:378
        - source_label: PIC/S
          locator: line:379
        - source_label: PIC/S
          locator: line:380
        - source_label: PIC/S
          locator: line:381
        - source_label: PIC/S
          locator: line:382
        - source_label: PIC/S
          locator: line:383
        - source_label: PIC/S
          locator: line:384
        - source_label: PIC/S
          locator: line:385
        - source_label: PIC/S
          locator: line:386
        - source_label: PIC/S
          locator: line:387
        - source_label: PIC/S
          locator: line:388
        - source_label: PIC/S
          locator: line:389
        - source_label: PIC/S
          locator: line:390
        children: []
      - nid: ann1.sec4.p4_12
        kind: paragraph
        kind_raw: '4.12'
        num: '4.12'
        ord: 53
        heading: null
        text: 'Airlocks should be designed and used to provide physical separation and to minimize microbial and particle contamination of the different areas and should be present for material and personnel moving between different grades. Wherever possible, airlocks used for personnel movement should be separated from those used for material movement. Where this is not practical, time-based separation of movement (personnel/material) by procedure should be considered. Airlocks should be flushed effectively with filtered air to ensure that the grade of the cleanroom is maintained. The final stage of the airlock should, in the “at rest” state, be of the same cleanliness grade (viable and total particle) as the cleanroom into which it leads. The use of separate change rooms for entering and leaving the grade B area is desirable. Where this is not practical, time-based separation of activities (ingress/egress) by procedure should be considered.


          Where the CCS indicates that the risk of contamination is high, separate change rooms for entering and leaving production areas should be used. Airlocks should be designed as follows:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:392
        - source_label: PIC/S
          locator: line:393
        - source_label: PIC/S
          locator: line:394
        - source_label: PIC/S
          locator: line:395
        - source_label: PIC/S
          locator: line:396
        - source_label: PIC/S
          locator: line:397
        - source_label: PIC/S
          locator: line:398
        - source_label: PIC/S
          locator: line:399
        - source_label: PIC/S
          locator: line:400
        - source_label: PIC/S
          locator: line:401
        - source_label: PIC/S
          locator: line:402
        - source_label: PIC/S
          locator: line:403
        - source_label: PIC/S
          locator: line:411
        - source_label: PIC/S
          locator: line:412
        - source_label: PIC/S
          locator: line:413
        children:
        - nid: ann1.sec4.p4_12.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 54
          heading: null
          text: "Personnel airlocks: Areas of increasing cleanliness used for entry of\n               personnel (e.g. from the grade D area to the grade C area to the grade B\n               area). In general hand washing facilities should be provided only in the first\n               stage of the changing room and not be present in changing rooms directly\n               accessing the grade B area."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:415
          - source_label: PIC/S
            locator: line:416
          - source_label: PIC/S
            locator: line:417
          - source_label: PIC/S
            locator: line:418
          - source_label: PIC/S
            locator: line:419
          children: []
        - nid: ann1.sec4.p4_12.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 55
          heading: null
          text: 'Material airlocks: used for materials and equipment transfer.'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:421
          children:
          - nid: ann1.sec4.p4_12.iii.si1
            kind: subitem
            kind_raw: 
            num: null
            ord: 56
            heading: null
            text: "Only materials and equipment that have been included on an approved list\n               and assessed during validation of the transfer process, should be transferred\n               into the grade A or grade B areas via an airlock or pass-through hatches.\n               Equipment and materials (intended for use in the grade A area) should be\n               protected when transiting through the grade B area. Any unapproved items\n               that require transfer should be pre-approved as an exception. Appropriate\n               risk assessment and mitigation measures should be applied and recorded as\n               per the manufacturer's CCS and should include a specific disinfection and\n               monitoring programme approved by quality assurance."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:423
            - source_label: PIC/S
              locator: line:424
            - source_label: PIC/S
              locator: line:425
            - source_label: PIC/S
              locator: line:426
            - source_label: PIC/S
              locator: line:427
            - source_label: PIC/S
              locator: line:428
            - source_label: PIC/S
              locator: line:429
            - source_label: PIC/S
              locator: line:430
            - source_label: PIC/S
              locator: line:431
            children: []
          - nid: ann1.sec4.p4_12.iii.si2
            kind: subitem
            kind_raw: 
            num: null
            ord: 57
            heading: null
            text: "Pass-through hatches should be designed to protect the higher-grade\n               environment, for example by effective flushing with an active filtered air\n               supply."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:433
            - source_label: PIC/S
              locator: line:434
            - source_label: PIC/S
              locator: line:435
            children: []
          - nid: ann1.sec4.p4_12.iii.si3
            kind: subitem
            kind_raw: 
            num: null
            ord: 58
            heading: null
            text: "The movement of material or equipment from lower grade or unclassified\n               area to higher grade clean areas should be subject to cleaning and\n               disinfection commensurate with the risk and in line with the CCS."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:437
            - source_label: PIC/S
              locator: line:438
            - source_label: PIC/S
              locator: line:439
            children: []
      - nid: ann1.sec4.p4_13
        kind: paragraph
        kind_raw: '4.13'
        num: '4.13'
        ord: 59
        heading: null
        text: For pass-through hatches and airlocks (for material and personnel), the entry and exit doors should not be opened simultaneously. For airlocks leading to the grade A and grade B areas, an interlocking system should be used. For airlocks leading to grade C and D areas, a visual and/or audible warning system should be operated as a minimum. Where required to maintain area segregation, a time delay between the closing and opening of interlocked doors should be established.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:441
        - source_label: PIC/S
          locator: line:442
        - source_label: PIC/S
          locator: line:443
        - source_label: PIC/S
          locator: line:444
        - source_label: PIC/S
          locator: line:445
        - source_label: PIC/S
          locator: line:446
        - source_label: PIC/S
          locator: line:447
        children: []
      - nid: ann1.sec4.p4_14
        kind: paragraph
        kind_raw: '4.14'
        num: '4.14'
        ord: 60
        heading: null
        text: 'Cleanrooms should be supplied with a filtered air supply that maintains a positive pressure and/or an airflow relative to the background environment of a lower grade under all operational conditions and should flush the area effectively. Adjacent rooms of different grades should have an air pressure difference of a minimum of 10 Pascals (guidance value). Particular attention should be paid to the protection of the critical zone. The recommendations regarding air supplies and pressures may need to be modified where it is necessary to contain certain materials (e.g. pathogenic, highly toxic or radioactive products or live viral or bacterial materials). The modification may include positively or negatively pressurized airlocks that prevent the hazardous material from contaminating surrounding areas. Decontamination of facilities (e.g. the cleanrooms and the heating, ventilation, and air conditioning (HVAC) systems) and the treatment of air leaving a clean area, may be necessary for some operations. Where containment requires air to flow into a critical zone, the source of the air should


          be from an area of the same or higher grade.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
