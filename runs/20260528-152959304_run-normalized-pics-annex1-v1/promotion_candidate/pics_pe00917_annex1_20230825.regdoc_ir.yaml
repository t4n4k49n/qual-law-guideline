      - nid: ann1.sec8.p8_12
        kind: paragraph
        kind_raw: '8.12'
        num: '8.12'
        ord: 241
        heading: null
        text: "The unwrapping, assembly and preparation of sterilised equipment, components\n            and ancillary items with direct or indirect product contact should be treated as an\n            aseptic process and performed in grade A with a grade B background. The filling\n            line set-up and filling of the sterile product should be treated as an aseptic process\n            and performed in grade A with a grade B background. Where an isolator is used,\n            the background should be in accordance with paragraph 4.20."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1487
        - source_label: PIC/S
