      - nid: ann1.sec7.p7_5
        kind: paragraph
        kind_raw: '7.5'
        num: '7.5'
        ord: 185
        heading: null
        text: Unqualified personnel should not enter grade B cleanrooms or grade A in operation. If needed in exceptional cases, manufacturers should establish written procedures outlining the process by which unqualified personnel are brought into the grade B and A areas. An authorized person from the manufacturer should supervise the unqualified personnel during their activities and should assess the impact of these activities on the cleanliness of the area. Access by these persons should be assessed and recorded in accordance with the PQS.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1202
        - source_label: PIC/S
          locator: line:1203
        - source_label: PIC/S
          locator: line:1204
        - source_label: PIC/S
          locator: line:1205
        - source_label: PIC/S
          locator: line:1206
        - source_label: PIC/S
          locator: line:1207
        - source_label: PIC/S
          locator: line:1208
        children: []
      - nid: ann1.sec7.p7_6
        kind: paragraph
        kind_raw: '7.6'
        num: '7.6'
        ord: 186
        heading: null
        text: There should be systems in place for the disqualification of personnel from working in or given unsupervised entry into cleanrooms that is based on aspects including ongoing assessment and/or identification of an adverse trend from the personnel monitoring programme and/or after being implicated in a failed APS. Once disqualified, retraining and requalification should be completed before permitting the operator to have any further involvement in aseptic practices. For operators entering grade B cleanrooms or performing intervention into grade A, this requalification should include consideration of participation in a successful APS.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
