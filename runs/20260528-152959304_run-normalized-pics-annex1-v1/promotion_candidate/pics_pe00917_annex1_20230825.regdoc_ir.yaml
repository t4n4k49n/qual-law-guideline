      - nid: ann1.sec9.p9_16
        kind: paragraph
        kind_raw: '9.16'
        num: '9.16'
        ord: 515
        heading: null
        text: For grade A, particle monitoring should be undertaken for the full duration of critical processing, including equipment assembly.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2986
        - source_label: PIC/S
          locator: line:2987
        children: []
      - nid: ann1.sec9.p9_17
        kind: paragraph
        kind_raw: '9.17'
        num: '9.17'
        ord: 516
        heading: null
        text: The grade A area should be monitored continuously (for particles ≥0.5 and ≥5 µm) and with a suitable sample flow rate (at least 28 litres (1ft 3) per minute) so that all interventions, transient events and any system deterioration is captured. The system should frequently correlate each individual sample result with alert levels and action limits at such a frequency that any potential excursion can be identified and responded to in a timely manner. Alarms should be triggered if alert levels are exceeded. Procedures should define the actions to be taken in response to alarms including the consideration of additional microbial monitoring.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2989
        - source_label: PIC/S
          locator: line:2990
        - source_label: PIC/S
          locator: line:2991
        - source_label: PIC/S
          locator: line:2992
        - source_label: PIC/S
          locator: line:2993
        - source_label: PIC/S
          locator: line:2994
        - source_label: PIC/S
          locator: line:2995
        - source_label: PIC/S
          locator: line:2996
        children: []
      - nid: ann1.sec9.p9_18
        kind: paragraph
        kind_raw: '9.18'
        num: '9.18'
        ord: 517
        heading: null
        text: It is recommended that a similar system be used for the grade B area although the sample frequency may be decreased. The grade B area should be monitored at such a frequency and with suitable sample size that the programme captures any increase in levels of contamination and system deterioration. If alert levels are exceeded, alarms should be triggered.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2998
        - source_label: PIC/S
          locator: line:2999
        - source_label: PIC/S
          locator: line:3000
        - source_label: PIC/S
          locator: line:3001
        - source_label: PIC/S
          locator: line:3002
        children: []
      - nid: ann1.sec9.p9_19
        kind: paragraph
        kind_raw: '9.19'
        num: '9.19'
        ord: 518
        heading: null
        text: The selection of the monitoring system should take into account any risk presented by the materials used in the manufacturing operation (e.g. those involving live organisms, powdery products or radiopharmaceuticals) that may give rise to biological, chemical or radiation hazards.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3004
        - source_label: PIC/S
          locator: line:3005
        - source_label: PIC/S
          locator: line:3006
        - source_label: PIC/S
          locator: line:3007
        children: []
      - nid: ann1.sec9.p9_20
        kind: paragraph
        kind_raw: '9.20'
        num: '9.20'
        ord: 519
        heading: null
        text: 'In the case where contaminants are present due to the processes involved and would potentially damage the particle counter or present a hazard (e.g. live organisms, powdery products and radiation hazards), the frequency and strategy


          employed should be such as to assure the environmental classification both prior to and post exposure to the risk. An increase in viable particle monitoring should be considered to ensure comprehensive monitoring of the process. Additionally, monitoring should be performed during simulated operations. Such operations should be performed at appropriate intervals. The approach should be defined in the CCS.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3009
        - source_label: PIC/S
          locator: line:3010
        - source_label: PIC/S
          locator: line:3011
        - source_label: PIC/S
          locator: line:3019
        - source_label: PIC/S
          locator: line:3020
        - source_label: PIC/S
          locator: line:3021
        - source_label: PIC/S
          locator: line:3022
        - source_label: PIC/S
          locator: line:3023
        - source_label: PIC/S
          locator: line:3024
        children: []
      - nid: ann1.sec9.p9_21
        kind: paragraph
        kind_raw: '9.21'
        num: '9.21'
        ord: 520
        heading: null
        text: 'The size of monitoring samples taken using automated systems will usually be a function of the sampling rate of the system used. It is not necessary for the sample volume to be the same as that used for formal classification of cleanrooms and clean air equipment. Monitoring sample volumes should be justified.


          ENVIRONMENTAL AND PERSONNEL MONITORING – VIABLE PARTICLE'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3026
        - source_label: PIC/S
          locator: line:3027
        - source_label: PIC/S
          locator: line:3028
        - source_label: PIC/S
          locator: line:3029
        - source_label: PIC/S
          locator: line:3032
        children: []
      - nid: ann1.sec9.p9_22
        kind: paragraph
        kind_raw: '9.22'
        num: '9.22'
        ord: 521
        heading: null
        text: Where aseptic operations are performed, microbial monitoring should be frequent using a combination of methods such as settle plates, volumetric air sampling, glove, gown and surface sampling (e.g. swabs and contact plates). The method of sampling used should be justified within the CCS and should be demonstrated not to have a detrimental impact on grade A and B airflow patterns. Cleanroom and equipment surfaces should be monitored at the end of an operation.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3034
        - source_label: PIC/S
          locator: line:3035
        - source_label: PIC/S
          locator: line:3036
        - source_label: PIC/S
          locator: line:3037
        - source_label: PIC/S
          locator: line:3038
        - source_label: PIC/S
          locator: line:3039
        children: []
      - nid: ann1.sec9.p9_23
        kind: paragraph
        kind_raw: '9.23'
        num: '9.23'
        ord: 522
        heading: null
        text: Viable particle monitoring should also be performed within the cleanrooms when normal manufacturing operations are not occurring (e.g. post disinfection, prior to start of manufacturing, on completion of the batch and after a shutdown period), and in associated rooms that have not been used, in order to detect potential incidents of contamination which may affect the controls within the cleanrooms. In case of an incident, additional sample locations may be used as a verification of the effectiveness of a corrective action (e.g. cleaning and disinfection).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3041
        - source_label: PIC/S
          locator: line:3042
        - source_label: PIC/S
          locator: line:3043
        - source_label: PIC/S
          locator: line:3044
        - source_label: PIC/S
          locator: line:3045
        - source_label: PIC/S
          locator: line:3046
        - source_label: PIC/S
          locator: line:3047
        children: []
      - nid: ann1.sec9.p9_24
        kind: paragraph
        kind_raw: '9.24'
        num: '9.24'
        ord: 523
        heading: null
        text: Continuous viable air monitoring in grade A (e.g. air sampling or settle plates) should be undertaken for the full duration of critical processing, including equipment (aseptic set-up) assembly and critical processing. A similar approach should be considered for grade B cleanrooms based on the risk of impact on the aseptic processing. The monitoring should be performed in such a way that all interventions, transient events and any system deterioration would be captured and any risk caused by interventions of the monitoring operations is avoided.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3049
        - source_label: PIC/S
          locator: line:3050
        - source_label: PIC/S
          locator: line:3051
        - source_label: PIC/S
          locator: line:3052
        - source_label: PIC/S
          locator: line:3053
        - source_label: PIC/S
          locator: line:3054
        - source_label: PIC/S
          locator: line:3055
        children: []
      - nid: ann1.sec9.p9_25
        kind: paragraph
        kind_raw: '9.25'
        num: '9.25'
        ord: 524
        heading: null
        text: A risk assessment should evaluate the locations, type and frequency of personnel monitoring based on the activities performed and the proximity to critical zones. Monitoring should include sampling of personnel at periodic intervals during the process. Sampling of personnel should be performed in such a way that it will not compromise the process. Particular consideration should be given to monitoring personnel following involvement in critical interventions (at a minimum gloves, but may require monitoring of areas of gown as applicable to the process) and on each exit from the grade B cleanroom (gloves and gown). Where monitoring of gloves is performed after critical interventions, the outer gloves should be replaced prior to continuation of activity. Where monitoring of gowns is required after critical interventions, the gown should be replaced before further activity in the cleanroom.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3057
        - source_label: PIC/S
          locator: line:3058
        - source_label: PIC/S
          locator: line:3059
        - source_label: PIC/S
          locator: line:3060
        - source_label: PIC/S
          locator: line:3061
        - source_label: PIC/S
          locator: line:3062
        - source_label: PIC/S
          locator: line:3063
        - source_label: PIC/S
          locator: line:3064
        - source_label: PIC/S
          locator: line:3065
        - source_label: PIC/S
          locator: line:3066
        - source_label: PIC/S
          locator: line:3067
        - source_label: PIC/S
          locator: line:3068
        children: []
      - nid: ann1.sec9.p9_26
        kind: paragraph
        kind_raw: '9.26'
        num: '9.26'
        ord: 525
        heading: null
        text: "Microbial monitoring of personnel in the grade A and grade B areas should be performed. Where operations are manual in nature (e.g. aseptic compounding or\n             filling), the increased risk should lead to enhanced emphasis placed on microbial\n             monitoring of gowns and justified within the CCS."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3070
        - source_label: PIC/S
          locator: line:3071
        - source_label: PIC/S
          locator: line:3079
        - source_label: PIC/S
          locator: line:3080
        children: []
      - nid: ann1.sec9.p9_27
        kind: paragraph
        kind_raw: '9.27'
        num: '9.27'
        ord: 526
        heading: null
        text: "Where monitoring is routinely performed by manufacturing personnel, this should\n             be subject to regular oversight by the quality unit (refer also to paragraph 8.19)."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3082
        - source_label: PIC/S
          locator: line:3083
        children: []
      - nid: ann1.sec9.p9_28
        kind: paragraph
        kind_raw: '9.28'
        num: '9.28'
        ord: 527
        heading: null
        text: "The adoption of suitable alternative monitoring systems such as rapid methods\n             should be considered by manufacturers in order to expedite the detection of\n             microbiological contamination issues and to reduce the risk to product. These\n             rapid and automated microbial monitoring methods may be adopted after\n             validation has demonstrated their equivalency or superiority to the established\n             methods."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3085
        - source_label: PIC/S
          locator: line:3086
        - source_label: PIC/S
          locator: line:3087
        - source_label: PIC/S
          locator: line:3088
        - source_label: PIC/S
          locator: line:3089
        - source_label: PIC/S
          locator: line:3090
        children: []
      - nid: ann1.sec9.p9_29
        kind: paragraph
        kind_raw: '9.29'
        num: '9.29'
        ord: 528
        heading: null
        text: "Sampling methods and equipment used should be fully understood and\n             procedures should be in place for the correct operation and interpretation of\n             results obtained. Supporting data for the recovery efficiency of the sampling\n             methods chosen should be available."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
