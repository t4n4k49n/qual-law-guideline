      - nid: ann1.sec10.p10_1
        kind: paragraph
        kind_raw: '10.1'
        num: '10.1'
        ord: 598
        heading: null
        text: There should be personnel available with appropriate training and experience in microbiology, sterility assurance and knowledge of the processes to support the design of the manufacturing activities, environmental monitoring regime and any investigation assessing the impact of microbiologically linked events to the safety of the sterile product.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3473
        - source_label: PIC/S
          locator: line:3474
        - source_label: PIC/S
          locator: line:3475
        - source_label: PIC/S
          locator: line:3476
        - source_label: PIC/S
          locator: line:3477
        children: []
      - nid: ann1.sec10.p10_2
        kind: paragraph
        kind_raw: '10.2'
        num: '10.2'
        ord: 599
        heading: null
        text: Specifications for raw materials, components and products should include requirements for microbial, particulate and endotoxin/pyrogen limits when the need for this has been indicated by monitoring and/or by the CCS.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
