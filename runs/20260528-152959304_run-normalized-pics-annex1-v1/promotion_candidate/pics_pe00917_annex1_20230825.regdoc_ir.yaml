          children: []
      - nid: ann1.sec4.p4_23
        kind: paragraph
        kind_raw: '4.23'
        num: '4.23'
        ord: 85
        heading: null
        text: Cleanrooms and clean air equipment such as unidirectional airflow units (UDAFs), RABS and isolators, used for the manufacture of sterile products, should be qualified according to the required characteristics of the environment. Each manufacturing operation requires an appropriate environmental cleanliness level in the operational state in order to minimize the risk of contamination of the product or materials being handled. Appropriate cleanliness levels in the “at rest” and “operational” states should be maintained.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
