        kind: paragraph
        kind_raw: '8.19'
        num: '8.19'
        ord: 255
        heading: null
        text: "Aseptic operations (including APS) should be observed on a regular basis by\n            personnel with specific expertise in aseptic processing to verify the correct\n            performance of operations including operator behaviour in the cleanroom and\n            address inappropriate practices if detected.\nFINISHING OF STERILE PRODUCTS"
        role: normative
        normativity: must
        tags: []
