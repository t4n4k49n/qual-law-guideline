      - nid: ann1.sec8.p8_14
        kind: paragraph
        kind_raw: '8.14'
        num: '8.14'
        ord: 243
        heading: null
        text: "Aseptic connections should be performed in grade A with a grade B background\n            unless subsequently sterilised in place or conducted with intrinsic sterile\n            connection devices that minimize any potential contamination from the immediate\n            environment. Intrinsic sterile connection devices should be designed to mitigate\n            risk of contamination.\n            Where an isolator is used, the background should be in accordance with\n            paragraph 4.20. Aseptic connections should be appropriately assessed and their\n            effectiveness verified. For requirements regarding intrinsic sterile connection\n            devices, see paragraphs 8.129 and 8.130."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
