          locator: line:1029
        - source_label: PIC/S
          locator: line:1030
        - source_label: PIC/S
          locator: line:1031
        children: []
      - nid: ann1.sec6.p6_8
        kind: paragraph
        kind_raw: '6.8'
        num: '6.8'
        ord: 165
        heading: null
        text: Water systems should be qualified and validated to maintain the appropriate levels of physical, chemical and microbial control, taking the effect of seasonal variation into account.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1033
        - source_label: PIC/S
          locator: line:1034
        - source_label: PIC/S
          locator: line:1035
        children: []
      - nid: ann1.sec6.p6_9
        kind: paragraph
        kind_raw: '6.9'
        num: '6.9'
        ord: 166
        heading: null
        text: Water flow should remain turbulent through the pipes in water distribution systems to minimize the risk of microbial adhesion, and subsequent biofilm formation. The flow rate should be established during qualification and be routinely monitored.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1037
        - source_label: PIC/S
          locator: line:1038
