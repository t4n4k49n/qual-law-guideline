        kind: paragraph
        kind_raw: '5.9'
        num: '5.9'
        ord: 149
        heading: null
        text: Particle counters, including sampling tubing, should be qualified. The manufacturer’s recommended specifications should be considered for tube diameter and bend radii. Tube length should typically be no longer than 1m unless justified and the number of bends should be minimized. Portable particle counters with a short length of sample tubing should be used for classification purposes. Isokinetic sampling heads should be used in unidirectional airflow systems. They should be oriented appropriately and positioned as close as possible to the critical location to ensure that samples are representative.
