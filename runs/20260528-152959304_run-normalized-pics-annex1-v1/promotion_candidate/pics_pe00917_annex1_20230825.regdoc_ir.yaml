          - nid: ann1.sec9.p9_15.tbl5.not2
            kind: note
            kind_raw: note
            num: '2'
            ord: 513
            heading: null
            text: 'Note 1: The particle limits given in the table for the “at rest” state should be achieved after a short “clean up” period defined during qualification (guidance value of less than 20 minutes) in an unmanned state, after the completion of operations (see paragraph 4.29).'
            role: informative
            normativity: null
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:2973
            children: []
            data:
              note_type: table_note
              table_no: '5'
          - nid: ann1.sec9.p9_15.tbl5.not3
            kind: note
            kind_raw: note
            num: '3'
            ord: 514
            heading: null
            text: 'Note 2: The occasional indication of macro particle counts, especially ≥ 5 µm, within grade A may be considered to be false counts due to electronic noise, stray light, coincidence loss etc. However, consecutive or regular counting of low levels may be indicative of a possible contamination event and should be investigated. Such events may indicate early failure of the room air supply filtration system, equipment failure, or may also be diagnostic of poor practices during machine set-up and routine operation.'
            role: informative
            normativity: null
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:2978
            children: []
