            locator: line:1278
          - source_label: PIC/S
            locator: line:1279
          - source_label: PIC/S
            locator: line:1280
          - source_label: PIC/S
            locator: line:1281
          - source_label: PIC/S
            locator: line:1282
          - source_label: PIC/S
            locator: line:1283
          - source_label: PIC/S
            locator: line:1284
          - source_label: PIC/S
            locator: line:1285
          - source_label: PIC/S
            locator: line:1286
          - source_label: PIC/S
            locator: line:1287
          - source_label: PIC/S
