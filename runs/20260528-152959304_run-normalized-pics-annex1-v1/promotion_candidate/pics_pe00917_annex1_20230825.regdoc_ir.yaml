        heading: null
        text: Contamination of the packaging films used in the FFS process should be minimized by appropriate controls during component fabrication, supply and handling. Due to the criticality of packaging films, procedures should be implemented to ensure that the films supplied meet defined specifications and are of the appropriate quality, including material thickness and strength, microbial and particulate contamination, integrity and artwork, as relevant. The sampling frequency, the bioburden and, where applicable, endotoxin/pyrogen levels of packaging films and associated components should be defined and controlled within the PQS and considered in the CCS.
