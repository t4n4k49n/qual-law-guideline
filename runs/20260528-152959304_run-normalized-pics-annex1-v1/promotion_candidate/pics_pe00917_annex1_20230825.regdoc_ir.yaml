          num: ii
          ord: 443
          heading: null
          text: "For terminally sterilised products, the validation of terminal sterilisation\n             processes should ensure the sterility of all critical product pathways between\n             the component and moulded container, including areas that are not wetted\n             during sterilisation."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2582
          - source_label: PIC/S
            locator: line:2583
          - source_label: PIC/S
            locator: line:2584
          - source_label: PIC/S
            locator: line:2585
          children: []
        - nid: ann1.sec8.p8_118.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 444
          heading: null
          text: "Testing procedures should be established and validated to ensure the\n             effective sealing of components and moulded containers."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2587
          - source_label: PIC/S
            locator: line:2588
          children: []
      - nid: ann1.sec8.p8_119
        kind: paragraph
        kind_raw: '8.119'
        num: '8.119'
        ord: 445
        heading: null
        text: Appropriate maintenance procedures should be established based on risk, and include maintenance and inspection plans for items critical to unit sealing, integrity and sterility.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2590
        - source_label: PIC/S
          locator: line:2591
        - source_label: PIC/S
          locator: line:2592
        children: []
      - nid: ann1.sec8.p8_120
        kind: paragraph
        kind_raw: '8.120'
        num: '8.120'
        ord: 446
        heading: null
        text: 'The moulds used to form containers are considered critical equipment and any changes or modification to moulds should result in an assessment of finished product container integrity, and where the assessment indicates, should be supported by validation. Any issues identified that indicate a potential product quality concern should be documented and investigated.


          LYOPHILIZATION'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2594
        - source_label: PIC/S
          locator: line:2595
        - source_label: PIC/S
          locator: line:2596
        - source_label: PIC/S
          locator: line:2597
        - source_label: PIC/S
          locator: line:2598
        - source_label: PIC/S
          locator: line:2608
        children: []
      - nid: ann1.sec8.p8_121
        kind: paragraph
        kind_raw: '8.121'
        num: '8.121'
        ord: 447
        heading: null
        text: Lyophilization is a critical process step and all activities that can affect the sterility of the product or material need to be regarded as extensions of the aseptic processing of the sterilised product. The lyophilization equipment and its processes should be designed to ensure that product or material sterility is maintained during lyophilization by preventing microbial and particle contamination between the filling of products for lyophilization, and completion of lyophilization process. All control measures in place should be determined by the site’s CCS.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2610
        - source_label: PIC/S
          locator: line:2611
        - source_label: PIC/S
          locator: line:2612
        - source_label: PIC/S
          locator: line:2613
        - source_label: PIC/S
          locator: line:2614
        - source_label: PIC/S
          locator: line:2615
        - source_label: PIC/S
          locator: line:2616
        - source_label: PIC/S
          locator: line:2617
        children: []
      - nid: ann1.sec8.p8_122
        kind: paragraph
        kind_raw: '8.122'
        num: '8.122'
        ord: 448
        heading: null
        text: The sterilisation of the lyophilizer and associated equipment (e.g. trays, vial support rings) should be validated and the holding time between the sterilisation cycle and use appropriately challenged during APS (see paragraph 9.33). The lyophilizer should be sterilised regularly, based on system design. Re-sterilisation should be performed following maintenance or cleaning. Sterilised lyophilizers and associated equipment should be protected from contamination after sterilisation.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2619
        - source_label: PIC/S
          locator: line:2620
        - source_label: PIC/S
          locator: line:2621
        - source_label: PIC/S
          locator: line:2622
        - source_label: PIC/S
          locator: line:2623
        - source_label: PIC/S
          locator: line:2624
        - source_label: PIC/S
          locator: line:2625
        children: []
      - nid: ann1.sec8.p8_123
        kind: paragraph
        kind_raw: '8.123'
        num: '8.123'
        ord: 449
        heading: null
        text: Lyophilizers and associated product transfer and loading/unloading areas should be designed to minimize operator intervention as far as possible. The frequency of lyophilizer sterilisation should be determined based on the design and risks related to system contamination during use. Lyophilizers that are manually loaded or unloaded with no barrier technology separation should be sterilised before each load. For lyophilizers loaded and unloaded by automated systems or protected by closed barrier systems, the frequency of sterilisation should be justified and documented as part of the CCS.1
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2627
        - source_label: PIC/S
          locator: line:2628
        - source_label: PIC/S
          locator: line:2629
        - source_label: PIC/S
          locator: line:2630
        - source_label: PIC/S
          locator: line:2631
        - source_label: PIC/S
          locator: line:2632
        - source_label: PIC/S
          locator: line:2633
        - source_label: PIC/S
          locator: line:2634
        children: []
      - nid: ann1.sec8.p8_124
        kind: paragraph
        kind_raw: '8.124'
        num: '8.124'
        ord: 450
        heading: null
        text: The integrity of the lyophilizer should be maintained following sterilisation and during lyophilization. The filter used to maintain lyophilizer integrity should be sterilised before each use of the system and its integrity testing results should be part of the batch certification/release. The frequency of vacuum/leak integrity testing of the chamber should be documented and the maximum permitted leakage of air into the lyophilizer should be specified and checked at the start of every cycle.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2636
        - source_label: PIC/S
          locator: line:2637
        - source_label: PIC/S
          locator: line:2638
        - source_label: PIC/S
          locator: line:2639
        - source_label: PIC/S
          locator: line:2640
        - source_label: PIC/S
          locator: line:2641
        - source_label: PIC/S
          locator: line:2642
        children: []
      - nid: ann1.sec8.p8_125
        kind: paragraph
        kind_raw: '8.125'
        num: '8.125'
        ord: 451
        heading: null
        text: Lyophilization trays should be checked regularly to ensure that they are not misshapen or damaged.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2644
        - source_label: PIC/S
          locator: line:2645
        children: []
      - nid: ann1.sec8.p8_126
        kind: paragraph
        kind_raw: '8.126'
        num: '8.126'
        ord: 452
        heading: null
        text: 'Points to consider for the design of loading (and unloading, where the lyophilized material is still unsealed and exposed), include but are not limited to:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2647
        - source_label: PIC/S
          locator: line:2648
        children:
        - nid: ann1.sec8.p8_126.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 453
          heading: null
          text: "The loading pattern within the lyophilizer should be specified and\n               documented."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2650
          - source_label: PIC/S
            locator: line:2651
          children: []
        - nid: ann1.sec8.p8_126.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 454
          heading: null
          text: "The transfer of partially closed containers to a lyophilizer should be\n               undertaken under grade A conditions at all times and handled in a manner\n               designed to minimize direct operator intervention. Technologies such as\n               conveyor systems or portable transfer systems (e.g. clean air transfer carts,\n1         This provision enters into force on 25 August 2024.\n              portable unidirectional airflow workstations) should be used to ensure that\n              the cleanliness of the system used to transfer the partially closed containers\n              is maintained. Alternatively, where supported by validation, trays closed in\n              grade A and not reopened whilst in the grade B area may be used to protect\n              partially stoppered vials (e.g. appropriately closed boxes)."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2653
          - source_label: PIC/S
            locator: line:2654
          - source_label: PIC/S
            locator: line:2655
          - source_label: PIC/S
            locator: line:2656
          - source_label: PIC/S
            locator: line:2659
          - source_label: PIC/S
            locator: line:2667
          - source_label: PIC/S
            locator: line:2668
          - source_label: PIC/S
            locator: line:2669
          - source_label: PIC/S
            locator: line:2670
          - source_label: PIC/S
            locator: line:2671
          children: []
        - nid: ann1.sec8.p8_126.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 455
          heading: null
          text: "Airflow patterns should not be adversely affected by transport devices and\n              venting of the loading zone."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2673
          - source_label: PIC/S
            locator: line:2674
          children: []
        - nid: ann1.sec8.p8_126.iiv
          kind: item
          kind_raw: iv.
          num: iv
          ord: 456
          heading: null
          text: "Unsealed containers (such as partially stoppered vials) should be maintained\n              under grade A conditions and should normally be separated from operators\n              by physical barrier technology or any other appropriate measures."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2676
          - source_label: PIC/S
            locator: line:2677
          - source_label: PIC/S
            locator: line:2678
          children: []
        - nid: ann1.sec8.p8_126.iv
          kind: item
          kind_raw: v.
          num: v
          ord: 457
          heading: null
          text: "Where seating of the stoppers is not completed prior to opening the\n              lyophilizer chamber, product removed from the lyophilizer should remain\n              under grade A conditions during subsequent handling."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2680
          - source_label: PIC/S
            locator: line:2681
          - source_label: PIC/S
            locator: line:2682
          children: []
        - nid: ann1.sec8.p8_126.ivi
          kind: item
          kind_raw: vi.
          num: vi
          ord: 458
          heading: null
          text: "Utensils used during loading and unloading of the lyophilizer (e.g. trays,\n              bags, placing devices, tweezers) should be sterile.\nCLOSED SYSTEMS"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2684
          - source_label: PIC/S
            locator: line:2685
          - source_label: PIC/S
            locator: line:2688
          children: []
      - nid: ann1.sec8.p8_127
        kind: paragraph
        kind_raw: '8.127'
        num: '8.127'
        ord: 459
        heading: null
        text: The use of closed systems can reduce the risk of microbial, particle and chemical contamination from the adjacent environment. Closed systems should always be designed to reduce the need for manual manipulations and the associated risks.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2690
        - source_label: PIC/S
          locator: line:2691
        - source_label: PIC/S
          locator: line:2692
        children: []
      - nid: ann1.sec8.p8_128
        kind: paragraph
        kind_raw: '8.128'
        num: '8.128'
        ord: 460
        heading: null
        text: It is critical to ensure the sterility of all product contact surfaces of closed systems used for aseptic processing. The design and selection of any closed system used for aseptic processing should ensure maintenance of sterility. Connection of sterile equipment (e.g. tubing/pipework) to the sterilised product pathway after the final sterilising grade filter should be designed to be connected aseptically (e.g. by intrinsic sterile connection devices).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2694
        - source_label: PIC/S
          locator: line:2695
        - source_label: PIC/S
          locator: line:2696
        - source_label: PIC/S
          locator: line:2697
        - source_label: PIC/S
          locator: line:2698
        - source_label: PIC/S
          locator: line:2699
        children: []
      - nid: ann1.sec8.p8_129
        kind: paragraph
        kind_raw: '8.129'
        num: '8.129'
        ord: 461
        heading: null
        text: Appropriate measures should be in place to ensure the integrity of components used in aseptic connections. The means by which this is achieved should be determined and captured in the CCS. Appropriate system integrity tests should be considered when there is a risk of compromising product sterility. Supplier assessment should include the collation of data in relation to potential failure modes that may lead to a loss of system sterility.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2701
        - source_label: PIC/S
          locator: line:2702
        - source_label: PIC/S
          locator: line:2703
        - source_label: PIC/S
          locator: line:2704
        - source_label: PIC/S
          locator: line:2705
        - source_label: PIC/S
          locator: line:2706
        children: []
      - nid: ann1.sec8.p8_130
        kind: paragraph
        kind_raw: '8.130'
        num: '8.130'
        ord: 462
        heading: null
        text: 'The background environment in which closed systems are located should be based on their design and the processes undertaken. For aseptic processing and where there are any risks that system integrity may be compromised, the system should be located in grade A. If the system can be shown to remain integral at every usage (e.g. via pressure testing and/or monitoring) then a lower classified area may be used. Any transfer between classified areas should be thoroughly assessed (see paragraph 4.10). If the closed system is opened (e.g. for maintenance of a bulk manufacturing line) then this should be performed in a classified area appropriate to the materials (e.g. grade C for terminal sterilisation processes, or grade A for aseptic processing) or be subject to further cleaning and disinfection (and sterilisation in case of aseptic processes).


          SINGLE USE SYSTEMS (SUS)'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2708
        - source_label: PIC/S
          locator: line:2709
        - source_label: PIC/S
          locator: line:2710
        - source_label: PIC/S
          locator: line:2711
        - source_label: PIC/S
          locator: line:2712
        - source_label: PIC/S
          locator: line:2713
        - source_label: PIC/S
          locator: line:2714
        - source_label: PIC/S
          locator: line:2715
        - source_label: PIC/S
          locator: line:2716
        - source_label: PIC/S
          locator: line:2717
        - source_label: PIC/S
          locator: line:2718
        - source_label: PIC/S
          locator: line:2728
        children: []
      - nid: ann1.sec8.p8_131
        kind: paragraph
        kind_raw: '8.131'
        num: '8.131'
        ord: 463
        heading: null
        text: SUS are those technologies used in manufacture of sterile products which are used as an alternative to reusable equipment. SUS can be individual components or made up of multiple components such as bags, filters, tubing, connectors, valves, storage bottles and sensors. Single use systems should be designed to reduce the need for manipulations and complexity of manual interventions.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2730
        - source_label: PIC/S
          locator: line:2731
        - source_label: PIC/S
          locator: line:2732
        - source_label: PIC/S
          locator: line:2733
        - source_label: PIC/S
          locator: line:2734
        children: []
      - nid: ann1.sec8.p8_132
        kind: paragraph
        kind_raw: '8.132'
        num: '8.132'
        ord: 464
        heading: null
        text: 'There are some specific risks associated with SUS which should be assessed as part of the CCS. These risks include but are not limited to:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2736
        - source_label: PIC/S
          locator: line:2737
        children:
        - nid: ann1.sec8.p8_132.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 465
          heading: null
          text: "the interaction between the product and product contact surface (such as\n             adsorption, or leachables and extractables),"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2739
          - source_label: PIC/S
            locator: line:2740
          children: []
        - nid: ann1.sec8.p8_132.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 466
          heading: null
          text: the fragile nature of the system compared with fixed reusable systems,
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2742
          children: []
        - nid: ann1.sec8.p8_132.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 467
          heading: null
          text: "the increase in the number and complexity of manual operations (including\n             inspection and handling of the system) and connections made,"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2744
          - source_label: PIC/S
            locator: line:2745
          children: []
        - nid: ann1.sec8.p8_132.iiv
          kind: item
          kind_raw: iv.
          num: iv
          ord: 468
          heading: null
          text: the complexity of the assembly,
          role: normative
          normativity: must
          tags: []
          refs:
