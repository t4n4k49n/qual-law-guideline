      - nid: ann1.sec4.p4_17
        kind: paragraph
        kind_raw: '4.17'
        num: '4.17'
        ord: 63
        heading: null
        text: 'Facilities should be designed to permit observation of production activities from outside the grade A and B areas (e.g. through the provision of windows or remote cameras with a full view of the area and processes to allow observation and supervision without entry). This requirement should be considered when designing new facilities or during refurbishment of existing facilities.


          BARRIER TECHNOLOGIES'
