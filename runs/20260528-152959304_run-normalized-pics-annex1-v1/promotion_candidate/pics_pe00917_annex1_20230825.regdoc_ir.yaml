        - source_label: PIC/S
          locator: line:1970
        children: []
      - nid: ann1.sec8.p8_67
        kind: paragraph
        kind_raw: '8.67'
        num: '8.67'
        ord: 303
        heading: null
        text: "Dry heat sterilisation/depyrogenation tunnels should be configured to ensure that\n            airflow protects the integrity and performance of the grade A sterilising zone by\n            maintaining appropriate pressure differentials and airflow through the tunnel. Air\n            pressure difference profiles should be assessed. The impact of any airflow\n            change should be assessed to ensure the heating profile is maintained. All air\n            supplied to the tunnel should pass through at least a HEPA filter and periodic\n            tests (at least biannually) should be performed to demonstrate air filter integrity.\n            Any tunnel parts that come into contact with sterilised components should be\n            appropriately sterilised or disinfected. Critical process parameters that should be\n            considered during validation and/or routine processing should include, but are\n            not limited to:"
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
