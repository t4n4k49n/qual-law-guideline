          source_spans:
          - source_label: PIC/S
            locator: line:2747
          children: []
        - nid: ann1.sec8.p8_132.iv
          kind: item
          kind_raw: v.
          num: v
          ord: 469
          heading: null
          text: "the performance of the pre-and post-use integrity testing for sterilising grade\n             filters (see paragraph 8.87),"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2749
          - source_label: PIC/S
            locator: line:2750
          children: []
        - nid: ann1.sec8.p8_132.ivi
          kind: item
          kind_raw: vi.
          num: vi
          ord: 470
          heading: null
          text: the risk of holes and leakage,
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2752
          children: []
        - nid: ann1.sec8.p8_132.ivii
          kind: item
          kind_raw: vii.
          num: vii
          ord: 471
          heading: null
          text: "the potential for compromising the system at the point of opening the outer\n             packaging,"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2754
          - source_label: PIC/S
            locator: line:2755
          children: []
        - nid: ann1.sec8.p8_132.iviii
          kind: item
          kind_raw: viii.
          num: viii
          ord: 472
          heading: null
          text: the risk of particle contamination.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:2757
          children: []
      - nid: ann1.sec8.p8_133
        kind: paragraph
        kind_raw: '8.133'
        num: '8.133'
        ord: 473
        heading: null
        text: Sterilisation processes for SUS should be validated and shown to have no adverse impact on system performance.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2759
        - source_label: PIC/S
          locator: line:2760
        children: []
      - nid: ann1.sec8.p8_134
        kind: paragraph
        kind_raw: '8.134'
        num: '8.134'
        ord: 474
        heading: null
        text: Assessment of suppliers of disposable systems including sterilisation is critical to the selection and use of these systems. For sterile SUS, verification of sterility assurance should be performed as part of the supplier qualification and evidence of sterilisation of each unit should be checked on receipt.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:2762
        - source_label: PIC/S
          locator: line:2763
        - source_label: PIC/S
          locator: line:2764
        - source_label: PIC/S
          locator: line:2765
        children: []
      - nid: ann1.sec8.p8_135
        kind: paragraph
        kind_raw: '8.135'
        num: '8.135'
        ord: 475
        heading: null
        text: The adsorption and reactivity of the product with product contact surfaces should be evaluated under process conditions.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
