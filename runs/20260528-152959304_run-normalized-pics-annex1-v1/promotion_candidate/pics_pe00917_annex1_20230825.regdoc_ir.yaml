        - source_label: PIC/S
          locator: line:1234
        children: []
      - nid: ann1.sec7.p7_9
        kind: paragraph
        kind_raw: '7.9'
        num: '7.9'
        ord: 189
        heading: null
        text: "Wristwatches, make-up, jewellery, other personal items such as mobile phones\n            and any other non-essential items should not be allowed in clean areas.\n            Electronic devices used in cleanrooms, e.g. mobile phones and tablets, that are\n            supplied by the manufacturer solely for use in the cleanrooms, may be acceptable\n            if suitably designed to permit cleaning and disinfection commensurate with the\n            grade in which they are used. The use and disinfection of such equipment should\n            be included in the CCS."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1243
        - source_label: PIC/S
          locator: line:1244
        - source_label: PIC/S
          locator: line:1245
        - source_label: PIC/S
          locator: line:1246
        - source_label: PIC/S
          locator: line:1247
        - source_label: PIC/S
          locator: line:1248
        - source_label: PIC/S
          locator: line:1249
        children: []
      - nid: ann1.sec7.p7_10
        kind: paragraph
        kind_raw: '7.10'
        num: '7.10'
        ord: 190
        heading: null
        text: "Cleanroom gowning and hand washing should follow a written procedure\n            designed to minimize contamination of cleanroom clothing and/or the transfer of\n            contaminants to the clean areas."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1251
        - source_label: PIC/S
          locator: line:1252
        - source_label: PIC/S
          locator: line:1253
        children: []
      - nid: ann1.sec7.p7_11
        kind: paragraph
        kind_raw: '7.11'
        num: '7.11'
        ord: 191
        heading: null
        text: "The clothing and its quality should be appropriate for the process and the\n            grade of the working area. It should be worn in such a way as to protect the\n            product from contamination. When the type of clothing chosen needs to provide\n            the operator protection from the product, it should not compromise the protection\n            of the product from contamination. Garments should be visually checked for\n            cleanliness and integrity immediately prior to and after gowning. Gown integrity\n            should also be checked upon exit. For sterilised garments and eye coverings,\n            particular attention should be taken to ensure they have been subject to the\n            sterilisation process, are within their specified hold time and that the packaging\n            is visually inspected to ensure it is integral before use. Reusable garments\n            (including eye coverings) should be replaced if damage is identified, or at a set\n            frequency that is determined during qualification studies. The qualification of\n            garments should consider any necessary garment testing requirements,\n            including damage to garments that may not be identified by visual inspection\n            alone."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
