        - nid: ann1.sec10.p10_6.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 605
          heading: null
          text: "For products which have been heat sterilised in their final containers,\n              samples taken should be representative of the worst case locations (e.g. the\n              potentially coolest or slowest to heat part of each load)."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
