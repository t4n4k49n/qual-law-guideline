          locator: line:1906
        - source_label: PIC/S
          locator: line:1907
        - source_label: PIC/S
          locator: line:1908
        - source_label: PIC/S
          locator: line:1909
        children: []
      - nid: ann1.sec8.p8_60
        kind: paragraph
        kind_raw: '8.60'
        num: '8.60'
        ord: 296
        heading: null
        text: Leak tests on the steriliser should be carried out periodically (normally weekly) when a vacuum phase is part of the cycle or the system is returned, post-sterilisation, to a pressure lower than the environment surrounding the steriliser.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1911
        - source_label: PIC/S
          locator: line:1912
        - source_label: PIC/S
          locator: line:1913
        children: []
      - nid: ann1.sec8.p8_61
        kind: paragraph
        kind_raw: '8.61'
        num: '8.61'
        ord: 297
        heading: null
        text: There should be adequate assurance of air removal prior to and during sterilisation when the sterilisation process includes air purging (e.g. porous autoclave loads, lyophilizer chambers). For autoclaves, this should include an air removal test cycle (normally performed on a daily basis) or the use of an air detector system. Loads to be sterilised should be designed to support effective air removal and be free draining to prevent the build-up of condensate.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1915
        - source_label: PIC/S
          locator: line:1916
        - source_label: PIC/S
          locator: line:1917
        - source_label: PIC/S
          locator: line:1918
        - source_label: PIC/S
          locator: line:1919
        - source_label: PIC/S
          locator: line:1920
        children: []
      - nid: ann1.sec8.p8_62
        kind: paragraph
        kind_raw: '8.62'
        num: '8.62'
        ord: 298
        heading: null
        text: Distortion and damage of non-rigid containers that are terminally sterilised, such as containers produced by Blow-Fill-Seal or Form-Fill-Seal technologies, should be prevented by appropriate cycle design and control (for instance setting correct pressure, heating and cooling rates and loading patterns).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1922
        - source_label: PIC/S
          locator: line:1923
        - source_label: PIC/S
          locator: line:1924
        - source_label: PIC/S
          locator: line:1925
        children: []
      - nid: ann1.sec8.p8_63
        kind: paragraph
        kind_raw: '8.63'
        num: '8.63'
        ord: 299
        heading: null
        text: Where steam in place systems are used for sterilisation (e.g. for fixed pipework, vessels and lyophilizer chambers), the system should be appropriately designed and validated to assure all parts of the system are subjected to the required treatment. The system should be monitored for temperature, pressure and time at appropriate locations during routine use to ensure all areas are effectively and reproducibly sterilised. These locations should be demonstrated as being representative of, and correlated with, the slowest to heat locations during initial and routine validation. Once a system has been sterilised by steam in place, it should remain integral and where operations require, maintained under positive pressure or otherwise equipped with a sterilising vent filter prior to use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1927
        - source_label: PIC/S
          locator: line:1928
        - source_label: PIC/S
          locator: line:1929
        - source_label: PIC/S
          locator: line:1930
        - source_label: PIC/S
