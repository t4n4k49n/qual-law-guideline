      - nid: ann1.sec10.p10_9
        kind: paragraph
        kind_raw: '10.9'
        num: '10.9'
        ord: 610
        heading: null
        text: Media used for product testing should be quality control tested according to the related Pharmacopeia before use. Media used for environmental monitoring and APS should be tested for growth promotion before use, using a scientifically justified and designated group of reference microorganisms and including suitably representative local isolates. Media quality control testing should normally be performed by the end user. Any reliance on outsourced testing or supplier testing of media should be justified and transportation and shipping conditions should be thoroughly considered in this case.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
