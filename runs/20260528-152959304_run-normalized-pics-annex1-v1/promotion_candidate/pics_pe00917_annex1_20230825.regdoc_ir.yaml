      - nid: ann1.sec4.p4_29
        kind: paragraph
        kind_raw: '4.29'
        num: '4.29'
        ord: 108
        heading: null
        text: Cleanroom classification should be carried out in the “at rest” and “in operation” states.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:745
        - source_label: PIC/S
          locator: line:746
        children:
        - nid: ann1.sec4.p4_29.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 109
          heading: null
          text: "The definition of “at rest” state is the condition whereby the installation of all\n                the utilities is complete including any functioning HVAC, with the main\n                manufacturing equipment installed as specified but not operating and without\n                personnel present in the room."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:748
          - source_label: PIC/S
            locator: line:749
          - source_label: PIC/S
            locator: line:750
          - source_label: PIC/S
            locator: line:751
          children: []
        - nid: ann1.sec4.p4_29.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 110
          heading: null
          text: "The definition of “in operation” state is the condition where the installation of\n                the cleanroom is complete, the HVAC system fully operational, equipment\n                installed and functioning in the manufacturer’s defined operating mode with\n                the maximum number of personnel present performing or simulating routine\n                operational work."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:753
          - source_label: PIC/S
            locator: line:754
          - source_label: PIC/S
            locator: line:755
          - source_label: PIC/S
            locator: line:756
          - source_label: PIC/S
            locator: line:757
          children: []
        - nid: ann1.sec4.p4_29.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 111
          heading: null
          text: "The total particle limits given in Table 1 above for the “at rest” state should\n                be achieved after a “clean up” period on completion of operations and line\n                clearance/cleaning activities. The \"clean up\" period (guidance value of less\n                than 20 minutes) should be determined during the qualification of the rooms,\n                documented and adhered to in procedures to reinstate a qualified state of\n                cleanliness if disrupted during operation."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:759
          - source_label: PIC/S
            locator: line:760
          - source_label: PIC/S
            locator: line:761
          - source_label: PIC/S
            locator: line:769
          - source_label: PIC/S
            locator: line:770
          - source_label: PIC/S
            locator: line:771
          children: []
      - nid: ann1.sec4.p4_30
        kind: paragraph
        kind_raw: '4.30'
        num: '4.30'
        ord: 112
        heading: null
        text: "The speed of air supplied by unidirectional airflow systems should be clearly\n            justified in the qualification protocol including the location for air speed\n            measurement. Air speed should be designed, measured and maintained to\n            ensure that appropriate unidirectional air movement provides protection of the\n            product and open components at the working position (e.g. where high-risk\n            operations occur and where product and/or components are exposed).\n            Unidirectional airflow systems should provide a homogeneous air speed in a\n            range of 0.36 – 0.54 m/s (guidance value) at the working position, unless\n            otherwise scientifically justified in the CCS. Airflow visualization studies should\n            correlate with the air speed measurement."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:773
        - source_label: PIC/S
          locator: line:774
        - source_label: PIC/S
          locator: line:775
        - source_label: PIC/S
          locator: line:776
        - source_label: PIC/S
          locator: line:777
        - source_label: PIC/S
          locator: line:778
        - source_label: PIC/S
          locator: line:779
        - source_label: PIC/S
          locator: line:780
        - source_label: PIC/S
          locator: line:781
        - source_label: PIC/S
          locator: line:782
        children: []
      - nid: ann1.sec4.p4_31
        kind: paragraph
        kind_raw: '4.31'
        num: '4.31'
        ord: 113
        heading: null
        text: "The microbial contamination level of the cleanrooms should be determined as\n            part of the cleanroom qualification. The number of sampling locations should be\n            based on a documented risk assessment and the results obtained from room\n            classification, air visualization studies and knowledge of the process and\n            operations to be performed in the area. The maximum limits for microbial\n            contamination during qualification for each grade are given in Table 2.\n            Qualification should include both “at rest” and “in operation” states."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
