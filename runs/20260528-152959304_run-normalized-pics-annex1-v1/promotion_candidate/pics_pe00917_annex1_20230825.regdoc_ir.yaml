          locator: line:1044
        - source_label: PIC/S
          locator: line:1045
        - source_label: PIC/S
          locator: line:1046
        - source_label: PIC/S
          locator: line:1047
        - source_label: PIC/S
          locator: line:1048
        children: []
      - nid: ann1.sec6.p6_11
        kind: paragraph
        kind_raw: '6.11'
        num: '6.11'
        ord: 168
        heading: null
        text: Where WFI storage tanks are equipped with hydrophobic bacteria retentive vent filters, the filters should not be a source of contamination and the integrity of the filter tested before installation and after use. Controls should be in place to prevent condensation formation on the filter (e.g. by heating).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1050
        - source_label: PIC/S
