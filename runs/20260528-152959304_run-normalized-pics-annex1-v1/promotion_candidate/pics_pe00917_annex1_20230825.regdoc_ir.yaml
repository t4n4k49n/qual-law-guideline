        kind: paragraph
        kind_raw: '8.24'
        num: '8.24'
        ord: 260
        heading: null
        text: Containers sealed under vacuum should be tested for maintenance of vacuum after an appropriate pre-determined period prior to certification/release and during shelf life.
        role: normative
        normativity: must
        tags: []
        refs:
