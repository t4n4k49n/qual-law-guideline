        kind: paragraph
        kind_raw: '8.89'
        num: '8.89'
        ord: 370
        heading: null
        text: The integrity of non-critical air or gas vent filters should be confirmed and recorded at appropriate intervals. Where gas filters are in place for extended periods, integrity testing should be carried out at installation and prior to replacement. The maximum duration of use should be specified and monitored based on risk (e.g. considering the maximum number of uses and heat treatment/ sterilisation cycles permitted as applicable).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
