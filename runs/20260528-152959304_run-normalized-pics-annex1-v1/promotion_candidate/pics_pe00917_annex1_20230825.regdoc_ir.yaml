        ord: 492
        heading: null
        text: Other characteristics, such as temperature and relative humidity, should be controlled within ranges that align with product/processing/personnel requirements and support maintenance of defined cleanliness standards (e.g. grade A or B).
        role: normative
        normativity: must
        tags: []
        refs:
