          locator: line:1255
        - source_label: PIC/S
          locator: line:1256
        - source_label: PIC/S
          locator: line:1257
        - source_label: PIC/S
          locator: line:1258
        - source_label: PIC/S
          locator: line:1259
        - source_label: PIC/S
          locator: line:1260
