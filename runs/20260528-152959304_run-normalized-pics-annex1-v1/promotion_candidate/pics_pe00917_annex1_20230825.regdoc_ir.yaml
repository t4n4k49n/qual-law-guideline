      - nid: ann1.sec8.p8_69
        kind: paragraph
        kind_raw: '8.69'
        num: '8.69'
        ord: 310
        heading: null
        text: "Containers spiked with endotoxin should be used during validation and should be\n            carefully managed with a full reconciliation performed. Containers should be\n            representative of the materials normally processed (in respect to composition of\n            the packaging materials, porosity, dimensions, nominal volume). Endotoxin\n            quantification and recovery efficiency should also be demonstrated."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
