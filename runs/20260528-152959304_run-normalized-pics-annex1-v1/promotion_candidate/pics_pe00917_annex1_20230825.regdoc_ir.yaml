      - nid: ann1.sec9.p9_3
        kind: paragraph
        kind_raw: '9.3'
        num: '9.3'
        ord: 487
        heading: null
        text: 'The information from these systems should be used for routine batch certification/release and for periodic assessment during process review or investigation. This applies for both terminal sterilisation and aseptic processes, however, the criticality of the impact may differ depending upon the product and process type.


          ENVIRONMENTAL AND PROCESS MONITORING'
        role: normative
        normativity: must
        tags: []
        refs:
