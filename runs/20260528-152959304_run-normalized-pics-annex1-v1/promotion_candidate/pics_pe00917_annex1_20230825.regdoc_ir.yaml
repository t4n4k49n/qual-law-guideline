      - nid: ann1.sec8.p8_68
        kind: paragraph
        kind_raw: '8.68'
        num: '8.68'
        ord: 309
        heading: null
        text: "When a thermal process is used as part of the depyrogenation process for any\n            component or product contact equipment/material, validation studies should be\n            performed to demonstrate that the process provides a suitable Fh value and\n            results in a minimum 3 log10 reduction in endotoxin concentration. When this is\n            attained, there is no additional requirement to demonstrate sterilisation in these\n            cases."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
