      - nid: ann1.sec4.p4_35
        kind: paragraph
        kind_raw: '4.35'
        num: '4.35'
        ord: 136
        heading: null
        text: Disinfectants and detergents used in grade A and grade B areas should be sterile prior to use. Disinfectants used in grade C and D may also be required to be sterile where determined in the CCS. Where the disinfectants and detergents are diluted / prepared by the sterile product manufacturer, this should be done in a manner to prevent contamination and they should be monitored for microbial contamination. Dilutions should be kept in previously cleaned containers (and sterilized where applicable) and should only be stored for the defined period. If the disinfectants and detergents are supplied “ready-made” then results from certificates of analysis or conformance can be accepted subject to successful completion of the appropriate vendor qualification.
        role: normative
        normativity: must
        tags: []
        refs:
