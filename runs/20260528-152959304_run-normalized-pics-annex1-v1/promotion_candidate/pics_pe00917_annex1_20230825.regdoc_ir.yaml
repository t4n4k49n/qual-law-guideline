      - nid: ann1.sec6.p6_15
        kind: paragraph
        kind_raw: '6.15'
        num: '6.15'
        ord: 172
        heading: null
        text: 'WFI systems should include continuous monitoring systems such as Total Organic Carbon (TOC) and conductivity, as these may give a better indication of overall system performance than discrete sampling. Sensor locations should be based on risk.


          STEAM USED AS A DIRECT STERILISING AGENT'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
