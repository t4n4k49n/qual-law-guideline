      - nid: ann1.sec8.p8_70
        kind: paragraph
        kind_raw: '8.70'
        num: '8.70'
        ord: 311
        heading: null
        text: "Dry heat ovens are typically employed to sterilise or depyrogenate primary\n            packaging components, starting materials or active substances but may be used\n            for other processes. They should be maintained at a positive pressure relative to\n            lower grade clean areas throughout the sterilisation and post sterilisation hold\n            process unless the integrity of the packaging is maintained. All air entering the\n            oven should pass through a HEPA filter. Critical process parameters that should\n            be considered in qualification and/or routine processing should include, but are\n            not limited to:"
        role: normative
        normativity: must
        tags: []
