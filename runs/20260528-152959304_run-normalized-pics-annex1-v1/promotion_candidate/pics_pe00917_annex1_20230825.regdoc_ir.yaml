      - nid: ann1.sec8.p8_88
        kind: paragraph
        kind_raw: '8.88'
        num: '8.88'
        ord: 369
        heading: null
        text: The integrity of critical sterile gas and air vent filters (that are directly linked to the sterility of the product) should be verified by testing after use, with the filter remaining in the filter assembly or housing.
