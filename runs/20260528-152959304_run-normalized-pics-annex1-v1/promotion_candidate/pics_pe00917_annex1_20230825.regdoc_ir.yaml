        children: []
      - nid: ann1.sec8.p8_23
        kind: paragraph
        kind_raw: '8.23'
        num: '8.23'
        ord: 259
        heading: null
        text: Samples of products using systems other than fusion should be taken and checked for integrity using validated methods. The frequency of testing should be based on the knowledge and experience of the container and closure systems being used. A scientifically justified sampling plan should be used. The sample size should be based on information such as supplier management, packaging component specifications and process knowledge.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1605
        - source_label: PIC/S
