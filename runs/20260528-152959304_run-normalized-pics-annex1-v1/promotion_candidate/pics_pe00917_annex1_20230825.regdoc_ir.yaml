        kind: paragraph
        kind_raw: '4.34'
        num: '4.34'
        ord: 135
        heading: null
        text: 'The disinfection process should be validated. Validation studies should demonstrate the suitability and effectiveness of disinfectants in the specific


          manner in which they are used and on the type of surface material, or representative material if justified, and should support the in-use expiry periods of prepared solutions.'
        role: normative
        normativity: must
        tags: []
        refs:
