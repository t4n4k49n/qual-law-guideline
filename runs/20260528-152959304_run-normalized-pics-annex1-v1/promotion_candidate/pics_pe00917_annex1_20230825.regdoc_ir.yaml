      - nid: ann1.sec9.p9_12
        kind: paragraph
        kind_raw: '9.12'
        num: '9.12'
        ord: 502
        heading: null
        text: The monitoring of grade C and D cleanrooms in operation should be performed based on data collected during qualification and routine data to allow effective trend analysis. The requirements of alert levels and action limits will depend on the nature of the operations carried out. Action limits may be more stringent than those listed in Table 5 and Table 6.
