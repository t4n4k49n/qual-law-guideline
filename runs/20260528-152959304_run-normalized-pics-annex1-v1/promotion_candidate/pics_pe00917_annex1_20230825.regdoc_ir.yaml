            children: []
      - nid: ann1.sec9.p9_34
        kind: paragraph
        kind_raw: '9.34'
        num: '9.34'
        ord: 555
        heading: null
        text: 'The APS should take into account various aseptic manipulations and interventions known to occur during normal production as well as worst-case situations, and take into account the following:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:3229
        - source_label: PIC/S
          locator: line:3230
        - source_label: PIC/S
          locator: line:3231
        children:
        - nid: ann1.sec9.p9_34.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 556
          heading: null
          text: "Inherent and corrective interventions representative of the routine process\n              should be performed in a manner and frequency similar to that during the\n              routine aseptic process."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:3233
          - source_label: PIC/S
            locator: line:3234
