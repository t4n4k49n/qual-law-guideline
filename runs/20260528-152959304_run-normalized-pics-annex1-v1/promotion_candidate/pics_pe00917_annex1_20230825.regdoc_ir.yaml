          children: []
        - nid: ann1.sec8.p8_106.iiii
          kind: item
          kind_raw: iii.
          num: iii
          ord: 410
          heading: null
          text: "The equipment should be installed in at least a grade C environment,\n             provided that grade A/B clothing is used. The microbiological monitoring of\n             operators wearing grade A/B clothing in a grade C area, should be performed\n             in accordance with risk management principles, and the limits and monitoring\n             frequencies applied with consideration of the activities performed by these\n             operators."
          role: normative
          normativity: must
          tags: []
          refs:
