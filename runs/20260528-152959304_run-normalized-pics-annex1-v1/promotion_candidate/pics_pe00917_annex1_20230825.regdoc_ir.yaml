      - nid: ann1.sec9.p9_9
        kind: paragraph
        kind_raw: '9.9'
        num: '9.9'
        ord: 495
        heading: null
        text: 'Appropriate alert levels and action limits should be set for the results of viable and total particle monitoring. The maximum total particle action limits are


          described in Table 5 and the maximum viable particle action limits are described in Table 6. However, more stringent action limits may be applied based on data trending, the nature of the process or as determined within the CCS. Both viable and total particle alert levels should be established based on results of cleanroom qualification tests and periodically reviewed based on ongoing trend data.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
