        kind: paragraph
        kind_raw: '6.18'
        num: '6.18'
        ord: 175
        heading: null
        text: Gases that come in direct contact with the product/primary container surfaces should be of appropriate chemical, particulate and microbial quality. All relevant parameters, including oil and water content, should be specified, taking into account the use and type of the gas, the design of the gas generation system and, where applicable, comply with the current monograph of the relevant Pharmacopeia or the product quality requirement.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1128
        - source_label: PIC/S
          locator: line:1129
        - source_label: PIC/S
          locator: line:1130
        - source_label: PIC/S
          locator: line:1131
        - source_label: PIC/S
          locator: line:1132
        - source_label: PIC/S
          locator: line:1133
        children: []
      - nid: ann1.sec6.p6_19
        kind: paragraph
        kind_raw: '6.19'
        num: '6.19'
        ord: 176
        heading: null
        text: Gases used in aseptic processes should be filtered through a sterilising grade filter (with a nominal pore size of a maximum of 0.22 µm) at the point of use. Where the filter is used on a batch basis (e.g. for filtration of gas used for overlay of aseptically filled products) or as product vessel vent filter, then the filter should be integrity tested and the results reviewed as part of the batch certification/release process. Any transfer pipework or tubing that is located after the final sterilising grade filter should be sterilised. When gases are used in the process, microbial monitoring of the gas should be performed periodically at the point of use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
