          children: []
      - nid: ann1.sec7.p7_14
        kind: paragraph
        kind_raw: '7.14'
        num: '7.14'
        ord: 198
        heading: null
        text: Cleanroom gowning should be performed in change rooms of an appropriate cleanliness grade to ensure gown cleanliness is maintained. Outdoor clothing including socks (other than personal underwear) should not be brought into changing rooms leading directly to grade B and C areas. Single or two-piece facility trouser suits, covering the full length of the arms and the legs, and facility socks covering the feet, should be worn before entry to change rooms for grades B and C. Facility suits and socks should not present a risk of contamination to the gowning area or processes.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1313
        - source_label: PIC/S
          locator: line:1314
        - source_label: PIC/S
          locator: line:1315
        - source_label: PIC/S
          locator: line:1316
        - source_label: PIC/S
          locator: line:1317
        - source_label: PIC/S
          locator: line:1318
        - source_label: PIC/S
          locator: line:1319
        - source_label: PIC/S
          locator: line:1320
        children: []
      - nid: ann1.sec7.p7_15
        kind: paragraph
        kind_raw: '7.15'
        num: '7.15'
        ord: 199
        heading: null
        text: Every operator entering grade B or A areas should gown into clean, sterilised protective garments (including eye coverings and masks) of an appropriate size at each entry. The maximum period for which the sterilised gown may be worn before replacement during a shift should be defined as part of the garment qualification.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1322
        - source_label: PIC/S
          locator: line:1323
        - source_label: PIC/S
          locator: line:1324
        - source_label: PIC/S
          locator: line:1325
        - source_label: PIC/S
          locator: line:1326
        children: []
      - nid: ann1.sec7.p7_16
        kind: paragraph
        kind_raw: '7.16'
        num: '7.16'
        ord: 200
        heading: null
        text: Gloves should be regularly disinfected during operations. Garments and gloves should be changed immediately if they become damaged and present any risk of product contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1328
        - source_label: PIC/S
          locator: line:1329
        - source_label: PIC/S
          locator: line:1330
        children: []
      - nid: ann1.sec7.p7_17
        kind: paragraph
        kind_raw: '7.17'
        num: '7.17'
        ord: 201
        heading: null
        text: Reusable clean area clothing should be cleaned in a laundry facility adequately segregated from production operations, using a qualified process ensuring that the clothing is not damaged and/or contaminated by fibres or particles during the repeated laundry process. Laundry facilities used should not introduce risk of contamination or cross-contamination. Inappropriate handling and use of clothing may damage fibres and increase the risk of shedding of particles. After washing and before packing, garments should be visually inspected for damage and visual cleanliness. The garment management processes should be evaluated and determined as part of the garment qualification programme and should include a maximum number of laundry and sterilisation cycles.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1332
        - source_label: PIC/S
          locator: line:1333
        - source_label: PIC/S
          locator: line:1334
        - source_label: PIC/S
          locator: line:1335
        - source_label: PIC/S
          locator: line:1336
        - source_label: PIC/S
          locator: line:1337
        - source_label: PIC/S
          locator: line:1338
        - source_label: PIC/S
          locator: line:1339
        - source_label: PIC/S
          locator: line:1340
        - source_label: PIC/S
          locator: line:1341
        children: []
      - nid: ann1.sec7.p7_18
        kind: paragraph
        kind_raw: '7.18'
        num: '7.18'
        ord: 202
        heading: null
        text: Activities in clean areas that are not critical to the production processes should be kept to a minimum, especially when aseptic operations are in progress. Movement of personnel should be slow, controlled and methodical to avoid excessive shedding of particles and organisms due to over-vigorous activity. Operators performing aseptic operations should adhere to aseptic technique at all times to prevent changes in air currents that may introduce air of lower quality into the critical zone. Movement adjacent to the critical zone should be restricted and the obstruction of the path of the unidirectional (first air) airflow should be avoided. A review of airflow visualisation studies should be considered as part of the training programme.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1343
        - source_label: PIC/S
          locator: line:1344
