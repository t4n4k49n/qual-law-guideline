        kind: paragraph
        kind_raw: '8.91'
        num: '8.91'
        ord: 372
        heading: null
        text: If the sterilising filtration process has been validated as a system consisting of multiple filters to achieve the sterility for a given fluid, the filtration system is considered to be a single sterilising unit and all filters within the system should satisfactorily pass integrity testing after use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
