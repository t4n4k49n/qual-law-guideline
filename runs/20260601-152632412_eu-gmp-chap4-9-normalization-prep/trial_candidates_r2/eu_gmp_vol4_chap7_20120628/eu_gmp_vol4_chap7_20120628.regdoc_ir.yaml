    - nid: cha7.sec1
      kind: section
      kind_raw: null
      num: null
      ord: 3
      heading: Principle
      text: Any activity covered by the GMP Guide that is outsourced should be appropriately defined, agreed and controlled in order to avoid misunderstandings which could result in a product or operation of unsatisfactory quality. There must be a written Contract between the Contract Giver and the Contract Acceptor which clearly establishes the duties of each party. The Quality Management System of the Contract Giver must clearly state the way that the Qualified Person certifying each batch of product for release exercises his full responsibility.
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
