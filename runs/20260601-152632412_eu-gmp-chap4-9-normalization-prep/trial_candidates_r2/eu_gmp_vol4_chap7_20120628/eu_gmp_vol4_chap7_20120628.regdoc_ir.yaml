        kind: paragraph
        kind_raw: '7.3'
        num: '7.3'
        ord: 8
        heading: null
        text: Where the marketing authorization holder and the manufacturer are not the same, appropriate arrangements should be in place, taking into account the principles described in this chapter.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
