        num: '7.14'
        ord: 22
        heading: null
        text: A Contract should be drawn up between the Contract Giver and the Contract Acceptor which specifies their respective responsibilities and communication processes relating to the outsourced activities. Technical aspects of the Contract should be drawn up by competent persons suitably knowledgeable in related outsourced activities and Good Manufacturing Practice. All arrangements for outsourced activities must be in accordance with regulations in force and the Marketing Authorisation for the product concerned and agreed by both parties.
        role: normative
        normativity: must
