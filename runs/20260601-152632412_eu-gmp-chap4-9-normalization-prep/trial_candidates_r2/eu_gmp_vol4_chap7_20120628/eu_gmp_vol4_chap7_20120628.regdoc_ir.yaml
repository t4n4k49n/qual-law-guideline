        kind_raw: note
        num: null
        ord: 4
        heading: null
        text: 'Note: This Chapter deals with the responsibilities of manufacturers towards the Competent Authorities of the Member States with respect to the granting of marketing and manufacturing authorizations. It is not intended in any way to affect the respective liability of Contract Acceptors and Contract Givers to consumers; this is governed by other provisions of Community and national law.'
