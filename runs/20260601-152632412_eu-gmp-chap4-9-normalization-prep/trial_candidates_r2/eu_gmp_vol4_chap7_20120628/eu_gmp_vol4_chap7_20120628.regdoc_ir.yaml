          locator: line:98
        - source_label: EU GMP
          locator: line:99
        - source_label: EU GMP
          locator: line:100
        children: []
      - nid: cha7.sec3.p7_8
        kind: paragraph
        kind_raw: '7.8'
        num: '7.8'
        ord: 14
        heading: null
        text: The Contract Giver should be responsible for reviewing and assessing the records and the results related to the outsourced activities. He should also ensure, either by himself, or based on the confirmation of the Contract Acceptor’s Qualified Person, that all products and materials delivered to him by the Contract Acceptor have been processed in accordance with GMP and the marketing authorisation.
        role: normative
        normativity: must
        tags: []
        refs:
