        num: '7.2'
        ord: 7
        heading: null
        text: All arrangements for the outsourced activities including any proposed changes in technical or other arrangements should be in accordance with regulations in force, and the Marketing Authorisation for the product concerned, where applicable.
        role: normative
        normativity: must
