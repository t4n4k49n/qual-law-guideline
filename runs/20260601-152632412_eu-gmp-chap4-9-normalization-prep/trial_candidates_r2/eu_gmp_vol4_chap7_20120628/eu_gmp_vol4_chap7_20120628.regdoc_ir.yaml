      - nid: cha7.sec5.p7_16
        kind: paragraph
        kind_raw: '7.16'
        num: '7.16'
        ord: 24
        heading: null
        text: All records related to the outsourced activities, e.g. manufacturing, analytical and distribution records, and reference samples, should be kept by, or be available to, the Contract Giver. Any records relevant to assessing the quality of a product in the event of complaints or a suspected defect or to investigating in the case of a suspected falsified product must be accessible and specified in the relevant procedures of the Contract Giver.
        role: normative
        normativity: must
