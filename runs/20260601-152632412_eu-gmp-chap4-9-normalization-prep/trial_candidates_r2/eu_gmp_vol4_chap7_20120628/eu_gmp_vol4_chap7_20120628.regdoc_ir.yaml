        num: '7.9'
        ord: 16
        heading: null
        text: The Contract Acceptor must be able to carry out satisfactorily the work ordered by the Contract Giver such as having adequate premises, equipment, knowledge, experience, and competent personnel.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
