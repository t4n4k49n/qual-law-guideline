  - nid: cha7
    kind: chapter
    kind_raw: Chapter
    num: '7'
    ord: 2
    heading: Outsourced Activities
    text: 'Legal basis for publishing the detailed guidelines: Article 47 of Directive 2001/83/EC on the Community code relating to medicinal products for human use and Article 51 of Directive 2001/82/EC on the Community code relating to veterinary medicinal products. This document provides guidance for the interpretation of the principles and guidelines of good manufacturing practice (GMP) for medicinal products as laid down in Directive 2003/94/EC for medicinal products for human use and Directive 91/412/EEC for veterinary use. Status of the document: revision 1 Reasons for changes: In view of the ICH Q10 guideline on the Pharmaceutical Quality System, Chapter 7 of the GMP Guide has been revised in order to provide updated guidance on outsourced GMP regulated activities beyond the current scope of contract manufacture and analysis operations. The title of the Chapter has been changed to reflect this. Deadline for coming into operation: 31 January 2013'
    role: structural
    normativity: null
    tags: []
    refs:
      internal: []
      external: []
