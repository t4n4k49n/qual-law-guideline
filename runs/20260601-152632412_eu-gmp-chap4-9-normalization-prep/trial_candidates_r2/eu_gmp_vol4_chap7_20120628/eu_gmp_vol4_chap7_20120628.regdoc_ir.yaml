      - nid: cha7.sec3.p7_7
        kind: paragraph
        kind_raw: '7.7'
        num: '7.7'
        ord: 13
        heading: null
        text: The Contract Giver should monitor and review the performance of the Contract Acceptor and the identification and implementation of any needed improvement.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
