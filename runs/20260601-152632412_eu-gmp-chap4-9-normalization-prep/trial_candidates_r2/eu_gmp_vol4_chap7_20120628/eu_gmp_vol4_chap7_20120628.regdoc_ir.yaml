        kind: paragraph
        kind_raw: '7.12'
        num: '7.12'
        ord: 19
        heading: null
        text: The Contract Acceptor should not make unauthorized changes, outside the terms of the Contract, which may adversely affect the quality of the outsourced activities for the Contract Giver.
        role: normative
        normativity: must
