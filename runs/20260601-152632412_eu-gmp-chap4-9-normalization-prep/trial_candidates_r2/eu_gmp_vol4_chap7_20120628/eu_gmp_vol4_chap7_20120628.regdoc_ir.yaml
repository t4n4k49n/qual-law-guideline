      - nid: cha7.sec5.p7_15
        kind: paragraph
        kind_raw: '7.15'
        num: '7.15'
        ord: 23
        heading: null
        text: The Contract should describe clearly who undertakes each step of the outsourced activity, e.g. knowledge management, technology transfer, supply chain, subcontracting, quality and purchasing of materials, testing and releasing materials, undertaking production and quality controls (including in-process controls, sampling and analysis).
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
