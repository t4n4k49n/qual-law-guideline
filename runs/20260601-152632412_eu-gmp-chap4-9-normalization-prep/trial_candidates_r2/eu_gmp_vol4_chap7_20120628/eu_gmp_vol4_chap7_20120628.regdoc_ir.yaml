        kind: paragraph
        kind_raw: '7.1'
        num: '7.1'
        ord: 6
        heading: null
        text: There should be a written Contract covering the outsourced activities, the products or operations to which they are related, and any technical arrangements made in connection with it.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
