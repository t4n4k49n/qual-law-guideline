        kind: paragraph
        kind_raw: '7.10'
        num: '7.10'
        ord: 17
        heading: null
        text: The Contract Acceptor should ensure that all products, materials and knowledge delivered to him are suitable for their intended purpose.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
