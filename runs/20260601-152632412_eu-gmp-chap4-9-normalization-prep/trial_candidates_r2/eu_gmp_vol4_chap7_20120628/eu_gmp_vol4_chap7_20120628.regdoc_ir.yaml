        kind: paragraph
        kind_raw: '7.11'
        num: '7.11'
        ord: 18
        heading: null
        text: The Contract Acceptor should not subcontract to a third party any of the work entrusted to him under the Contract without the Contract Giver’s prior evaluation and approval of the arrangements. Arrangements made between the Contract Acceptor and any third party should ensure that information and knowledge, including those from assessments of the suitability of the third party, are made available in the same way as between the original Contract Giver and Contract Acceptor.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
