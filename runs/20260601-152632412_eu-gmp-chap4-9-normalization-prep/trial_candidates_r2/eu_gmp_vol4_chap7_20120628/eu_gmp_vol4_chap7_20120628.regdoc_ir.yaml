        kind: paragraph
        kind_raw: '7.4'
        num: '7.4'
        ord: 10
        heading: null
        text: 'The pharmaceutical quality system of the Contract Giver should include the control and review of any outsourced activities. The Contract Giver is ultimately responsible to ensure processes are in place to assure the control of outsourced activities. These processes should incorporate quality risk management principles and notably include:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:79
        - source_label: EU GMP
          locator: line:80
        - source_label: EU GMP
          locator: line:81
        - source_label: EU GMP
          locator: line:82
        - source_label: EU GMP
          locator: line:83
        children: []
      - nid: cha7.sec3.p7_5
        kind: paragraph
        kind_raw: '7.5'
        num: '7.5'
        ord: 11
        heading: null
        text: Prior to outsourcing activities, the Contract Giver is responsible for assessing the legality, suitability and the competence of the Contract Acceptor to carry out successfully the outsourced activities. The Contract Giver is also responsible for ensuring by means of the Contract that the principles and guidelines of GMP as interpreted in this Guide are followed.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:85
        - source_label: EU GMP
          locator: line:86
        - source_label: EU GMP
          locator: line:87
        - source_label: EU GMP
          locator: line:88
        - source_label: EU GMP
          locator: line:89
        children: []
      - nid: cha7.sec3.p7_6
        kind: paragraph
        kind_raw: '7.6'
        num: '7.6'
        ord: 12
        heading: null
        text: The Contract Giver should provide the Contract Acceptor with all the information and knowledge necessary to carry out the contracted operations correctly in accordance with regulations in force, and the Marketing Authorisation for the product concerned. The Contract Giver should ensure that the Contract Acceptor is fully aware of any problems associated with the product or the work which might pose a hazard to his premises, equipment, personnel, other materials or other products.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
