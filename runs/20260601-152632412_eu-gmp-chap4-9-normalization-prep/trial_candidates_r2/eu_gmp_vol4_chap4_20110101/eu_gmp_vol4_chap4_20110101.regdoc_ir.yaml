        num: '4.10'
        ord: 16
        heading: null
        text: It should be clearly defined which record is related to each manufacturing activity and where this record is located. Secure controls must be in place to ensure the integrity of the record throughout the retention period and validated where appropriate.
        role: normative
        normativity: must
        tags: []
        refs:
