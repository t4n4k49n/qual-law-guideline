        kind: paragraph
        kind_raw: '4.2'
        num: '4.2'
        ord: 6
        heading: null
        text: Documents should be designed, prepared, reviewed, and distributed with care. They should comply with the relevant parts of Product Specification Files, Manufacturing and Marketing Authorisation dossiers, as appropriate. The reproduction of working documents from master documents should not allow any error to be introduced through the reproduction process.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
