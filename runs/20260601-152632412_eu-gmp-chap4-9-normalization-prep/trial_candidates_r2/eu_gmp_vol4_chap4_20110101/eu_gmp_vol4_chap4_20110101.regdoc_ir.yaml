    heading: Documentation
    text: 'Legal basis for publishing the detailed guidelines: Article 47 of Directive 2001/83/EC on the Community code relating to medicinal products for human use and Article 51 of Directive 2001/82/EC on the Community code relating to veterinary medicinal products. This document provides guidance for the interpretation of the principles and guidelines of good manufacturing practice (GMP) for medicinal products as laid down in Directive 2003/94/EC for medicinal products for human use and Directive 91/412/EEC for veterinary use. Status of the document: revision 1 Reasons for changes: the sections on "generation and control of documentation" and "retention of documents" have been revised, in the light of the increasing use of electronic documents within the GMP environment. Deadline for coming into operation: 30 June 2011 Telephone: (32-2) 299 11 11'
