        kind: paragraph
        kind_raw: '4.4'
        num: '4.4'
        ord: 8
        heading: null
        text: Documents containing instructions should be laid out in an orderly fashion and be easy to check. The style and language of documents should fit with their intended use. Standard Operating Procedures, Work Instructions and Methods should be written in an imperative mandatory style. Alternatively the certification may be based, in-whole or in-part, on the assessment of real time data (summaries and exception reports) from batch related process analytical technology (PAT), parameters or metrics as per the approved marketing authorisation dossier.
        role: normative
        normativity: must
        tags: []
        refs:
