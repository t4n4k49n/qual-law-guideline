        kind: paragraph
        kind_raw: '4.3'
        num: '4.3'
        ord: 7
        heading: null
        text: Documents containing instructions should be approved, signed and dated by appropriate and authorised persons. Documents should have unambiguous contents and be uniquely identifiable. The effective date should be defined.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
