      - nid: cha7.sec7_1.p7_13
        kind: paragraph
        kind_raw: '7.13'
        num: '7.13'
        ord: 201
        heading: null
        text: 重要な原材料等の供給業者が当該原材料等を製造していない場合、中間体・原薬の 製造業者は、当該原材料等の製造業者の名前及び住所を把握しておくこと。
