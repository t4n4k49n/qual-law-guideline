      - nid: cha4.sec4_4.p4_43
        kind: paragraph
        kind_raw: '4.43'
        num: '4.43'
        ord: 119
        heading: null
        text: 除草剤、殺虫剤等の強い毒性を有する非医薬品の製造に係る作業（秤量、粉砕及び 包装を含む）は、原薬の製造に使用する構造及び装置を使用して行ってはならない。 これらの強い毒性を有する非医薬品の取扱い及び保管は原薬から分離すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
