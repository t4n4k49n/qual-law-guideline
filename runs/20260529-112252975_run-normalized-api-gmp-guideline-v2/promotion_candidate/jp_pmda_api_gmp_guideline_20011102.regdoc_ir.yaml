        heading: null
        text: 設定規格に適合しない中間体・原薬は、その旨を識別し、区分保管すること。当 該中間体・原薬は以下に示すとおり再加工又は再処理する場合がある。不合格原材 料等の最終処置は記録すること。
        role: normative
