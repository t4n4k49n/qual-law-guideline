        text: 実収量については、製造工程の指定された段階で、期待収量と比較すること。期待 収量については、実験室データ、パイロットスケールデータ又は製造データに基づ いて、適切な範囲を設定すること。重要工程に係る収量の逸脱については、そのロ ットの品質への影響又は影響のおそれについて調査・確認を行うこと。
        role: normative
        normativity: must
