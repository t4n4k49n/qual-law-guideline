        kind: paragraph
        kind_raw: '8.12'
        num: '8.12'
        ord: 228
        heading: null
        text: 重要な秤量、計量又は小分け作業については、作業者以外の者の立会いのもとで行 うか又はそれと同等の管理を行うこと。製造担当者は原材料等の使用前に、当該原 材料等が目的とする中間体・原薬の製造指図に指示されたものであることを確認す ること。
