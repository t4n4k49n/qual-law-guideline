        kind: paragraph
        kind_raw: '8.43'
        num: '8.43'
        ord: 249
        heading: null
        text: 混合工程は、適切に管理し、記録すること。また、混合ロットは、必要に応じ、設 定規格に適合しているか否かについて試験を行うこと。
        role: normative
        normativity: must
        tags: []
