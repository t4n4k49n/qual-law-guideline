      - nid: cha5.sec5_1.p5_14
        kind: paragraph
        kind_raw: '5.14'
        num: '5.14'
        ord: 134
        heading: null
        text: 潤滑剤、熱媒体、冷却剤等の物質は、中間体・原薬の品質が公定規格又は他の設定 規格を超えて変質しないよう、中間体・原薬との接触をさせないこと。この規定か ら逸脱した場合には、当該物質について、その用途からみた適合性に悪影響がない ことを保証するための評価を行うこと。なお、可能な場合には、食品グレードの潤 滑剤及び油類を使用すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
