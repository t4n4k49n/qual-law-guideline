          locator: line:466
        - source_label: PMDA API GMP guideline
          locator: line:467
        - source_label: PMDA API GMP guideline
          locator: line:468
        children: []
      - nid: cha4.sec4_1.p4_11
        kind: paragraph
        kind_raw: '4.11'
        num: '4.11'
        ord: 97
        heading: null
        text: 構造及び設備は、混同及び汚染を防止するため、装置及び原材料等を整然と配置す るのに適した面積を有すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:471
        - source_label: PMDA API GMP guideline
          locator: line:472
        children: []
      - nid: cha4.sec4_1.p4_12
        kind: paragraph
        kind_raw: '4.12'
        num: '4.12'
        ord: 98
        heading: null
        text: 装置自体(例えば、閉鎖系又は囲い込み方式)で原材料等を適切に保護できる場合は、 当該装置は屋外に配置することがある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
