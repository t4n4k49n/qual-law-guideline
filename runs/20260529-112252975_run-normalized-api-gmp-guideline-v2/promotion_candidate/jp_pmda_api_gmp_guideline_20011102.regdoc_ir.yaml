        num: '14.41'
        ord: 398
        heading: null
        text: 溶媒を回収し、同じ工程又は別の工程で再使用する場合がある。ただし、この場 合には、当該溶媒を再使用する前の段階、又は、当該溶媒を他の承認された溶媒と 混合する前の段階において、当該溶媒が該当する基準に適合することを保証するた め、回収手順を管理し、モニターすること。
