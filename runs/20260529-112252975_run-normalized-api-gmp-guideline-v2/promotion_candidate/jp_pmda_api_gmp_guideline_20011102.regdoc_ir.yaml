      - nid: cha4.sec4_3.p4_31
        kind: paragraph
        kind_raw: '4.31'
        num: '4.31'
        ord: 111
        heading: null
        text: 正当な理由がない限り、工程用の水は、少なくとも、水道法に基づく水質基準又は 世界保健機構(ＷＨＯ)の飲用水質ガイドラインに適合すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:544
        - source_label: PMDA API GMP guideline
          locator: line:545
        children: []
      - nid: cha4.sec4_3.p4_32
        kind: paragraph
        kind_raw: '4.32'
        num: '4.32'
        ord: 112
        heading: null
        text: 飲用水が原薬の品質を保証するのに不十分であり、より厳しい化学的・微生物学的 水質規格が求められる場合には、物理的・化学的特性、生菌数、特定微生物及びエ ンドトキシンのうち必要な事項について適切な規格を設定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
