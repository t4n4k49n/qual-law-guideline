        kind: paragraph
        kind_raw: '14.20'
        num: '14.20'
        ord: 389
        heading: null
        text: 基準又は規格に適合しないものを含め中間体・原薬を工程に戻し、設定された製 造工程の一部である結晶化段階又はその他の適切な化学的又は物理的操作(例えば、 蒸留、濾過、クロマトグラフィー、粉砕等)を繰返すことにより再加工することは、 一般的には、許容される。ただし、そのような再加工を大部分のロットで行う場合 は、そのような再加工は標準的な製造工程の一部として含めること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
