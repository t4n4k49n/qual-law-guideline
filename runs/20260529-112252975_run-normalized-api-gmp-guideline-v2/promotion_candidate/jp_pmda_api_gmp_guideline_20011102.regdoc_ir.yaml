        num: '6.21'
        ord: 176
        heading: null
        text: もし製造装置が１種類の中間体・原薬を製造する専用装置であり、かつ、当該中間 体・原薬のロット番号が追跡可能な連続した番号である場合、装置に係る個々の記 録を作成する必要はない。なお、専用装置を用いる場合、清掃、保守及び使用に係 る記録は、ロット記録の一部とする場合又はロット記録とは別に保存する場合があ る。
