          locator: line:775
        - source_label: PMDA API GMP guideline
          locator: line:776
        - source_label: PMDA API GMP guideline
          locator: line:777
        children: []
      - nid: cha6.sec6_1.p6_11
        kind: paragraph
        kind_raw: '6.11'
        num: '6.11'
        ord: 166
        heading: null
        text: 全ての文書の発行、改訂、廃止及び回収は、改訂に係る履歴を保存することにより 管理すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:780
        - source_label: PMDA API GMP guideline
          locator: line:781
        children: []
      - nid: cha6.sec6_1.p6_12
        kind: paragraph
        kind_raw: '6.12'
        num: '6.12'
        ord: 167
        heading: null
        text: 全ての適切な文書を保存するために、手順を設定すること。該当する文書としては、 例えば、開発経緯に係る記録、スケールアップに係る報告書、技術移転に係る報告 書、プロセスバリデーションに係る報告書、教育訓練記録、製造記録、試験記録、 出納記録等がある。これらの文書の保管期間は規定されていること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:784
        - source_label: PMDA API GMP guideline
          locator: line:785
        - source_label: PMDA API GMP guideline
          locator: line:786
        - source_label: PMDA API GMP guideline
          locator: line:787
        children: []
      - nid: cha6.sec6_1.p6_13
        kind: paragraph
        kind_raw: '6.13'
        num: '6.13'
        ord: 168
        heading: null
        text: 全ての製造記録、試験記録、出納記録を、該当するロットの使用期限が過ぎた後少 なくとも１年以上保存すること。リテスト日を設定している原薬については、これ らの記録を、該当するロットの出荷が完全に終了した後少なくとも３年以上保存す ること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:790
        - source_label: PMDA API GMP guideline
          locator: line:791
        - source_label: PMDA API GMP guideline
          locator: line:792
        - source_label: PMDA API GMP guideline
          locator: line:793
        children: []
      - nid: cha6.sec6_1.p6_14
        kind: paragraph
        kind_raw: '6.14'
        num: '6.14'
        ord: 169
        heading: null
        text: 記録事項を記入する場合には、操作実施直後に、定められた欄に、消去できない方 法で記入し、記入者名を明記すること。記入事項の修正の場合は、日付を入れ、署 名し、また、修正前の記載事項も読めるようにしておくこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:796
        - source_label: PMDA API GMP guideline
          locator: line:797
        - source_label: PMDA API GMP guideline
          locator: line:798
        children: []
      - nid: cha6.sec6_1.p6_15
        kind: paragraph
        kind_raw: '6.15'
        num: '6.15'
        ord: 170
        heading: null
        text: 記録又はそのコピーは、その保管期間中には、記載された事項が実施された施設に おいて容易に取りだせること。なお、当該施設以外の保存場所から電子的又はその 他の手段によってすぐに当該施設に取り寄せることができる場合には、これによる ことも差し支えない。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:801
        - source_label: PMDA API GMP guideline
          locator: line:802
        - source_label: PMDA API GMP guideline
          locator: line:803
        - source_label: PMDA API GMP guideline
          locator: line:804
        children: []
      - nid: cha6.sec6_1.p6_16
        kind: paragraph
        kind_raw: '6.16'
        num: '6.16'
        ord: 171
        heading: null
        text: 規格、指図、手順及び記録については、原本として保管する場合又は原本コピー（例 えば、フォトコピー、マイクロフィルム、マイクロフィッシュその他原本の記録の 正確な複写物）を保存する場合がある。マイクロフィルムあるいは電子記録のよう な縮小技術を使用する場合、必要な情報の取り出し及びハードコピーが容易にでき ること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:805
        - source_label: PMDA API GMP guideline
          locator: line:806
        - source_label: PMDA API GMP guideline
          locator: line:807
        - source_label: PMDA API GMP guideline
          locator: line:808
        - source_label: PMDA API GMP guideline
          locator: line:809
        children: []
      - nid: cha6.sec6_1.p6_17
        kind: paragraph
        kind_raw: '6.17'
        num: '6.17'
        ord: 172
        heading: null
        text: 原料、中間体（必要な場合）、原薬、表示材料及び包装材料に係る規格を設定し、 文書化すること。さらに、助剤、ガスケット、中間体・原薬の製造に使用されるそ の他の資材で品質に重大な影響を及ぼすおそれがあり、規格が必要である場合には、 当該資材について規格を設定すること。また、工程内管理のため、その判定基準を 設定し、文書化すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
