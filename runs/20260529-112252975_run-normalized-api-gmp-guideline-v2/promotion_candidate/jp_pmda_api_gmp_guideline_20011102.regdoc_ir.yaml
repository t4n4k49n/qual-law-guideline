        kind: paragraph
        kind_raw: '3.21'
        num: '3.21'
        ord: 87
        heading: null
        text: 従業員は、従事する生産作業に適した清潔な衣服を着用し、必要な場合には、交換 すること。また、中間体・原薬の汚染を防止するため、必要に応じて、頭、顔、手 及び腕にカバーその他の保護具を着用すること。
        role: normative
        normativity: must
        tags: []
