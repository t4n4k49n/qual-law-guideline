      - nid: cha10.sec10_2.p10_20
        kind: paragraph
        kind_raw: '10.20'
        num: '10.20'
        ord: 288
        heading: null
        text: 原薬・中間体は品質部門による出荷承認後のみ第三者への流通用に出荷すること。 なお、品質部門により許可を受け、適切な管理及び記録を備えている時には、区分 保管中の原薬・中間体を、自社の管理下にある他の部門に移動させる場合がある。
