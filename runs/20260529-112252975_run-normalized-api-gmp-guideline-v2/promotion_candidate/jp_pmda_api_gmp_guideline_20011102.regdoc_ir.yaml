      - nid: cha8.sec8_4.p8_40
        kind: paragraph
        kind_raw: '8.40'
        num: '8.40'
        ord: 246
        heading: null
        text: 本ガイドラインの目的により、混合は、均質な中間体・原薬を製造するために同一 規格内の中間体・原薬を混合する工程と定義する。単一ロットからの分画物（例え ば、単一の結晶化ロットを複数に分けて遠心分離を行った場合の遠心分離物を集め たもの）、又は、以降の工程のために複数のバッチの分画物を工程内で混ぜること は、製造工程の一部と考えられ、混合とは考えない。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
