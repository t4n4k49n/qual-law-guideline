      - nid: cha18.sec18_4.p18_40
        kind: paragraph
        kind_raw: '18.40'
        num: '18.40'
        ord: 471
        heading: null
        text: 細胞又は細胞組成物を除去する、又は、細胞破壊後の細胞組成物を採集するハー ベスト工程は、汚染のリスクを最小限にするために、設計した装置及び区域で行う こと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
