      - nid: cha14.sec14_3.p14_31
        kind: paragraph
        kind_raw: '14.31'
        num: '14.31'
        ord: 394
        heading: null
        text: 再処理したロットについては、再処理製品が本来の工程で製造されるものと同等 の品質を有することを示すために、適切に評価し、試験し、安定性を保証する場合 は安定性試験を行い、記録すること。コンカレントバリデーションは、しばしば再 処理手順に関する適切なバリデーション手法となる。これにより、実施計画書に再 処理手順、実施方法及び予測結果を定義することが可能になる。再処理するロット が１ロットのみの場合、再処理をまず行い、その後、報告書を作成し、当該ロット が問題ないことが判明した後出荷を行う場合がある。
        role: normative
        normativity: must
        tags: []
