        kind: paragraph
        kind_raw: '11.19'
        num: '11.19'
        ord: 304
        heading: null
        text: 二次標準品については、適切に調製し、確認し、試験を行い、承認し、及び保管 すること。二次標準品のロットごとの適合性は、初回使用前に一次標準品と比較す ることにより判定すること。二次標準品はロットごとに、文書化した方法に従って、 定期的に再認定すること。
