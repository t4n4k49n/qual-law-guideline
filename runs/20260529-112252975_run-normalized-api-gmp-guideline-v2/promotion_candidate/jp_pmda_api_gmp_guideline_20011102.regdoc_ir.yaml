          locator: line:548
        - source_label: PMDA API GMP guideline
          locator: line:549
        - source_label: PMDA API GMP guideline
          locator: line:550
        children: []
      - nid: cha4.sec4_3.p4_33
        kind: paragraph
        kind_raw: '4.33'
        num: '4.33'
        ord: 113
        heading: null
        text: 製造業者が、工程で使用する水に対して、水質を確保するために処理を行う場合に は、その処理工程を検証し、適切な管理値によりモニターを行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
