          locator: line:1425
        - source_label: PMDA API GMP guideline
          locator: line:1426
        children: []
      - nid: cha11.sec11_1.p11_15
        kind: paragraph
        kind_raw: '11.15'
        num: '11.15'
        ord: 300
        heading: null
        text: 全ての規格外試験結果の値について、手順に従って調査し、記録すること。この手 順には、データの分析、重要な問題の有無の評価、是正措置の作業分担及び結論が 含まれること。規格外試験結果の値が得られた後の検体の再採取や再試験は、文書 による手順にしたがって実施すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1429
        - source_label: PMDA API GMP guideline
          locator: line:1430
        - source_label: PMDA API GMP guideline
          locator: line:1431
        - source_label: PMDA API GMP guideline
          locator: line:1432
        children: []
