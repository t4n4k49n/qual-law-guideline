      - nid: cha11.sec11_1.p11_17
        kind: paragraph
        kind_raw: '11.17'
        num: '11.17'
        ord: 302
        heading: null
        text: 一次標準品を原薬の製造用に適切に入手すること。各々の一次標準品の入手先を 記録すること。供給者の勧告に基づき、各々の一次標準品の保管及び使用記録を保 存すること。公式に認定を受けた供給元から入手した一次標準品は、当該標準品が 供給者の勧告と一致する条件で保管される場合には、通常、試験を行わずに使用に 供する。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
