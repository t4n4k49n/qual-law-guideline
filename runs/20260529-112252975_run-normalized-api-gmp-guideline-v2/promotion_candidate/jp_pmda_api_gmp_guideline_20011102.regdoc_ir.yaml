      - nid: cha4.sec4_4.p4_41
        kind: paragraph
        kind_raw: '4.41'
        num: '4.41'
        ord: 117
        heading: null
        text: 例えばある種のステロイド類や細胞毒性のある抗がん剤のように感染性、強い薬理 作用又は毒性を有する物質が関与する場合には、検証された不活化工程及び清掃手 順又はそのいずれかを確立し、保守しない限り、専用の製造区域の使用を考慮する こと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
