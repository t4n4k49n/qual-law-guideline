        kind: paragraph
        kind_raw: '7.42'
        num: '7.42'
        ord: 219
        heading: null
        text: 原材料等は、品質が確保される条件・期間で保管し、最も古いものから順次使用さ れるように、適切に管理すること。
        role: normative
        normativity: must
