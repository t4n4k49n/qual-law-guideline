        kind: paragraph
        kind_raw: '9.46'
        num: '9.46'
        ord: 282
        heading: null
        text: 製造業者の管理外へ輸送する中間体・原薬の容器は、封緘が破れた、又は、失われ た場合、内容物が変っているおそれがあることを受取人に警告するような方法で封 緘すること。
        role: normative
        normativity: must
        tags: []
