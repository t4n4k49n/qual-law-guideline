        num: '4.40'
        ord: 116
        heading: null
        text: 例えばペニシリン類やセファロスポリン類のように強い感作性を有する物質を製 造する場合には、設備、空気処理装置及び工程装置を含め、専用の製造区域を用い ること。
        role: normative
        normativity: must
        tags: []
