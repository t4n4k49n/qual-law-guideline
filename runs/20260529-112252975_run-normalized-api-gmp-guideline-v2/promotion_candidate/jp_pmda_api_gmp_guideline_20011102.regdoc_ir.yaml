        kind: paragraph
        kind_raw: '11.16'
        num: '11.16'
        ord: 301
        heading: null
        text: 試薬及び標準品は、文書化された手順にしたがって、調製され、表示されること。 使用期限の日付は、分析試薬及び標準溶媒からみて適切に設定されること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
