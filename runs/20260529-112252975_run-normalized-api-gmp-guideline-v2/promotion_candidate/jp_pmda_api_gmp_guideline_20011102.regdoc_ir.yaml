        kind: paragraph
        kind_raw: '7.41'
        num: '7.41'
        ord: 218
        heading: null
        text: 原材料等が保管されているファイバードラム、バッグ又は箱は、直接床の上に置か ないこと。清掃や検査を行うため、必要な場合には、適切な間隔をあけて置くこと。
        role: normative
        normativity: must
        tags: []
