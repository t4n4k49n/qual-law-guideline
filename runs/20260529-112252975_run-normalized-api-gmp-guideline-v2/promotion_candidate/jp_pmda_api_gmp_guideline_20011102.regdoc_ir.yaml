    - nid: cha1.sec1_2
      kind: section
      kind_raw: '1.2'
      num: '1.2'
      ord: 3
      heading: 法規制の適用
      text: ある物質を製造したり、医薬品製剤に使用したりする場合であって、各国法令において、当該物 質が原薬として分類される場合には、本ガイドラインに従って生産すること。
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:188
      - source_label: PMDA API GMP guideline
        locator: line:191
      - source_label: PMDA API GMP guideline
        locator: line:192
      children: []
    - nid: cha1.sec1_3
      kind: section
      kind_raw: '1.3'
      num: '1.3'
      ord: 4
      heading: 適用範囲
      text: '本ガイドラインは、ヒト用医薬品に使用する原薬に適用する。ただし、無菌原薬の生産について は、滅菌工程の直前までの工程を対象とする。なお、無菌原薬の滅菌工程及び無菌工程につい ては、本ガイドラインの対象としないが、別途、ＧＭＰ規則等関連する規定に基づき、実施するこ と。


        本ガイドラインは、化学的合成、抽出、細胞培養・発酵、天然資源からの回収又はこれらの組み 合わせにより生産される原薬を対象とする。細胞培養・発酵によって生産される原薬に特有の規定 については、第18章に記述する。


        本ガイドラインでは、全てのワクチン、全細胞、全血及び血漿、血液及び血漿から誘導される原 薬(血漿分画物)並びに遺伝子治療用原薬は適用を除外する。ただし、血液及び血漿を原料として 製造される原薬は本ガイドラインの対象である。細胞基材(哺乳動物、植物、昆虫又は微生物の細 胞、組織もしくはトランスジェニック動物を含む動物由来物)及び初期段階の工程は、ＧＭＰの対象 とはなり得るが、本ガイドラインの対象ではないことに留意されたい。さらに、本ガイドラインは医療 用ガス及びバルク包装製剤並びに放射性医薬品に特有な製造・管理には適用しない。


        第19章には、治験薬に使用される原薬の生産のみに適用するガイドラインを示す。


        「原薬出発物質」とは、原薬の製造に使用され、かつ、原薬の構造中の重要な構成部分として組 込まれる原料、中間体又は原薬であり、市販品の場合、委託又は販売契約の下で供給者から購 入する場合又は自社で製造する場合がある。原薬出発物質は、通常、化学的性質及び構造が明 確にされている。


        企業は原薬製造の開始時点の根拠を規定し、文書化すること。化学的合成においては、その開 始時点は、｢原薬出発物質｣を工程に導入する段階である。その他の生産形態(例えば、発酵、抽 出、精製等)については、その根拠はケースバイケースで決定すること。一般的な開始時点につい て、表１にガイドラインを示す。


        上述の開始時点から、中間体・原薬の生産に対して、本ガイドラインで規定された適切なＧＭＰを 適用すること。ＧＭＰには、原薬の品質に影響すると判断される重要工程のバリデーションが含ま れる。ただし、企業がある工程に対しバリデーションを実施しても、必ずしも当該工程が重要工程で あると定義されるものではないことに留意すること。


        本ガイドラインは、一般的には、表１の灰色で示す工程に適用される。なお、これは、表１に示さ れた工程全ての実施が必要であることを意味するものではない。原薬の生産に関するＧＭＰは、初 期の製造段階から最終段階、精製及び包装に向け工程が進行するに従って、より厳密に実施する こと。造粒、コーティング等の物理的処理又は粒径の物理的な細分化(例えば、粉砕、微粉化)は、 少なくとも、本ガイドラインの基準に従い、実施すること。


        本ＧＭＰガイドラインは、規定された「原薬出発物質」の導入より前の段階には適用されない。'
