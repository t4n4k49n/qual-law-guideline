        children: []
      - nid: cha5.sec5_1.p5_15
        kind: paragraph
        kind_raw: '5.15'
        num: '5.15'
        ord: 135
        heading: null
        text: 必要な場合には、閉鎖系装置又は囲い込み装置を使用すること。開放系装置を使用 する場合、又は装置が開放されている場合には、汚染のおそれを最小限にするため の適切な予防措置を講じること。
        role: normative
        normativity: must
        tags: []
