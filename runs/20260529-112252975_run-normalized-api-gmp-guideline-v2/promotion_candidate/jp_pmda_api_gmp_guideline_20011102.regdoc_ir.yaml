        kind_raw: '7.35'
        num: '7.35'
        ord: 215
        heading: null
        text: 検体採取の対象となった容器を開封する際には、注意して開け、すぐに閉めること。 また、当該容器には、検体を採取したことを明記すること。
        role: normative
