    - nid: cha1.sec1_1
      kind: section
      kind_raw: '1.1'
      num: '1.1'
      ord: 2
      heading: 目的
      text: '本ガイドラインは、医薬品の有効成分(原薬：API)に係る「医薬品の製造管理及び品質管理に関 する基準」（以下「ＧＭＰ規則」という。）において求められる、適切な品質マネージメント体制のもと での原薬生産について、その標準的なあり方を示すことにより、原薬が品質及び純度の要件に適 合することを保証する一助となることを目的としたものである。


        本ガイドラインで「生産」とは、原薬の原材料等の受入、製造、包装、再包装、表示、再表示、品 質管理、出荷、保管・流通及びその他関連する管理に係る作業の全てを含むものと定義する。本 ガイドラインで「すること」とは、本ガイドラインの適用が不可能である場合、又は少なくとも同等レベ ルの品質を保証できると実証された代替手法が存在する場合でない限り、本ガイドラインの適用を 期待する勧告であることを意味する。


        本ガイドラインは、生産従事者の安全面及び環境保護の面については対象としていない。これら の管理は、本来、各業者の責任であり、また、関連する他の法律で律せられるものである。


        本ガイドラインは、各国法令に基づく承認申請事項を定義したり、各国の薬局方の要求事項を変 更したりするものではない。また、本ガイドラインは、原薬の承認申請に係る要求事項を設定する規 制当局の権限に影響を与えるものではない。製造・輸入の承認・許可要件、承認書、許可書等に 定められた事項等各国法令に基づき別に定められる各規定は全て満たされる必要がある。'
      role: structural
      normativity: null
      tags: []
