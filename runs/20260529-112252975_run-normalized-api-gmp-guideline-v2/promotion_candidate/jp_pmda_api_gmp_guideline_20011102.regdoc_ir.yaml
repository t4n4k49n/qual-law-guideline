          locator: line:1189
        - source_label: PMDA API GMP guideline
          locator: line:1190
        - source_label: PMDA API GMP guideline
          locator: line:1191
        children: []
      - nid: cha8.sec8_3.p8_36
        kind: paragraph
        kind_raw: '8.36'
        num: '8.36'
        ord: 244
        heading: null
        text: 通常は、工程のモニター又は調整の目的で行う工程内試験において、規格外試験結 果に係る調査を行う必要はない。
        role: normative
        normativity: must
        tags: []
