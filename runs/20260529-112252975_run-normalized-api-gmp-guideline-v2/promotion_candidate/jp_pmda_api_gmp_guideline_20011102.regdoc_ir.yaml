      - nid: cha4.sec4_4.p4_42
        kind: paragraph
        kind_raw: '4.42'
        num: '4.42'
        ord: 118
        heading: null
        text: ある専用区域から別の専用区域へ移動する従業員、原材料等による交叉汚染を防止 するため、適切な対策を確立し、実施すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
