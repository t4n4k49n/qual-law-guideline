        kind: paragraph
        kind_raw: '18.38'
        num: '18.38'
        ord: 469
        heading: null
        text: 共用装置(多品種製造)では、交叉汚染のリスクを最小限にするために、製品の一 連の期間製造（キャンペーン製造）の間に、適切に、清掃後の追加試験が要求され ることがある。
        role: normative
        normativity: must
        tags: []
