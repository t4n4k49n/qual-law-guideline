        - source_label: PMDA API GMP guideline
          locator: line:1052
        - source_label: PMDA API GMP guideline
          locator: line:1053
        - source_label: PMDA API GMP guideline
          locator: line:1054
        - source_label: PMDA API GMP guideline
          locator: line:1055
        children: []
      - nid: cha7.sec7_3.p7_33
        kind: paragraph
        kind_raw: '7.33'
        num: '7.33'
        ord: 213
        heading: null
        text: 検体はそのロットを代表するものであること。検体採取方法では、採取の対象容器 の数、対象容器中の採取部位、各容器からの検体採取量を決めておくこと。採取対 象の容器の数と検体採取量は、原材料等の重要度、原材料等の品質のばらつき、供 給業者の過去の品質履歴、試験に必要な量等を考慮した検体採取計画に従うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1058
        - source_label: PMDA API GMP guideline
          locator: line:1059
        - source_label: PMDA API GMP guideline
          locator: line:1060
        - source_label: PMDA API GMP guideline
          locator: line:1061
        children: []
      - nid: cha7.sec7_3.p7_34
        kind: paragraph
        kind_raw: '7.34'
        num: '7.34'
        ord: 214
        heading: null
        text: 検体採取は、定められた場所で、検体採取した原材料等の汚染及び他の原材料等の 汚染を防止するような手順で行うこと。
