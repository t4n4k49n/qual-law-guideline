          locator: line:1343
        - source_label: PMDA API GMP guideline
          locator: line:1344
        - source_label: PMDA API GMP guideline
          locator: line:1345
        children: []
      - nid: cha9.sec9_4.p9_45
        kind: paragraph
        kind_raw: '9.45'
        num: '9.45'
        ord: 281
        heading: null
        text: 包装・表示済みの中間体・原薬を検査して、そのロットの容器及び包装が正しく表 示されていることを保証すること。この検査は包装作業の一部として行うこと。こ の検査結果はロット製造指図・記録又は管理記録に記録すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1348
        - source_label: PMDA API GMP guideline
          locator: line:1349
        - source_label: PMDA API GMP guideline
          locator: line:1350
        children: []
