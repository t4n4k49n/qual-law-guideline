          locator: line:1031
        - source_label: PMDA API GMP guideline
          locator: line:1032
        - source_label: PMDA API GMP guideline
          locator: line:1033
        children: []
    - nid: cha7.sec7_3
      kind: section
      kind_raw: '7.3'
      num: '7.3'
      ord: 209
      heading: 新たに入荷した製造原材料等の検体採取及び試験
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
