        kind: paragraph
        kind_raw: '3.23'
        num: '3.23'
        ord: 89
        heading: null
        text: 喫煙、飲食、ガムを噛むこと及び食品の貯蔵は、作業区域から隔離した指定された 区域に限定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
