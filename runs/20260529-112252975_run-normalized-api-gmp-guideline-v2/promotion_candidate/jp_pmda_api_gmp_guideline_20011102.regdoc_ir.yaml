        heading: null
        text: 再包装業者・再加工業者、代理店又は仲介業者が独自に試験成績書を発行する場 合には、当該試験成績書には、分析を行った試験室の名称、住所及び電話番号を記 載すること。また、参考として、製造業者の名称及び住所を記載するとともに、元 のロットの試験成績書の複写を添付すること。
