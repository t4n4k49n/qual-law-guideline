        text: 全ての規格、検体採取計画及び試験方法は、原材料、中間体、原薬、ラベル及び 包装材料が設定した品質及び純度の基準に適合することを保証するために、科学的 であり、かつ、適切なものであること。規格及び試験方法は、承認申請の内容と一 致すること。ただし、承認申請の内容以外に、さらに規格を追加する場合がある。 全ての規格、検体採取計画及び試験方法は、それらの変更を含めて、適切な部署が 起案し、品質部門が照査し、承認すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1409
        - source_label: PMDA API GMP guideline
          locator: line:1410
        - source_label: PMDA API GMP guideline
          locator: line:1411
        - source_label: PMDA API GMP guideline
          locator: line:1412
        - source_label: PMDA API GMP guideline
          locator: line:1413
        - source_label: PMDA API GMP guideline
          locator: line:1414
        children: []
      - nid: cha11.sec11_1.p11_13
        kind: paragraph
        kind_raw: '11.13'
        num: '11.13'
        ord: 298
        heading: null
        text: 原薬に関する規格は、承認された基準に従って設定し、製造工程と整合化してい ること。規格には、不純物(例えば、有機不純物、無機不純物及び残留溶媒)の管理 に係る項目を含めること。なお、微生物学的純度の規格が定められている場合には、 生菌数及び特定微生物の適切な管理値を設定し、適合させること。また、エンドト キシンに関する規格が定められている場合には、適切な管理値を設定し、適合させ ること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
