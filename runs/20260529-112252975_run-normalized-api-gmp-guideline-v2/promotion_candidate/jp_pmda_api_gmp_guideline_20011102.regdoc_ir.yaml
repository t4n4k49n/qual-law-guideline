          locator: line:2257
        - source_label: PMDA API GMP guideline
          locator: line:2258
        - source_label: PMDA API GMP guideline
          locator: line:2259
        children: []
      - nid: cha18.sec18_4.p18_41
        kind: paragraph
        kind_raw: '18.41'
        num: '18.41'
        ord: 472
        heading: null
        text: 製造に用いた生物体、細胞残渣及び培地成分を除去又は不活化するハーベスト及 び精製の手順は、分解、汚染及び品質の低下を最小限にしながら、中間体・原薬を 一定した品質で得ることを保証するために適切なものとすること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2262
        - source_label: PMDA API GMP guideline
          locator: line:2263
        - source_label: PMDA API GMP guideline
          locator: line:2264
        children: []
      - nid: cha18.sec18_4.p18_42
        kind: paragraph
        kind_raw: '18.42'
        num: '18.42'
        ord: 473
        heading: null
        text: 全ての装置は、使用後適切に清掃するとともに、適切な場合には消毒を行うこと。 なお、中間体・原薬の品質が低下しない場合には、清掃なしで多数の連続ロットの 製造に利用する場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
