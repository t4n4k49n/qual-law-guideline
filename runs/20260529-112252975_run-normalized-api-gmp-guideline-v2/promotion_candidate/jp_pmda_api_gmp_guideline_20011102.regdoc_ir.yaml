      - nid: cha18.sec18_2.p18_20
        kind: paragraph
        kind_raw: '18.20'
        num: '18.20'
        ord: 455
        heading: null
        text: 細胞バンクの取扱いは許可を受けた担当者に限定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2189
        children: []
      - nid: cha18.sec18_2.p18_21
        kind: paragraph
        kind_raw: '18.21'
        num: '18.21'
        ord: 456
        heading: null
        text: 細胞バンクは、生存率を維持し、汚染を防止するように設計した保管条件で維持 管理すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2192
        - source_label: PMDA API GMP guideline
          locator: line:2193
        children: []
      - nid: cha18.sec18_2.p18_22
        kind: paragraph
        kind_raw: '18.22'
        num: '18.22'
        ord: 457
        heading: null
        text: 細胞バンクからのバイアルの使用及び保管条件についての記録を保管すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2194
        children: []
      - nid: cha18.sec18_2.p18_23
        kind: paragraph
        kind_raw: '18.23'
        num: '18.23'
        ord: 458
        heading: null
        text: 必要な場合には、細胞バンクは使用適合性を判定するために定期的にモニターす ること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2197
        - source_label: PMDA API GMP guideline
          locator: line:2198
        children: []
      - nid: cha18.sec18_2.p18_24
        kind: paragraph
        kind_raw: '18.24'
        num: '18.24'
        ord: 459
        heading: null
        text: 細胞バンクに係る詳細については、ＩＣＨＱ５Ｄガイドライン「生物薬品（バイ オテクノロジー応用医薬品／生物起源由来医薬品）製造用細胞基剤の由来、調製及 び特性解析」を参照のこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2201
        - source_label: PMDA API GMP guideline
          locator: line:2202
        - source_label: PMDA API GMP guideline
          locator: line:2203
        children: []
    - nid: cha18.sec18_3
      kind: section
      kind_raw: '18.3'
      num: '18.3'
      ord: 460
      heading: 細胞培養・発酵
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:2206
      children:
      - nid: cha18.sec18_3.p18_30
        kind: paragraph
        kind_raw: '18.30'
        num: '18.30'
        ord: 461
        heading: null
        text: 細胞基材、培地、緩衝液及び気体の無菌的な添加が必要な場合、可能であれば、 閉鎖系又は封じ込めシステムを使用すること。最初の容器への接種やその後の移送 又は添加(培地、緩衝液)を開放容器で行う場合には、汚染のリスクを最小限にする ための管理及び手順を備えること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2209
        - source_label: PMDA API GMP guideline
          locator: line:2210
        - source_label: PMDA API GMP guideline
          locator: line:2211
        - source_label: PMDA API GMP guideline
          locator: line:2212
        children: []
      - nid: cha18.sec18_3.p18_31
        kind: paragraph
        kind_raw: '18.31'
        num: '18.31'
        ord: 462
        heading: null
        text: 微生物汚染により原薬の品質が影響を受けるおそれがある場合には、開放容器を 使用する作業は、バイオセイフティ・キャビネット又はこれと同様に管理された環 境のもとで行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2215
        - source_label: PMDA API GMP guideline
          locator: line:2216
        - source_label: PMDA API GMP guideline
          locator: line:2217
        children: []
      - nid: cha18.sec18_3.p18_32
        kind: paragraph
        kind_raw: '18.32'
        num: '18.32'
        ord: 463
        heading: null
        text: 作業者は適切に着衣を着用し、培養工程を取扱う上で、特別な注意を払うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2220
        children: []
      - nid: cha18.sec18_3.p18_33
        kind: paragraph
        kind_raw: '18.33'
        num: '18.33'
        ord: 464
        heading: null
        text: 重要な運転パラメータ、例えば、温度、ｐＨ、攪拌速度、気体の添加、圧力等は、 設定した工程との一致を保証するためにモニターすること。また、細胞増殖、生存 率(ほとんどの細胞培養工程について)、さらに、必要な場合には生産性もモニター すること。重要なパラメータは、工程ごとに変動するものであるが、また、クラシ カル発酵については、ある種のパラメータ(例えば細胞生存率)はモニターする必要 はない。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2223
        - source_label: PMDA API GMP guideline
          locator: line:2224
        - source_label: PMDA API GMP guideline
          locator: line:2225
        - source_label: PMDA API GMP guideline
          locator: line:2226
        - source_label: PMDA API GMP guideline
          locator: line:2227
        - source_label: PMDA API GMP guideline
          locator: line:2228
        children: []
      - nid: cha18.sec18_3.p18_34
        kind: paragraph
        kind_raw: '18.34'
        num: '18.34'
        ord: 465
        heading: null
        text: 細胞培養装置は、使用後に、清掃し、滅菌すること。また、発酵装置は、必要な 場合には、清掃するとともに、衛生的な状態にするか、又は滅菌を行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2231
        - source_label: PMDA API GMP guideline
          locator: line:2232
        children: []
      - nid: cha18.sec18_3.p18_35
        kind: paragraph
        kind_raw: '18.35'
        num: '18.35'
        ord: 466
        heading: null
        text: 培養培地は原薬の品質を保護するために適切な場合には使用前に滅菌すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2235
        children: []
      - nid: cha18.sec18_3.p18_36
        kind: paragraph
        kind_raw: '18.36'
        num: '18.36'
        ord: 467
        heading: null
        text: 汚染を検出し、取るべき措置の方針を決定するために適切な手順を備えること。 当該手順には、製品に対する汚染の影響を判定するための手順及び装置から汚染を 除去し次のロットに使用する条件に戻すための手順が含まれること。発酵工程の間 に観察された混入微生物について適切に識別を行い、必要ならばそれらの存在が製 品の品質へ及ぼす影響を評価すること。当該評価の結果は生成物の処置の際に考慮 すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2238
        - source_label: PMDA API GMP guideline
          locator: line:2239
        - source_label: PMDA API GMP guideline
          locator: line:2240
        - source_label: PMDA API GMP guideline
          locator: line:2241
        - source_label: PMDA API GMP guideline
          locator: line:2242
        - source_label: PMDA API GMP guideline
          locator: line:2243
        children: []
      - nid: cha18.sec18_3.p18_37
        kind: paragraph
        kind_raw: '18.37'
        num: '18.37'
        ord: 468
        heading: null
        text: 汚染事実の記録は保管すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
