      - nid: cha19.sec19_1.p19_11
        kind: paragraph
        kind_raw: '19.11'
        num: '19.11'
        ord: 484
        heading: null
        text: 臨床試験用に用いる原薬の製造過程で実施する管理は、当該原薬を配合する製剤 の開発段階と整合性を持たせること。工程についての知見が蓄積され、製剤の試験 が前臨床段階から臨床段階に進むに従い、工程及び試験手順は、変更に備えて、柔 軟性を持たせること。開発が臨床試験を目的とする製剤用の製造段階に入った場合、 製造業者は、原薬の品質を保証する適切な製造管理手順を用い、適正な設備で製造 していることを保証すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
