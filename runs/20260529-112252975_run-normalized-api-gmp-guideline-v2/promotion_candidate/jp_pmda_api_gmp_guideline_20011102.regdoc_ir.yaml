          locator: line:1224
        - source_label: PMDA API GMP guideline
          locator: line:1225
        children: []
      - nid: cha8.sec8_4.p8_45
        kind: paragraph
        kind_raw: '8.45'
        num: '8.45'
        ord: 251
        heading: null
        text: 原薬の物理特性が重要な場合（例えば、固形の経口投与形態又は懸濁剤への使用を 目的とする原薬）には、配合ロットの均質性を示すために混合作業のバリデーショ ンを実施すること。バリデーションには、混合工程によって影響を受ける重要な特 性(例えば、粒度分布、かさ密度、タップ密度)の試験を含めること。
        role: normative
        normativity: must
        tags: []
