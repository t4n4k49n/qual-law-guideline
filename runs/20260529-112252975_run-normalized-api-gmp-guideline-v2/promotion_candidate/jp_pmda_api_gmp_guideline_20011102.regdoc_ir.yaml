        - nid: cha12.sec12_4.p12_44.i4
          kind: item
          kind_raw: (4)
          num: '4'
          ord: 355
          heading: null
          text: 既存の原薬についての不純物プロファイルが確立していること
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
