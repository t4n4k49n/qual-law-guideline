        kind: paragraph
        kind_raw: '7.12'
        num: '7.12'
        ord: 200
        heading: null
        text: 原材料等は、合意した規格に基づき、品質部門によって承認された供給業者から購 入すること。
        role: normative
        normativity: must
        tags: []
