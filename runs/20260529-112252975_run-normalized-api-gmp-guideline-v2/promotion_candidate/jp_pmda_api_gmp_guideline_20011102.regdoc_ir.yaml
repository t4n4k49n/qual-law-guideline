          locator: line:435
        - source_label: PMDA API GMP guideline
          locator: line:436
        children: []
      - nid: cha3.sec3_2.p3_24
        kind: paragraph
        kind_raw: '3.24'
        num: '3.24'
        ord: 90
        heading: null
        text: 従業員が原薬の品質の信頼性を低下させるおそれのある健康状態（感染性の疾患に 罹患している場合又は露出した体表面に裂傷がある場合）にある場合は、作業に従 事しないこと。また、診療又は監督者の観察により、明らかな疾患又は裂傷を有す ることが認められた者には、当該疾患又は裂傷が原薬の品質に悪影響を与えるおそ れがある場合には、その状態が回復するか、あるいは認定を受けた医療責任者が、 作業に従事しても原薬の安全性又は品質を損なわないことを判定するまで、作業に 従事させないこと。
        role: normative
        normativity: must
        tags: []
        refs:
