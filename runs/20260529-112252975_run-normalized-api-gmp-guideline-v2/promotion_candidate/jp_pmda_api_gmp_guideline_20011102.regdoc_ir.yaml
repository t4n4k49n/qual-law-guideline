        heading: null
        text: 不純物プロファイルは、原料、装置運転パラメータ又は製造工程の変更によって 生ずる原薬の変化を検出するために、当局へ提出した不純物プロファイルと適切な 間隔で比較するか、あるいは、過去のデータと比較すること。
