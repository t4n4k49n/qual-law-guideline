        kind: paragraph
        kind_raw: '10.23'
        num: '10.23'
        ord: 291
        heading: null
        text: 製造業者は、原薬・中間体の輸送業者が適切な輸送条件及び保管条件を承知し、 従うことを保証すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
