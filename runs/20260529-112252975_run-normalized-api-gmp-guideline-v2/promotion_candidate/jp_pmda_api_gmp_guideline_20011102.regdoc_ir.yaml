        - source_label: PMDA API GMP guideline
          locator: line:429
        children: []
      - nid: cha3.sec3_2.p3_22
        kind: paragraph
        kind_raw: '3.22'
        num: '3.22'
        ord: 88
        heading: null
        text: 従業員は、中間体・原薬への直接の接触を避けること。
        role: normative
        normativity: must
        tags: []
