        ord: 350
        heading: null
        text: コンカレントバリデーション（実生産に合わせて同時的に行われるバリデーショ ン）は、繰返しの製造運転のデータが以下の理由により利用できない時に実施する 場合がある；限られた原薬ロット数のみを製造する場合；原薬ロットを稀にしか製 造しない場合；又は原薬ロットを、バリデーション済みの工程を改良して製造する 場合。なお、コンカレントバリデーションの完了の前に、原薬ロットの詳細なモニ タリング及び試験に基づいて、当該ロットを出荷し、市販用の最終製剤に使用する 場合がある。
