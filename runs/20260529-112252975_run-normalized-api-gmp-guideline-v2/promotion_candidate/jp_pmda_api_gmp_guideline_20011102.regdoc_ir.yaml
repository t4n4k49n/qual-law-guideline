        kind_raw: '11.18'
        num: '11.18'
        ord: 303
        heading: null
        text: 「自家製一 一次標準品が公式に認定を受けた供給元から入手できない場合には、 次標準品」を設定すること。一次標準品の同一性及び純度を完全に確立するために 適切な試験を実施すること。この試験の適切な記録を保存すること。
        role: normative
        normativity: must
