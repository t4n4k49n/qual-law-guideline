      kind_raw: '18.5'
      num: '18.5'
      ord: 476
      heading: ウイルス除去・不活化
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:2280
      children:
      - nid: cha18.sec18_5.p18_50
        kind: paragraph
        kind_raw: '18.50'
        num: '18.50'
        ord: 477
        heading: null
        text: ウイルス除去・不活化段階に係る詳細については、ＩＣＨＱ５Ａガイドライン「ヒ ト又は動物細胞株を用いて製造されるバイオテクノロジー応用医薬品のウイルス 安全性評価」を参照のこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2283
        - source_label: PMDA API GMP guideline
          locator: line:2284
        - source_label: PMDA API GMP guideline
          locator: line:2285
        children: []
      - nid: cha18.sec18_5.p18_51
        kind: paragraph
        kind_raw: '18.51'
        num: '18.51'
        ord: 478
        heading: null
        text: ウイルス除去及びウイルス不活化段階は、工程において重要な処理段階であり、 バリデーションを行ったパラメータの範囲内で実施すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2288
        - source_label: PMDA API GMP guideline
          locator: line:2289
        children: []
      - nid: cha18.sec18_5.p18_52
        kind: paragraph
        kind_raw: '18.52'
        num: '18.52'
        ord: 479
        heading: null
        text: ウイルス除去・不活化の前段階から後段階へのウイルス汚染のおそれを防止する ために適切な予防措置を講じること。そのために、開放処理は、他の処理作業を行 う区域と分離され、かつ、独立した空気処理ユニットを備えた区域で実施すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2292
        - source_label: PMDA API GMP guideline
          locator: line:2293
        - source_label: PMDA API GMP guideline
          locator: line:2294
        children: []
      - nid: cha18.sec18_5.p18_53
        kind: paragraph
        kind_raw: '18.53'
        num: '18.53'
        ord: 480
        heading: null
        text: 通常、異なる精製段階には、同じ装置は使用しない。同じ装置を使用する場合に は、当該装置は、使用の前に、適切に清掃し、消毒すること。前段階からのウイル スのキャリーオーバー(例えば、装置又は環境を通して)のおそれを防止するために 適切な予防措置を講じること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
