        - source_label: PMDA API GMP guideline
          locator: line:2251
        children: []
    - nid: cha18.sec18_4
      kind: section
      kind_raw: '18.4'
      num: '18.4'
      ord: 470
      heading: ハーベスト、分離及び精製
      text: null
      role: structural
      normativity: null
