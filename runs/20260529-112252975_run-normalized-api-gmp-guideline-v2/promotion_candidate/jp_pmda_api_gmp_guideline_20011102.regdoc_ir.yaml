        children: []
      - nid: cha11.sec11_4.p11_43
        kind: paragraph
        kind_raw: '11.43'
        num: '11.43'
        ord: 315
        heading: null
        text: 試験成績書には、品質部門の者が日付を記入し、署名するとともに、製造業者の 名称、住所及び電話番号を記載すること。分析を再包装業者又は再加工業者が行っ た場合には、試験成績書には、当該再包装業者又は再加工業者の名称、住所及び電 話番号並びに参考として製造業者の名称を記載すること。
        role: normative
        normativity: must
