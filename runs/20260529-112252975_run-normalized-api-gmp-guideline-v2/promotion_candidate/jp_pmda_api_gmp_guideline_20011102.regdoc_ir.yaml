      - nid: cha5.sec5_2.p5_21
        kind: paragraph
        kind_raw: '5.21'
        num: '5.21'
        ord: 139
        heading: null
        text: 中間体・原薬の生産に使用する装置の清掃及び当該装置の次回製造での使用許可に ついて、文書による手順を設定すること。清掃手順には、作業員が、再現性のある、 かつ、有効な方法で各種の装置を清掃できるよう十分に詳細な内容が含められてい ること。これらの手順には、次の事項が含まれること： ‑装置清掃に係る責任の割り当て； ‑清掃計画、及び、必要な場合には消毒計画； ‑装置の清掃方法（洗浄剤の希釈方法を含む）及び使用する用具、薬剤等の十分な説 明； ‑必要な場合には、適切な清掃を保証するために行う装置各部品の分解及び組立に係 る指図； ‑先行ロットの表示の除去又は抹消に関する指図； ‑使用までの間における清浄な装置の汚染防止のための指図； ‑実施可能な場合には、使用直前の清浄度に係る装置の検査； ‑必要な場合には、工程作業の完了から装置清掃までの間の許容最長時間の設定。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
