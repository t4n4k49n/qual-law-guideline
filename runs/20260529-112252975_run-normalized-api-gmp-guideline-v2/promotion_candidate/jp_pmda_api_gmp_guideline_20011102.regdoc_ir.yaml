        kind_raw: '6.40'
        num: '6.40'
        ord: 181
        heading: null
        text: ロット間の同一性を保証するため、各原薬・中間体に関して製造指図書原本を作成 すること。なお、当該製造指図書原本には、１名が日付及び署名をするとともに、 品質部門の者が独自に内容を確認し、その日付及び署名をすること。
