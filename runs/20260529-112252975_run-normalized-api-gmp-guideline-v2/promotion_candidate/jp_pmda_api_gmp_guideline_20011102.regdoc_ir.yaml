        heading: null
        text: 各中間体・原薬のためのロット製造指図・記録を作成すること。指図には、ロット ごとの製造及び管理に関する全ての情報があること。ロット製造指図・記録はそれ が正しいものであり、かつ、適切な製造指図書原本に則り明確に再製されたもので あることを保証するため、それが発行される前に確認すること。もしロット製造指 図・記録が別の原本から複写されたものである場合には、それらの資料には現在使 用している製造指図書原本を参照したことの記載があること。
        role: normative
