      kind_raw: '13.13'
      num: '13.13'
      ord: 380
      heading: null
      text: "提案された変更により起こり得る中間体・原薬の品質への影響を評価すること。 バリデーションを既に行った工程に係る変更を正当化するために必要な試験、バリ デーション及び文書化の程度を決定するために、レベル分けの手順は助けになる。 変更の性質及び程度並びにこれらの変更が工程に与える影響により変更を分類す\n                                。なお、科学的判断に基づき、\nる場合がある（例えば、小さな変更又は大きな変更） バリデーションを行った工程の変更を正当化するのに適切な追加の試験及びバリ デーションの決定を行うこと。"
      role: normative
      normativity: must
