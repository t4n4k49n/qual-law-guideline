          locator: line:475
        - source_label: PMDA API GMP guideline
          locator: line:476
        children: []
      - nid: cha4.sec4_1.p4_13
        kind: paragraph
        kind_raw: '4.13'
        num: '4.13'
        ord: 99
        heading: null
        text: 構造又は設備内の原材料等及び従業員の動線は、混同又は汚染を防止するように 設計すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:479
        - source_label: PMDA API GMP guideline
          locator: line:480
        children: []
      - nid: cha4.sec4_1.p4_14
        kind: paragraph
        kind_raw: '4.14'
        num: '4.14'
        ord: 100
        heading: null
        text: '次の事項については、特定の作業区域又はその他の管理体制を設けること：


          ‑入荷原材料等の受入、確認、検体採取及び区分保管並びに合否判定待ち； ‑中間体・原薬の合否判定前の区分保管； ‑中間体・原薬の検体採取； ‑不合格原材料等の処分(例えば、返品、再加工又は廃棄)前の保管； ‑合格原材料等の保管； ‑製造作業 ‑包装及び表示作業；及び ‑試験作業'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:483
        - source_label: PMDA API GMP guideline
          locator: line:486
        - source_label: PMDA API GMP guideline
          locator: line:487
        - source_label: PMDA API GMP guideline
          locator: line:488
        - source_label: PMDA API GMP guideline
          locator: line:489
        - source_label: PMDA API GMP guideline
          locator: line:490
        - source_label: PMDA API GMP guideline
          locator: line:491
        - source_label: PMDA API GMP guideline
