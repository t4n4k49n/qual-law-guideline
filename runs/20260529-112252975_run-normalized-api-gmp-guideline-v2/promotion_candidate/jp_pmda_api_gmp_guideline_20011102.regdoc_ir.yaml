      - nid: cha6.sec6_6.p6_60
        kind: paragraph
        kind_raw: '6.60'
        num: '6.60'
        ord: 189
        heading: null
        text: 試験室管理記録は、設定した規格及び基準に適合していることを確認するために実 施される各種の検査や試験を含む全試験の完全なデータを含むこと。求められる内 容は次のとおりである： ‑試験用として入手した検体について、原材料等の名前又は製造元、ロット番号又は その他の識別コード番号、検体採取日、必要であれば試験用として検体を入手した 日付及び量の記述。 ‑使用した各試験方法に関するコメント又は参照事項。 ‑試験方法に基づいて各試験に使用されたサンプルの量又は測定値の記述。標準品、 試薬、標準溶液の調製及び試験に係るデータ又は参照事項。 ‑各試験の全ての生データの完全な記録、分析機器から得られたグラフ、チャート及 びスペクトル。なお、これらの記録については、被試験品とそのロットが明らかと なるよう適切に識別すること。 ‑計量単位、変換因子、等価係数等を含む試験中において行われた全ての計算式の記 録。 ‑試験結果の判定及び判定基準との比較に関する陳述。 ‑各試験を実施した各試験担当者の署名及び試験日 ‑オリジナルの記録の正当性、完全性及び設定した規格に対する適合性について照査 したことを示す別の担当者の署名及び日付。
        role: normative
        normativity: must
