        kind: paragraph
        kind_raw: '6.52'
        num: '6.52'
        ord: 186
        heading: null
        text: "ロット製造指図・記録のうち、主要な工程に係る記録には次のような事項を含むこ と： ‑日付、及び必要な場合には、時間。\n                                   。\n‑使用された主要な装置（例えば反応釜、乾燥機、粉砕機等） ‑質量、測定値、そして製造工程において使用された原材料、中間体、あるいは再加 工品のロット番号等からなるロットごとの固有識別。 ‑重要な工程パラメーターの結果。 ‑実施された検体採取についての記載。 ‑作業において各重要工程の作業者及び直接に監督又はチェックした担当者の署名。 ‑工程内試験及び試験室試験の結果。 ‑特定の段階又は時点における実収量。 ‑中間体・原薬の包装及びラベルに関する記載。 ‑もし市販品を使用するのであれば、その中間体・原薬の代表ラベル。 ‑確認された逸脱及びその評価。必要な場合には、実施された調査。また、当該結果 が別に保管されている場合は、当該調査結果の参照先。 ‑出荷判定の結果。"
        role: normative
        normativity: must
