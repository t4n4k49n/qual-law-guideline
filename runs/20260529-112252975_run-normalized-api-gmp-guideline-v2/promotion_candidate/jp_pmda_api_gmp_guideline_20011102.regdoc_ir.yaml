        kind: paragraph
        kind_raw: '4.10'
        num: '4.10'
        ord: 96
        heading: null
        text: 中間体・原薬の製造に使用する構造及び設備は、製造の形態及び段階に適し、清掃、 保守及び作業を容易とするように配置し、設計し、建設すること。また、設備につ いては、汚染のおそれを最小にするように設計すること。中間体・原薬について微 生物学的な規格を設定した場合には、設備は特定の微生物による汚染のおそれを適 切に制限するように設計すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
