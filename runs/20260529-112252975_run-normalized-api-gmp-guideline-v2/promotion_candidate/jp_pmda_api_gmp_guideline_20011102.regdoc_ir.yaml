        children: []
      - nid: cha5.sec5_3.p5_33
        kind: paragraph
        kind_raw: '5.33'
        num: '5.33'
        ord: 149
        heading: null
        text: 重要な装置については、校正に係る現状を認識し、証明できる状態にしておくこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:708
        children: []
      - nid: cha5.sec5_3.p5_34
        kind: paragraph
        kind_raw: '5.34'
        num: '5.34'
        ord: 150
        heading: null
        text: 校正基準に適合しない計測器は使用しないこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:709
        children: []
      - nid: cha5.sec5_3.p5_35
        kind: paragraph
        kind_raw: '5.35'
        num: '5.35'
        ord: 151
        heading: null
        text: 重要な計測器について承認された校正の標準値から逸脱した場合には、これらの逸 脱が前回の校正以降において当該計測器を用いて生産した中間体・原薬の品質に影 響を与えたか否かを判定するために、調査を行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
