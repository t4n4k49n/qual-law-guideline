    - nid: cha11.sec11_5
      kind: section
      kind_raw: '11.5'
      num: '11.5'
      ord: 317
      heading: 原薬の安定性モニタリング
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:1514
      children:
      - nid: cha11.sec11_5.p11_50
        kind: paragraph
        kind_raw: '11.50'
        num: '11.50'
        ord: 318
        heading: null
        text: 文書化された実施中の安定性試験プログラム（安定性評価及び確認を含む。）は、 原薬の安定性特性をモニタリングするように設計されていること。また、その結果 は、適切な保管条件及びリテスト日又は使用期限を確認するために用いること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1517
        - source_label: PMDA API GMP guideline
          locator: line:1518
        - source_label: PMDA API GMP guideline
          locator: line:1519
        children: []
      - nid: cha11.sec11_5.p11_51
        kind: paragraph
        kind_raw: '11.51'
        num: '11.51'
        ord: 319
        heading: null
        text: 安定性試験に使用する試験手順は、バリデーションが行われたものであり、安定 性を評価できるものであること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1522
        - source_label: PMDA API GMP guideline
          locator: line:1523
        children: []
      - nid: cha11.sec11_5.p11_52
        kind: paragraph
        kind_raw: '11.52'
        num: '11.52'
        ord: 320
        heading: null
        text: 安定性用の検体は、販売用に用いる容器と同等な容器に保管すること。例えば、 原薬をファイバードラム内の袋に入れて販売する場合には、安定性用検体は同じ材 質の袋及び材質の組成が販売用のドラムと同等又は同一の小スケールのドラムに 入れること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1526
        - source_label: PMDA API GMP guideline
          locator: line:1527
        - source_label: PMDA API GMP guideline
          locator: line:1528
        - source_label: PMDA API GMP guideline
          locator: line:1529
        children: []
      - nid: cha11.sec11_5.p11_53
        kind: paragraph
        kind_raw: '11.53'
        num: '11.53'
        ord: 321
        heading: null
        text: 通常、リテスト日又は使用期限を確認するために、最初の市販用３ロットを安定 性のモニタリングプログラムに用いること。ただし、それまでの研究データにより 原薬が少なくとも２年間安定であることが予測されている場合には、３ロットより 少ないロット数を用いる場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1532
        - source_label: PMDA API GMP guideline
          locator: line:1533
        - source_label: PMDA API GMP guideline
          locator: line:1534
        - source_label: PMDA API GMP guideline
          locator: line:1535
        children: []
      - nid: cha11.sec11_5.p11_54
        kind: paragraph
        kind_raw: '11.54'
        num: '11.54'
        ord: 322
        heading: null
        text: その後、生産した原薬について、少なくとも年１ロット（その年に製造がない場 合を除く）を安定性モニタリングプログラムに用い、また、安定性を確認するため に少なくとも年１回試験を行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1538
        - source_label: PMDA API GMP guideline
          locator: line:1539
        - source_label: PMDA API GMP guideline
          locator: line:1540
        children: []
      - nid: cha11.sec11_5.p11_55
        kind: paragraph
        kind_raw: '11.55'
        num: '11.55'
        ord: 323
        heading: null
        text: 有効期間が短い原薬については、試験を更に頻繁に行うこと。例えば、有効期間 が１年以下の、バイオテクノロジー原薬、生物由来原薬及びその他の原薬について は、安定性用検体を採取し、最初の３ヶ月間は毎月試験を行い、その後は３ヶ月間 隔で試験を行うこと。原薬の安定性が低下しないことを確認できるデータが存在す る場合には、特定の試験間隔（例えば９ヶ月試験）の削除を考慮する場合がある。
        role: normative
