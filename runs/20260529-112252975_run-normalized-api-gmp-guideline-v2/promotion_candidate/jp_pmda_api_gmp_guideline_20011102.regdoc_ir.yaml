        - source_label: PMDA API GMP guideline
          locator: line:1421
        - source_label: PMDA API GMP guideline
          locator: line:1422
        children: []
      - nid: cha11.sec11_1.p11_14
        kind: paragraph
        kind_raw: '11.14'
        num: '11.14'
        ord: 299
        heading: null
        text: 試験室管理は、手順に従って行い、実行した時点で記録を行うこと。手順からの 逸脱は全て記録し、明らかにすること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
