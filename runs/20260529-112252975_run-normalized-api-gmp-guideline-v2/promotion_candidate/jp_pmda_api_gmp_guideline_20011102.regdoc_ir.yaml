        heading: null
        text: 建物内及び隣接する周囲の区域からの排水、塵芥及びその他の廃棄物（例えば、製 造からの固形物、液体又は気体状の副生成物）を、安全で、適時に、かつ、衛生的 な方法で廃棄すること。廃棄物の容器及びパイプ類は明確に識別すること。
