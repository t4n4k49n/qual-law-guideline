        text: 臨床試験に使用する原薬の製造に係るプロセスバリデーションは、単一の原薬ロ ットしか製造されない場合又は原薬開発中の工程変更によりロットの再現が困難 又は不正確である場合には、通常、不適切である。この開発段階における原薬の品 質保証は、管理、校正、及び必要な場合には装置の適格性評価の組み合わせにより 行うものである。
