        - source_label: PMDA API GMP guideline
          locator: line:514
        - source_label: PMDA API GMP guideline
          locator: line:515
        - source_label: PMDA API GMP guideline
          locator: line:516
        children: []
      - nid: cha4.sec4_2.p4_21
        kind: paragraph
        kind_raw: '4.21'
        num: '4.21'
        ord: 105
        heading: null
        text: 必要な場合には、適切な換気・空気ろ過・排気システムを設置すること。これらの システムは、汚染及び交叉汚染のおそれを最小にするように設計し、設置し、また、 製造の段階に即した、空気圧、微生物(適切であれば)、塵埃、湿度及び温度の管理 装置を備えること。原薬が環境に暴露される区域では、特に注意を払うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:519
        - source_label: PMDA API GMP guideline
          locator: line:520
        - source_label: PMDA API GMP guideline
          locator: line:521
        - source_label: PMDA API GMP guideline
          locator: line:522
        children: []
      - nid: cha4.sec4_2.p4_22
        kind: paragraph
        kind_raw: '4.22'
        num: '4.22'
        ord: 106
        heading: null
        text: 空気を製造区域に再循環させる場合には、汚染及び交叉汚染のおそれを最小限にす るように適切な対策を取ること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:525
        - source_label: PMDA API GMP guideline
          locator: line:526
        children: []
      - nid: cha4.sec4_2.p4_23
        kind: paragraph
        kind_raw: '4.23'
        num: '4.23'
        ord: 107
        heading: null
        text: 恒久的に設置される配管は、適切な手法（例えば、各ラインへの表示、文書化、コ ンピュータ管理システム又はこれに代わる手法）により、識別されていること。配 管は中間体・原薬の汚染のおそれを回避するように配置すること
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:529
        - source_label: PMDA API GMP guideline
          locator: line:530
        - source_label: PMDA API GMP guideline
          locator: line:531
        children: []
      - nid: cha4.sec4_2.p4_24
        kind: paragraph
        kind_raw: '4.24'
        num: '4.24'
        ord: 108
        heading: null
        text: ドレイン配管は十分な大きさを有し、必要な場合には、逆流を防止するための空気 遮断装置又は適当な装置を備えていること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:534
        - source_label: PMDA API GMP guideline
