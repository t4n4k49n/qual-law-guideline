      children:
      - nid: cha7.sec7_3.p7_30
        kind: paragraph
        kind_raw: '7.30'
        num: '7.30'
        ord: 210
        heading: null
        text: 第7.32章に示される場合を除き、原材料等の各ロットの確認のために、少なくとも 一つの試験を行うこと。製造業者が供給業者を評価するシステムを有する場合には、 供給業者の試験成績書を他の試験項目の実施に代える場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1037
        - source_label: PMDA API GMP guideline
          locator: line:1038
        - source_label: PMDA API GMP guideline
          locator: line:1039
        children: []
      - nid: cha7.sec7_3.p7_31
        kind: paragraph
        kind_raw: '7.31'
        num: '7.31'
        ord: 211
        heading: null
        text: 供給業者の承認を行う場合には、製造業者が規格に適合する原材料等を継続的に供 給できる十分な根拠（例えば、過去の品質履歴）があることを評価すること。自社 による受入検査の項目を減らす前に、少なくとも３ロットについて、全項目試験を 行うこと。それとは別に、最低限として、全項目の試験を適切な間隔で行い、供給 業者の試験成績書と比較すること。試験成績書の信頼性について、一定の間隔で確 認を行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1042
        - source_label: PMDA API GMP guideline
          locator: line:1043
        - source_label: PMDA API GMP guideline
          locator: line:1044
        - source_label: PMDA API GMP guideline
          locator: line:1045
        - source_label: PMDA API GMP guideline
          locator: line:1046
        - source_label: PMDA API GMP guideline
          locator: line:1047
        children: []
      - nid: cha7.sec7_3.p7_32
        kind: paragraph
        kind_raw: '7.32'
        num: '7.32'
        ord: 212
        heading: null
        text: 助剤、危険な又は毒性の強い原料、その他の特殊な原材料等又は当該会社の管理範 囲内の別部門から輸送される原材料等に関しては、これらが規格に適合するもので あることを示す製造業者の試験成績書が得られる場合には、試験を行う必要はない。 容器、ラベル、ロット番号の記録等の外観を目視点検することもこれらの原材料等 を特定する上で役立つ。これらの原材料等の受入試験をしない場合には、その理由 を正当化し、それを文書化すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1050
        - source_label: PMDA API GMP guideline
