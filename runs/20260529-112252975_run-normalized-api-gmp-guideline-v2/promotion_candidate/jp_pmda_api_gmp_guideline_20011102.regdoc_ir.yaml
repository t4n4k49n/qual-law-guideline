      - nid: cha6.sec6_4.p6_41
        kind: paragraph
        kind_raw: '6.41'
        num: '6.41'
        ord: 182
        heading: null
        text: 製造指図書原本には次の内容を含めること。 ‑製造する原薬・中間体の名称。文書管理番号が定められている場合には、当該文書 管理番号。 ‑特別な品質特性を明確にするため、特定された名前又はコードで指定された原材料 又は中間体に関する全てのリスト。 ‑当該の工程で用いられる各原材料又は中間体の量又は比率に関する正確な記述（計 量単位を含む）。量が定められていない場合、各ロットサイズ又は製造時に用いる 比率の計算を含むこと。量のばらつきの範囲について正当化されている場合には、 これを含むこと。 ‑製造場所及び主要な製造装置 ‑製造指図書原本の詳細としては、次の事項を含む： ‑作業順序。 ‑使用されるプロセス・パラメーターの幅。 ‑必要な場合、検体採取指図及び工程内試験の判定基準。 ‑必要な場合、個々の工程又は工程全体の完了時間の制限。 ‑工程の適切な段階又は時間での期待収量の幅。 ‑必要な場合には、特別な注意事項又は予防注意若しくはそれらの参照事項。 ‑使用の適合を保証するための中間体・原薬を保管するための指図。これには、 表示材料・包装材料、必要な場合には、期限を定めた特別な保管条件が含まれ る。
        role: normative
        normativity: must
