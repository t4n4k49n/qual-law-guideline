      children:
      - nid: cha8.sec8_3.p8_30
        kind: paragraph
        kind_raw: '8.30'
        num: '8.30'
        ord: 238
        heading: null
        text: 中間体・原薬の品質特性に影響を及ぼす工程の進捗状況をモニターし、工程の状況 を管理するための手順書を確立すること。なお、工程内管理及びそれらの判定基準 は、開発段階で得た情報又は実績データに基づいて設定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1164
        - source_label: PMDA API GMP guideline
          locator: line:1165
        - source_label: PMDA API GMP guideline
          locator: line:1166
        children: []
      - nid: cha8.sec8_3.p8_31
        kind: paragraph
        kind_raw: '8.31'
        num: '8.31'
        ord: 239
        heading: null
        text: 試験の判定基準、種類及びその範囲は、製造する中間体・原薬の特性、反応・工程 及び当該工程が製品の品質に及ぼす変動の程度による。初期工程での工程内管理は あまり厳しくなくてもよいが、後の工程（例えば、分離及び精製段階）になるほど、 より厳重な管理が必要である。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1169
        - source_label: PMDA API GMP guideline
          locator: line:1170
        - source_label: PMDA API GMP guideline
          locator: line:1171
        - source_label: PMDA API GMP guideline
          locator: line:1172
        children: []
      - nid: cha8.sec8_3.p8_32
        kind: paragraph
        kind_raw: '8.32'
        num: '8.32'
        ord: 240
        heading: null
        text: 重要な工程内管理(及び重要工程のモニタリング)に係る事項については、管理事項 及び管理方法を含め、文書化し、品質部門による承認を受けること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1175
        - source_label: PMDA API GMP guideline
          locator: line:1176
        children: []
      - nid: cha8.sec8_3.p8_33
        kind: paragraph
        kind_raw: '8.33'
        num: '8.33'
        ord: 241
        heading: null
        text: 工程内管理として、製造部門の従業員が、品質部門の事前承認なしで工程の調整を 行う場合がある。ただし、その場合は、当該調整は品質部門により事前に定められ、 承認された限度内であること。全ての試験及びその結果は、ロット記録の一部とし て全て記録すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1179
        - source_label: PMDA API GMP guideline
          locator: line:1180
        - source_label: PMDA API GMP guideline
          locator: line:1181
        - source_label: PMDA API GMP guideline
          locator: line:1182
        children: []
      - nid: cha8.sec8_3.p8_34
        kind: paragraph
        kind_raw: '8.34'
        num: '8.34'
        ord: 242
        heading: null
        text: 工程内の原材料等に関する検体採取方法に係る手順書を作ること。検体採取計画及 び検体採取手順は、科学的に妥当な方法に基づいていること
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1185
        - source_label: PMDA API GMP guideline
          locator: line:1186
        children: []
      - nid: cha8.sec8_3.p8_35
        kind: paragraph
        kind_raw: '8.35'
        num: '8.35'
        ord: 243
        heading: null
        text: 工程内での検体採取は、採取した検体と他の中間体・原薬との汚染を防止するよう に設計した手順を用いて実施すること。手順は、採取後の検体の完全性を保証する ように設定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
