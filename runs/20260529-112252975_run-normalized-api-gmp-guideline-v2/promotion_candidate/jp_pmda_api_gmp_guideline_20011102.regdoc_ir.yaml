        - source_label: PMDA API GMP guideline
          locator: line:1870
        children: []
      - nid: cha14.sec14_2.p14_21
        kind: paragraph
        kind_raw: '14.21'
        num: '14.21'
        ord: 390
        heading: null
        text: 工程内管理試験により、当該工程が未完了であることが示された場合、その後の 工程の継続は通常の工程の一部と考える。これは再加工とは考えない。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1873
        - source_label: PMDA API GMP guideline
          locator: line:1874
        children: []
      - nid: cha14.sec14_2.p14_22
        kind: paragraph
        kind_raw: '14.22'
        num: '14.22'
        ord: 391
        heading: null
        text: 未反応物を工程に戻し、化学反応を繰返すことは、それが設定した工程の一部で なければ、再加工と考える。そのような再加工は、中間体・原薬の品質が生成する おそれのある副生成物及び過剰反応物質により悪影響を受けないことを保証する ために慎重な評価を行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
