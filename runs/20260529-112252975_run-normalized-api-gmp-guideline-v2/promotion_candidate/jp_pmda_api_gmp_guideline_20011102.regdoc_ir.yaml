        num: '8.50'
        ord: 255
        heading: null
        text: 適切な管理が行われている場合でも、残留物が、中間体・原薬の連続するロットに 持ち越されることがある。例えば、微粉砕機の壁に付着している残留物、遠心機か らの取り出し後に遠心機内に残った湿気を帯びた結晶の残留物、次の工程へ内容物 を移動させる際の処理槽からの液体又は結晶の取り出し残等が事例としてあげら れる。ただし、そのようなキャリーオーバーが、結果的に設定した原薬の不純物プ ロファイルに悪影響を与えるような分解物又は微生物汚染のキャリーオーバーと ならないこと。
        role: normative
