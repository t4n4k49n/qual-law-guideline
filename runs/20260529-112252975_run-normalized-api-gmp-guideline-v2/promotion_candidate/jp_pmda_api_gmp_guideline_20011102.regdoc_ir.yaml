        kind: paragraph
        kind_raw: '11.20'
        num: '11.20'
        ord: 306
        heading: null
        text: 中間体・原薬は、ロットごとに、適切な試験を行い、規格に適合していることを 判定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
