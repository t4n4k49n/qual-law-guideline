          - source_label: PMDA API GMP guideline
            locator: line:1692
          children: []
      - nid: cha12.sec12_4.p12_45
        kind: paragraph
        kind_raw: '12.45'
        num: '12.45'
        ord: 356
        heading: null
        text: 回顧的バリデーションのために選択されたロットは、規格に適合しなかった全て のロットを含めて、調査期間中に実施した全てのロットを代表するロットであるこ と。また、工程の恒常性を実証するのに十分なロット数とすること。工程に対して 回顧的にバリデーションを行うためのデータを得るために、参考品・保存品の試験 を行う場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1695
        - source_label: PMDA API GMP guideline
          locator: line:1696
        - source_label: PMDA API GMP guideline
          locator: line:1697
        - source_label: PMDA API GMP guideline
          locator: line:1698
        - source_label: PMDA API GMP guideline
          locator: line:1699
        children: []
    - nid: cha12.sec12_5
      kind: section
      kind_raw: '12.5'
      num: '12.5'
      ord: 357
      heading: プロセスバリデーションの計画
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:1702
      children:
      - nid: cha12.sec12_5.p12_50
        kind: paragraph
        kind_raw: '12.50'
        num: '12.50'
        ord: 358
        heading: null
        text: バリデーションのための工程稼動回数は、工程の複雑性又は考慮すべき工程変更 の規模によること。予測的及びコンカレントバリデーションに関しては、３回の連 続して成功した製造ロットを一つの指標として使用すべきであるが、工程(例えば、 複雑な原薬工程又は終了時間が長引いた原薬工程)の恒常性を証明するために、稼 動回数の追加が認められる場合がある。回顧的バリデーションに関しては、工程の 恒常性を評価するために、一般的に１０から３０の連続するロットのデータを検討 すべきであるが、正当な理由があれば、より少ないロット数で検討を行う場合もあ る。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1705
        - source_label: PMDA API GMP guideline
          locator: line:1706
        - source_label: PMDA API GMP guideline
          locator: line:1707
        - source_label: PMDA API GMP guideline
          locator: line:1708
        - source_label: PMDA API GMP guideline
          locator: line:1709
        - source_label: PMDA API GMP guideline
          locator: line:1710
        - source_label: PMDA API GMP guideline
          locator: line:1711
        - source_label: PMDA API GMP guideline
          locator: line:1712
        children: []
      - nid: cha12.sec12_5.p12_51
        kind: paragraph
        kind_raw: '12.51'
        num: '12.51'
        ord: 359
        heading: null
        text: プロセスバリデーションを実施している期間中は、重要工程パラメータを管理し、 モニターすること。なお、例えばエネルギー消費量又は装置使用を最少化するため に管理する変数のように、品質に関係しない工程パラメータについては、プロセス バリデーションに含める必要はない。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1715
        - source_label: PMDA API GMP guideline
          locator: line:1716
        - source_label: PMDA API GMP guideline
          locator: line:1717
        - source_label: PMDA API GMP guideline
          locator: line:1718
        children: []
      - nid: cha12.sec12_5.p12_52
        kind: paragraph
        kind_raw: '12.52'
        num: '12.52'
        ord: 360
        heading: null
        text: プロセスバリデーションでは、各原薬について不純物プロファイルが規定した限 界値内であることを確認すること。なお、当該不純物プロファイルは、実績データ、 及び適用できる場合には工程開発中に定められたプロファイル又は重要な臨床試 験及び毒性試験に使用したロットに係るプロファイルに匹敵するかそれ以上良好 であること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1721
        - source_label: PMDA API GMP guideline
          locator: line:1722
        - source_label: PMDA API GMP guideline
          locator: line:1723
        - source_label: PMDA API GMP guideline
          locator: line:1724
        - source_label: PMDA API GMP guideline
          locator: line:1725
        children: []
    - nid: cha12.sec12_6
      kind: section
      kind_raw: '12.6'
      num: '12.6'
      ord: 361
      heading: 検証したシステムの定期的照査
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:1728
      children:
      - nid: cha12.sec12_6.p12_60
        kind: paragraph
        kind_raw: '12.60'
        num: '12.60'
        ord: 362
        heading: null
        text: システム及び工程は、それらがなお妥当な状態で作動していることを確認するた めに定期的に評価すること。当該システム及び工程に重要な変更がなく、また、品 質照査によりシステム又は工程が恒常的に規格に適合する中間体等を製造してい ることが確認されている場合には、通常は、再バリデーションの必要性はない。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1731
        - source_label: PMDA API GMP guideline
          locator: line:1732
        - source_label: PMDA API GMP guideline
          locator: line:1733
        - source_label: PMDA API GMP guideline
          locator: line:1734
        children: []
    - nid: cha12.sec12_7
      kind: section
      kind_raw: '12.7'
      num: '12.7'
      ord: 363
      heading: 洗浄のバリデーション
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:1737
      children:
      - nid: cha12.sec12_7.p12_70
        kind: paragraph
        kind_raw: '12.70'
        num: '12.70'
        ord: 364
        heading: null
        text: 洗浄手順は、通常、バリデーションを行うこと。一般的に、洗浄のバリデーショ ンは、汚染又は偶発的な原材料等のキャリーオーバーが原薬の品質に最大のリスク をもたらす状況又は工程に対して行うこと。例えば、初期段階の製造では、残留物 がそれ以降の精製段階で除去される場合には、装置の洗浄についてバリデーション を実施する必要はない場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1740
        - source_label: PMDA API GMP guideline
          locator: line:1741
        - source_label: PMDA API GMP guideline
          locator: line:1742
        - source_label: PMDA API GMP guideline
          locator: line:1743
        - source_label: PMDA API GMP guideline
          locator: line:1744
        children: []
      - nid: cha12.sec12_7.p12_71
        kind: paragraph
        kind_raw: '12.71'
        num: '12.71'
        ord: 365
        heading: null
        text: 洗浄手順のバリデーションでは、実際の装置の使用パターンを反映させること。 種々の原薬・中間体を同じ装置で製造し、当該装置を同じ方法で洗浄する場合は、 洗浄のバリデーションには代表的な中間体・原薬を選択する場合がある。その選択 は、溶解性、洗浄の困難さ並びに力価、毒性及び安定性に基づく残留物限界値の推 定に基づいて行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1747
        - source_label: PMDA API GMP guideline
          locator: line:1748
        - source_label: PMDA API GMP guideline
          locator: line:1749
        - source_label: PMDA API GMP guideline
          locator: line:1750
        - source_label: PMDA API GMP guideline
          locator: line:1751
        children: []
      - nid: cha12.sec12_7.p12_72
        kind: paragraph
        kind_raw: '12.72'
        num: '12.72'
        ord: 366
        heading: null
        text: 洗浄のバリデーション実施計画書には、洗浄する装置、手順、原材料等、合格洗 浄水準、モニタリング及び管理を行うパラメータ並びに分析方法を記載すること。 また、実施計画書には、採取する検体の種類、採取方法及び表示方法を記載するこ と。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1754
        - source_label: PMDA API GMP guideline
          locator: line:1755
        - source_label: PMDA API GMP guideline
          locator: line:1756
        - source_label: PMDA API GMP guideline
          locator: line:1757
        children: []
      - nid: cha12.sec12_7.p12_73
        kind: paragraph
        kind_raw: '12.73'
        num: '12.73'
        ord: 367
        heading: null
        text: 不溶性及び溶解性残留物の両方を検出するために、検体採取には、スワブ法、リ ンス法又は代替方法(例えば、直接抽出)を適切に含めること。使用する検体採取方 法は、洗浄後の装置表面上に残留する残留物の水準を定量的に測定できる方法にす ること。スワブ法は、製品接触表面に装置設計又は工程の制約のために容易に近づ けない場合は実際的ではない。例えば、ホースの内部表面、移送パイプ、反応タン クの開口部の小さい部分、毒性材料を取扱う反応タンク、微粉砕機やマイクロフル ーダイザー等の小型で複雑な装置等があげられる。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1760
        - source_label: PMDA API GMP guideline
          locator: line:1761
        - source_label: PMDA API GMP guideline
          locator: line:1762
        - source_label: PMDA API GMP guideline
          locator: line:1763
        - source_label: PMDA API GMP guideline
          locator: line:1764
        - source_label: PMDA API GMP guideline
          locator: line:1765
        - source_label: PMDA API GMP guideline
          locator: line:1766
        children: []
      - nid: cha12.sec12_7.p12_74
        kind: paragraph
        kind_raw: '12.74'
        num: '12.74'
        ord: 368
        heading: null
        text: 残留物又は汚染物を検出できる感度を有するバリデーション済みの分析方法を使 用すること。各分析方法の検出限界は、残留物又は汚染物の設定合格水準を検出す るのに十分な感度とすること。当該分析方法の達成可能な回収水準を設定すること。 残留物限界値は、実際的で、達成可能であり、立証可能であり、かつ、最も有毒な 残留物に基づいたものとすること。限界値は、原薬又はその最も有毒な組成物に関 する既知の薬理学的、毒性学的又は生理学的活性の最小量に基づいて設定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1769
        - source_label: PMDA API GMP guideline
          locator: line:1770
        - source_label: PMDA API GMP guideline
          locator: line:1771
        - source_label: PMDA API GMP guideline
          locator: line:1772
        - source_label: PMDA API GMP guideline
          locator: line:1773
        - source_label: PMDA API GMP guideline
          locator: line:1774
        children: []
      - nid: cha12.sec12_7.p12_75
        kind: paragraph
        kind_raw: '12.75'
        num: '12.75'
        ord: 369
        heading: null
        text: 装置の洗浄作業・消毒作業の検討は、原薬中の生菌数又はエンドトキシンを低減 する必要のある工程、又は、そのような汚染が問題となる他の工程(例えば、無菌 製剤の生産に用いる非無菌原薬)について、微生物汚染及びエンドトキシン汚染を 対象として行うこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1777
        - source_label: PMDA API GMP guideline
          locator: line:1778
        - source_label: PMDA API GMP guideline
          locator: line:1779
        - source_label: PMDA API GMP guideline
          locator: line:1780
        children: []
      - nid: cha12.sec12_7.p12_76
        kind: paragraph
        kind_raw: '12.76'
        num: '12.76'
        ord: 370
        heading: null
        text: 洗浄手順は、当該洗浄手順が通常の製造時に有効であることを保証するために、 バリデーション後適切な間隔でモニタリングを行うこと。装置の清浄性は、分析試 験及び可能な場所では目視検査でモニタリングを行う場合がある。目視検査により、 検体採取及び分析では検出できない、小さな部分に集中する大量の汚染の検出が可 能な場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1783
        - source_label: PMDA API GMP guideline
          locator: line:1784
        - source_label: PMDA API GMP guideline
          locator: line:1785
        - source_label: PMDA API GMP guideline
          locator: line:1786
        - source_label: PMDA API GMP guideline
          locator: line:1787
        children: []
    - nid: cha12.sec12_8
      kind: section
      kind_raw: '12.8'
      num: '12.8'
      ord: 371
      heading: 分析法のバリデーション
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
