      - nid: cha18.sec18_1.p18_10
        kind: paragraph
        kind_raw: '18.10'
        num: '18.10'
        ord: 446
        heading: null
        text: 第18章は、前章まででは適切に網羅していない天然生物体又は組換え生物体を使 用し、細胞培養又は発酵により生産する原薬・中間体に特異的な管理について記述 している。ただし、独立の章としてあるものではなく、全般的には、本ガイドライ ンの他の章に規定されるＧＭＰの原則が適用される。低分子を製造するための「ク ラシカルな」工程における発酵の原則と、蛋白質又はポリペプチドを製造するため に組換え及び非組換え生物体を用いる細胞培養・発酵の原則は、その管理の程度が 異なっているものの、同じであることに留意されたい。実際として、本章ではこれ らの違いについて記述している。一般的に、蛋白又はポリペプチドを製造するため に用いられるバイオテクノロジー工程における管理の程度は、クラシカルな発酵工 程の管理の程度より厳格である。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2119
        - source_label: PMDA API GMP guideline
          locator: line:2120
        - source_label: PMDA API GMP guideline
          locator: line:2121
        - source_label: PMDA API GMP guideline
          locator: line:2122
        - source_label: PMDA API GMP guideline
          locator: line:2123
        - source_label: PMDA API GMP guideline
          locator: line:2124
        - source_label: PMDA API GMP guideline
          locator: line:2125
        - source_label: PMDA API GMP guideline
          locator: line:2126
        - source_label: PMDA API GMP guideline
          locator: line:2127
        - source_label: PMDA API GMP guideline
          locator: line:2128
        children: []
      - nid: cha18.sec18_1.p18_11
        kind: paragraph
        kind_raw: '18.11'
        num: '18.11'
        ord: 447
        heading: null
        text: 「バイオテクノロジー工程（バイテク）」とは、原薬製造のために、組換えＤＮＡ、 ハイブリドーマ、その他の技術により産み出された又は変化させた細胞又は微生物 の使用をいう。バイオテクノロジー工程により製造された原薬は、通常、例えば蛋 白質及びポリペプチドのような高分子物質であり、本章ではそれらに係るガイドラ インを示す。なお、抗生物質、アミノ酸、ビタミン、炭水化物類のような、低分子 の原薬も、組換えＤＮＡ技術により製造される場合があるが、この類の原薬の管理 レベルは、クラシカル発酵の場合に求められる管理レベルに類似している。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2131
        - source_label: PMDA API GMP guideline
          locator: line:2132
        - source_label: PMDA API GMP guideline
          locator: line:2133
        - source_label: PMDA API GMP guideline
          locator: line:2134
        - source_label: PMDA API GMP guideline
          locator: line:2135
        - source_label: PMDA API GMP guideline
          locator: line:2136
        - source_label: PMDA API GMP guideline
          locator: line:2137
        children: []
      - nid: cha18.sec18_1.p18_12
        kind: paragraph
        kind_raw: '18.12'
        num: '18.12'
        ord: 448
        heading: null
        text: 「クラシカル発酵」とは、天然に存在する、又はコンベンショナルな手法（例え ば、放射線照射、化学的に引き起こした変異）により変化させた微生物を使用する 原薬製造工程をいう。「クラシカル発酵」により製造された原薬は、通常、抗生物 質、アミノ酸、ビタミン、炭水化物類のような低分子物質である。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2140
        - source_label: PMDA API GMP guideline
          locator: line:2141
        - source_label: PMDA API GMP guideline
          locator: line:2142
        - source_label: PMDA API GMP guideline
          locator: line:2143
        children: []
      - nid: cha18.sec18_1.p18_13
        kind: paragraph
        kind_raw: '18.13'
        num: '18.13'
        ord: 449
        heading: null
        text: 細胞培養又は発酵からの原薬・中間体の製造には、細胞培養又は生物体からの物 質の抽出及び精製等の生物学的工程が含まれる。物理化学的修飾等の更なる工程段 階が存在する場合があるが、これも製造工程の一部であることを留意されたい。使 用する原料(培地、緩衝剤成分)は微生物汚染を増大させるおそれがある。供給源、 調製法及び原薬・中間体の目的用途によって、製造及び工程の適切な段階でのモニ タリングにおいてバイオバーデン、ウイルス汚染やエンドトキシンの管理が必要で ある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2146
        - source_label: PMDA API GMP guideline
          locator: line:2147
        - source_label: PMDA API GMP guideline
          locator: line:2148
        - source_label: PMDA API GMP guideline
          locator: line:2149
        - source_label: PMDA API GMP guideline
          locator: line:2150
        - source_label: PMDA API GMP guideline
          locator: line:2151
        - source_label: PMDA API GMP guideline
          locator: line:2152
        children: []
      - nid: cha18.sec18_1.p18_14
        kind: paragraph
        kind_raw: '18.14'
        num: '18.14'
        ord: 450
        heading: null
        text: 中間体・原薬の品質を確保するために、生産の全ての段階で適切な管理を確立す ること。本ガイドラインの適用は細胞培養・発酵の段階から始まるが、前段階、例 えば細胞バンク作製は、適切な工程管理の下で実施すること。本ガイドラインは、 細胞バンクのバイアルを製造に使用するために取り出した時点からの細胞培養・発 酵を対象とする。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2155
        - source_label: PMDA API GMP guideline
          locator: line:2156
        - source_label: PMDA API GMP guideline
          locator: line:2157
        - source_label: PMDA API GMP guideline
          locator: line:2158
        - source_label: PMDA API GMP guideline
          locator: line:2159
        children: []
      - nid: cha18.sec18_1.p18_15
        kind: paragraph
        kind_raw: '18.15'
        num: '18.15'
        ord: 451
        heading: null
        text: 汚染のリスクを最小限にするために適切な装置管理及び環境管理を採用すること。 環境管理上の判定基準及びモニタリングの頻度は、製造の段階及び製造条件(開放、 閉鎖又は準閉鎖システム)による。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2162
        - source_label: PMDA API GMP guideline
          locator: line:2163
        - source_label: PMDA API GMP guideline
          locator: line:2164
        children: []
      - nid: cha18.sec18_1.p18_16
        kind: paragraph
        kind_raw: '18.16'
        num: '18.16'
        ord: 452
        heading: null
        text: 一般的に工程管理には以下の事項を考慮すること： ‑ワーキングセルバンクの保守（必要な場合）； ‑適切な接種及び培養の拡大； ‑発酵・細胞培養の間の重要な作業パラメータの管理； ‑必要な場合には、細胞増殖、生存率(ほとんどの細胞培養工程について)及び生産性 のモニタリング； ‑中間体・原薬を汚染（特に微生物汚染）及び品質低下から保護しながら、細胞、細 胞残渣及び培地成分を除去するハーベスト及び精製手順 ‑バイオバーデン、及び必要な場合にはエンドトキシンのレベルについて、製造の適 切な段階でモニターすること； ‑ＩＣＨＱ５Ａガイドライン「ヒト又は動物細胞株を用いて製造されるバイオテクノ ロジー応用医薬品のウイルス安全性評価」に記載されたウイルス安全性に関する事 項
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2167
        - source_label: PMDA API GMP guideline
          locator: line:2168
        - source_label: PMDA API GMP guideline
          locator: line:2169
        - source_label: PMDA API GMP guideline
          locator: line:2170
        - source_label: PMDA API GMP guideline
          locator: line:2171
        - source_label: PMDA API GMP guideline
          locator: line:2172
        - source_label: PMDA API GMP guideline
          locator: line:2173
        - source_label: PMDA API GMP guideline
          locator: line:2174
        - source_label: PMDA API GMP guideline
          locator: line:2175
        - source_label: PMDA API GMP guideline
          locator: line:2176
        - source_label: PMDA API GMP guideline
          locator: line:2177
        - source_label: PMDA API GMP guideline
          locator: line:2178
        - source_label: PMDA API GMP guideline
          locator: line:2179
        children: []
      - nid: cha18.sec18_1.p18_17
        kind: paragraph
        kind_raw: '18.17'
        num: '18.17'
        ord: 453
        heading: null
        text: 必要な場合には、培地成分、宿主細胞の蛋白質、その他の工程に関する不純物、 製品に関する不純物及び汚染物の除去を立証すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
