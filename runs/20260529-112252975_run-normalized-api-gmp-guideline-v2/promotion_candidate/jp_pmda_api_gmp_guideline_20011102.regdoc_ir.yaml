        - source_label: PMDA API GMP guideline
          locator: line:1493
        - source_label: PMDA API GMP guideline
          locator: line:1494
        - source_label: PMDA API GMP guideline
          locator: line:1495
        children: []
      - nid: cha11.sec11_4.p11_42
        kind: paragraph
        kind_raw: '11.42'
        num: '11.42'
        ord: 314
        heading: null
        text: 試験成績書には、公定書又は顧客の要件に従って実施した各試験を、規格値及び 得られた数値結果(試験結果が数値である場合)を含めて表示すること。
        role: normative
        normativity: must
        tags: []
        refs:
