        text: 適任者による教育訓練を定期的に実施すること。なお、それぞれ従業員の教育訓練 は、少なくとも、当該従業員が行う作業及び職務に係るＧＭＰの訓練を含むこと。 また、教育訓練の記録を保管し、定期的に評価すること。
        role: normative
        normativity: must
