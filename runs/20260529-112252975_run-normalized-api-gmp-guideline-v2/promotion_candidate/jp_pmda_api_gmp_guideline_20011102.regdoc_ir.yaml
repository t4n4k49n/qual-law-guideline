        kind: paragraph
        kind_raw: '5.13'
        num: '5.13'
        ord: 133
        heading: null
        text: 中間体・原薬の製造に使用する主要な装置(例えば、反応装置、保管容器)及び恒久 的に設置した工程ラインは適切に識別されていること。
