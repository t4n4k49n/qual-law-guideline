    - nid: cha8.sec8_3
      kind: section
      kind_raw: '8.3'
      num: '8.3'
      ord: 237
      heading: 工程内検体採取及び管理
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
