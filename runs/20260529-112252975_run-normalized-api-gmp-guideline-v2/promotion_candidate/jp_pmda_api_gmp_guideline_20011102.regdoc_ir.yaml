        kind: paragraph
        kind_raw: '10.21'
        num: '10.21'
        ord: 289
        heading: null
        text: 原薬・中間体は、その品質に悪影響を及ぼさない方法で輸送すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1381
        children: []
      - nid: cha10.sec10_2.p10_22
        kind: paragraph
        kind_raw: '10.22'
        num: '10.22'
        ord: 290
        heading: null
        text: 原薬・中間体の特殊な輸送条件・保管条件はラベルに記載すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1382
        children: []
