        - source_label: PMDA API GMP guideline
          locator: line:1205
        children: []
      - nid: cha8.sec8_4.p8_41
        kind: paragraph
        kind_raw: '8.41'
        num: '8.41'
        ord: 247
        heading: null
        text: 規格外試験結果のロットを規格に適合させる目的で他のロットと混合しないこと。 混合を行う各ロットについては、定められた工程により製造し、ロットごとに試験 を行い、混合する前に規格に適合していることを確認すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
