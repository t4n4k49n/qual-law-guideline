        kind: paragraph
        kind_raw: '2.50'
        num: '2.50'
        ord: 78
        heading: null
        text: "工程の恒常性の確認を目的として、定期的に原薬の品質照査を実施すること。品質\n            照査は、通常、年一回実施し、記録すること。この品質照査には、少なくとも、以\n            下の事項が含まれること。\n‑重要な工程内管理及び原薬の重要な試験結果の照査 ‑設定した規格に適合しない全てのロットの照査 ‑全ての重大な逸脱又は不適合及び関連する調査内容の照査 ‑工程又は分析法について実施した全ての変更の照査 ‑安定性モニタリングの結果の照査 ‑品質に関連する全ての返品、苦情及び回収の照査 ‑是正処置の妥当性の照査"
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
