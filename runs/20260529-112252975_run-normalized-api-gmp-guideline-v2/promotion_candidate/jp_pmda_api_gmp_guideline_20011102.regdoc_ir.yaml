        heading: null
        text: 中間体・原薬について、ロットの使用又は出荷の前に、当該中間体・原薬が規格の 基準を満たしていることを確認するため、当該ロットの包装及び表示を含む、製造 指図・記録及び試験室管理記録の照査及び承認について、文書化した手順を作成し、 それに従うこと。
