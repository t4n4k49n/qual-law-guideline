      - nid: cha8.sec8_1.p8_11
        kind: paragraph
        kind_raw: '8.11'
        num: '8.11'
        ord: 227
        heading: null
        text: 後の製造作業での使用のために原材料等を小分けする場合は、適切な小分け容器を 用い、また、以下の内容がわかるように当該容器に表示すること： ‑原材料等の名称・コード； ‑小分け番号又は管理番号； ‑当該容器中の原材料等の質量又は容量； ‑必要であれば、再評価又はリテストの日付。
        role: normative
        normativity: must
