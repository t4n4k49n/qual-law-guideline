        text: "記録は次の内容により保存・管理すること。 ‑原料・中間体・原薬用表示材料・包装材料のロットごと、かつ、入荷ごとの製造業\n                          （もし既知であれば）供給者の管理番号、\n者の名前、識別及び数量；供給者の名称； 又はその他の識別番号；受入時の管理番号；受入日。 ‑実施された試験又は検査の結果及びその判定。 ‑使用・出納の記録。 ‑原薬用表示材料・包装材料が規定された規格に適合していることを試験し、照査し た文書。 ‑不合格と判定した原料・中間体・原薬用表示材料・包装材料についての最終措置。"
        role: normative
        normativity: must
