  - nid: cha20
    kind: chapter
    kind_raw: '1'
    num: '20'
    ord: 514
    heading: 用語集
    text: '一次標準品 高い純度の標準物質であることが、一連の広範囲な分析試験によって示された物質。一 次標準品は、(1)公式に認定された入手先から得る場合、(2)特別に合成される場合、(3) 既存の高純度の製造品から得られる場合、又は、(4)既存の製造品をさらに精製することよ って得られる場合がある。 逸脱 承認された指示又は設定された基準からの乖離


      汚染 製造、検体採取、包装、再包装、保管又は輸送において生じる、原料、中間体又は原薬 の中又は表面への化学的又は微生物学的不純物もしくは異物の好ましくない混入。


      規格 試験項目、分析手順に関する参照文献及び当該試験の数的限界値、範囲又はその他の基 準となる適切な判定基準のリスト。それにより、原材料等が目的の用途に許容されると判 断するために適合すべき基準一式が設定される。「規格適合」とは、原材料等を定められた 分析手順に従って試験した時、定められた判定基準に適合することを意味する。


      期待収量 事前の実験段階、パイロットスケール又は実生産のデータに基づき、製造の適切な段階 において予測される生成物の量、又は当該量の理論収量に対する百分率。


      区分保管 後の合格又は不合格判定を待つために、物理的又はその他の有効な方法で分離した物質 の状態。


      原材料等（原材料、中間体、原薬等） 原料(出発物質、試薬、溶媒)、助剤、中間体、原薬及び包装材料・表示材料を示すのに 使用する一般的な用語。 （参考）原材料等：原材料、中間体、原薬、助剤、ガスケット等。 原材料：原料、資材。 原料：原薬出発物質、試薬、溶媒。 資材：表示材料、包装材料。


      原薬（医薬品有効成分）（ＡＰＩ） 医薬品の生産に使用することを目的とする物質又は物質の混合物で、医薬品の製造に使 用された時に医薬品の有効成分となるもの。そのような物質は、疾患の診断、治療、緩和、 手当又は予防において直接の効果又は薬理活性を示すこと、又は身体の構造及び機能に影 響を与えることを目的としている。


      原薬出発物質 原薬の製造に使用され、かつ、それが原薬の構造中の重要な構成部分として組込まれる 原料、中間体又は原薬である。市販品の場合、委託又は販売契約の下で供給者から購入す る場合又は自社で製造する場合がある。原薬出発物質は、通常、化学的性質及び構造を明 確にされているものである。


      原料 中間体・原薬を製造する目的で使用する、出発物質、試薬及び溶媒を示すのに使用する 一般的な用語。


      交叉汚染 他の原材料等又は製品による原材料等又は製品の汚染。


      校正 特定の計器又は装置が、適切な測定の範囲において、ある対照品又は追跡可能な標準品 との比較によって、規定した限界値内の結果を示すことを実証すること。


      工程管理 工程内管理の項参照


      工程内管理(工程管理) 工程をモニターするため、適切な場合には工程を調整するため、又は、中間体・原薬が 規格に適合することを保証するため、製造中に実施するチェック。


      コンピュータ化システム コンピュータ・システムで統合された工程又は作業。


      コンピュータ・システム 特定の機能又は一連の機能を実行するために、設計し、組立てられたハードウエア及び 関連するソフトウエアのグループ。


      再加工 基準又は規格に適合しないものを含め、中間体・原薬を工程に戻し、設定された生産工 程の一部である結晶化段階もしくはその他の適切な化学的又は物理的操作段階（例えば蒸 留、濾過、クロマト分離、粉砕等）を繰返すこと。工程内管理試験により反応が不完全で あることが示された場合、その後、当該工程を継続することは、通常の工程の一部と考え、 再加工とは考えない。


      再処理 基準又は規格に適合しない中間体・原薬について、許容できる品質を得るために、設定 された生産工程とは異なる処理段階(例えば、異なる溶媒による再結晶)を行うこと。 重要な 原薬が規格に適合することを保証するために、予め定めた基準内で管理する必要がある 工程段階、工程条件、試験要件又はその他の関連パラメータ又は項目であることを意味す る。


      収量：期待収量、理論収量 期待収量、理論収量の項参照


      受託製造業者 オリジナルの製造業者に代わり生産のある部分を行う製造業者


      使用期限 原薬の容器・ラベルに記載された日付であって、当該原薬を規定した条件で保管した場 合に、当該原薬が規格を維持することが予測される保管期間の長さを示すもの。この使用 期限を過ぎた原薬は使用すべきではない。


      助剤 中間体・原薬の生産において、それ自体は化学的又は生物的反応に介入しない補助とし て使用される原材料であって、溶媒以外のもの(例えば、濾過助剤、活性炭等)。


      署名 特定の措置又は照査をした者の記録。この記録には、イニシアル、完全な手書き署名、 個人の捺印又は本物であることが証明され、保証された電子署名の場合がある。


      製剤 市販を目的とした最終の直接包装にはいった投与剤形(参考：ＩＣＨＱ１Ａガイドライ ン)。


      生産 原薬の原材料受入、製造、包装、再包装、表示、再表示、品質管理、出荷、保管・流通及びそ の他関連する管理


      製造 原材料の受入から、一連の工程及び原薬の包装を通じて、原薬の調製に関与する全ての 作業。


      製造業者 生産に関わる全ての業者。 中間体 原薬の製造段階において製造される物質であって、当該物質が原薬になるまでに、さら なる分子変化又は精製が行われるもの。中間体は分離される場合もあるし、分離されない （注：本ガイドラインは、企業が、原薬製造の開始点として定義する時点以降 場合もある。 の中間体のみを取り扱う。）


      適格性評価 装置又は付帯システムが適切に据え付けられ、正しく作動し、実際に期待される結果が 得られることを証明し、記録する活動。適格性評価はバリデーションの一部であるが、個々 の適格性評価のステップのみではプロセスバリデーションとはならない。


      手順 中間体・原薬の生産に関連して直接的又は間接的に実施する作業、払うべき注意、適用 すべき対策を文書で記述したもの。


      二次標準品 一次標準品と比較することによって設定した品質及び純度を有することが示され、日常 の試験室での分析に標準品として使用する物質。


      バイオバーデン 原料、原薬出発物質、中間体又は原薬中に存在するおそれのある微生物のレベルとタイ プ(例えば、特定微生物又は非特定微生物)。バイオバーデンは、一定のレベルを超えない、 又は規定した特定微生物を検出しない限り、汚染と考えない。


      バリデーション 特定の工程、方法又はシステムが、一貫して、予め設定した判定基準に適合する結果を 与えるという高度の保証を提供する文書によるプログラム。


      バリデーション実施計画書 バリデーションの実施方法、判定基準の規定を記述した計画書。例えば、生産工程に関 する実施計画書は、使用する設備、重要工程のパラメータ・運転範囲、製品特性、検体採 取方法、収集するべき試験データ、バリデーションの回数及び許容すべき試験結果を明確 にするものである。


      判定基準 試験結果を許容するための数的な限界値、範囲又はその他適切な措置


      標準品：一次標準品、二次標準品 一次標準品、二次標準品の項参照 品質管理（ＱＣ） 規格に適合していることを確認又は試験すること。


      品質部門 品質保証及び品質管理の両責任を果たす、製造から独立した組織部門。品質部門は、組 織の規模及び構造によって、別々のＱＡ部門及びＱＣ部門の形態をとる場合もあり、また、 単一組織又はグループの形態をとる場合もある。


      品質保証（ＱＡ） 全ての原薬が目的用途に必要な品質を有し、その品質システムが維持されていることを 保証する目的でつくられた組織化した機構の総体。


      不純物 中間体・原薬の中に存在し、かつ、その混入が好ましくない全ての成分


      不純物プロファイル 原薬の中に存在する同定された及び同定されていない不純物を記述したもの


      包装材料 保管及び輸送において中間体・原薬を保護する目的の原材料。


      母液 結晶化工程又は分離工程の後に残る残留液。母液には、未反応原料、中間体、一定量の 原薬や不純物が含まれている。母液はさらに工程で使用することができる。


      溶媒 中間体・原薬の生産において、溶液又は懸濁液調製用の媒体として使用される無機又は 有機の液体。


      リテスト日 未だ使用可能であることを保証するために、ある物質を再検査すべき日付。


      理論収量 実際の製造でいかなるロス又は誤りもない場合に、使用した原材料等の量に基づき、製 造の適切な段階で製造される量。


      ロット 規定された限度内で均質と予測できる、一つの工程又は一連の工程で製造された原材料 等の特定の量。連続製造の場合には、ロットは製造の規定された画分に相当する。ロット サイズは、特定の量又は特定の時間内に製造された量と定義される。バッチともいう。


      ロット番号 ロットを識別する数字、文字又は記号の固有の組み合わせで、これにより製造及び流通 の履歴が判定できるもの。バッチ番号ともいう。


      ＩＣＨＱ１Ａガイドライン 「安定性試験ガイドラインについて」（平成６年４月２１日付け薬新薬第３０号厚生省薬 務局新医薬品課長通知／改正：平成１３年５月１日付け医薬審発第５６５号厚生労働省医 薬局審査管理課長通知）


      ＩＣＨＱ５Ａガイドライン 「「ヒト又は動物細胞株を用いて製造されるバイオテクノロジー応用医薬品のウイルス安 全性評価」について」（平成１２年２月２２日付け医薬審第３２９号厚生省医薬安全全局審 査管理課長通知）


      ＩＣＨＱ５Ｄガイドライン 「「生物薬品（バイオテクノロジー応用医薬品／生物起源由来医薬品）製造用細胞基剤の由 来、調製及び特性解析」について」（平成１２年７月１４日付け医薬審第８７３号厚生省医 薬安全局審査管理課長通知）


      ＩＣＨＱ６Ｂガイドライン 「生物薬品（バイオテクノロジー応用医薬品／生物起源由来医薬品）の規格及び試験方法 の設定について」（平成１３年５月１日付け医薬審発第５７１号厚生労働省医薬局審査管 理課長通知）'
