      - nid: cha4.sec4_2.p4_20
        kind: paragraph
        kind_raw: '4.20'
        num: '4.20'
        ord: 104
        heading: null
        text: 製品の品質に影響を与えるおそれのある全てのユーティリティ(例えば、蒸気、ガ ス、圧縮空気及び加熱・換気空調システム：ＨＶＡＣ)は管理規格に適合するとと もに、適切にモニターされること。また、限界値を超えた場合には、必要な措置を 講じること。これらのユーティリティシステムの図面は利用できるようにしておく こと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:512
        - source_label: PMDA API GMP guideline
