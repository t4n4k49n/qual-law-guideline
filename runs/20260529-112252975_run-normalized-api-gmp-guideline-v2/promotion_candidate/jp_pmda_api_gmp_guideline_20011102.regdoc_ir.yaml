      kind: section
      kind_raw: '18.2'
      num: '18.2'
      ord: 454
      heading: 細胞バンクの保守及び記録の保管
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
