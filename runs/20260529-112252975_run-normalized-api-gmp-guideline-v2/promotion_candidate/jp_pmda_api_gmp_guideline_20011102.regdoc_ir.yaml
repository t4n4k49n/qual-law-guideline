        heading: null
        text: ある装置を用いて、同じ中間体・原薬の連続するロットを継続生産又は期間生産（キ ャンペーン生産）する場合には、汚染物質（例えば、分解物、一定レベルの微生物） の生成及びキャリーオーバーを防止するため、当該装置を適切な間隔で清掃するこ と。
