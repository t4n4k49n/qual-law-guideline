        heading: null
        text: "プロセスバリデーションの作業を始める前に、重要な装置及び付帯設備の適格性 評価を完了すること。適格性評価は、通常、以下の作業を個々に、又は組み合わせ て実施する： ‑設計時適格性評価（ＤＱ）：設備、装置又はシステムが目的とする用途に適切であ ることを確認し文書化すること。\n                     ：据付け又は改良した装置又はシステムが承認を受\n‑設備据付時適格性評価（ＩＱ） けた設計及び製造業者の要求と整合することを確認し文書化すること。 ‑運転時適格性評価（ＯＱ）：据付け又は改良した装置又はシステムが予期した運転 範囲で意図したように作動することを確認し文書化すること。\n                  ：設備及びそれに付随する補助装置及びシステムが、承認\n‑性能適格性評価（ＰＱ） された製造方法及び規格に基づき、効果的かつ再現性よく機能できることを確認し 文書化すること。"
