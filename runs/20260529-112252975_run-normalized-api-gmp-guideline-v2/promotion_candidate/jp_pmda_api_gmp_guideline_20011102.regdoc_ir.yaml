        children: []
      - nid: cha11.sec11_2.p11_21
        kind: paragraph
        kind_raw: '11.21'
        num: '11.21'
        ord: 307
        heading: null
        text: 一定に管理された製造工程で製造された代表的なロットに存在する、同定済み及 び未同定の不純物を記述した不純物プロファイルを、通常、原薬ごとに設定するこ と。不純物プロファイルには、同定、幾つかの定性的な分析指標(例えば、保持時 間)、認められる各不純物の範囲及び同定されている不純物の分類(例えば、無機、 有機、溶媒)が含まれる。不純物プロファイルは、通常、原薬の製造工程及び起源 によって決まる。不純物プロファイルは、通常、生薬又は動物組織由来の原薬には 必要ではない。バイオテクノロジーを用いた場合については、ＩＣＨＱ６Ｂガイド ラインに記載されている。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
