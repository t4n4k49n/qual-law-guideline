          locator: line:712
        - source_label: PMDA API GMP guideline
          locator: line:713
        - source_label: PMDA API GMP guideline
          locator: line:714
        children: []
    - nid: cha5.sec5_4
      kind: section
      kind_raw: '5.4'
      num: '5.4'
      ord: 152
      heading: コンピュータ化システム
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:717
      children:
      - nid: cha5.sec5_4.p5_40
        kind: paragraph
        kind_raw: '5.40'
        num: '5.40'
        ord: 153
        heading: null
        text: ＧＭＰに関連するコンピュータ化システムについては、バリデーションを実施する こと。なお、バリデーションの程度及び適用範囲は、コンピュータ化されたアプリ ケーションの多様性、複雑性及び重要性によるものである。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:720
        - source_label: PMDA API GMP guideline
          locator: line:721
        - source_label: PMDA API GMP guideline
          locator: line:722
        children: []
      - nid: cha5.sec5_4.p5_41
        kind: paragraph
        kind_raw: '5.41'
        num: '5.41'
        ord: 154
        heading: null
        text: コンピュータのハードウエア及びソフトウエアについては、適切な据付時適格性評 価及び運転時適格性評価により、課せられた業務の実行に適合していることを実証 すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:725
        - source_label: PMDA API GMP guideline
          locator: line:726
        - source_label: PMDA API GMP guideline
          locator: line:727
        children: []
      - nid: cha5.sec5_4.p5_42
        kind: paragraph
        kind_raw: '5.42'
        num: '5.42'
        ord: 155
        heading: null
        text: 既に適格性が確認されている市販のソフトウエアについては、同じレベルの検査は 必要でない。なお、既存のシステムについて、据付時にバリデーションが実施され ていない場合には、適切な文書化された記録が入手できるならば、回顧的バリデー ションにより検証する場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:730
        - source_label: PMDA API GMP guideline
          locator: line:731
        - source_label: PMDA API GMP guideline
          locator: line:732
        - source_label: PMDA API GMP guideline
          locator: line:733
        children: []
      - nid: cha5.sec5_4.p5_43
        kind: paragraph
        kind_raw: '5.43'
        num: '5.43'
        ord: 156
        heading: null
        text: コンピュータ化システムについては、データに対する承認されていないアクセス又 は変更を防止するために十分な管理を行うこと。また、データの脱落(例えば、シ ステムの切断及びデータの不捕捉)を防止するための管理を行うこと。なお、デー タの変更については、全てのデータ変更、変更前のデータ、変更者、変更時期を記 録すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:736
        - source_label: PMDA API GMP guideline
          locator: line:737
        - source_label: PMDA API GMP guideline
          locator: line:738
        - source_label: PMDA API GMP guideline
          locator: line:739
        - source_label: PMDA API GMP guideline
          locator: line:740
        children: []
      - nid: cha5.sec5_4.p5_44
        kind: paragraph
        kind_raw: '5.44'
        num: '5.44'
        ord: 157
        heading: null
        text: コンピュータ化システムの運転及び保守については、文書化した手順が用意されて いること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:743
        - source_label: PMDA API GMP guideline
          locator: line:744
        children: []
      - nid: cha5.sec5_4.p5_45
        kind: paragraph
        kind_raw: '5.45'
        num: '5.45'
        ord: 158
        heading: null
        text: 重要なデータを手動で入力した場合は、さらに入力の正確性の確認を行うこと。こ れは別の作業者又はシステム自体により行われる場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:747
        - source_label: PMDA API GMP guideline
          locator: line:748
        children: []
      - nid: cha5.sec5_4.p5_46
        kind: paragraph
        kind_raw: '5.46'
        num: '5.46'
        ord: 159
        heading: null
        text: 中間体・原薬の品質もしくは記録又は試験結果の信頼性に影響を与えるおそれのあ るコンピュータ化システムに係る事故については、記録し、調査すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:751
        - source_label: PMDA API GMP guideline
          locator: line:752
        children: []
      - nid: cha5.sec5_4.p5_47
        kind: paragraph
        kind_raw: '5.47'
        num: '5.47'
        ord: 160
        heading: null
        text: コンピュータ化システムに対する変更は、変更手順に従って行い、また、正式に承 認し、文書化し、検査すること。システムのハードウエア、ソフトウエア及びその 他全ての重要な構成について行った修正及び拡張を含む変更に係る記録を保管す ること。これらの記録は最終システムが検証された状態に保守されていることを実 証するものであること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:755
        - source_label: PMDA API GMP guideline
          locator: line:756
        - source_label: PMDA API GMP guideline
          locator: line:757
        - source_label: PMDA API GMP guideline
          locator: line:758
        - source_label: PMDA API GMP guideline
          locator: line:759
        children: []
      - nid: cha5.sec5_4.p5_48
        kind: paragraph
        kind_raw: '5.48'
        num: '5.48'
        ord: 161
        heading: null
        text: システムの破損又は故障が記録の永久的な消失を招く場合には、バックアップシス テムを準備すること。また、データの保護を保証する対策を、全てのコンピュータ 化システムについて設定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:762
        - source_label: PMDA API GMP guideline
          locator: line:763
        - source_label: PMDA API GMP guideline
          locator: line:764
        children: []
      - nid: cha5.sec5_4.p5_49
        kind: paragraph
        kind_raw: '5.49'
        num: '5.49'
        ord: 162
        heading: null
        text: データはコンピュータシステムに加え、別方法により記録される場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:767
