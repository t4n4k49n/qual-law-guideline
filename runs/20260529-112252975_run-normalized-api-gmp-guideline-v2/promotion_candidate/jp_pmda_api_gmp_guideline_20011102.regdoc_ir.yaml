          locator: line:2267
        - source_label: PMDA API GMP guideline
          locator: line:2268
        - source_label: PMDA API GMP guideline
          locator: line:2269
        children: []
      - nid: cha18.sec18_4.p18_43
        kind: paragraph
        kind_raw: '18.43'
        num: '18.43'
        ord: 474
        heading: null
        text: 開放システムを使用する場合、精製は製品の品質を保持するのに適切に管理した 環境条件で実施すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:2272
        - source_label: PMDA API GMP guideline
          locator: line:2273
        children: []
      - nid: cha18.sec18_4.p18_44
        kind: paragraph
        kind_raw: '18.44'
        num: '18.44'
        ord: 475
        heading: null
        text: 装置を複数の製品に使用する場合、専用クロマトグラフィー用樹脂の使用、追加 試験等、追加的な管理が適切な場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
