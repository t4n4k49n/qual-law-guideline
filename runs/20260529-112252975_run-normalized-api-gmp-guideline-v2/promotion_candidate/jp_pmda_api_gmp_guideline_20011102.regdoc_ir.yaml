        heading: null
        text: 、 工程完了に係る時間制限が製造指図書原本に示されている場合（第6.41章参照） 当該時間制限は中間体・原薬の品質保証に適うものであること。時間制限が逸脱し た場合には、それを記録し、評価すること。なお、例えば、ｐＨ調整、水素添加、 設定規格値までの乾燥等、工程が一定の目標値をもって進められる場合、反応・工 程段階の終了時点は、工程内での検体採取及び試験により定められるため、時間制 限を規格として設定することは不適当である。
