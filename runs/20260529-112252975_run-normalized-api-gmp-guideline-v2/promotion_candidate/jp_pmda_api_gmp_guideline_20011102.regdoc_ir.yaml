            locator: line:1689
          children: []
        - nid: cha12.sec12_4.p12_44.i3
          kind: item
          kind_raw: (3)
          num: '3'
          ord: 354
          heading: null
          text: 作業者のミス以外の原因に起因する重要工程の不具合や製品の不良、及び、装置の 適合性と関係なく起きる装置不具合がないこと；さらに
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
