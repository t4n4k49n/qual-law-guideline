        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1324
        children: []
      - nid: cha9.sec9_4.p9_41
        kind: paragraph
        kind_raw: '9.41'
        num: '9.41'
        ord: 277
        heading: null
        text: 表示作業は混同を防止するように配慮すること。また、他の中間体・原薬の表示作 業から物理的又は空間的に分けること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1327
        - source_label: PMDA API GMP guideline
          locator: line:1328
        children: []
      - nid: cha9.sec9_4.p9_42
        kind: paragraph
        kind_raw: '9.42'
        num: '9.42'
        ord: 278
        heading: null
        text: 中間体・原薬の容器に用いるラベルには、名称又は識別コード、製品のロット番号 を、及び、保管条件が当該中間体・原薬の品質を保証するのに重要な情報である場 合は当該保管条件を記載すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1331
        - source_label: PMDA API GMP guideline
          locator: line:1332
        - source_label: PMDA API GMP guideline
          locator: line:1333
        children: []
      - nid: cha9.sec9_4.p9_43
        kind: paragraph
        kind_raw: '9.43'
        num: '9.43'
        ord: 279
        heading: null
        text: 中間体・原薬を製造業者の管理外へ移動しようとする場合には、当該製造業者の名 称及び住所、内容量及び特殊な輸送条件並びに全ての法的要件をラベルに記載する こと。使用期限のある中間体・原薬の場合には、使用期限をそのラベル及び試験成 績書に記載すること。リテスト日が定められた中間体・原薬の場合には、リテスト 日をラベル又は試験成績書に記載すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1336
        - source_label: PMDA API GMP guideline
          locator: line:1337
        - source_label: PMDA API GMP guideline
          locator: line:1338
        - source_label: PMDA API GMP guideline
          locator: line:1339
        - source_label: PMDA API GMP guideline
          locator: line:1340
        children: []
      - nid: cha9.sec9_4.p9_44
        kind: paragraph
        kind_raw: '9.44'
        num: '9.44'
        ord: 280
        heading: null
        text: 包装・表示設備を使用直前に点検し、次回の包装作業に不必要な全ての原材料等が 除去されていることを確認すること。この点検について、ロット製造指図・記録、 設備日誌又はその他の記録システムに記録すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
