        - source_label: PMDA API GMP guideline
          locator: line:493
        children: []
      - nid: cha4.sec4_1.p4_15
        kind: paragraph
        kind_raw: '4.15'
        num: '4.15'
        ord: 101
        heading: null
        text: 適切で清潔な手洗い設備及びトイレット設備を従業員に用意すること。これらの手 洗い設備には、必要な場合には、水又は温水を備えること。また、石鹸又は洗剤並 びにエアドライヤー又は使い捨てタオルを備えること。手洗い設備及びトイレット 設備は作業区域から分離し、かつ、容易に利用できるように配置すること。必要な 場合は、シャワーや更衣のための適切な設備を設置すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:496
        - source_label: PMDA API GMP guideline
          locator: line:497
        - source_label: PMDA API GMP guideline
          locator: line:498
        - source_label: PMDA API GMP guideline
          locator: line:499
        - source_label: PMDA API GMP guideline
          locator: line:500
        children: []
      - nid: cha4.sec4_1.p4_16
        kind: paragraph
        kind_raw: '4.16'
        num: '4.16'
        ord: 102
        heading: null
        text: 試験区域・試験作業は、通常、製造区域から分離すること。ただし、特に工程内管 理に使用する試験区域については、製造工程の作業が試験測定の精度に悪影響を与 えず、また、試験室及びその作業が、製造工程、中間体・原薬に悪影響を与えなけ れば、製造区域に配置する場合がある。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
