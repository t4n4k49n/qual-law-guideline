        ord: 286
        heading: null
        text: 区分保管され、不合格判定を受け、返品され、又は回収された原材料等について は、目的外又は未許可の使用を防止するための代替システムがない限り、今後の使 い方を決定するまでの一時保管用の分離した保管区域を設けること。
