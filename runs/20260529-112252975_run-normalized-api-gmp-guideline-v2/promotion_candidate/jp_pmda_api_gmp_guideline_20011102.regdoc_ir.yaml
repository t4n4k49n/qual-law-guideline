          locator: line:1220
        - source_label: PMDA API GMP guideline
          locator: line:1221
        children: []
      - nid: cha8.sec8_4.p8_44
        kind: paragraph
        kind_raw: '8.44'
        num: '8.44'
        ord: 250
        heading: null
        text: 混合工程に係るロット記録は、混合を行った各ロットを追跡できるように記録する こと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
