        num: '2.10'
        ord: 35
        heading: null
        text: 品質は原薬の生産に関係する全ての人々の責任であること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:284
        children: []
      - nid: cha2.sec2_1.p2_11
        kind: paragraph
        kind_raw: '2.11'
        num: '2.11'
        ord: 36
        heading: null
        text: 製造業者は、効果的な品質マネージメント体制を確立し、それを文書化し、実施す ること。なお、この品質マネージメント体制は、経営者及び製造に従事する者が積 極的に関与すべきものであること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:287
        - source_label: PMDA API GMP guideline
          locator: line:288
        - source_label: PMDA API GMP guideline
          locator: line:289
        children: []
      - nid: cha2.sec2_1.p2_12
        kind: paragraph
        kind_raw: '2.12'
        num: '2.12'
        ord: 37
        heading: null
        text: 品質マネージメント体制には、組織構成、手順、工程、資源の他、原薬が目的とす る規格に適合する信頼性を保証するために必要な活動が含まれていること。品質に 係る全ての活動を明確に示し、文書化すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:292
        - source_label: PMDA API GMP guideline
          locator: line:293
        - source_label: PMDA API GMP guideline
          locator: line:294
        children: []
      - nid: cha2.sec2_1.p2_13
        kind: paragraph
        kind_raw: '2.13'
        num: '2.13'
        ord: 38
        heading: null
        text: 品質部門は製造部門から独立し、品質保証（ＱＡ）及び品質管理（ＱＣ）の責任を 果たすこと。なお、品質部門は、組織の規模及び構成により、別々のＱＡ部門及び ＱＣ部門の形態をとる場合があり、また、個人又はグループの形態をとる場合があ る。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:297
        - source_label: PMDA API GMP guideline
          locator: line:298
        - source_label: PMDA API GMP guideline
          locator: line:299
        - source_label: PMDA API GMP guideline
          locator: line:300
        children: []
      - nid: cha2.sec2_1.p2_14
        kind: paragraph
        kind_raw: '2.14'
        num: '2.14'
        ord: 39
        heading: null
        text: 中間体・原薬の出荷判定者を特定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:303
        children: []
      - nid: cha2.sec2_1.p2_15
        kind: paragraph
        kind_raw: '2.15'
        num: '2.15'
        ord: 40
        heading: null
        text: 品質に係る全ての活動は、それを実施した時点で記録すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:306
        children: []
      - nid: cha2.sec2_1.p2_16
        kind: paragraph
        kind_raw: '2.16'
        num: '2.16'
        ord: 41
        heading: null
        text: 設定手順からの逸脱は、いかなるものも記録し、その内容を明らかにすること。重 大な逸脱については、原因を調査し、その調査内容及び結論を記録すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:309
        - source_label: PMDA API GMP guideline
          locator: line:310
        children: []
      - nid: cha2.sec2_1.p2_17
        kind: paragraph
        kind_raw: '2.17'
        num: '2.17'
        ord: 42
        heading: null
        text: 原材料、中間体、原薬等（以下「原材料等」という。）は、品質部門の評価が十分 に完了するまで、出荷・使用を行わないこと。ただし、第10.20章に示された区分 保管中の中間体・原薬の出荷、もしくは評価が未完了の原材料・中間体の使用を許 可する適切なシステムが存在する場合はこの限りではない。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:313
        - source_label: PMDA API GMP guideline
          locator: line:314
        - source_label: PMDA API GMP guideline
          locator: line:315
        - source_label: PMDA API GMP guideline
          locator: line:316
        children: []
      - nid: cha2.sec2_1.p2_18
        kind: paragraph
        kind_raw: '2.18'
        num: '2.18'
        ord: 43
        heading: null
        text: 規制当局の査察、重大なＧＭＰの逸脱、製品欠陥及びこれらに関連する措置(例え ば、品質に係る苦情、回収、規制への対応等)について、適切な時期に責任ある経 営者又は管理者に報告する手順書を用意すること。
