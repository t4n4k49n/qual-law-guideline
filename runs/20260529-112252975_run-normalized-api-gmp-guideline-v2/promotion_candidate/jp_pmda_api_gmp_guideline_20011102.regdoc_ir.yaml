      - nid: cha11.sec11_4.p11_41
        kind: paragraph
        kind_raw: '11.41'
        num: '11.41'
        ord: 313
        heading: null
        text: 中間体・原薬の名称に関する情報は、必要に応じて、グレード、ロット番号及び 出荷判定の日付を含めて、試験成績書に記載すること。使用期限を有する中間体・ 原薬の場合には、当該使用期限をラベル及び試験成績書に記載すること。リテスト 日を有する中間体・原薬の場合には、リテスト日をラベル又は試験成績書に記載す ること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
