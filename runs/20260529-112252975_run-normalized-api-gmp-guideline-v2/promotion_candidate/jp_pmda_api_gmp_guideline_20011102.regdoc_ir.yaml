        kind: paragraph
        kind_raw: '5.11'
        num: '5.11'
        ord: 131
        heading: null
        text: 原料、中間体・原薬が装置の表面と接触することにより、中間体・原薬の品質が公 定規格又は他の設定規格を超えて変質することのないように、装置を組み立てるこ と。
