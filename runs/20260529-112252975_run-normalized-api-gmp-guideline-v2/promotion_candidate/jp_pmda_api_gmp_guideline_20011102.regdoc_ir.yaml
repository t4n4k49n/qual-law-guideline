        kind: paragraph
        kind_raw: '7.40'
        num: '7.40'
        ord: 217
        heading: null
        text: 原材料等は、分解、汚染及び交叉汚染を防止するよう、取り扱い、保管すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
