      - nid: cha12.sec12_8.p12_80
        kind: paragraph
        kind_raw: '12.80'
        num: '12.80'
        ord: 372
        heading: null
        text: 採用する分析法が、薬局方又はその他認知された参考文献に収載されていない場 合には、バリデーションを行うこと。バリデーションが実施されていない場合でも、 使用する全ての試験方法の適合性を実際の使用条件で証明し、記録すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1793
        - source_label: PMDA API GMP guideline
          locator: line:1794
        - source_label: PMDA API GMP guideline
          locator: line:1795
        children: []
      - nid: cha12.sec12_8.p12_81
        kind: paragraph
        kind_raw: '12.81'
        num: '12.81'
        ord: 373
        heading: null
        text: 分析法は、分析法のバリデーションに関するＩＣＨガイドラインに含まれる特性 を考慮して、バリデーションを行うこと。実施する分析のバリデーションの程度は 分析の目的及び原薬工程の段階を反映するものとすること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1798
        - source_label: PMDA API GMP guideline
          locator: line:1799
        - source_label: PMDA API GMP guideline
          locator: line:1800
        children: []
      - nid: cha12.sec12_8.p12_82
        kind: paragraph
        kind_raw: '12.82'
        num: '12.82'
        ord: 374
        heading: null
        text: 分析法のバリデーションを開始する前に、分析装置の適切な適格性評価を検討す ること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1803
        - source_label: PMDA API GMP guideline
          locator: line:1804
        children: []
      - nid: cha12.sec12_8.p12_83
        kind: paragraph
        kind_raw: '12.83'
        num: '12.83'
        ord: 375
        heading: null
        text: バリデーションを行った分析法に係る全ての修正について、完全な記録を保管す ること。当該記録には、修正の理由及び修正された方法が確立した方法と同様に正 確で信頼できる結果をもたらすものであることを証明する適切なデータを含める こと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1807
        - source_label: PMDA API GMP guideline
