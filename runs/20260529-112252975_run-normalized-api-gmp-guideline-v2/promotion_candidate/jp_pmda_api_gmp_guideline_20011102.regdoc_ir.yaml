        num: '6.10'
        ord: 165
        heading: null
        text: 中間体・原薬の生産に係る全ての文書については、文書化された手順に従い、作成 し、照査し、承認し、配布すること。これらの文書は、書面又は電子媒体を用いる 場合がある。
        role: normative
        normativity: must
        tags: []
