      - nid: cha4.sec4_3.p4_34
        kind: paragraph
        kind_raw: '4.34'
        num: '4.34'
        ord: 114
        heading: null
        text: 非無菌原薬を、更なる処理を経て、無菌医薬品製剤の製造に使用しようとする場合 には、当該非無菌原薬としての最終の分離及び精製工程において使用する水は、生 菌数、特定微生物及びエンドトキシンについてモニターし、管理すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
