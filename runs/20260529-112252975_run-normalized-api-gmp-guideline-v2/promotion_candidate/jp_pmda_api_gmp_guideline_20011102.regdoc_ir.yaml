          locator: line:1269
        - source_label: PMDA API GMP guideline
          locator: line:1270
        children: []
      - nid: cha9.sec9_1.p9_12
        kind: paragraph
        kind_raw: '9.12'
        num: '9.12'
        ord: 262
        heading: null
        text: 包装材料及び表示材料の出庫ごとに、受入れ、試験・検査及び適否を示す記録を保 管すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1273
        - source_label: PMDA API GMP guideline
          locator: line:1274
        children: []
    - nid: cha9.sec9_2
      kind: section
      kind_raw: '9.2'
      num: '9.2'
      ord: 263
      heading: 包装材料
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:1277
      children:
      - nid: cha9.sec9_2.p9_20
        kind: paragraph
        kind_raw: '9.20'
        num: '9.20'
        ord: 264
        heading: null
        text: 容器は、中間体・原薬の輸送中及び定められた条件での保管中に発生するおそれの ある当該中間体・原薬の変質又は汚染を適切に防止するものであること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1280
        - source_label: PMDA API GMP guideline
          locator: line:1281
        children: []
      - nid: cha9.sec9_2.p9_21
        kind: paragraph
        kind_raw: '9.21'
        num: '9.21'
        ord: 265
        heading: null
        text: 容器は清浄なものであり、中間体・原薬の特性により必要な場合には、その使用目 的に適していることを保証するために消毒すること。また、容器は、規定した限界 値を超えて中間体・原薬の品質を変化させるような反応性、付着性又は吸着性を有 さないこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1282
        - source_label: PMDA API GMP guideline
          locator: line:1283
        - source_label: PMDA API GMP guideline
          locator: line:1284
        - source_label: PMDA API GMP guideline
          locator: line:1285
        children: []
      - nid: cha9.sec9_2.p9_22
        kind: paragraph
        kind_raw: '9.22'
        num: '9.22'
        ord: 266
        heading: null
        text: 容器を再使用する場合には、文書化した手順に従って洗浄し、前回使用した全ての ラベル類を除去するか、又はその表示内容を消すこと。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1288
        - source_label: PMDA API GMP guideline
          locator: line:1289
        children: []
    - nid: cha9.sec9_3
      kind: section
      kind_raw: '9.3'
      num: '9.3'
      ord: 267
      heading: ラベルの発行及び管理
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:1292
      children:
      - nid: cha9.sec9_3.p9_30
        kind: paragraph
        kind_raw: '9.30'
        num: '9.30'
        ord: 268
        heading: null
        text: ラベルの保管区域への出入りは、許可された従業員に限定すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1295
        children: []
      - nid: cha9.sec9_3.p9_31
        kind: paragraph
        kind_raw: '9.31'
        num: '9.31'
        ord: 269
        heading: null
        text: ラベルの発行、使用及び返却の数量を確認し、ラベルを貼付した容器数と発行した ラベル数との間に不一致が生じた場合には、これを評価すること。この不一致につ いては調査を行い、その調査は品質部門により承認を受けること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1298
        - source_label: PMDA API GMP guideline
          locator: line:1299
        - source_label: PMDA API GMP guideline
          locator: line:1300
        children: []
      - nid: cha9.sec9_3.p9_32
        kind: paragraph
        kind_raw: '9.32'
        num: '9.32'
        ord: 270
        heading: null
        text: ロット番号又はロットに関連するその他の印刷が入った余剰ラベルは全て破棄す ること。返却ラベルは、混同を防止し、適切な確認を行い得る方法で保管すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1303
        - source_label: PMDA API GMP guideline
          locator: line:1304
        children: []
      - nid: cha9.sec9_3.p9_33
        kind: paragraph
        kind_raw: '9.33'
        num: '9.33'
        ord: 271
        heading: null
        text: 旧版及び期限切れのラベルは破棄すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1307
        children: []
      - nid: cha9.sec9_3.p9_34
        kind: paragraph
        kind_raw: '9.34'
        num: '9.34'
        ord: 272
        heading: null
        text: 包装作業用のラベルの印刷に用いる印刷機は、全ての印刷の結果がロット製造指 図・記録での規定に適合するように管理すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1310
        - source_label: PMDA API GMP guideline
          locator: line:1311
        children: []
      - nid: cha9.sec9_3.p9_35
        kind: paragraph
        kind_raw: '9.35'
        num: '9.35'
        ord: 273
        heading: null
        text: ロット用に発行した印刷ラベルは、製造指図書原本の規格に適合し、適切に表示し ていることを注意深く検査すること。この検査の結果は記録すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1314
        - source_label: PMDA API GMP guideline
          locator: line:1315
        children: []
      - nid: cha9.sec9_3.p9_36
        kind: paragraph
        kind_raw: '9.36'
        num: '9.36'
        ord: 274
        heading: null
        text: 使用したラベルの代表となる印刷ラベルをロット製造指図・記録に添付すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1318
        children: []
