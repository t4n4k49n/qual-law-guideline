        children: []
    - nid: cha7.sec7_2
      kind: section
      kind_raw: '7.2'
      num: '7.2'
      ord: 203
      heading: 受入及び区分保管
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA API GMP guideline
        locator: line:1004
      children:
      - nid: cha7.sec7_2.p7_20
        kind: paragraph
        kind_raw: '7.20'
        num: '7.20'
        ord: 204
        heading: null
        text: 原材料等を受入れし、使用が許可される前に、原材料等の各容器又は一群の容器の ラベル表示（供給者が使用する名前と社内において使用する名前が異なる場合には、 両者の関係に関する記載も含む。）、容器の破損、封緘の破損、無断書き換え、汚染 等について外観を目視検査すること。原材料等は、検体を採取し、必要な試験検査 を行い、使用が許可されるまでの間は、区分保管すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1007
        - source_label: PMDA API GMP guideline
          locator: line:1008
        - source_label: PMDA API GMP guideline
          locator: line:1009
        - source_label: PMDA API GMP guideline
          locator: line:1010
        - source_label: PMDA API GMP guideline
          locator: line:1011
        children: []
      - nid: cha7.sec7_2.p7_21
        kind: paragraph
        kind_raw: '7.21'
        num: '7.21'
        ord: 205
        heading: null
        text: 新たに入荷した原材料等を在庫品（例えば、サイロ内の溶媒や保管物）と混合する 場合には、当該原材料等が正しいものと識別され、また、必要な場合には試験を行 った上で、使用すること。新たな入荷原材料等と在庫品との不適切な混同を防止す るため、必要な手順を設けること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1014
        - source_label: PMDA API GMP guideline
          locator: line:1015
        - source_label: PMDA API GMP guideline
          locator: line:1016
        - source_label: PMDA API GMP guideline
          locator: line:1017
        children: []
      - nid: cha7.sec7_2.p7_22
        kind: paragraph
        kind_raw: '7.22'
        num: '7.22'
        ord: 206
        heading: null
        text: バルクが専用ではないタンクにより輸送される場合、タンクからの交叉汚染が発生 しないことを保証すること。その保証の手段としては、次の方法があり得る。 ‑洗浄済証明書 ‑微量不純物の試験 ‑供給業者の査察
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1020
        - source_label: PMDA API GMP guideline
          locator: line:1021
        - source_label: PMDA API GMP guideline
          locator: line:1022
        - source_label: PMDA API GMP guideline
          locator: line:1023
        - source_label: PMDA API GMP guideline
          locator: line:1024
        children: []
      - nid: cha7.sec7_2.p7_23
        kind: paragraph
        kind_raw: '7.23'
        num: '7.23'
        ord: 207
        heading: null
        text: 大容量の貯蔵容器、付属配管類、充填、取り出し配管等は適切に識別されているこ と。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA API GMP guideline
          locator: line:1027
        - source_label: PMDA API GMP guideline
          locator: line:1028
        children: []
      - nid: cha7.sec7_2.p7_24
        kind: paragraph
        kind_raw: '7.24'
        num: '7.24'
        ord: 208
        heading: null
        text: 原材料等を入れた個々の容器又は一群の容器（ロット）には、識別コード、ロット 番号及び受領番号を付して確認できるようにすること。各ロットの移動の際には、 この番号を使用すること。各ロットの状態を確認する体制を有すること。
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
