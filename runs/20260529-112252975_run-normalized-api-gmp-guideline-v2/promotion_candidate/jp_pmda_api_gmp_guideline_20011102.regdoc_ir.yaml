          kind: item
          kind_raw: (2)
          num: '2'
          ord: 353
          heading: null
          text: 適切な工程内試験の判定基準及び管理が設定されていること；
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
