          locator: line:1208
        - source_label: PMDA API GMP guideline
          locator: line:1209
        - source_label: PMDA API GMP guideline
          locator: line:1210
        children: []
      - nid: cha8.sec8_4.p8_42
        kind: paragraph
        kind_raw: '8.42'
        num: '8.42'
        ord: 248
        heading: null
        text: 許容される混合作業には、例えば以下の場合が含まれるが、それに限定されるもの ではない： ‑ロットサイズを大きくするために、小ロットを混合する場合 ‑単一ロットを作るために、中間体・原薬のロットの端数品（即ち、比較的少量の半 端品）を混合する場合
        role: normative
