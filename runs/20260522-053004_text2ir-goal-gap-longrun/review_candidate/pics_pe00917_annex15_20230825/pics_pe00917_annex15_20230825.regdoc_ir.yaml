        kind: paragraph
        kind_raw: '10.9'
        num: '10.9'
        ord: 126
        heading: null
        text: Where campaign manufacture is carried out, the impact on the ease of cleaning at the end of the campaign should be considered and the maximum length of a campaign (in time and/or number of batches) should be the basis for cleaning validation exercises.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:612
        - source_label: PIC/S
          locator: line:613
        - source_label: PIC/S
          locator: line:614
        - source_label: PIC/S
          locator: line:615
        children: []
      - nid: ann15.sec10.p10_10
        kind: paragraph
        kind_raw: '10.10'
        num: '10.10'
        ord: 127
        heading: null
        text: 'Where a worst case product approach is used as a cleaning validation model, a scientific rationale should be provided for the selection of the worst case product and the impact of new products to the site assessed. Criteria for determining the worst case may include solubility, cleanability, toxicity, and potency.


          2         In the EU/EEA, this is the EMA Guideline on setting health based exposure limits for use in risk identification in the manufacture of different medicinal products in shared facilities'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
