        kind: paragraph
        kind_raw: '11.1'
        num: '11.1'
        ord: 134
        heading: null
        text: The control of change is an important part of knowledge management and should be handled within the pharmaceutical quality system.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
