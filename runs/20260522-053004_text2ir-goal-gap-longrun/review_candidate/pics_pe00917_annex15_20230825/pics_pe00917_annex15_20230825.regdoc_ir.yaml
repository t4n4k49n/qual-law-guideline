            locator: line:209
          - source_label: PIC/S
            locator: line:210
          children: []
        - nid: ann15.sec3.p3_11.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 47
          heading: null
          text: "Tests to confirm upper and lower operating limits, and/or “worst case”\n                 conditions."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:211
          - source_label: PIC/S
            locator: line:212
          children: []
      - nid: ann15.sec3.p3_12
        kind: paragraph
        kind_raw: '3.12'
        num: '3.12'
        ord: 48
        heading: null
        text: "The completion of a successful OQ should allow the finalisation of standard\n              operating and cleaning procedures, operator training and preventative\n              maintenance requirements.\nPerformance qualification (PQ)"
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:214
        - source_label: PIC/S
          locator: line:215
        - source_label: PIC/S
          locator: line:216
        - source_label: PIC/S
          locator: line:226
        children: []
      - nid: ann15.sec3.p3_13
        kind: paragraph
        kind_raw: '3.13'
        num: '3.13'
        ord: 49
        heading: null
        text: "PQ should normally follow the successful completion of IQ and OQ. However, it\n              may in some cases be appropriate to perform it in conjunction with OQ or Process\n              Validation."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:228
        - source_label: PIC/S
          locator: line:229
        - source_label: PIC/S
          locator: line:230
        children: []
      - nid: ann15.sec3.p3_14
        kind: paragraph
        kind_raw: '3.14'
        num: '3.14'
        ord: 50
        heading: null
        text: 'PQ should include, but is not limited to the following:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:232
        children:
        - nid: ann15.sec3.p3_14.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 51
          heading: null
          text: "Tests, using production materials, qualified substitutes or simulated product\n                proven to have equivalent behaviour under normal operating conditions with\n                worst case batch sizes. The frequency of sampling used to confirm process\n                control should be justified;"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:234
          - source_label: PIC/S
            locator: line:235
          - source_label: PIC/S
            locator: line:236
          - source_label: PIC/S
            locator: line:237
          children: []
        - nid: ann15.sec3.p3_14.iii
          kind: item
          kind_raw: ii.
          num: ii
          ord: 52
          heading: null
          text: "Tests should cover the operating range of the intended process, unless\n                documented evidence from the development phases confirming the\n                operational ranges is available."
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:238
          - source_label: PIC/S
            locator: line:239
          - source_label: PIC/S
