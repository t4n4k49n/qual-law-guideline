        num: '6.1'
        ord: 102
        heading: null
        text: Finished medicinal products, investigational medicinal products, bulk product and samples should be transported from manufacturing sites in accordance with the conditions defined in the marketing authorisation, the approved label, product specification file or as justified by the manufacturer.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
