        kind: paragraph
        kind_raw: '11.4'
        num: '11.4'
        ord: 137
        heading: null
        text: Quality risk management should be used to evaluate planned changes to determine the potential impact on product quality, pharmaceutical quality systems, documentation, validation, regulatory status, calibration, maintenance and on any other system to avoid unintended consequences and to plan for any necessary process validation, verification or requalification efforts.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
