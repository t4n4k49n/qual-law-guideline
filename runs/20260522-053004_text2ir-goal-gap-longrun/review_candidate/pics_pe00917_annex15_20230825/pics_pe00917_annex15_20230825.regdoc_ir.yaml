        children: []
      - nid: ann15.sec5.p5_27
        kind: paragraph
        kind_raw: '5.27'
        num: '5.27'
        ord: 95
        heading: null
        text: 'This approach may also be used for any validation activities after changes or during ongoing process verification even though the product was initially validated using a traditional approach.


          Ongoing Process Verification during Lifecycle'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
