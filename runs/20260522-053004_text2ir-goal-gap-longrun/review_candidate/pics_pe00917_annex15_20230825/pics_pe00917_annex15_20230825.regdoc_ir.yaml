          locator: line:464
        - source_label: PIC/S
          locator: line:465
        children: []
      - nid: ann15.sec5.p5_29
        kind: paragraph
        kind_raw: '5.29'
        num: '5.29'
        ord: 97
        heading: null
        text: Manufacturers should monitor product quality to ensure that a state of control is maintained throughout the product lifecycle with the relevant process trends evaluated.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:467
        - source_label: PIC/S
          locator: line:468
        - source_label: PIC/S
          locator: line:469
        children: []
      - nid: ann15.sec5.p5_30
        kind: paragraph
        kind_raw: '5.30'
        num: '5.30'
        ord: 98
        heading: null
        text: The extent and frequency of ongoing process verification should be reviewed periodically. At any point throughout the product lifecycle, it may be appropriate to modify the requirements taking into account the current level of process understanding and process performance.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:471
        - source_label: PIC/S
          locator: line:472
        - source_label: PIC/S
          locator: line:473
        - source_label: PIC/S
          locator: line:474
        children: []
      - nid: ann15.sec5.p5_31
        kind: paragraph
        kind_raw: '5.31'
        num: '5.31'
        ord: 99
        heading: null
        text: Ongoing process verification should be conducted under an approved protocol or equivalent documents and a corresponding report should be prepared to document the results obtained. Statistical tools should be used, where appropriate, to support any conclusions with regard to the variability and capability of a given process and ensure a state of control.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:476
        - source_label: PIC/S
          locator: line:477
        - source_label: PIC/S
          locator: line:478
        - source_label: PIC/S
          locator: line:479
        - source_label: PIC/S
          locator: line:480
        children: []
      - nid: ann15.sec5.p5_32
        kind: paragraph
        kind_raw: '5.32'
        num: '5.32'
        ord: 100
        heading: null
        text: Ongoing process verification should be used throughout the product lifecycle to support the validated status of the product as documented in the Product Quality Review. Incremental changes over time should also be considered and the need for any additional actions, e.g. enhanced sampling, should be assessed.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
