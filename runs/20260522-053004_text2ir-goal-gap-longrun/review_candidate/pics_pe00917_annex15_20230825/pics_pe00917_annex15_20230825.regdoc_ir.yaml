        - source_label: PIC/S
          locator: line:496
        - source_label: PIC/S
          locator: line:497
        children: []
      - nid: ann15.sec6.p6_3
        kind: paragraph
        kind_raw: '6.3'
        num: '6.3'
        ord: 104
        heading: null
        text: A risk assessment should be performed to consider the impact of variables in the transportation process other than those conditions which are continuously controlled or monitored, e.g. delays during transportation, failure of monitoring devices, topping up liquid nitrogen, product susceptibility and any other relevant factors.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
