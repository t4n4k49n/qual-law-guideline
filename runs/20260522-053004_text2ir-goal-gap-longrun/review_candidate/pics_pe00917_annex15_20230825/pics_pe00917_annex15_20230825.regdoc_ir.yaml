        ord: 76
        heading: null
        text: Without prejudice to 5.19, it is generally considered acceptable that a minimum of three consecutive batches manufactured under routine conditions could constitute a validation of the process. An alternative number of batches may be justified taking into account whether standard methods of manufacture are used and whether similar products or processes are already used at the site. An initial validation exercise with three batches may need to be supplemented with further data obtained from subsequent batches as part of an on-going process verification exercise.
