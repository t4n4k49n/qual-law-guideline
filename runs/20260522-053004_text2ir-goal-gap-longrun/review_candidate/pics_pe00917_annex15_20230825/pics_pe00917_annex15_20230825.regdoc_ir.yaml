        kind: paragraph
        kind_raw: '6.4'
        num: '6.4'
        ord: 105
        heading: null
        text: Due to the variable conditions expected during transportation, continuous monitoring and recording of any critical environmental conditions to which the product may be subjected should be performed, unless otherwise justified.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
