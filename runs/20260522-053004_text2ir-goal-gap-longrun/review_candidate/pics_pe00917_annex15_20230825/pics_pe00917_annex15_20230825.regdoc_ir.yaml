        children: []
      - nid: ann15.sec6.p6_2
        kind: paragraph
        kind_raw: '6.2'
        num: '6.2'
        ord: 103
        heading: null
        text: It is recognised that verification of transportation may be challenging due to the variable factors involved however, transportation routes should be clearly defined. Seasonal and other variations should also be considered during verification of transport
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
