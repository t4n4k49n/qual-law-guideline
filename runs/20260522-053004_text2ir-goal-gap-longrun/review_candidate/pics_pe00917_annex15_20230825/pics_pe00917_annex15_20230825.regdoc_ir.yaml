      - nid: ann15.sec3.p3_10
        kind: paragraph
        kind_raw: '3.10'
        num: '3.10'
        ord: 44
        heading: null
        text: "OQ normally follows IQ but depending on the complexity of the equipment, it may\n              be performed as a combined Installation/Operation Qualification (IOQ)."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
