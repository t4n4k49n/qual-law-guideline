        kind: paragraph
        kind_raw: '11.3'
        num: '11.3'
        ord: 136
        heading: null
        text: Where design space is used, the impact on changes to the design space should be considered against the registered design space within the marketing authorisation and the need for any regulatory actions assessed.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
