        kind: paragraph
        kind_raw: '7.1'
        num: '7.1'
        ord: 107
        heading: null
        text: Variation in equipment processing parameters especially during primary packaging may have a significant impact on the integrity and correct functioning of the pack, e.g. blister strips, sachets and sterile components; therefore primary and secondary packaging equipment for finished and bulk products should be qualified.
        role: normative
        normativity: must
        tags: []
        refs:
