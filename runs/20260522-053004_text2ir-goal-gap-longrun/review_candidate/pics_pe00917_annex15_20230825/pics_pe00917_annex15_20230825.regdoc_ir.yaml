        - source_label: PIC/S
          locator: line:624
        children: []
      - nid: ann15.sec10.p10_11
        kind: paragraph
        kind_raw: '10.11'
        num: '10.11'
        ord: 128
        heading: null
        text: Cleaning validation protocols should specify or reference the locations to be sampled, the rationale for the selection of these locations and define the acceptance criteria.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:634
        - source_label: PIC/S
          locator: line:635
