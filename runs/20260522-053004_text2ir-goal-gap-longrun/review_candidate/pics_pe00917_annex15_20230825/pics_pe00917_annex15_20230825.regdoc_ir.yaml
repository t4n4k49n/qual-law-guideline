      - nid: ann15.sec9.p9_2
        kind: paragraph
        kind_raw: '9.2'
        num: '9.2'
        ord: 115
        heading: null
        text: Where microbial testing of product is carried out, the method should be validated to confirm that the product does not influence the recovery of microorganisms.
        role: normative
        normativity: must
        tags: []
        refs:
