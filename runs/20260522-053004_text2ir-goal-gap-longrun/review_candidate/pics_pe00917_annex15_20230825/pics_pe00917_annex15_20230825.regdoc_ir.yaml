        kind: paragraph
        kind_raw: '5.26'
        num: '5.26'
        ord: 94
        heading: null
        text: "A hybrid of the traditional approach and continuous process verification could be\n              used where there is a substantial amount of product and process knowledge and\n              understanding which has been gained from manufacturing experience and\n              historical batch data."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
