        kind: paragraph
        kind_raw: '3.11'
        num: '3.11'
        ord: 45
        heading: null
        text: 'OQ should include but is not limited to the following:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:207
        children:
        - nid: ann15.sec3.p3_11.ii
          kind: item
          kind_raw: i.
          num: i
          ord: 46
          heading: null
          text: "Tests that have been developed from the knowledge of processes, systems\n                 and equipment to ensure the system is operating as designed;"
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
