          locator: line:640
        - source_label: PIC/S
          locator: line:641
        - source_label: PIC/S
          locator: line:642
        children: []
      - nid: ann15.sec10.p10_13
        kind: paragraph
        kind_raw: '10.13'
        num: '10.13'
        ord: 130
        heading: null
        text: The cleaning procedure should be performed an appropriate number of times based on a risk assessment and meet the acceptance criteria in order to prove that the cleaning method is validated.
