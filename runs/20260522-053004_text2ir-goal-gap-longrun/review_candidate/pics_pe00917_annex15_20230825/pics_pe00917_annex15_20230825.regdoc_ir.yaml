        kind: paragraph
        kind_raw: '10.12'
        num: '10.12'
        ord: 129
        heading: null
        text: Sampling should be carried out by swabbing and/or rinsing or by other means depending on the production equipment. The sampling materials and method should not influence the result. Recovery should be shown to be possible from all product contact materials sampled in the equipment with all the sampling methods used.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
