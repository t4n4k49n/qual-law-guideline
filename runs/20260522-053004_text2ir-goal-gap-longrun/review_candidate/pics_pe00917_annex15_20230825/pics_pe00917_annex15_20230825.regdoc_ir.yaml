        kind: paragraph
        kind_raw: '9.3'
        num: '9.3'
        ord: 116
        heading: null
        text: Where microbial testing of surfaces in clean rooms is carried out, validation should be performed on the test method to confirm that sanitising agents do not influence the recovery of microorganisms.
        role: normative
        normativity: must
        tags: []
        refs:
