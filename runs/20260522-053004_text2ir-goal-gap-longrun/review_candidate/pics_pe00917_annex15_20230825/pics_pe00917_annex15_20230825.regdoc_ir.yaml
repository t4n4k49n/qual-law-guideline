        kind: paragraph
        kind_raw: '5.25'
        num: '5.25'
        ord: 93
        heading: null
        text: 'The general principles laid down in 5.1 – 5.14 above still apply.


          Hybrid approach'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
