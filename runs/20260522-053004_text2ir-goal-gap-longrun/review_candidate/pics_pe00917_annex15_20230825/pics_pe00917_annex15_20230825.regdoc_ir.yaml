    - nid: ann15.sec10
      kind: section
      kind_raw: '2.'
      num: '10'
      ord: 117
      heading: CLEANING VALIDATION
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:556
      children:
      - nid: ann15.sec10.p10_1
        kind: paragraph
        kind_raw: '10.1'
        num: '10.1'
        ord: 118
        heading: null
        text: Cleaning validation should be performed in order to confirm the effectiveness of any cleaning procedure for all product contact equipment. Simulating agents may be used with appropriate scientific justification. Where similar types of equipment are grouped together, a justification of the specific equipment selected for cleaning validation is expected.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:557
        - source_label: PIC/S
          locator: line:558
        - source_label: PIC/S
          locator: line:559
        - source_label: PIC/S
          locator: line:560
        - source_label: PIC/S
          locator: line:561
        children: []
      - nid: ann15.sec10.p10_2
        kind: paragraph
        kind_raw: '10.2'
        num: '10.2'
        ord: 119
        heading: null
        text: 'A visual check for cleanliness is an important part of the acceptance criteria for cleaning validation. It is not generally acceptable for this criterion alone to be


          used. Repeated cleaning and retesting until acceptable residue results are obtained is not considered an acceptable approach.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:563
        - source_label: PIC/S
          locator: line:564
        - source_label: PIC/S
          locator: line:572
        - source_label: PIC/S
          locator: line:573
        children: []
      - nid: ann15.sec10.p10_3
        kind: paragraph
        kind_raw: '10.3'
        num: '10.3'
        ord: 120
        heading: null
        text: It is recognised that a cleaning validation programme may take some time to complete and validation with verification after each batch may be required for some products e.g. investigational medicinal products. There should be sufficient data from the verification to support a conclusion that the equipment is clean and available for further use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:575
        - source_label: PIC/S
          locator: line:576
        - source_label: PIC/S
          locator: line:577
        - source_label: PIC/S
          locator: line:578
        - source_label: PIC/S
          locator: line:579
        children: []
      - nid: ann15.sec10.p10_4
        kind: paragraph
        kind_raw: '10.4'
        num: '10.4'
        ord: 121
        heading: null
        text: Validation should consider the level of automation in the cleaning process. Where an automatic process is used, the specified normal operating range of the utilities and equipment should be validated.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:581
        - source_label: PIC/S
          locator: line:582
        - source_label: PIC/S
          locator: line:583
        children: []
      - nid: ann15.sec10.p10_5
        kind: paragraph
        kind_raw: '10.5'
        num: '10.5'
        ord: 122
        heading: null
        text: For all cleaning processes an assessment should be performed to determine the variable factors which influence cleaning effectiveness and performance, e.g. operators, the level of detail in procedures such as rinsing times etc. If variable factors have been identified, the worst case situations should be used as the basis for cleaning validation studies.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:585
        - source_label: PIC/S
          locator: line:586
        - source_label: PIC/S
          locator: line:587
        - source_label: PIC/S
          locator: line:588
        - source_label: PIC/S
          locator: line:589
        children: []
      - nid: ann15.sec10.p10_6
        kind: paragraph
        kind_raw: '10.6'
        num: '10.6'
        ord: 123
        heading: null
        text: 'Limits for the carryover of product residues should be based on a toxicological evaluation2. The justification for the selected limits should be documented in a risk assessment which includes all the supporting references. Limits should be established for the removal of any cleaning agents used. Acceptance criteria should consider the potential cumulative effect of multiple items of equipment in the process equipment train.


          10.6.1 Therapeutic macromolecules and peptides are known to degrade and denature when exposed to pH extremes and/or heat, and may become pharmacologically inactive. A toxicological evaluation may therefore not be applicable in these circumstances. 10.6.2 If it is not feasible to test for specific product residues, other representative parameters may be selected, e.g. total organic carbon (TOC) and conductivity.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:591
        - source_label: PIC/S
          locator: line:592
        - source_label: PIC/S
          locator: line:593
        - source_label: PIC/S
          locator: line:594
        - source_label: PIC/S
          locator: line:595
        - source_label: PIC/S
          locator: line:596
        - source_label: PIC/S
          locator: line:598
        - source_label: PIC/S
          locator: line:599
        - source_label: PIC/S
          locator: line:600
        - source_label: PIC/S
          locator: line:601
        - source_label: PIC/S
          locator: line:602
        - source_label: PIC/S
          locator: line:603
        children: []
      - nid: ann15.sec10.p10_7
        kind: paragraph
        kind_raw: '10.7'
        num: '10.7'
        ord: 124
        heading: null
        text: The risk presented by microbial and endotoxin contamination should be considered during the development of cleaning validation protocols.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:605
        - source_label: PIC/S
          locator: line:606
        children: []
      - nid: ann15.sec10.p10_8
        kind: paragraph
        kind_raw: '10.8'
        num: '10.8'
        ord: 125
        heading: null
        text: The influence of the time between manufacture and cleaning and the time between cleaning and use should be taken into account to define dirty and clean hold times for the cleaning process.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
