        children: []
      - nid: ann15.sec5.p5_28
        kind: paragraph
        kind_raw: '5.28'
        num: '5.28'
        ord: 96
        heading: null
        text: Paragraphs 5.28-5.32 are applicable to all three approaches to process validation mentioned above, i.e. traditional, continuous and hybrid.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
