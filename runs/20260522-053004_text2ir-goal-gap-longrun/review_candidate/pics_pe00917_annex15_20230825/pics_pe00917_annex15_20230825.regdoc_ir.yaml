      - nid: ann15.sec5.p5_23
        kind: paragraph
        kind_raw: '5.23'
        num: '5.23'
        ord: 91
        heading: null
        text: "For products developed by a quality by design approach, where it has been\n              scientifically established during development that the established control strategy\n              provides a high degree of assurance of product quality, then continuous process\n              verification can be used as an alternative to traditional process validation."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:426
        - source_label: PIC/S
          locator: line:427
        - source_label: PIC/S
          locator: line:428
        - source_label: PIC/S
          locator: line:429
        children: []
      - nid: ann15.sec5.p5_24
        kind: paragraph
        kind_raw: '5.24'
        num: '5.24'
        ord: 92
        heading: null
        text: "The method by which the process will be verified should be defined. There should\n              be a science based control strategy for the required attributes for incoming\n              materials, critical quality attributes and critical process parameters to confirm\n              product realisation. This should also include regular evaluation of the control\n              strategy. Process Analytical Technology and multivariate statistical process\n              control may be used as tools. Each manufacturer must determine and justify the\n              number of batches necessary to demonstrate a high level of assurance that the\n              process is capable of consistently delivering quality product."
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:431
        - source_label: PIC/S
          locator: line:432
