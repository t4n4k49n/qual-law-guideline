        children: []
      - nid: ann15.sec11.p11_2
        kind: paragraph
        kind_raw: '11.2'
        num: '11.2'
        ord: 135
        heading: null
        text: Written procedures should be in place to describe the actions to be taken if a planned change is proposed to a starting material, product component, process, equipment, premises, product range, method of production or testing, batch size, design space or any other change during the lifecycle that may affect product quality or reproducibility.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:662
        - source_label: PIC/S
