        kind: paragraph
        kind_raw: '10.14'
        num: '10.14'
        ord: 131
        heading: null
        text: Where a cleaning process is ineffective or is not appropriate for some equipment, dedicated equipment or other appropriate measures should be used for each product as indicated in chapters 3 and 5 of the PIC/S GMP Guide.
