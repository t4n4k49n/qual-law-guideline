        kind: paragraph
        kind_raw: '3.12'
        num: '3.12'
        ord: 25
        heading: null
        text: Production areas should be effectively ventilated, with air control facilities (including temperature and, where necessary, humidity and filtration) appropriate both to the products handled, to the operations undertaken within them and to the external environment.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
