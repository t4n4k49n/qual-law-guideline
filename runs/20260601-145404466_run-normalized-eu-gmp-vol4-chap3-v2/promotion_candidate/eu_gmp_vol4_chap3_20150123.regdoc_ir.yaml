        kind: paragraph
        kind_raw: '3.11'
        num: '3.11'
        ord: 24
        heading: null
        text: Drains should be of adequate size, and have trapped gullies. Open channels should be avoided where possible, but if necessary, they should be shallow to facilitate cleaning and disinfection.
        role: normative
        normativity: must
