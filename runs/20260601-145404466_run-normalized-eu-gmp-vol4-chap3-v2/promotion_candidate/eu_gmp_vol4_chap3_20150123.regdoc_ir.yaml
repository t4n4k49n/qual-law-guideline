        num: '3.14'
        ord: 27
        heading: null
        text: In cases where dust is generated (e.g. during sampling, weighing, mixing and processing operations, packaging of dry products), specific provisions should be taken to avoid cross-contamination and facilitate cleaning.
        role: normative
        normativity: must
        tags: []
        refs:
