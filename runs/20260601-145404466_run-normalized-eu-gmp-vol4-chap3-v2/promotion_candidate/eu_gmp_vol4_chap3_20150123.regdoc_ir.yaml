        kind: paragraph
        kind_raw: '3.15'
        num: '3.15'
        ord: 28
        heading: null
        text: Premises for the packaging of medicinal products should be specifically designed and laid out so as to avoid mix-ups or cross-contamination.
        role: normative
        normativity: must
