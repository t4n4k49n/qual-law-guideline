        num: '3.19'
        ord: 33
        heading: null
        text: Storage areas should be designed or adapted to ensure good storage conditions. In particular, they should be clean and dry and maintained within acceptable temperature limits. Where special storage conditions are required (e.g. temperature, humidity) these should be provided, checked and monitored.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
