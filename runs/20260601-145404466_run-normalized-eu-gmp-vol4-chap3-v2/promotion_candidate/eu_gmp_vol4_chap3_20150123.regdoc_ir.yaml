        kind: paragraph
        kind_raw: '3.22'
        num: '3.22'
        ord: 36
        heading: null
        text: There should normally be a separate sampling area for starting materials. If sampling is performed in the storage area, it should be conducted in such a way as to prevent contamination or cross-contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
