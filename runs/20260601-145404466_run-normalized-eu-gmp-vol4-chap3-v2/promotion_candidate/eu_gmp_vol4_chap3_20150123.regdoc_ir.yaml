          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:188
        children: []
      - nid: cha3.sec5.p3_25
        kind: paragraph
        kind_raw: '3.25'
        num: '3.25'
        ord: 39
        heading: null
        text: Printed packaging materials are considered critical to the conformity of the medicinal product and special attention should be paid to the safe and secure storage of these materials.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:190
        - source_label: EU GMP
          locator: line:191
        - source_label: EU GMP
          locator: line:192
        children: []
    - nid: cha3.sec6
      kind: section
      kind_raw: null
      num: null
      ord: 40
      heading: Quality Control Areas
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: EU GMP
        locator: line:194
      children:
      - nid: cha3.sec6.p3_26
        kind: paragraph
        kind_raw: '3.26'
        num: '3.26'
        ord: 41
        heading: null
        text: Normally, Quality Control laboratories should be separated from production areas. This is particularly important for laboratories for the control of biologicals, microbiologicals and radioisotopes, which should also be separated from each other.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:196
        - source_label: EU GMP
          locator: line:197
        - source_label: EU GMP
          locator: line:198
        children: []
      - nid: cha3.sec6.p3_27
        kind: paragraph
        kind_raw: '3.27'
        num: '3.27'
        ord: 42
        heading: null
        text: Control laboratories should be designed to suit the operations to be carried out in them. Sufficient space should be given to avoid mix-ups and cross-contamination. There should be adequate suitable storage space for samples and records.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:200
        - source_label: EU GMP
          locator: line:201
        - source_label: EU GMP
          locator: line:202
        children: []
      - nid: cha3.sec6.p3_28
        kind: paragraph
        kind_raw: '3.28'
        num: '3.28'
        ord: 43
        heading: null
        text: Separate rooms may be necessary to protect sensitive instruments from vibration, electrical interference, humidity, etc.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:204
        - source_label: EU GMP
          locator: line:205
        children: []
      - nid: cha3.sec6.p3_29
        kind: paragraph
        kind_raw: '3.29'
        num: '3.29'
        ord: 44
        heading: null
        text: Special requirements are needed in laboratories handling particular substances, such as biological or radioactive samples.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:207
        - source_label: EU GMP
          locator: line:208
        children: []
    - nid: cha3.sec7
      kind: section
      kind_raw: null
      num: null
      ord: 45
      heading: Ancillary Areas
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: EU GMP
        locator: line:210
      children:
      - nid: cha3.sec7.p3_30
        kind: paragraph
        kind_raw: '3.30'
        num: '3.30'
        ord: 46
        heading: null
        text: Rest and refreshment rooms should be separate from other areas.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:212
        children: []
      - nid: cha3.sec7.p3_31
        kind: paragraph
        kind_raw: '3.31'
        num: '3.31'
        ord: 47
        heading: null
        text: Facilities for changing clothes and for washing and toilet purposes should be easily accessible and appropriate for the number of users. Toilets should not directly communicate with production or storage areas.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:214
        - source_label: EU GMP
          locator: line:215
        - source_label: EU GMP
          locator: line:216
        children: []
      - nid: cha3.sec7.p3_32
        kind: paragraph
        kind_raw: '3.32'
        num: '3.32'
        ord: 48
        heading: null
        text: Maintenance workshops should as far as possible be separated from production areas. Whenever parts and tools are stored in the production area, they should be kept in rooms or lockers reserved for that use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:218
        - source_label: EU GMP
          locator: line:219
        - source_label: EU GMP
          locator: line:220
        children: []
      - nid: cha3.sec7.p3_33
        kind: paragraph
        kind_raw: '3.33'
        num: '3.33'
        ord: 49
        heading: null
        text: Animal houses should be well isolated from other areas, with separate entrance (animal access) and air handling facilities.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:222
        - source_label: EU GMP
          locator: line:223
        children: []
    - nid: cha3.sec8
      kind: section
      kind_raw: null
      num: null
      ord: 50
      heading: EQUIPMENT
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: EU GMP
        locator: line:225
      children:
      - nid: cha3.sec8.p3_34
        kind: paragraph
        kind_raw: '3.34'
        num: '3.34'
        ord: 51
        heading: null
        text: Manufacturing equipment should be designed, located and maintained to suit its intended purpose.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:227
        - source_label: EU GMP
          locator: line:228
        children: []
      - nid: cha3.sec8.p3_35
        kind: paragraph
        kind_raw: '3.35'
        num: '3.35'
        ord: 52
        heading: null
        text: Repair and maintenance operations should not present any hazard to the quality of the products.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:230
        - source_label: EU GMP
          locator: line:231
        children: []
      - nid: cha3.sec8.p3_36
        kind: paragraph
        kind_raw: '3.36'
        num: '3.36'
        ord: 53
        heading: null
        text: Manufacturing equipment should be designed so that it can be easily and thoroughly cleaned. It should be cleaned according to detailed and written procedures and stored only in a clean and dry condition.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:233
        - source_label: EU GMP
          locator: line:234
        - source_label: EU GMP
          locator: line:235
        children: []
      - nid: cha3.sec8.p3_37
        kind: paragraph
        kind_raw: '3.37'
        num: '3.37'
        ord: 54
        heading: null
        text: Washing and cleaning equipment should be chosen and used in order not to be a source of contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:237
        - source_label: EU GMP
          locator: line:238
        children: []
      - nid: cha3.sec8.p3_38
        kind: paragraph
        kind_raw: '3.38'
        num: '3.38'
        ord: 55
        heading: null
        text: Equipment should be installed in such a way as to prevent any risk of error or of contamination.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:240
        - source_label: EU GMP
          locator: line:241
        children: []
      - nid: cha3.sec8.p3_39
        kind: paragraph
        kind_raw: '3.39'
        num: '3.39'
        ord: 56
        heading: null
        text: Production equipment should not present any hazard to products. Parts of production equipment that come into contact with the product must not be reactive, additive or absorptive to such an extent that it will affect the quality of the product and thus present any hazard.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:243
        - source_label: EU GMP
          locator: line:244
        - source_label: EU GMP
          locator: line:245
        - source_label: EU GMP
          locator: line:246
        children: []
      - nid: cha3.sec8.p3_40
        kind: paragraph
        kind_raw: '3.40'
        num: '3.40'
        ord: 57
        heading: null
        text: Balances and measuring equipment of an appropriate range and precision should be available for production and control operations.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:248
        - source_label: EU GMP
          locator: line:249
        children: []
      - nid: cha3.sec8.p3_41
        kind: paragraph
        kind_raw: '3.41'
        num: '3.41'
        ord: 58
        heading: null
        text: Measuring, weighing, recording and control equipment should be calibrated and checked at defined intervals by appropriate methods. Adequate records of such tests should be maintained.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:251
        - source_label: EU GMP
          locator: line:252
        - source_label: EU GMP
          locator: line:253
        children: []
      - nid: cha3.sec8.p3_42
        kind: paragraph
        kind_raw: '3.42'
        num: '3.42'
        ord: 59
        heading: null
        text: Fixed pipework should be clearly labelled to indicate the contents and, where applicable, the direction of flow.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:255
        - source_label: EU GMP
          locator: line:256
        children: []
      - nid: cha3.sec8.p3_43
        kind: paragraph
        kind_raw: '3.43'
        num: '3.43'
        ord: 60
        heading: null
        text: Distilled, deionised and, where appropriate, other water pipes should be sanitised according to written procedures that detail the action limits for microbiological contamination and the measures to be taken.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:258
        - source_label: EU GMP
          locator: line:259
        - source_label: EU GMP
          locator: line:260
        children: []
      - nid: cha3.sec8.p3_44
        kind: paragraph
        kind_raw: '3.44'
        num: '3.44'
        ord: 61
        heading: null
        text: Defective equipment should, if possible, be removed from production and quality control areas, or at least be clearly labelled as defective.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: EU GMP
          locator: line:262
        - source_label: EU GMP
          locator: line:263
