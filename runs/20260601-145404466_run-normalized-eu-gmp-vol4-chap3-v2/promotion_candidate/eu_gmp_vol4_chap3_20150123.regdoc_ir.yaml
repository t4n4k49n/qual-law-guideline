      - nid: cha3.sec4.p3_6
        kind: paragraph
        kind_raw: '3.6'
        num: '3.6'
        ord: 15
        heading: null
        text: 'Cross-contamination should be prevented for all products by appropriate design and operation of manufacturing facilities. The measures to prevent cross-contamination should be commensurate with the risks. Quality Risk Management principles should be used to assess and control the risks. Depending of the level of risk, it may be necessary to dedicate premises and equipment for manufacturing and/or packaging operations to control the risk presented by some medicinal products. Dedicated facilities are required for manufacturing when a medicinal product presents a risk because:'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
