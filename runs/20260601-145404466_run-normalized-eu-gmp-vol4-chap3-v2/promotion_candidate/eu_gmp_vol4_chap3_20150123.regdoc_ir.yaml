        kind: paragraph
        kind_raw: '3.21'
        num: '3.21'
        ord: 35
        heading: null
        text: Where quarantine status is ensured by storage in separate areas, these areas must be clearly marked and their access restricted to authorised personnel. Any system replacing the physical quarantine should give equivalent security.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
