        kind: paragraph
        kind_raw: '3.8'
        num: '3.8'
        ord: 21
        heading: null
        text: The adequacy of the working and in-process storage space should permit the orderly and logical positioning of equipment and materials so as to minimise the risk of confusion between different medicinal products or their components, to avoid cross-contamination and to minimise the risk of omission or wrong application of any of the manufacturing or control steps.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
