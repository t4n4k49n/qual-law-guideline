        kind: paragraph
        kind_raw: '3.10'
        num: '3.10'
        ord: 23
        heading: null
        text: Pipework, light fittings, ventilation points and other services should be designed and sited to avoid the creation of recesses which are difficult to clean. As far as possible, for maintenance purposes, they should be accessible from outside the manufacturing areas.
        role: normative
        normativity: must
        tags: []
