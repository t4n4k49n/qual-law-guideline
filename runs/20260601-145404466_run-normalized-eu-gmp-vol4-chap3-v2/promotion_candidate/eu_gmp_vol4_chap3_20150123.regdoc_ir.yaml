    heading: Premises and Equipment
    text: 'Legal basis for publishing the detailed guidelines: Article 47 of Directive 2001/83/EC on the Community code relating to medicinal products for human use and Article 51 of Directive 2001/82/EC on the Community code relating to veterinary medicinal products. This document provides guidance for the interpretation of the principles and guidelines of good manufacturing practice (GMP) for medicinal products as laid down in Directive 2003/94/EC for medicinal products for human use and Directive 91/412/EEC for veterinary use. Status of the document: Revision. Reasons for changes: The only change is to section 6 as part of the improved guidance on prevention of cross-contamination involving also Chapter 5. Deadline for coming into operation: 1 March 2015. However, the toxicological evaluation mentioned in section 6 is to be carried out:'
    role: structural
