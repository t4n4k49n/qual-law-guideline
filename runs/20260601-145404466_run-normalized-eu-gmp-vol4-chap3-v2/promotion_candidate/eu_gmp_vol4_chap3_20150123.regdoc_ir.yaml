        kind: paragraph
        kind_raw: '3.13'
        num: '3.13'
        ord: 26
        heading: null
        text: Weighing of starting materials usually should be carried out in a separate weighing room designed for such use.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
