        kind: paragraph
        kind_raw: '3.2'
        num: '3.2'
        ord: 10
        heading: null
        text: Premises should be carefully maintained, ensuring that repair and maintenance operations do not present any hazard to the quality of products. They should be cleaned and, where applicable, disinfected according to detailed written procedures.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
