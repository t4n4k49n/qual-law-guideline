        kind: paragraph
        kind_raw: '3.20'
        num: '3.20'
        ord: 34
        heading: null
        text: Receiving and dispatch bays should protect materials and products from the weather. Reception areas should be designed and equipped to allow containers of incoming materials to be cleaned where necessary before storage.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
