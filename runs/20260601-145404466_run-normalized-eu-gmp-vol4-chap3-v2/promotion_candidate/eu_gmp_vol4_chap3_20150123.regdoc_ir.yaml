      kind: section
      kind_raw: null
      num: null
      ord: 6
      heading: PRINCIPLE
      text: Premises and equipment must be located, designed, constructed, adapted and maintained to suit the operations to be carried out. Their layout and design must aim to minimise the risk of errors and permit effective cleaning and maintenance in order to avoid cross-contamination, build-up of dust or dirt and, in general, any adverse effect on the quality of products.
      role: structural
      normativity: null
