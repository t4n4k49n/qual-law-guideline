        num: '3.3'
        ord: 11
        heading: null
        text: Lighting, temperature, humidity and ventilation should be appropriate and such that they do not adversely affect, directly or indirectly, either the medicinal products during their manufacture and storage, or the accurate functioning of equipment.
        role: normative
        normativity: must
        tags: []
