        kind: paragraph
        kind_raw: '3.18'
        num: '3.18'
        ord: 32
        heading: null
        text: 'Storage areas should be of sufficient capacity to allow orderly storage of the various categories of materials and products: starting and packaging materials, intermediate, bulk and finished products, products in quarantine, released, rejected, returned or recalled.'
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
