        kind: paragraph
        kind_raw: '3.7'
        num: '3.7'
        ord: 20
        heading: null
        text: Premises should preferably be laid out in such a way as to allow the production to take place in areas connected in a logical order corresponding to the sequence of the operations and to the requisite cleanliness levels.
        role: normative
        normativity: must
        tags: []
        refs:
