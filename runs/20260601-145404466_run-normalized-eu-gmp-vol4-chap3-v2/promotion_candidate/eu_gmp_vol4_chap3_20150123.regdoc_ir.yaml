        kind_raw: '3.5'
        num: '3.5'
        ord: 13
        heading: null
        text: Steps should be taken in order to prevent the entry of unauthorised people. Production, storage and quality control areas should not be used as a right of way by personnel who do not work in them.
        role: normative
        normativity: must
        tags: []
        refs:
