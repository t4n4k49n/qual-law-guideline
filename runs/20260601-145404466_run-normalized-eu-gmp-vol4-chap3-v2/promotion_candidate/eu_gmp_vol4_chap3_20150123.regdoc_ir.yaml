        kind: paragraph
        kind_raw: '3.9'
        num: '3.9'
        ord: 22
        heading: null
        text: Where starting and primary packaging materials, intermediate or bulk products are exposed to the environment, interior surfaces (walls, floors and ceilings) should be smooth, free from cracks and open joints, and should not shed particulate matter and should permit easy and effective cleaning and, if necessary, disinfection.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
