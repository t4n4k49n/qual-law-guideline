schema: qai.parser_profile.v1
id: pics_part1_default_v3
title: PIC/S PE 009-17 Part I markers (full-doc, drop TOC/headers/footers)
applies_to:
  family: PICS
  jurisdiction: INTL
  defaults: true
language: en
source_label: PIC/S
preprocess:
  drop_line_regexes:
  - (?i)^\s*PE\s*009-17\s*\(Annexes\)\s*-\s*(?:\d{1,3}|[ivxlcdm]+)\s*-\s*25\s+August\s+2023\s*$
  - ^\s*-\s*(?:\d{1,3}|[ivxlcdm]+)\s*-\s*$
  - (?i)^\s*web\s+site:\s*https?://\S+\s*$
  - (?i)^\s*PE\s*009-17\s*\(Part\s+I\)\s*-\s*(?:\d{1,3}|[ivxlcdm]+)\s*-\s*25\s+August\s+2023\s*$
  - ^\s*Chapter\s+\d{1,2}\s+[A-Za-z].*$
  - (?i)^(?!CHAPTER\b)[A-Z][A-Z\s/&\-]{3,80}\s+\d{1,3}\s*$
  strip_inline_regexes:
  - (?i)(?<=\S)\s+PE\s*009-17\s*\(Annexes\)\s*-\s*(?:\d{1,3}|[ivxlcdm]+)\s*-\s*25\s+August\s+2023\s*$
  - (?i)(?<=\S)Annex\s+\d+[A-Z]?\s+[A-Za-z].{0,200}$
  - '[\x00-\x1F]'
  - (?i)(?<=\S)Chapter\s+\d{1,2}\s+[A-Za-z][A-Za-z\s/&\-]{0,80}$
  drop_repeated_structural_headers:
    enabled: true
    kinds:
    - chapter
  merge_structural_heading_continuations:
    enabled: true
    kinds:
    - chapter
    max_next_line_len: 120
    max_merge_lines: 2
    max_blank_lookahead: 2
  skip_blocks:
  - start_regex: (?i)^TABLE OF CONTENTS?\s*$
    end_regex: (?i)^CHAPTER\s+1(?!\s*-).*$
    include_start: false
    include_end: true
    max_lines: 2000
  detect_plaintext_tables:
    enabled: true
    min_rows: 2
    max_rows: 80
    mode: conservative
  extract_notes:
    enabled: true
    max_lines: 40
context_root_kind: chapter
structural_kinds:
- chapter
marker_types:
- id: chapter
  kind: chapter
  kind_raw: CHAPTER
  match: ^CHAPTER\s+(?P<num>\d{1,2})(?!\s*-)\b\s*
  num_group: num
- id: paragraph_decimal
  kind: paragraph
  kind_raw: '1.1'
  match: ^(?P<n>\d{1,2}\.\d+)\s+
  num_group: n
- id: item_paren_roman
  kind: item
  kind_raw: (i)
  match: ^\((?P<n>[ivxlcdm]+)\)\s+
  num_group: n
- id: bullet
  kind: subitem
  kind_raw: •
  match: ^\s*[•]\s+
structure:
  root:
    children:
    - chapter
  chapter:
    children:
    - paragraph
    - item
    - subitem
    - table
    - preformatted
    - note
    - history
  paragraph:
    children:
    - item
    - subitem
    - note
    - history
  item:
    children:
    - subitem
    - note
    - history
  subitem:
    children:
    - note
    - history
  table:
    children:
    - table_header
    - note
  table_header:
    children:
    - table_row
  table_row:
    children: []
  preformatted:
    children:
    - note
  note:
    children: []
  history:
    children: []
compound_prefix:
  enabled: false
  max_depth: 1
