    - nid: cha1.p1_11
      kind: paragraph
      kind_raw: '1.11'
      num: '1.11'
      ord: 67
      heading: null
      text: 'The manufacturer and, where different, Marketing Authorisation holder should evaluate the results of the review and an assessment made as to whether corrective and preventive action or any revalidation should be undertaken, under the Pharmaceutical Quality System. There should be management procedures for the ongoing management and review of these actions and the effectiveness of these procedures verified during self-inspection. Quality reviews may be


        grouped by product type, e.g. solid dosage forms, liquid dosage forms, sterile products, etc. where scientifically justified.


        Where the Marketing Authorisation holder is not the manufacturer, there should be a technical agreement in place between the various parties that defines their respective responsibilities in producing the product quality review. The Authorised Person responsible for final batch certification together with the Marketing Authorisation holder should ensure that the quality review is performed in a timely manner and is accurate.


