        locator: line:2458
      children: []
    - nid: cha6.p6_35
      kind: paragraph
      kind_raw: '6.35'
      num: '6.35'
      ord: 283
      heading: null
      text: Out of specification or significant atypical trends should be investigated. Any confirmed out of specification result, or significant negative trend, affecting product batches released on the market should be reported to the relevant competent authorities. The possible impact on batches on the market should be considered in accordance with Chapter 8 of the GMP Guide and in consultation with the relevant competent authorities.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
