  - nid: cha1
    kind: chapter
    kind_raw: CHAPTER
    num: '1'
    ord: 2
    heading: PHARMACEUTICAL QUALITY SYSTEM
    text: 'PRINCIPLE The holder of a Manufacturing Authorisation must manufacture medicinal products so as to ensure that they are fit for their intended use, comply with the requirements of the Marketing Authorisation or Clinical Trial Authorisation, as appropriate, and do not place patients at risk due to inadequate safety, quality or efficacy. The attainment of this quality objective is the responsibility of senior management and requires the participation and commitment by staff in many different departments and at all levels within the company, by the company’s suppliers and by its distributors. To achieve this quality objective reliably there must be a comprehensively designed and correctly implemented Pharmaceutical Quality System incorporating Good Manufacturing Practice and Quality Risk Management. It should be fully documented and its effectiveness monitored. All parts of the Pharmaceutical Quality System should be adequately resourced with competent personnel, and suitable and sufficient premises, equipment and facilities. There are additional legal responsibilities for the holder of the Manufacturing Authorisation and for the Authorised Person(s).


      The basic concepts of Quality Management, Good Manufacturing Practice (GMP) and Quality Risk Management are inter-related. They are described here in order to emphasise their relationships and their fundamental importance to the production and control of medicinal products.'
    role: structural
    normativity: null
    tags: []
