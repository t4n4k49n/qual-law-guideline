    - nid: cha5.p5_21
      kind: paragraph
      kind_raw: '5.21'
      num: '5.21'
      ord: 164
      heading: null
      text: "The outcome of the Quality Risk Management process should be the basis for determining the extent of technical and organisational measures required to control risks for cross-contamination. These could include, but are not limited to, the following:\n\nTechnical Measures\n       i.    Dedicated manufacturing facility (premises and equipment);\n       ii.   Self-contained production areas having separate processing equipment and\n             separate heating, ventilation and air-conditioning (HVAC) systems. It may\n             also be desirable to isolate certain utilities from those used in other areas;\niii. Design of manufacturing process, premises and equipment to minimize risk\n            for cross-contamination during processing, maintenance and cleaning;\niv. Use of “closed systems” for processing and material/product transfer between equipment;\n       v.    Use of physical barrier systems, including isolators, as containment\n             measures;\nvi. Controlled removal of dust close to source of the contaminant e.g. through localised extraction; vii. Dedication of equipment, dedication of product contact parts or dedication of\n            selected parts which are harder to clean (e.g. filters), dedication of\n            maintenance tools;\nviii. Use of single use disposable technologies; ix. Use of equipment designed for ease of cleaning;\n       x.    Appropriate use of air-locks and pressure cascade to confine potential\n             airborne contaminant within a specified area;\nxi. Minimising the risk of contamination caused by recirculation or re-entry of untreated or insufficiently treated air; xii. Use of automatic clean in place systems of validated effectiveness;\n\nxiii. For common general wash areas, separation of equipment washing, drying\n             and storage areas.\nOrganisational Measures\n       i.    Dedicating the whole manufacturing facility or a self-contained production\n             area on a campaign basis (dedicated by separation in time) followed by a\n             cleaning process of validated effectiveness;\n       ii.   Keeping specific protective clothing inside areas where products with high\n             risk of cross-contamination are processed;\niii. Cleaning verification after each product campaign should be considered as\n            a detectability tool to support effectiveness of the Quality Risk Management\n            approach for products deemed to present higher risk;\niv. Depending on the contamination risk, verification of cleaning of non product contact surfaces and monitoring of air within the manufacturing area and/or adjoining areas in order to demonstrate effectiveness of control measures against airborne contamination or contamination by mechanical transfer;\n       v.    Specific measures for waste handling, contaminated rinsing water and soiled\n             gowning;\nvi. Recording of spills, accidental events or deviations from procedures; vii. Design of cleaning processes for premises and equipment such that the\n            cleaning processes in themselves do not present a cross-contamination risk;\nviii. Design of detailed records for cleaning processes to assure completion of\n             cleaning in accordance with approved procedures and use of cleaning status\n             labels on equipment and manufacturing areas;\nix. Use of common general wash areas on a campaign basis;\n       x.    Supervision of working behaviour to ensure training effectiveness and\n             compliance with the relevant procedural controls."
      role: normative
      normativity: must
      tags: []
