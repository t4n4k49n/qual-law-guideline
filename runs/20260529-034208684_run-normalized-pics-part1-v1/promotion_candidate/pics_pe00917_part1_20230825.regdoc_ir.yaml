    - nid: cha6.p6_31
      kind: paragraph
      kind_raw: '6.31'
      num: '6.31'
      ord: 279
      heading: null
      text: The protocol for the on-going stability programme can be different from that of the initial long term stability study as submitted in the Marketing Authorisation dossier provided that this is justified and documented in the protocol (for example the frequency of testing, or when updating to ICH/VICH recommendations).
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2432
      - source_label: PIC/S
        locator: line:2433
      - source_label: PIC/S
        locator: line:2434
      - source_label: PIC/S
        locator: line:2435
      children: []
    - nid: cha6.p6_32
      kind: paragraph
      kind_raw: '6.32'
      num: '6.32'
      ord: 280
      heading: null
      text: The number of batches and frequency of testing should provide a sufficient amount of data to allow for trend analysis. Unless otherwise justified, at least one batch per year of product manufactured in every strength and every primary packaging type, if relevant, should be included in the stability programme (unless none are produced during that year). For products where on-going stability monitoring would normally require testing using animals and no appropriate alternative, validated techniques are available, the frequency of testing may take account of a risk-benefit approach. The principle of bracketing and matrixing designs may be applied if scientifically justified in the protocol.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2437
      - source_label: PIC/S
        locator: line:2438
      - source_label: PIC/S
        locator: line:2439
      - source_label: PIC/S
        locator: line:2440
      - source_label: PIC/S
        locator: line:2441
      - source_label: PIC/S
        locator: line:2442
      - source_label: PIC/S
        locator: line:2443
      - source_label: PIC/S
        locator: line:2444
      - source_label: PIC/S
        locator: line:2445
      children: []
    - nid: cha6.p6_33
      kind: paragraph
      kind_raw: '6.33'
      num: '6.33'
      ord: 281
      heading: null
      text: In certain situations, additional batches should be included in the on-going stability programme. For example, an on-going stability study should be conducted after any significant change or significant deviation to the process or package. Any reworking, reprocessing or recovery operation should also be considered for inclusion.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2447
      - source_label: PIC/S
        locator: line:2448
      - source_label: PIC/S
        locator: line:2449
      - source_label: PIC/S
        locator: line:2450
      - source_label: PIC/S
        locator: line:2451
      children: []
    - nid: cha6.p6_34
      kind: paragraph
      kind_raw: '6.34'
      num: '6.34'
      ord: 282
      heading: null
      text: Results of on-going stability studies should be made available to key personnel and, in particular, to the Authorised Person(s). Where on-going stability studies are carried out at a site other than the site of manufacture of the bulk or finished product, there should be a written agreement between the parties concerned. Results of on-going stability studies should be available at the site of manufacture for review by the competent authority.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2453
      - source_label: PIC/S
