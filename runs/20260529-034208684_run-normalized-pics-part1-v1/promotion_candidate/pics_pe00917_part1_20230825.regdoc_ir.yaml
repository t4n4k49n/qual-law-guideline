      kind_raw: '6.24'
      num: '6.24'
      ord: 264
      heading: null
      text: Used microbiological media and strains should be decontaminated according to a standard procedure and disposed of in a manner to prevent the cross-contamination and retention of residues. The in-use shelf life of microbiological media should be established, documented and scientifically justified.
      role: normative
      normativity: must
      tags: []
      refs:
