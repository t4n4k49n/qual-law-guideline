    - nid: cha8.p8_29
      kind: paragraph
      kind_raw: '8.29'
      num: '8.29'
      ord: 340
      heading: null
      text: The progress of the recall process should be recorded until closure and a final report issued, including a reconciliation between the delivered and recovered quantities of the concerned products/batches.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2938
      - source_label: PIC/S
        locator: line:2939
      - source_label: PIC/S
        locator: line:2940
      children: []
    - nid: cha8.p8_30
      kind: paragraph
      kind_raw: '8.30'
      num: '8.30'
      ord: 341
      heading: null
      text: The effectiveness of the arrangements in place for recalls should be periodically evaluated to confirm that they remain robust and fit for use. Such evaluations should extend to both within office-hour situations as well as out-of-office hour situations and, when performing such evaluations, consideration should be given as to whether mock-recall actions should be performed. This evaluation should be documented and justified.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
