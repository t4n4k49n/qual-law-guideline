    - nid: cha5.p5_36
      kind: paragraph
      kind_raw: '5.36'
      num: '5.36'
      ord: 179
      heading: null
      text: "The rationale for the outsourcing of this testing should be justified and documented and the following requirements should be fulfilled:\n          i.    Special attention should be paid to the distribution controls (transport,\n                wholesaling, storage and delivery) in order to maintain the quality\n                characteristics of the starting materials and to ensure that test results remain\n                applicable to the delivered material;\n          ii.   The medicinal product manufacturer should perform audits, either itself or via\n                third parties, at appropriate intervals based on risk at the site(s) carrying out\n                the testing (including sampling) of the starting materials in order to assure\n                compliance with Good Manufacturing Practice and with the specifications\n                and testing methods described in the marketing authorisation dossier;\niii. The certificate of analysis provided by the starting material\n               manufacturer/supplier should be signed by a designated person with\n               appropriate qualifications and experience. The signature assures that each\n               batch has been checked for compliance with the agreed product specification\n               unless this assurance is provided separately;\niv. The medicinal product manufacturer should have appropriate experience in\n              dealing with the starting material manufacturer (including experience via a\n              supplier) including assessment of batches previously received and the\n              history of compliance before reducing in-house testing. Any significant\n              change in the manufacturing or testing processes should be considered;\n          v.    The medicinal product manufacturer should also perform (or via a separately\n                approved contract laboratory) a full analysis at appropriate intervals based\n                on risk and compare the results with the material manufacturer’s or supplier’s\n                certificate of analysis in order to check the reliability of the latter. Should this\n                testing identify any discrepancy then an investigation should be performed\n                and appropriate measures taken. The acceptance of certificates of analysis\n                from the material manufacturer or supplier should be discontinued until these\n                measures are completed."
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
