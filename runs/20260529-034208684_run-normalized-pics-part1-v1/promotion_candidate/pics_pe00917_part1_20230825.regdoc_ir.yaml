      num: '5.25'
      ord: 168
      heading: null
      text: Significant amendments to the manufacturing process, including any change in equipment or materials, which may affect product quality and/or the reproducibility of the process, should be validated.
      role: normative
      normativity: must
      tags: []
      refs:
