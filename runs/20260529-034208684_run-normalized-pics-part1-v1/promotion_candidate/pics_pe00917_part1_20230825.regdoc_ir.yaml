  - nid: cha2
    kind: chapter
    kind_raw: CHAPTER
    num: '2'
    ord: 72
    heading: PERSONNEL
    text: 'PRINCIPLE The correct manufacture of medicinal products relies upon people. For this reason there must be sufficient qualified personnel to carry out all the tasks which are the responsibility of the manufacturer. Individual responsibilities should be clearly understood by the individuals and recorded. All personnel should be aware of the principles of Good Manufacturing Practice that affect them and receive initial and continuing training, including hygiene instructions, relevant to their needs.


      GENERAL'
    role: structural
    normativity: null
    tags: []
    refs:
      internal: []
      external: []
