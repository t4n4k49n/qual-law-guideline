      heading: null
      text: 'Documents containing instructions should be approved, signed and dated by appropriate and authorised persons. Documents should have unambiguous contents and be uniquely identifiable. The effective date should be defined.


        2         Alternatively the certification may be based, in-whole or in-part, on the assessment of real time data (summaries and exception reports) from batch related process analytical technology (PAT), parameters or metrics as per the approved Marketing Authorisation dossier.'
