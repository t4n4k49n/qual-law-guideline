      kind_raw: '6.5'
      num: '6.5'
      ord: 220
      heading: null
      text: Control laboratory premises and equipment should meet the general and specific requirements for Quality Control areas given in Chapter 3. Laboratory equipment should not be routinely moved between high risk areas to avoid accidental cross-contamination. In particular, the microbiological laboratory should be arranged so as to minimize risk of cross-contamination.
