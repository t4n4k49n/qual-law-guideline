      kind: paragraph
      kind_raw: '5.23'
      num: '5.23'
      ord: 166
      heading: null
      text: Validation studies should reinforce Good Manufacturing Practice and be conducted in accordance with defined procedures. Results and conclusions should be recorded.
      role: normative
      normativity: must
      tags: []
      refs:
