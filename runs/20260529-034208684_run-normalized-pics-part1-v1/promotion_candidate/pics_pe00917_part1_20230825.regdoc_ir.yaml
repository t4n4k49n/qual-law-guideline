    - nid: cha6.p6_18
      kind: paragraph
      kind_raw: '6.18'
      num: '6.18'
      ord: 258
      heading: null
      text: All the in-process controls, including those made in the production area by production personnel, should be performed according to methods approved by Quality Control and the results recorded.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
