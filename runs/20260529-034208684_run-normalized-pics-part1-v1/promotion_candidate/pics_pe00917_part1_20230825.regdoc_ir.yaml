      heading: null
      text: Particular attention should be paid to printed materials. They should be stored in adequately secure conditions such as to exclude unauthorised access. Cut labels and other loose printed materials should be stored and transported in separate closed containers so as to avoid mix-ups. Packaging materials should be issued for use only by authorised personnel following an approved and documented procedure.
