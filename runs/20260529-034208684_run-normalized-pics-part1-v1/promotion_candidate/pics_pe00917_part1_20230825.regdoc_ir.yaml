    - nid: cha5.p5_24
      kind: paragraph
      kind_raw: '5.24'
      num: '5.24'
      ord: 167
      heading: null
      text: When any new manufacturing formula or method of preparation is adopted, steps should be taken to demonstrate its suitability for routine processing. The defined process, using the materials and equipment specified, should be shown to yield a product consistently of the required quality.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
