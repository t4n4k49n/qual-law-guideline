        locator: line:2381
      children: []
    - nid: cha6.p6_27
      kind: paragraph
      kind_raw: '6.27'
      num: '6.27'
      ord: 267
      heading: null
      text: The purpose of the on-going stability programme is to monitor the product over its shelf life and to determine that the product remains, and can be expected to remain, within specifications under the labelled storage conditions.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2383
      - source_label: PIC/S
        locator: line:2384
      - source_label: PIC/S
        locator: line:2385
      children: []
    - nid: cha6.p6_28
      kind: paragraph
      kind_raw: '6.28'
      num: '6.28'
      ord: 268
      heading: null
      text: This mainly applies to the medicinal product in the package in which it is sold, but consideration should also be given to the inclusion in the programme of bulk product. For example, when the bulk product is stored for a long period before being packaged and/or shipped from a manufacturing site to a packaging site, the impact on the stability of the packaged product should be evaluated and studied under ambient conditions. In addition, consideration should be given to intermediates that are stored and used over prolonged periods. Stability studies on reconstituted product are performed during product development and need not be monitored on an on-going basis. However, when relevant, the stability of reconstituted product can also be monitored.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2387
      - source_label: PIC/S
        locator: line:2388
      - source_label: PIC/S
        locator: line:2389
      - source_label: PIC/S
        locator: line:2390
      - source_label: PIC/S
        locator: line:2391
      - source_label: PIC/S
        locator: line:2392
      - source_label: PIC/S
        locator: line:2393
      - source_label: PIC/S
        locator: line:2394
      - source_label: PIC/S
        locator: line:2395
      - source_label: PIC/S
        locator: line:2396
      children: []
    - nid: cha6.p6_29
      kind: paragraph
      kind_raw: '6.29'
      num: '6.29'
      ord: 269
      heading: null
      text: The ongoing stability programme should be described in a written protocol following the general rules of Chapter 4 and results formalised as a report. The equipment used for the ongoing stability programme (stability chambers among others) should be qualified and maintained following the general rules of
      role: normative
      normativity: must
      tags: []
      refs:
