      - source_label: PIC/S
        locator: line:2769
      - source_label: PIC/S
        locator: line:2770
      - source_label: PIC/S
        locator: line:2780
      - source_label: PIC/S
        locator: line:2781
      - source_label: PIC/S
        locator: line:2782
      - source_label: PIC/S
        locator: line:2784
      - source_label: PIC/S
        locator: line:2785
      - source_label: PIC/S
        locator: line:2786
      - source_label: PIC/S
        locator: line:2788
      - source_label: PIC/S
        locator: line:2789
      - source_label: PIC/S
        locator: line:2791
      - source_label: PIC/S
        locator: line:2793
      - source_label: PIC/S
        locator: line:2794
      - source_label: PIC/S
        locator: line:2795
      - source_label: PIC/S
        locator: line:2798
      children: []
    - nid: cha8.p8_10
      kind: paragraph
      kind_raw: '8.10'
      num: '8.10'
      ord: 321
      heading: null
      text: The information reported in relation to possible quality defects should be recorded, including all the original details. The validity and extent of all reported quality defects should be documented and assessed in accordance with Quality Risk Management principles in order to support decisions regarding the degree of investigation and action taken.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2800
      - source_label: PIC/S
        locator: line:2801
      - source_label: PIC/S
        locator: line:2802
      - source_label: PIC/S
        locator: line:2803
      - source_label: PIC/S
        locator: line:2804
      children: []
    - nid: cha8.p8_11
      kind: paragraph
      kind_raw: '8.11'
      num: '8.11'
      ord: 322
      heading: null
      text: If a quality defect is discovered or suspected in a batch, consideration should be given to checking other batches and in some cases other products, in order to determine whether they are also affected. In particular, other batches which may contain portions of the defective batch or defective components should be investigated.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2806
      - source_label: PIC/S
        locator: line:2807
      - source_label: PIC/S
        locator: line:2808
      - source_label: PIC/S
        locator: line:2809
      - source_label: PIC/S
        locator: line:2810
      children: []
    - nid: cha8.p8_12
      kind: paragraph
      kind_raw: '8.12'
      num: '8.12'
      ord: 323
      heading: null
      text: Quality defect investigations should include a review of previous quality defect reports or any other relevant information for any indication of specific or recurring problems requiring attention and possibly further regulatory action.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2812
      - source_label: PIC/S
        locator: line:2813
      - source_label: PIC/S
        locator: line:2814
      children: []
    - nid: cha8.p8_13
      kind: paragraph
      kind_raw: '8.13'
      num: '8.13'
      ord: 324
      heading: null
      text: The decisions that are made during and following quality defect investigations should reflect the level of risk that is presented by the quality defect as well as the seriousness of any non-compliance with respect to the requirements of the marketing authorisation/product specification file or GMP. Such decisions should be timely to ensure that patient and animal safety is maintained, in a way that is commensurate with the level of risk that is presented by those issues.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2816
      - source_label: PIC/S
        locator: line:2817
      - source_label: PIC/S
        locator: line:2818
      - source_label: PIC/S
        locator: line:2819
      - source_label: PIC/S
        locator: line:2820
      - source_label: PIC/S
        locator: line:2821
      children: []
    - nid: cha8.p8_14
      kind: paragraph
      kind_raw: '8.14'
      num: '8.14'
      ord: 325
      heading: null
      text: As comprehensive information on the nature and extent of the quality defect may not always be available at the early stages of an investigation, the decision-making processes should still ensure that appropriate risk-reducing actions are taken at an appropriate time-point during such investigations. All the decisions and measures taken as a result of a quality defect should be documented.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2823
      - source_label: PIC/S
        locator: line:2824
      - source_label: PIC/S
        locator: line:2825
      - source_label: PIC/S
        locator: line:2826
      - source_label: PIC/S
        locator: line:2827
      children: []
    - nid: cha8.p8_15
      kind: paragraph
      kind_raw: '8.15'
      num: '8.15'
      ord: 326
      heading: null
      text: 'Quality defects should be reported in a timely manner by the manufacturer to the marketing authorisation holder/sponsor and all concerned Competent Authorities


        in cases where the quality defect may result in the recall of the product or in an abnormal restriction in the supply of the product.

        ROOT  CAUSE   ANALYSIS                              AND      CORRECTIVE                AND

        PREVENTATIVE ACTIONS'
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2829
      - source_label: PIC/S
        locator: line:2830
      - source_label: PIC/S
        locator: line:2840
      - source_label: PIC/S
        locator: line:2841
      - source_label: PIC/S
        locator: line:2844
      - source_label: PIC/S
        locator: line:2845
      children: []
    - nid: cha8.p8_16
      kind: paragraph
      kind_raw: '8.16'
      num: '8.16'
      ord: 327
      heading: null
      text: An appropriate level of root cause analysis work should be applied during the investigation of quality defects. In cases where the true root cause(s) of the quality defect cannot be determined, consideration should be given to identifying the most likely root cause(s) and to addressing those.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2846
      - source_label: PIC/S
        locator: line:2847
      - source_label: PIC/S
        locator: line:2848
      - source_label: PIC/S
        locator: line:2849
      children: []
    - nid: cha8.p8_17
      kind: paragraph
      kind_raw: '8.17'
      num: '8.17'
      ord: 328
      heading: null
      text: Where human error is suspected or identified as the cause of a quality defect, this should be formally justified and care should be exercised so as to ensure that process, procedural or system-based errors or problems are not overlooked, if present.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2851
      - source_label: PIC/S
        locator: line:2852
      - source_label: PIC/S
        locator: line:2853
      - source_label: PIC/S
        locator: line:2854
      children: []
    - nid: cha8.p8_18
      kind: paragraph
      kind_raw: '8.18'
      num: '8.18'
      ord: 329
      heading: null
      text: Appropriate CAPAs should be identified and taken in response to a quality defect. The effectiveness of such actions should be monitored and assessed.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2856
      - source_label: PIC/S
        locator: line:2857
      children: []
    - nid: cha8.p8_19
      kind: paragraph
      kind_raw: '8.19'
      num: '8.19'
      ord: 330
      heading: null
      text: 'Quality defect records should be reviewed and trend analyses should be performed regularly for any indication of specific or recurring problems requiring attention.


        PRODUCT RECALLS AND OTHER POTENTIAL RISK-REDUCING ACTIONS'
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2859
      - source_label: PIC/S
        locator: line:2860
      - source_label: PIC/S
        locator: line:2861
      - source_label: PIC/S
        locator: line:2864
      - source_label: PIC/S
        locator: line:2865
      children: []
    - nid: cha8.p8_20
      kind: paragraph
      kind_raw: '8.20'
      num: '8.20'
      ord: 331
      heading: null
      text: There should be established written procedures, regularly reviewed and updated when necessary, in order to undertake any recall activity or implement any other risk-reducing actions.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2866
      - source_label: PIC/S
        locator: line:2867
      - source_label: PIC/S
        locator: line:2868
      children: []
    - nid: cha8.p8_21
      kind: paragraph
      kind_raw: '8.21'
      num: '8.21'
      ord: 332
      heading: null
      text: After a product has been placed on the market, any retrieval of it from the distribution network as a result of a quality defect should be regarded and managed as a recall. (This provision does not apply to the retrieval (or return) of samples of the product from the distribution network to facilitate an investigation into a quality defect issue/report.)
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2870
      - source_label: PIC/S
        locator: line:2871
      - source_label: PIC/S
        locator: line:2872
      - source_label: PIC/S
        locator: line:2873
      - source_label: PIC/S
        locator: line:2874
      children: []
    - nid: cha8.p8_22
      kind: paragraph
      kind_raw: '8.22'
      num: '8.22'
      ord: 333
      heading: null
      text: Recall operations should be capable of being initiated promptly and at any time. In certain cases recall operations may need to be initiated to protect public or animal health prior to establishing the root cause(s) and full extent of the quality defect
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2876
      - source_label: PIC/S
        locator: line:2877
      - source_label: PIC/S
        locator: line:2878
      - source_label: PIC/S
        locator: line:2879
      children: []
    - nid: cha8.p8_23
      kind: paragraph
      kind_raw: '8.23'
      num: '8.23'
      ord: 334
      heading: null
      text: The batch/product distribution records should be readily available to the persons responsible for recalls, and should contain sufficient information on wholesalers and directly supplied customers (with addresses, phone and/or fax numbers inside and outside working hours, batches and amounts delivered), including those for exported products and medical samples.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2881
      - source_label: PIC/S
        locator: line:2882
      - source_label: PIC/S
        locator: line:2883
      - source_label: PIC/S
        locator: line:2884
      - source_label: PIC/S
        locator: line:2885
      children: []
    - nid: cha8.p8_24
      kind: paragraph
      kind_raw: '8.24'
      num: '8.24'
      ord: 335
      heading: null
      text: 'In the case of investigational medicinal products, all trial sites should be identified and the countries of destination should be indicated. In the case of an investigational medicinal product for which a marketing authorisation has been


        issued, the manufacturer of the investigational medicinal product should, in cooperation with the sponsor, inform the marketing authorisation holder of any quality defect that could be related to the authorised medicinal product. The sponsor should implement a procedure for the rapid unblinding of blinded products, where this is necessary for a prompt recall. The sponsor should ensure that the procedure discloses the identity of the blinded product only in so far as is necessary.'
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2887
      - source_label: PIC/S
        locator: line:2888
      - source_label: PIC/S
        locator: line:2889
      - source_label: PIC/S
        locator: line:2897
      - source_label: PIC/S
        locator: line:2898
      - source_label: PIC/S
        locator: line:2899
      - source_label: PIC/S
        locator: line:2900
      - source_label: PIC/S
        locator: line:2901
      - source_label: PIC/S
        locator: line:2902
      - source_label: PIC/S
        locator: line:2903
      children: []
    - nid: cha8.p8_25
      kind: paragraph
      kind_raw: '8.25'
      num: '8.25'
      ord: 336
      heading: null
      text: Consideration should be given following consultation with the concerned Competent Authorities, as to how far into the distribution network a recall action should extend, taking into account the potential risk to public or animal health and any impact that the proposed recall action may have. The Competent Authorities should also be informed in situations in which no recall action is being proposed for a defective batch because the batch has expired (such as with short shelf-life products.)
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2905
      - source_label: PIC/S
        locator: line:2906
      - source_label: PIC/S
        locator: line:2907
      - source_label: PIC/S
        locator: line:2908
      - source_label: PIC/S
        locator: line:2909
      - source_label: PIC/S
        locator: line:2910
      - source_label: PIC/S
        locator: line:2911
      children: []
    - nid: cha8.p8_26
      kind: paragraph
      kind_raw: '8.26'
      num: '8.26'
      ord: 337
      heading: null
      text: All concerned Competent Authorities should be informed in advance in cases where products are intended to be recalled. For very serious issues (i.e. those with the potential to seriously impact upon patient or animal health), rapid risk-reducing actions (such as a product recall) may have to be taken in advance of notifying the Competent Authorities. Wherever possible, attempts should be made to agree these in advance of their execution with the concerned Competent Authorities
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2913
      - source_label: PIC/S
        locator: line:2914
      - source_label: PIC/S
        locator: line:2915
      - source_label: PIC/S
        locator: line:2916
      - source_label: PIC/S
        locator: line:2917
      - source_label: PIC/S
        locator: line:2918
      - source_label: PIC/S
        locator: line:2919
      children: []
    - nid: cha8.p8_27
      kind: paragraph
      kind_raw: '8.27'
      num: '8.27'
      ord: 338
      heading: null
      text: It should also be considered whether the proposed recall action may affect different markets in different ways, and if this is the case, appropriate marketspecific risk-reducing actions should be developed and discussed with the concerned Competent Authorities. Taking account of its therapeutic use the risk of shortage of a medicinal product which has no authorised alternative should be considered before deciding on a risk-reducing action such as a recall. Any decisions not to execute a risk-reducing action which would otherwise be required should be agreed with the Competent Authority in advance.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2921
      - source_label: PIC/S
        locator: line:2922
      - source_label: PIC/S
        locator: line:2923
      - source_label: PIC/S
        locator: line:2924
      - source_label: PIC/S
        locator: line:2925
      - source_label: PIC/S
        locator: line:2926
      - source_label: PIC/S
        locator: line:2927
      - source_label: PIC/S
        locator: line:2928
      children: []
    - nid: cha8.p8_28
      kind: paragraph
      kind_raw: '8.28'
      num: '8.28'
      ord: 339
      heading: null
      text: Recalled products should be identified and stored separately in a secure area while awaiting a decision on their fate. A formal disposition of all recalled batches should be made and documented. The rationale for any decision to rework recalled products should be documented and discussed with the relevant Competent Authority. The extent of shelf-life remaining for any reworked batches that are being considered for placement onto the market should also be considered.
      role: normative
      normativity: must
      tags: []
      refs:
