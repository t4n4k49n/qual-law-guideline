    - nid: cha6.p6_1
      kind: paragraph
      kind_raw: '6.1'
      num: '6.1'
      ord: 216
      heading: null
      text: Each holder of a manufacturing authorisation should have a Quality Control Department. This department should be independent from other departments, and under the authority of a person with appropriate qualifications and experience, who has one or several control laboratories at his disposal. Adequate resources must be available to ensure that all the Quality Control arrangements are effectively and reliably carried out.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
