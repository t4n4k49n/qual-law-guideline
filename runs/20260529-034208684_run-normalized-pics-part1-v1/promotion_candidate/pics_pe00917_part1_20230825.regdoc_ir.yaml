    - nid: cha8.p8_31
      kind: paragraph
      kind_raw: '8.31'
      num: '8.31'
      ord: 342
      heading: null
      text: In addition to recalls, there are other potential risk-reducing actions that may be considered in order to manage the risks presented by quality defects. Such actions may include the issuance of cautionary communications to healthcare professionals in relation to their use of a batch that is potentially defective. These should be considered on a case-by-case basis and discussed with the concerned Competent Authorities.
      role: normative
