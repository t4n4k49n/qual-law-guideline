    - nid: cha6.p6_2
      kind: paragraph
      kind_raw: '6.2'
      num: '6.2'
      ord: 217
      heading: null
      text: The principal duties of the head of Quality Control are summarised in Chapter 2. The Quality Control Department as a whole will also have other duties, such as to establish, validate and implement all quality control procedures, oversee the control of the reference and/or retention samples of materials and products when applicable, ensure the correct labelling of containers of materials and products, ensure the monitoring of the stability of the products, participate in the investigation of complaints related to the quality of the product, etc. All these operations should be carried out in accordance with written procedures and, where necessary, recorded.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
