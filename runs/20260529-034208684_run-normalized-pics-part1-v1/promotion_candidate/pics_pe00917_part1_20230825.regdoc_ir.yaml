      kind: paragraph
      kind_raw: '2.3'
      num: '2.3'
      ord: 75
      heading: null
      text: People in responsible positions should have specific duties recorded in written job descriptions and adequate authority to carry out their responsibilities. Their duties may be delegated to designated deputies of a satisfactory qualification level. There should be no gaps or unexplained overlaps in the responsibilities of those personnel concerned with the application of Good Manufacturing Practice.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
