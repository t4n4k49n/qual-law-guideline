      kind: paragraph
      kind_raw: '5.26'
      num: '5.26'
      ord: 169
      heading: null
      text: 'Processes and procedures should undergo periodic critical re-validation to ensure that they remain capable of achieving the intended results.


        STARTING MATERIALS'
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:1776
      - source_label: PIC/S
        locator: line:1777
      - source_label: PIC/S
        locator: line:1780
      children: []
    - nid: cha5.p5_27
      kind: paragraph
      kind_raw: '5.27'
      num: '5.27'
      ord: 170
      heading: null
      text: The selection, qualification, approval and maintenance of suppliers of starting materials, together with their purchase and acceptance, should be documented as part of the pharmaceutical quality system. The level of supervision should be proportionate to the risks posed by the individual materials, taking account of their source, manufacturing process, supply chain complexity and the final use to which the material is put in the medicinal product. The supporting evidence for each supplier / material approval should be maintained. Staff involved in these activities should have a current knowledge of the suppliers, the supply chain and the associated risks involved. Where possible, starting materials should be purchased directly from the manufacturer of the starting material.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:1782
