    - nid: cha6.p6_19
      kind: paragraph
      kind_raw: '6.19'
      num: '6.19'
      ord: 259
      heading: null
      text: Special attention should be given to the quality of laboratory reagents, solutions, glassware, reference standards and culture media. They should be prepared and controlled in accordance with written procedures. The level of controls should be commensurate to their use and to the available stability data.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2325
      - source_label: PIC/S
