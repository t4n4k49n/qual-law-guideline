  - nid: cha7
    kind: chapter
    kind_raw: CHAPTER
    num: '7'
    ord: 295
    heading: OUTSOURCED ACTIVITIES
    text: 'PRINCIPLE Any activity covered by the GMP Guide that is outsourced should be appropriately defined, agreed and controlled in order to avoid misunderstandings which could result in a product or operation of unsatisfactory quality. There must be a written contract between the Contract Giver and the Contract Acceptor which clearly establishes the roles and responsibilities of each party. The Pharmaceutical Quality System of the Contract Giver must clearly state the way that the Authorised Person certifying each batch of product for release exercises his/her full responsibility.


      GENERAL'
