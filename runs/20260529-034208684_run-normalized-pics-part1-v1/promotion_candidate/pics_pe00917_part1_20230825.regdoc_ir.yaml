      kind: paragraph
      kind_raw: '4.11'
      num: '4.11'
      ord: 139
      heading: null
      text: Specific requirements apply to batch documentation which must be kept for one year after expiry of the batch to which it relates or at least five years after certification of the batch by the Authorised Person, whichever is the longer. For investigational medicinal products, the batch documentation must be kept for at least five years after the completion or formal discontinuation of the last clinical trial in which the batch was used. Other requirements for retention of documentation may be described in legislation in relation to specific types of product (e.g. Advanced Therapy Medicinal Products) and specify that longer retention periods be applied to certain documents.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
