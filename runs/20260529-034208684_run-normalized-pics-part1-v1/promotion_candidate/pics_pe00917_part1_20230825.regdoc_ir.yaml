      text: 'Regular periodic or rolling quality reviews of all authorised medicinal products, including export only products, should be conducted with the objective of verifying the consistency of the existing process, the appropriateness of current specifications for both starting materials and finished product, to highlight any trends and to identify product and process improvements. Such reviews should normally be conducted and documented annually, taking into account previous reviews, and should include at least:'
