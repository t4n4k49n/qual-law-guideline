      heading: null
      text: Senior management has the ultimate responsibility to ensure an effective Pharmaceutical Quality System is in place, adequately resourced and that roles, responsibilities, and authorities are defined, communicated and implemented throughout the organisation. Senior management’s leadership and active participation in the Pharmaceutical Quality System is essential. This leadership should ensure the support and commitment of staff at all levels and sites within the organisation to the Pharmaceutical Quality System.
      role: normative
      normativity: must
      tags: []
      refs:
