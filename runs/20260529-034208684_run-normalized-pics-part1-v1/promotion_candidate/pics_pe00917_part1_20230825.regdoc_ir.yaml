    - nid: cha7.p7_4
      kind: paragraph
      kind_raw: '7.4'
      num: '7.4'
      ord: 300
      heading: null
      text: "The Pharmaceutical Quality System of the Contract Giver should include the control and review of any outsourced activities. The Contract Giver is ultimately responsible to ensure processes are in place to assure the control of outsourced activities. These processes should incorporate quality risk management principles and notably include:\n\n7.4.1 Prior to outsourcing activities, the Contract Giver is responsible for\n             assessing the legality, suitability and the competence of the Contract\n              Acceptor to carry out successfully the outsourced activities. The Contract\n              Giver is also responsible for ensuring by means of the contract that the\n              principles and guidelines of GMP as interpreted in this Guide are followed;\n7.4.2 The Contract Giver should provide the Contract Acceptor with all the\n             information and knowledge necessary to carry out the contracted\n             operations correctly in accordance with regulations in force, and the\n             Marketing Authorisation for the product concerned. The Contract Giver\n             should ensure that the Contract Acceptor is fully aware of any problems\n             associated with the product or the work which might pose a hazard to\n             his/her premises, equipment, personnel, other materials or other products;\n7.4.3 The Contract Giver should monitor and review the performance of the\n             Contract Acceptor and the identification and implementation of any needed\n             improvement."
      role: normative
      normativity: must
      tags: []
