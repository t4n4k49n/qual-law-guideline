    - nid: cha5.p5_32
      kind: paragraph
      kind_raw: '5.32'
      num: '5.32'
      ord: 175
      heading: null
      text: "Starting materials in the storage area should be appropriately labelled (see section 13). Labels should bear at least the following information:\n          i.    The designated name of the product and the internal code reference where\n                applicable;\n          ii.   A batch number given at receipt;\niii. Where appropriate, the status of the contents (e.g. in quarantine, on test,\n               released, rejected);\n          iv.   Where appropriate, an expiry date or a date beyond which retesting is\n                necessary.\nWhen fully computerised storage systems are used, all the above information need not necessarily be in a legible form on the label."
