      ord: 5
      heading: null
      text: The size and complexity of the company’s activities should be taken into consideration when developing a new Pharmaceutical Quality System or modifying an existing one. The design of the system should incorporate appropriate risk management principles including the use of appropriate tools. While some aspects of the system can be company-wide and others site-specific, the effectiveness of the system is normally demonstrated at the site level.
      role: normative
      normativity: must
      tags: []
      refs:
