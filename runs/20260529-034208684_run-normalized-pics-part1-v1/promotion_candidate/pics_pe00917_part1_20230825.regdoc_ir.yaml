    - nid: cha4.p4_12
      kind: paragraph
      kind_raw: '4.12'
      num: '4.12'
      ord: 140
      heading: null
      text: 'For other types of documentation, the retention period will depend on the business activity which the documentation supports. Critical documentation, including raw data (for example relating to validation or stability), which supports information in the Marketing Authorisation should be retained whilst the authorisation remains in force. It may be considered acceptable to retire certain documentation (e.g. raw data supporting validation reports or stability reports) where the data has been superseded by a full set of new data. Justification for this should be documented and should take into account the requirements for


        retention of batch documentation; for example, in the case of process validation data, the accompanying raw data should be retained for a period at least as long as the records for all batches whose release has been supported on the basis of that validation exercise.


        The following section gives some examples of required documents. The quality management system should describe all documents required to ensure product quality and patient safety.


