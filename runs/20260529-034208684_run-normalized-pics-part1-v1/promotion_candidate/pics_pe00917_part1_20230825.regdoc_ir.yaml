    - nid: cha2.p2_5
      kind: paragraph
      kind_raw: '2.5'
      num: '2.5'
      ord: 77
      heading: null
      text: Senior Management should appoint Key Management Personnel including the head of Production, the head of Quality Control, and if at least one of these persons is not responsible for the release of products the Authorised Person(s) designated for the purpose. Normally, key posts should be occupied by full-time personnel. The heads of Production and Quality Control must be independent from each other. In large organisations, it may be necessary to delegate some of the functions listed in 2.7, 2.8 and 2.9. Additionally, depending on the size and organisational structure of the company, a separate Head of Quality Assurance or Head of the Quality Unit may be appointed. Where such a function exists usually some of the responsibilities described in 2.7, 2.8 and 2.9 are shared with the Head of Quality Control and Head of Production and senior management should therefore take care that roles, responsibilities, and authorities are defined.
      role: normative
      normativity: must
