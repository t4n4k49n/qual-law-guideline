      num: '5.35'
      ord: 178
      heading: null
      text: 'Manufacturers of finished products are responsible for any testing of starting materials3 as described in the marketing authorisation dossier. They can utilise


        3         A similar approach should apply to packaging materials as stated in section 5.45.


        partial or full test results from the approved starting material manufacturer but must, as a minimum, perform identification testing4 of each batch according to Annex 8.'
      role: normative
      normativity: must
