      kind_raw: '2.2'
      num: '2.2'
      ord: 74
      heading: null
      text: The manufacturer must have an organisation chart in which the relationships between the heads of Production, Quality Control and where applicable Head of Quality Assurance or Quality Unit referred to in point 2.5 and the position of the Authorised Person(s) are clearly shown in the managerial hierarchy.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
