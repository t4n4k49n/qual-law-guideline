    - nid: cha6.p6_23
      kind: paragraph
      kind_raw: '6.23'
      num: '6.23'
      ord: 263
      heading: null
      text: Culture media should be prepared in accordance with the media manufacturer’s requirements unless scientifically justified. The performance of all culture media should be verified prior to use.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
