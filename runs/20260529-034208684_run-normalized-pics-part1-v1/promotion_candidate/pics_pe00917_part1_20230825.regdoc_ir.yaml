    - nid: cha2.p2_4
      kind: paragraph
      kind_raw: '2.4'
      num: '2.4'
      ord: 76
      heading: null
      text: 'Senior management has the ultimate responsibility to ensure an effective Pharmaceutical Quality System is in place to achieve the quality objectives, and, that roles, responsibilities, and authorities are defined, communicated and implemented throughout the organisation. Senior management should establish a quality policy that describes the overall intentions and direction of the company related to quality and should ensure continuing suitability and effectiveness of the Pharmaceutical Quality System and GMP compliance through participation in management review.


        KEY PERSONNEL'
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
