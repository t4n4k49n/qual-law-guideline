    - nid: cha6.p6_12
      kind: paragraph
      kind_raw: '6.12'
      num: '6.12'
      ord: 243
      heading: null
      text: Samples should be representative of the batch of materials or products from which they are taken. Other samples may also be taken to monitor the most stressed part of a process (e.g. beginning or end of a process). The sampling plan used should be appropriately justified and based on a risk management approach.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
