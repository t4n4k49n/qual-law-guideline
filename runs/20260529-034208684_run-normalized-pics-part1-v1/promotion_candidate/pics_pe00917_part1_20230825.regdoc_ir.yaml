      num: '2.16'
      ord: 114
      heading: null
      text: 'All personnel should receive medical examination upon recruitment. It must be the manufacturer’s responsibility that there are instructions ensuring that health conditions that can be of relevance to the quality of products come to the


        manufacturer’s knowledge. After the first medical examination, examinations should be carried out when necessary for the work and personal health.'
