    - nid: cha2.p2_6
      kind: paragraph
      kind_raw: '2.6'
      num: '2.6'
      ord: 78
      heading: null
      text: "The duties of the Authorised Person(s) are described in the national requirements and can be summarised as follows:\n       a)      An Authorised Person must ensure that each batch of medicinal products\n               has been manufactured and checked in compliance with the laws in force\n               in that country and in accordance with the requirements of the Marketing\n               Authorisation;\n       b)      The Authorised Person(s) must meet the qualification requirements laid\n               down in the national legislation, they shall be permanently and continuously\n               at the disposal of the holder of the Manufacturing Authorisation to carry out\n               their responsibilities;\n       c)      The responsibilities of an Authorised Person may be delegated, but only to\n               other Authorised Person(s)."
      role: normative
