      heading: null
      text: Before packaging operations are begun, steps should be taken to ensure that the work area, packaging lines, printing machines and other equipment are clean and free from any products, materials or documents previously used, if these are not required for the current operation. The line-clearance should be performed according to an appropriate check-list.
