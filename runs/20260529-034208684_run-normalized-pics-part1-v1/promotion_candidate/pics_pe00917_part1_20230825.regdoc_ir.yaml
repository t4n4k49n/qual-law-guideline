    - nid: cha1.p1_1
      kind: paragraph
      kind_raw: '1.1'
      num: '1.1'
      ord: 3
      heading: null
      text: Quality Management is a wide-ranging concept, which covers all matters, which individually or collectively influence the quality of a product. It is the sum total of the organised arrangements made with the objective of ensuring that medicinal products are of the quality required for their intended use. Quality Management therefore incorporates Good Manufacturing Practice.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
