      children: []
    - nid: cha6.p6_20
      kind: paragraph
      kind_raw: '6.20'
      num: '6.20'
      ord: 260
      heading: null
      text: Reference standards should be established as suitable for their intended use. Their qualification and certification, as such, should be clearly stated and documented. Whenever compendial reference standards from an officially recognised source exist, these should preferably be used as primary reference standards unless fully justified (the use of secondary standards is permitted once their traceability to primary standards has been demonstrated and is documented). These compendial materials should be used for the purpose described in the appropriate monograph unless otherwise authorised by the National Competent Authority.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2330
      - source_label: PIC/S
        locator: line:2331
      - source_label: PIC/S
        locator: line:2332
      - source_label: PIC/S
        locator: line:2333
      - source_label: PIC/S
        locator: line:2334
      - source_label: PIC/S
        locator: line:2335
      - source_label: PIC/S
        locator: line:2336
      - source_label: PIC/S
        locator: line:2337
      - source_label: PIC/S
        locator: line:2338
      children: []
    - nid: cha6.p6_21
      kind: paragraph
      kind_raw: '6.21'
      num: '6.21'
      ord: 261
      heading: null
      text: Laboratory reagents, solutions, reference standards and culture media should be marked with the preparation and opening date and the signature of the person who prepared them. The expiry date of reagents and culture media should be indicated on the label, together with specific storage conditions. In addition, for volumetric solutions, the last date of standardisation and the last current factor should be indicated.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2340
      - source_label: PIC/S
        locator: line:2341
      - source_label: PIC/S
        locator: line:2342
      - source_label: PIC/S
        locator: line:2343
      - source_label: PIC/S
        locator: line:2344
      - source_label: PIC/S
        locator: line:2345
      children: []
    - nid: cha6.p6_22
      kind: paragraph
      kind_raw: '6.22'
      num: '6.22'
      ord: 262
      heading: null
      text: Where necessary, the date of receipt of any substance used for testing operations (e.g. reagents, solutions and reference standards) should be indicated on the container. Instructions for use and storage should be followed. In certain cases it may be necessary to carry out an identification test and/or other testing of reagent materials upon receipt or before use.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
