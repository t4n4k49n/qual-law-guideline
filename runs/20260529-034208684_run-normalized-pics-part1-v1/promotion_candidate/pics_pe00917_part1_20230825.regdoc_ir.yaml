    - nid: cha2.p2_1
      kind: paragraph
      kind_raw: '2.1'
      num: '2.1'
      ord: 73
      heading: null
      text: The manufacturer should have an adequate number of personnel with the necessary qualifications and practical experience. Senior management should determine and provide adequate and appropriate resources (human, financial, materials, facilities and equipment) to implement and maintain the Pharmaceutical Quality System and continually improve its effectiveness. The responsibilities placed on any one individual should not be so extensive as to present any risk to quality.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
