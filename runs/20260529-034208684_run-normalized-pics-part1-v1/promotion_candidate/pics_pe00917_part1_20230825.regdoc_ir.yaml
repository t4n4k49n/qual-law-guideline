      - nid: cha1.p1_4.ixiv
        kind: item
        kind_raw: (xiv)
        num: xiv
        ord: 20
        heading: null
        text: "An appropriate level of root cause analysis should be applied during the\n             investigation of deviations, suspected product defects and other problems.\n              This can be determined using Quality Risk Management principles. In\n              cases where the true root cause(s) of the issue cannot be determined,\n              consideration should be given to identifying the most likely root cause(s)\n              and to addressing those. Where human error is suspected or identified as\n              the cause, this should be justified having taken care to ensure that process,\n              procedural or system based errors or problems have not been overlooked,\n              if present. Appropriate corrective actions and/or preventive actions\n              (CAPAs) should be identified and taken in response to investigations. The\n              effectiveness of such actions should be monitored and assessed, in line\n              with Quality Risk Management principles;"
        role: normative
        normativity: must
        tags: []
        refs:
