    - nid: cha1.p1_2
      kind: paragraph
      kind_raw: '1.2'
      num: '1.2'
      ord: 4
      heading: null
      text: 'GMP applies to the lifecycle stages from the manufacture of investigational medicinal products, technology transfer, commercial manufacturing through to product discontinuation. However the Pharmaceutical Quality System can extend to the pharmaceutical development lifecycle stage as described in ICH Q10, which while optional, should facilitate innovation and continual improvement and strengthen the link between pharmaceutical development and manufacturing activities.


        1         National requirements require manufacturers to establish and implement an effective pharmaceutical quality assurance system. The term Pharmaceutical Quality System is used in this chapter in the interests of consistency with ICH Q10 terminology. For the purposes of this chapter these terms can be considered interchangeable.'
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
