    - nid: cha8.p8_2
      kind: paragraph
      kind_raw: '8.2'
      num: '8.2'
      ord: 313
      heading: null
      text: 'Sufficient trained personnel and resources should be made available for the handling, assessment, investigation and review of complaints and quality defects


        and for implementing any risk-reducing actions. Sufficient trained personnel and resources should also be available for the management of interactions with Competent Authorities.'
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2712
      - source_label: PIC/S
        locator: line:2713
      - source_label: PIC/S
        locator: line:2722
      - source_label: PIC/S
        locator: line:2723
      - source_label: PIC/S
        locator: line:2724
      children: []
    - nid: cha8.p8_3
      kind: paragraph
      kind_raw: '8.3'
      num: '8.3'
      ord: 314
      heading: null
      text: The use of inter-disciplinary teams should be considered, including appropriately trained Quality Management personnel.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2726
      - source_label: PIC/S
        locator: line:2727
      children: []
    - nid: cha8.p8_4
      kind: paragraph
      kind_raw: '8.4'
      num: '8.4'
      ord: 315
      heading: null
      text: 'In situations in which complaint and quality defect handling is managed centrally within an organisation, the relative roles and responsibilities of the concerned parties should be documented. Central management should not, however, result in delays in the investigation and management of the issue.


        PROCEDURES FOR HANDLING        AND INVESTIGATING COMPLAINTS INCLUDING POSSIBLE QUALITY DEFECTS'
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2729
      - source_label: PIC/S
        locator: line:2730
      - source_label: PIC/S
        locator: line:2731
      - source_label: PIC/S
        locator: line:2732
      - source_label: PIC/S
        locator: line:2735
      - source_label: PIC/S
        locator: line:2736
      children: []
    - nid: cha8.p8_5
      kind: paragraph
      kind_raw: '8.5'
      num: '8.5'
      ord: 316
      heading: null
      text: There should be written procedures describing the actions to be taken upon receipt of a complaint. All complaints should be documented and assessed to establish if they represent a potential quality defect or other issue.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2737
      - source_label: PIC/S
        locator: line:2738
      - source_label: PIC/S
        locator: line:2739
      children: []
    - nid: cha8.p8_6
      kind: paragraph
      kind_raw: '8.6'
      num: '8.6'
      ord: 317
      heading: null
      text: Special attention should be given to establishing whether a complaint or suspected quality defect relates to falsification.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2741
      - source_label: PIC/S
        locator: line:2742
      children: []
    - nid: cha8.p8_7
      kind: paragraph
      kind_raw: '8.7'
      num: '8.7'
      ord: 318
      heading: null
      text: As not all complaints received by a company may represent actual quality defects, complaints which do not indicate a potential quality defect should be documented appropriately and communicated to the relevant group or person responsible for the investigation and management of complaints of that nature, such as suspected adverse events.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2744
      - source_label: PIC/S
        locator: line:2745
      - source_label: PIC/S
        locator: line:2746
      - source_label: PIC/S
        locator: line:2747
      - source_label: PIC/S
        locator: line:2748
      children: []
    - nid: cha8.p8_8
      kind: paragraph
      kind_raw: '8.8'
      num: '8.8'
      ord: 319
      heading: null
      text: There should be procedures in place to facilitate a request to investigate the quality of a batch of a medicinal product in order to support an investigation into a reported suspected adverse event.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2750
      - source_label: PIC/S
        locator: line:2751
      - source_label: PIC/S
        locator: line:2752
      children: []
    - nid: cha8.p8_9
      kind: paragraph
      kind_raw: '8.9'
      num: '8.9'
      ord: 320
      heading: null
      text: "When a quality defect investigation is initiated, procedures should be in place to address at least the following:\n       i.    The description of the reported quality defect.\n       ii.   The determination of the extent of the quality defect. The checking or testing\n             of reference and/or retention samples should be considered as part of this,\n             and in certain cases, a review of the batch production record, the batch\n             certification record and the batch distribution records (especially for\n             temperature-sensitive products) should be performed.\niii. The need to request a sample, or the return, of the defective product from\n            the complainant and, where a sample is provided, the need for an\n            appropriate evaluation to be carried out.\niv. The assessment of the risk(s) posed by the quality defect, based on the severity and extent of the quality defect.\n       v.   The decision-making process that is to be used concerning the potential\n            need for risk-reducing actions to be taken in the distribution network, such as\n            batch or product recalls, or other actions.\nvi. The assessment of the impact that any recall action may have on the availability of the medicinal product to patients/animals in any affected market, and the need to notify the relevant authorities of such impact.\n\nvii. The internal and external communications that should be made in relation to\n            a quality defect and its investigation.\nviii. The identification of the potential root cause(s) of the quality defect.\n\nix. The need for appropriate Corrective and Preventive Actions (CAPAs) to be\n            identified and implemented for the issue, and for the assessment of the\n            effectiveness of those CAPAs.\nINVESTIGATION AND DECISION-MAKING"
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PIC/S
        locator: line:2754
      - source_label: PIC/S
        locator: line:2755
      - source_label: PIC/S
        locator: line:2757
      - source_label: PIC/S
        locator: line:2759
      - source_label: PIC/S
        locator: line:2760
      - source_label: PIC/S
        locator: line:2761
      - source_label: PIC/S
        locator: line:2762
      - source_label: PIC/S
        locator: line:2763
      - source_label: PIC/S
        locator: line:2765
      - source_label: PIC/S
        locator: line:2766
      - source_label: PIC/S
