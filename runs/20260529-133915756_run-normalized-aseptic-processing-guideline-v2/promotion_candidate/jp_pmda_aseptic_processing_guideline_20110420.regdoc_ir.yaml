        num: 19.1.2
        ord: 698
        heading: null
        text: アイソレータシステムの設計アイソレータシステムの設計においては，装置の構造，運転条件，アイソレータ内で行う各種作業に関するリスク評価を行い，結果を仕様に反映すること．
        role: normative
