        locator: line:1761
      children:
      - nid: cha15.sec15_1.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 531
        heading: null
        text: 大きさ又は形態からオートクレーブによる滅菌が不可能な設備（タンク，充てんライン，移動ライン，ろ過装置及び注射用水製造装置等）についてSIPを適用する場合においては，装置内の温度計，圧力計，熱電対，及び湿熱抵抗性ＢＩ等の適切な手段を用いて，十分な滅菌効果（通例は無菌性保証水準≦10-6）のあることを実証すること．ＢＩを使用する場合は蒸気や凝縮水の流れを妨げないように設置すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1762
        - source_label: PMDA aseptic processing guideline
          locator: line:1763
        - source_label: PMDA aseptic processing guideline
          locator: line:1764
        - source_label: PMDA aseptic processing guideline
          locator: line:1765
        - source_label: PMDA aseptic processing guideline
          locator: line:1766
        children: []
      - nid: cha15.sec15_1.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 532
        heading: null
        text: SIPには，精製水又はそれ以上の品質の水を用いて発生させた蒸気を用いること．蒸気の凝縮水は，製品の仕込み水と同等以上の規格に適合すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1767
        - source_label: PMDA aseptic processing guideline
          locator: line:1768
        children: []
      - nid: cha15.sec15_1.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 533
        heading: null
        text: 設備内において滅菌が最も困難な箇所（コールドスポット）を確定し，当該コールドスポットにおける無菌性保証水準の達成度を定期的に検証すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1769
        - source_label: PMDA aseptic processing guideline
          locator: line:1770
        children: []
      - nid: cha15.sec15_1.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 534
        heading: null
        text: SIP実施後の設備の無菌性を維持すること．SIPにおいては，全設備の内部がまだ蒸気陽圧下にあるうちに無菌ガス（空気又は窒素）を導入し，蒸気及び凝縮水を当該設備から除去し，当該設備の内部を使用準備が整うまで陽圧下に維持すること．内部を陰圧又は常圧の条件下において運転を行うことがある設備については，それらの条件においても設備の無菌性が損なわれないことを検証すること．SIP終了からその設備を使用するまでの最大許容放置時間を定めて検証すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
