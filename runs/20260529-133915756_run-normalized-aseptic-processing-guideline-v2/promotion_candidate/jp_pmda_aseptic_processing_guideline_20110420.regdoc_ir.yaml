      locator: line:2706
    - source_label: PMDA aseptic processing guideline
      locator: line:2707
    children:
    - nid: chaa2.pa2_1
      kind: paragraph
      kind_raw: A2.1
      num: A2.1
      ord: 855
      heading: null
      text: 製薬用水設備の基本設計の留意点要求される品質に適合する製薬用水を恒常的に製造するため，製薬用水設備，製造管理及び品質管理に関する手順並びにその他の方法を，あらかじめ明確に定めてから基本設計を行う．基本設計上，考慮すべき重要事項を以下に示す．
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:2710
      - source_label: PMDA aseptic processing guideline
        locator: line:2711
      - source_label: PMDA aseptic processing guideline
        locator: line:2712
      - source_label: PMDA aseptic processing guideline
        locator: line:2713
      children:
      - nid: chaa2.pa2_1.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 856
        heading: null
        text: 製薬用水の種類及び規格，量及び管理方法を明確にすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2714
        children: []
      - nid: chaa2.pa2_1.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 857
        heading: null
        text: 季節的な変動を含め原水の水質を把握すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2715
        children: []
      - nid: chaa2.pa2_1.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 858
        heading: null
        text: 最大瞬間使用量，使用時間，使用頻度，ユースポイントでの諸条件（温度，取出し箇所数，分枝管や管径などの配管規格）等を設定すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2716
        - source_label: PMDA aseptic processing guideline
          locator: line:2717
        children: []
      - nid: chaa2.pa2_1.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 859
        heading: null
        text: 微生物管理を確実にするための殺菌又は滅菌を考慮した設備とすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2718
        children: []
      - nid: chaa2.pa2_1.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 860
        heading: null
        text: 当該規格の水質が恒常的に得られるように適切な監視を行うために必要なサンプリング位置を充分に検討すること．サンプリングは，ユースポイントだけでなく，製薬用水の製造工程の重要な個所においても行うこと．水質評価が必要な箇所では，適切なサンプリング操作が行える構造であること．構造的にサンプリング口を設けることが困難な場合は，できる限りユースポイントに近い場所にサンプリング口を設けることが望ましい．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2719
        - source_label: PMDA aseptic processing guideline
          locator: line:2720
        - source_label: PMDA aseptic processing guideline
          locator: line:2721
        - source_label: PMDA aseptic processing guideline
          locator: line:2722
        - source_label: PMDA aseptic processing guideline
          locator: line:2723
        children: []
      - nid: chaa2.pa2_1.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 861
        heading: null
        text: ユースポイントへの水の供給は循環方式を原則とするが，循環しない場合は水質が維持できるよう手段を講じること．精製水設備の下流工程では，菌増殖の可能性を考慮し，フィルターは利用しないこと．ただし，精製水設備の上流側では，不純物除去目的に適切なフィルターを選定し，設置することがある．（例：活性炭塔出口の保護フィルター等）
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2724
        - source_label: PMDA aseptic processing guideline
          locator: line:2725
        - source_label: PMDA aseptic processing guideline
          locator: line:2726
        - source_label: PMDA aseptic processing guideline
          locator: line:2727
        children: []
      - nid: chaa2.pa2_1.i7
        kind: item
        kind_raw: 7)
        num: '7'
        ord: 862
        heading: null
        text: ユースポイントからの逆流がないように圧力差，弁の開閉の順序などを考慮すること．
