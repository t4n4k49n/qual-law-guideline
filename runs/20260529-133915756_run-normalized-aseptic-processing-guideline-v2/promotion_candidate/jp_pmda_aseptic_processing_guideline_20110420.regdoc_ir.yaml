          kind: item
          kind_raw: 5)
          num: '5'
          ord: 461
          heading: null
          text: 滅菌サイクルが規定の許容範囲内において達成されたことを立証するために，サイクルパラメータとして設定した項目について直接的な方法により測定を行い記録すること．必要な場合においてはバイオロジカルインジケータやケミカルインジケータを用いた確認も含めること．
          role: normative
          normativity: must
          tags: []
