          locator: line:2580
        - source_label: PMDA aseptic processing guideline
          locator: line:2581
        children: []
    - nid: cha20.sec20_4
      kind: section
      kind_raw: ２０．４
      num: '20.4'
      ord: 818
      heading: 培養及び観察
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:2584
      children:
      - nid: cha20.sec20_4.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 819
        heading: null
        text: 培養に先立ち，容器に漏れが認められたもの，又は損傷したものは記録した上で除去する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2585
        children: []
      - nid: cha20.sec20_4.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 820
        heading: null
        text: 培地を充てんした容器を旋回や反転させ，容器内全面に培地を接触させる．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2586
        children: []
      - nid: cha20.sec20_4.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 821
        heading: null
        text: 培養は20～35℃の範囲内の設定温度で14日間以上実施する．この範囲以外の温度で培養する場合は，その妥当性を示すこと．培養温度は設定温度に対して±2.5℃の範囲内であること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2587
        - source_label: PMDA aseptic processing guideline
          locator: line:2588
        - source_label: PMDA aseptic processing guideline
          locator: line:2589
        children: []
      - nid: cha20.sec20_4.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 822
        heading: null
        text: 異なる二つの温度で培養する場合には低い温度で7日間以上，次いで高い温度で7日間以上培養する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2590
        - source_label: PMDA aseptic processing guideline
          locator: line:2591
        children: []
      - nid: cha20.sec20_4.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 823
        heading: null
        text: 培養最終日に菌の発育の有無を観察する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2592
        children: []
      - nid: cha20.sec20_4.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 824
        heading: null
        text: 汚染が認められた場合は，汚染菌の同定及び性状検査を行い，汚染原因の調査に役立てる．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2593
        - source_label: PMDA aseptic processing guideline
          locator: line:2594
        children: []
    - nid: cha20.sec20_5
