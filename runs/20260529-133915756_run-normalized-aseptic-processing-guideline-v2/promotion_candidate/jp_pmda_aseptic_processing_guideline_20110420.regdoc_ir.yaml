          locator: line:997
        - source_label: PMDA aseptic processing guideline
          locator: line:998
        - source_label: PMDA aseptic processing guideline
          locator: line:999
        children: []
      - nid: cha8.sec8_1.i11
        kind: item
        kind_raw: 11)
        num: '11'
        ord: 237
        heading: null
        text: 燻蒸剤（エアゾールを含む．）を使用する場合においては，その使用する薬品の性質に応じて上記の項目を準用すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1000
        - source_label: PMDA aseptic processing guideline
          locator: line:1001
        children: []
      - nid: cha8.sec8_1.i12
        kind: item
        kind_raw: 12)
        num: '12'
        ord: 238
        heading: null
        text: 消毒剤，洗浄剤及びそれらに使用するための器具類は，重要区域に保管しないこと．ただし，手袋を消毒するためのハンドスプレーなどの，管理された状態にある必要最小限のものは重要区域内に保管してもよい．それらの重要区域内に保管する消毒剤，洗浄剤は，その理由及び管理方法を文書化しておくこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
