    heading: 無菌医薬品に係る製品の作業所の清浄化及び消毒
    text: 無菌医薬品に係る製品の作業所は，手順書に従って清浄化及び消毒を行い，その記録を作成し保管すること．
    role: structural
    normativity: null
    tags: []
    refs:
      internal: []
      external: []
    source_spans:
    - source_label: PMDA aseptic processing guideline
      locator: line:958
    - source_label: PMDA aseptic processing guideline
      locator: line:959
    - source_label: PMDA aseptic processing guideline
      locator: line:960
    children:
    - nid: cha8.sec8_1
      kind: section
      kind_raw: ８．１
      num: '8.1'
      ord: 220
      heading: 消毒剤及び洗浄剤
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:963
      children:
      - nid: cha8.sec8_1.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 221
        heading: null
        text: 妥当性が確認された洗浄剤及び消毒剤のみを使用すること．なお，定期的な環境モニタリングにおいて把握された菌数及び菌種の状況から使用している消毒剤の有効性を確認すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:964
        - source_label: PMDA aseptic processing guideline
          locator: line:965
        children: []
      - nid: cha8.sec8_1.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 222
        heading: null
        text: 無菌操作区域において使用する洗浄剤及び消毒剤は，無菌性を保証した上で販売されている物をそのまま用いるときのほかは，事前にろ過等により無菌化処理を行い，かつ微生物による汚染を受けないように管理すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:966
        - source_label: PMDA aseptic processing guideline
          locator: line:967
        - source_label: PMDA aseptic processing guideline
          locator: line:968
        children: []
      - nid: cha8.sec8_1.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 223
        heading: null
        text: 洗浄剤及び消毒剤を自家調製する場合においては，手順書に従って行うこと．またその調製の記録を作成し，保管すること．販売されている洗浄剤及び消毒剤を希釈して使用する場合は，その希釈液，希釈濃度，有効期限，保管方法，及び該当する場合は滅菌方法，その他の必要な事項を，文書化して品質部門による承認を受けること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:969
        - source_label: PMDA aseptic processing guideline
          locator: line:970
        - source_label: PMDA aseptic processing guideline
          locator: line:971
        - source_label: PMDA aseptic processing guideline
          locator: line:972
        - source_label: PMDA aseptic processing guideline
          locator: line:973
        children: []
      - nid: cha8.sec8_1.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 224
        heading: null
        text: 品質部門により承認された薬品の使用，清浄化及び消毒のスケジュール，消毒剤の適用法，必要に応じて消毒後の清浄化，職員の安全に関する諸注意並びに清浄用具の手入れ及び保管について手順書に記載すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:974
        - source_label: PMDA aseptic processing guideline
          locator: line:975
        - source_label: PMDA aseptic processing guideline
          locator: line:976
        children: []
      - nid: cha8.sec8_1.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 225
        heading: null
        text: 製品と接触する表面の消毒又は洗浄を行った場合においては，消毒剤及び洗浄剤が除去されたことを適切な評価法を用いて確認すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:977
        - source_label: PMDA aseptic processing guideline
          locator: line:978
        children: []
      - nid: cha8.sec8_1.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 226
        heading: null
        text: 消毒剤は，適切な有効期限を設定し，期限内のものを使用すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:979
        children: []
      - nid: cha8.sec8_1.i7
        kind: item
        kind_raw: 7)
        num: '7'
        ord: 227
        heading: null
        text: 消毒剤は，製造環境に対しては原則として清浄化の後に適用すること．使用した洗浄剤の残留が懸念される適用部位は，その洗浄剤は，消毒剤の効果に悪影響を及ぼさないこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:980
        - source_label: PMDA aseptic processing guideline
          locator: line:981
        children: []
      - nid: cha8.sec8_1.i8
        kind: item
        kind_raw: 8)
        num: '8'
        ord: 228
        heading: null
        text: 消毒剤容器の継足し使用は行わないこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:982
        children: []
      - nid: cha8.sec8_1.i9
        kind: item
        kind_raw: 9)
        num: '9'
        ord: 229
        heading: null
        text: 消毒剤の選択及び使用に当たっては，尐なくとも以下のことを考慮すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:986
        children:
        - nid: cha8.sec8_1.i9.si1
          kind: subitem
          kind_raw: ①
          num: '1'
          ord: 230
          heading: null
          text: 保管及び使用に関しては消毒剤の供給者の指示事項に従うこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:987
          children: []
        - nid: cha8.sec8_1.i9.si2
          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 231
          heading: null
          text: 消毒剤及び消毒手順の選択に当たっては，職員の安全性を考慮すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:988
          children: []
        - nid: cha8.sec8_1.i9.si3
          kind: subitem
          kind_raw: ③
          num: '3'
          ord: 232
          heading: null
          text: 環境より分離される微生物に対して，使用している薬剤の有効性が疑われる場合は，必要に応じてその有効性を評価し，消毒剤の変更や交互に使用することを考慮すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:989
          - source_label: PMDA aseptic processing guideline
            locator: line:990
          children: []
        - nid: cha8.sec8_1.i9.si4
          kind: subitem
          kind_raw: ④
          num: '4'
          ord: 233
          heading: null
          text: 環境モニタリングにおいて芽胞形成細菌又は真菌の存在が示唆された場合においては必要に応じて殺芽胞剤又は殺胞子剤を使用すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:991
          - source_label: PMDA aseptic processing guideline
            locator: line:992
          children: []
        - nid: cha8.sec8_1.i9.si5
          kind: subitem
          kind_raw: ⑤
          num: '5'
          ord: 234
          heading: null
          text: 消毒剤の使用は，消毒方法，消毒の適用箇所，及び消毒作用を発現させるのに必要な時間を考慮すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
