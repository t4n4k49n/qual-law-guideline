        - nid: cha7.sec7_2.p7_2_2.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 203
          heading: null
          text: 重要区域（グレードA）の気流は，一方向気流とし，浮遊微粒子を区域外へ速やかに排出できるような流速及び均一性を有すること．また，近接する直接支援区域（グレードB）からの逆流のない気流を維持し，汚染を防止すること．従来型の開放系クリーンブースやRABSを使用する場合，0.45m/sec±20%の平均風速が推奨される．アイソレータや特殊な適用事例においては，より遅い風速が適切な場合もある．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
