          kind_raw: 13)
          num: '13'
          ord: 455
          heading: null
          text: 滅菌サイクル中に滅菌機の缶体内部のエアが十分に抜けていることを定期的に確認することが望ましい．必要な場合は，日常管理項目に含むこと．代表的な方法としては，Bowie-Dick試験がある．
          role: normative
          normativity: must
          tags: []
