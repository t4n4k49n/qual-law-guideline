      kind: section
      kind_raw: ２．２５
      num: '2.25'
      ord: 27
      heading: 除染(decontamination)
      text: 再現性のある方法により生存微生物を除去し，又はあらかじめ指定されたレベルまで減尐させることをいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
