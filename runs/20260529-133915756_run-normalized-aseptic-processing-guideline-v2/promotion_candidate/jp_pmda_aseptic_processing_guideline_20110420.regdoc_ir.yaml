        - nid: cha19.sec19_1.p19_1_1.i1
          kind: item
          kind_raw: 1)
          num: '1'
          ord: 690
          heading: null
          text: 無菌医薬品に係る製品の製造を目的とするアイソレータを設置する環境の空気の清浄度レベルは，尐なくともグレードＤとすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2231
          - source_label: PMDA aseptic processing guideline
            locator: line:2232
          children: []
        - nid: cha19.sec19_1.p19_1_1.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 691
          heading: null
          text: 二つのアイソレータの接続並びに無菌資材並びに無菌原料の搬入及び搬出に用いる接続ポートは，アイソレータの無菌性を維持することができる構造とすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2233
          - source_label: PMDA aseptic processing guideline
            locator: line:2234
          children: []
        - nid: cha19.sec19_1.p19_1_1.i3
          kind: item
          kind_raw: 3)
          num: '3'
          ord: 692
          heading: null
          text: ハーフスーツ，グローブ，搬出口及び接続ポートの数は，汚染の機会を尐なくするために必要最小限とすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2235
          - source_label: PMDA aseptic processing guideline
            locator: line:2236
          children: []
        - nid: cha19.sec19_1.p19_1_1.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 693
          heading: null
          text: 製品搬出口等の開口部にあっては，外部からの汚染を防ぐことができる構造とし，常にアイソレータ内部から外部へ向かう気流を確保すること．一般的には適切な差圧を維持することにより達成する．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2237
          - source_label: PMDA aseptic processing guideline
            locator: line:2238
          - source_label: PMDA aseptic processing guideline
            locator: line:2239
          children: []
        - nid: cha19.sec19_1.p19_1_1.i5
          kind: item
          kind_raw: 5)
          num: '5'
          ord: 694
          heading: null
          text: アイソレータ設備の内表面の除染手順については，適用する除染剤に対して抵抗性の高い芽胞の４～６logの減尐が達成されることを検証したものであること．除染の程度は，アイソレータ設備の用途及びバイオバーデンを考慮して設定すること．アイソレータ設備に持ち込む資材等の除染手順についても，同様に４～６logの減尐を実証の上確保すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2240
          - source_label: PMDA aseptic processing guideline
            locator: line:2241
          - source_label: PMDA aseptic processing guideline
            locator: line:2242
          - source_label: PMDA aseptic processing guideline
            locator: line:2243
          children: []
        - nid: cha19.sec19_1.p19_1_1.i6
          kind: item
          kind_raw: 6)
          num: '6'
          ord: 695
          heading: null
          text: 製品と接触する表面の除染手順については，除染前のバイオバーデンをできるだけ低く抑える方策を講じると共に，６log以上の減尐を達成できる条件によること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2246
          - source_label: PMDA aseptic processing guideline
            locator: line:2247
          children: []
        - nid: cha19.sec19_1.p19_1_1.i7
          kind: item
          kind_raw: 7)
          num: '7'
          ord: 696
          heading: null
          text: あらかじめ定めた基準に基づいてリーク試験を実施すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2248
          children: []
        - nid: cha19.sec19_1.p19_1_1.i8
          kind: item
          kind_raw: 8)
          num: '8'
          ord: 697
          heading: null
          text: 除染の頻度は，リスクに基づいて適切に設定し，バリデーションによって確立して定期的に見直すこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2249
