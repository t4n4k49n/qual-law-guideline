  - nid: cha11
    kind: chapter
    kind_raw: '1.'
    num: '11'
    ord: 313
    heading: 環境モニタリング
    text: 環境モニタリングの主な目的は，無菌医薬品に係る製品の製造環境の清浄度を維持する上で，無菌操作区域及びその他支援区域において，微生物数及び微粒子数が要求される基準を超えないよう管理すること，環境の悪化を事前に把握し製品の汚染を防ぐこと，及び清浄度維持のための清浄化及び殺菌又は消毒の効果を継続的に評価することにある．環境モニタリングは微生物管理と微粒子管理の二つに分けられる．微生物管理は，環境に存在する全ての微生物を解明することではなく，環境のバイオバーデンを科学的に推定すること，無菌医薬品に係る製品が適切な管理状態において製造されたことを保証すること，及び必要に応じた環境維持操作（消毒等）を行うことを目的としている．
    role: structural
    normativity: null
    tags: []
    refs:
      internal: []
      external: []
