          locator: line:2665
        - source_label: PMDA aseptic processing guideline
          locator: line:2666
        - source_label: PMDA aseptic processing guideline
          locator: line:2667
        - source_label: PMDA aseptic processing guideline
          locator: line:2668
        - source_label: PMDA aseptic processing guideline
          locator: line:2669
        - source_label: PMDA aseptic processing guideline
          locator: line:2670
        - source_label: PMDA aseptic processing guideline
          locator: line:2671
        - source_label: PMDA aseptic processing guideline
          locator: line:2672
        children: []
      - nid: chaa1.pa1_2.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 844
        heading: null
        text: 培地は培養液又は発酵液の品質を保護するために使用前に適切な方法により滅菌すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2673
        children: []
      - nid: chaa1.pa1_2.i7
        kind: item
        kind_raw: 7)
        num: '7'
        ord: 845
        heading: null
        text: 微生物等による汚染が発生した場合の措置（除染，廃棄，洗浄性確認，最終製品への影響）を標準化しておくこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2674
        - source_label: PMDA aseptic processing guideline
          locator: line:2675
        children: []
      - nid: chaa1.pa1_2.i8
        kind: item
        kind_raw: 8)
        num: '8'
        ord: 846
        heading: null
        text: 播種工程あるいは添加物の添加作業などは閉鎖系で行うことを原則とする．開放容器を使用する作業は，汚染を防止するために安全キャビネット又は同様に管理された封じ込め設備において行うこと．なお，作業に係る職員や環境への汚染防止並びに製造工程への汚染防止との双方の観点から管理すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
