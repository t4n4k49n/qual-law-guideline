        - nid: cha19.sec19_1.p19_1_6.i10
          kind: item
          kind_raw: 10)
          num: '10'
          ord: 743
          heading: null
          text: 微生物学的モニタリングは，構造設備の特徴及び作業の特性に応じたリスクに基づき，あらかじめ定めた箇所において一定間隔で実施すること．一般的には，アイソレータ設備内部の表面，グローブの表面，アイソレータ設備に搬入した資材及びそれらの接触箇所等がモニタリングの対象となる．測定箇所と測定頻度の妥当性については，定期的に評価すること．
          role: normative
          normativity: must
          tags: []
