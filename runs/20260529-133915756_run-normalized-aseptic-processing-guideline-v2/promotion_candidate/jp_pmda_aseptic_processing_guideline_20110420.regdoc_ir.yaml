        text: 検査工程のバリデーションに使用する異物サンプルは生産から得られた異物サンプルを使用することが望ましい．これらのサンプルは品質部門の承認を得ること． Ｂ改訂履歴2006年7月：監視指導麻薬対策課から事務連絡として発出．2011年4月：全面改正，監視指導麻薬対策課から事務連絡として発出．
