        kind: item
        kind_raw: 3)
        num: '3'
        ord: 829
        heading: null
        text: 空調設備，設備・機器等の薬液接触面，ろ過性能など医薬品の無菌性を構成する他の要素が適切なバリデーションや定期的な再評価により別途保証されている．
        role: normative
        normativity: must
