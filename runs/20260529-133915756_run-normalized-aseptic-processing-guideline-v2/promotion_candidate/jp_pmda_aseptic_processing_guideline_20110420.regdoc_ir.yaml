    - nid: chaa2.pa2_3_3
      kind: paragraph
      kind_raw: A2.3.3
      num: A2.3.3
      ord: 924
      heading: null
      text: サンプリング製薬用水設備が管理下にあり，許容される品質の水を連続的に製していることを確実にする十分な頻度で，製薬用水設備のモニタリングプログラムを行うこと．サンプリングは，その工程及び分配設備内の製薬用水の品質を代表すると思われる箇所において行うものとし，バリデーションデータに基づき頻度を確立し，重要な領域をカバーすること．サンプリング計画は，採取する水に求められる品質特性を考慮して定めること．例えば，注射用水の設備は，微生物学的に厳格なレベルが要求されることから，サンプリング頻度を他の製薬用水よりも高めることが必要となる．微生物学的分析用のサンプルは，直ちに試験するか又は分析を始めるまでそのサンプルを適切に保管すること．直ちにサンプルの試験をしない場合は，その保管状態と保管時間を記録に残すこと．微生物学的分析は，採取したサンプル中の微生物数を通して，製薬用水設備中に存在するであろう微生物の存在や状態を推定するに過ぎない．したがって，浮遊性微生物数が，製薬用水設備の汚染レベルの指標として使用され，製薬用水設備の警報基準値設定の基礎となる．浮遊性微生物の菌数レベルが一貫して高く出現することは，バイオフィルムが進展した指標であり，それを制御する措置が必要である．
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
