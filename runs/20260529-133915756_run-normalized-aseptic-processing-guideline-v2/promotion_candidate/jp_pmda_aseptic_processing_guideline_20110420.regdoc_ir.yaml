        - nid: cha19.sec19_2.p19_2_1.i1
          kind: item
          kind_raw: 1)
          num: '1'
          ord: 746
          heading: null
          text: RABS内の環境や空調システムは，本指針の７章に示す重要区域に掛かる要件を満足すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
