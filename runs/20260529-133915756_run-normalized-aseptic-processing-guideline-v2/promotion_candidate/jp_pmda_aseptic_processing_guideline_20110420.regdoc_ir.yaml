        - source_label: PMDA aseptic processing guideline
          locator: line:928
        children:
        - nid: cha7.sec7_3.p7_3_1.i1
          kind: item
          kind_raw: 1)
          num: '1'
          ord: 211
          heading: null
          text: HEPAフィルターには，粒径0.3μm以上の粒子を99.97%以上の効率で捕らえる性能を有することを示す供給者の証明書が添付されていること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:929
          - source_label: PMDA aseptic processing guideline
            locator: line:930
          children: []
        - nid: cha7.sec7_3.p7_3_1.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 212
          heading: null
          text: 重要区域（グレードA）及び直接支援区域（グレードB）において使用するHEPAフィルターのリーク試験は，PAO(Poly-alpha-olefin)等の適切なエアロゾルを用いて行うこと．その他の代替エアロゾルを使用する場合においては，微生物の発育を助長しないことを確認した上で使用すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:931
          - source_label: PMDA aseptic processing guideline
            locator: line:932
          - source_label: PMDA aseptic processing guideline
            locator: line:933
          - source_label: PMDA aseptic processing guideline
            locator: line:934
          children: []
      - nid: cha7.sec7_3.p7_3_2
        kind: paragraph
        kind_raw: ７．３．２
        num: 7.3.2
        ord: 213
        heading: null
        text: フィルター据付け時の試験及び定期試験
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:937
        children:
        - nid: cha7.sec7_3.p7_3_2.i1
          kind: item
          kind_raw: 1)
          num: '1'
          ord: 214
          heading: null
          text: HEPAフィルターは，据付け時及び定期的にリーク試験を行うこと．リーク試験の方法及び頻度については，HEPAフィルターの設置環境及び使用目的に応じ適切に定めること．重要区域並びに直接支援区域のHEPAフィルターの完全性は最低でも1年に１回確認すること．重要区域のフィルターの使用条件が過酷な場合や，製品の微生物汚染リスクに対して特に高い配慮が必要な場合等は，１年に2回以上の頻度で完全性を確認することが望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:938
          - source_label: PMDA aseptic processing guideline
            locator: line:939
          - source_label: PMDA aseptic processing guideline
            locator: line:940
          - source_label: PMDA aseptic processing guideline
            locator: line:941
          - source_label: PMDA aseptic processing guideline
            locator: line:945
          children: []
        - nid: cha7.sec7_3.p7_3_2.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 215
          heading: null
          text: 重要区域（グレードA）に設置するHEPAフィルターについては，吹出し風速の均一性について据付け時及び定期的に検査すること．検査実施の頻度については前項に従う．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:946
          - source_label: PMDA aseptic processing guideline
            locator: line:947
          children: []
        - nid: cha7.sec7_3.p7_3_2.i3
          kind: item
          kind_raw: 3)
          num: '3'
          ord: 216
          heading: null
          text: HEPAフィルターの差圧を据付け時及び定期的に検査すること．フィルターの目詰まりのリスクが大きい状況においては，日常的な管理項目に含めることが望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:948
          - source_label: PMDA aseptic processing guideline
            locator: line:949
          - source_label: PMDA aseptic processing guideline
            locator: line:950
          children: []
        - nid: cha7.sec7_3.p7_3_2.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 217
          heading: null
          text: 無菌操作区域において，気流パターンを変化させた場合，又はその可能性がある場合においては，気流パターンが適切なものであることを再度確認すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:951
          - source_label: PMDA aseptic processing guideline
            locator: line:952
          children: []
        - nid: cha7.sec7_3.p7_3_2.i5
          kind: item
          kind_raw: 5)
          num: '5'
          ord: 218
          heading: null
          text: HEPAフィルターの完全性に影響を及ぼしかねない事象若しくは状況が生じた場合，又は空気の品質が劣化していると判断された場合においては，手順書に従ってHEPAフィルターのリーク試験を行うこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:953
          - source_label: PMDA aseptic processing guideline
