          kind: item
          kind_raw: 12)
          num: '12'
          ord: 454
          heading: null
          text: 多孔性の対象物を滅菌する場合は，深奥部まで十分にエアと蒸気の置換が行われるよう，注意深く滅菌サイクルを構築すること．
