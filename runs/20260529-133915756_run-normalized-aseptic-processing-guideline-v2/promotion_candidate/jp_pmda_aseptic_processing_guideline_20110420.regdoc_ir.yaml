      num: '7.1'
      ord: 173
      heading: 清浄度レベルによる作業所の分類
      text: 無菌医薬品に係る製品の作業所は，浮遊微粒子及び微生物による汚染の程度が定められた限度内に維持されるよう管理された清浄区域であり，その作業内容により，重要区域，直接支援区域，その他の支援区域に分類される．一般的に各区域の清浄度レベルは，環境空気の単位体積当たりに含まれる粒径0.5μm以上の浮遊微粒子数によって表される．また，粒径5.0μm以上の浮遊微粒子数は定期的に測定し，傾向分析を行うことにより，環境条件の劣化を早期に発見するための有効な管理項目となる．各区域に要求される空気の清浄度レベルを表１に示す．
      role: structural
      normativity: null
      tags: []
