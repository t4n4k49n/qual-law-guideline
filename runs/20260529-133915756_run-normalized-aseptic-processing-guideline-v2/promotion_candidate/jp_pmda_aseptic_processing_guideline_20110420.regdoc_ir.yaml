        - nid: cha7.sec7_1.p7_1_3.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 194
          heading: null
          text: その他の支援区域には，そこで実施される製造作業に要求される汚染管理の程度及び当該作業の内容を勘案して適切な浮遊微粒子数の規定を設けること．
          role: normative
          normativity: must
          tags: []
          refs:
