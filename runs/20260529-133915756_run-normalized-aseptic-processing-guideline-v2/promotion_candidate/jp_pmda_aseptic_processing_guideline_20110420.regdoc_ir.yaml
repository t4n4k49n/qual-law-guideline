        kind: item
        kind_raw: 1)
        num: '1'
        ord: 418
        heading: null
        text: 滅菌に用いる蒸気の品質は，滅菌対象物の本来の性能及び安全性を損なわないものであること．一般的には精製水又はそれ以上の品質の水を用いて発生させた蒸気（ピュアスチーム）を使用する．蒸気の凝縮水は，製品の仕込み水と同等以上の規格に適合すること．定期的にその性状を確認し，品質の劣化が疑われる場合においては，原因を調査し適切な措置を採ること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
