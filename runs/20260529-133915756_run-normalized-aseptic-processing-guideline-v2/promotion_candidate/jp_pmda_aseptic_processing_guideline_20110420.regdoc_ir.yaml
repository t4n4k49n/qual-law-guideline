    - nid: cha19.sec19_3
      kind: section
      kind_raw: １９．３
      num: '19.3'
      ord: 764
      heading: ブローフィルシール
      text: ブローフィルシールは，清浄環境下において，プラスチックペレットからプラスチック容器を成型するとともに，同時に充てん及び閉そくを行い，無菌製品を製造する一貫製造方式による技術である．容器の成型，充てん及び熔閉を連続して密閉環境において行うもので，充てん中は作業者の介入が全く無く，高度な無菌環境が維持されるため，通常，製品の熔閉後の滅菌（高圧蒸気滅菌等）を行わずに無菌性を保証できる．閉鎖系による自動一貫連続工程であるために，製造時の汚染の機会が比較的尐ない点に特徴がある．ただし，完全な閉鎖系の中で充てん閉そくが行われるものや，キャップや中栓を外部から投入するものなど，異なるタイプのシステムがあるので，それぞれの特徴に応じた無菌管理プログラムを構築する必要がある．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
