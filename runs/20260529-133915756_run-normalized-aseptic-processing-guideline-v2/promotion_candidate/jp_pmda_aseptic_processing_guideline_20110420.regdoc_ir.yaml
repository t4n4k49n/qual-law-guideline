      - source_label: PMDA aseptic processing guideline
        locator: line:326
      children: []
    - nid: cha2.sec2_21
      kind: section
      kind_raw: ２．２１
      num: '2.21'
      ord: 23
      heading: 処置基準値(action level)
      text: 測定対象物の数（測定対象が微生物である場合においては必要に応じてその種）に対して設定した基準値であって，この値に達した場合においては直ちに調査を行い，必要に応じて是正措置を採るべきものをいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
