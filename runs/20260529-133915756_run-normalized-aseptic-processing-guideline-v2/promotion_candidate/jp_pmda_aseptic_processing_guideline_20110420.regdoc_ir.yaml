          ord: 786
          heading: null
          text: 熔融及び成型の温度及び時間は，樹脂の成型のみならず，樹脂由来の微生物滅菌の観点からも重要である．プラスチックの熔融及び成型に至る時間及び温度が乾熱滅菌（プラスチックペレットが熔融され，成型される工程は，水分のない乾熱状態となる．）の条件として妥当なものであることが検証され，かつ管理されていること．参考：日米欧薬局方においては，乾熱滅菌の指標菌として，Bacillus atrophaeusを推奨している．B.atrophaeus ATCC9372についてガラス上においての実測D160値は0.89～1.22，プラスチック上においては1.22～2.07と報告されている．
