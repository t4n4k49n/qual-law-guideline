        ord: 685
        heading: null
        text: 監視及び制御を実施する温度制御器，真空計等の重要計器は定期的に校正し，記録を作成の上保管すること．校正頻度は，前回の結果において頻度変更の必要性が示されない限り，約6カ月毎とすることが望ましい．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
