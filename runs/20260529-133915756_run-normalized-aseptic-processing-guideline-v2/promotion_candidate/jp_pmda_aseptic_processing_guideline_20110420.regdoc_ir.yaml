    - nid: cha20.sec20_1
      kind: section
      kind_raw: ２０．１
      num: '20.1'
      ord: 803
      heading: 概要と範囲
      text: プロセスシミュレーションとは，「培地充てん試験法」の考え方を全無菌工程に広めたものである．無菌製品は，複数の無菌化工程，無菌原料及び無菌資材の組合せによる複合的な工程により製造されるものであり，充てん工程は無菌製品を製造するための一工程である．無菌操作法により製造される製品の無菌性保証の適切性を検証するためには，無菌操作により行う工程の全てについてバリデーションを行なわなければならない．プロセスシミュレーションはその一方法であり，製品の代わりに培地又は菌の増殖を保持する物質を用い，無菌充てん工程にとどまらず，無菌医薬品に係る製品の製造工程全般の評価を行う方法である．その対象範囲は，「ろ過」，「晶出」，「乾燥」，「粉砕」，「混合」，「粉末のトレイ凍結乾燥工程」，「乾燥工程」等無菌原薬に係る製品の製造工程，「充てん」，「閉そく」等の無菌製剤に係る製品の製造工程全般が包含されている．また，作業を行う職員，作業環境，作業及び操作は，実際の製品の製造工程に可能な限り準じることとし，かつ，実用的な範囲内でワーストケースを想定して行う．実施にあたっては，日本薬局方参考情報「培地充てん試験（プロセスシミュレーション）」を参考にすること．
      role: structural
      normativity: null
      tags: []
