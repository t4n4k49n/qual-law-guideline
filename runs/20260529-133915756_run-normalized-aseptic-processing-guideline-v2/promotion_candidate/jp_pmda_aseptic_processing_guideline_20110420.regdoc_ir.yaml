          ord: 807
          heading: null
          text: 再評価各無菌操作工程及び充てんラインの各作業シフトについて，日本薬局方を参考にそれぞれの充てんラインでの実製造を反映できる十分な個数の容器を用い，尐なくとも半年毎にプロセスシミュレーションを実施する．バルクの場合は一製造単位の量を用い，プロセスシミュレーションを実施する．無菌重要工程に携わる職員は，無菌操作に関する教育訓練を受け，尐なくとも年1回の頻度でプロセスシミュレーションに参加すること．各無菌操作工程及び充てんラインを6箇月以上使用しなかった場合は，再使用する前に初期評価に準じる回数のプロセスシミュレーションを実施する．無菌性保証に影響を与える工程，設備又は装置の変更，無菌重要工程に携わる職員の変更，環境微生物試験結果の異常，最終製品の無菌試験で汚染製品が認められた場合には，必要に応じて初期評価に準じる回数のプロセスシミュレーションを実施する．
