      num: A2.3.1
      ord: 922
      heading: null
      text: 概要日常及び定期的管理プログラムは，初期に実施したバリデーションにおいて当該工程の妥当性が十分に実証されていることが前提とされる．日常管理項目については，導電率及び全有機体炭素（TOC）の管理が必須であり，定期的管理項目については，製薬用水の使用目的に応じ，上記に加えて生菌数，エンドトキシン，微粒子数等を管理すること．これらの測定頻度は，水質の安定性を考慮して決定すること．日常管理手法の詳細については，日本薬局方参考情報収載の「製薬用水の品質管理」を参照すること．
      role: normative
