          text: 環境空気の品質ブローフィルシールでは，製品が環境空気に曝露されるのは，成型及び充てんに係る部分のみである．成型及び充てんに係る部分の局所の環境及びそこに供給される空気の清浄度レベルはグレードAを満足すること．成型及び充てんに係る設備の周辺の空気の清浄度レベルはグレードC以上であること．職員の更衣についても設置環境に応じた清浄衣を着用すること．
