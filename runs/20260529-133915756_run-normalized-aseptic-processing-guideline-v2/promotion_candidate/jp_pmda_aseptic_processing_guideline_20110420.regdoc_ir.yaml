        locator: line:306
      - source_label: PMDA aseptic processing guideline
        locator: line:307
      - source_label: PMDA aseptic processing guideline
        locator: line:308
      children: []
    - nid: cha2.sec2_16
      kind: section
      kind_raw: ２．１６
      num: '2.16'
      ord: 18
      heading: 工程パラメータ(process parameter)
      text: 工程の変動要因を特定する数値をいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:310
      children: []
    - nid: cha2.sec2_17
      kind: section
      kind_raw: ２．１７
      num: '2.17'
      ord: 19
      heading: コロニー形成単位(cfu:colony forming unit)
      text: 単一又は複数の細胞から発育した微生物の集落をいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:312
      - source_label: PMDA aseptic processing guideline
