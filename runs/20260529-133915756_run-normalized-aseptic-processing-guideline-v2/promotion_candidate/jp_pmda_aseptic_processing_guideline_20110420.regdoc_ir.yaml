    - nid: cha2.sec2_18
      kind: section
      kind_raw: ２．１８
      num: '2.18'
      ord: 20
      heading: 最終滅菌(terminal sterilization)
      text: 滅菌される物が最終容器又は包装に収められた状態において行い，当該滅菌後の微生物の死滅を定量的に測定又は推測できるような滅菌をいう．通例，10-6以下の無菌性保証水準が得られる条件において行う．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:316
      - source_label: PMDA aseptic processing guideline
        locator: line:317
      - source_label: PMDA aseptic processing guideline
        locator: line:318
      children: []
    - nid: cha2.sec2_19
      kind: section
      kind_raw: ２．１９
      num: '2.19'
      ord: 21
      heading: 作業シフト(working shift)
      text: 同じ職員又は組織によってなされる一定の作業又は作業時間をいう．通例，1シフトは12時間以内である．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:320
      - source_label: PMDA aseptic processing guideline
