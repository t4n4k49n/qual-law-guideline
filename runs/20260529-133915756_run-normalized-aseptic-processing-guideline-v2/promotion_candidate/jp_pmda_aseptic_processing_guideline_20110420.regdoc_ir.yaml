        children: []
      - nid: cha11.sec11_3.i7
        kind: item
        kind_raw: 7)
        num: '7'
        ord: 340
        heading: null
        text: 製造が行われていない時間帯の微粒子モニタリングは，空調の不具合発見など，環境維持継続性の観点から適宜実施する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1303
        - source_label: PMDA aseptic processing guideline
