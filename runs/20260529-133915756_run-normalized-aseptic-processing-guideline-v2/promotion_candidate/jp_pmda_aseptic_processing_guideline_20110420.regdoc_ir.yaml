            heading: null
            text: ろ過したガスが直接滅菌製品に接触する工程ろ過したガスが直接滅菌製品に接触する工程（無菌充てん装置，滅菌バルクホールディングタンクのベントフィルター，凍結乾燥装置，オートクレーブのバキュームブレークフィルター等に係る工程）に使用するガスフィルターは，液体ろ過滅菌用フィルターに係る液体を用いた細菌チャレンジテスト（通例，フィルターの供給者が液体（通例，水を使用する．）を用いて実施する．）の結果との相関性を持った完全性試験を実施すること．この試験法については，フィルター供給者に確認すること（17.1.3を参照）．
