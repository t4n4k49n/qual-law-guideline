        - nid: cha13.sec13_2.p13_2_1.i1
          kind: item
          kind_raw: 1)
          num: '1'
          ord: 421
          heading: null
          text: 工程パラメータに係る許容範囲を確定し文書化すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1498
          children: []
        - nid: cha13.sec13_2.p13_2_1.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 422
          heading: null
          text: 滅菌サイクルにおいて空気排除工程が必要な場合においては，装置の最大許容空気漏れ量，滅菌対象物に対して非凝縮性ガスの残留量を評価する方法等を定めること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1499
          - source_label: PMDA aseptic processing guideline
            locator: line:1500
          children: []
        - nid: cha13.sec13_2.p13_2_1.i3
          kind: item
          kind_raw: 3)
          num: '3'
          ord: 423
          heading: null
          text: 滅菌サイクル中の滅菌対象物に空気又は水が接触する場合においては，その純度及び物理量（圧力，温度等）が滅菌対象物の機能及び安全性を阻害してはならない．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1501
          - source_label: PMDA aseptic processing guideline
            locator: line:1502
          children: []
        - nid: cha13.sec13_2.p13_2_1.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 424
          heading: null
          text: 滅菌工程の確認に使用する市販バイオロジカルインジケータ及びケミカルインジケータは，適用される国際規格等の要求事項を満たしていること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1503
          - source_label: PMDA aseptic processing guideline
            locator: line:1504
          children: []
        - nid: cha13.sec13_2.p13_2_1.i5
          kind: item
          kind_raw: 5)
          num: '5'
          ord: 425
          heading: null
          text: 滅菌工程の確認において模擬の負荷品を使用する場合においては，当該負荷品の仕様の妥当性，有効性，使用限界等を検証し，文書化すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1505
          - source_label: PMDA aseptic processing guideline
            locator: line:1506
          children: []
        - nid: cha13.sec13_2.p13_2_1.i6
          kind: item
          kind_raw: 6)
          num: '6'
          ord: 426
          heading: null
          text: 滅菌工程の一部として滅菌以外の手順（乾燥等）を組み込む場合においては，その評価方法を定めて文書化し，適切に管理すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1507
          - source_label: PMDA aseptic processing guideline
            locator: line:1508
          children: []
        - nid: cha13.sec13_2.p13_2_1.i7
          kind: item
          kind_raw: 7)
          num: '7'
          ord: 427
          heading: null
          text: 洗浄等滅菌工程の前処理は，滅菌工程の有効性が阻害されないようにその条件を設定し，管理すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1509
          - source_label: PMDA aseptic processing guideline
            locator: line:1510
          children: []
      - nid: cha13.sec13_2.p13_2_2
        kind: paragraph
        kind_raw: １３．２．２
        num: 13.2.2
        ord: 428
        heading: null
        text: 滅菌装置
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1514
        children:
        - nid: cha13.sec13_2.p13_2_2.i1
          kind: item
          kind_raw: 1)
          num: '1'
          ord: 429
          heading: null
          text: 製造者名，型式，寸法，構造，材質，機能，能力等，滅菌装置の主な仕様が文書化されていること．また，通常運転方法のほか，初期設定の方法，異常時の対処方法，分解及び再組立の方法，校正を含む維持管理の方法等が記載された取扱説明書があること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1515
          - source_label: PMDA aseptic processing guideline
            locator: line:1516
          - source_label: PMDA aseptic processing guideline
            locator: line:1517
          children: []
        - nid: cha13.sec13_2.p13_2_2.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 430
          heading: null
          text: 運転パラメータの設定，処理能力等，当該滅菌工程に必要な性能を有すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1518
          children: []
        - nid: cha13.sec13_2.p13_2_2.i3
          kind: item
          kind_raw: 3)
          num: '3'
          ord: 431
          heading: null
          text: 装置内部の壁面，配管系等，滅菌条件のストレスにさらされる部分については，当該工程に対して十分に安定な素材を用いること．また，工程又は製品の品質に悪影響（反応，分解，吸着等）を及ぼす恐れのある物質を放出するようなものを用いないこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1519
          - source_label: PMDA aseptic processing guideline
            locator: line:1520
          - source_label: PMDA aseptic processing guideline
            locator: line:1521
          children: []
        - nid: cha13.sec13_2.p13_2_2.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 432
          heading: null
          text: 装置の一貫性のある運転を確保するため，電力，圧縮空気等のユーティリティの安定供給を確保すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1522
          - source_label: PMDA aseptic processing guideline
            locator: line:1523
          children: []
        - nid: cha13.sec13_2.p13_2_2.i5
          kind: item
          kind_raw: 5)
          num: '5'
          ord: 433
          heading: null
          text: 滅菌対象物が密封されていない場合においては，エアレーション又は復圧に用いるガスは滅菌すること．当該ガスを無菌化するためのフィルターは，滅菌できる構造及び材質とすること．また，定期的に完全性試験を行い，供給ガスの無菌性を保証すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1524
          - source_label: PMDA aseptic processing guideline
            locator: line:1525
          - source_label: PMDA aseptic processing guideline
            locator: line:1526
          children: []
        - nid: cha13.sec13_2.p13_2_2.i6
          kind: item
          kind_raw: 6)
          num: '6'
          ord: 434
          heading: null
          text: 無菌性に影響を及ぼし得るサイクルパラメータを当該工程に必要な範囲内で自由に設定することができ，かつこれらが良好な再現性をもって管理することができること．また，滅菌対象物の性質及び形態に応じて，適切な滅菌パターンを設定できること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1527
          - source_label: PMDA aseptic processing guideline
            locator: line:1528
          - source_label: PMDA aseptic processing guideline
            locator: line:1529
          children: []
        - nid: cha13.sec13_2.p13_2_2.i7
          kind: item
          kind_raw: 7)
          num: '7'
          ord: 435
          heading: null
          text: 滅菌サイクルを正確に進行させるための機能（コンピュータによる制御等）を有すること．連続式滅菌機においては，正確に製品を搬送する機能を有すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1530
          - source_label: PMDA aseptic processing guideline
            locator: line:1531
          children: []
        - nid: cha13.sec13_2.p13_2_2.i8
          kind: item
          kind_raw: 8)
          num: '8'
          ord: 436
          heading: null
          text: 滅菌の目的を達成するために重要なサイクルパラメータについて，これを測定又は制御するためのセンサー類及び記録装置を備えること．また，センサーの仕様（種類，精度，材質等），設置位置等については，対象となる滅菌工程の特性及び要求される条件から適切なものを選択すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1532
          - source_label: PMDA aseptic processing guideline
            locator: line:1533
          - source_label: PMDA aseptic processing guideline
            locator: line:1534
          - source_label: PMDA aseptic processing guideline
            locator: line:1535
          children: []
        - nid: cha13.sec13_2.p13_2_2.i9
          kind: item
          kind_raw: 9)
          num: '9'
          ord: 437
          heading: null
          text: 予想される工程条件を勘案し，常に許容範囲内の条件において運転が行われるための機能を有すること．異常が発生した場合は，その内容に応じて必要な警報を発する機能及び警報の記録機能を持つことが望ましい．また異常が発生したときに重大な事故を防止するための安全装置（安全弁等）を備えていること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1536
          - source_label: PMDA aseptic processing guideline
            locator: line:1537
          - source_label: PMDA aseptic processing guideline
            locator: line:1538
          - source_label: PMDA aseptic processing guideline
            locator: line:1539
          children: []
        - nid: cha13.sec13_2.p13_2_2.i10
          kind: item
          kind_raw: 10)
          num: '10'
          ord: 438
          heading: null
          text: 滅菌装置が設置される場所は，作業を行うために十分な広さを有するとともに，必要な清浄度レベルが確保されていること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1540
          - source_label: PMDA aseptic processing guideline
            locator: line:1541
          children: []
        - nid: cha13.sec13_2.p13_2_2.i11
          kind: item
          kind_raw: 11)
          num: '11'
          ord: 439
          heading: null
          text: パネル操作，製品の出し入れ等，工程に付随する人手による作業が支障なく行える構造であること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1542
          - source_label: PMDA aseptic processing guideline
            locator: line:1543
          children: []
        - nid: cha13.sec13_2.p13_2_2.i12
          kind: item
          kind_raw: 12)
          num: '12'
          ord: 440
          heading: null
          text: 製造管理に係るコンピュータ・システム等，上位のコンピュータと接続され，システムとして制御されているコンピュータ・システムについては，入出力情報の詳細，制御仕様の詳細等が明確に文書化されていること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1544
          - source_label: PMDA aseptic processing guideline
            locator: line:1545
          - source_label: PMDA aseptic processing guideline
            locator: line:1546
          children: []
        - nid: cha13.sec13_2.p13_2_2.i13
          kind: item
          kind_raw: 13)
          num: '13'
          ord: 441
          heading: null
          text: 滅菌装置の物理的な変更及び工程の変更の内容が滅菌装置に係る仕様書に確実に反映されるための手順を構築し文書化すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1547
          - source_label: PMDA aseptic processing guideline
            locator: line:1548
          children: []
      - nid: cha13.sec13_2.p13_2_3
        kind: paragraph
        kind_raw: １３．２．３
        num: 13.2.3
        ord: 442
        heading: null
        text: 滅菌バリデーション高圧蒸気滅菌サイクルのバリデーションは滅菌チャンバーの熱分布，滅菌負荷に関する熱浸透性，及びＢＩを使用する滅菌能力の検証からなり，滅菌装置の稼働性能適格性評価を兼ねる．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1552
        - source_label: PMDA aseptic processing guideline
          locator: line:1553
        - source_label: PMDA aseptic processing guideline
          locator: line:1554
        children:
        - nid: cha13.sec13_2.p13_2_3.i1
          kind: item
          kind_raw: 1)
          num: '1'
          ord: 443
          heading: null
          text: 熱浸透性試験は，原則として実際の滅菌対象物を用いて行うこと．ただし，参照負荷の物性データを元に，その妥当性が科学的に示される場合は，温度測定用サンプルを除き，参照負荷を用いてもよい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1555
          - source_label: PMDA aseptic processing guideline
            locator: line:1556
          - source_label: PMDA aseptic processing guideline
            locator: line:1557
          children: []
        - nid: cha13.sec13_2.p13_2_3.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 444
          heading: null
          text: 熱浸透性試験は最大負荷を含む各載荷パターンに対して，最低３回ずつ行うこと．最小負荷形態に対する評価は，必要に応じて行うこと．検証を行った各負荷形態が分かる図又は写真を記録として残すこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1558
          - source_label: PMDA aseptic processing guideline
            locator: line:1559
          - source_label: PMDA aseptic processing guideline
            locator: line:1560
          children: []
        - nid: cha13.sec13_2.p13_2_3.i3
          kind: item
          kind_raw: 3)
          num: '3'
          ord: 445
          heading: null
          text: 滅菌対象物の種類及び特性，滅菌のバッチサイズに応じて，製品や載荷形態のグルーピングを行った上で熱浸透性試験を行ってもよい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1561
          - source_label: PMDA aseptic processing guideline
            locator: line:1562
          children: []
        - nid: cha13.sec13_2.p13_2_3.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 446
          heading: null
          text: 検証用の温度計設置ポイントには滅菌対象物のコールドスポットと，必要に応じてホットポイントも含むこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1563
          - source_label: PMDA aseptic processing guideline
            locator: line:1564
          children: []
        - nid: cha13.sec13_2.p13_2_3.i5
          kind: item
          kind_raw: 5)
          num: '5'
          ord: 447
          heading: null
          text: コールドスポットにおいて，所定の滅菌条件が達成されていることを温度計によって確認すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1565
          - source_label: PMDA aseptic processing guideline
            locator: line:1566
          children: []
        - nid: cha13.sec13_2.p13_2_3.i6
          kind: item
          kind_raw: 6)
          num: '6'
          ord: 448
          heading: null
          text: コールドスポットにおける滅菌の達成を，バイオロジカルインジケータ（ＢＩ）によって検証すること．ＢＩの取扱いに関する詳細については，ISO 14161(Sterilization of health care products--Biological indicators--Guidance for the selection,use and interpretation of results)を参照のこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1567
          - source_label: PMDA aseptic processing guideline
            locator: line:1568
          - source_label: PMDA aseptic processing guideline
            locator: line:1569
          - source_label: PMDA aseptic processing guideline
            locator: line:1570
          children: []
        - nid: cha13.sec13_2.p13_2_3.i7
          kind: item
          kind_raw: 7)
          num: '7'
          ord: 449
          heading: null
          text: 滅菌対象物のバイオバーデンに基づいて滅菌サイクルを確立する場合，ＢＩの菌数，抵抗性，評価方法は，予想あるいは確立されたバイオバーデンを考慮して決定すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1571
          - source_label: PMDA aseptic processing guideline
            locator: line:1572
          children: []
        - nid: cha13.sec13_2.p13_2_3.i8
          kind: item
          kind_raw: 8)
          num: '8'
          ord: 450
          heading: null
          text: 確立された滅菌サイクルで，滅菌対象物の健全性を確認すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1573
          children: []
        - nid: cha13.sec13_2.p13_2_3.i9
          kind: item
          kind_raw: 9)
          num: '9'
          ord: 451
          heading: null
          text: 滅菌サイクルの所要時間が，実際の生産タイムスケジュールにおいて，許容されるものであることを確認すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1574
          - source_label: PMDA aseptic processing guideline
            locator: line:1575
          children: []
        - nid: cha13.sec13_2.p13_2_3.i10
          kind: item
          kind_raw: 10)
          num: '10'
          ord: 452
          heading: null
          text: 温度分布の測定に，装置に装備されている以外の温度計を用いる場合は，試験の前後で校正を行うこと．
          role: normative
          normativity: must
