          num: '1'
          ord: 457
          heading: null
          text: バリデーションの結果に基づき，日常の滅菌工程管理に必要な工程パラメータ及び管理項目を文書化し，これに基づき個々の滅菌対象物毎に所定の滅菌条件が有効に再現されていることを実証すること．
