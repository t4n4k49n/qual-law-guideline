      num: A2.3.2
      ord: 923
      heading: null
      text: 殺菌処理（サニタイゼーション）殺菌処理の実施に当たっては，許容されるレベルにまで微生物汚染を減尐させ，それを保持する能力を実証するために，バリデーションを実施することが必要である．加熱による殺菌処理では，熱が設備全体に行き渡ることを実証するための熱分布試験を含めること．化学薬品による殺菌処理においては，設備全体が適正な薬品濃度に達していることの実証が必要である．殺菌処理終了後，残存薬品が効果的に除去されていることを実証しなければならない．殺菌処理の頻度は，一般的に設備のモニタリングプログラムの結果に基づき，その設備が微生物学的に管理された状態において運転され，警報基準値を超えないように定めること．
      role: normative
      normativity: must
      tags: []
