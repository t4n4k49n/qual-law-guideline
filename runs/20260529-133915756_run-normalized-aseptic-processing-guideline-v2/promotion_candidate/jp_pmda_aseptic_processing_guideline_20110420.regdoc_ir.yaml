    - nid: cha19.sec19_1
      kind: section
      kind_raw: １９．１
      num: '19.1'
      ord: 688
      heading: アイソレータシステム
      text: 適切に設計されたアイソレータは高度な無菌性環境が達成されるが，完全に密閉された空間ではない．従って，薬理活性の高い薬物の製造においては内部を陰圧に保持したアイソレータが用いられることもあるが，通常の無菌医薬品に係る製品の製造においては，内部が陽圧に保持されたアイソレータが用いられる．また，製品の無菌性を高度に保証するためには，HEPAフィルター，グローブ，ハーフスーツ及び各種シール部の保守・点検を含む包括的な予防保全プログラムが必要である．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:2221
      - source_label: PMDA aseptic processing guideline
        locator: line:2222
      - source_label: PMDA aseptic processing guideline
        locator: line:2223
      - source_label: PMDA aseptic processing guideline
        locator: line:2224
      - source_label: PMDA aseptic processing guideline
        locator: line:2225
      - source_label: PMDA aseptic processing guideline
        locator: line:2226
      - source_label: PMDA aseptic processing guideline
        locator: line:2227
      children:
