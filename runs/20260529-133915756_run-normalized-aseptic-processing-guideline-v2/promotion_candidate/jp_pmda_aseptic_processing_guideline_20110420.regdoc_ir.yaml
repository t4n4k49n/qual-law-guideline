        kind: item
        kind_raw: 8）
        num: '8'
        ord: 150
        heading: null
        text: 更衣区域，衣類保管及び衣類処分のための適切な場所を設けること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:719
        children: []
      - nid: cha6.sec6_1.i9
        kind: item
        kind_raw: 9）
        num: '9'
        ord: 151
        heading: null
        text: 無菌操作法に係る作業を無菌操作区域外から観察できるように，ガラス等の窓，ビデオカメラ等を適切に設置すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
