      - nid: cha18.sec18_4.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 686
        heading: null
        text: 真空計は微小圧力を測定する高精度の計器であり，トレーサブル性が確保された方法で現場校正を行うことは現状では困難である．専門の校正機関に依頼し，工場外で校正を実施してもよい．
        role: normative
        normativity: must
        tags: []
