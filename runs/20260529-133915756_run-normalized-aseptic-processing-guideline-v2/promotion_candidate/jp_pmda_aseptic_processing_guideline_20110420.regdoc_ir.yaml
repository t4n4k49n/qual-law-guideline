          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 680
          heading: null
          text: 蒸気滅菌終了後のリーク試験．蒸気滅菌工程は凍結乾燥庫に大きな負荷を与えることから，冷却後に測定記録をとること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2198
          - source_label: PMDA aseptic processing guideline
            locator: line:2199
          - source_label: PMDA aseptic processing guideline
            locator: line:2200
          children: []
        - nid: cha18.sec18_4.i1.si3
          kind: subitem
          kind_raw: ③
          num: '3'
          ord: 681
          heading: null
          text: 定期的再バリデーション時のリーク測定．定期的再バリデーションの実施時期等に合わせて，装置を空にし，一昼夜程度の時間をかけ，実リーク量を測定できるように実施する．
          role: normative
          normativity: must
