    source_spans:
    - source_label: PMDA aseptic processing guideline
      locator: line:3303
    children:
    - nid: chaa5.pa5_1
      kind: paragraph
      kind_raw: A5.1
      num: A5.1
      ord: 1046
      heading: null
      text: 原則医薬品製造におけるケミカルハザード対策は，患者に対する健康被害リスク，即ち交差汚染リスクと，製造作業者に対する健康被害リスクの評価に基づき検討されるべきである．ICHQ9では，「リスクとは危害の発生する確率とそれが顕在化した場合の重大性の組み合わせである」と定義されている．このことから，患者や製造作業者に対する健康被害リスクは，患者や製造作業者が化学物質（原薬）に接触する確率或いは曝露される度合（曝露度）と，原薬が健康被害を引き起こす潜在的能力(ハザード)の組み合わせと考えることが出来る．ケミカルハザード対策は，ICH Q9の「品質リスクマネジメント」で提唱されたリスクマネジメントプロセス（添付図1）に従って，実施されるべきである．また，その結果として，製造の各段階や製品ライフサイクルにおいて，リスクを受容できるレベルまで低減し得る対策を講ずることが重要である． なお，如何なる場合であっても，「ケミカルハザード対策」を理由として，製品の無菌性保証レベルが低下したり，曖昧になったりすることがあってはならない．
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
