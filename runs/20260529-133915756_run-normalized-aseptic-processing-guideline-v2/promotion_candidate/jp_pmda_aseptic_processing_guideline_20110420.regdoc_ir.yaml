          kind: item
          kind_raw: 5)
          num: '5'
          ord: 187
          heading: null
          text: 粉末を扱う製造作業においては，稼働時に浮遊微粒子数の規定を満足することができない場合がある．そのような場合においては，空気のサンプリング箇所を工夫する，粉末がない状態で測定を行う等の方法により，実際に汚染の原因となる微粒子のレベルを把握し，目的とする空気の品質が維持されていることを確認すること．
          role: normative
          normativity: must
