          ord: 189
          heading: null
          text: 直接支援区域は，クリーンルーム内に設置した開放系クリーンブースやRABSを用いて無菌操作を行う場合，重要区域のバックグランドとして定義される．重要区域内の運転操作及び運転監視を行う職員の作業区域となる．重要区域に滅菌後の製品等及び資材を搬入する，又は重要区域から無菌製品を搬出する経路としても使用される．後者の場合においては，滅菌後の物が環境に直接曝露されることのないように適切な防護策を講じること．
