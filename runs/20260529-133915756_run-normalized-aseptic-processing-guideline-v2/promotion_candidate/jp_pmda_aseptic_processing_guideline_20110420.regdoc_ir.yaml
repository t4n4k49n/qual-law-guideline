        - nid: cha19.sec19_1.p19_1_6.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 733
          heading: null
          text: アイソレータ設備では比較的高い完全性が維持されていると考えられるが，絶対的な完全性が保たれているわけではない．したがって，一定期間毎及び除染の都度その前にリーク試験を行うこと．以下にリーク試験の例を示すが，リーク試験はこれらの方法に限らない．
          role: normative
          normativity: must
