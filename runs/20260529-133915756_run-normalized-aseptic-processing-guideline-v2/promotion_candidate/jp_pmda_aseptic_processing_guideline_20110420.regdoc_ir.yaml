        text: プロセスシミュレーションを行う時間は最長製造時間を考慮して実施する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2575
        children: []
      - nid: cha20.sec20_3.i6
        kind: item
        kind_raw: ６)
        num: '6'
        ord: 815
        heading: null
        text: 関係する全ての職員はプロセスシミュレーションに参加し，職員は最多職員数及び作業シフトを考慮して実施する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2576
        - source_label: PMDA aseptic processing guideline
          locator: line:2577
        children: []
      - nid: cha20.sec20_3.i7
        kind: item
        kind_raw: ７)
        num: '7'
        ord: 816
        heading: null
        text: 容器に培地を充てんする場合の培地充てん量は，旋回や反転させることで容器内全面に接触し，微生物の生育を確実に判別できる量とする．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2578
        - source_label: PMDA aseptic processing guideline
          locator: line:2579
        children: []
      - nid: cha20.sec20_3.i8
        kind: item
        kind_raw: ８)
        num: '8'
        ord: 817
        heading: null
        text: 不活性化ガスを日常的な製造で使用している場合でも，嫌気的な条件でのシミュレーションを目的としていない限り，不活性化ガスを空気に換える．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
