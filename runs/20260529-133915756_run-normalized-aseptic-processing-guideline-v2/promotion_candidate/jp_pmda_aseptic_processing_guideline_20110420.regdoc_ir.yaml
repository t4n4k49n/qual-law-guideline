    - nid: cha2.sec2_23
      kind: section
      kind_raw: ２．２３
      num: '2.23'
      ord: 25
      heading: 重要工程(critical processing)
      text: 製品の品質に及ぼす影響の大きい工程をいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
