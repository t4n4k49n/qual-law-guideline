        - source_label: PMDA aseptic processing guideline
          locator: line:2103
        children: []
      - nid: cha18.sec18_1.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 653
        heading: null
        text: 凍結乾燥庫内においての打栓後，巻締めまでの間，密着性が維持されるよう容器及び栓の設計に配慮すること．キャップの巻締め工程を無菌操作区域以外で実施する場合は，打栓されたバイアルが重要区域（グレードA）から搬出された後，巻締めが完了するまではグレードＡの空気を供給することで保護されなければならない．キャップの巻締めは，その製品の容器-栓密封完全性に基づく汚染リスクに応じてグレードＣ以上の清浄度レベル区域に於いて行い，微生物の汚染リスクまたは巻締め時に発生する微粒子などの汚染リスクに応じて補足的な措置を採ること．また，打栓を行う場所と巻締めを行う場所との距離及び打栓から巻締めまでにかかる時間については，可能な限り短くすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
