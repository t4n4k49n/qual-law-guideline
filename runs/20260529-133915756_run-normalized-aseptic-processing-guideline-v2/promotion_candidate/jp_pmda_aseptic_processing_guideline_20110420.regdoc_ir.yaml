    - nid: chaa4.pa4_1
      kind: paragraph
      kind_raw: A4.1
      num: A4.1
      ord: 986
      heading: null
      text: バイオセーフティレベル微生物（本章においてはウイルス，細菌等を指す）を原料とする製品の製造にあたり，使用微生物の病原性リスクに応じた安全操作上のバイオセーフティレベル（BSL）で取扱うこと.製造で使用される微生物等は以下のように1-3のリスク群に区分され，対応する物理的封じ込め，安全機器，感染防護具，作業操作の方法の組み合わせに基づきBSL1-3に分類される.ただし，当該微生物の不活化又は除去後の工程については，一般の製品と同様の扱いとすることができる.
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
