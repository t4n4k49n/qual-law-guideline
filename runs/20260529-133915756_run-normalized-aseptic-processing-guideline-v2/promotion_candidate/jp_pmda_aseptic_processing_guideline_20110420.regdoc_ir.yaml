    - nid: cha19.sec19_2
      kind: section
      kind_raw: １９．２
      num: '19.2'
      ord: 744
      heading: アクセス制限バリアシステム(RABS)
      text: アクセス制限バリアシステム（Restricted Access Barrier System，以下RABS）は，無菌操作において職員と重要区域を分離し，職員による重要区域への直接的な介入を減らすことにより，製品の高度な無菌性を達成する方策の一つである．RABSは，物理的な障壁と，HEPAフィルターを介して供給される気流，適切な管理運用システム等を主要な要素とする，ハードとソフトを融合した無菌操作区域（重要区域）を有するシステムをいう．RABSの設備構成は，簡易的なハードウォールから，アイソレータと同等の強固な障壁と隔離性能をもつものまで様々である．また付随する空調システムの方式については，設置室の空調を利用するものや，独立した空調系統を持つもの等がある．本章では，RABSの設計並びに運用に関する基本的要件を示す．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:2340
