        - source_label: PMDA aseptic processing guideline
          locator: line:2650
        children: []
      - nid: chaa1.pa1_2.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 840
        heading: null
        text: 細胞基材，培地，緩衝液及びガスの無菌的な添加を，閉鎖系又は開放系で行う場合には，無菌性と封じ込めを考慮した設備を使用すること．培養槽への接種やその後の移送，又は培地や緩衝液等を添加する際に，開放容器を用いて行う必要がある場合には汚染を最小限にするための管理及び手順を定めること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2651
        - source_label: PMDA aseptic processing guideline
          locator: line:2655
        - source_label: PMDA aseptic processing guideline
          locator: line:2656
        - source_label: PMDA aseptic processing guideline
          locator: line:2657
        children: []
      - nid: chaa1.pa1_2.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 841
        heading: null
        text: 重要な工程管理パラメータ（pH，温度，溶存酸素等）や収量の変化等についてモニタリングを行い，通常と異なる挙動が示された場合には，細菌，真菌，マイコプラズマ等による汚染の可能性について検証すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
