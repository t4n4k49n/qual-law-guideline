        children: []
      - nid: cha15.sec15_1.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 535
        heading: null
        text: 自動的にSIPを行う機能を有していない設備については，手動操作の手順を確立し，それを厳守するとともに重要な操作についてはダブルチェックとすること．また，手順のとおりに操作が行われたかどうかについて記録を作成すること．
