          heading: null
          text: 充てんの局所空間の空気充てん局所空間となる充てんノズルが存在するエアシャワー室とプラスチック材料が溶融して吐出する部分への供給エアは，空気ろ過滅菌フィルターを使用することが一般である．この局所環境のモニタリングには，浮遊微粒子数を測定する方法が一般的であるが，当該限定区域をろ過滅菌フィルターを介した無菌エアでパージしている場合は，フィルターの完全性を確認することにより，無菌エアの無菌性を保証すること．加えて，充てん局所空間に，充てん前の準備作業，及び充てん中の調整や清掃作業などで職員が介在する場合は，適切な環境モニタリングを実施すること．
