      kind: section
      kind_raw: ２．１４
      num: '2.14'
      ord: 16
      heading: 警報基準値(alert level)
      text: モニタリング対象物の数（微生物の場合は必要に応じて種）に対して設定した基準で，予知される問題点を早期に警告する値をいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:303
      - source_label: PMDA aseptic processing guideline
        locator: line:304
      children: []
    - nid: cha2.sec2_15
      kind: section
      kind_raw: ２．１５
      num: '2.15'
      ord: 17
      heading: ケミカルインジケータ(CI:chemical indicator)
      text: 滅菌工程の管理に，又はその指標として使用されるものであって，滅菌工程に曝露することにより生じる化学的又は物理的な変化を利用して，あらかじめ定められた一つ又は複数の滅菌工程に係るパラメータの変化を評価するものをいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
