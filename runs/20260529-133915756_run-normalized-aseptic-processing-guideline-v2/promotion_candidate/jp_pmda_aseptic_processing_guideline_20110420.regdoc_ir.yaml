      - nid: cha18.sec18_4.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 684
        heading: null
        text: 復圧フィルター，リークフィルター，真空シール用パッキン等は運転時間及び運転回数を勘案し定期的に交換すること．
