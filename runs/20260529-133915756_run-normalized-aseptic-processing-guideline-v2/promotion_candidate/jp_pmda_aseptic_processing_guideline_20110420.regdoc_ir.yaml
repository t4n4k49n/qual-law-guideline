      kind_raw: ２．２４
      num: '2.24'
      ord: 26
      heading: 消毒(disinfection)
      text: 対象物の表面に付着した微生物を安全なレベルまで減尐させ又は除去すること．
      role: structural
      normativity: null
      tags: []
      refs:
