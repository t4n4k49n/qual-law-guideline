      kind: paragraph
      kind_raw: A1.1
      num: A1.1
      ord: 831
      heading: null
      text: 一般要件法令，通知等のほか，本指針の他章に加え，細胞培養又は発酵により製造する原薬に係る製品の管理において注意すべき点を挙げる．
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:2618
      - source_label: PMDA aseptic processing guideline
        locator: line:2619
      - source_label: PMDA aseptic processing guideline
        locator: line:2620
      children:
      - nid: chaa1.pa1_1.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 832
        heading: null
        text: この項において「クラシカル工程」とは，天然に存在する，又は従来からある手法により変化させた微生物や細胞を使用した製造工程を指し，「バイオテクノロジー工程」とは，組換えDNA，ハイブリドーマその他の生物工学的技術により生み出され又は変化させた細胞又は微生物を使用した製造工程を指す．タンパク又はポリペプチド生産においての微生物等の管理レベルは一般的にバイテククノロジー工程に係る管理の方がクラシカル工程に係る管理よりも厳格なものが求められる．また，クラシカル工程に分類される天然型ヒト又は動物細胞を用いる培養法においては，それぞれ使用する細胞の種由来微生物，ウイルス等の製造工程への混入に特別の注意を払う必要がある．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2621
        - source_label: PMDA aseptic processing guideline
          locator: line:2622
        - source_label: PMDA aseptic processing guideline
          locator: line:2623
        - source_label: PMDA aseptic processing guideline
          locator: line:2624
        - source_label: PMDA aseptic processing guideline
          locator: line:2625
        - source_label: PMDA aseptic processing guideline
          locator: line:2626
        - source_label: PMDA aseptic processing guideline
          locator: line:2627
        - source_label: PMDA aseptic processing guideline
          locator: line:2628
        children: []
      - nid: chaa1.pa1_1.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 833
        heading: null
        text: 細胞培養又は発酵により製造する際の原料（培地，緩衝成分等）は，汚染の原因となる微生物の格好の栄養分となりうるため，原料供給者及び調製法並びに製造する無菌医薬品に係る製品の種類，特性及び製造工程に応じて，バイオバーデン等必要な管理項目を適切に定め管理すること．細胞培養に使用する培地等については，マイコプラズマ等についても必要に応じて管理すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2629
        - source_label: PMDA aseptic processing guideline
          locator: line:2630
        - source_label: PMDA aseptic processing guideline
          locator: line:2631
        - source_label: PMDA aseptic processing guideline
          locator: line:2632
        - source_label: PMDA aseptic processing guideline
          locator: line:2633
        children: []
      - nid: chaa1.pa1_1.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 834
        heading: null
        text: 細胞培養又は発酵により製造する製品に係る作業区域については，作業の種類に応じて清浄度レベルを適切に定め管理すること．設備が密閉系の場合においては重要区域とする必要はないが，汚染防止のために必要な清浄度レベルを設定し管理すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2634
        - source_label: PMDA aseptic processing guideline
          locator: line:2635
        - source_label: PMDA aseptic processing guideline
          locator: line:2636
        children: []
      - nid: chaa1.pa1_1.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 835
        heading: null
        text: 原薬製造におけるウイルス汚染の防止策やウイルス安全対策については，ICHガイドラインQ5A「ヒト又は動物細胞株を用いて製造されるバイオテクノロジー応用医薬品のウイルス安全評価」に従うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2637
        - source_label: PMDA aseptic processing guideline
          locator: line:2638
        - source_label: PMDA aseptic processing guideline
          locator: line:2639
        children: []
      - nid: chaa1.pa1_1.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 836
        heading: null
        text: 工程内管理及び品質管理（重要工程のモニタリングを含む）においては，微生物管理の観点から，装置の滅菌，環境微生物モニタリング等の記録及び逸脱に係る記録を作成し保管すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2640
        - source_label: PMDA aseptic processing guideline
          locator: line:2641
        - source_label: PMDA aseptic processing guideline
          locator: line:2642
        children: []
      - nid: chaa1.pa1_1.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 837
        heading: null
        text: 細胞培養又は発酵に係る作業所に関して，立入り制限，更衣基準，健康管理等の衛生管理に関する基準を定め，作業に係る職員に対する教育訓練を適宜実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2643
        - source_label: PMDA aseptic processing guideline
          locator: line:2644
        children: []
    - nid: chaa1.pa1_2
      kind: paragraph
      kind_raw: A1.2
      num: A1.2
      ord: 838
      heading: null
      text: 細胞培養又は発酵
      role: normative
