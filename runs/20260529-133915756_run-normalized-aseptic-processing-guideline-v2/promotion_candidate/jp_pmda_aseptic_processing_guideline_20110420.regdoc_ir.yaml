    - nid: chaa5.pa5_2_2
      kind: paragraph
      kind_raw: A5.2.2
      num: A5.2.2
      ord: 1049
      heading: null
      text: リスク分析（曝露分析）患者や製造作業者が，化学物質に曝露されるリスクは，各製造工程のライフサイクル（製造，切り替え洗浄，部品交換，保全などの全製造段階）において取り扱う化学物質の物理的化学的特性（粉体，液体，エアロゾル，粒度，比重，溶解性など）と製造工程自体の特性（開放系／閉鎖系，封じ込め装置，防護具，集塵，定置洗浄，定置湿潤など）に依存する．曝露分析は，定常的におこなわれる製造工程のライフサイクルのみならず，封じ込め装置の破綻といった予測される非定常状態についても実施されなくてはならない．
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
