        text: 無菌操作区域において作業に従事する職員は，当該区域に適用される微生物のモニタリングプログラムに従った管理を受けること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:643
        - source_label: PMDA aseptic processing guideline
          locator: line:644
        children: []
      - nid: cha4.sec4_3.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 123
        heading: null
        text: 微生物の検査のために作業衣等に培地を接触させる場合においては，無菌操作区域からの退室時において実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:645
        - source_label: PMDA aseptic processing guideline
          locator: line:646
        children: []
      - nid: cha4.sec4_3.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 124
        heading: null
        text: モニタリングプログラムで得られたデータについて，適切な頻度で職員毎の傾向分析を行うこと．好ましくない傾向が見られた場合においては，再教育訓練を実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:647
        - source_label: PMDA aseptic processing guideline
          locator: line:648
        children: []
  - nid: cha5
    kind: chapter
    kind_raw: '1.'
    num: '5'
    ord: 125
    heading: 職員による汚染防止
    text: ある職員の無菌作業衣等の付着微生物のモニタリングプログラムにおいて得られた結果が好ましくない傾向を示している場合においては，直ちに当該職員に対して必要な教育訓練を実施すること．また，当該職員の付着菌数に改善傾向がみられない場合においては，無菌操作区域以外の作業への配置の変更についても検討すること．
    role: structural
    normativity: null
    tags: []
    refs:
      internal: []
      external: []
    source_spans:
    - source_label: PMDA aseptic processing guideline
      locator: line:652
    - source_label: PMDA aseptic processing guideline
      locator: line:653
    - source_label: PMDA aseptic processing guideline
      locator: line:654
    - source_label: PMDA aseptic processing guideline
      locator: line:655
    - source_label: PMDA aseptic processing guideline
      locator: line:656
    children:
    - nid: cha5.sec5_1
      kind: section
