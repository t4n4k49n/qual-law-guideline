    - nid: chaa5.pa5_2_3
      kind: paragraph
      kind_raw: A5.2.3
      num: A5.2.3
      ord: 1050
      heading: null
      text: リスク評価リスク分析による曝露度の評価結果と，リスクの特定により設定した限界値を組み合わせて，患者と製造作業者に対する健康被害リスクを評価する．患者に対するリスクが受容されるためには，ある製品の製造工程中に他の製品が交叉汚染限界値以上に混入しないことが保証されなければならない．一方，製造作業者に対する健康障害リスクが受容されるためには，製造作業中に化学物質を吸引，接触，経口などの曝露経路を通して，ADE以上体内に取り込まないことが必要である．
      role: normative
      normativity: must
      tags: []
