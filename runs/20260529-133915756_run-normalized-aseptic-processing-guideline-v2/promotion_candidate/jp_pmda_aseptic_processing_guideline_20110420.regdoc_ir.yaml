    - nid: cha2.sec2_1
      kind: section
      kind_raw: ２．１
      num: '2.1'
      ord: 3
      heading: アイソレータ(isolator)
      text: 環境及び職員の直接介入から物理的に完全に隔離された無菌操作区域を有する装置であって，除染した後にHEPAフィルター又はULPAフィルター（ultra low penetration air filter）によりろ過した空気を供給し，外部環境からの汚染の危険性を防ぎながら連続して使用することができる装置をいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:242
      - source_label: PMDA aseptic processing guideline
        locator: line:243
      - source_label: PMDA aseptic processing guideline
        locator: line:244
      - source_label: PMDA aseptic processing guideline
        locator: line:245
      children: []
    - nid: cha2.sec2_2
      kind: section
      kind_raw: ２．２
      num: '2.2'
      ord: 4
      heading: アクセス制限バリアシステム（RABS:Restricted Access Barrier System）
      text: グローブを備えたハードウォールなどの物理的な障壁と，HEPAフィルターを介して供給される一方向気流，適切な管理運用システム等を主要な要素とするハードとソフトを融合した無菌操作区域（重要区域）を有するシステムをいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:248
      - source_label: PMDA aseptic processing guideline
        locator: line:249
      - source_label: PMDA aseptic processing guideline
        locator: line:250
      - source_label: PMDA aseptic processing guideline
        locator: line:251
      children: []
    - nid: cha2.sec2_3
      kind: section
      kind_raw: ２．３
      num: '2.3'
      ord: 5
      heading: 一方向気流(unidirectional airflow)
      text: ほぼ平行な流線で，一様な速度で流れるように調整された空気流をいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:253
      - source_label: PMDA aseptic processing guideline
        locator: line:254
      children: []
    - nid: cha2.sec2_4
      kind: section
      kind_raw: ２．４
      num: '2.4'
      ord: 6
      heading: 運転時適格性評価(OQ:operational qualification)
      text: 据付け又は改良した設備，システム又は装置が，予期した運転範囲で意図したように作動することを確認し文書化すること．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:257
      - source_label: PMDA aseptic processing guideline
        locator: line:258
      children: []
    - nid: cha2.sec2_5
      kind: section
      kind_raw: ２．５
      num: '2.5'
      ord: 7
      heading: エアロック(air lock)
      text: 通例，異なる空気の清浄度レベルを有する隣接した部屋の気流を維持することを目的とした，インターロックされた扉をもつ小さな部屋をいう．無菌操作用のエアロックは，清浄度レベル管理の低い区域から異物や微生物が侵入しないように，また封じ込め施設においては気圧の低い区域から高い区域に病原体等が侵入しないようにすることを目的とする．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:260
      - source_label: PMDA aseptic processing guideline
        locator: line:261
      - source_label: PMDA aseptic processing guideline
        locator: line:262
      - source_label: PMDA aseptic processing guideline
        locator: line:263
      children: []
    - nid: cha2.sec2_6
      kind: section
      kind_raw: ２．６
      num: '2.6'
      ord: 8
      heading: エンドトキシン(endotoxin)
      text: グラム陰性菌の外膜を構成するリポ多糖であり，発熱活性をはじめ多彩な生物活性を有する．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:265
      - source_label: PMDA aseptic processing guideline
        locator: line:266
      children: []
    - nid: cha2.sec2_7
      kind: section
      kind_raw: ２．７
      num: '2.7'
      ord: 9
      heading: オーバーキル滅菌(overkill sterilization)
      text: 滅菌対象物上に存在するバイオバーデンや検出菌の当該滅菌法に対する抵抗性とは関係なく，10-6以下の無菌性保証水準が得られる条件において滅菌を行うことをいう．通例，Ｄ値が1.0以上のバイオロジカルインジケータを用い，指標菌を10の12乗（12D）減尐させるに等しい滅菌条件をいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:268
      - source_label: PMDA aseptic processing guideline
        locator: line:269
      - source_label: PMDA aseptic processing guideline
        locator: line:270
      - source_label: PMDA aseptic processing guideline
        locator: line:271
      children: []
    - nid: cha2.sec2_8
      kind: section
      kind_raw: ２．８
      num: '2.8'
      ord: 10
      heading: 化学物質等安全データシート（MSDS：Material Safety Data Sheet)
      text: 事業者が，化学物質等を他の事業者に対し譲渡し又は提供するときに提供するその化学物質等の性状及び取扱いに関する情報を記載したものをいう．「特定化学物質の環境への排出量の把握等及び管理の改善の促進に関する法律」では，政令で定める第一種指定化学物質，第二種指定化学物質及びこれらを含む一定の製品（「指定化学物質等」）について，MSDSを提供することが義務化されている．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:273
      - source_label: PMDA aseptic processing guideline
        locator: line:274
      - source_label: PMDA aseptic processing guideline
        locator: line:275
      - source_label: PMDA aseptic processing guideline
        locator: line:276
      - source_label: PMDA aseptic processing guideline
        locator: line:279
      children: []
    - nid: cha2.sec2_9
      kind: section
      kind_raw: ２．９
      num: '2.9'
      ord: 11
      heading: ガスフィルター(gas filter)
      text: 製品に直接的又は間接的に接触する気体の中から微生物及び微粒子を除去するために圧縮ガスラインに組み込まれた疎水性のフィルターをいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:281
      - source_label: PMDA aseptic processing guideline
        locator: line:282
      children: []
    - nid: cha2.sec2_10
      kind: section
      kind_raw: ２．１０
      num: '2.10'
      ord: 12
      heading: 稼働性能適格性評価(PQ:performance qualification)
      text: 相互に関連する設備，システム又は装置が，承認された製造方法及び規格に基づき，効果的かつ再現性よく機能し得ることを確認し文書化すること．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:284
      - source_label: PMDA aseptic processing guideline
        locator: line:285
      - source_label: PMDA aseptic processing guideline
        locator: line:286
      children: []
    - nid: cha2.sec2_11
      kind: section
      kind_raw: ２．１１
      num: '2.11'
      ord: 13
      heading: 環境モニタリングプログラム(environmental monitoring program)
      text: 作業所の環境の悪化を事前に把握することにより製品の品質に悪影響が及ぶことを防止すること，及び適切な清浄度レベルの管理により高度に無菌性が保証された無菌医薬品に係る製品の製造を行うことを目的として，製造空間又は設備及び作業衣類等の表面を要求される清浄度レベルに保持するために必要なあらゆる事項について計画を策定し，実施することをいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:289
      - source_label: PMDA aseptic processing guideline
        locator: line:290
      - source_label: PMDA aseptic processing guideline
        locator: line:291
      - source_label: PMDA aseptic processing guideline
        locator: line:292
      - source_label: PMDA aseptic processing guideline
        locator: line:293
      children: []
    - nid: cha2.sec2_12
      kind: section
      kind_raw: ２．１２
      num: '2.12'
      ord: 14
      heading: 空気の清浄度レベル(cleanliness level)
      text: 作業所の空気の品質を１m3当たりに含まれる粒径0.5μm以上の微粒子数の最大許容値によって規定したものをいう．グレードＡからグレードＤまでの４段階からなる．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:295
      - source_label: PMDA aseptic processing guideline
        locator: line:296
      - source_label: PMDA aseptic processing guideline
        locator: line:297
      children: []
    - nid: cha2.sec2_13
      kind: section
      kind_raw: ２．１３
      num: '2.13'
      ord: 15
      heading: 空調システム(HVAC system)
      text: 空気の温度又は湿度の調整，換気等の空気調節を行う設備をいう．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
