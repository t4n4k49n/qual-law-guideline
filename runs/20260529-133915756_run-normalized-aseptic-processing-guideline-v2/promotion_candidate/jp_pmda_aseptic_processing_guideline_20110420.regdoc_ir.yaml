        text: ガスろ過滅菌用フィルターの選定ガスろ過滅菌用のフィルターについては，疎水性素材でできたものを選択すること．また，個々のフィルターの化学的特性及び物理的特性，生物学的安全性，微生物捕捉性能等に係るデータを考慮の上選定し，工程の特性に応じて必要流量及び工程差圧から必要な膜面積を算出すること．通例，選定されるガスろ過滅菌フィルターは，孔径0.2μm/0.22μm以下のものである．
