        - nid: cha19.sec19_1.p19_1_3.i5
          kind: item
          kind_raw: 5)
          num: '5'
          ord: 704
          heading: null
          text: アイソレータの差圧は設置室に対して最低17.5パスカル程度を保持すること．ただし，作業にハーフスーツ，グローブを使用する場合等，作業の内容によっては，さらに高い差圧を保持することが必要となる．運転中は差圧について連続的にモニタリングを行い，圧力異常低下時においては警報を発するようにされていること．
          role: normative
          normativity: must
