        text: モニタリングの方法：試料採取方法及び検出方法製造区域毎のモニタリングポイントは，作業室の大きさ，作業内容，材料や製品の工程フローなどを考慮して，適切な分布と採取箇所数を定めること.及び，製品汚染評価に重要と考えられるポイントは適宜追加すること．
