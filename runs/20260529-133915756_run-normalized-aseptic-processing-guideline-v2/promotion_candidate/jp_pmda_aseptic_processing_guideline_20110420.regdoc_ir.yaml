        kind: item
        kind_raw: 10）
        num: '10'
        ord: 152
        heading: null
        text: 開放状態にある容器又は製品の曝露を最小限にとどめると同時に，無菌操作区域内で作業を行う職員や維持管理のための職員のアクセスが容易な配置とすること．
        role: normative
