      heading: プロセスシミュレーションの許容基準
      text: 日本薬局方の許容基準に準じる．汚染が認められた場合は，日本薬局方を参考に必要な行動をとる．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
