  - nid: cha1
    kind: chapter
    kind_raw: '1.'
    num: '1'
    ord: 1
    heading: 序論
    text: 本指針は，無菌医薬品に係る製品の製造業者及び薬事監視員に無菌性保証に関する基本的な考え方及び製造管理のあり方を示し，無菌医薬品に係る製品の品質の確保に資することを目的とする．本指針は，注射剤に係る製品の無菌操作法による製造に適用するが，主な考え方は，点眼剤その他の無菌医薬品に係る製品の無菌操作法による製造にも適用できる．なお，医薬品及び医薬部外品の製造管理及び品質管理の基準に関する省令（平成16年厚生労働省令第179号）（以下「医薬品・医薬部外品ＧＭＰ省令」という．），規制当局からの通知等による要求事項以外は，本指針と同等以上の，又は合理的な根拠に基づく他の方法により製品の品質が確保される場合においては，一律に本指針に示す方法の適用を求めるものではない．
    role: structural
    normativity: null
    tags: []
    refs:
      internal: []
      external: []
