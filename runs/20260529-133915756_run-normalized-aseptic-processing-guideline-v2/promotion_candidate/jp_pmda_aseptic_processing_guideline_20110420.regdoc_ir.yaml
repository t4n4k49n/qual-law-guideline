      - nid: cha7.sec7_3.p7_3_1
        kind: paragraph
        kind_raw: ７．３．１
        num: 7.3.1
        ord: 210
        heading: null
        text: 品質証明
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
