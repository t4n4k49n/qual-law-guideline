            locator: line:897
          - source_label: PMDA aseptic processing guideline
            locator: line:898
          - source_label: PMDA aseptic processing guideline
            locator: line:899
          children: []
        - nid: cha7.sec7_2.p7_2_2.i5
          kind: item
          kind_raw: 5)
          num: '5'
          ord: 204
          heading: null
          text: 前項の要件を満たすような気流が確保されていることを，設備の設置時のバリデーションにおいてスモークテスト等の方法により確認すること．また，気流パターンを変更した場合，又はその可能性がある場合においては，再度同様の確認を行うこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:900
          - source_label: PMDA aseptic processing guideline
            locator: line:904
          - source_label: PMDA aseptic processing guideline
            locator: line:905
          children: []
        - nid: cha7.sec7_2.p7_2_2.i6
          kind: item
          kind_raw: 6)
          num: '6'
          ord: 205
          heading: null
          text: 一方向気流の定めがある場合においては，風速の変化が気流パターンに影響を及ぼす可能性があるので，プログラムに従って定められた間隔により各HEPAフィルターの吹出し風速についてモニタリングを行い，定められた風速が維持されていることを確認すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:906
          - source_label: PMDA aseptic processing guideline
            locator: line:907
          - source_label: PMDA aseptic processing guideline
            locator: line:908
          children: []
        - nid: cha7.sec7_2.p7_2_2.i7
          kind: item
          kind_raw: 7)
          num: '7'
          ord: 206
          heading: null
          text: 無菌操作区域の製造作業室及び更衣室においては，作業内容の製品に対する汚染リスクを評価し，定められた清浄度レベルを維持するために適切な換気回数を設定すること．通常，直接支援区域では30回／時間，その他の支援区域の内，グレードCに相当する作業室では20回／時間を確保することが望ましい．所定の換気回数が維持されていることを定期的に検査すること．また，工程室内において床付近の塵埃や微生物が室内に舞い上がり環境を劣化させることを防ぐために，できるだけ上昇気流の発生を抑制すること．室内に対する給気口を天井面に設け，排気口は床面近くに設けることにより，全体的に下降気流を確保する方法が一般的である．その他の支援区域においても，微生物や異物汚染のリスクに応じて同様の配慮をすることが望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:909
          - source_label: PMDA aseptic processing guideline
            locator: line:910
          - source_label: PMDA aseptic processing guideline
            locator: line:911
          - source_label: PMDA aseptic processing guideline
            locator: line:912
          - source_label: PMDA aseptic processing guideline
            locator: line:913
          - source_label: PMDA aseptic processing guideline
            locator: line:914
          - source_label: PMDA aseptic processing guideline
            locator: line:915
          - source_label: PMDA aseptic processing guideline
            locator: line:916
          - source_label: PMDA aseptic processing guideline
            locator: line:917
          - source_label: PMDA aseptic processing guideline
            locator: line:918
          children: []
        - nid: cha7.sec7_2.p7_2_2.i8
          kind: item
          kind_raw: 8)
          num: '8'
          ord: 207
          heading: null
          text: 製造作業が終了し作業者が退室した後，室内の清浄度は速やかに非作業時の管理レベルに復帰することが求められる．直接支援区域においては，15～20分程度で浮遊微粒子数が非作業時の管理レベルに到達することが望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:919
          - source_label: PMDA aseptic processing guideline
            locator: line:920
          - source_label: PMDA aseptic processing guideline
            locator: line:921
          children: []
        - nid: cha7.sec7_2.p7_2_2.i9
          kind: item
          kind_raw: 9)
          num: '9'
          ord: 208
          heading: null
          text: 製造作業中の差圧変動及び気流パターンを定めて文書化し，実際の差圧及び気流の状態が工程に適したものであることを実証すること．また，職員の介入による乱気流が環境の清浄度レベルに及ぼす影響について検討し，当該作業に係る手順書に反映すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:922
          - source_label: PMDA aseptic processing guideline
            locator: line:923
          - source_label: PMDA aseptic processing guideline
            locator: line:924
          children: []
