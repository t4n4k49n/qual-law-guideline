          locator: line:1017
        children: []
      - nid: cha8.sec8_3.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 245
        heading: null
        text: 微生物に関するモニタリングにおいて，器物表面の付着菌数については，定期的にトレンドの評価を行うこと．処置基準値を超えたり，通常と大きく異なる菌種構成となったり，それらが続いたりしたときに，原因を特定する調査を実施すること．また，必要な場合においては，再発を防止する措置を採ること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
