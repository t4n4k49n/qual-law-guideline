      num: A2.3.4
      ord: 925
      heading: null
      text: 警報基準値と処置基準値製薬用水設備は，その設計仕様の範囲内において運転を続けたときに，許容される品質の水が製造されていることを確かめるために，その品質のモニタリングプログラムを行う．得られたモニタリングデータは確立した工程パラメータ又は製造した水若しくは製品の規格と比較する．また，警報基準値及び処置基準値を日本薬局方参考情報「製薬用水の品質管理」を参考に適切に設定し，製薬用水設備の運転状態の適否判定とともに工程の制御のために使用する．
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
