          locator: line:1009
        children: []
      - nid: cha8.sec8_2.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 241
        heading: null
        text: 使用する消毒剤については，製造所毎に微生物学的評価を行い，適切な管理手順を定めること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
