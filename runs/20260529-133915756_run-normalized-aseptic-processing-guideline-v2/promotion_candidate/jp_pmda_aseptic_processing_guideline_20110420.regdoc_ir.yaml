        - nid: cha12.sec12_2.i2.si8
          kind: subitem
          kind_raw: ⑧
          num: '8'
          ord: 387
          heading: null
          text: 必要な場合においては，製造作業の完了から製造設備及びユーティリティの清浄化，消毒及び滅菌までの間の最大許容時間
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:1412
          - source_label: PMDA aseptic processing guideline
            locator: line:1413
          children: []
      - nid: cha12.sec12_2.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 388
        heading: null
        text: 無菌製品に係る製品の無菌性に及ぼす影響を最小のものとするため，製造設備及びユーティリティの清浄化及び乾燥を行った上で保管し，必要な場合においては消毒又は滅菌を行うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1414
        - source_label: PMDA aseptic processing guideline
          locator: line:1415
        - source_label: PMDA aseptic processing guideline
          locator: line:1416
        children: []
      - nid: cha12.sec12_2.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 389
        heading: null
        text: ある製造設備及びユーティリティを用いて，同じ無菌製品に係る製品の連続するロットを継続生産又は期間生産（キャンペーン生産）する場合においては，微生物汚染を防止できることがバリデートされた間隔により当該装置の清浄化，消毒及び滅菌を行うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1417
        - source_label: PMDA aseptic processing guideline
          locator: line:1418
        - source_label: PMDA aseptic processing guideline
          locator: line:1419
        children: []
      - nid: cha12.sec12_2.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 390
        heading: null
        text: ワクチン等の無菌製品のように，有効成分として微生物そのもの，又は微生物由来成分を含む製品の製造に使用する製造設備及びユーティリティの清浄化，消毒及び滅菌の評価には，当該微生物に対する効果の評価を含めること．ただし，滅菌に関しては日局等に示された標準的に使用する微生物に比べ，当該微生物の抵抗性が弱いことを示す試験結果がある場合においては，当該評価を省略することができる．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1420
        - source_label: PMDA aseptic processing guideline
          locator: line:1421
        - source_label: PMDA aseptic processing guideline
          locator: line:1422
        - source_label: PMDA aseptic processing guideline
          locator: line:1423
        - source_label: PMDA aseptic processing guideline
          locator: line:1424
        children: []
