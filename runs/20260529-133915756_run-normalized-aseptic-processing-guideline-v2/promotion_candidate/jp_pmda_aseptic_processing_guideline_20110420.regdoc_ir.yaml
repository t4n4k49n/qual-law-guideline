        kind: item
        kind_raw: 1)
        num: '1'
        ord: 240
        heading: null
        text: 消毒手順に係る効果及び頻度は，環境モニタリングプログラムを通して確立すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
