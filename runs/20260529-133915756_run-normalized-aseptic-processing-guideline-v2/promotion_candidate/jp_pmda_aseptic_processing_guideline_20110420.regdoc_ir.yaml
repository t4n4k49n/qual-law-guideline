        kind: item
        kind_raw: 5)
        num: '5'
        ord: 852
        heading: null
        text: 全ての装置は，使用後適切に清浄化を行うとともに必要に応じて消毒又は可能である場合には滅菌を行うこと．
        role: normative
        normativity: must
        tags: []
