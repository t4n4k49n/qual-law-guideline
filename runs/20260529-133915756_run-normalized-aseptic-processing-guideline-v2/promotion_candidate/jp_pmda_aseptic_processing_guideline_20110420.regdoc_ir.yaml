        ord: 280
        heading: null
        text: 保管及び輸送のための容器については，無菌物を投入する前に洗浄及び滅菌を行うこと．なお，滅菌済みシングルユース容器の場合はこの限りではない．いずれも滅菌状態が維持されていること．
