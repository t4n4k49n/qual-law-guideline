            num: '2'
            ord: 257
            heading: null
            text: 製造工程において脱パイロジェン処理が行われる場合，当該原料の特性及びエンドトキシン量のレベルに応じて，適切な脱パイロジェンの方法を設定すること．なお，処理前の原料のエンドトキシン量を管理することが望ましい．
