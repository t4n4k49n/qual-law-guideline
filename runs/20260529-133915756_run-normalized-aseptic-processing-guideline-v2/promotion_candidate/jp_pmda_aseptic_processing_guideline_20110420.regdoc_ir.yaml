        ord: 839
        heading: null
        text: ワーキング・セル・バンク等細胞培養又は発酵工程においての出発原料はその汚染を防止するために，作製毎に特性解析及びウイルスや微生物に関する安全性情報を収集し，それらの情報に基づき適切な管理及び手順を定めて製造に供すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2648
        - source_label: PMDA aseptic processing guideline
