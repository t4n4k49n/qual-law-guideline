        heading: null
        text: 温度及び相対湿度温度及び相対湿度は，作業所における職員の快適性及び微生物汚染の潜在的危険性に直接的な影響を及ぼすため，そのレベルを適切に設定し，維持，管理及びモニタリングを行うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
