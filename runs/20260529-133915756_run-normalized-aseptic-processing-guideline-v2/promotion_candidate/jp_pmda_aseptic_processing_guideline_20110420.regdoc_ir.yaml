    - nid: cha7.sec7_2
      kind: section
      kind_raw: ７．２
      num: '7.2'
      ord: 197
      heading: 空調システム
      text: 清浄区域においては，適切な空気環境状態を維持するために，適切な空調システムの設計及び管理が必要である．空調システムは，扉の開閉，製造設備の運転等製造作業に由来する短期的な変動に対してのみならず，外気条件の季節変動，設備の経年変化等の長期的な変動に対しても，常に適切に稼働する状態にあるよう維持されなければならない．空調システム及びその管理プログラムの基本要素には，温度，相対湿度，風量，換気回数，一方向気流，室間差圧，HEPAフィルターの完全性，浮遊微粒子数，微生物等が含まれる．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
