      - nid: chaa1.pa1_3.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 848
        heading: null
        text: 細胞若しくは細胞組成物を除去し又は細胞破壊後の細胞組成物を回収するハーベスト工程は，回収液への汚染防止のみならず，作業に係る職員や環境への汚染を最小限のものとするように設計された設備及び区域において行うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
