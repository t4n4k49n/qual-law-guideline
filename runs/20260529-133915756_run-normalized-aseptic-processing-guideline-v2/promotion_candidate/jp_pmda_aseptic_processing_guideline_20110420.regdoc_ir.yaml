          kind: item
          kind_raw: 6)
          num: '6'
          ord: 462
          heading: null
          text: 滅菌サイクルに蒸気浸透のための空気排除工程がある場合は，定期的にリーク試験を実施すること．また被滅菌物の乾燥等，製品品質に影響のある滅菌以外の性能の確認が必要な場合においても，文書化された方法に従って確認を行い記録すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
