      - nid: cha8.sec8_3.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 244
        heading: null
        text: 清浄化及び消毒の実効性を総合的な環境モニタリングプログラムの中で規定すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
