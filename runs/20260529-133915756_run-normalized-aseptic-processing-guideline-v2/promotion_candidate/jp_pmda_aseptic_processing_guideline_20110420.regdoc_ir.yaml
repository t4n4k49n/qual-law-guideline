          ord: 324
          heading: null
          text: 浮遊菌又は付着菌の検出及び測定に用いる培地は好気性菌，真菌（酵母及びカビ），嫌気性菌等の検出対象菌に適した培地を用いる．使用する培地については，必要に応じて発育阻害物質の確認等を行い，培地として必要な性能を有し，適切なモニタリングの実施に支障のないものを用いる．発育阻害物質の確認とは，培地での菌の捕集や培養行為において，アルコール，抗菌物質等が付着することにより，モニタリングの成績に影響を及ぼさないことを確認することである．
