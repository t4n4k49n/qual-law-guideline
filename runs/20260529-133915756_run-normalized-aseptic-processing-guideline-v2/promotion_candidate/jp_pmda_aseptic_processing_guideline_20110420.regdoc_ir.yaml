          num: '3'
          ord: 202
          heading: null
          text: 製品の無菌性を確保する上で特に重要と考えられる差圧については，モニタリングを常時行うこと．さらに，異常時に備えて警報システムを備えることが望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
