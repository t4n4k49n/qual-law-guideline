            text: 充てん及び熔閉作業は，周辺と隔離された小空間において行われる．このため通常の無菌製品の製造において必要となる空気の清浄度レベルがグレードAのいわゆる無菌室は必ずしも必要ではなく，成型及び充てんに係る部分の局所小空間がグレードAの清浄度レベルに保持されていればよい．したがって，成型及び充てんに係る部分の局所小空間の清浄度レベルの管理が重要となる．
