    heading: バイオセーフティ及びバイオセキュリティ対策
    text: 医薬品の製造で微生物や毒素等を取り扱う工程においては，無菌性の担保とともに微生物等の物理的封じ込め施設，設備及び封じ込め操作が必要となる（生物学的製剤の製造所におけるバイオセーフィテイの取扱い関する指針：医薬監第14号，平成12年2月14日，並びに実験室バイオセーフティ指針第３版：世界保健機構）.生物学的製剤や遺伝子組み換え技術を応用して製造される医薬品には，感染性物質の輸送規則に関するガイダンス2009-2010版、世界保健機構，また，バイオセキュリティに関連する原料の取扱いには，感染症予防法，並びにバイオリスクマネジメント、実験施設バイオセキュリティガイダンス：世界保健機構を遵守する必要がある.
    role: structural
    normativity: null
    tags: []
    refs:
      internal: []
