        kind: item
        kind_raw: 2)
        num: '2'
        ord: 651
        heading: null
        text: 凍結乾燥庫への搬入に際しては，重要区域（グレードA）の清浄度レベルが維持された作業環境で行うこと．トンネル型の自動搬送ライン，一方向気流装置を備えた搬送車，アイソレータ等，職員の直接的な介入を避ける方法を採用することが望ましい．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
