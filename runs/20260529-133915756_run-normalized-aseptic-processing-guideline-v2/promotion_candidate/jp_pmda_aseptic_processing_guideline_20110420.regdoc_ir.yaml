          locator: line:2683
        - source_label: PMDA aseptic processing guideline
          locator: line:2684
        - source_label: PMDA aseptic processing guideline
          locator: line:2685
        children: []
      - nid: chaa1.pa1_3.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 849
        heading: null
        text: 精製工程において開放設備を使用する場合には，精製中間体の品質を保持するのに適切に管理された清浄環境下において実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2686
        - source_label: PMDA aseptic processing guideline
          locator: line:2687
        children: []
      - nid: chaa1.pa1_3.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 850
        heading: null
        text: 製造に用いた微生物又は細胞，細胞残渣及び培地成分を除去し又は不活化するための工程は，有効成分の分解，汚染等による品質の低下を最小限のものにするために適切な装置及び製造条件を選択すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2688
        - source_label: PMDA aseptic processing guideline
          locator: line:2689
        - source_label: PMDA aseptic processing guideline
          locator: line:2690
        children: []
      - nid: chaa1.pa1_3.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 851
        heading: null
        text: 精製工程において使用する緩衝液，カラムクロマトグラフィー装置等は必ずしも無菌である必要はないが製品の品質に影響を及ぼさない微生物レベル以下に管理すること．滅菌を施すことができない精製装置やカラムクロマトグラフィー装置等は使用できる有機溶媒あるいはアルカリ液等を用いて除染すること．バイオバーデンは工程の種類，工程の操作時間，緩衝液，温度，pH等によって異なるので，各工程に合った管理レベルを設定し製造すること．また，滅菌を施すことができない工程の場合にはエンドトキシンの増加を適切に検出できるよう工程管理としてエンドトキシンの測定を行い適切な管理レベルを設定すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2691
        - source_label: PMDA aseptic processing guideline
          locator: line:2695
        - source_label: PMDA aseptic processing guideline
          locator: line:2696
        - source_label: PMDA aseptic processing guideline
