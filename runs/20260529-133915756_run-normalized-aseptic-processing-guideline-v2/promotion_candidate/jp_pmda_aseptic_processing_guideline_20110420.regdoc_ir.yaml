      kind_raw: ２．２０
      num: '2.20'
      ord: 22
      heading: サニテーション／サニタィゼーション（sanitation/sanitization）
      text: 消毒・清掃などによって衛生的にすること．また，熱水等で装置・設備を殺菌すること．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
