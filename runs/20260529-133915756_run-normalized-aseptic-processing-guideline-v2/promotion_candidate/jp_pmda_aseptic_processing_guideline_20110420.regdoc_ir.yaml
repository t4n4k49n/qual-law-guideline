      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:2125
      children:
      - nid: cha18.sec18_2.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 658
        heading: null
        text: 凍結乾燥工程の無菌性を保証するため，凍結乾燥工程及びその前後の工程について適切な微生物学的監視プログラム及び物理的監視プログラムを策定し，バリデーションを実施すること．微生物学的監視プログラムは，通常，培地充てん試験，プロセスシミュレーション，一般的な凍結乾燥装置を含む滅菌工程のバリデーション，バイオバーデン管理等から構成される．物理的監視プログラムは，リーク試験並びに復圧フィルター及びリークフィルターの完全性試験から構成される．通常の滅菌工程のバリデーション，バイオバーデン管理，フィルターの完全性試験等は，無菌医薬品に係る他の製造設備と同様に実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2126
        - source_label: PMDA aseptic processing guideline
          locator: line:2127
        - source_label: PMDA aseptic processing guideline
          locator: line:2128
        - source_label: PMDA aseptic processing guideline
          locator: line:2129
        - source_label: PMDA aseptic processing guideline
          locator: line:2130
        - source_label: PMDA aseptic processing guideline
          locator: line:2131
        - source_label: PMDA aseptic processing guideline
          locator: line:2132
        children: []
      - nid: cha18.sec18_2.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 659
        heading: null
        text: 凍結乾燥工程においての重要な管理プログラムとして，第20章にもとづき，プロセスシミュレーションを実施すること．凍結乾燥工程に係るプロセスシミュレーションの実施に当たっては，実際の製造工程を参照しつつ，微生物の発育を阻害しない，かつ培地の性能を損なわない適切な条件を選択すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2133
        - source_label: PMDA aseptic processing guideline
          locator: line:2134
        - source_label: PMDA aseptic processing guideline
          locator: line:2135
        - source_label: PMDA aseptic processing guideline
          locator: line:2136
        - source_label: PMDA aseptic processing guideline
          locator: line:2137
        children:
        - nid: cha18.sec18_2.i2.si1
          kind: subitem
          kind_raw: ①
          num: '1'
          ord: 660
          heading: null
          text: 適切な冷却温度及び冷却時間を定めること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2138
          children: []
        - nid: cha18.sec18_2.i2.si2
          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 661
          heading: null
          text: 減圧度についても，突沸と自己凍結を起さない緩やかな減圧度を選択すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2139
          children: []
        - nid: cha18.sec18_2.i2.si3
          kind: subitem
          kind_raw: ③
          num: '3'
          ord: 662
          heading: null
          text: 培地の乾燥及び性能低下を伴うことのない凍結乾燥プログラム，特に乾燥時間を設定すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2140
          - source_label: PMDA aseptic processing guideline
            locator: line:2141
          children: []
        - nid: cha18.sec18_2.i2.si4
          kind: subitem
          kind_raw: ④
          num: '4'
          ord: 663
          heading: null
          text: 凍結乾燥に係る工程のうち，減圧開始時，復圧時，搬入時等乱流が発生する工程，及び職員が介在する工程等微生物汚染の確率が最も高い工程を適切にシミュレートし，ワーストケースとしてこれらを複数回実施することについても考慮する．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2142
          - source_label: PMDA aseptic processing guideline
            locator: line:2143
          - source_label: PMDA aseptic processing guideline
            locator: line:2144
          children: []
        - nid: cha18.sec18_2.i2.si5
          kind: subitem
          kind_raw: ⑤
          num: '5'
          ord: 664
          heading: null
          text: 凍結乾燥製剤に係る製品の中には，安定性の保持のために，窒素等の不活性ガスが封入されるものがある．このような場合において，好気性菌の生育条件を確保するためには，不活性ガスの代わりに空気を用いる．嫌気性菌の存在が確認された場合又はその存在が懸念される場合においては，不活性ガス及び嫌気性菌用の培地を用いる．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2145
          - source_label: PMDA aseptic processing guideline
            locator: line:2146
          - source_label: PMDA aseptic processing guideline
            locator: line:2147
          - source_label: PMDA aseptic processing guideline
            locator: line:2148
          children: []
      - nid: cha18.sec18_2.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 665
        heading: null
        text: 標準的な培地充てん本数及び凍結乾燥装置の大きさとの関係から，後者が前者と同等か又はそれを下回る場合においては凍結乾燥装置の大きさに相当する本数を充てんする．培地充てんの標準的なサイズ5,000本を超える大きさの凍結乾燥装置では適切な位置を選択して培地を充てんした容器を置くこと．すなわち，通例ランダムに置くか，順番に間引いて凍結乾燥庫の中にまんべんなく設置し，評価に偏りが出ないようにしなければならない．一方，復圧フィルターの不完全さ，扉の隙間からのリーク，アイスコンデンサー側からのリーク，真空ポンプからの逆拡散による汚染等を中心にワーストケースを評価しようとする意図があれば，そのような汚染の機会が多いところに置くことについても考慮する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2149
        - source_label: PMDA aseptic processing guideline
          locator: line:2150
        - source_label: PMDA aseptic processing guideline
          locator: line:2151
        - source_label: PMDA aseptic processing guideline
          locator: line:2152
        - source_label: PMDA aseptic processing guideline
          locator: line:2153
        - source_label: PMDA aseptic processing guideline
          locator: line:2154
        - source_label: PMDA aseptic processing guideline
          locator: line:2155
        - source_label: PMDA aseptic processing guideline
          locator: line:2156
        children: []
      - nid: cha18.sec18_2.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 666
        heading: null
        text: 無菌性保証のため，容器及び栓の完全性に関するバリデーションを実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2157
        children: []
      - nid: cha18.sec18_2.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 667
        heading: null
        text: 減圧下の庫内への外部空気の浸入に関して，リーク試験法の妥当性並びに復圧フィルター及び真空度を制御するためのリークフィルターの完全性についてバリデーションを実施すること．リーク試験の判定基準は，凍結乾燥装置の庫内容量，製造工程における減圧の保持時間，凍結乾燥装置周辺の設置環境を考慮し，凍結乾燥庫内の微生物汚染の危険性が最小レベルになるよう厳格に設定すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2158
        - source_label: PMDA aseptic processing guideline
          locator: line:2159
        - source_label: PMDA aseptic processing guideline
          locator: line:2160
        - source_label: PMDA aseptic processing guideline
          locator: line:2164
        - source_label: PMDA aseptic processing guideline
          locator: line:2165
        children: []
    - nid: cha18.sec18_3
      kind: section
      kind_raw: １８．３
      num: '18.3'
      ord: 668
      heading: 凍結乾燥装置の洗浄及び滅菌
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
