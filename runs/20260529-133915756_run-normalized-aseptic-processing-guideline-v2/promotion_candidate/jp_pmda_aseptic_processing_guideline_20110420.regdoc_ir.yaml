          ord: 595
          heading: null
          text: 完全性試験操作製造で使用するフィルターの完全性試験は，微生物捕捉性能データとの相関性が実証された非破壊試験によること．完全性試験には，ディフュージョン試験（フォワードフロー）やバブルポイント試験がある．相関性の実証とは完全性試験規定値を満足するフィルターは，微生物捕捉性能が担保できることを確認すること（逆に規定値を下回るフィルターは微生物捕捉性能が担保できないこと）である．この基礎となるデータはフィルター供給者より提供をうけること．
          role: normative
          normativity: must
