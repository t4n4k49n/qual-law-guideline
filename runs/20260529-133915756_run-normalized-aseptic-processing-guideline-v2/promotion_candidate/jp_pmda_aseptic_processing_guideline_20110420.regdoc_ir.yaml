      children:
      - nid: cha5.sec5_2.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 135
        heading: null
        text: 無菌操作環境を汚染しないことを保証するため，職員は手順書を遵守すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:681
        children: []
      - nid: cha5.sec5_2.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 136
        heading: null
        text: 職員は，作業衣等が身体に合ったものであること，ホコロビや破損がないことに注意を払うこと．手袋や作業衣等の欠陥を発見した場合においては，直ちに交換するか，又は重ねて着用する等必要な措置を採ること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:682
        - source_label: PMDA aseptic processing guideline
          locator: line:683
        - source_label: PMDA aseptic processing guideline
          locator: line:684
        children: []
      - nid: cha5.sec5_2.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 137
        heading: null
        text: 更衣後の職員は，不必要な会話をやめ，壁，床及び清浄済表面に不必要に接触しないこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:685
        children: []
      - nid: cha5.sec5_2.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 138
        heading: null
        text: 無菌操作区域内においては必要最尐以外のものに触らない等，行動制限に関することを規定しておくこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:686
        - source_label: PMDA aseptic processing guideline
          locator: line:687
        children: []
      - nid: cha5.sec5_2.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 139
        heading: null
        text: その他の支援区域において作業に従事する職員は，適切な教育訓練を受けることなく，また更衣を行うことなく重要区域及び直接支援区域に出入りしないようにすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:688
        - source_label: PMDA aseptic processing guideline
          locator: line:692
        children: []
      - nid: cha5.sec5_2.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 140
        heading: null
        text: 無菌操作区域における作業に従事する職員の人数は，作業シフト毎に，作業前も含め可能な限り尐数とすること．無菌医薬品に係る製品及び滅菌済の容器や栓に触れる作業又はそれらが曝露される環境における作業に従事する者を特定できるようにすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
