    - nid: chaa5.pa5_2_1
      kind: paragraph
      kind_raw: A5.2.1
      num: A5.2.1
      ord: 1048
      heading: null
      text: リスク特定（ハザードの特定）化学物質（原薬）が患者や製造作業者の健康に悪影響を引き起こさない曝露限界を，科学的な根拠に基づき設定することが重要である．曝露限界値は，前臨床（動物）や臨床（ヒト）から取得された毒性データをもとに外挿される．こうした限度値は，1日の許容曝露量として規定されることが多く，PDE(Permitted Daily Exposure)，ADE（Acceptable Daily Exposure），ADI(Acceptable Daily Intake)といったものが各種ガイドラインで紹介されている．こうした健康障害リスクに基づき設定された曝露限界から，作業環境の安全性限界値（許容曝露濃度や許容残留量など），交叉汚染限界値，製品接触部における残留限界値を合理的に設定することができる．また，これらの限界値に基づき，患者や製造作業者の健康に悪影響を引き起こす可能性を許容限界以下に抑える製造条件を設定することができる．
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
