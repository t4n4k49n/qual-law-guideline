        ord: 419
        heading: null
        text: 繰り返し滅菌を行って使用する物（フィルター，器具等，無菌衣等）については，設定した最大の蒸気曝露が繰り返されても滅菌対象物の仕様，安全性及び機能が確保されるよう，管理方法（目視確認の手順，許容滅菌回数等）を定め，その範囲内で使用すること．
        role: normative
        normativity: must
        tags: []
