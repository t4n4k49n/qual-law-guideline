        - source_label: PMDA aseptic processing guideline
          locator: line:1277
        children: []
      - nid: cha11.sec11_2.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 332
        heading: null
        text: 日常調査製造環境の維持のため，日常のデータに基づく傾向分析を行い，傾向分析基準値を設定すること．製造環境の変化が基準値内（警報基準内）であっても通常域（傾向分析基準）から外れる傾向を事前に検知し，その要因の調査を実施することにより，環境維持を適切に行い，空調装置等環境維持装置の維持管理，滅菌又は消毒の方法の是正にも活用する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1278
        - source_label: PMDA aseptic processing guideline
          locator: line:1279
        - source_label: PMDA aseptic processing guideline
          locator: line:1280
        - source_label: PMDA aseptic processing guideline
          locator: line:1281
        - source_label: PMDA aseptic processing guideline
          locator: line:1282
        children: []
    - nid: cha11.sec11_3
      kind: section
      kind_raw: １１．３
      num: '11.3'
      ord: 333
      heading: 環境モニタリング判定基準例
      text: 環境モニタリング頻度を表２に，評価基準を表3に例示する．ただし，製品の種類，大きさ，製造装置の仕組み，自動化レベル，容器や栓の滞留時間，空調装置等環境設備により無菌製品への汚染リスクは異なるため，必要性に応じた適切なモニタリングプログラムを確立し，運用すること．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:1285
      - source_label: PMDA aseptic processing guideline
        locator: line:1286
      - source_label: PMDA aseptic processing guideline
        locator: line:1287
      - source_label: PMDA aseptic processing guideline
        locator: line:1288
      children:
      - nid: cha11.sec11_3.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 334
        heading: null
        text: これらの頻度は作業の内容，作業時間等に応じて増減してもよいが，製品への汚染状況を適切にモニタリングすることができる頻度であることが必要である．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1289
        - source_label: PMDA aseptic processing guideline
          locator: line:1290
        children: []
      - nid: cha11.sec11_3.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 335
        heading: null
        text: 職員のレベルにより職員の付着菌測定頻度を設定することも必要である．無菌操作の経験の浅い職員については特に頻度を増やすことを推奨する．職員のレベルは，作業への従事頻度，付着菌モニタリングの結果，培地充てん試験への参加回数等を追跡し判断する必要がある．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1291
        - source_label: PMDA aseptic processing guideline
          locator: line:1292
        - source_label: PMDA aseptic processing guideline
          locator: line:1293
        children: []
      - nid: cha11.sec11_3.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 336
        heading: null
        text: グレードC及びグレードDについては，品質リスク管理に基づき，製品，実施される工程，作業内容等によりモニタリング頻度を決める．製品を曝露しない場合などリスクが低い場合は測定頻度を適宜減らすことができる．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1294
        - source_label: PMDA aseptic processing guideline
          locator: line:1295
        - source_label: PMDA aseptic processing guideline
          locator: line:1296
        children: []
      - nid: cha11.sec11_3.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 337
        heading: null
        text: 施設の運転開始直後（稼働性能適格性評価の開始時），長期運転停止後又は一部変更後においては，モニタリングを強化すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1297
        - source_label: PMDA aseptic processing guideline
          locator: line:1298
        children: []
      - nid: cha11.sec11_3.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 338
        heading: null
        text: グレードＢにいる職員がグレードAにアクセスした場合における付着微生物は，作業内容の製品汚染リスクに応じて，適宜グレードAの許容基準に照らして評価すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1299
        - source_label: PMDA aseptic processing guideline
          locator: line:1300
        children: []
      - nid: cha11.sec11_3.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 339
        heading: null
        text: グレードA及びグレードBにおける微粒子管理は，機器の組み立てから重要作業終了までは連続モニタリングを推奨する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1301
        - source_label: PMDA aseptic processing guideline
