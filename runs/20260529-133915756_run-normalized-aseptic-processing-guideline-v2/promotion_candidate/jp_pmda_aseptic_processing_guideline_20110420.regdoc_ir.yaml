        kind: item
        kind_raw: 3)
        num: '3'
        ord: 652
        heading: null
        text: 凍結乾燥工程を終えまだバイアルの打栓工程を終えていない製品，またアンプルの熔閉工程又はバルクの巻締め工程を終えていない製品については，グレードＡの清浄度レベルが維持された搬出経路及び作業環境において取り扱うこと．
        role: normative
        normativity: must
        tags: []
