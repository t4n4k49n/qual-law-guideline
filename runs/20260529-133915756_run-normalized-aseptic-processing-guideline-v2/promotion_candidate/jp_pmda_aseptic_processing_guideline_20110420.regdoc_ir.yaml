        heading: null
        text: ろ過設備の設計ろ過設備は，フィルター上に凝縮水が発生し，ろ過流量の低下や微生物の増殖が生じることを防止するために，凝縮水を速やかにハウジング及びフィルターの内部から排出できるよう適切に設計すること．WFIタンクのように凝縮水が発生する恐れのある場合においては，フィルターハウジングを加温するなどしてその発生を防ぐこと．17.1.4項を参照すること．
