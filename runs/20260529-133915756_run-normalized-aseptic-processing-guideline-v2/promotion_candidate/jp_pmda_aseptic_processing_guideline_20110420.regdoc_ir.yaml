      children:
      - nid: cha18.sec18_3.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 669
        heading: null
        text: 凍結乾燥装置の洗浄に当たっては次のことに留意すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2169
        children:
        - nid: cha18.sec18_3.i1.si1
          kind: subitem
          kind_raw: ①
          num: '1'
          ord: 670
          heading: null
          text: 凍結乾燥庫内は，構造が複雑であるため，それらの洗浄の難易度をよく認識し，洗浄手順を定めること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2170
          - source_label: PMDA aseptic processing guideline
            locator: line:2171
          children: []
        - nid: cha18.sec18_3.i1.si2
          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 671
          heading: null
          text: 洗浄効果を確認する場合の採取方法については，排水の採取のほか，棚裏及び排水口近傍においてはスワブ法の併用が望ましい．また，清浄な粘着テープによる転写法も有効である．スワブ法及び洗浄水サンプリング法において，洗浄効果確認指標とする薬剤（実製品，模擬医薬品等）について，洗浄の容易性や薬理活性の高さを考慮の上，選定する必要がある．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2172
          - source_label: PMDA aseptic processing guideline
            locator: line:2173
          - source_label: PMDA aseptic processing guideline
            locator: line:2174
          - source_label: PMDA aseptic processing guideline
            locator: line:2175
          - source_label: PMDA aseptic processing guideline
            locator: line:2176
          children: []
        - nid: cha18.sec18_3.i1.si3
          kind: subitem
          kind_raw: ③
          num: '3'
          ord: 672
          heading: null
          text: 洗浄に関して洗剤を使用する場合においては，洗剤の毒性データ等を入手し，スワブ法及びリンス法における評価方法を定めて，残留洗剤の評価を行うこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2177
          - source_label: PMDA aseptic processing guideline
            locator: line:2178
          children: []
      - nid: cha18.sec18_3.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 673
        heading: null
        text: 凍結乾燥装置の滅菌においては適切な滅菌方法を設定し，滅菌のバリデーションを実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2179
        - source_label: PMDA aseptic processing guideline
          locator: line:2180
        children:
        - nid: cha18.sec18_3.i2.si1
          kind: subitem
          kind_raw: ①
          num: '1'
          ord: 674
          heading: null
          text: 凍結乾燥庫の内部は，構造が複雑であり，多種多様な材質が使用されているため，その滅菌方法については，コールドスポット又は滅菌ガスの拡散を考慮して，安全側に立って設定すること．特に滅菌ガスによる場合においては，温度や湿度のばらつきが避けられないことから十分な時間をかけることとし，滅菌ガスの循環及び拡散の方法をよく検討すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2181
          - source_label: PMDA aseptic processing guideline
            locator: line:2182
          - source_label: PMDA aseptic processing guideline
            locator: line:2183
          - source_label: PMDA aseptic processing guideline
            locator: line:2184
          - source_label: PMDA aseptic processing guideline
            locator: line:2185
          children: []
        - nid: cha18.sec18_3.i2.si2
          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 675
          heading: null
          text: 蒸気滅菌による場合においては，凍結乾燥庫の内部の構造が複雑であることを勘案し，残留空気の置換及び凝縮水の排除に注意すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2186
          - source_label: PMDA aseptic processing guideline
            locator: line:2187
          children: []
        - nid: cha18.sec18_3.i2.si3
          kind: subitem
          kind_raw: ③
          num: '3'
          ord: 676
          heading: null
          text: 蒸気滅菌の頻度については，原則として凍結乾燥サイクル毎に実施するものとすること．製品の種類その他の要因により滅菌間隔を変更する場合においては，その間の微生物学的バリデーションにおいて妥当性を検証すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2188
          - source_label: PMDA aseptic processing guideline
            locator: line:2189
          - source_label: PMDA aseptic processing guideline
            locator: line:2190
          children: []
    - nid: cha18.sec18_4
