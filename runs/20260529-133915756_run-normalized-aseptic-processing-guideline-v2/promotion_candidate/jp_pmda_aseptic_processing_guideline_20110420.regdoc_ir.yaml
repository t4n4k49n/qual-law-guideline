        locator: line:2597
      - source_label: PMDA aseptic processing guideline
        locator: line:2598
      - source_label: PMDA aseptic processing guideline
        locator: line:2599
      children: []
    - nid: cha20.sec20_6
      kind: section
      kind_raw: ２０．６
      num: '20.6'
      ord: 826
      heading: アイソレータシステムを採用している製造ラインのプロセスシミュレーション
      text: アイソレータシステムを採用している製造ラインのプロセスシミュレーションは，初期評価を行った後，以下の条件を満たし，微生物による汚染リスクの低いことが立証できる場合は，実施頻度を低減することができる．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:2602
      - source_label: PMDA aseptic processing guideline
        locator: line:2603
      - source_label: PMDA aseptic processing guideline
        locator: line:2604
      - source_label: PMDA aseptic processing guideline
        locator: line:2605
      children:
      - nid: cha20.sec20_6.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 827
        heading: null
        text: 構造的に職員と医薬品の曝露する環境が完全に隔離され，職員はバリアやグローブを介さなければ直接介在作業を行うことがない．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2606
        - source_label: PMDA aseptic processing guideline
          locator: line:2607
        children: []
      - nid: cha20.sec20_6.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 828
        heading: null
        text: アイソレータシステムのリスク管理（グローブ，差圧，開口部からの逆流，搬出入操作，滅菌トンネル冷却部の影響，除染等）が，それぞれの項目に適切な技術と頻度で十分に実施されている．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
