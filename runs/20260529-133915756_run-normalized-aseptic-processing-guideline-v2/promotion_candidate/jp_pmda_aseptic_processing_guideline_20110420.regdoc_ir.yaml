          text: 目的が殺菌のときは通常254nmの波長の紫外線を照射するが，照射波長の近傍においてのみ殺菌効果があることに注意すること．殺菌効率は温度，流速，照射強度，対象への照射時間，対象とする微生物の種類等により変動し，UV照射を受けた微生物は一部に光回復，暗回復の現象が見られるので，完全に死滅しないことを認識すること．
