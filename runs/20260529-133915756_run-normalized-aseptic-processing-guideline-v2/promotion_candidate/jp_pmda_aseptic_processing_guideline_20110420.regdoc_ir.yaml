        kind: item
        kind_raw: 2）
        num: '2'
        ord: 144
        heading: null
        text: 清浄区域は作業毎に明確に区分され適切な広さを有すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:706
        children: []
      - nid: cha6.sec6_1.i3
        kind: item
        kind_raw: 3）
        num: '3'
        ord: 145
        heading: null
        text: 職員，製品等及び資材，廃棄物等の流れ並びにそれらの管理が容易になるよう，かつ各動線の交錯が尐なくなるような設備の配置を考慮すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:707
        - source_label: PMDA aseptic processing guideline
          locator: line:708
        children: []
      - nid: cha6.sec6_1.i4
        kind: item
        kind_raw: 4）
        num: '4'
        ord: 146
        heading: null
        text: 装置，器具等の清浄品と非清浄品，滅菌品と非滅菌品との混同を予防するような運用又は区画を考慮すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:709
        - source_label: PMDA aseptic processing guideline
          locator: line:710
        children: []
      - nid: cha6.sec6_1.i5
        kind: item
        kind_raw: 5）
        num: '5'
        ord: 147
        heading: null
        text: 清浄化及び維持管理が容易なものとし，設計意図に見合ったものであることを維持できるように定期的に点検を行うこと．特に部屋の密閉性を維持するために重要なシール部やパッキン類に注意すること．また，結露を防止するための断熱材についても有効に機能するよう注意すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
