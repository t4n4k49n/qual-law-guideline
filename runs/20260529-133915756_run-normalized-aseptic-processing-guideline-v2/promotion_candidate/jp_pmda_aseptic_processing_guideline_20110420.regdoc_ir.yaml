        - nid: cha7.sec7_1.p7_1_1.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 186
          heading: null
          text: 製品の無菌性を確保する上で特に重要な箇所については，浮遊微粒子数及び微生物数について適切な方法及び頻度によりモニタリングを行うこと．浮遊微粒子数は，滅菌した接液パーツの組立て作業など重要な準備作業を含め無菌操作を行っている時間を通して連続的に測定することが望ましい．また，作業域にできるだけ近い位置で(30cm以内が望ましい)，測定を行うこと．微生物モニタリングの頻度と方法については，その行為自体が製品の無菌性を損なうことがないように注意すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
