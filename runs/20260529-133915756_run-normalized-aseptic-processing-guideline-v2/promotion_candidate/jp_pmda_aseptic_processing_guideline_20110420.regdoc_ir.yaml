          locator: line:711
        - source_label: PMDA aseptic processing guideline
          locator: line:712
        - source_label: PMDA aseptic processing guideline
          locator: line:713
        - source_label: PMDA aseptic processing guideline
          locator: line:714
        children: []
      - nid: cha6.sec6_1.i6
        kind: item
        kind_raw: 6）
        num: '6'
        ord: 148
        heading: null
        text: 天井は効果的にシールされていること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:715
        children: []
      - nid: cha6.sec6_1.i7
        kind: item
        kind_raw: 7）
        num: '7'
        ord: 149
        heading: null
        text: 粒子あるいは微生物がたまったり気流を妨げたりする可能性のある凹凸構造，窓，扉周り等の横桟の設置は可能な限り避けること．やむを得ない場合は容易に清掃できる構造とすること．特に無菌操作区域にはスライディングドアは好ましくない．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
