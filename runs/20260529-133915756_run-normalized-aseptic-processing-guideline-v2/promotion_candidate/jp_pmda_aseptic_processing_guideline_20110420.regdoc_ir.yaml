          kind: item
          kind_raw: 3)
          num: '3'
          ord: 185
          heading: null
          text: 重要区域への職員の介入は，最小限とすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
