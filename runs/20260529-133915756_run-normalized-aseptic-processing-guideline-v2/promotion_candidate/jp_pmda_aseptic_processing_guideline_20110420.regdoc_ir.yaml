        ord: 872
        heading: null
        text: 蒸留器蒸留法には一般的に，単効用缶式，多重効用缶式，蒸気圧縮式等があるが，多重効用缶式及び蒸気圧縮式の二つの方式は製造能力が高く，熱効率がよいため，大容量の製薬用水の製造設備として有用である．3つの蒸留方式にはそれぞれ特徴があるため，用途及び使用量等に応じ適切に選定すること．設計に際しては，蒸留器の要求に見合った供給水の前処理(イオン交換，RO，UF等)を組み合わせ，不純物が水蒸気に付随して持ち込まれる飛沫同伴の防止，濃縮による硬度スケールの発生防止のための，濃縮排水量の適切な設定等を考慮すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2757
        - source_label: PMDA aseptic processing guideline
          locator: line:2758
        - source_label: PMDA aseptic processing guideline
          locator: line:2759
        - source_label: PMDA aseptic processing guideline
          locator: line:2760
        - source_label: PMDA aseptic processing guideline
          locator: line:2761
        - source_label: PMDA aseptic processing guideline
          locator: line:2762
        - source_label: PMDA aseptic processing guideline
          locator: line:2763
        - source_label: PMDA aseptic processing guideline
          locator: line:2764
        children: []
      - nid: chaa2.pa2_1_2.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 873
        heading: null
        text: 逆浸透膜処理装置逆浸透法（RO）は，半透膜と十分な膜間の圧力差による水の透過により，無機塩類程度の小分子溶質，溶媒分子，微生物，エンドトキシン等を原水中のそれぞれの濃度に応じて除去し，水質要因を改善する．ROは常温操作が可能であり，蒸留法器に比べてエネルギーコストを低減させることはできるが，ピンホール等による二次側へのリーク及び微生物汚染の管理が蒸留器以上に必要である．RO膜ユニットの設計に関する留意点を以下に示す．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2767
        - source_label: PMDA aseptic processing guideline
          locator: line:2768
        - source_label: PMDA aseptic processing guideline
          locator: line:2769
        - source_label: PMDA aseptic processing guideline
          locator: line:2770
        - source_label: PMDA aseptic processing guideline
          locator: line:2771
        - source_label: PMDA aseptic processing guideline
          locator: line:2772
        children:
        - nid: chaa2.pa2_1_2.i2.si1
          kind: subitem
          kind_raw: ①
          num: '1'
          ord: 874
          heading: null
          text: 二酸化炭素及びアンモニアガスは，ROによって除去できないので，必要に応じてRO処理前に脱気，中和，イオン交換等により除去すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2773
          - source_label: PMDA aseptic processing guideline
            locator: line:2774
          children: []
        - nid: chaa2.pa2_1_2.i2.si2
          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 875
          heading: null
          text: 供給される水の前処理段階において，微生物の管理とモニタリングプログラムに係る設備を組み入れ，あらかじめ定めた管理基準に適合する水質の維持を図ること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2775
          - source_label: PMDA aseptic processing guideline
            locator: line:2779
          children: []
        - nid: chaa2.pa2_1_2.i2.si3
          kind: subitem
          kind_raw: ③
          num: '3'
          ord: 876
          heading: null
          text: 一般に常温においての操作であり，その膜の構造からピンホール等によるリークで，二次側を汚染する可能性があるので，信頼性向上及び管理の面から，直列二段構成とすることが望ましい．さらに下流においてはUV殺菌，加熱処理等を行い，微生物増殖の抑制を行うこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2780
          - source_label: PMDA aseptic processing guideline
            locator: line:2781
          - source_label: PMDA aseptic processing guideline
            locator: line:2782
          - source_label: PMDA aseptic processing guideline
            locator: line:2783
          children: []
      - nid: chaa2.pa2_1_2.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 877
        heading: null
        text: 限外ろ過膜装置限外ろ過法（UF）は，エンドトキシン除去能を有する超ろ過法の一つである．ROとは異なり，高圧を与える必要がなく，耐熱性にすぐれる．また蒸気滅菌にも耐えられる材質のUF膜もあり，装置内の高温水滅菌及び薬品処理が比較的容易である．UFを利用するに当たっては，分画分子量6,000Da程度以上の有機物を除去することを目的とし，当該目的に合致するグレードのUF膜を利用するものとすることが望ましい．ROと同様に，UFの精製機能は上流側の水質及び設備にもよるが，微粒子，微生物等に起因する目詰まり等による菌増殖が精製能力及び水質に悪影響を及ぼさないよう日常の維持管理を行う必要がある．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2786
        - source_label: PMDA aseptic processing guideline
          locator: line:2787
        - source_label: PMDA aseptic processing guideline
          locator: line:2788
        - source_label: PMDA aseptic processing guideline
          locator: line:2789
        - source_label: PMDA aseptic processing guideline
          locator: line:2790
        - source_label: PMDA aseptic processing guideline
          locator: line:2791
        - source_label: PMDA aseptic processing guideline
          locator: line:2792
        - source_label: PMDA aseptic processing guideline
          locator: line:2793
        children: []
      - nid: chaa2.pa2_1_2.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 878
        heading: null
        text: 注射用水等の貯蔵設備用することが望ましい．貯留する際は以下の点に留意すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2796
        - source_label: PMDA aseptic processing guideline
          locator: line:2798
        children:
        - nid: chaa2.pa2_1_2.i4.not1
          kind: note
          kind_raw: note
          num: null
          ord: 879
          heading: null
          text: 注射用水は，微生物汚染及び他の化学的成分の混入汚染を避けるために，製造後速やかに使
          role: informative
          normativity: null
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2797
          children: []
        - nid: chaa2.pa2_1_2.i4.si1
          kind: subitem
          kind_raw: ①
          num: '1'
          ord: 880
          heading: null
          text: 水槽は内面が平滑な密封型とし，水槽からの水位計取り付け部のようなノズルの数は必要最小限とし，ノズルは可能な限り短いものとすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2799
          - source_label: PMDA aseptic processing guideline
            locator: line:2800
          children: []
        - nid: chaa2.pa2_1_2.i4.si2
          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 881
          heading: null
          text: 滞留部分を生じず，内部の洗浄が容易であって，完全に排水することが可能な構造とすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2801
          - source_label: PMDA aseptic processing guideline
            locator: line:2802
          children: []
        - nid: chaa2.pa2_1_2.i4.si3
          kind: subitem
          kind_raw: ③
          num: '3'
          ord: 882
          heading: null
          text: 水槽は，水の入れ替わり（Turnover）ができる限り早くなるように適切な容量のものとすること．水槽内での長期間の貯留はできるだけ避けること．長期間の貯留は，その期間をバリデーションにより定めること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2803
          - source_label: PMDA aseptic processing guideline
            locator: line:2804
          - source_label: PMDA aseptic processing guideline
            locator: line:2805
          children: []
        - nid: chaa2.pa2_1_2.i4.si4
          kind: subitem
          kind_raw: ④
          num: '4'
          ord: 883
          heading: null
          text: 通気口には，微生物及び異物の侵入を防ぐために，疎水性の孔径0.2/0.22㎛のベントフィルターを取り付けること．ベントフィルターは取り付け前及び定期的にその完全性を確認すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2806
          - source_label: PMDA aseptic processing guideline
            locator: line:2807
          - source_label: PMDA aseptic processing guideline
            locator: line:2808
          children: []
        - nid: chaa2.pa2_1_2.i4.si5
          kind: subitem
          kind_raw: ⑤
          num: '5'
          ord: 884
          heading: null
          text: 貯水タンク内に熱水が供給される場合には，蒸気の凝縮によってベントフィルターの閉そくを防止するためベントフィルターの周りにヒーターを設置するのが望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2809
          - source_label: PMDA aseptic processing guideline
            locator: line:2810
          children: []
        - nid: chaa2.pa2_1_2.i4.si6
          kind: subitem
          kind_raw: ⑥
          num: '6'
          ord: 885
          heading: null
          text: 熱水で殺菌を行う場合においては，上部も含め水槽内全体に熱が行き渡るような機構を付加すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2811
          - source_label: PMDA aseptic processing guideline
            locator: line:2812
          children: []
        - nid: chaa2.pa2_1_2.i4.si7
          kind: subitem
          kind_raw: ⑦
          num: '7'
          ord: 886
          heading: null
          text: 一般的な安全弁は構造的に殺菌や滅菌が困難であるので，水槽内の水質の完全性を守るため，サニタリー式の安全弁を採用するか，破裂板(Rupture Disc Valve)を併用する．破裂板を用いる場合は，破れたときにそれを知らせる警告装置の設置が望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2813
          - source_label: PMDA aseptic processing guideline
            locator: line:2814
          - source_label: PMDA aseptic processing guideline
            locator: line:2815
          - source_label: PMDA aseptic processing guideline
            locator: line:2816
          children: []
        - nid: chaa2.pa2_1_2.i4.si8
          kind: subitem
          kind_raw: ⑧
          num: '8'
          ord: 887
          heading: null
          text: 水槽内面の気液界面は微生物が繁殖しやすく，腐食を生じやすいので，頂部も含め流水により常に流動させて，水槽内全体に流水が行き渡ることが望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2820
          - source_label: PMDA aseptic processing guideline
            locator: line:2821
          children: []
      - nid: chaa2.pa2_1_2.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 888
        heading: null
        text: 配管構造水槽に貯えられた製薬用水は，配管を通してユースポイントに運ばれるが，その管径が比較的小さくかつ密閉系であり一度設置されると内部の確認が困難となる．このため設計段階から管理方法及びトラブル防止対策についてよく検討しておく必要がある．主な留意点を以下に示す．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:2824
        - source_label: PMDA aseptic processing guideline
          locator: line:2825
        - source_label: PMDA aseptic processing guideline
          locator: line:2826
        - source_label: PMDA aseptic processing guideline
          locator: line:2827
        children:
        - nid: chaa2.pa2_1_2.i5.si1
          kind: subitem
          kind_raw: ①
          num: '1'
          ord: 889
          heading: null
          text: 基本的には，水が常時流れないバイパス配管及び枝管は可能な限り設けないことが望ましい．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2828
          - source_label: PMDA aseptic processing guideline
            locator: line:2829
          children: []
        - nid: chaa2.pa2_1_2.i5.si2
          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 890
          heading: null
          text: 注射用水は，微生物及び有機物の定着を防ぐために80℃以上に加温し，十分な乱流となる流速で常時循環させることが望ましい．循環させない場合においては水質維持が可能となるように排水し，水を入れ替えるものとすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2830
          - source_label: PMDA aseptic processing guideline
            locator: line:2831
          - source_label: PMDA aseptic processing guideline
            locator: line:2832
          children: []
        - nid: chaa2.pa2_1_2.i5.si3
          kind: subitem
          kind_raw: ③
          num: '3'
          ord: 891
          heading: null
          text: 常温で循環するラインは，微生物増殖防止のための方法を考慮すること．例えば，途中にUVランプ（紫外線滅菌灯）を設置するなどの方法がある．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2833
          - source_label: PMDA aseptic processing guideline
            locator: line:2834
          children: []
        - nid: chaa2.pa2_1_2.i5.si4
          kind: subitem
          kind_raw: ④
          num: '4'
          ord: 892
          heading: null
          text: ループ内はユースポイントからの逆流がないように圧力を維持するなど対策を講じること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2835
          - source_label: PMDA aseptic processing guideline
            locator: line:2836
          children: []
        - nid: chaa2.pa2_1_2.i5.si5
          kind: subitem
          kind_raw: ⑤
          num: '5'
          ord: 893
          heading: null
          text: 循環しない方式を採用する場合においては，使用前に高温水による洗浄やスチーム滅菌により微生物汚染を防止できるような手段を講じること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2837
          - source_label: PMDA aseptic processing guideline
            locator: line:2838
          children: []
        - nid: chaa2.pa2_1_2.i5.si6
          kind: subitem
          kind_raw: ⑥
          num: '6'
          ord: 894
          heading: null
          text: 横引き配管には排水時及び滅菌時の水の滞留を防止できるように可能な限り1/100以上の勾配を設けること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2839
          - source_label: PMDA aseptic processing guideline
            locator: line:2840
          children: []
        - nid: chaa2.pa2_1_2.i5.si7
          kind: subitem
          kind_raw: ⑦
          num: '7'
          ord: 895
          heading: null
          text: ドレインの排出が容易にできるように排出口を設けるとともに，逆流を防止する構造とすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2841
          - source_label: PMDA aseptic processing guideline
            locator: line:2842
          children: []
        - nid: chaa2.pa2_1_2.i5.si8
          kind: subitem
          kind_raw: ⑧
          num: '8'
          ord: 896
          heading: null
          text: 飛散しやすく，微量で過敏症反応を示す製品等又は交叉汚染することにより他の製品に重大な影響を及ぼす恐れのある製品等の製造に使用する供給配管については，それに係る場所の配管と，設備の停止時，異常時，保守点検時を含めて交差汚染が起こるリスクに対して特段の配慮を行うこと．その他の製品等に係る配管と別系統にするのが望ましいが，同一のラインとならないようにすること．やむなく同一ラインとなる場合は，交叉汚染リスクが最小とするような措置を講じること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2843
          - source_label: PMDA aseptic processing guideline
            locator: line:2844
          - source_label: PMDA aseptic processing guideline
            locator: line:2845
          - source_label: PMDA aseptic processing guideline
            locator: line:2846
          - source_label: PMDA aseptic processing guideline
            locator: line:2847
          - source_label: PMDA aseptic processing guideline
            locator: line:2848
          children: []
      - nid: chaa2.pa2_1_2.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 897
        heading: null
        text: 熱交換器熱媒体のリークによる供給水の汚染を防止すること．一般的には，二重管（Double Tube）又は二重管板型（Double Tube Sheet Type）のシェルアンドチューブを採用する．注射用水ラインにプレート型熱交換器を使用しないこと．その他の型の熱交換器を使用する場合は，供給水側が熱媒体に汚染されない型式を選定すること．供給水側への汚染のリスクが想定される場合は，供給水側の圧力が常に熱媒体側より高くなるようにし，その圧力差の監視を行うことができるように計器及び警報を取り付けること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
