        text: バルブ及び計器類製薬用水に係る設備に設置するダイヤフラム式等のバルブ，計器，検出器等は，液が滞留する部分及びデッドセクションがないものを選定する．バルブは，サニタリー構造仕様とする．水の化学的品質のモニタリングプログラムを適時行うことを可能とするため，導電率計並びにTOC計をインラインに設置することが望ましい．取付け位置は，当該局部配管内の水質を代表する場所を選定すること．
