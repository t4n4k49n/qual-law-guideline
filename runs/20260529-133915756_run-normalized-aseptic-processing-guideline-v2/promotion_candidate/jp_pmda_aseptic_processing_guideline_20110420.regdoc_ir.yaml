        locator: line:328
      - source_label: PMDA aseptic processing guideline
        locator: line:329
      - source_label: PMDA aseptic processing guideline
        locator: line:330
      children: []
    - nid: cha2.sec2_22
      kind: section
      kind_raw: ２．２２
      num: '2.22'
      ord: 24
      heading: 重要区域(critical area)
      text: 重要操作区域（critical processing area）ともいう．滅菌された製品等及び資材並びにこれらと直接接する面が環境に曝露される製造作業を行う限定された区域をいう．空気の清浄度レベルは，グレードＡが適用される．
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
