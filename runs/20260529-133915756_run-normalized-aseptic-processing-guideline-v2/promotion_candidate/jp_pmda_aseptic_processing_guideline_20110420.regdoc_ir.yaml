      - nid: chaa2.pa2_2.i7
        kind: item
        kind_raw: 7)
        num: '7'
        ord: 918
        heading: null
        text: 稼働性能適格性評価(PQ)初期の段階（Phase 1）においては,要求される製薬用水の水質が安定的な製造及び供給が設備能力として十分に保有していることを確認する．次のPhase 2においては，各々の要求水質に対する警報基準値及び処置基準値の設定，日常管理の標準操作手順の確立を目的とする．なお，確認を開始するときには，注射用水又は精製水関連の設備においては重要工程の全ユースポイントにおいて，原水及び供給水関連の設備においては各サブループ及び重要工程に使用するユースポイントにおいて，尐なくとも連続3日間から1週間程度，規格に適合する水が製造できていることを確認する．引き続き，同じ確認項目について季節変動の把握及び安定稼働確認のため，定められた手順と管理基準に基づき，1年間にわたる稼働性能適格性評価（Phase 2）を実施する．この際，機器等の交換頻度の調査も行い，日常管理方法の問題点も抽出する．Phase2終了後の最終段階（Phase 3）においては，原水質などの季節変動により生じる処理水質の傾向分析により，要求される品質の製薬用水が警報基準値内で安定して製造されていることを確認し，それらを報告書にまとめ，設備と管理プログラム全体を評価する（Phase 3）．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
