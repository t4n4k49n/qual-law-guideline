          num: '4'
          ord: 196
          heading: null
          text: 秤量や調製工程はグレードC以上の環境で行うことが望ましい。粉体を扱うことにより、作業時に浮遊微粒子数の規定を満足することができない場合においては，空気のサンプリング箇所を工夫する，粉末がない状態で測定を行う等の方法により，実際に汚染の原因となる微粒子のレベルを把握し，目的とする空気の品質が維持されていることを確認すること．
