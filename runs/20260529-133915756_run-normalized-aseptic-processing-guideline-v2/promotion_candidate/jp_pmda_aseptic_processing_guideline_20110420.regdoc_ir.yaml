      text: 一般要件無菌医薬品の製造所における防虫管理は，一般の医薬品製造所と同様，製造環境の清浄度レベルを維持するペストコントロールとして重要である．さらに，無菌医薬品の製造所において生息する昆虫類の特定は，カビの発生等に起因する食物連鎖の存在，すなわち微生物学的清浄度レベルの指標となり，また，当該昆虫類が微生物及びその胞子を虫体につけて移動することから無菌医薬品に係る製品の微生物学的管理上からも重要である．医薬品製造所において捕獲される動物には，昆虫綱，蛛形綱(クモ，ダニ)，唇脚綱(ゲジ，ムカデ)，等脚類(ワラジムシ)等の節足動物が含まれるが，本指針においてはこれらを総称して「昆虫類」という．無菌操作区域においても昆虫類が生息していることがある．生息密度が低く，微小な昆虫類については，これらを把握することができるようなサンプリング方法が必要となる．また，無菌操作区域においては外部からの持ち込み，又は侵入する昆虫類は非常に尐ないことから，内部で発生する昆虫類（特に食菌性の昆虫類）の管理プログラム（以下「昆虫類管理プログラム」という．）を確立しておかなければならない．
      role: normative
      normativity: must
      tags: []
