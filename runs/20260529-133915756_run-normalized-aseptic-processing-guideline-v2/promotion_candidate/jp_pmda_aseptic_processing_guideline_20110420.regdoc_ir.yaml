        ord: 279
        heading: null
        text: 非無菌環境から隔離し，無菌性を維持することができるような容器を保管及び輸送に用いる（この項において「容器」とは，コンテナ，ドラム，袋，タンク等をいう．）．この容器は，保管及び輸送を考慮した強度が必要である．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
