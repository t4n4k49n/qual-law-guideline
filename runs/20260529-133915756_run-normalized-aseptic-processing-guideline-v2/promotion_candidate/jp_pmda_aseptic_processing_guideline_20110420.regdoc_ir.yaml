        text: 容器または栓の欠陥は完全性が失われる要因になるため，日常の管理試験又は全数検査により確認し，非無菌となるリスクの大きな製品が出荷されないように安全策を講じること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3444
        - source_label: PMDA aseptic processing guideline
          locator: line:3445
        children: []
      - nid: chaa6.pa6_3_1.i3
        kind: item
        kind_raw: ３）
        num: '3'
        ord: 1091
        heading: null
        text: ガラスまたはプラスチックアンプルなど，熔閉した容器は全数完全性試験を実施すること．他の容器は適切な手順で完全性についてチェックすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3446
        - source_label: PMDA aseptic processing guideline
          locator: line:3447
        children: []
      - nid: chaa6.pa6_3_1.i4
        kind: item
        kind_raw: ４）
        num: '4'
        ord: 1092
        heading: null
        text: 容器の完全性は，使用に至るまで保持されており，製品の無菌性が保たれていることを保証すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3448
        - source_label: PMDA aseptic processing guideline
          locator: line:3449
        children: []
      - nid: chaa6.pa6_3_1.i5
        kind: item
        kind_raw: ５）
        num: '5'
        ord: 1093
        heading: null
        text: 完全性試験の方法は，容器と栓に対応して適切に定めること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3450
        children: []
    - nid: chaa6.pa6_3_2
      kind: paragraph
      kind_raw: A6.3.2
      num: A6.3.2
      ord: 1094
      heading: null
      text: バリデーション
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:3453
      children:
      - nid: chaa6.pa6_3_2.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 1095
        heading: null
        text: 採用した容器完全性試験については，適切な試験法バリデーションを実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3454
        children: []
      - nid: chaa6.pa6_3_2.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 1096
        heading: null
        text: 容器完全性試験を実施する際は，製品の保管温度の変動，包装，輸送の際の振動及び衝撃，空輸の際の気圧変動等を可能な限り考慮すること．そのチャレンジテストの条件の根拠を文書化すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3455
        - source_label: PMDA aseptic processing guideline
          locator: line:3456
        - source_label: PMDA aseptic processing guideline
          locator: line:3457
        children: []
    - nid: chaa6.pa6_4
      kind: paragraph
      kind_raw: A6.4
      num: A6.4
      ord: 1097
      heading: null
      text: 外観検査
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:3460
      children: []
    - nid: chaa6.pa6_4_1
      kind: paragraph
      kind_raw: A6.4.1
      num: A6.4.1
      ord: 1098
      heading: null
      text: 一般要件
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:3461
      children:
      - nid: chaa6.pa6_4_1.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 1099
        heading: null
        text: 外観検査により容器完全性不適合の製品を取り除いて無菌性を保証する場合は，外観と容器完全性の対応関係を適切に定めた検査標準を確立すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3462
        - source_label: PMDA aseptic processing guideline
          locator: line:3463
        children: []
      - nid: chaa6.pa6_4_1.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 1100
        heading: null
        text: 検査条件は，製品の特性を考慮し，製剤毎に最適化すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3464
        children: []
      - nid: chaa6.pa6_4_1.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 1101
        heading: null
        text: 異物検査の基準は日局に準拠すること．その基準である「たやすく検出される異物/明らかに検出される異物」を製剤の特性や異物の種類毎に定義すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3465
        - source_label: PMDA aseptic processing guideline
          locator: line:3469
        children: []
      - nid: chaa6.pa6_4_1.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 1102
        heading: null
        text: 製造工程では全数検査を行い，「たやすく検出される異物/明らかに検出される異物」が混入した製品を除去すること．全数検査の後，必要に応じて目視による抜取検査を行うこと．抜取検査ではバッチサイズを考慮した統計的に意義があるサンプルサイズ（例えば，AQL抜取方法を参考にする）で評価すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3470
        - source_label: PMDA aseptic processing guideline
          locator: line:3471
        - source_label: PMDA aseptic processing guideline
          locator: line:3472
        - source_label: PMDA aseptic processing guideline
          locator: line:3473
        children: []
      - nid: chaa6.pa6_4_1.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 1103
        heading: null
        text: 検査作業手順書に検査方法を定めること．人による目視検査においては，例えば次のような条件を定める．なお，製造工程で目視により全数検査を実施する場合，「たやすく検出される異物/明らかに検出される異物」が除去できるように製剤毎に検査精度が保証できる所要時間，照度などの検査条件を最適化し，規定すること．全数検査後に抜取検査，品質試験を行う場合，検査位置の照度は2000-3750lx，単位検査対象当たりの所要時間は白及び黒の背景で5秒ずつとする．これ以上の照度及び所要時間を採用することもできる．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:3474
        - source_label: PMDA aseptic processing guideline
          locator: line:3475
        - source_label: PMDA aseptic processing guideline
          locator: line:3479
        - source_label: PMDA aseptic processing guideline
          locator: line:3480
        - source_label: PMDA aseptic processing guideline
          locator: line:3481
        - source_label: PMDA aseptic processing guideline
          locator: line:3482
        - source_label: PMDA aseptic processing guideline
          locator: line:3483
