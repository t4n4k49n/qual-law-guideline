          kind: item
          kind_raw: 2)
          num: '2'
          ord: 718
          heading: null
          text: 除染剤は，アイソレータシステムの材質，アイソレータ内においての作業内容，アイソレータ内部に持ち込む資材等の量及び形態，アイソレータ内部のバイオバーデン等を考慮して選定すること．除染剤は，過酸化水素のほか，過酢酸，オゾン，二酸化塩素等である．
