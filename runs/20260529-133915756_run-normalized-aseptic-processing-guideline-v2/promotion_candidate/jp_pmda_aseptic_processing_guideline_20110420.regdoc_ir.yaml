        - nid: cha8.sec8_1.i9.si6
          kind: subitem
          kind_raw: ⑥
          num: '6'
          ord: 235
          heading: null
          text: 洗浄剤及び消毒剤は，それを適用する表面への性質（腐食性など）を考慮して決定すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:995
          - source_label: PMDA aseptic processing guideline
            locator: line:996
          children: []
      - nid: cha8.sec8_1.i10
        kind: item
        kind_raw: 10)
        num: '10'
        ord: 236
        heading: null
        text: 無菌医薬品に係る製品の作業所において殺芽胞剤又は殺胞子剤を非定常的に使用する可能性がある場合においては，使用する薬品の種類，使用濃度，適用方法等をあらかじめ文書で定めておくこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
