        - nid: cha19.sec19_1.p19_1_3.i3
          kind: item
          kind_raw: 3)
          num: '3'
          ord: 702
          heading: null
          text: 空気の流速及び気流パターンは，アイソレータシステムの内部における作業内容に適した清浄環境を維持するために十分なものであること．
          role: normative
