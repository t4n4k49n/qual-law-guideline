          ord: 899
          heading: null
          text: ユースポイントに滅菌フィルターを取り付けることは，設備中の微生物汚染モニタリングを困難なものとし，フィルターに捕捉された微生物や，フィルター部分で増殖した死骸からエンドトキシンが放出されることから，原則として行わないこと．やむを得ずこのような滅菌フィルターの取付けを行うときは，当該滅菌フィルターの殺菌・滅菌や交換頻度を，バリデーションを実施して定めること．なお，供給ループ中にはフィルターを設置しないことが望ましい．
