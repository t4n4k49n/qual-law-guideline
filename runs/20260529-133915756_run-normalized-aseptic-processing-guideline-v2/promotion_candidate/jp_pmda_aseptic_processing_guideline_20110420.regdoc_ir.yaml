          locator: line:1010
        - source_label: PMDA aseptic processing guideline
          locator: line:1011
        children: []
      - nid: cha8.sec8_2.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 242
        heading: null
        text: 消毒剤の有効性は，環境モニタリングプログラムの中で表面から採取される微生物数を規格値の範囲内で管理する観点から評価を行うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
