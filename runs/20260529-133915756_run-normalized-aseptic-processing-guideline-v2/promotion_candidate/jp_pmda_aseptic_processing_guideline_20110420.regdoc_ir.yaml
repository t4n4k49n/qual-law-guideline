          kind_raw: 1)
          num: '1'
          ord: 183
          heading: null
          text: 重要区域は，滅菌された製品等及び資材並びにこれらと直接接触する面が環境に曝露される製造作業を行う区域である．本区域は，製品への汚染リスクを高いレベルで防ぎ，製品の無菌性が維持できるように設計されなければならない．充てん前の無菌作業(無菌接続，無菌原料の添加など)，無菌充てん，容器閉そくなどの製造工程は，この区域で行われる．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
