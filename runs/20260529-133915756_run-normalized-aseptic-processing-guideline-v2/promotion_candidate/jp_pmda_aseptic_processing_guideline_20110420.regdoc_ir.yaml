    num: '4'
    ord: 79
    heading: 職員
    text: 人は無菌操作区域における最大の微生物汚染源であるので，無菌操作法による無菌医薬品に係る製品の作業所においては，無菌操作における人の介在を可能な限り尐なくし，それによって人に起因する汚染を排除することが重要である．無菌医薬品に係る製品の製造に従事する職員には，その業務を行うために必要な考え方，及び実際の作業内容に関する手順について教育訓練を行うことにより，その能力及びモラルを維持すること．また，アイソレータ，ブローフィルシール等，人の介在による微生物汚染を低減する設備を運用する場合には，職員に対してその装置の特性と維持点検など，装置操作や維持・点検管理に関する教育訓練が重要となることを考慮すること．
