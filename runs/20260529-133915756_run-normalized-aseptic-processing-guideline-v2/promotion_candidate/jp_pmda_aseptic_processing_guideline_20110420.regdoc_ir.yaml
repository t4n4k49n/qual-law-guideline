          num: '2'
          ord: 201
          heading: null
          text: 無菌操作区域とその他の支援区域との間にはエアロックを設け，室間差圧及び気流の逆転が起きないよう，十分な差圧を設けること．扉を閉じた状態で10～15Pa又はそれ以上の差圧を維持することが望ましい．当該エアロックの設計は，6.1 26)更衣室に準じる．その他の支援区域内においても空気の清浄度レベルの異なる区域の間には，適切な差圧を設けること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
