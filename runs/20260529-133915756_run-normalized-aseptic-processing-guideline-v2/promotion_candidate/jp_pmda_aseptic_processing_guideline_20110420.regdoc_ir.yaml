        ord: 155
        heading: null
        text: 注射剤とその他の無菌製剤を同一作業室で製造する場合においては，注射剤の調製，充てん，又は閉そく作業を行う製造設備は専用かつ閉鎖式とし，構造上開放される箇所は汚染を防止する処置を施すこと．
