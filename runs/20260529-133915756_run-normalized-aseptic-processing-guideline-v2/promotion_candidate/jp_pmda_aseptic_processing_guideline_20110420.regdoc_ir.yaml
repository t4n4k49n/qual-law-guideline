        ord: 843
        heading: null
        text: 細胞培養及び発酵に係る装置は，使用後には清浄化し滅菌すること．クラシカル工程用の発酵装置は適切に清浄化し消毒すること．遺伝子組み換え技術によって構築された微生物若しくは細胞を微生物等安全管理区域外に移送（廃棄を含む）する場合は，遺伝子組換え生物の使用等の規制による生物の多様性の確保に関する法律（カルタヘナ法）に従い事前にバリデートされた方法にて不活性化処理後に実施するものとし，培養又は発酵終了後の細胞に対し完全なる不活性化処理が適切に行われたことを毎回確認すること．細胞培養装置及び発酵装置の洗浄については被洗浄物の特性を考慮した洗浄方法を設定すること．CIP，SIP等のほかに，設備の構造に応じて，分解洗浄，手洗浄等も必要に応じて行うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
