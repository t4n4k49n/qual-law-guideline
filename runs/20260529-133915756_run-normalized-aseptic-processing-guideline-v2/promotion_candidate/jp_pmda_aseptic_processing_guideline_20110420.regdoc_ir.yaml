        text: ブローフィルシールの範囲及び対象工程ブローフィルシールによって製造する無菌医薬品に係る製品の製造工程へのこの指針の適用については，充てん及び熔閉の後に滅菌（高圧蒸気滅菌等）のない製造工程であって，液状医薬品に係る製品の製造においては薬液の除菌ろ過以後，プラスチックの供給，容器の成型及び充てんを経て閉そくまで，粉末医薬品に係る製品の製造においては無菌粉末の供給，プラスチックの供給，容器の成型及び充てんを経て閉そくまでを対象とする．これに関係した工程のうち，特に留意すべき事項は以下のとおりである．
