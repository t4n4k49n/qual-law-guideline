        text: 環境モニタリングプログラム作成環境モニタリングプログラムは稼働性能適格性評価の実施に先立ち策定し，稼働性能適格性評価終了後に最終版とする．この最終版とは，稼働性能適格性評価で設定した環境モニタリングプログラムを再度評価し，日常的な管理プログラムの手順書に定め運用に移行することをいう．稼働性能適格性評価においてはワーストケースの設定も含むため，試料採取箇所及び測定頻度は多くなりがちであるが，稼働性能適格性評価の終了後に日常管理として制定するプログラムにおいては簡略化も可能である．また，アイソレータ，ＲＡＢＳ，ブローフィルシールなど，無菌汚染リスクの堅牢な設備を採用している場合，設備の適切な定期・非定期の点検整備監視により，微生物測定を簡略化も可能である．また，ISO DIS 14644-1に掲載されているサンプリングポイント数など，ＩＳＯ規格に掲載されている情報を参考にしてもよい．
