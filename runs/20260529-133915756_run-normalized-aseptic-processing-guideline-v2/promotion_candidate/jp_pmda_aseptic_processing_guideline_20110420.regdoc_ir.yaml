            ord: 614
            heading: null
            text: チャレンジ溶液試験に用いる溶液は実際にろ過滅菌される製品であること．製品の抗菌性等のためにチャレンジテスト溶液を改変する場合においても，製品とフィルターとの適合性を確認するために，実際にろ過滅菌される製品溶液を用いて実工程のワーストケースをシミュレートしたろ過を実施し，その後，改変した条件においてのチャレンジテストを実施すること．
