        - nid: cha19.sec19_1.p19_1_3.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 703
          heading: null
          text: アイソレータ設備の内部の空気の循環は，HEPA規格以上のフィルターを介して行うこと．アイソレータの外部との吸排気もHEPA規格以上のフィルターを通すこと．
          role: normative
