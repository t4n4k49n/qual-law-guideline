        ord: 656
        heading: null
        text: 凍結乾燥中の無菌性の保持のために，減圧下の庫内への外部空気（例．機械室等）の浸入は極限まで抑制されなければならない．さらに，このためのリーク試験法及び復圧フィルター又は真空度を制御するためのリークフィルターの完全性を保証する確認基準を定めておくこと．
