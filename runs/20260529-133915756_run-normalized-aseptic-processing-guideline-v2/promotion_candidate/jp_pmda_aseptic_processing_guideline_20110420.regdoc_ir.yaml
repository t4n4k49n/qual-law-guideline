      text: リスクコントロールリスクアセスメントの結果，リスクが受容されないと判断された場合は，リスクが受容されるために適切な方策が講じなければならない．そのためには様々な方策が考えられるが，基本的には，以下の優先順序を基本として採用されるべきである．すなわち，高活性（ケミカルハザード）を持つ化学物質では，その残留が管理できない領域や除染が困難な領域に，拡散させないことが基本となる．また，こうした方策を検討する中で，洗浄バリデーションに裏打ちされた洗浄方法の確立が困難な場合や，非製品接触部への化学物質の移送や飛散が他の製品に混入するリスクが受容されない場合には，専用設備の導入を検討することになる．
      role: normative
      normativity: must
