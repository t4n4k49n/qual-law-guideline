        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:659
      children:
      - nid: cha5.sec5_1.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 127
        heading: null
        text: 職員は，無菌医薬品に係る製品の作業所に入る前に，靴を含む専用の作業衣等を着用すること．無菌操作区域での基本衣類は，滅菌あるいは消毒された衣服，靴，オーバーシューズ，手袋，ゴーグル，マスクであり，更に汚染低減のために，清潔なインナーウエアや手袋の二重化も適宜検討すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:660
        - source_label: PMDA aseptic processing guideline
          locator: line:661
        - source_label: PMDA aseptic processing guideline
          locator: line:662
        - source_label: PMDA aseptic processing guideline
          locator: line:663
        children: []
      - nid: cha5.sec5_1.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 128
        heading: null
        text: 無菌操作区域に係る更衣室においては，脱衣と着衣区域を適切に区分することが望ましい．なお，無菌医薬品に係る製品の作業所の更衣室には更衣手順等のイラスト表示や，無菌衣着用後の状態を確認できるようにする設備を設置することが望ましい．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:664
        - source_label: PMDA aseptic processing guideline
          locator: line:665
        - source_label: PMDA aseptic processing guideline
          locator: line:666
        children: []
      - nid: cha5.sec5_1.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 129
        heading: null
        text: 無菌医薬品に係る製品の作業所において着用する作業衣等は，作業性やその周辺環境への発塵防止に優れているものを選定すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:667
        - source_label: PMDA aseptic processing guideline
          locator: line:668
        children: []
      - nid: cha5.sec5_1.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 130
        heading: null
        text: 無菌操作区域に入る職員は，体表面がその環境に直接に露出しないようにすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:669
        children: []
      - nid: cha5.sec5_1.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 131
        heading: null
        text: 作業衣等については，その交換頻度，滅菌の方法及び条件等の管理基準を設定し管理すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:670
        - source_label: PMDA aseptic processing guideline
          locator: line:671
        children: []
      - nid: cha5.sec5_1.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 132
        heading: null
        text: 無菌操作区域において着用する無菌作業衣等は，原則として入室の都度交換すること．滅菌又は適切な消毒を行わずに再着用する場合においては，その使用の妥当性を立証するデータを有していること．ただし，この場合においても，一作業日を超えた無菌作業衣等及び微生物汚染に関する検査をした後の衣服は，滅菌を行わずに再使用しないこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:672
        - source_label: PMDA aseptic processing guideline
          locator: line:673
        - source_label: PMDA aseptic processing guideline
          locator: line:674
        - source_label: PMDA aseptic processing guideline
          locator: line:675
        children: []
      - nid: cha5.sec5_1.i7
        kind: item
        kind_raw: 7)
        num: '7'
        ord: 133
        heading: null
        text: 更衣は段階的に清浄な状態にするため，専用のインナーなどを中間的に着衣，あるいはオーバーガウン方式（肌の露出を抑える重ね着）などを採用することを推奨する．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:676
        - source_label: PMDA aseptic processing guideline
          locator: line:677
        children: []
    - nid: cha5.sec5_2
      kind: section
      kind_raw: ５．２
      num: '5.2'
      ord: 134
      heading: 無菌作業要件
      text: null
      role: structural
      normativity: null
      tags: []
