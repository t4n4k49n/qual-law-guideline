        text: 無菌充てんにおいて，充てん，打栓，凍結乾燥等の無菌医薬品の製造工程や，無菌ろ過された製品が直接接触する滅菌済み容器等（栓を含む）が環境に曝露される作業については，重要区域（グレードA）において行うものとすること．キャップの巻締め工程を無菌操作区域以外で実施する場合は，打栓されたバイアルが重要区域（グレードA）から搬出された後，巻締めが完了するまではグレードＡの空気を供給することで保護されなければならない．キャップの巻締めは，その製品の容器-栓密封完全性に基づく汚染リスクに応じてグレードＣ以上の清浄度レベル区域に於いて行い，微生物汚染リスクまたは巻締め時に発生する微粒子などの汚染リスクに応じて補足的な措置を採ること．また，打栓を行う場所と巻締めを行う場所との距離及び打栓から巻締めまでにかかる時間については，可能な限り短くすること．
