        kind: item
        kind_raw: 4)
        num: '4'
        ord: 842
        heading: null
        text: パーフュージョンなど培養槽中に連続的に培地を供給し，かつ連続的に培養液を排出させる連続培養装置方式を用いる場合においては，培養期間中の当該培養槽における連続培養が汚染等による製品品質への悪影響をもたらさない条件で実施できることを保証するために必要な措置を採ること．
