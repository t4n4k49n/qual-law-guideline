        heading: null
        text: モニタリングの警報基準値及び処置基準値モニタリングの対象物及び箇所について警報基準値及び置基準値を設定すること．(ア)処置基準値の設定に際しては表３を参考にしてもよい．ただし，平均化により，汚染リスクを過小評価しないこと．グレードAで菌を検出した場合，許容基準値であっても製品への影響を評価する．(イ)警報基準値は稼働性能適格性評価の結果に基づき設定する．(ウ)設定基準値に達した場合においての原因究明の必要性の調査，製造停止等採るべき措置について定めておくこと．原則として，警報基準値からの逸脱は，製造を中止する必要はないが，必要な措置及び対策を講じる．処置基準値からの逸脱は，該当箇所に関連する製造工程において製造された製品の出荷前に原因の究明を行う．また，必要に応じて是正措置及び回復の検証を行う．この回復の検証は，微粒子のように即座に測定し判断可能なものもあるが，職員の付着菌のように再現性が得られない場合もある，その場合は，一定期間の入室禁止や再教育，あるいは作業内容の見直しなど，措置も含めた総合的要素により回復とする判断を行う．
        role: normative
        normativity: must
