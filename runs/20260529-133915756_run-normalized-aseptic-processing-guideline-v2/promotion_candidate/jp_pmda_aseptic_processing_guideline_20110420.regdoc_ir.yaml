          kind: subitem
          kind_raw: ①
          num: '1'
          ord: 679
          heading: null
          text: 凍結乾燥時のロット毎のリーク試験．凍結乾燥終了時のリーク試験において，簡潔に測定記録をとる．
          role: normative
