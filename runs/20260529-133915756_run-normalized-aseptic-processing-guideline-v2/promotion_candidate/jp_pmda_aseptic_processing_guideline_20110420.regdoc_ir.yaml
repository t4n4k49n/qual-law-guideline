          kind: item
          kind_raw: 2)
          num: '2'
          ord: 184
          heading: null
          text: 重要区域は，作業時及び非作業時ともに，空気１m3当たりに含まれる粒径0.5μm以上の浮遊微粒子数が3,520個以下であること．この空気の品質は，汎用されている現行の国内及び国際的な空気の品質に関する基準においてグレードA，クラス100又はISO 5と称される区分に相当する．
          role: normative
          normativity: must
          tags: []
          refs:
