    children:
    - nid: cha12.sec12_1
      kind: section
      kind_raw: １２．１
      num: '12.1'
      ord: 357
      heading: 一般要件
      text: null
      role: structural
      normativity: null
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: PMDA aseptic processing guideline
        locator: line:1337
      children:
      - nid: cha12.sec12_1.i1
        kind: item
        kind_raw: 1)
        num: '1'
        ord: 358
        heading: null
        text: この項において「製造設備」とは，無菌製品に係る製品の製造に用いる滅菌装置，ろ過装置，充てん装置，打栓装置，凍結乾燥装置，密封装置等無菌操作区域に設置するもののほか，空調設備（HVACシステム），培養装置，発酵装置，洗浄装置等その他の支援区域に設置する設備をいう．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1338
        - source_label: PMDA aseptic processing guideline
          locator: line:1339
        - source_label: PMDA aseptic processing guideline
          locator: line:1340
        - source_label: PMDA aseptic processing guideline
          locator: line:1341
        children: []
      - nid: cha12.sec12_1.i2
        kind: item
        kind_raw: 2)
        num: '2'
        ord: 359
        heading: null
        text: この項において「ユーティリティ」とは，無菌製品に係る製品の製造に用いる各種用水，ピュアスチーム，圧縮空気，各種ガス類等を供給する設備をいう．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1342
        - source_label: PMDA aseptic processing guideline
          locator: line:1343
        children: []
      - nid: cha12.sec12_1.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 360
        heading: null
        text: 製造設備及びユーティリティの適格性評価のため，責任の割当てその他必要な事項について，計画書及び手順書を作成すること．製造設備及びユーティリティは，無菌製品に係る製品の無菌性に及ぼす影響を最小のものとするように設計すること．製造設備及びユーティリティの形状及び材質は，清浄化，消毒，滅菌及び維持管理を実施することが容易なものとすること．無菌の製品等，資材，水，蒸気，ガス等が直接曝露する表面には特に注意を払うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1344
        - source_label: PMDA aseptic processing guideline
          locator: line:1345
        - source_label: PMDA aseptic processing guideline
          locator: line:1346
        - source_label: PMDA aseptic processing guideline
          locator: line:1347
        - source_label: PMDA aseptic processing guideline
          locator: line:1348
        children: []
      - nid: cha12.sec12_1.i4
        kind: item
        kind_raw: 4)
        num: '4'
        ord: 361
        heading: null
        text: 人の動線及び気流パターンなどを考慮して，無菌製品，無菌原料及び無菌資材の動線を適切なものとすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1349
        - source_label: PMDA aseptic processing guideline
          locator: line:1350
        children: []
      - nid: cha12.sec12_1.i5
        kind: item
        kind_raw: 5)
        num: '5'
        ord: 362
        heading: null
        text: 職員の動き及び無菌製品に係る製品への介入を最小のものとすること．また機器の運転，保全，修理，調整などは，可能な限り重要区域の外から行えるように考慮すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1351
        - source_label: PMDA aseptic processing guideline
          locator: line:1352
        children: []
      - nid: cha12.sec12_1.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 363
        heading: null
        text: 重要区域においては，乱流の発生及び発塵を最小のものとすること．直接支援区域及びその他の支援区域においては，室内の清浄空気の給気口から換気口及び排気口への流れに配慮すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1353
        - source_label: PMDA aseptic processing guideline
          locator: line:1356
        - source_label: PMDA aseptic processing guideline
          locator: line:1357
        children: []
      - nid: cha12.sec12_1.i7
        kind: item
        kind_raw: 7)
        num: '7'
        ord: 364
        heading: null
        text: 職員への負担を軽減するよう設備を配置すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1358
        children: []
      - nid: cha12.sec12_1.i8
        kind: item
        kind_raw: 8)
        num: '8'
        ord: 365
        heading: null
        text: 製造設備及びユーティリティは，その要求される品質水準，生産時の使用量に対する設備能力，適用される法的要件（法令及びガイドラインなど），使用する材質や機能などの要求仕様を明確にした文書（ユーザー要求仕様書；URS）を作成し，それとともに設計時適格性評価を行うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1359
        - source_label: PMDA aseptic processing guideline
          locator: line:1360
        - source_label: PMDA aseptic processing guideline
          locator: line:1361
        - source_label: PMDA aseptic processing guideline
          locator: line:1362
        children: []
      - nid: cha12.sec12_1.i9
        kind: item
        kind_raw: 9)
        num: '9'
        ord: 366
        heading: null
        text: 無菌製品及び無菌製品と接触する機器の表面や開口している製品容器の重要区域への曝露は，必要とする最小限の時間とすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1363
        - source_label: PMDA aseptic processing guideline
          locator: line:1364
        children: []
      - nid: cha12.sec12_1.i10
        kind: item
        kind_raw: 10)
        num: '10'
        ord: 367
        heading: null
        text: 設備据付時適格性評価は，文書化した手順に従って，製造設備及びユーティリティが設計仕様に基づいて設置されていることを確認すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1365
        - source_label: PMDA aseptic processing guideline
          locator: line:1366
        children: []
      - nid: cha12.sec12_1.i11
        kind: item
        kind_raw: 11)
        num: '11'
        ord: 368
        heading: null
        text: 運転時適格性評価は，製造設備及びユーティリティが設計仕様のとおりの機能を有することを確認すること．製造設備及びユーティリティを無菌操作区域で運転する場合，その規定された清浄度が維持されることを確認すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1367
        - source_label: PMDA aseptic processing guideline
          locator: line:1368
        - source_label: PMDA aseptic processing guideline
          locator: line:1369
        children: []
      - nid: cha12.sec12_1.i12
        kind: item
        kind_raw: 12)
        num: '12'
        ord: 369
        heading: null
        text: 無菌操作区域において行われる無菌製品に係る製品の無菌性に影響を及ぼす全ての工程について，その影響を科学的に評価し，当該工程に係るバリデーションを適切に実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1370
        - source_label: PMDA aseptic processing guideline
          locator: line:1371
        - source_label: PMDA aseptic processing guideline
          locator: line:1372
        children: []
      - nid: cha12.sec12_1.i13
        kind: item
        kind_raw: 13)
        num: '13'
        ord: 370
        heading: null
        text: 全ての重要設備の操作手順，並びに管理パラメータとその許容範囲は，手順書に適切に記載すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1373
        - source_label: PMDA aseptic processing guideline
          locator: line:1374
        children: []
      - nid: cha12.sec12_1.i14
        kind: item
        kind_raw: 14)
        num: '14'
        ord: 371
        heading: null
        text: 洗浄装置，滅菌装置，培養装置，発酵装置，ろ過装置，充てん装置，打栓装置，凍結乾燥装置，密閉装置等に係る工程のバリデーションにおいては，当該工程における無菌製品に係る製品の無菌性保証レベルを評価すること．連続した工程に係る複数の装置については，これらをまとめて評価しても差し支えない．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1375
        - source_label: PMDA aseptic processing guideline
          locator: line:1376
        - source_label: PMDA aseptic processing guideline
          locator: line:1377
        - source_label: PMDA aseptic processing guideline
          locator: line:1378
        children: []
      - nid: cha12.sec12_1.i15
        kind: item
        kind_raw: 15)
        num: '15'
        ord: 372
        heading: null
        text: 無菌製品に係る製品に直接的に接触する設備の表面の滅菌についてバリデーションを実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1379
        - source_label: PMDA aseptic processing guideline
          locator: line:1380
        children: []
      - nid: cha12.sec12_1.i16
        kind: item
        kind_raw: 16)
        num: '16'
        ord: 373
        heading: null
        text: 精製水，注射用水，圧縮空気その他のガス，ピュアスチーム等を供給する構造設備，CIP/SIPシステム等ユーティリティに係る適格性評価を実施すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1381
        - source_label: PMDA aseptic processing guideline
          locator: line:1382
        children: []
      - nid: cha12.sec12_1.i17
        kind: item
        kind_raw: 17)
        num: '17'
        ord: 374
        heading: null
        text: 無菌製品に係る製品の無菌性を保証するために，滅菌済みの製造設備の使用期限を設定すること．また、重要な工程の変更が行われる時は，その変更が設定した使用期限に及ぼす影響を評価すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1383
        - source_label: PMDA aseptic processing guideline
          locator: line:1384
        - source_label: PMDA aseptic processing guideline
          locator: line:1385
        children: []
      - nid: cha12.sec12_1.i18
        kind: item
        kind_raw: 18)
        num: '18'
        ord: 375
        heading: null
        text: 無菌操作法による無菌製品の製造で適用される設計概念は多様であることから，無菌性保証を高める他の適切な技術もまた適用すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1386
        - source_label: PMDA aseptic processing guideline
          locator: line:1387
        children: []
      - nid: cha12.sec12_1.i19
        kind: item
        kind_raw: 19)
        num: '19'
        ord: 376
        heading: null
        text: 連続式の滅菌装置については，コンベアベルトが無菌操作区域とこれより環境グレードの低い区域を行き来することがあってはならない．ただし，ベルト自体が常時滅菌される場合（トンネル式乾熱滅菌機など）はこの限りではない．また，非無菌側の空気が滅菌ゾーンに流入しないことを適切な方法により常時監視すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:1388
        - source_label: PMDA aseptic processing guideline
          locator: line:1389
        - source_label: PMDA aseptic processing guideline
          locator: line:1390
        - source_label: PMDA aseptic processing guideline
          locator: line:1391
        children: []
