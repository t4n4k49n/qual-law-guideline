          locator: line:1002
        - source_label: PMDA aseptic processing guideline
          locator: line:1003
        - source_label: PMDA aseptic processing guideline
          locator: line:1004
        - source_label: PMDA aseptic processing guideline
          locator: line:1005
        children: []
