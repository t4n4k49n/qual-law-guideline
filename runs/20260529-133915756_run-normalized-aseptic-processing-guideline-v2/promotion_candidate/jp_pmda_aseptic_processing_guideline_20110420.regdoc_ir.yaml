          kind_raw: 11)
          num: '11'
          ord: 453
          heading: null
          text: 滅菌装置の構造を変更した場合，滅菌対象物の載荷条件を変更した場合，ユーティリティの供給条件が変わった場合は再度，滅菌バリデーションをやり直すこと．再バリデーションの範囲や回数については，製品の無菌性保証に対するリスクに応じて適切に定めること．
