          heading: null
          text: フィルター器具の滅菌操作ろ過滅菌に係る一連の操作を確立すること．フィルターが確実に滅菌されることのほか，その滅菌によってフィルターが損傷を受けないことを確認すること．多数回滅菌を実施する場合においては，適用する滅菌条件においての累積滅菌時間の許容限界を定めておくこと．フィルターの代表的な滅菌手法には，高圧蒸気滅菌，ガス滅菌及び放射線滅菌がある．
          role: normative
