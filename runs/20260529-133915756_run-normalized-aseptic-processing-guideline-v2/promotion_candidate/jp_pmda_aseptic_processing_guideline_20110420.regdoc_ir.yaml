        - nid: cha11.sec11_1.i7.si2
          kind: subitem
          kind_raw: ②
          num: '2'
          ord: 323
          heading: null
          text: 浮遊微生物のサンプリングには落下法，衝突法又はろ過法，表面付着微生物のサンプリングにはコンタクトプレート法，拭取り法等適切な方法を１つ又は複数用いる．表面付着微生物のサンプリングの対象とする面積は採取する対象物の形状や状態により適宜選定すべきであり，原則として装置，器具等の表面のサンプリング対象面積は24～30cmとする．浮遊菌数測定のサンプリング量は，モニタリング対象区域の清浄度やモニタリング頻度などの総合的な根拠考察により，適切なサンプリング量とする．グレードAでは，浮遊菌の1回のサンプリング量は１m３とする．落下菌の測定は通例，直径90mmのプレートを用い，最大曝露時間は4時間とする．
          role: normative
