      text: 無菌医薬品に係る製品を製造するための清浄区域は無菌操作区域（重要区域及び直接支援区域）とその他の支援区域に分類される．これらの清浄区域に係る構造設備の設計において考慮しなければならない一般要件を示す．
      role: structural
      normativity: null
