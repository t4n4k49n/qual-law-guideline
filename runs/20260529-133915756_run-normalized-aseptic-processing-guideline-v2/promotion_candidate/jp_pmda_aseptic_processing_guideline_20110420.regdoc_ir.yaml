          heading: null
          text: 滅菌操作ガスフィルターは一般に多数回使用するため，適用する滅菌条件においての累積滅菌時間の許容限界を定めておくこと．フィルターの代表的な滅菌手法には，定置滅菌（SIP）又はオートクレーブによる蒸気滅菌，ガス滅菌及び放射線滅菌がある． 蒸気滅菌においては，フィルターに水が残存しろ過流量の低下が生じないよう十分な時間をかけて乾燥を行う必要があるが，細菌の増殖を防ぐため乾燥を短時間で済ませるような操作とすること．
