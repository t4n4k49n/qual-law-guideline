          locator: line:1018
        - source_label: PMDA aseptic processing guideline
          locator: line:1019
        - source_label: PMDA aseptic processing guideline
          locator: line:1020
        - source_label: PMDA aseptic processing guideline
          locator: line:1021
        children: []
      - nid: cha8.sec8_3.i3
        kind: item
        kind_raw: 3)
        num: '3'
        ord: 246
        heading: null
        text: 使用薬品の種類及び濃度での実効性が疑われる場合においては，例えば消毒前後の微生物の種類及び菌数の減尐を調査する等再評価を行うこと．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
