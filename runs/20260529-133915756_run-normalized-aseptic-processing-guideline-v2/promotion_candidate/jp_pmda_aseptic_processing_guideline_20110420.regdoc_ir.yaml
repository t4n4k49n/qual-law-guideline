        kind: item
        kind_raw: ７）
        num: '7'
        ord: 1111
        heading: null
        text: 検査の判定に使用する限度見本を作成する場合，そのサンプルについて品質部門の承認を受けること．また，限度見本は経時的な劣化・変質が発生するため，有効期限の設定を行うか，定期的な品質確認を行うこと．
