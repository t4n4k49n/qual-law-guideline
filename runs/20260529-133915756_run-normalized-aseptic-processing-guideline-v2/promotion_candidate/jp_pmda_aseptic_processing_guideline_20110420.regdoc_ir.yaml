      num: A2.3.5
      ord: 926
      heading: null
      text: 微生物モニタリングプログラム製薬用水設備の微生物モニタリングプログラムの主な目的は，製造した水の微生物学的品質の悪化を事前に把握し，製薬用水製造システムの機能的恒常性を維持することで，製造する製薬用水の品質を維持し，製品の品質に悪影響を及ぼすことを防ぐことである．微生物を適正なレベルに管理するためには，菌数のみならず出現菌種の把握を行うと共に，データの傾向分析を用いる．存在する微生物の全てを検出する必要はないが，成長の遅い微生物を含め可能な限り広範囲の微生物を検出することができるようなモニタリング手法を採用する．製薬用水の微生物限度値は日本薬局方参考情報に示された基準等を参考に適切に定める．バリデーションの実施中又は日常管理において，処置基準値を超えた場合は，検出された菌の同定あるいは性状検査を行う．特定の菌が多く検出されるようになった場合は，製薬用水設備中にバイオフィルムが形成されている可能性があるので，設備の滅菌あるいはサニタイゼーションを実施する．
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
