        ord: 156
        heading: null
        text: 調製，充てん又は閉そく作業を行う作業室は，無菌製剤及び無菌原薬を除く他の医薬品に係る製品の作業所と区別すること．ただし，無菌製剤が汚染される恐れがない場合においては，この限りでない．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:733
        - source_label: PMDA aseptic processing guideline
          locator: line:734
        - source_label: PMDA aseptic processing guideline
          locator: line:735
        children: []
      - nid: cha6.sec6_1.i15
        kind: item
        kind_raw: 15）
        num: '15'
        ord: 157
        heading: null
        text: 生理活性の高い物質や病原性物質，高毒性物質，放射性物質，生ウイルス，微生物等を取り扱う場合には交叉汚染等のリスクに応じた適切な構造設備を考慮すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:736
        - source_label: PMDA aseptic processing guideline
          locator: line:737
        children: []
      - nid: cha6.sec6_1.i16
        kind: item
        kind_raw: 16）
        num: '16'
        ord: 158
        heading: null
        text: 壁，床及び天井の表面は，清掃可能で洗浄剤や消毒剤に耐える材質であること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:738
        children: []
      - nid: cha6.sec6_1.i17
        kind: item
        kind_raw: 17）
        num: '17'
        ord: 159
        heading: null
        text: 無菌操作区域には排水口や流しを設置しないこと．また，その他の支援区域のうちグレードＣに排水口を設ける場合は清掃が容易で消毒ができるトラップ及び排水の逆流を防ぐ装置を有するなど排水口からの汚染防止を考慮すること．床に溝を設ける場合は浅く，清掃が容易な構造であること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:739
        - source_label: PMDA aseptic processing guideline
          locator: line:740
        - source_label: PMDA aseptic processing guideline
          locator: line:741
        - source_label: PMDA aseptic processing guideline
          locator: line:742
        children: []
      - nid: cha6.sec6_1.i18
        kind: item
        kind_raw: 18）
        num: '18'
        ord: 160
        heading: null
        text: パイプやダクト，その他のユーティリティを設置する場合，奥まった部分及び清掃が困難な表面ができないようにすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:743
        - source_label: PMDA aseptic processing guideline
          locator: line:744
        children: []
      - nid: cha6.sec6_1.i19
        kind: item
        kind_raw: 19）
        num: '19'
        ord: 161
        heading: null
        text: 清浄区域にはそこで行われる作業に対して適切な清浄度レベルを維持するためHEPAフィルター等の適切なフィルターによりろ過した空気を供給し，適切な室間差圧を設けること．また，室間差圧が維持されていることを監視できるようにすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:745
        - source_label: PMDA aseptic processing guideline
          locator: line:746
        - source_label: PMDA aseptic processing guideline
          locator: line:747
        children: []
      - nid: cha6.sec6_1.i20
        kind: item
        kind_raw: 20）
        num: '20'
        ord: 162
        heading: null
        text: 清浄区域はそこで取り扱われる製品等及び資材の特性並びに微生物管理の観点から必要な温度及び湿度を管理できるようにすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:748
        - source_label: PMDA aseptic processing guideline
          locator: line:749
        children: []
      - nid: cha6.sec6_1.i21
        kind: item
        kind_raw: 21）
        num: '21'
        ord: 163
        heading: null
        text: 環境の温度及び湿度を定められた許容限界内に維持し，可能であれば継続的にモニタリングを行うことができるものとすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:750
        - source_label: PMDA aseptic processing guideline
          locator: line:751
        children: []
      - nid: cha6.sec6_1.i22
        kind: item
        kind_raw: 22）
        num: '22'
        ord: 164
        heading: null
        text: 清浄区域の室圧は扉などで隣接する清浄度レベルの低い区域の室圧よりも高く設定すること．ただし，封じ込め施設の場合はこの限りではない．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:752
        - source_label: PMDA aseptic processing guideline
          locator: line:753
        children: []
      - nid: cha6.sec6_1.i23
        kind: item
        kind_raw: 23）
        num: '23'
        ord: 165
        heading: null
        text: 重要区域においては製品及び重要表面の無菌性を維持するような気流パターンとすること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:754
        children: []
      - nid: cha6.sec6_1.i24
        kind: item
        kind_raw: 24）
        num: '24'
        ord: 166
        heading: null
        text: 直接支援区域と直接支援区域に隣接する区域とはエアロックにより分離すること．直接支援区域と直接支援区域に隣接する部屋との間には，滅菌済み資材，滅菌が困難な資材等の受渡し及び必要な場合においては除染作業等のためのパスルームやパスボックスを設けること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:755
        - source_label: PMDA aseptic processing guideline
          locator: line:756
        - source_label: PMDA aseptic processing guideline
          locator: line:757
        children: []
      - nid: cha6.sec6_1.i25
        kind: item
        kind_raw: 25）
        num: '25'
        ord: 167
        heading: null
        text: エアロック扉には同時に開かないような装置（機械式，電気式のほか目視又は音を利用した方法等）を備えること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:758
        - source_label: PMDA aseptic processing guideline
          locator: line:759
        children: []
      - nid: cha6.sec6_1.i26
        kind: item
        kind_raw: 26）
        num: '26'
        ord: 168
        heading: null
        text: 更衣室はエアロックの機能を設け，脱衣と着衣のエリアを物理的に分離すること．着衣を行う部屋の微粒子清浄度はその着衣により作業する部屋の微粒子清浄度（非作業時の）と同じとすること．更衣に伴う一次的な微粒子の増加を早く低減させるため，更衣室の空間体積や換気回数(回復時間)を考慮するとともに更衣室内の空気は上部から供給し下部から排気することが望ましい．パスボックス内の清浄度は使用目的に応じて決めること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:760
        - source_label: PMDA aseptic processing guideline
          locator: line:761
        - source_label: PMDA aseptic processing guideline
          locator: line:762
        - source_label: PMDA aseptic processing guideline
          locator: line:763
        - source_label: PMDA aseptic processing guideline
          locator: line:764
        children: []
      - nid: cha6.sec6_1.i27
        kind: item
        kind_raw: 27）
        num: '27'
        ord: 169
        heading: null
        text: 特に直接支援区域の更衣室は入室と退室で分けることが望ましい．ただし，入退室の時間をずらすことで対応することもできる．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:765
        - source_label: PMDA aseptic processing guideline
          locator: line:766
        children: []
      - nid: cha6.sec6_1.i28
        kind: item
        kind_raw: 28）
        num: '28'
        ord: 170
        heading: null
        text: 更衣室は，作業する部屋の清浄度に合わせ適切に設けること．同じ清浄度内でも原材料や製品などへの交叉汚染のリスクがある場合にはリスクに応じて追加の更衣室を設けることが望ましい．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:767
        - source_label: PMDA aseptic processing guideline
          locator: line:768
        - source_label: PMDA aseptic processing guideline
          locator: line:772
        children: []
      - nid: cha6.sec6_1.i29
        kind: item
        kind_raw: 29）
        num: '29'
        ord: 171
        heading: null
        text: 原料の秤量作業又は容器の洗浄作業を行う部屋は隣接する他の部屋への影響を考慮し，シール性や気流方向に注意すること．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PMDA aseptic processing guideline
          locator: line:773
        - source_label: PMDA aseptic processing guideline
          locator: line:774
        children: []
