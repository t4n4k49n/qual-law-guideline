      kind_raw: ３．３
      num: '3.3'
      ord: 78
      heading: バリデーション
      text: 無菌操作法による無菌医薬品製造は，構造物や生産設備などの各種ハードウエアと操作手法や管理によるソフトウエアの融合により達成される．製造環境適格性評価・製造設備適格性評価と工程バリデーションではその医薬品製造工程における安全性，有効性及び均質性の品質だけでなく，無菌化工程，充てん操作などの無菌操作工程，製造環境の清浄度維持，実生産製造所の構造・設備や製造工程における汚染リスクを科学的に検証し，汚染の回避を保証する必要がある．これらの無菌工程のバリデーションは，外部から供給される無菌原料や材料，及びその輸送中の保護性能も適切に範囲に含める必要がある．バリデーションで検証された運転方法や製造管理パラメータで製造工程を管理することが基本的な要求である．簡略化を行う場合には，簡略化の対象となる管理パラメータの削除や工程の時間短縮などの項目について科学的にリスクマネジメントを実施し，必要に応じて変更の再バリデーションを実施し，文書化しなければならない．
      role: structural
      normativity: null
