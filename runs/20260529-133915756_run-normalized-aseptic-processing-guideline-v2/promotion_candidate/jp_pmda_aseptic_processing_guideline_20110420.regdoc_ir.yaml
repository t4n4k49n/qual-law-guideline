          heading: null
          text: その他の支援区域は，滅菌前の製品等及び資材が，環境に曝露される製造作業を行う区域である．滅菌前の薬液の調製を行う区域や，無菌操作に使用する装置，器具等を洗浄する区域等からなる．
          role: normative
          normativity: must
          tags: []
