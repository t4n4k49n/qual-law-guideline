        heading: null
        text: 凍結乾燥工程において，バイアルにあっては半打栓，アンプルにあっては工程を通じて開口状態にあるため，充てん区域から凍結乾燥庫までの運搬中，凍結乾燥庫中，及び凍結乾燥工程の終了から密封に至るまでの間，製品を微生物汚染から防護する配慮を行うこと．
        role: normative
