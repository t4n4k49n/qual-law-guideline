        - nid: cha7.sec7_1.p7_1_3.i3
          kind: item
          kind_raw: 3)
          num: '3'
          ord: 195
          heading: null
          text: その他の支援区域に対して一般的に適用されている空気の清浄度レベルには，２つのグレードがある．一つは空気１m3当たりに含まれる粒径0.5μm以上の微粒子数が作業時において3,520,000個以下，非作業時において352,000個以下で，現行の国内及び国際的な空気の品質に関する基準においてグレードC，クラス100,000又はISO 8（作業時の基準）と称される区分に相当する．もう一つは，非作業時において，空気１m3当たりに含まれる粒径0.5μm以上の微粒子数が3,520,000個以下で，グレードDと称される区分に相当する．
          role: normative
          normativity: must
          tags: []
