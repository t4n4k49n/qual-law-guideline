      - nid: cha18.sec18_1.i6
        kind: item
        kind_raw: 6)
        num: '6'
        ord: 655
        heading: null
        text: 巻締め後の無菌性について，バリデートされた容器の完全性試験，工程内管理に係る試験検査により保証すること．アンプル等の熔閉するものについては，全数のリーク試験等を実施すること．バイアルを巻締めする場合には，栓のないバイアル又は不適切に打栓されたバイアルを取り除くこと．巻締め工程における閉栓トルク管理又は押し圧管理も有効な方法である．
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
