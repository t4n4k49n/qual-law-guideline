  - nid: cha15
    kind: chapter
    kind_raw: '1.'
    num: '15'
    ord: 529
    heading: 無菌製造設備の定置蒸気滅菌（SIP）
    text: SIPとは，装置を取り外すことなく一連の設備を滅菌する方法である．滅菌媒体として高圧飽和蒸気を用いる方法が一般的である．
    role: structural
    normativity: null
    tags: []
    refs:
      internal: []
      external: []
    source_spans:
