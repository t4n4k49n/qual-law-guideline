        - nid: cha19.sec19_2.p19_2_1.i2
          kind: item
          kind_raw: 2)
          num: '2'
          ord: 747
          heading: null
          text: RABSが設置される部屋は直接支援区域として定義し，その環境の空気の清浄度レベルは，グレードB以上とすること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2356
          - source_label: PMDA aseptic processing guideline
            locator: line:2357
          children: []
        - nid: cha19.sec19_2.p19_2_1.i3
          kind: item
          kind_raw: 3)
          num: '3'
          ord: 748
          heading: null
          text: 無菌操作中に職員が介入する場合は，グローブ，又はハーフスーツを介して作業を行うこと．グローブやハーフスーツについては，製品汚染のリスクを最小限とするために，消毒や点検，交換などに関して適切な手順を定め，これを実行すること．グローブの運用に関する具体的な要件については19.1アイソレータの章を参照のこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2358
          - source_label: PMDA aseptic processing guideline
            locator: line:2359
          - source_label: PMDA aseptic processing guideline
            locator: line:2360
          - source_label: PMDA aseptic processing guideline
            locator: line:2361
          children: []
        - nid: cha19.sec19_2.p19_2_1.i4
          kind: item
          kind_raw: 4)
          num: '4'
          ord: 749
          heading: null
          text: RABS内の製品接触面はSIPにより滅菌されることが望ましい．SIPが不可能な部分については，オートクレーブなどで滅菌した後，無菌的に組み立てること．アイソレータのような除染工程を実施することが可能な場合は，製品接触面について更に高度な微生物学的清浄度を達成することができる．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2362
          - source_label: PMDA aseptic processing guideline
            locator: line:2363
          - source_label: PMDA aseptic processing guideline
            locator: line:2364
          - source_label: PMDA aseptic processing guideline
            locator: line:2365
          children: []
        - nid: cha19.sec19_2.p19_2_1.i5
          kind: item
          kind_raw: 5)
          num: '5'
          ord: 750
          heading: null
          text: RABS内の製品の非接触面については，適切な方法により消毒を行うこと．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2366
          children: []
        - nid: cha19.sec19_2.p19_2_1.i6
          kind: item
          kind_raw: 6)
          num: '6'
          ord: 751
          heading: null
          text: RABS内へ滅菌された材料を持ち込む場合は，汚染を防ぐ適切な移送システムによって行うこと．容器に入った材料を容器毎，RABS内に持ち込む場合は，容器の外面を適切な方法で除染すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2370
          - source_label: PMDA aseptic processing guideline
            locator: line:2371
          - source_label: PMDA aseptic processing guideline
            locator: line:2372
          children: []
        - nid: cha19.sec19_2.p19_2_1.i7
          kind: item
          kind_raw: 7)
          num: '7'
          ord: 752
          heading: null
          text: 製造作業中にRABSの扉を開けて職員の介入操作を行う場合は，製品の汚染リスクが高くなるため，以下に留意すること．
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PMDA aseptic processing guideline
            locator: line:2373
          - source_label: PMDA aseptic processing guideline
            locator: line:2374
          children:
          - nid: cha19.sec19_2.p19_2_1.i7.si1
            kind: subitem
            kind_raw: ①
            num: '1'
            ord: 753
            heading: null
            text: 介入操作後に適切な消毒を行い，潜在的な汚染リスクを排除すること．
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PMDA aseptic processing guideline
              locator: line:2375
            children: []
          - nid: cha19.sec19_2.p19_2_1.i7.si2
            kind: subitem
            kind_raw: ②
            num: '2'
            ord: 754
            heading: null
            text: 扉を開けた時にRABS内にあった容器の扱いについては，製品に対する汚染リスクに基づき，あらかじめ適切な処置手順を定めておくこと．想定外の事象により扉を開けた場合は，原則としてRABS内の容器を全て取り除くこと．
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
