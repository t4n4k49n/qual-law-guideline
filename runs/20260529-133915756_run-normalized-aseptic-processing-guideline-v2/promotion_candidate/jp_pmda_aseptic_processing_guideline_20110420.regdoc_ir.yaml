    text: 本項において「無菌中間製品」とは，無菌的に調製された後，無菌状態を維持しつつ，保管又は輸送される中間製品であって，液又は粉末のものをいう．以下，無菌中間製品の無菌性を維持するための容器及び作業の要件を示す．
