      heading: バリデーションの全体計画に関する文書の作成
      text: 検証責任者は、コンピュータ化システム管理規定に基づき、システムの検証を行う場合には、実施するバリデーションの全体計画に関する文書(以下「バリデーション計画書」という。)を作成するものとする。なお、バリデーション計画書は「4．3 システムアセスメント」により実施した評価結果等に基づき作成する。なお、検証業務は開発業務と併行して行われることもあるため、バリデーション計画書は開発段階の適切な時期に作成する。 また、「6．6 変更の管理」においてバリデーションが必要となった場合は、変更の状況にあわせて適宜バリデーション計画書を作成すること。バリデーション計画書には、原則として次の事項を記載するものとする。また、必要な場合には詳細なリスクアセスメント、供給者監査等の計画についても記載すること。
