      heading: 受入試験
      text: 開発責任者は、システムの機能及び性能の全てあるいは一部が要求仕様を満足していることを確認するために供給者に受入試験を実施させる。受入試験には、供給者の工場出荷前に機能及び性能を確認するテスト(工場出荷試験，FAT)並びにこれらシステム設置場所等における受け入れ時に機能及び性能を確認するテスト(現地受入試験，SAT)があり、適宜選択し実施させる。受入試験の結果は開発責任者が承認する。
      role: normative
      normativity: must
