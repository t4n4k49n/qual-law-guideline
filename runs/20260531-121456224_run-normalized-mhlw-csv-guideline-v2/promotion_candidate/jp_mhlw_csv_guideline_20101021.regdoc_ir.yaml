    - nid: cha1.p1_1
      kind: paragraph
      kind_raw: 1．1
      num: '1.1'
      ord: 2
      heading: 目的
      text: このガイドラインは、「コンピュータ使用医薬品等製造所適正管理ガイドライン」(平成4年2月21日薬監第11号：平成17年3月30日付薬食監麻発第0330001号により廃止)に代わるものとして、「医薬品及び医薬部外品の製造管理及び品質管理の基準に関する省令」(平成16年厚生労働省令第179号。以下「GMP省令」という。)の適用を受ける医薬品又は医薬部外品を製造販売する製造販売業者又は製造する製造業者等(以下「製造販売業者等」という。)が、「医薬品、医薬部外品、化粧品及び医療機器の品質管理の基準に関する省令」(平成16年厚生労働省令第136号。以下「GQP省令」という。)及びGMP省令に基づく業務を行うためのコンピュータ化システムの要件を明確にし、コンピュータ化システムが意図したとおりに動作することを保証するため、これを開発する際に必要な事項、これを検証するバリデーションに関する事項及び運用管理に関する遵守事項(バリデートされた状態の維持や廃棄に関する事項等)を定め、GQP省令及びGMP省令の適正な実施の確保を図ることを目的とする。 このガイドラインにおいては、コンピュータ化システムの開発から、検証、運用管理及び廃棄までの流れを総合してコンピュータ化システムのライフサイクルという。ライフサイクル全体の構成を別紙1「コンピュータ化システムのライフサイクルモデル」に示す。また、このガイドラインに示した管理方法は標準的な例を示したものであり、これに代わる方法で、それが同等又はそれ以上の目的を達成できるものである場合には、その方法を用いても差し支えない。
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: MHLW CSV guideline
        locator: line:10
      - source_label: MHLW CSV guideline
        locator: line:11
      - source_label: MHLW CSV guideline
        locator: line:12
      children: []
    - nid: cha1.p1_2
      kind: paragraph
      kind_raw: 1．2
      num: '1.2'
      ord: 3
      heading: コンピュータ化システムの取扱い
      text: このガイドラインは、GQP省令及びGMP省令に関連するシステム並びに相互に連携したコンピュータ化システムを対象として取り扱うこととしているため、GQP省令やGMP省令における組織・役割に応じた表現を用いていないが、バリデーションや変更・逸脱の管理など、GMP省令においては品質部門等の承認が必要であり、GQP省令においては品質保証部門による管理体制の中で進めなければならない。従って、製造販売業者等において組織の形態や該当するシステムの範囲を考慮して各々の組織・役割に応じた責任と権限を3．に規定する「コンピュータ化システムの開発、検証及び運用管理に関する文書」の中に明確にすることが必要である。 また、このガイドラインの対象となるコンピュータ化システムで「医薬品等の承認又は許可等に係る申請等に関する電磁的記録・電子署名利用のための指針」(平成17年4月1日薬食発第0401022号)及び「薬事法及び採血及び供血あつせん業取締法の一部を改正する法律の施行に伴う医薬品，医療機器等の製造管理及び品質管理(GMP／QMS)に係る省令及び告示の制定及び改廃について」(平成17年3月30日薬食監麻発第0330001号)第3章第3 35．「その他(電磁的記録等について)」の適用を受けるコンピュータ化システムは、併せてそれら要件を備える必要がある。 なお、このガイドラインの適用日以前に開発又は運用が開始されているシステムであって、「コンピュータ使用医薬品等製造所適正管理ガイドライン」に示された方法又はそれに代わる適切な方法で開発、検証及び運用等が行われていないシステムについては、当該システムの適格性を確認する必要がある。
      role: normative
      normativity: must
      tags: []
