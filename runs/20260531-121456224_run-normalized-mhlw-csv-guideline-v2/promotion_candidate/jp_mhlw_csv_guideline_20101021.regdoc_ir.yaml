      kind_raw: 1．3
      num: '1.3'
      ord: 4
      heading: カテゴリ分類
      text: このガイドラインの適用を受けるコンピュータ化システムについては、開発、検証及び運用の各段階において実施する内容を決定(「4．3 システムアセスメントの実施」を参照)するために、システムを構成するソフトウェアの種類に応じて、あらかじめソフトウェアカテゴリを決定するものとする。 カテゴリ分類の基準及びカテゴリ毎の一般的対応の例を別紙2「カテゴリ分類表と対応例」に示す。
      role: normative
      normativity: must
      tags: []
