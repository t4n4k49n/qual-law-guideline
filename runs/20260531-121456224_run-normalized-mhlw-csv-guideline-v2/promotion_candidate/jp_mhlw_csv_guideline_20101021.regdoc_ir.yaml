    text: 運転時適格性評価(OQ，Operational Qualification) コンピュータ化システムが、運転時において、機能仕様等に示された機能及び性能を発揮することを確認し文書化すること。 運用管理業務 コンピュータ化システムの運用開始後、コンピュータ化システムを、バリデートされた状態を維持し、要求仕様に記載された要件に基づいて適正に稼働させるための業務。 運用責任者 コンピュータ化システム運用業務を行うための責任者として、製造販売業者等により運用管理基準書において指定された者。 開発業務 指定されたコンピュータ化システムの計画、設計、製作、テスト、受入試験までの業務。 開発計画書 指定されたコンピュータ化システムを開発する際に目的、条件、責任、体制、スケジュールなどを記述した文書。 開発責任者 コンピュータ化システム開発業務を行うための責任者として、製造販売業者等により開発計画書においてあらかじめ指定された者。 機能仕様書(FS，Functional Specification) 要求仕様書に記載された要求仕様に対応する、より具体的な機能が記載された文書。 供給者 コンピュータ化システムを開発あるいは導入し、製造販売業者等に提供する者をいう。一般にサプライヤやベンダと呼ばれる。自社で開発する場合は自社のシステム開発者も含む。 供給者アセスメント 製造販売業者等による供給者の選定や委託の範囲、供給者監査が必要な場合の実施方法等を決定するために行う供給者の評価、一般的には開発段階の初期に行われる。 供給者監査 供給者の品質管理体制や品質保証のシステム、あるいは経験・能力や実績など多角的に供給者の調査を行い、供給者の総合的な品質マネジメントシステムや能力を評価・確認すること。実地又は書面による監査方法がある。 検証業務 コンピュータ化システムが、要求仕様等に定めた要件に合致して設計され、据え付けられ、システムの稼働環境及び稼働状態において、機能及び性能を発揮することを確認すること。 検証責任者 検証業務を行うための責任者として、製造販売業者等により開発計画書においてあらかじめ指定された者。 現地受入試験(SAT，Site Acceptance Test) 供給者がシステムを現地の稼働環境で機能及び性能の全てあるいは一部が機能仕様を満足していることを確認すること。ここでいう「現地」とは、製造販売業者等が当該のシステムを設置する予定の場所をいう。 工場出荷試験(FAT，Factory Acceptance Test) 供給者がシステムを出荷する前に製作環境で機能及び性能の全てあるいは一部が機能仕様を満足していることを確認すること。 構成設定 コンピュータシステムを利用するにあたってハードウェア及びソフトウェアの構成要素の組み合わせや稼働条件等を設定すること。すなわち、ハードウェアにおいては、システムを構成する、コンピュータ、周辺機器あるいはそれらに組み込まれる部品(ボード等)の組み合わせを設定し、登録すること。ソフトウェアにおいては、プログラムを作成、変更することなく、システムを構成するモジュールの組み合わせ、及びシステムが稼働する条件、パラメータ等を設定し、登録すること。 コンピュータ化システム(Computerized System) コンピュータシステムで統合された工程又は作業、及びコンピュータシステムにより実現される機能を利用する業務プロセス。 コンピュータシステム 特定の機能又は一連の機能を実行するために、設計し、組み立てられたハードウェア及び関連するソフトウェアのグループ。 コンピュータシステムの廃棄の責任者 コンピュータシステムの廃棄を行うための責任者として、製造販売業者等により廃棄計画書において指定された者。 識別構成要素 システムの運用において操作者を識別、特定するために用いられるデータの組み合わせ、もしくは機器とデータの組み合わせ、例えばIDとパスワードの組合せ。 システムアセスメント 開発対象とするコンピュータ化システムのバリデーションにおける検証内容や作成文書等を決定するために、システムのソフトウェアの複雑性や開発方法、当該システムにより製造される製品の安全性や品質への影響の度合い、又は当該システムにより作成、保存される電子記録の重要度、供給者のシステム開発過程での品質保証の状況等を総合的に評価すること。 システム台帳 このガイドラインの管理対象のシステムを適切に管理するため、このガイドラインの対象となるコンピュータ化システムを登録する。記載事項としてはシステム名称、管理番号、バリデーション対象の有無(カテゴリ分類)、システムの担当者等がある。 システムテスト 稼働するために結合された状態でモジュール、プログラムが機能仕様書、設計仕様書通りに機能することを確認すること。 据付時適格性評価(IQ，Installation Qualification) コンピュータ化システムが、設計仕様等に記載されたとおりに据え付けられ、プログラムがインストールされたことを確認し、文書化すること。 性能適格性評価(PQ，Performance Qualification) コンピュータ化システムが稼働時において、要求仕様等に記載されたとおりに機能し、性能を発揮して運転できることを確認し、文書化すること。 設計仕様書(DS，Design Specification) 機能仕様に記載された具体的な機能を実現するコンピュータ化システムを作成するための詳細仕様が記載された文書。ハードウェア仕様書とソフトウェア仕様書に分けられる場合がある。 ハードウェア仕様書：システムを構成するハードウェアの仕様、構成を記述する ソフトウェア仕様書：システムを構成するソフトウェアの詳細機能、構成を記述する 設計時適格性評価(DQ，Design Qualification) 要求仕様書に記載された要求事項が、機能仕様書、設計仕様書等に正しく反映されていることを確認し文書化すること。 ソフトウェアカテゴリ 同程度の信頼性を有するソフトウェアの属すべき範囲。ソフトウェアの性質や特徴を区分する上での基本的な分類。 プログラム仕様書 設計仕様書の機能を実現するためにモジュール、プログラムで実現すべき事項を記述した仕様書。 プログラムテスト モジュール、プログラムが単体でプログラム仕様書通りに機能することを確認すること。 モジュール ソフトウェアを構成する機能の最小単位。 要求仕様書(URS，User Requirement Specification) 指定されたコンピュータ化システムに関する機能上の要求仕様が記載された文書。 リスクアセスメント リスクマネジメントプロセスの中で、リスクに係わる決定を支持する情報を整理する系統だったプロセス。ハザードの特定、及びそれらハザードへの曝露に伴うリスクの分析と評価からなる。 リストア あらかじめ適切な媒体にバックアップしておいた、プログラム、パラメータ、データ等を、再度システムに読み込ませ、システムをバックアップした時点と同様の状態に戻すこと。 その他の用語については、GQP省令、GMP省令及び関連の通知類の用語を参照。
