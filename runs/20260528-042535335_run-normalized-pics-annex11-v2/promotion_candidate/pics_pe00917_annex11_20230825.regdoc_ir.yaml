      kind_raw: '15.'
      num: '15'
      ord: 39
      heading: Batch release
      text: When a computerised system is used for recording certification and batch release, the system should allow only Authorised Persons to certify the release of the batches and it should clearly identify and record the person releasing or certifying the batches. This should be performed using an electronic signature.
      role: structural
      normativity: null
