        kind_raw: '3.1'
        num: '3.1'
        ord: 5
        heading: null
        text: When third parties (e.g. suppliers, service providers) are used e.g. to provide, install, configure, integrate, validate, maintain (e.g. via remote access), modify or retain a computerised system or related service or for data processing, formal agreements must exist between the manufacturer and any third parties, and these agreements should include clear statements of the responsibilities of the third party. IT-departments should be considered analogous.
        role: normative
        normativity: must
        tags: []
