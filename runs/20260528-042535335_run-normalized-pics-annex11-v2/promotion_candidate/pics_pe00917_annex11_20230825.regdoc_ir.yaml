      heading: Periodic Evaluation
      text: 'Computerised systems should be periodically evaluated to confirm that they remain in a valid state and are compliant with GMP. Such evaluations should include, where appropriate, the current range of functionality, deviation records,


        incidents, problems, upgrade history, performance, reliability, security and validation status reports.'
