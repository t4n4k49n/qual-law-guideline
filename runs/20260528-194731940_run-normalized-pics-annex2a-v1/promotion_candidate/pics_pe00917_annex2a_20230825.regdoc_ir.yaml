            kind: item
            kind_raw: (b)
            num: b
            ord: 162
            heading: null
            text: The procedure for batch certification should provide an exact and detailed description of the entire release procedure, including responsibilities of the different personnel involved in assessment of production and analytical data.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
