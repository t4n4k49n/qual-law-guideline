          - nid: ann2a.chaa.sec5.p5_19.ia
            kind: item
            kind_raw: (a)
            num: a
            ord: 102
            heading: null
            text: ATMPs manufactured for exploratory, early phase clinical trials (phase I and phase I/II), are expected to be validated proportionately with the knowledge and the risk associated with the respective phase. All aseptic and sterilisation processes as well as virus inactivation or removal for investigational and authorised ATMPs are expected to be validated. The effectiveness of disinfection methods should be proven. For all phases, the principles as outlined in Annex 13 should be applied.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
