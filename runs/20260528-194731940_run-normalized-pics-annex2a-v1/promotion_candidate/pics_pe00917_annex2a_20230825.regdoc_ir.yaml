        - nid: ann2a.chaa.sec5.p5_14
          kind: paragraph
          kind_raw: '5.14'
          num: '5.14'
          ord: 89
          heading: null
          text: An emergency plan for dealing with accidental release of viable organisms should be in place. This should address methods and procedures for containment, protection of operators, cleaning, decontamination and safe return to use. Accidental spillages, especially of live organisms, must be dealt with quickly and safely. Decontamination measures should be available for each organism or groups of related organisms in line with the QRM process. Decontamination measures should be validated for effectiveness.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
