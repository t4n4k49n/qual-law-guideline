        - nid: ann2a.chaa.sec5.p5_13
          kind: paragraph
          kind_raw: '5.13'
          num: '5.13'
          ord: 88
          heading: null
          text: The methods used for sterilisation, disinfection, virus removal or inactivation should be validated. In cases where a virus inactivation or removal process is performed during manufacture, measures to avoid the risk of recontamination should be taken. (refer to Section 5.19(a))
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:874
          - source_label: PIC/S
