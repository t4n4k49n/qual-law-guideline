            kind: item
            kind_raw: (d)
            num: d
            ord: 105
            heading: null
            text: 'The use of surrogate material during process validation may be acceptable when there is shortage of the starting materials (e.g. autologous ATMPs, allogeneic in a matched-donor scenario, allogeneic where there is no expansion of cells to MCB). The representativeness of surrogate starting material should be evaluated, including – for example – donor age, use of materials from healthy donors, anatomical source (e.g. femur vs. iliac crest)


              Annex 2A Manufacture of advanced therapy medicinal products for human use


              or other different characteristics (e.g. use of representative cell-types or use of cells at a higher passage number than that foreseen in the product specifications).'
            role: normative
            normativity: must
            tags: []
