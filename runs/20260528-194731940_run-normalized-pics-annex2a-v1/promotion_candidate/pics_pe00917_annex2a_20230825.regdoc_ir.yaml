          heading: null
          text: The health status of personnel should be taken into consideration for product safety. Personnel (including those concerned with cleaning, maintenance or quality control) employed in areas where ATMP active substances and products are manufactured and tested should receive training, and periodic retraining, specific to the products manufactured and to the duties assigned to them, including any specific safety measures to protect product, personnel and the environment.
