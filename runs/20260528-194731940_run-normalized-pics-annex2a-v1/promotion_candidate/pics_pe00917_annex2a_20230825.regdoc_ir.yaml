            locator: line:783
          - source_label: PIC/S
            locator: line:784
          children: []
        - nid: ann2a.chaa.sec5.p5_6
          kind: paragraph
          kind_raw: '5.6'
          num: '5.6'
          ord: 72
          heading: null
          text: When setting up a programme for primary and secondary packaging operations, particular attention should be given to minimising the risk of cross-contamination, mix-ups or substitutions. Sterility and/or low bioburden requirements should be adhered to and segregation strategies should be applied. (Replaces PIC/S GMP Guide Part I Section 5.49)
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:786
          - source_label: PIC/S
            locator: line:787
          - source_label: PIC/S
            locator: line:788
          - source_label: PIC/S
            locator: line:789
          - source_label: PIC/S
            locator: line:790
          children: []
        - nid: ann2a.chaa.sec5.p5_7
          kind: paragraph
          kind_raw: '5.7'
          num: '5.7'
          ord: 73
          heading: null
          text: If closed systems are used for the production of ATMPs, checks should be carried out to ensure that all pieces of the equipment are connected in a correct manner to assure the closed state. Special attention should be given to apply these tests to automated systems. If feasible and based on QRM principles, for example considering testing carried out by vendors, the integrity of single use systems should be verified at adequate frequency prior to use and potentially post use, possibly automatically. The integrity of reused equipment should be verified before use after cleaning and sterilisation.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:792
          - source_label: PIC/S
            locator: line:793
          - source_label: PIC/S
            locator: line:794
          - source_label: PIC/S
            locator: line:795
          - source_label: PIC/S
            locator: line:796
          - source_label: PIC/S
            locator: line:797
          - source_label: PIC/S
            locator: line:798
          - source_label: PIC/S
            locator: line:799
          children: []
        - nid: ann2a.chaa.sec5.p5_8
          kind: paragraph
          kind_raw: '5.8'
          num: '5.8'
          ord: 74
          heading: null
          text: A system is no longer considered closed when materials are added or withdrawn without aseptic techniques (e.g. without use of sterile connectors or filters aseptically connected).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:801
          - source_label: PIC/S
            locator: line:802
