        kind: item
        kind_raw: (a)
        num: a
        ord: 6
        heading: null
        text: Tissues and cells used as starting materials of ATMPs may be subject to other national legislation that cover donation, procurement, testing, processing, preservation, storage and distribution.
        role: normative
        normativity: must
        tags: []
        refs:
          internal: []
