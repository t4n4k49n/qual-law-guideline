            text: 'The use of multiple closed systems in the same area is permitted, in the case that their close state can be demonstrated. (refer to point 3.13.)


              Annex 2A Manufacture of advanced therapy medicinal products for human use'
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:471
            - source_label: PIC/S
              locator: line:472
            - source_label: PIC/S
              locator: line:476
            children: []
        - nid: ann2a.chaa.sec3.p3_3
          kind: paragraph
          kind_raw: '3.3'
          num: '3.3'
          ord: 38
          heading: null
          text: The measures and procedures necessary for containment (i.e. for environment and operator safety) should not conflict with those for product quality.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:481
          - source_label: PIC/S
            locator: line:482
          children: []
        - nid: ann2a.chaa.sec3.p3_4
          kind: paragraph
          kind_raw: '3.4'
          num: '3.4'
          ord: 39
          heading: null
          text: Special precautions should be taken in the case of manufacturing activities involving infectious viral vectors (e.g. oncolytic viruses, replication competent vectors) that should be segregated based on a documented CCS and QRM principles. The manufacturer should justify the level of segregation required based on the CCS and through QRM principles. The outcome of the QRM process should determine the necessity for and extent to which the premises and equipment should be dedicated to a particular product. In some cases, dedicated facilities, dedicated areas or dedicated equipment may be required in accordance with the national law. Simultaneous incubation and/or storage of replication competent vectors/products, or infected materials/products, with other materials/products is not acceptable.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:484
          - source_label: PIC/S
            locator: line:485
          - source_label: PIC/S
            locator: line:486
          - source_label: PIC/S
            locator: line:487
          - source_label: PIC/S
            locator: line:488
          - source_label: PIC/S
            locator: line:489
          - source_label: PIC/S
            locator: line:490
          - source_label: PIC/S
            locator: line:491
          - source_label: PIC/S
            locator: line:492
          - source_label: PIC/S
            locator: line:493
          - source_label: PIC/S
            locator: line:494
          children: []
        - nid: ann2a.chaa.sec3.p3_5
          kind: paragraph
          kind_raw: '3.5'
          num: '3.5'
          ord: 40
          heading: null
          text: Air handling units should be designed, constructed and maintained to minimise the risk of cross-contamination between different manufacturing areas and may need to be specific for an area. Consideration, based on QRM principles, should be given to the use of single pass air systems.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:496
          - source_label: PIC/S
            locator: line:497
          - source_label: PIC/S
            locator: line:498
          - source_label: PIC/S
            locator: line:499
          children: []
        - nid: ann2a.chaa.sec3.p3_6
          kind: paragraph
          kind_raw: '3.6'
          num: '3.6'
          ord: 41
          heading: null
          text: If materials (such as culture media and buffers) have to be measured or weighed during the production process, small stocks may be kept in the production area for a specified duration based on defined criteria (e.g. duration of manufacture of the batch or of the campaign). (Replaces PIC/S GMP Guide Part I Section 3.13)
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:501
          - source_label: PIC/S
            locator: line:502
          - source_label: PIC/S
            locator: line:503
          - source_label: PIC/S
            locator: line:504
          children: []
        - nid: ann2a.chaa.sec3.p3_7
          kind: paragraph
          kind_raw: '3.7'
          num: '3.7'
          ord: 42
          heading: null
          text: Positive pressure areas should be used to process sterile products, but negative pressure in specific areas at the point of exposure of pathogens is acceptable for containment reasons. Where negative pressure areas or BSCs are used for aseptic processing of materials with particular risks (e.g. pathogens), they should be surrounded by a positive pressure clean zone of appropriate Grade. These pressure cascades should be clearly defined and continuously monitored with appropriate alarm settings as defined by Annex 1. The design of such areas should be such that measures put in place to prevent release of material into the surrounding environment should not compromise sterility assurance level (SAL) of the product and vice versa.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:506
          - source_label: PIC/S
            locator: line:507
          - source_label: PIC/S
            locator: line:508
          - source_label: PIC/S
            locator: line:509
          - source_label: PIC/S
            locator: line:510
          - source_label: PIC/S
            locator: line:511
          - source_label: PIC/S
            locator: line:512
          - source_label: PIC/S
            locator: line:513
          - source_label: PIC/S
            locator: line:514
          - source_label: PIC/S
            locator: line:515
          children: []
        - nid: ann2a.chaa.sec3.p3_8
          kind: paragraph
          kind_raw: '3.8'
          num: '3.8'
          ord: 43
          heading: null
          text: Air vent filters that are directly linked to the sterility of the product (e.g. to maintain the integrity of a closed system) should be hydrophobic, monitored during use (e.g. pressure differential monitoring if appropriate) and validated for their scheduled life span with integrity testing at appropriate intervals based on appropriate QRM principles. If pressure monitoring or integrity testing is technically not feasible for the filter system, vendor supplied information may be considered for approval. However, this has to be taken into account in the CCS as an additional risk factor especially for short shelf life ATMPs, where microbiological quality tests are not available at the time of batch release prior to medical product administration.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:517
          - source_label: PIC/S
            locator: line:518
          - source_label: PIC/S
            locator: line:519
          - source_label: PIC/S
            locator: line:520
          - source_label: PIC/S
            locator: line:521
          - source_label: PIC/S
            locator: line:522
          - source_label: PIC/S
            locator: line:523
          - source_label: PIC/S
            locator: line:524
          - source_label: PIC/S
            locator: line:525
          - source_label: PIC/S
            locator: line:526
          children: []
        - nid: ann2a.chaa.sec3.p3_9
          kind: paragraph
          kind_raw: '3.9'
          num: '3.9'
          ord: 44
          heading: null
          text: 'Drainage systems must be designed so that effluents can be effectively neutralised or decontaminated to minimise the risk of cross-contamination. They must comply with national law to minimize the risk of contamination of the external environment according to the risk associated with the biohazardous nature of waste materials. (Replaces PIC/S GMP Guide Part I Section 3.11)


            Annex 2A Manufacture of advanced therapy medicinal products for human use'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:528
          - source_label: PIC/S
            locator: line:529
          - source_label: PIC/S
            locator: line:530
          - source_label: PIC/S
            locator: line:531
          - source_label: PIC/S
            locator: line:532
          - source_label: PIC/S
            locator: line:536
          children: []
        - nid: ann2a.chaa.sec3.p3_10
          kind: paragraph
          kind_raw: '3.10'
          num: '3.10'
          ord: 45
          heading: null
          text: The degree of environmental control of particulate and microbial contamination of the production premises should be adapted to the product and the production step, bearing in mind the potential level of contamination of the starting materials and the risks to the product. The microbiological environmental monitoring programme should be supplemented by the inclusion of methods to detect the presence of specific microorganisms (e.g. host organism, yeasts, moulds, anaerobes, etc.) where indicated by the QRM principles.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:541
          - source_label: PIC/S
            locator: line:542
          - source_label: PIC/S
            locator: line:543
          - source_label: PIC/S
            locator: line:544
          - source_label: PIC/S
            locator: line:545
          - source_label: PIC/S
            locator: line:546
          - source_label: PIC/S
            locator: line:547
          children: []
        - nid: ann2a.chaa.sec3.p3_11
          kind: paragraph
          kind_raw: '3.11'
          num: '3.11'
          ord: 46
          heading: null
          text: Where processes are not closed and there is exposure of the product to the immediate room environment without a subsequent microbial inactivation process, (e.g. during additions of supplements, media, buffers, gasses, manipulations) appropriate environmental conditions should be applied. For aseptic manipulations parameters in line with Annex 1 (i.e. Grade A with Grade B background) should be applied. The environmental monitoring program should include testing and monitoring of non-viable contamination, viable contamination and air pressure differentials. The monitoring locations should be determined having regards to the QRM principles. The number of samples, volume, and frequency of monitoring, alert and action limits should be appropriate taking into account the QRM principles. Sampling methods should not pose a risk of contamination to the manufacturing operations. Where appropriate control is required in the process, temperature and relative humidity should be monitored. All environmental monitoring results should be trended.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:549
          - source_label: PIC/S
            locator: line:550
          - source_label: PIC/S
            locator: line:551
          - source_label: PIC/S
            locator: line:552
          - source_label: PIC/S
            locator: line:553
          - source_label: PIC/S
            locator: line:554
          - source_label: PIC/S
            locator: line:555
          - source_label: PIC/S
            locator: line:556
          - source_label: PIC/S
            locator: line:557
          - source_label: PIC/S
            locator: line:558
          - source_label: PIC/S
            locator: line:559
          - source_label: PIC/S
            locator: line:560
          - source_label: PIC/S
            locator: line:561
          - source_label: PIC/S
            locator: line:562
          children: []
        - nid: ann2a.chaa.sec3.p3_12
          kind: paragraph
          kind_raw: '3.12'
          num: '3.12'
          ord: 47
          heading: null
          text: Only in exceptional circumstances when an appropriate manufacturing environment is not available, a less stringent environment than that specified in Section 3.11 above may be acceptable for processes that are not closed where approved by the Competent Authority and in accordance with CTA or MA or other national requirements. However, this option should be considered exceptional and applicable only if the product is intended to treat a life-threatening condition where no alternative therapeutic options exist. The environment must be specified and justified to provide patient benefit that outweighs the significant risk created by manufacturing under less stringent environments. If the Competent Authority grants an approval, the manufacturer must pursue establishing the appropriate environment as improvements in the technology occur.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:564
          - source_label: PIC/S
            locator: line:565
          - source_label: PIC/S
            locator: line:566
          - source_label: PIC/S
            locator: line:567
          - source_label: PIC/S
            locator: line:568
          - source_label: PIC/S
            locator: line:569
          - source_label: PIC/S
            locator: line:570
          - source_label: PIC/S
            locator: line:571
          - source_label: PIC/S
            locator: line:572
          - source_label: PIC/S
            locator: line:573
          - source_label: PIC/S
            locator: line:574
          children: []
        - nid: ann2a.chaa.sec3.p3_13
          kind: paragraph
          kind_raw: '3.13'
          num: '3.13'
          ord: 48
          heading: null
          text: 'For closed systems, a lower classified area than Grade A in background Grade B might be acceptable based on the outcome of a QRM assessment. The appropriate level of air classification and monitoring should be determined having regard to the specific risks, considering the nature of the product, the manufacturing process and the equipment used. QRM should be used to determine whether the technology used supports reduced monitoring, in particular where monitoring can be a source of contamination. This is in addition to:'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:576
          - source_label: PIC/S
            locator: line:577
          - source_label: PIC/S
            locator: line:578
          - source_label: PIC/S
            locator: line:579
          - source_label: PIC/S
            locator: line:580
          - source_label: PIC/S
            locator: line:581
          - source_label: PIC/S
            locator: line:582
          - source_label: PIC/S
            locator: line:583
          children:
          - nid: ann2a.chaa.sec3.p3_13.ia
            kind: item
            kind_raw: (a)
            num: a
            ord: 49
            heading: null
            text: "The use of technologies as e.g. processing inside single use sterile\n               disposable kits, or processing using closed, automated manufacturing\n               platform or incubation in closed flasks, bags or fermenters in Grade C\n               may be acceptable if adequate control measures are implemented to\n               avoid the risk of microbial contamination and cross-contamination (e.g.\n               appropriate control of materials, personnel flows and cleanliness).\n               Particular attention should be paid if the materials are subsequently\n               moved to a clean area of higher Grade.\nAnnex 2A Manufacture of advanced therapy medicinal products for human use"
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:585
            - source_label: PIC/S
              locator: line:586
            - source_label: PIC/S
              locator: line:587
            - source_label: PIC/S
              locator: line:588
            - source_label: PIC/S
              locator: line:589
            - source_label: PIC/S
              locator: line:590
            - source_label: PIC/S
              locator: line:591
            - source_label: PIC/S
              locator: line:592
            - source_label: PIC/S
              locator: line:596
            children: []
          - nid: ann2a.chaa.sec3.p3_13.ib
            kind: item
            kind_raw: (b)
            num: b
            ord: 50
            heading: null
            text: "If the closed system can be shown to remain integral throughout the\n                  entire usage, a background of Grade D might be acceptable.\nRequirements of Annex 1 regarding the provision of closed system should be considered."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:601
            - source_label: PIC/S
              locator: line:602
            - source_label: PIC/S
              locator: line:604
            - source_label: PIC/S
              locator: line:605
            children: []
        - nid: ann2a.chaa.sec3.p3_14
          kind: paragraph
          kind_raw: '3.14'
          num: '3.14'
          ord: 51
          heading: null
          text: 'In exceptional circumstances, it is permissible to perform a manufacturing step in premises that are not under direct control of the ATMP manufacturer or MAH (including for example placing equipment used to perform manufacturing steps in hospital wards or theatre) where approved by the Competent Authority and in accordance with CTA or MA or other national requirements. In such cases, it should be demonstrated that the process maintains its validated status in accordance to principles and guidelines in Annex 15, Annex 20 and in this annex. These arrangements should be subject to approval by the Competent Authority. The responsibilities of each parties should be defined in written technical agreements.


            EQUIPMENT'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:607
          - source_label: PIC/S
            locator: line:608
          - source_label: PIC/S
            locator: line:609
          - source_label: PIC/S
            locator: line:610
          - source_label: PIC/S
            locator: line:611
          - source_label: PIC/S
            locator: line:612
          - source_label: PIC/S
            locator: line:613
          - source_label: PIC/S
            locator: line:614
          - source_label: PIC/S
            locator: line:615
          - source_label: PIC/S
            locator: line:616
          - source_label: PIC/S
            locator: line:619
          children: []
        - nid: ann2a.chaa.sec3.p3_15
          kind: paragraph
          kind_raw: '3.15'
          num: '3.15'
          ord: 52
          heading: null
          text: 'Production equipment should not present any hazard to the products. The parts of the production equipment that come into contact with the product must not be reactive, additive or absorptive to such an extent that it will affect the quality of the product and thus present any hazard.


            In addition, if single use systems (i.e. disposable systems) are used, the manufacturer should take into account and verify the impact on the product from extractable, leachable, insoluble particulate and insoluble matter derived from such systems. Annex 1 regarding provisions for single use systems should be considered. (Replaces PIC/S GMP Guide Part I Section 3.39)'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:620
          - source_label: PIC/S
            locator: line:621
          - source_label: PIC/S
            locator: line:622
          - source_label: PIC/S
            locator: line:623
          - source_label: PIC/S
            locator: line:625
          - source_label: PIC/S
            locator: line:626
          - source_label: PIC/S
            locator: line:627
          - source_label: PIC/S
            locator: line:628
          - source_label: PIC/S
            locator: line:629
          children: []
        - nid: ann2a.chaa.sec3.p3_16
          kind: paragraph
          kind_raw: '3.16'
          num: '3.16'
          ord: 53
          heading: null
          text: Where required to minimise the risk of cross-contamination, restrictions on the movement of equipment should be applied. In general, equipment should not be moved from high-risk areas to other areas, or between high-risk areas (e.g. equipment used for the handling of cells from infected donors or the handling of oncolytic viruses). Where the relocation of equipment is unavoidable, after reviewing engineering and/ or technical modifications, the risk should be assessed in line with QRM principles, mitigated and monitored to ensure an effective cross-contamination control strategy (refer to Section 3.4 CCS). The qualification status of the equipment moved should also be considered.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:631
          - source_label: PIC/S
            locator: line:632
          - source_label: PIC/S
            locator: line:633
          - source_label: PIC/S
            locator: line:634
          - source_label: PIC/S
            locator: line:635
          - source_label: PIC/S
            locator: line:636
          - source_label: PIC/S
            locator: line:637
          - source_label: PIC/S
            locator: line:638
          - source_label: PIC/S
            locator: line:639
          children: []
        - nid: ann2a.chaa.sec3.p3_17
          kind: paragraph
          kind_raw: '3.17'
          num: '3.17'
          ord: 54
          heading: null
          text: The design of equipment used during handling of live organisms and cells, including those for sampling, should be considered to prevent any contamination during processing.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:641
          - source_label: PIC/S
            locator: line:642
          - source_label: PIC/S
            locator: line:643
          children: []
        - nid: ann2a.chaa.sec3.p3_18
          kind: paragraph
          kind_raw: '3.18'
          num: '3.18'
          ord: 55
          heading: null
          text: 'Primary containment4 should be designed and periodically tested to ensure the prevention of escape of biological agents into the immediate working environment.


            4         See Main GMP Glossary on ‘Containment’.


            Annex 2A Manufacture of advanced therapy medicinal products for human use'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:645
          - source_label: PIC/S
