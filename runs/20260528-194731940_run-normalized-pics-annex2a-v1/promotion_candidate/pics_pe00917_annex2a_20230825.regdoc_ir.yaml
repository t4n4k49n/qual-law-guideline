        - nid: ann2a.chaa.sec5.p5_33
          kind: paragraph
          kind_raw: '5.33'
          num: '5.33'
          ord: 136
          heading: null
          text: Following the establishment of master and working cell banks and master and working seed lots, quarantine and release procedures should be followed. This should include adequate characterisation and testing for contaminants. Their on-going suitability for use should be further demonstrated by the consistency of the characteristics and quality of the successive batches of product. Evidence of the stability and recovery of the seeds and banks should be documented and records should be kept in a manner permitting trend evaluation.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1338
          - source_label: PIC/S
            locator: line:1339
          - source_label: PIC/S
            locator: line:1340
          - source_label: PIC/S
            locator: line:1341
          - source_label: PIC/S
            locator: line:1342
          - source_label: PIC/S
            locator: line:1343
          - source_label: PIC/S
            locator: line:1344
          children: []
        - nid: ann2a.chaa.sec5.p5_34
          kind: paragraph
          kind_raw: '5.34'
          num: '5.34'
          ord: 137
          heading: null
          text: Seed lots and cell banks should be stored and used in such a way as to minimise the risks of contamination (e.g. stored in the vapour phase of liquid nitrogen in sealed containers) or alteration. Control measures for the storage of different seeds and/or cells in the same area or equipment should prevent mix-up and take into account the infectious nature of the materials to prevent cross-contamination.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1346
          - source_label: PIC/S
            locator: line:1347
          - source_label: PIC/S
            locator: line:1348
          - source_label: PIC/S
            locator: line:1349
          - source_label: PIC/S
            locator: line:1350
          children: []
        - nid: ann2a.chaa.sec5.p5_35
          kind: paragraph
          kind_raw: '5.35'
          num: '5.35'
          ord: 138
          heading: null
          text: Cell based ATMPs are often generated from a cell stock obtained from limited number of passages. In contrast with the two-tiered system of Master and Working cell banks, the number of production runs from a cell stock is limited by the number of aliquots obtained after expansion and does not cover the entire life cycle of the product. Cell stock changes should be addressed in the MA/CTA and thereby covered by a validation and comparability protocol, as the inter-donor variability may change the product.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1352
          - source_label: PIC/S
            locator: line:1353
          - source_label: PIC/S
            locator: line:1354
          - source_label: PIC/S
            locator: line:1355
          - source_label: PIC/S
            locator: line:1356
          - source_label: PIC/S
            locator: line:1357
          - source_label: PIC/S
            locator: line:1358
          children: []
        - nid: ann2a.chaa.sec5.p5_36
          kind: paragraph
          kind_raw: '5.36'
          num: '5.36'
          ord: 139
          heading: null
          text: 'Storage containers should be sealed, clearly labelled and kept at an appropriate temperature. A stock inventory must be kept. The storage temperature and, where used, the liquid nitrogen levels should be continuously monitored. Deviation from set limits and corrective and preventive action taken should be recorded.


            Annex 2A Manufacture of advanced therapy medicinal products for human use'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1360
          - source_label: PIC/S
            locator: line:1361
          - source_label: PIC/S
            locator: line:1362
          - source_label: PIC/S
            locator: line:1363
          - source_label: PIC/S
            locator: line:1364
          - source_label: PIC/S
            locator: line:1369
          children: []
        - nid: ann2a.chaa.sec5.p5_37
          kind: paragraph
          kind_raw: '5.37'
          num: '5.37'
          ord: 140
          heading: null
          text: It is desirable to split stocks and to store the split stocks at different locations to minimise the risks of total loss. The controls at such locations should provide the assurances outlined in the preceding paragraphs.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1373
          - source_label: PIC/S
            locator: line:1374
          - source_label: PIC/S
            locator: line:1375
          children: []
        - nid: ann2a.chaa.sec5.p5_38
          kind: paragraph
          kind_raw: '5.38'
          num: '5.38'
          ord: 141
          heading: null
          text: The storage and handling conditions for stocks should be managed according to the same procedures and parameters. Once containers are removed from the seed lot / cell bank management system, the containers should not be returned to stock.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1377
          - source_label: PIC/S
            locator: line:1378
          - source_label: PIC/S
            locator: line:1379
          - source_label: PIC/S
            locator: line:1380
          children: []
      - nid: ann2a.chaa.sec6
        kind: section
        kind_raw: CHAPTER 6 QUALITY CONTROL
        num: '6'
        ord: 142
        heading: null
        text: null
        role: structural
        normativity: null
        tags: []
        refs:
          internal: []
          external: []
        source_spans:
        - source_label: PIC/S
          locator: line:1382
        children:
        - nid: ann2a.chaa.sec6.p6_1
          kind: paragraph
          kind_raw: '6.1'
          num: '6.1'
          ord: 143
          heading: null
          text: 'In-process controls have a greater importance in ensuring the consistency of the quality of ATMPs than for conventional products. In-process control testing should be performed at appropriate stages of production to control those conditions that are important for the quality of the finished product.


            General'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1383
          - source_label: PIC/S
            locator: line:1384
          - source_label: PIC/S
            locator: line:1385
          - source_label: PIC/S
            locator: line:1386
          - source_label: PIC/S
            locator: line:1388
          children: []
        - nid: ann2a.chaa.sec6.p6_2
          kind: paragraph
          kind_raw: '6.2'
          num: '6.2'
          ord: 144
          heading: null
          text: The head of quality control is responsible for control of ATMP active substances, starting materials, raw materials and other materials such as primary packaging materials and any other material in direct contact with the product during manufacture as well as medical devices that are used in combined ATMPs. Further, the head of quality control is responsible to control the quality of the ATMP throughout all stages of manufacture. In case of autologous products or allogeneic products in a donor-matched scenario, the match between the origin of the starting material and the recipient should be verified.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1390
          - source_label: PIC/S
            locator: line:1391
          - source_label: PIC/S
            locator: line:1392
          - source_label: PIC/S
            locator: line:1393
          - source_label: PIC/S
            locator: line:1394
          - source_label: PIC/S
            locator: line:1395
          - source_label: PIC/S
            locator: line:1396
          - source_label: PIC/S
            locator: line:1397
          children: []
        - nid: ann2a.chaa.sec6.p6_3
          kind: paragraph
          kind_raw: '6.3'
          num: '6.3'
          ord: 145
          heading: null
          text: Samples should be representative of the batch of materials or products from which they are taken. Other samples may also be taken to monitor the worst-case part of a process (e.g. beginning or end of a process). The sampling plan used should be appropriately justified and based on a risk management approach. Certain types of cells (e.g. autologous cells used in ATMPs) may be available in limited quantities and, where allowed in the CTA or MA, a modified testing and sample retention strategy may be developed and documented. (Replaces PIC/S GMP Guide Part I Section 6.12)
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1399
          - source_label: PIC/S
            locator: line:1400
          - source_label: PIC/S
            locator: line:1401
          - source_label: PIC/S
            locator: line:1402
          - source_label: PIC/S
            locator: line:1403
          - source_label: PIC/S
            locator: line:1404
          - source_label: PIC/S
            locator: line:1405
          - source_label: PIC/S
            locator: line:1406
          children: []
        - nid: ann2a.chaa.sec6.p6_4
          kind: paragraph
          kind_raw: '6.4'
          num: '6.4'
          ord: 146
          heading: null
          text: Sample containers should bear a label indicating the contents, with the batch number, the date of sampling and the containers from which samples have been drawn. They should be managed in a manner to minimize the risk of mix-up and to protect the samples from adverse storage conditions. When containers are too small, the use of a qualified bar code or other means that permit access to this information should be considered. (Replaces PIC/S GMP Guide Part I Section 6.13)
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1408
          - source_label: PIC/S
            locator: line:1409
          - source_label: PIC/S
            locator: line:1410
          - source_label: PIC/S
            locator: line:1411
          - source_label: PIC/S
            locator: line:1412
          - source_label: PIC/S
            locator: line:1413
          - source_label: PIC/S
            locator: line:1414
          children: []
        - nid: ann2a.chaa.sec6.p6_5
          kind: paragraph
          kind_raw: '6.5'
          num: '6.5'
          ord: 147
          heading: null
          text: 'In line with requirements of Annex 19, a reference sample of a batch of starting material, raw materials, packaging material and finished product should be drawn. As a general principle, a reference sample should be of sufficient size to permit the carrying out on at least two occasions of the full analytical controls on the batch foreseen in the CTA or MA. In case of a continuous process, where the ATMP active substance will immediately be turned into the ATMP drug product, only a reference sample of the ATMP drug product needs to be drawn. However, it is acknowledged that drawing reference samples may not always be feasible


            Annex 2A Manufacture of advanced therapy medicinal products for human use


            due to scarcity of the materials or limited size of the batches (e.g. autologous products, allogeneic products in a matched donor scenario, products for ultrarare diseases, and products for use in first-in-man clinical trials with a very smallscale production). In these cases, alternative approaches should be justified and authorised in the corresponding CTA/MA.'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1416
          - source_label: PIC/S
            locator: line:1417
          - source_label: PIC/S
            locator: line:1418
          - source_label: PIC/S
            locator: line:1419
          - source_label: PIC/S
            locator: line:1420
          - source_label: PIC/S
            locator: line:1421
          - source_label: PIC/S
            locator: line:1422
          - source_label: PIC/S
            locator: line:1423
          - source_label: PIC/S
            locator: line:1428
          - source_label: PIC/S
            locator: line:1432
          - source_label: PIC/S
            locator: line:1433
          - source_label: PIC/S
            locator: line:1434
          - source_label: PIC/S
            locator: line:1435
          - source_label: PIC/S
            locator: line:1436
          children: []
        - nid: ann2a.chaa.sec6.p6_6
          kind: paragraph
          kind_raw: '6.6'
          num: '6.6'
          ord: 148
          heading: null
          text: Samples of the starting materials should generally be kept for two years after the batch release. However, it is acknowledged that the retention of samples may be challenging due to scarcity of the materials. Due to this intrinsic limitation, it is justified not to keep reference samples of the cells/tissues used as starting materials in the case of autologous ATMPs and certain allogeneic ATMPs (i.e. matched donor scenario). In other cases, where the scarcity of the materials is also a concern, the sampling strategy may be adapted based on risk assessment and appropriately implemented mitigation measures. For cases where the starting material is an established cell bank system, there is no need to keep cell bank vials specifically for the purpose of reference samples.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1438
          - source_label: PIC/S
            locator: line:1439
          - source_label: PIC/S
            locator: line:1440
          - source_label: PIC/S
            locator: line:1441
          - source_label: PIC/S
            locator: line:1442
          - source_label: PIC/S
            locator: line:1443
          - source_label: PIC/S
            locator: line:1444
          - source_label: PIC/S
            locator: line:1445
          - source_label: PIC/S
            locator: line:1446
          - source_label: PIC/S
            locator: line:1447
          children: []
        - nid: ann2a.chaa.sec6.p6_7
          kind: paragraph
          kind_raw: '6.7'
          num: '6.7'
          ord: 149
          heading: null
          text: In line with requirements of Annex 19, a sample of a fully packaged unit (retention sample) should be kept per batch for at least one year after the expiry date (national requirements might differ). A retention sample is, however, not expected in the case of autologous products or allogeneic products, where justified (e.g. in a matched donor scenario), as the unit produced with the patient’s tissues/cells constitutes what should be administered to the patient. When it is not possible to keep a retention sample, photographs or copies of the label are acceptable for inclusion in the batch records.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1449
          - source_label: PIC/S
            locator: line:1450
          - source_label: PIC/S
            locator: line:1451
          - source_label: PIC/S
            locator: line:1452
          - source_label: PIC/S
            locator: line:1453
          - source_label: PIC/S
            locator: line:1454
          - source_label: PIC/S
            locator: line:1455
          - source_label: PIC/S
            locator: line:1456
          children: []
        - nid: ann2a.chaa.sec6.p6_8
          kind: paragraph
          kind_raw: '6.8'
          num: '6.8'
          ord: 150
          heading: null
          text: 'Shorter retention periods as mentioned in Section 6.6 and 6.7 might be justified based on the stability and shelf life of the product. In cases of short shelf life, the manufacturer should consider if the retention of the sample under conditions that prolong the shelf life (such as cryopreservation) is representative for the intended purpose. For instance, cryopreservation of fresh-cells may render the sample inadequate for characterisation purposes but the sample may be adequate for sterility or viral safety controls (the volume of the samples can be reduced according to the intended purpose). When cryostorage of a sample is considered inadequate for the intended purpose, the manufacturer should consider alternative approaches that are scientifically justified.


            On-going stability programme'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1458
          - source_label: PIC/S
            locator: line:1459
          - source_label: PIC/S
            locator: line:1460
          - source_label: PIC/S
            locator: line:1461
          - source_label: PIC/S
            locator: line:1462
          - source_label: PIC/S
            locator: line:1463
          - source_label: PIC/S
            locator: line:1464
          - source_label: PIC/S
            locator: line:1465
          - source_label: PIC/S
            locator: line:1466
          - source_label: PIC/S
            locator: line:1467
          - source_label: PIC/S
            locator: line:1469
          children: []
        - nid: ann2a.chaa.sec6.p6_9
          kind: paragraph
          kind_raw: '6.9'
          num: '6.9'
          ord: 151
          heading: null
          text: 'The protocol for the on-going stability programme can be different from that of the initial long term stability study as submitted in the MA dossier provided that this is justified and documented in the protocol (e.g. the frequency of testing, or when updating to ICH/VICH recommendations). Stability studies on the reconstituted and thawed product are performed during product development and need not be monitored on an on-going basis. The use of surrogate materials (i.e. material derived from healthy volunteers) or alternative scientifically sounds approaches are acceptable in case of autologous products (or matched donor scenario) where the entire batch needs to be administered to the patient. (Replaces PIC/S GMP Guide Part I Section 6.31)


            Annex 2A Manufacture of advanced therapy medicinal products for human use


            Release'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1471
          - source_label: PIC/S
            locator: line:1472
          - source_label: PIC/S
            locator: line:1473
          - source_label: PIC/S
            locator: line:1474
          - source_label: PIC/S
            locator: line:1475
          - source_label: PIC/S
            locator: line:1476
          - source_label: PIC/S
            locator: line:1477
          - source_label: PIC/S
            locator: line:1478
          - source_label: PIC/S
            locator: line:1479
          - source_label: PIC/S
            locator: line:1480
          - source_label: PIC/S
            locator: line:1486
          - source_label: PIC/S
            locator: line:1490
          children: []
        - nid: ann2a.chaa.sec6.p6_10
          kind: paragraph
          kind_raw: '6.10'
          num: '6.10'
          ord: 152
          heading: null
          text: In general, batches of ATMPs should only be released for sale or supply to the market after certification by an Authorised Person. The batch release specifications are not limited to analytical results (also refer to out of specification (OOS) results). In line with PIC/S GMP Guide Part I Sections 1.4 (xv), 2.6. and
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1492
          - source_label: PIC/S
            locator: line:1493
          - source_label: PIC/S
            locator: line:1494
          - source_label: PIC/S
            locator: line:1495
          children: []
        - nid: ann2a.chaa.sec6.p6_34
          kind: paragraph
          kind_raw: '6.34'
          num: '6.34'
          ord: 153
          heading: null
          text: the Authorised Person should assess the quality of each batch considering processing records, results from environmental monitoring, monitoring of process parameters, analytical results and all deviations from standard procedures and protocols. Until a batch is certified, it should remain at the site of manufacture or be shipped under quarantine to another site, which has been approved for that purpose by the relevant Competent Authority (if applicable) and is controlled appropriately within the manufacturer’s quality system. Generally, a finished product that does not meet release specifications should not be administered to a patient unless otherwise justified.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1496
          - source_label: PIC/S
            locator: line:1497
          - source_label: PIC/S
            locator: line:1498
          - source_label: PIC/S
            locator: line:1499
          - source_label: PIC/S
            locator: line:1500
          - source_label: PIC/S
            locator: line:1501
          - source_label: PIC/S
            locator: line:1502
          - source_label: PIC/S
            locator: line:1503
          - source_label: PIC/S
            locator: line:1504
          children: []
        - nid: ann2a.chaa.sec6.p6_11
          kind: paragraph
          kind_raw: '6.11'
          num: '6.11'
          ord: 154
          heading: null
          text: Where authorised by national law, the administration of a product that does not meet the release specification might be performed under exceptional circumstances (such as when there is no alternative treatment available that would provide the same therapeutic outcome and the administration of the failed products could be lifesaving).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1506
          - source_label: PIC/S
            locator: line:1507
          - source_label: PIC/S
            locator: line:1508
          - source_label: PIC/S
            locator: line:1509
          - source_label: PIC/S
            locator: line:1510
          children: []
        - nid: ann2a.chaa.sec6.p6_12
          kind: paragraph
          kind_raw: '6.12'
          num: '6.12'
          ord: 155
          heading: null
          text: 'In cases, referred to in point 6.11, where product does not meet release specification, the responsibility and the decision of the patient treatment are solely of the treating physician and are beyond the remit of this PIC/S annex. The Authorised Person, the MAH and/or the Sponsor of the clinical trial should consider the following in making the product available:


            The treating physician should provide in writing a rationale and/or request to the Authorised Person and MAH.'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1512
          - source_label: PIC/S
            locator: line:1513
          - source_label: PIC/S
            locator: line:1514
          - source_label: PIC/S
            locator: line:1515
          - source_label: PIC/S
            locator: line:1516
          - source_label: PIC/S
            locator: line:1518
          - source_label: PIC/S
            locator: line:1519
          children:
          - nid: ann2a.chaa.sec6.p6_12.ia
            kind: item
            kind_raw: (a)
            num: a
            ord: 156
            heading: null
            text: Batch manufacturing records and documentation provided to the treating physician should clearly state that the batch has failed the release specifications and describe the parameters that have not been met.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1521
            - source_label: PIC/S
              locator: line:1522
            - source_label: PIC/S
              locator: line:1523
            children: []
          - nid: ann2a.chaa.sec6.p6_12.ib
            kind: item
            kind_raw: (b)
            num: b
            ord: 157
            heading: null
            text: When responding to a treating physician’s request, the MAH should provide its evaluation of the risks of product administration. However, it is solely the physician’s decision to administer the finished product that does not meet release specifications.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1525
            - source_label: PIC/S
              locator: line:1526
            - source_label: PIC/S
              locator: line:1527
            - source_label: PIC/S
              locator: line:1528
            children: []
          - nid: ann2a.chaa.sec6.p6_12.ic
            kind: item
            kind_raw: (c)
            num: c
            ord: 158
            heading: null
            text: The Authorised Person (or delegate) should report the supply of the product to the relevant Competent Authorities, on behalf of the MAH in accordance with their legal obligations.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1530
            - source_label: PIC/S
              locator: line:1531
            - source_label: PIC/S
              locator: line:1532
            children: []
        - nid: ann2a.chaa.sec6.p6_13
          kind: paragraph
          kind_raw: '6.13'
          num: '6.13'
          ord: 159
          heading: null
          text: 'The clinical trial Sponsor or MAH should have procedures in place that describe steps to be taken if product does not meet release specification but may be released to permit treatment. Individual instances that do not meet release specifications may be addressed through lot-by-lot release programmes and specific case-by-case, risk-based assessments, where such programs exist within national law.


            Annex 2A Manufacture of advanced therapy medicinal products for human use'
          role: normative
