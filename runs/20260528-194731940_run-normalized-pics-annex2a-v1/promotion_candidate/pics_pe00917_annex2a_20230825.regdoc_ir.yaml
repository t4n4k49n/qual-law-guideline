          kind: paragraph
          kind_raw: '2.2'
          num: '2.2'
          ord: 29
          heading: null
          text: Any changes in the health status of personnel, which could adversely affect the quality of the product, should prevent work in the production area. Health monitoring of staff should be commensurate with the risk; medical advice should be sought for personnel involved with hazardous organisms. General consideration should be given to Occupational Health & Safety (OH&S) for personnel involved with hazardous substances as required by national law.
