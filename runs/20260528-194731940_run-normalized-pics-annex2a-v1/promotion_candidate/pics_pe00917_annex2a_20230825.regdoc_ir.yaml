            children: []
          - nid: ann2a.chaa.sec5.p5_23.ig
            kind: item
            kind_raw: (g)
            num: g
            ord: 117
            heading: null
            text: Incorporate the PRP into the CTA or MA as applicable.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
