          kind: paragraph
          kind_raw: '5.19'
          num: '5.19'
          ord: 101
          heading: null
          text: 'During process validation potential limited availability of quantities of tissue/cells has to be taken into account. A strategy on gaining maximum process knowledge has to be implemented.


            Validation studies should be conducted in accordance with defined procedures. Results and conclusions should be recorded, in particular:'
          role: normative
          normativity: must
          tags: []
          refs:
