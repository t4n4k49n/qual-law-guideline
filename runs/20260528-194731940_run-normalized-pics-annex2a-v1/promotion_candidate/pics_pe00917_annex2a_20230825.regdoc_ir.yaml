            children: []
          - nid: ann2a.chaa.sec5.p5_19.ib
            kind: item
            kind_raw: (b)
            num: b
            ord: 103
            heading: null
            text: For all aseptic processes, aseptic process simulations should be performed as part of initial validation and repeated thereafter every six months in line with Annex 1. In the case of infrequent production (i.e. if the interval between the production of two batches is more than six months but less than a year), it is acceptable that the process simulation test is done prior to manufacturing of the next batch. This is provided that, the results of the process simulation test are available prior to the starting of production. Any deviation from this approach needs to be thoroughly justified by QRM principles considering all aspects of product nature, product quality and patient safety.
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
