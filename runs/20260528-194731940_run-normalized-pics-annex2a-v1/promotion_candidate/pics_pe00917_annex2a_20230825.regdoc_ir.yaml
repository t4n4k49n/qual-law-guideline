            ord: 104
            heading: null
            text: If the ATMP is not produced on a routine basis (i.e. over a year), the aseptic process simulation should be conducted at least in triplicate prior to the start of manufacturing, involving all relevant operators. QRM principles should be applied in accordance with Annex 1. Any deviation from this approach needs to be thoroughly justified by QRM principles considering all aspects of product nature, product quality and patient safety.
            role: normative
            normativity: must
            tags: []
