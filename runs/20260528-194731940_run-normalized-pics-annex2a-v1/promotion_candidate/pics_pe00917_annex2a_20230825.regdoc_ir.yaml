            num: i
            ord: 87
            heading: null
            text: 'analytical capabilities relative to the relevant limits established from the evaluation of the products.


              The outcome of the QRM process should be the basis for determining the process workflow and necessity for and extent to which premises and equipment should be dedicated or single use systems should be used for a particular product. This may include dedicating specific product contact parts or dedication of the entire manufacturing facility. It may be acceptable to confine manufacturing activities to a segregated, self-contained production area within a multiproduct facility, where justified. Results should be reviewed jointly with the CCS. (Replaces PIC/S GMP Guide Part I Section 5.20)'
            role: normative
