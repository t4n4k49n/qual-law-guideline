            locator: line:685
          - source_label: PIC/S
            locator: line:686
          - source_label: PIC/S
            locator: line:687
          - source_label: PIC/S
            locator: line:688
          children: []
        - nid: ann2a.chaa.sec4.p4_5
          kind: paragraph
          kind_raw: '4.5'
          num: '4.5'
          ord: 62
          heading: null
          text: A system that enables the bidirectional tracking of cells/tissues contained in ATMPs from the point of donation, through manufacturing, to the delivery of the finished product to the recipient should be created. This system can be manual or automated. It should be used throughout the manufacturing lifecycle to include clinical trial and commercial batches.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:690
          - source_label: PIC/S
            locator: line:691
          - source_label: PIC/S
            locator: line:692
          - source_label: PIC/S
            locator: line:693
          - source_label: PIC/S
            locator: line:694
          children: []
        - nid: ann2a.chaa.sec4.p4_6
          kind: paragraph
          kind_raw: '4.6'
          num: '4.6'
          ord: 63
          heading: null
          text: Traceability records should be kept as an auditable document and unequivocally linked to the relevant batch record. The storage system should ensure that traceability data allow for easy access, in case of an adverse reaction from the patient.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:696
          - source_label: PIC/S
            locator: line:697
          - source_label: PIC/S
            locator: line:698
          - source_label: PIC/S
            locator: line:699
          children: []
        - nid: ann2a.chaa.sec4.p4_7
          kind: paragraph
          kind_raw: '4.7'
          num: '4.7'
          ord: 64
          heading: null
          text: 'Traceability records for cellular and tissue-based products and for any personalized ATMP must be retained 30 years after the expiry date of the product unless otherwise specified in the MA/CTA or national law. Particular care should be taken to maintain the traceability of products for special use cases, such as donor-matched cells. National requirements applied to blood components in regard to traceability requirements and notification of serious adverse reactions and events apply to blood components when they are used as starting or raw materials in the manufacturing process of medicinal products. Human cells


            Annex 2A Manufacture of advanced therapy medicinal products for human use


            including haematopoietic cells must comply with the principles laid down in national law concerning traceability.'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:701
          - source_label: PIC/S
            locator: line:702
          - source_label: PIC/S
            locator: line:703
          - source_label: PIC/S
            locator: line:704
          - source_label: PIC/S
            locator: line:705
          - source_label: PIC/S
            locator: line:706
          - source_label: PIC/S
            locator: line:707
          - source_label: PIC/S
            locator: line:708
          - source_label: PIC/S
            locator: line:714
          - source_label: PIC/S
            locator: line:718
          - source_label: PIC/S
            locator: line:719
          children: []
        - nid: ann2a.chaa.sec4.p4_8
          kind: paragraph
          kind_raw: '4.8'
          num: '4.8'
          ord: 65
          heading: null
          text: When xenogeneic cells are used as starting materials for ATMPs, information permitting the identification of the donor animal should be kept for 30 years unless otherwise specified in the MA/CTA or national legislation.
          role: normative
          normativity: must
          tags: []
          refs:
