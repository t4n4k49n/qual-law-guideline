        children:
        - nid: ann2a.chaa.sec5.p5_1
          kind: paragraph
          kind_raw: '5.1'
          num: '5.1'
          ord: 67
          heading: null
          text: 'ATMPs must comply with the applicable national requirements on minimising the risk of transmitting animal spongiform encephalopathy agents via human and veterinary medicinal products.


            Viral safety for gene therapy ATMPs should be ensured by having systems in place that ensure the quality of starting (including cell banks and viral seed stocks) and raw materials through the production process.'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:728
          - source_label: PIC/S
            locator: line:729
          - source_label: PIC/S
            locator: line:730
          - source_label: PIC/S
            locator: line:732
          - source_label: PIC/S
            locator: line:733
          - source_label: PIC/S
            locator: line:734
          children: []
        - nid: ann2a.chaa.sec5.p5_2
          kind: paragraph
          kind_raw: '5.2'
          num: '5.2'
          ord: 68
          heading: null
          text: The conditions for sample collection, additions and transfers involving replication competent vectors or materials from infected donors should prevent the release of viral/infected material.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:736
          - source_label: PIC/S
            locator: line:737
          - source_label: PIC/S
            locator: line:738
          children: []
        - nid: ann2a.chaa.sec5.p5_3
          kind: paragraph
          kind_raw: '5.3'
          num: '5.3'
          ord: 69
          heading: null
          text: At every stage of processing, materials and products should be protected from microbial and any other contamination. Appropriate contamination control and monitoring strategies should be implemented (refer to Section 3.4 CCS). Particular consideration should be given to the risk of cross-contamination between cell preparations from different donors and, where applicable, from donors having different positive serological markers. (Replaces PIC/S GMP Guide Part I Section 5.10)
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:740
          - source_label: PIC/S
            locator: line:741
          - source_label: PIC/S
            locator: line:742
          - source_label: PIC/S
            locator: line:743
          - source_label: PIC/S
            locator: line:744
          - source_label: PIC/S
            locator: line:745
          - source_label: PIC/S
            locator: line:746
          children: []
        - nid: ann2a.chaa.sec5.p5_4
          kind: paragraph
          kind_raw: '5.4'
          num: '5.4'
          ord: 70
          heading: null
          text: The use of antimicrobials may be necessary to reduce bioburden associated with the procurement of living tissues and cells. However, the use of antimicrobials does not replace the requirement for aseptic manufacturing. When antimicrobials are used, their use should be recorded; they should be removed as soon as possible, unless the presence thereof in the finished product is specifically foreseen in the CTA or MA (e.g. antibiotics that are part of the matrix of the finished product). Additionally, it is important to ensure that antimicrobials do not interfere with any product microbial contamination testing or sterility testing, and that they are not present in the finished product (unless specifically justified in the CTA or MA).
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:748
          - source_label: PIC/S
            locator: line:749
          - source_label: PIC/S
            locator: line:750
          - source_label: PIC/S
            locator: line:751
          - source_label: PIC/S
            locator: line:752
          - source_label: PIC/S
            locator: line:753
          - source_label: PIC/S
            locator: line:754
          - source_label: PIC/S
            locator: line:755
          - source_label: PIC/S
            locator: line:756
          - source_label: PIC/S
            locator: line:757
          children: []
        - nid: ann2a.chaa.sec5.p5_5
          kind: paragraph
          kind_raw: '5.5'
          num: '5.5'
          ord: 71
          heading: null
          text: 'Labels applied to containers, equipment or premises should be clear, well defined and in the manufacturer’s agreed format.


            Care should be taken in the preparation, printing, storage and application of labels, including any specific text for patient-specific or autologous product. For products containing cells derived from human cells or tissue, donor’s labels should contain all relevant information that is needed to provide full traceability. In the case of autologous products, the unique patient identifier and the statement “for autologous use only” should be indicated on the outer packaging or, where


            Annex 2A Manufacture of advanced therapy medicinal products for human use


            there is no outer packaging, on the immediate packaging or as otherwise specified in national law.


            Alternative approaches/measures are permitted as long as the risk of erroneous administration of the product is adequately mitigated. For investigational ATMPs that are blinded, the requirement to state “autologous use” can be substituted by a barcode or an alternative equivalent mechanism that ensures blinding while maintaining patient safety. (Replaces PIC/S GMP Guide Part I Section 5.13)'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:759
          - source_label: PIC/S
            locator: line:760
          - source_label: PIC/S
            locator: line:762
          - source_label: PIC/S
            locator: line:763
          - source_label: PIC/S
            locator: line:764
          - source_label: PIC/S
            locator: line:765
          - source_label: PIC/S
            locator: line:766
          - source_label: PIC/S
            locator: line:767
          - source_label: PIC/S
            locator: line:773
          - source_label: PIC/S
