        - nid: ann2a.chaa.sec4.p4_2
          kind: paragraph
          kind_raw: '4.2'
          num: '4.2'
          ord: 59
          heading: null
          text: 'Some products may require specific definition of what materials constitute a batch. For autologous and donor-matched situations, the manufactured product should be viewed as a batch.


            Traceability'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:673
          - source_label: PIC/S
            locator: line:674
          - source_label: PIC/S
            locator: line:675
          - source_label: PIC/S
            locator: line:677
          children: []
        - nid: ann2a.chaa.sec4.p4_3
          kind: paragraph
          kind_raw: '4.3'
          num: '4.3'
          ord: 60
          heading: null
          text: Where human cells or tissues are used, full traceability is required from starting and raw materials, including all substances coming into contact with the cells or tissues through to confirmation of the receipt of the products at the point of use whilst maintaining the privacy of individuals and confidentiality of health-related information, according to national legislation.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
