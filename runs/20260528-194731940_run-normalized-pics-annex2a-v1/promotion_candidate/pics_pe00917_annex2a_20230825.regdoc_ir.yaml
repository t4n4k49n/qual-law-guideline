          ord: 92
          heading: null
          text: In all manufacturing steps that may lead to unwanted formation of aerosols (e.g. centrifugation, working under vacuum, homogenisation, and sonication) appropriate mitigation measures should be implemented to avoid cross-contamination. Special precautions should be taken when working with infectious materials.
