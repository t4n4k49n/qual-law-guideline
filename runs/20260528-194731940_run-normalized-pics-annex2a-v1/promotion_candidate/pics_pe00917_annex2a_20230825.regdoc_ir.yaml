          num: '6.14'
          ord: 160
          heading: null
          text: 'For ATMPs with a short shelf life, where established analytical tests might not permit batch certification prior to product administration, alternative methods of obtaining equivalent data should be considered (e.g. rapid microbiological methods).


            Subject to approval from the Competent Authority, batch certification of short shelf life products performed prior to completion of all product quality control is permitted when the testing timelines would not allow for effective distribution to a patient.'
