          - source_label: PIC/S
            locator: line:651
          - source_label: PIC/S
            locator: line:655
          children: []
        - nid: ann2a.chaa.sec3.p3_19
          kind: paragraph
          kind_raw: '3.19'
          num: '3.19'
          ord: 56
          heading: null
          text: Electronic systems used to support manufacturing must be qualified in accordance with Annex 11 and 15. Any analytical testing performed on materials not used in manufacturing but that support bioinformatics informing the manufacturing process (e.g. patient gene sequencing) should be validated. Such analytical equipment is expected to be qualified prior to use.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
