          kind: paragraph
          kind_raw: '5.16'
          num: '5.16'
          ord: 91
          heading: null
          text: The risks of cross-contamination should be assessed having regard to the characteristics of the product (e.g. biological characteristics of the starting materials, possibility to withstand purification techniques) and manufacturing process (e.g. the use of processes that provide extraneous microbial contaminants the opportunity to grow). For ATMPs that cannot be sterilised, any open processing (e.g. filling) must be conducted aseptically to minimise the introduction of contaminants.
          role: normative
          normativity: must
