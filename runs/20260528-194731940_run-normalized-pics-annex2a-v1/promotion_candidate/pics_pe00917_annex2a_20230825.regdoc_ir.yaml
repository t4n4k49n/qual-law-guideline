              locator: line:1197
            children: []
        - nid: ann2a.chaa.sec5.p5_24
          kind: paragraph
          kind_raw: '5.24'
          num: '5.24'
          ord: 119
          heading: null
          text: Particular attention should be paid to avoiding contamination and to minimising the variability of the materials. Specifications related to the product (such as those in pharmacopoeial monographs, CTA, or MA), will dictate whether and to what stage substances and materials can have a defined level of bioburden or need to be sterile.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1199
          - source_label: PIC/S
            locator: line:1200
          - source_label: PIC/S
            locator: line:1201
          - source_label: PIC/S
            locator: line:1202
          - source_label: PIC/S
            locator: line:1203
          children: []
        - nid: ann2a.chaa.sec5.p5_25
          kind: paragraph
          kind_raw: '5.25'
          num: '5.25'
          ord: 120
          heading: null
          text: For products where final sterilisation is not possible and the ability to remove microbial by-products is limited, the controls required for the quality of materials and on the aseptic manufacturing process assume greater importance. Where a CTA or MA provides for an allowable type and level of bioburden, for example at the ATMP active substance stage, the control strategy should address the means by which this is maintained within the specified limits.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1205
          - source_label: PIC/S
            locator: line:1206
          - source_label: PIC/S
            locator: line:1207
          - source_label: PIC/S
            locator: line:1208
          - source_label: PIC/S
            locator: line:1209
          - source_label: PIC/S
            locator: line:1210
          children: []
        - nid: ann2a.chaa.sec5.p5_26
          kind: paragraph
          kind_raw: '5.26'
          num: '5.26'
          ord: 121
          heading: null
          text: The selection, qualification, approval and maintenance of suppliers of starting materials, raw materials and materials that come in direct contact with the products during manufacture and storage (e.g. single use systems) together with their purchase and acceptance should be documented as part of the pharmaceutical quality system. The level of oversight should be proportionate to the risks posed by the individual materials taking account of their source, manufacturing process, supply chain complexity and the final use to which the material is put in the ATMP. The supporting evidence for each supplier / material approval should be maintained. Personnel involved in these activities should have a current knowledge of the suppliers, the supply chain and the associated risks involved. Where possible, these materials should be purchased directly from the manufacturer or a manufacturer approved supplier. (Replaces PIC/S GMP Guide Part I Section 5.27)
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1212
          - source_label: PIC/S
            locator: line:1213
          - source_label: PIC/S
            locator: line:1214
          - source_label: PIC/S
            locator: line:1215
          - source_label: PIC/S
            locator: line:1216
          - source_label: PIC/S
            locator: line:1217
          - source_label: PIC/S
            locator: line:1218
          - source_label: PIC/S
            locator: line:1219
          - source_label: PIC/S
            locator: line:1220
          - source_label: PIC/S
            locator: line:1221
          - source_label: PIC/S
            locator: line:1222
          - source_label: PIC/S
            locator: line:1223
          - source_label: PIC/S
            locator: line:1224
          children: []
        - nid: ann2a.chaa.sec5.p5_27
          kind: paragraph
          kind_raw: '5.27'
          num: '5.27'
          ord: 122
          heading: null
          text: For starting material of human origin, the agreement between the ATMP manufacturer (or, as appropriate, the MAH) and the supplier (including blood and tissue establishments) should contain clear provisions about the transfer of information. In particular, this should include test results performed by the supplier, traceability data, and transmission of health donor information that may become available after the supply that may have an impact on the quality or safety of the ATMPs manufactured. National laws that are required as part of the donation and procurement of human blood and blood components, haematopoietic progenitor cells, human tissues and cells for manufacturing purposes need to be adhered to. (Replaces PIC/S GMP Guide Part I Section 5.28)
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1226
          - source_label: PIC/S
            locator: line:1227
          - source_label: PIC/S
            locator: line:1228
          - source_label: PIC/S
            locator: line:1229
          - source_label: PIC/S
            locator: line:1230
          - source_label: PIC/S
            locator: line:1231
          - source_label: PIC/S
            locator: line:1232
          - source_label: PIC/S
            locator: line:1233
          - source_label: PIC/S
            locator: line:1234
          - source_label: PIC/S
            locator: line:1235
          - source_label: PIC/S
            locator: line:1236
          children: []
        - nid: ann2a.chaa.sec5.p5_28
          kind: paragraph
          kind_raw: '5.28'
          num: '5.28'
          ord: 123
          heading: null
          text: 'The quality requirements established by the manufacturer in the MA or CTA for materials classified as critical during QRM process (according to PRP profile) should be discussed and agreed with the suppliers during the product life cycle. Appropriate aspects of the production, testing and control, including handling, labelling, packaging and distribution requirements, complaints, recalls and rejection procedures should be documented in a formal quality agreement. (Replaces PIC/S GMP Guide Part I Section 5.28)


            Annex 2A Manufacture of advanced therapy medicinal products for human use


            Human Blood, Tissues and Cells Used as Starting Materials'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1238
          - source_label: PIC/S
            locator: line:1239
          - source_label: PIC/S
            locator: line:1240
          - source_label: PIC/S
            locator: line:1241
          - source_label: PIC/S
            locator: line:1242
          - source_label: PIC/S
            locator: line:1243
          - source_label: PIC/S
            locator: line:1244
          - source_label: PIC/S
            locator: line:1250
          - source_label: PIC/S
            locator: line:1254
          children: []
        - nid: ann2a.chaa.sec5.p5_29
          kind: paragraph
          kind_raw: '5.29'
          num: '5.29'
          ord: 124
          heading: null
          text: The donation, procurement and testing of human blood, tissues and cells used as starting materials for ATMPs should be in accordance with the applicable national law.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1256
          - source_label: PIC/S
            locator: line:1257
          - source_label: PIC/S
            locator: line:1258
          children:
          - nid: ann2a.chaa.sec5.p5_29.ia
            kind: item
            kind_raw: (a)
            num: a
            ord: 125
            heading: null
            text: "The procurement, donation and testing of blood, cells and tissues is\n             regulated in some countries. Such supply sites must hold appropriate\n             approvals from the Competent Authority(ies) which should be verified as\n             part of supplier management."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1260
            - source_label: PIC/S
              locator: line:1261
            - source_label: PIC/S
              locator: line:1262
            - source_label: PIC/S
              locator: line:1263
            children: []
          - nid: ann2a.chaa.sec5.p5_29.ib
            kind: item
            kind_raw: (b)
            num: b
            ord: 126
            heading: null
            text: "For cell therapies, the maintenance of the aseptic processing from time of\n             procurement of cells through manufacturing and administration back into\n             the patient should be ensured."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1265
            - source_label: PIC/S
              locator: line:1266
            - source_label: PIC/S
              locator: line:1267
            children: []
          - nid: ann2a.chaa.sec5.p5_29.ic
            kind: item
            kind_raw: (c)
            num: c
            ord: 127
            heading: null
            text: "Where such human cells or tissues are imported, they must meet\n             equivalent national standards of quality and safety. The traceability and\n             serious adverse reaction and serious adverse event notification\n             requirements may be set out in national law."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1269
            - source_label: PIC/S
              locator: line:1270
            - source_label: PIC/S
              locator: line:1271
            - source_label: PIC/S
              locator: line:1272
            children: []
          - nid: ann2a.chaa.sec5.p5_29.id
            kind: item
            kind_raw: (d)
            num: d
            ord: 128
            heading: null
            text: "There may be some instances where processing of blood, tissues and cells\n             used as starting materials for ATMPs will be conducted at blood or tissue\n             establishments. This is permissible only if authorised by national law (e.g.\n             the material would be otherwise compromised and processing involves only\n             minimal manipulation)."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1274
            - source_label: PIC/S
              locator: line:1275
            - source_label: PIC/S
              locator: line:1276
            - source_label: PIC/S
              locator: line:1277
            - source_label: PIC/S
              locator: line:1278
            children: []
          - nid: ann2a.chaa.sec5.p5_29.ie
            kind: item
            kind_raw: (e)
            num: e
            ord: 129
            heading: null
            text: "Blood, tissue and cells are released by the Responsible Person (RP) in the\n             blood or tissue establishment before shipment to the ATMP manufacturer.\n             After that, normal medicinal product starting material controls apply. The\n             test results of all tissues / cells supplied by the tissue establishment should\n             be available to the manufacturer of the medicinal product. Such information\n             must be used to make appropriate material segregation and storage\n             decisions. In cases where manufacturing must be initiated prior to receiving\n             test results from the tissue establishment, tissue and cells may be shipped\n             to the medicinal product manufacturer, provided controls are in place to\n             prevent cross-contamination with tissue and cells that have been released\n             by the RP in the tissue establishment."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1280
            - source_label: PIC/S
              locator: line:1281
            - source_label: PIC/S
              locator: line:1282
            - source_label: PIC/S
              locator: line:1283
            - source_label: PIC/S
              locator: line:1284
            - source_label: PIC/S
              locator: line:1285
            - source_label: PIC/S
              locator: line:1286
            - source_label: PIC/S
              locator: line:1287
            - source_label: PIC/S
              locator: line:1288
            - source_label: PIC/S
              locator: line:1289
            - source_label: PIC/S
              locator: line:1290
            children: []
          - nid: ann2a.chaa.sec5.p5_29.if
            kind: item
            kind_raw: (f)
            num: f
            ord: 130
            heading: null
            text: "A technical agreement clearly defining the responsibilities should be in\n             place between all involved parties (e.g. manufacturers, tissue\n             establishment, sponsors, MAH)."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1292
            - source_label: PIC/S
              locator: line:1293
            - source_label: PIC/S
              locator: line:1294
            children: []
          - nid: ann2a.chaa.sec5.p5_29.ig
            kind: item
            kind_raw: (g)
            num: g
            ord: 131
            heading: null
            text: "The transport of blood, tissues and cells to the manufacturing site must be\n             controlled by a written agreement between the responsible parties. The\n             manufacturing sites should have documentary evidence of adherence to\n             the specified storage and transport conditions."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1296
            - source_label: PIC/S
              locator: line:1297
            - source_label: PIC/S
              locator: line:1298
            - source_label: PIC/S
              locator: line:1299
            children: []
          - nid: ann2a.chaa.sec5.p5_29.ih
            kind: item
            kind_raw: (h)
            num: h
            ord: 132
            heading: null
            text: "Continuation of traceability requirements started at tissue establishments\n             through to the recipient(s), and vice versa, including materials in contact\n             with the cells or tissues should be maintained.\nAnnex 2A Manufacture of advanced therapy medicinal products for human use\n\nSeed Lot and Cell Bank System"
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1301
            - source_label: PIC/S
              locator: line:1302
            - source_label: PIC/S
              locator: line:1303
            - source_label: PIC/S
              locator: line:1309
            - source_label: PIC/S
              locator: line:1313
            children: []
        - nid: ann2a.chaa.sec5.p5_30
          kind: paragraph
          kind_raw: '5.30'
          num: '5.30'
          ord: 133
          heading: null
          text: A system of master and working virus seed lots and/or cell banks is recommended if the production of allogeneic ATMP involves cell culture or propagation in embryos and animals. This can prevent the unwanted drift of properties, which might ensue from repeated subcultures or multiple generations.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1315
          - source_label: PIC/S
            locator: line:1316
          - source_label: PIC/S
            locator: line:1317
          - source_label: PIC/S
            locator: line:1318
          children: []
        - nid: ann2a.chaa.sec5.p5_31
          kind: paragraph
          kind_raw: '5.31'
          num: '5.31'
          ord: 134
          heading: null
          text: The number of generations (doublings, passages) between the seed lot or cell bank, the active substance and finished product should be consistent with specifications in the MA or CTA.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1320
          - source_label: PIC/S
            locator: line:1321
          - source_label: PIC/S
            locator: line:1322
          children: []
        - nid: ann2a.chaa.sec5.p5_32
          kind: paragraph
          kind_raw: '5.32'
          num: '5.32'
          ord: 135
          heading: null
          text: As part of product lifecycle management, establishment of seed lots and cell banks, including master and working generations, as well as maintenance and storage, should be performed under appropriate GMP conditions. This should include an appropriately controlled environment to protect the seed lot and the cell bank and the personnel handling it. During the establishment of the seed lot and cell bank, no other living or infectious material (e.g. virus, cell lines or cell strains) should be handled simultaneously in the same area or by the same persons. For all stages prior to the establishment of the master seed or cell bank generation, principles of GMP may be applied. For all pre-master bank stages, documentation should be available to support traceability. All issues related to components used during the development with potential impact on product safety (e.g. reagents of biological origin) from initial sourcing and genetic development should be documented.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:1324
          - source_label: PIC/S
            locator: line:1325
