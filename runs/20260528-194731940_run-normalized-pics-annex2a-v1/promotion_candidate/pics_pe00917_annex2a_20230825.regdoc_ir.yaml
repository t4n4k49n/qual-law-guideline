        - nid: ann2a.chaa.sec8.p8_3
          kind: paragraph
          kind_raw: '8.3'
          num: '8.3'
          ord: 187
          heading: null
          text: 'In order to test the robustness of the recall procedure (or healthcare professional notification) consideration should be given to performing mock recall or mock transmission of appropriate information to healthcare professionals. Such evaluations should extend to both within office-hour situations as well as out-ofoffice hour situations.


            The frequency of the mock recall (or mock transmission of appropriate information to healthcare professionals) should be justified by the manufacturer considering factors such as the stage of the product development and the complexity of the supply. For authorised products, a yearly frequency is recommended unless otherwise justified.


            (Replaces PICS GMP Guide Part I Section 8.30)


