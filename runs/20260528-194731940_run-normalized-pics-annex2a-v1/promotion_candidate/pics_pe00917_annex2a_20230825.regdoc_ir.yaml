          children:
          - nid: ann2a.chaa.sec6.p6_16.ia
            kind: item
            kind_raw: (a)
            num: a
            ord: 168
            heading: null
            text: "A \"responsible site\", should be identified. The responsible site is responsible for the oversight of the decentralised sites. During the product life cycle, the responsible site:\n              i.   must have availability of an Authorised Person;\n              ii. must ensure that those involved in the batch certification and release\n                  process are adequately qualified and trained for their tasks;\n              iii. should perform audits to confirm compliance with the batch certification\n                   and release process (as descripted in SOP);\n              iv. must ensure that there is a written contract/technical agreement\n                  between the responsible site and the decentralised sites establishing\n                  the responsibilities of each party, and\n              v. must ensure that there are written arrangements to:"
            role: normative
            normativity: must
