          num: '4.1'
          ord: 58
          heading: null
          text: Specifications for ATMP starting and raw materials may need additional documentation on the source, origin, distribution chain, method of manufacture, and controls applied, to assure an appropriate level of control and oversight including their microbiological quality.
          role: normative
          normativity: must
          tags: []
