          num: B2.6
          ord: 203
          heading: null
          text: 'If the manufacturing of the vectors is outsourced, the ATMP manufacturer should assess the risk presented by the vector to the quality and safety of the ATMP and thereby select a suitable vector supplier that is able to comply with the GMP standards required by national legislation.


            The appropriate sections of Annex 2A and elements of Part II of the PIC/S GMP Guide relevant for the specific product should be determined in the agreement between the ATMP manufacturer and the vector manufacturer and cover relevant aspects (e.g. quality management, documentation, raw materials, cell banks, production, testing and control, storage, and other aspects of handling and distribution, as appropriate). In addition the vector manufacturer should be part of the ATMP manufacturer’s vendor qualification programme. The level of supervision and further testing by the ATMP manufacturer should be proportionate to the risks posed by the individual materials.'
