            locator: line:803
          children: []
        - nid: ann2a.chaa.sec5.p5_9
          kind: paragraph
          kind_raw: '5.9'
          num: '5.9'
          ord: 75
          heading: null
          text: Where chromatography equipment is used, a suitable control strategy for matrices, the housings and associated equipment (adapted to the risks) should be implemented when used in campaign manufacture and in multi-product environments. The re-use of the same matrix at different stages of processing is discouraged due to risk of carryover contamination. Any such re-usage should be supported by appropriate validation data. Acceptance criteria, operating conditions, regeneration methods, life span, and sanitization or sterilisation methods of chromatography columns should be defined.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:805
          - source_label: PIC/S
            locator: line:806
          - source_label: PIC/S
            locator: line:807
          - source_label: PIC/S
            locator: line:808
          - source_label: PIC/S
            locator: line:809
          - source_label: PIC/S
            locator: line:810
          - source_label: PIC/S
            locator: line:811
          - source_label: PIC/S
            locator: line:812
          children: []
        - nid: ann2a.chaa.sec5.p5_10
          kind: paragraph
          kind_raw: '5.10'
          num: '5.10'
          ord: 76
          heading: null
          text: Careful attention should be paid to specific requirements at any cryopreservation stages, e.g. the rate of temperature change during freezing or thawing. The type of storage chamber, placement and retrieval process should minimise the risk of cross-contamination, maintain the quality of the products and facilitate their accurate retrieval. Documented procedures should be in place for the secure handling and storage of products with positive serological markers.
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
          - source_label: PIC/S
            locator: line:814
          - source_label: PIC/S
            locator: line:815
          - source_label: PIC/S
            locator: line:816
          - source_label: PIC/S
            locator: line:817
          - source_label: PIC/S
            locator: line:818
          - source_label: PIC/S
            locator: line:819
          children: []
        - nid: ann2a.chaa.sec5.p5_11
          kind: paragraph
          kind_raw: '5.11'
          num: '5.11'
          ord: 77
          heading: null
          text: 'The suitability of selected packaging material should be considered. The adhesiveness, durability and legibility of printed text of labels used for containers that are stored at ultra-low temperatures (- 60 °C or lower) should be verified. Additionally, apply a holistic approach to minimize the risk to container closure integrity (CCI) that can occur during storage at ultra-low temperatures. Evidence-based data should be generated to support the selection of the appropriate primary packaging components and qualification of the container/closure sealing process.


            Annex 2A Manufacture of advanced therapy medicinal products for human use


            Prevention of Cross-contamination in Production'
          role: normative
          normativity: must
          tags: []
          refs:
            internal: []
            external: []
          source_spans:
