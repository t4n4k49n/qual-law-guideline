            locator: line:837
          children: []
        - nid: ann2a.chaa.sec5.p5_12
          kind: paragraph
          kind_raw: '5.12'
          num: '5.12'
          ord: 78
          heading: null
          text: 'An evidence-based QRM process should be used to assess and control the cross-contamination risks presented by the products manufactured. Factors to take into account include:'
