          text: 'ATMPs are not sold or supplied before an Authorised Person has certified that each production batch has been produced and controlled in accordance with the requirements of the CTA, MA and any other regulations relevant to the production, control and release of medicinal products as applicable. Special provisions apply for the supply of products that have a two-step release process (described in Section 6.14) or such that do not meet release specifications where there is no alternative treatment available (described in Sections 6.11 to 6.13). (Replaces PIC/S GMP Guide Part I Section 1.4, xv)


