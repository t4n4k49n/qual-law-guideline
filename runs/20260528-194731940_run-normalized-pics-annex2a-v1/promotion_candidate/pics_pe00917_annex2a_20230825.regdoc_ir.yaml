            kind: item
            kind_raw: (e)
            num: e
            ord: 106
            heading: null
            text: 'Where possible, consideration should be given to complementing the use of surrogate materials with samples from the actual starting materials for key aspects of the manufacturing process. For instance, in the case of an ATMP based on modification of autologous cells to treat a genetic disorder, process validation using the autologous cells (affected by the condition) may be limited to those parts of the process that focus on the genetic modification itself. Other aspects could be validated using a representative surrogate cell type. (Replaces PIC/S GMP Guide Part I Section 5.23)


              Control of different types of materials including ATMP Active Substances'
