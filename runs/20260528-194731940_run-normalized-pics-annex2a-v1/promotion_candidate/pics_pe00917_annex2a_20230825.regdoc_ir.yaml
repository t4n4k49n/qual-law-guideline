          num: '5.15'
          ord: 90
          heading: null
          text: 'If obviously contaminated, such as by spills or aerosols, or if a potential hazardous organism is involved, production and control materials, including


            Annex 2A Manufacture of advanced therapy medicinal products for human use


            paperwork, must be adequately disinfected, or the information transferred out by other means. An assessment of the impact on the immediate products and any others in the affected area should also be made.'
