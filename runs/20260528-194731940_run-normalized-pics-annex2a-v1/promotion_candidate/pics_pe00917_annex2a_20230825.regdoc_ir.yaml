            - source_label: PIC/S
              locator: line:1166
            children: []
          - nid: ann2a.chaa.sec5.p5_23.if
            kind: item
            kind_raw: (f)
            num: f
            ord: 116
            heading: null
            text: "Once the PRP and the appropriate GMP have been defined, ongoing risk review should be performed through mechanisms such as:\n              i.   number of defects connected to batches of respective material\n                   received;\n              ii. type/severity of such defects;\n              iii. monitoring and trend analysis of material quality;\n              iv. observation of trends in drug product quality attributes; this will\n                  depend on the nature and role of material; and\n              v. observed organisational, procedural or technical/process changes at\n                 the material manufacturer."
            role: normative
            normativity: must
            tags: []
            refs:
              internal: []
              external: []
            source_spans:
            - source_label: PIC/S
              locator: line:1168
