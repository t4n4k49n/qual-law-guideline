        - nid: ann2a.chaa.sec2.p2_3
          kind: paragraph
          kind_raw: '2.3'
          num: '2.3'
          ord: 30
          heading: null
          text: 'Every person entering the manufacturing areas should wear clean protective garments appropriate to the operations to be carried out.


            Where required to minimise the opportunity for cross-contamination, restrictions on the movement of all personnel (including QC, maintenance and cleaning personnel) should be controlled based on QRM principles.


            Annex 2A Manufacture of advanced therapy medicinal products for human use


            In general, personnel should not pass from areas of exposure to live micro-organisms, genetically modified organisms, toxins or animals to areas where other products, inactivated products or different organisms are handled. If such route is unavoidable, a Contamination Control Strategy (CCS) based on QRM principles should be applied (refer to Section 3.4 CCS). (Replaces PIC/S GMP Guide Part I Section 2.18)'
