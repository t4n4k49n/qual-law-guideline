    - nid: ann2a.sec2
      kind: section
      kind_raw: APPLICATION OF THIS ANNEX
      num: null
      ord: 5
      heading: null
      text: 'This annex, along with several other annexes of the Guide to GMP, provides guidance, which supplements that in Part I: Basic Requirements for Medicinal Products and in Part II: Basic Requirements for active pharmaceutical ingredients of the PIC/S GMP Guide. This annex is not a stand-alone document and should be applied in conjunction with PIC/S GMP guidelines and annexes. It has


        Annex 2A Manufacture of advanced therapy medicinal products for human use


        however been written in a manner that it could enable development of a standalone guide if integrated with PIC/S GMP Part I, Part II, and related annexes.


        Where due to the nature of the product or technical necessities, specific guidance is provided in this annex, compliance with this annex is expected and takes precedence over other sections in the PIC/S GMP Guide unless there are good reasons for not doing so with documented sound scientific rationale applied using QRM principles.


