      heading: null
      text: •運搬する場合には容器に封入すること。•容器は、次の基準に適合するものであること。○容易、かつ安全に取り扱えること。○運搬中の温度・内圧の変化、振動等により、破損等が生じる恐れがないこと。○みだりに開封されないように容易に破れないシール等が貼り付けられていること。（事業所内の運搬には適用しない。）○内容物の漏洩のおそれのない十分な強度・耐水性があること。○感染性物質危険物表示（バイオハザードマーク）が付されていること。（事業所内の運搬には適用しない。）•容器の車両等への積付けは、運搬中の移動、転倒、転落等により安全性が損なわれないように行うこと。•この他厚生労働大臣が定める基準に適合すること。→告示第２０９号。
