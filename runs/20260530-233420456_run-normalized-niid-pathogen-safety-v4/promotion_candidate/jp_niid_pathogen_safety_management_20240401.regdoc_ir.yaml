  - nid: ann1_1
    kind: annex
    kind_raw: 付表1
    num: 付表1-1
    ord: 161
    heading: 病原体等のリスク群による分類
    text: 本表においては、検定・検査・研究活動を行う実験室における通常の取扱量及び取扱方法を考慮し、ヒトへのリスクを基準として、病原体等を４つのリスク群に分類した。家畜、環境、大量生産、バイオテロリズム対策など、それ以外の条件下における病原体等のリスク群分類としては利用できない。「病原体等取扱者」及び「関連者」（病原体等取扱者と感染の可能性がある接触が直接あるいは間接的に起こりうるその他の人々。）の健康への影響に基づき、WHOの「実験室バイオセーフティ指針第３版（２００４年）」の考え方をもとにして分類されている。リスク群１（「病原体等取扱者」及び「関連者」に対するリスクがないか低リスク）ヒトあるいは動物に疾病を起こす見込みのないもの。リスク群２（「病原体等取扱者」に対する中等度リスク、「関連者」に対する低リスク）ヒトあるいは動物に感染すると疾病を起こし得るが、病原体等取扱者や関連者に対し、重大な健康被害を起こす見込みのないもの。また、実験室内の曝露が重篤な感染を時に起こすこともあるが、有効な治療法、予防法があり、関連者への伝幡のリスクが低いもの。リスク群３（「病原体等取扱者」に対する高リスク、「関連者」に対する低リスク）ヒトあるいは動物に感染すると重篤な疾病を起こすが、通常、感染者から関連者への伝幡の可能性が低いもの。有効な治療法、予防法があるもの。リスク群４（「病原体等取扱者」及び「関連者」に対する高リスク）ヒトあるいは動物に感染すると重篤な疾病を起こし、感染者から関連者への伝幡が直接または間接に起こり得るもの。通常、有効な治療法、予防法がないもの。
    role: structural
    normativity: null
