      ord: 21
      heading: null
      text: 「病原体等安全管理区域運営規則」（以下「運営規則」という。）とは、前条の管理区域の安全性を確保するため、本安全管理規程及び運営規則作成基準（別表６）に基づき、立入りの制限、病原体等の保管、使用、運搬及び滅菌、記帳の義務、関連情報等について、所長が別に定める規則で、ＢＳＬ２とＢＳＬ３実験室運営規則及びＢＳＬ４実験室を含む高度封じ込め施設運営規則及びポリオウイルス取扱施設運営規則をいう。
      role: normative
      normativity: must
      tags: []
