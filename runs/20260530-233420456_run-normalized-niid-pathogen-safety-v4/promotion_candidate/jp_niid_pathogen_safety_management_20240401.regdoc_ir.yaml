      text: 国立感染症研究所病原体等安全管理規程（以下「安全管理規程」という。）は、国立感染症研究所（以下「感染研」という。）において取り扱う病原体等の安全管理について定め、感染研における病原体等に起因して発生する曝露、及び「感染症の予防及び感染症の患者に対する医療に関する法律」（以下「感染症法」という。）に基づく事故の未然防止を図ることを目的とする。
      role: normative
      normativity: must
      tags: []
