    - nid: cha2.p5
      kind: paragraph
      kind_raw: 第５条
      num: '5'
      ord: 20
      heading: null
      text: 「病原体等安全管理区域」（以下「管理区域」という。）とは、実験室、病原体等集中保管室及びその他病原体等の安全管理に必要な区域をいう。また特定病原体等を取り扱う実験室等を特定病原体等管理区域という。なお、管理区域には、ＢＳＬ２、ＢＳＬ３及びＢＳＬ４実験室の監視に関わる部屋、空調及び排水等に関わる設備を有する部屋、病原体を保管又は滅菌する部屋等が含まれる。管理区域は各運営規則に定める。
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
