    - nid: cha2.p4
      kind: paragraph
      kind_raw: 第４条
      num: '4'
      ord: 19
      heading: null
      text: 安全管理研究センター長は、特定病原体等の「病原体等取扱主任者」として、立入り検査等への立会い、職員等への教育・訓練等、その職務を遂行し、特定一種病原体等及び二種病原体等の取扱施設に立ち入る者に対し、感染症法に基づく命令又は感染症発生予防規程の実施を確保する指示を行う。
      role: normative
      normativity: must
      tags: []
