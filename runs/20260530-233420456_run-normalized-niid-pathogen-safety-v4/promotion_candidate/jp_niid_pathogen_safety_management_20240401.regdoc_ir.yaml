    - nid: cha2.p3
      kind: paragraph
      kind_raw: 第３条
      num: '3'
      ord: 18
      heading: null
      text: 国立感染症研究所長（以下「所長」という。）は、「特定病原体等所持者」として、感染症法に基づき、病原体等の所持にかかわる「許可申請」及び「届出」等を行い、「感染症発生予防規程」を届出し、「病原体等取扱主任者」を選任する。また、「教育・訓練」「記帳」及び「滅菌譲渡義務者」として「滅菌等」を実施し、病原体等の「保管」「使用」「運搬」「滅菌」等にあっては厚生労働省令に定める「施設の基準」（別表４）に準拠して施設を維持し、又は「保管等の基準」（別表５）に準拠して必要な措置を行う。さらに、事故発生時（盗取、所在不明等）にあっては「事故届」を行い、災害時にあっては「応急措置」を行う。
      role: normative
      normativity: must
      tags: []
      refs:
        internal: []
        external: []
      source_spans:
      - source_label: NIID pathogen safety management regulation
        locator: line:221
