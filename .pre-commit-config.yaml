repos:
  - repo: local
    hooks:
      - id: require-dot-venv-python
        name: require .venv python runtime
        entry: python scripts/check_venv_runtime.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: enforce-venv-command-policy
        name: enforce .venv command policy in key docs/workflow
        entry: python scripts/check_venv_command_policy.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: forbid-hidden-and-control-chars
        name: forbid hidden/bidirectional and disallowed control chars
        entry: python scripts/check_bidi_controls.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: forbid-pr-body-inline-and-powershell-dq-herestring
        name: forbid gh pr --body and PowerShell double-quote here-string
        entry: python scripts/check_pr_body_escape_policy.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: block-parent-local-notes-boundary
        name: block parent repo commits/pushes for local_notes-managed paths
        entry: python scripts/check_parent_local_notes_boundary.py
        language: system
        pass_filenames: true
        stages: [pre-commit, pre-push]
      - id: block-parent-root-notes-files
        name: block parent repo root TODO/KNOWLEDGE files
        entry: python scripts/check_parent_root_notes_absent.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: enforce-pr-body-content-policy
        name: enforce PR body content policy on PR body files
        entry: python scripts/check_pr_body_content.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
